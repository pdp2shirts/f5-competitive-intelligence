"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Introduces Frontier AI Critical Defense Program", "summary": "Palo Alto Networks launched a cross-industry Frontier AI Critical Defense Program with IBM/Red Hat, Microsoft, Siemens, Anthropic, OpenAI, Idaho National Laboratory, Health-ISAC and the Linux Foundation, using AI-discovered vulnerabilities and network-level virtual patches to protect critical infrastructure. It builds on 14,000+ open-source flaws found via frontier AI. Product marketing should sharpen messaging on network-level virtual patching and OT/healthcare coverage, cloud alliances should note the ecosystem land-grab around AI-driven vulnerability defense, and services teams should expect customer questions on mitigating flaws ahead of vendor patches.", "type": "Partnership", "date": "2026-08-19", "source_url": "https://www.paloaltonetworks.com/company/press/2026/palo-alto-networks-introduces-frontier-ai-critical-defense-program"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Palo Alto Networks and Zero Networks Expand Integration with AI Agent Governance", "summary": "Palo Alto Networks and Zero Networks expanded their integration to add automated threat containment, deeper east-west traffic inspection, and AI agent controls. Selected AI traffic can be steered to Prisma AIRS for prompt, response and data-flow inspection, with enforcement data surfaced in Strata Cloud Manager via dynamic tagging. Sellers should expect Prisma AIRS in agentic-AI security deals; product marketing should contrast F5 AI Guardrails and AI gateway inspection against this microsegmentation-plus-AIRS pairing, and product teams should note demand for identity-aware AI agent policy enforcement.", "type": "Partnership", "date": "2026-08-19", "source_url": "https://www.channelinsider.com/security/tools-and-platforms/palo-alto-zero-networks-security-integration/"}]}, "Fortinet": {"category": "Platforms", "announcements": []}, "Fortinet ~AI": {"category": "AI Security", "announcements": [{"title": "Fortinet Acquires Virtue AI to Extend Continuous AI Protection from Development to Runtime", "summary": "Fortinet acquired Virtue AI to extend its AI security portfolio across the full AI lifecycle, pairing FortiAIGate LLM protection with Virtue AI's Guardian Agent and automated AI validation and red teaming. Terms were undisclosed and deemed immaterial. This is direct consolidation pressure on F5 AI Guardrails and AI Red Team. Product marketing should refresh competitive battlecards, sellers should expect Fortinet to bundle AI security into Security Fabric renewals, and cloud alliances should reinforce F5's inference-delivery plus guardrails story with NVIDIA and hyperscaler partners.", "type": "Acquisition", "date": "2026-08-19", "source_url": "https://www.itpro.com/business/acquisition/fortinet-eyes-ai-security-gains-with-virtue-ai-acquisition"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Publishes August 19 Advisory Bundle Including Two Critical 10.0 CVSS Flaws", "summary": "Cisco published its scheduled security advisory bundle covering BroadWorks, Crosswork, Secure Workload, Industrial Ethernet 1000 switches, RoomOS, Contact Center, and Unified Intelligence Center. Two advisories, Crosswork and Secure Workload, carry a maximum 10.0 CVSS score, alongside a high-severity BroadWorks XXE flaw. Professional services and operations teams should anticipate customer patch cycles and upgrade windows; sellers and product marketing can use the recurring critical-severity cadence in Cisco infrastructure as a proof point for F5's platform hardening and consolidated policy enforcement messaging.", "type": "Security Advisory", "date": "2026-08-19", "source_url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-notice-LDquvx5d"}, {"title": "Cisco Launches Antares AI Models to Detect Software Vulnerabilities", "summary": "Cisco introduced Antares, a set of AI models built to automatically detect software vulnerabilities across codebases, extending its Foundation AI security work. The launch signals Cisco pushing AI-assisted security engineering deeper into its platform story. Product marketing should track how AI-driven vulnerability discovery reshapes competitive narratives around proactive defense, product teams should weigh similar capabilities for F5 code and config assurance, and sellers should prepare for customer questions on protecting apps when flaws are discovered faster than they can be patched.", "type": "Product Launch", "date": "2026-08-19", "source_url": "https://gecnewswire.com/cisco-launches-antares-ai-models-to-detect-software-vulnerabilities/"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Forrester Names Cisco a Leader in Data Center Network Solutions Wave, Q3 2026", "summary": "Cisco was named a Leader in the Forrester Wave for Data Center Network Solutions, Q3 2026, scoring highest in 16 criteria and topping the Strategy category across 11 evaluated vendors. Forrester credited Cisco Cloud Control, the Nexus One architecture, Nexus switches and Nexus Dashboard for unifying management, automation and intelligence for AI and agentic workloads. Product marketing should reinforce where F5 AI data delivery sits above the fabric layer, and cloud alliances should emphasize F5's complementary role in NVIDIA and hyperscaler AI infrastructure buildouts.", "type": "Research", "date": "2026-08-19", "source_url": "https://blogs.cisco.com/datacenter/cisco-recognized-as-leader-in-the-2026-forrester-wave-data-center-network-solutions"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Hosts \u201cWeaponized Trust\u201d Briefing on the 2026 Threat Hunting Report", "summary": "CrowdStrike ran the Americas briefing for its 2026 Threat Hunting Report, with OverWatch findings on adversaries targeting AI infrastructure for LLMjacking and compute theft, exploiting vulnerabilities within hours of PoC disclosure, compromising developer workflows and abusing trusted cloud access. Product marketing can reuse these threat statistics as third-party proof points for F5 AI gateway, AI guardrails and app security narratives; sellers gain talk tracks on AI infrastructure abuse, and product teams should note the shortening exploit window as input to virtual patching priorities.", "type": "Research", "date": "2026-08-19", "source_url": "https://www.crowdstrike.com/en-us/resources/crowdcasts/threat-hunting-report/"}]}, "Zscaler": {"category": "Platforms", "announcements": []}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Research: Education Remains the World's Most Attacked Sector", "summary": "Check Point Research reports education organizations averaged 4,696 weekly cyberattacks per organization from January through July 2026, up 8% year over year and more than double the 2,150 cross-industry average. Check Point is using the back-to-school moment to own the education vertical narrative. F5 marketing and product marketing should counter with an education-sector proof point set, and sellers can open EDU accounts on the availability of enrollment portals, LMS platforms and API-heavy student systems during peak season.", "type": "Research", "date": "2026-08-19", "source_url": "https://blog.checkpoint.com/research/back-to-school-cyber-risks-surge-as-education-remains-the-worlds-most-attacked-sector/"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point Researchers Detail Exploitation of Major AI Agent Frameworks", "summary": "Check Point researchers Barden Porat and Shahar Tal discussed Black Hat USA findings of 21 security issues and 12 CVEs across major AI agent frameworks including LangChain, LangGraph, CrewAI, AutoGen, Microsoft Agent Framework and Google ADK. Flaws span misconfigurations, serialization problems and tool-abuse paths. This validates F5's agentic AI security narrative: product marketing can cite framework-level CVEs as proof that runtime guardrails are needed, and professional services should expect customer requests to inventory and harden agent framework deployments.", "type": "Research", "date": "2026-08-19", "source_url": "https://nexusconnect.io/podcasts/nexus-podcast-check-points-shahar-tal-on-exploiting-ai-agent-frameworks"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Revisits Remote Spectre Attacks on Workers, Details Isolation Defenses", "summary": "Cloudflare published updated research on remote Spectre attacks against Workers, describing a production proof-of-concept that leaked a JWT from a co-located Worker at roughly 12 bits per second, about 360x faster than earlier work. Cloudflare says it mitigated the issue via enhanced Dynamic Process Isolation, V8 Sandbox pointer restrictions and MPK-based in-process isolation, with no signs of exploitation. Sellers and product marketing can raise multi-tenant isolation as a discovery question for customers running sensitive workloads on shared edge compute.", "type": "Research", "date": "2026-08-19", "source_url": "https://blog.cloudflare.com/revisiting-spectre-attacks-on-workers/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Lambda MicroVMs Expands to Five Additional AWS Regions", "summary": "AWS extended Lambda MicroVMs to Mumbai, Singapore, Sydney, Frankfurt and Stockholm, doubling coverage to ten regions. MicroVMs give each user or job a dedicated VM-isolated environment with near-instant launch and resume, stateful execution and its own HTTPS URL supporting HTTP/2, gRPC and WebSockets, targeted at agentic and AI workloads. Product and product marketing teams should track this as serverless isolation moving into agent hosting; cloud alliances can position F5 traffic management and security in front of MicroVM-backed endpoints in these regions.", "type": "Product Launch", "date": "2026-08-19", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/08/lambda-microvms-5-additional-regions/"}, {"title": "AWS Adds a Fourth Availability Zone in the Europe (London) Region", "summary": "AWS launched Availability Zone eu-west-2d in the Europe (London) Region, adding capacity and fault isolation and enabling more AI/ML workloads on next-generation instances including Trn3 and P6. Customers can now distribute applications across four London AZs at standard regional pricing. Cloud alliances and professional services should flag this to UK customers planning multi-AZ resilience or AI training and inference expansion, since new AZ capacity typically triggers re-architecture work where F5 load balancing and failover designs are decided.", "type": "Product Launch", "date": "2026-08-19", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-new-availability-zone-europe/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Amazon Bedrock Adds Grok 4.6 with Cross-Region Inference Routing", "summary": "Amazon Bedrock now serves SpaceXAI Grok 4.6 with Cross-Region Inference, offering a US Geo profile that keeps processing inside the United States for data residency and a Global profile that routes across commercial regions for higher throughput and lower per-token cost during demand spikes. It runs on the bedrock-runtime endpoint with Responses, Chat Completions and Converse APIs. This is AWS doing AI traffic routing at the model layer, directly adjacent to F5's AI Data Delivery story on inference routing, residency and cost control.", "type": "Product Launch", "date": "2026-08-19", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-bedrock-grok-4-6/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": [{"title": "DOE Nuclear AI Program Prometheus Adds HiddenLayer as Security Partner", "summary": "Trade coverage confirmed HiddenLayer's addition to the U.S. Department of Energy's $60M Prometheus initiative under the Genesis Mission, led by Idaho National Laboratory with ORNL, Argonne and Sandia. HiddenLayer will test AI model behavior, data provenance and runtime activity for AI-enabled nuclear design, licensing and operations. This gives a pure-play AI security rival a federal critical-infrastructure reference F5 lacks. Product marketing should sharpen AI Guardrails and AI Red Team proof points for regulated and government buyers, and cloud alliances should explore national-lab and OT-adjacent partner motions.", "type": "Partnership", "date": "2026-08-19", "source_url": "https://environmentenergyleader.com/stories/doe-nuclear-ai-program-prometheus-adds-security-partner,137466"}]}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Akamai Achieves End-to-End Post-Quantum Cryptography Across Enhanced TLS Network", "summary": "Akamai declared end-to-end post-quantum cryptography generally available across its Enhanced TLS delivery network, covering client-to-edge, edge-to-edge and edge-to-origin transport using hybrid X25519MLKEM768 key agreement aligned to NIST and IETF standards. Akamai cited 450 million PQC connections in the first two minutes and a financial customer at 99.4% quantum resistance. Product marketing should refresh PQC proof points, sellers should expect quantum-readiness questions in finance and government deals, and professional services should prepare TLS migration guidance for BIG-IP and Distributed Cloud customers.", "type": "Product Launch", "date": "2026-08-19", "source_url": "https://www.akamai.com/blog/security/future-proofing-internet-akamai-achieves-end-to-end-pqc"}]}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Akamai Threat Research Leader Details 100+ Researcher Team and AI-Native Attack Focus", "summary": "In an interview published August 19, Akamai Senior Director of Threat Research Maxim Zavodchik described a 100-plus researcher organization split into specialist teams, naming AI-native attack techniques and autonomous agents as its next major research target. This is a credibility and thought-leadership play product marketing should track when positioning F5 Labs, and it gives competitive intelligence a clear signal on where Akamai will aim its future application and API security detections.", "type": "Company News", "date": "2026-08-19", "source_url": "https://www.calcalistech.com/ctechnews/article/th2eqq42m"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": []}, "Fastly ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Fastly Research: AI-First Businesses Take 80 Extra Days to Recover From Incidents", "summary": "Fastly Deputy CISO Fernando Medrano shared data showing AI-first companies in Southeast Asia need roughly 80 more days than peers to recover from security incidents, a 135% gap, driven by AI endpoints inflating bandwidth, origin load and automated scraping traffic. Fastly frames rising AI edge costs as the next cloud cost shock. Product marketing can counter-position F5 AI traffic observability and cost control, while sellers and cloud alliances can use the data to open AI delivery and resilience conversations in APAC.", "type": "Research", "date": "2026-08-19", "source_url": "https://www.itnews.asia/news/ais-hidden-resilience-tax-fast-adoption-could-lead-to-a-slow-recovery-628276"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "NetScaler Discloses Critical Authentication Bypass CVE-2026-19490 and DoS Flaw", "summary": "Cloud Software Group published an August 19 bulletin for NetScaler ADC and Gateway covering CVE-2026-19490, a CVSS 9.3 remote unauthenticated authentication bypass tied to SAML and Gateway/AAA vserver configurations, plus CVE-2026-19489, a CVSS 8.8 SIP ALG memory overflow causing denial of service. Fixed builds are 14.1-73.32+ and 13.1-63.21+ with FIPS equivalents. Sellers should engage NetScaler accounts facing another emergency patch cycle, professional services can scope migration assessments, and product marketing should update ADC reliability proof points.", "type": "Security Advisory", "date": "2026-08-19", "source_url": "https://support.citrix.com/external/article/CTX696939/netscaler-adc-and-netscaler-gateway-secu.html"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Security Advisory 0146: HTTP/2 Rapid Reset Rate-Limit Bypass in EOS", "summary": "Arista disclosed a vulnerability in EOS-based products and Wi-Fi access points where unthrottled HTTP/2 stream resets let an unauthenticated remote attacker bypass rate limiting, driving high CPU and denial of service. No hotfix exists; remediated EOS images are still rolling out and a full image upgrade is required. Sellers and professional services can use this to open availability and protocol-hardening conversations, while product marketing can contrast F5's HTTP/2 DoS handling in BIG-IP and NGINX for AI and data center traffic paths.", "type": "Security Advisory", "date": "2026-08-19", "source_url": "https://www.arista.com/en/support/advisories-notices/security-advisory/24500-security-advisory-0146"}, {"title": "Arista Discontinues DCA-AGNI-100 Appliance, Pushes Customers to AGNI-200", "summary": "Arista ended sales of its DCA-AGNI-100 CloudVision AGNI appliance, citing supply chain constraints and end-of-life Dell R450 components, and is steering customers to the DCA-AGNI-200 on Dell R470 with Xeon 6 and DDR5. Support tapers through 2029-2031. Professional services and operations should expect refresh and migration cycles at shared accounts; sellers can raise hardware lifecycle risk, and product marketing can highlight F5 software and rSeries flexibility against competitor appliance churn.", "type": "Company News", "date": "2026-08-19", "source_url": "https://www.sdxcentral.com/news/arista-networks-calls-time-on-server-line-due-to-supply-chain-pressures/"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": []}, "Radware": {"category": "Application Security", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Research: Average Web Application Carries 20 Security Vulnerabilities", "summary": "Barracuda released research from hundreds of Application Security Insight scans finding the average web app has roughly 20 vulnerabilities, with seven categories driving about 90% of findings: information disclosure (25%), brand impersonation (24%), client-side exploitation (14%), data exposure (10%), weak encryption, outdated software and weak session handling. Product marketing can counter-position this data in WAF and client-side defense narratives, marketing can reuse the stats in appsec campaigns, and sellers can use it to open posture-assessment conversations.", "type": "Research", "date": "2026-08-19", "source_url": "https://vmblog.com/news/new-research-from-barracuda-shows-the-average-web-application-has-20-security-vulnerabilities-and-most-stem-from-basic-oversights/"}, {"title": "Barracuda Wins Four 2026 CRN Annual Report Card Awards Across Barracuda ONE", "summary": "Barracuda announced four wins in CRN's 2026 Annual Report Card awards, spanning categories tied to its Barracuda ONE platform including Email Protection and Managed XDR, announced during The Channel Company's XChange August 2026 event. The wins reinforce Barracuda's partner-led, MSP-centric go-to-market. F5 channel and marketing teams should note the competitive channel momentum in mid-market and MSP segments, and product marketing can sharpen partner-facing differentiation for F5's application security portfolio.", "type": "Company News", "date": "2026-08-19", "source_url": "https://lifestyle.kotaradio.com/story/381443/barracuda-honored-with-four-wins-in-2026-crn-annual-report-card-awards/"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-08-19.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
