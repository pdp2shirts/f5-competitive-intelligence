"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Cortex XDR Named Only Certified Leader in AV-Comparatives EPR Seven Years Running", "summary": "Palo Alto Networks published results showing Cortex XDR earned AV-Comparatives Certified Leader status for the seventh consecutive year in the 2026 Endpoint Prevention and Response evaluation. The vendor cited 100% attack-chain containment with zero of 50 threats reaching exfiltration, 94% blocked on initial execution, and 100% interception of remaining propagation attempts. The post frames the independent validation as proof of sustained SecOps effectiveness and lower alert fatigue.", "type": "Research Report", "date": "2026-09-16", "source_url": "https://www.paloaltonetworks.com/blog/security-operations/cortex-xdr-is-the-only-endpoint-security-market-leader-to-be-certified-by-av-comparatives-7-years-in-a-row/"}, {"title": "Tenzai Integrates with Palo Alto Networks to Validate Which Exposures Are Truly Exploitable", "summary": "Tenzai announced an integration with Palo Alto Networks that lets joint customers validate which discovered exposures are genuinely exploitable rather than theoretical. The partnership connects offensive validation testing to Palo Alto's security stack so remediation effort concentrates on attack paths adversaries can actually use. It extends Palo Alto's platform ecosystem into exposure management and continuous validation, a growing adjacency to its Cortex and Prisma portfolios.", "type": "Partnership", "date": "2026-09-16", "source_url": "https://www.newswire.com/news/tenzai-integrates-with-palo-alto-networks-to-help-enterprises-validate-22860775"}, {"title": "Palo Alto CEO Nikesh Arora: \u201cI Don't See How AI Is Going to Slow Down\u201d", "summary": "In a CNBC interview, Palo Alto Networks CEO Nikesh Arora argued that AI adoption and the security spending it drives show no signs of decelerating. Arora tied continued AI momentum to the company's platformization strategy and demand for AI-era security controls. The appearance reinforces Palo Alto's public positioning that AI expands, rather than commoditizes, the enterprise security market.", "type": "Executive/Company News", "date": "2026-09-16", "source_url": "https://www.cnbc.com/video/2026/09/16/palo-alto-networks-ceo-nikesh-arora-i-dont-see-how-ai-is-going-to-slow-down.html"}, {"title": "PAN-OS Flaws CVE-2026-0300 and CVE-2026-0257 Confirmed Exploited in the Wild", "summary": "Security researchers reported confirmed in-the-wild exploitation of two PAN-OS authentication-related vulnerabilities, CVE-2026-0300 and CVE-2026-0257. The write-up details the affected authentication paths and urges immediate patching plus restriction of management-interface exposure. Active exploitation of firewall management planes keeps perimeter platform patch hygiene in the spotlight for enterprise security and infrastructure teams.", "type": "Threat Intelligence", "date": "2026-09-16", "source_url": "https://safeguard.sh/resources/blog/palo-alto-pan-os-authentication-cves"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Unveils New Calgary Cybersecurity Innovation Hub", "summary": "Fortinet opened an eight-story, 122,000-square-foot Cybersecurity Innovation Hub in downtown Calgary backed by a USD 30 million investment, supported by the Government of Alberta, Invest Alberta, and Calgary Economic Development. The site houses Western Canada operations, a customer experience centre, a community hub, and a training facility, and supports Fortinet's Canadian cloud point-of-presence strategy. Fortinet also launched an annual Fortinet Award in Computer Science and Engineering with the University of Calgary.", "type": "Executive/Company News", "date": "2026-09-16", "source_url": "https://www.fortinet.com/corporate/about-us/newsroom/press-releases/2026/fortinet-unveils-new-calgary-cybersecurity-innovation-hub"}, {"title": "FortiEndpoint Earns Certified Leader Status in 2026 AV-Comparatives EPR Test", "summary": "Fortinet announced that FortiEndpoint achieved Certified Leader status in the 2026 AV-Comparatives Endpoint Prevention and Response test. The blog positions the independent result as validation of FortiEndpoint's prevention, detection, and response effectiveness and its total-cost-of-ownership advantages as part of the Fortinet Security Fabric. The recognition lands alongside Fortinet's push to consolidate endpoint, data, and AI-usage controls into a single agent and console.", "type": "Research Report", "date": "2026-09-16", "source_url": "https://www.fortinet.com/uk/blog/security-operations/fortiendpoint-earns-certified-leader-status-in-2026-av-comparatives-epr-test"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Discloses Nine ISE Vulnerabilities Including Actively Exploited CVSS 10.0 API Auth Bypasses", "summary": "Cisco PSIRT published advisories disclosing multiple Identity Services Engine vulnerabilities, including critical REST API authentication bypasses and an authenticated SQL injection in the SXP REST API. Several flaws carry CVSS scores up to 10.0 and at least one is reported under active exploitation, with fixed ISE patch releases available and few workarounds. The disclosures were part of Cisco's September 16 advisory bundle covering ISE, Nexus Dashboard, Secure Firewall, and ThousandEyes appliances.", "type": "Threat Intelligence", "date": "2026-09-16", "source_url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ise-mult-vul-ymSsTLCc"}, {"title": "Axis Communications Devices Join the Cisco Meraki Dashboard via Axis Cloud Connect", "summary": "Axis Communications and Cisco announced a collaboration allowing Axis hybrid-cloud devices to be onboarded and monitored inside the Cisco Meraki Dashboard through Axis Cloud Connect. As part of Cisco Cloud Control, the integration lets teams manage cameras alongside Cisco switches and wireless access points in one console. The companies frame it as a blueprint for converging physical security and network operations under a single management plane.", "type": "Partnership", "date": "2026-09-16", "source_url": "https://gecnewswire.com/axis-cameras-join-cisco-meraki-10-years-after-mirai-turned-cameras-into-weapons/"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Named Only Customers' Choice in 2026 Gartner Peer Insights Voice of the Customer for ITDR", "summary": "CrowdStrike announced it was the sole vendor named a Customers' Choice in Gartner Peer Insights' 2026 Voice of the Customer report for Identity Threat Detection and Response. The company cited a 4.6 out of 5 overall rating, the highest share of five-star reviews, the strongest willingness-to-recommend score, and 153 verified reviews as of August 2026. CrowdStrike tied the recognition to its Falcon Next-Gen Identity Security positioning.", "type": "Research Report", "date": "2026-09-16", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-named-the-only-customers-choice-in-the-2026-gartner-peer-insights/"}, {"title": "CrowdStrike Accelerates Real-Time Data Classification with On-Device AI", "summary": "CrowdStrike introduced on-device AI for real-time data classification in Falcon Data Security, built with Intel so language models run locally on dedicated AI hardware starting with Intel's NPU in Core Ultra AI PCs. OpenVINO-supported, NPU-optimized models aim to deliver low-latency, always-on sensitive-data detection without sending content off the endpoint. CrowdStrike called it a first step toward replacing rule-based classification engines with AI-based classification across more workloads.", "type": "Product Launch", "date": "2026-09-16", "source_url": "https://www.crowdstrike.com/en-us/blog/crowdstrike-accelerates-real-time-data-classification-with-on-device-ai/"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "Salt Security Expands CrowdStrike Integrations for Visibility Into AI Agent Activity", "summary": "Salt Security announced expanded integrations with CrowdStrike that give joint customers added visibility and control over AI agent activity across APIs. The integrations correlate API and agent behavior telemetry with CrowdStrike Falcon data so security teams can detect and govern autonomous agent traffic. The move extends CrowdStrike's AI security ecosystem into the API layer where agentic workloads increasingly operate.", "type": "Partnership", "date": "2026-09-16", "source_url": "https://www.prnewswire.com/news-releases/salt-security-announces-expanded-integrations-with-crowdstrike-to-give-joint-customers-added-visibility-and-control-over-ai-agent-activity-302880725.html"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler Expands Vectra AI Partnership to Strengthen Cloud Threat Detection", "summary": "Zscaler expanded its partnership with Vectra AI, integrating Vectra's AI-driven behavioral threat detection into Zscaler Internet Access alongside the existing Zscaler Private Access collaboration. The deeper integration ingests ZIA traffic capture and ZPA log context into Vectra for near real-time threat hunting, strengthening Zscaler's SASE and security-operations story. Coverage noted Zscaler shares rose roughly 5% following the announcement.", "type": "Partnership", "date": "2026-09-16", "source_url": "https://www.techshotsapp.com/business/zscaler-expands-vectra-ai-partnership-to-strengthen-cloud-cybersecurity-stock-surges-5"}]}, "Zscaler ~AI": {"category": "AI Security", "announcements": [{"title": "Zscaler: Countermeasures for AI-Enabled Attacks Start with Deception", "summary": "Zscaler published guidance arguing that AI-enabled attacks, which move at machine speed and adapt faster than signature-based defenses, are best countered with deception technology layered onto a Zero Trust architecture. The post positions decoys and deceptive assets as a way to detect adversaries and autonomous agents that slip past conventional controls, feeding high-fidelity signals into security operations. It reinforces Zscaler's push to extend Zero Trust Exchange coverage to AI-era threats.", "type": "Blog Post", "date": "2026-09-16", "source_url": "https://www.zscaler.com/blogs/product-insights/countermeasures-ai-enabled-attacks-start-deception"}, {"title": "Fortune: AI Agents Are Going Rogue and CIOs Are Racing to Add Guardrails", "summary": "Fortune reported on enterprises treating autonomous AI agents as a new class of insider risk, quoting Zscaler's Sam Curry on how non-deterministic, initiative-taking agents break traditional insider-threat models. The piece notes Zscaler joined Cisco and Workday in the NVIDIA-led Open Secure AI Alliance to develop safeguarded open-source AI tooling. It frames AI guardrails and Zero Trust applied to agent identity and access as the emerging CIO priority.", "type": "Executive/Company News", "date": "2026-09-16", "source_url": "https://fortune.com/2026/09/16/ai-agents-are-going-rogue-cios-are-racing-to-put-guardrails-around-them/"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Critical Check Point Management Server Flaw (CVE-2026-91843) Allows Unauthenticated Root Access", "summary": "A critical pre-authentication vulnerability, CVE-2026-91843, was disclosed in Check Point Security Management Server, Multi-Domain Management, and Log Server products, allowing remote attackers to gain root-level access and read security policies, admin details, and logs. Affected releases span R82.20, R82.10, R82, R81.20 and several unsupported branches; Smart-1 Cloud is already patched. Check Point issued a LivePatch fix and advised urgent patching plus restricting SmartConsole Trusted Clients.", "type": "Threat Intelligence", "date": "2026-09-16", "source_url": "https://insights.integrity360.com/threat-advisories/critical-check-point-vpn-remote-code-execution-vulnerability"}]}, "Cloudflare": {"category": "Platforms", "announcements": []}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare Client-Side Security Catches Four Live Malicious JavaScript Campaigns", "summary": "Cloudflare detailed how its Client-Side Security offering with Page Shield ML caught four live malicious JavaScript campaigns, eight payloads, targeting e-commerce storefronts, including affiliate-commission hijacking, clickless theft via off-screen iframes, a search-saboteur backdoor, and a paid-mobile cloaker. Most payloads were absent from VirusTotal and unanalyzed by URLScan, yet all were flagged in production traffic. Cloudflare argues continuous in-browser visibility into script behavior is required to catch multi-stage attacks.", "type": "Blog Post", "date": "2026-09-16", "source_url": "https://blog.cloudflare.com/client-side-security-finds-4-malicious-campaigns/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Reimagines the Getting Started Experience for New Builders", "summary": "AWS launched a simplified onboarding experience aimed at AI-ready builders, replacing lengthy upfront configuration with sensible defaults. New customers can sign in with existing Google, GitHub, or Apple identities, start without a credit card, receive $100 in Free Tier credits, invite collaborators by email without learning IAM, and set a hard spend limit after credits run out. Advanced AWS capabilities can be enabled later without migration, rolling out gradually to new accounts.", "type": "Product Launch", "date": "2026-09-16", "source_url": "https://aws.amazon.com/blogs/aws/aws-reimagines-the-getting-started-experience/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Anthropic Brings Claude Fable 5.1 to AWS for Complex Enterprise Workflows", "summary": "Anthropic made Claude Fable 5.1 available to enterprise customers on AWS infrastructure, extending the long-running AWS-Anthropic collaboration. The model is positioned for complex, long-horizon workloads including multi-hour software development tasks, scientific research, and automated enterprise processes. The move deepens AWS's role as the delivery and serving layer for frontier models running sustained agentic workloads.", "type": "Partnership", "date": "2026-09-16", "source_url": "https://ciscos.biz/anthropic-unveils-claude-fable-5-1-on-amazon-web-services-to-deliver-frontier-intelligence-for-complex-enterprise-workflows/"}]}, "AWS ~AI": {"category": "AI Security", "announcements": [{"title": "SentinelOne Expands AWS Integration for Unified AI Governance on Amazon Bedrock", "summary": "SentinelOne expanded its AWS integration to deliver unified AI governance for Amazon Bedrock customers, pairing its AI runtime security with Bedrock AgentCore. The combined offering covers AI usage governance, policy enforcement, threat detection with root-cause analysis, and automated remediation across AWS and multi-cloud environments, unifying Prompt Security, Singularity Cloud Security, and Singularity AI SIEM. Full unified AI governance is targeted for AWS re:Invent 2026.", "type": "Partnership", "date": "2026-09-16", "source_url": "https://www.open-electronics.org/sentinelone-aws-ai-governance-amazon-bedrock/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": [{"title": "HiddenLayer CEO on Runtime AI Security, Agentic Intent and a $100M Series B", "summary": "The Stack profiled HiddenLayer in its \u201cOne To Watch\u201d series, with CEO Chris \u201cTito\u201d Sestito detailing how the Austin firm defends enterprise AI models, agents, and applications against AI-powered attacks. Sestito identified runtime security of AI tools as the company's biggest technical hurdle, alongside learning from customer data without compromising privacy or government data-handling obligations. The piece highlighted HiddenLayer's recently closed $100 million Series B led by Delta-v Capital, its largest round to date.", "type": "Executive/Company News", "date": "2026-09-16", "source_url": "https://www.thestack.technology/one-to-watch-hiddenlayer/"}]}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Akamai ~AI": {"category": "AI Security", "announcements": [{"title": "Akamai Lays Out Three Pillars of Securing AI Agents in Production", "summary": "Akamai's developer blog argues that sandboxes and guardrails alone are not a complete AI agent security strategy, and proposes a defense-in-depth model: secure against AI with edge-to-core protections including DNS, AI firewalls, micro-segmentation and deception; secure the AI itself with gateways and a hardened control plane around the agent harness; and secure with AI covering people, processes, shadow AI and governance. The post includes an interview with Akamai's Bogdan Carstea.", "type": "Blog Post", "date": "2026-09-16", "source_url": "https://developers.akamai.com/blog/three-pillars-of-securing-ai-agents-in-production"}]}, "Akamai ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Akamai CTO Details AI Grid Distributed Inference Across 4,000+ Edge Locations", "summary": "In a TFiR interview, Akamai CTO Dr. Robert Blumofe details how AI Grid orchestrates distributed inference across roughly 4,000 or more edge locations by matching each workload to the optimal mix of GPU, CPU, storage, and connectivity. His argument is that there is no one-size-fits-all AI infrastructure: the right compute, in the right place, close to the needed tools and data. Akamai positions workload-specific placement against centralizing all inference in a single region.", "type": "Blog Post", "date": "2026-09-16", "source_url": "https://tfir.io/akamai-ai-grid-distributed-inference-robert-blumofe/"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Fastly and Waterloo Kernel Patch Could Cut Data Center Energy Use by Up to 30%", "summary": "Coverage of a University of Waterloo and Fastly collaboration shows that a roughly 30-line, non-intrusive Linux kernel patch reorganizing packet processing in the networking stack can materially cut data center energy use, with theoretical global savings up to 30 percent. The work, led by Waterloo's Martin Karsten with Fastly engineer Joe Damato, was validated in Fastly production traffic and merged into Linux kernel 6.13, giving Fastly a delivery-efficiency and sustainability proof point.", "type": "Research Report", "date": "2026-09-16", "source_url": "https://skyportsystems.net/a-simple-line-of-code-could-cut-global-data-center-energy-consumption-by-30-percent/"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "239,093 NetScaler Deployments Exposed in Post-CVE-2026-19490 Scan Analysis", "summary": "An independent exposure analysis fingerprints approximately 239,093 publicly reachable Citrix NetScaler ADC and Gateway deployments via ZoomEye, including 72,514 in the United States, in the wake of CVE-2026-19490. The critical SAML authentication bypass (CVSS 9.8) enables session forgery at the authentication gateway, meaning a bypass could grant broad access without endpoint compromise. The author cautions the count reflects reachable, not confirmed-vulnerable, appliances since external scans cannot verify patch level.", "type": "Threat Intelligence", "date": "2026-09-16", "source_url": "https://dev.to/kozhevniko/239093-netscaler-deployments-in-view-measuring-the-citrix-edge-after-cve-2026-19490-5f1a"}]}, "Citrix (NetScaler) ~P": {"category": "Platforms", "announcements": [{"title": "Citrix Adds AI-Powered Browser Activity Analysis with Citrix Session Insights", "summary": "Citrix released Citrix Session Insights for SecurAccess with Chrome Enterprise, an AI-powered capability that analyzes browser activity generated by both human users and autonomous agents. It combines browser visibility, analysis, and policy recommendations into a single workflow so security teams can investigate incidents faster, strengthen governance, and manage AI-assisted activity at scale. The launch extends Citrix's platform story beyond NetScaler traffic management into agentic AI visibility and secure access governance.", "type": "Product Launch", "date": "2026-09-16", "source_url": "https://www.helpnetsecurity.com/2026/09/16/citrix-session-insights-capability/"}, {"title": "Citrix Introduces SecurSpaces Flex Managed Containerized Linux Workspaces", "summary": "Citrix announced Citrix SecurSpaces Flex, a fully Citrix-managed service inside Citrix Platform Flex that delivers turnkey containerized Linux workspaces hosted on Microsoft Azure. Customers get scalable developer workspaces without managing the underlying infrastructure, while data, identity, and security controls remain under customer governance. The move deepens Citrix's platform consolidation strategy, bundling managed hosting with its access and delivery portfolio rather than selling discrete infrastructure components.", "type": "Product Launch", "date": "2026-09-16", "source_url": "https://www.altanora.com/blog/modernizing-the-developer-experience-introducing-citrix-securspaces-flex"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Discloses CVSS 10.0 P4Runtime Code-Execution Flaw in EOS (CVE-2026-73453)", "summary": "Arista disclosed CVE-2026-73453, a critical flaw letting an unauthenticated P4Runtime client execute arbitrary code and take full administrative control of an EOS switch when P4Runtime is enabled, which is off by default. CVSSv3.1 scores 10.0 and CVSSv4.0 9.5, with fixes in EOS 4.36.2F, 4.35.6M and 4.34.8M or later, plus mTLS and gNSI Authz mitigations. Arista reports no known exploitation.", "type": "Threat Intelligence", "date": "2026-09-16", "source_url": "https://cve.report/CVE-2026-73453"}, {"title": "Arista Named Zacks Bull of the Day on AI Networking Momentum", "summary": "Zacks spotlighted Arista as a leading AI networking infrastructure play, citing its first $3 billion quarter, a 15% Q2 earnings beat, a raised outlook and the Arista 2.0 platform strategy. Analysts project roughly 39% revenue growth in FY26 with AI revenue reaching at least $3.6 billion, driven by Microsoft, Meta and multiple AI fabric customers across scale-up and scale-out deployments. The datapoints quantify how fast budget is shifting toward AI data center fabric.", "type": "Executive/Company News", "date": "2026-09-16", "source_url": "https://finance.yahoo.com/technology/ai/articles/bull-day-arista-networks-inc-080000201.html"}]}, "Arista Networks ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Arista VeloCloud Orchestrator Hit by CVSS 10.0 SD-WAN Control Plane Flaw (CVE-2026-16812)", "summary": "Security researchers detailed CVE-2026-16812, a maximum-severity vulnerability in the SD-WAN control plane of Arista's VeloCloud Orchestrator. Because the orchestrator programs policy across distributed branch and edge sites, a control-plane compromise carries outsized blast radius for application delivery paths. The disclosure gives F5 teams a concrete talking point on the risk of consolidating traffic policy into a single SD-WAN controller.", "type": "Threat Intelligence", "date": "2026-09-16", "source_url": "https://safeguard.sh/resources/blog/arista-velocloud-orchestrator-cve-2026-16812"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "HPE Raises 2027 Networking Targets as AI Demand Outruns Supply", "summary": "HPE reported networking orders up 36% year over year and cloud/AI orders up about 75%, with Q3 networking revenue up 10% at a 22% operating margin. It raised its 2027 outlook to 14-17% networking revenue growth and mid-to-high-20s operating margins, crediting Juniper integration and progress toward $600 million in synergies. HPE also cited a new multiyear, gigawatt-scale Oracle agreement spanning routing, switching, software, AIOps and financing, plus liquid cooling enabling faster Juniper QFX rollouts.", "type": "Executive/Company News", "date": "2026-09-16", "source_url": "https://transcriptdaily.com/2026/09/16/hewlett-packard-enterprise-sees-ai-networking-demand-outrun-supply-as-2027-targets-rise.html"}]}, "Radware": {"category": "Application Security", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Research: Phishing Pages Generated Inside the Victim's Browser Evade Detection", "summary": "Barracuda threat research describes a phishing technique that renders pages in memory via blob URLs inside the victim's browser, leaving no hosted phishing URL for blocklists to catch. The chain uses DocuSign-themed lures and legitimate Microsoft OAuth and Teams redirects to an external resource, with service workers, sandboxed iframes and hidden command-and-control indicating a centrally managed platform. Barracuda advises inspecting blob URL activity, OAuth redirect destinations and the full email click path.", "type": "Threat Intelligence", "date": "2026-09-16", "source_url": "https://cisoforum.in/email-attacks-evade-detection-by-generating-phishing-pages-directly-inside-the-victims-browser/"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "Imperva/Thales \u201c40% Problem\u201d Analysis on API Discovery vs. Data Protection", "summary": "This analysis of Imperva (Thales) API data argues roughly 40% of live API endpoints carry multiple stacked authentication risks, with nearly half of detections exposing sensitive data inside tokens through weak signing, long token lifetimes, basic auth and access persisting after expiry. It positions Imperva API Security for continuous discovery, OWASP API Top 10 risk assessment and runtime protection alongside gateways including Kong, Mulesoft, Azure API Management, Apigee and F5, layered with CipherTrust data protection.", "type": "Blog Post", "date": "2026-09-16", "source_url": "https://www.cybergensecurity.com/the-40-problem-how-the-thales-stack-closes-the-gap-between-api-discovery-and-data-protection"}]}};

    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
