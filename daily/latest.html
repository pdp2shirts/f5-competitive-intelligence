var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Introduces Sovereign Prisma SASE for Regulated Enterprises", "summary": "Palo Alto Networks introduced Sovereign Prisma SASE, a version of Prisma SASE with EU sovereignty controls for regulated organizations. It runs on a backbone spread across several sovereign cloud providers and offers an optional SASE Private Location for sensitive traffic and key custody. Controls include a strict EU data boundary, EU-only admin access, Hold Your Own Key encryption, audit logs with user location data, and EU-based support staff. Anonymized telemetry still feeds Palo Alto Networks' global threat intelligence.", "type": "Product Launch", "date": "2026-11-11", "source_url": "https://www.paloaltonetworks.com/blog/2026/11/the-sase-trilemma-how-regulated-enterprises-are-navigating-digital-sovereignty-resilience-and-global-cyber-threat-intelligence/"}, {"title": "Palo Alto Networks November 2026 Security Advisories Fix 9 Vulnerabilities", "summary": "Palo Alto Networks released fixes for 9 vulnerabilities across 3 products: 7 in PAN-OS, 1 in Checkov by Prisma Cloud and 1 in the GlobalProtect app. The vendor rated none of them critical, and neither the vendor nor CISA lists any as exploited. Customers should install the November updates using the product advisories at security.paloaltonetworks.com.", "type": "Other", "date": "2026-11-11", "source_url": "https://watchtower.prociso.com/palo-alto-networks-november-2026-security-advisories-what-is-fixed"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Patches Nearly 100 Vulnerabilities After Adding Frontier AI to Security Testing", "summary": "Fortinet published 89 security advisories covering nearly 100 vulnerabilities, after adding frontier AI models to its product security testing. About 17 flaws are critical, including code execution and authentication bypass in FortiMail, FortiAuthenticator, FortiOS, FortiManager and FortiAnalyzer, with fixes also for FortiSASE and FortiClient. One FortiClient flaw, called Fortinet2Shell, comes from a CORS misconfiguration. Fortinet says it has seen no active exploitation and warned that AI is shortening the time between disclosure and exploitation.", "type": "Other", "date": "2026-11-11", "source_url": "https://www.securityweek.com/fortinet-patches-nearly-100-vulnerabilities/"}, {"title": "Fortinet FortiOS-Based Products Earn IEC 62443-4-2 SL4 Certification at OT Cybersecurity Summit", "summary": "At its OT Cybersecurity Summit in Seoul, Fortinet announced that its FortiOS-based products earned IEC 62443-4-2 Security Level 4 certification. The products are FortiGate, FortiGate Rugged, FortiWiFi and FortiGate VM. Fortinet also set out five security actions for OT environments, including IT/OT segmentation and secure remote access. It promoted its FortiGuard OT Security Service, which updates industrial-protocol and OT vulnerability signatures in near real time.", "type": "Event", "date": "2026-11-11", "source_url": "https://nqbrief.com/en/tech/fortinet-ot-summit-fortigate-iec-certification/"}]}, "CrowdStrike": {"category": "Platforms", "announcements": []}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zacks: Zscaler's cross-selling strategy targets Data Security revenue growth", "summary": "This is a Zacks analyst article, not a Zscaler announcement. It reviews Zscaler's plan to sell more Data Security modules on its Zero Trust platform to existing customers. Zscaler's October Investor Day reported 34% year-over-year Data Security ARR growth, reaching $410M. It also said fewer than 20% of customers use more than one product, and it estimated over $15B of untapped spend among current customers. Zscaler said 70% of its Security for AI deals in Q4 FY2026 included Data Security. Zacks rates the stock #3 (Hold).", "type": "Other", "date": "2026-11-11", "source_url": "https://finance.yahoo.com/technology/articles/zscalers-cross-selling-strategy-data-160800459.html?.tsrc=rss"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "GitHub now automatically detects leaked Cloudflare Access service tokens", "summary": "GitHub secret scanning now detects Cloudflare Access service tokens leaked in public repositories and reports them to Cloudflare. Cloudflare then disables the affected token and emails account administrators. Coverage applies to the new client-secret format (cfast_ prefix) issued since August 26, 2026; legacy 64-character hex secrets are not covered. A leaked token must have its secret rotated before it is re-enabled, with no grace period for the old secret.", "type": "Product Launch", "date": "2026-11-11", "source_url": "https://developers.cloudflare.com/changelog/post/2026-11-11-leaked-service-token-recovery/"}, {"title": "Cloudflare details Meerkat, a QuePaxa-based consensus service for its global control plane", "summary": "Cloudflare described Meerkat, an experimental distributed consensus service for its global control plane, built on the QuePaxa algorithm. Unlike leader-based approaches such as Raft and Paxos, QuePaxa keeps working through wide-area latency spikes, disconnections and leader failures without stalling. In Cloudflare's global tests, Meerkat kept processing requests when leaders crashed or slowed down. It gives a strongly consistent, KV-style log across replicas worldwide.", "type": "Research", "date": "2026-11-11", "source_url": "https://blog.cloudflare.com/choosing-quepaxa/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Cloud WAN now supports Flow Logs for centralized global traffic visibility", "summary": "AWS Cloud WAN now supports Flow Logs, capturing detailed IP traffic across the core network. Coverage includes VPCs, Regions and on-premises connections over Direct Connect, Site-to-Site VPN and SD-WAN. Logs include IPs, ports, protocol, traffic volume and packet loss, plus Cloud WAN metadata such as segment, Region, hops and attachment details. Flow Logs can be enabled per core network, edge or attachment, giving one consolidated view for troubleshooting, capacity planning, anomaly detection and compliance.", "type": "Product Launch", "date": "2026-11-11", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-cloud-wan-flow-logs/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Fastly Releases Compute JS Static Publish v8 with Object Storage, Named Collections and Preview URLs", "summary": "Fastly released version 8 of Compute JS Static Publish, which serves static sites straight from its edge with no origin. Files can now live in Fastly Object Storage (S3-compatible, in beta) as well as the default KV Store. Named collections such as live, staging and preview let teams publish, preview and promote separate versions without redeploying code. Other additions include faster publishing, compression at publish time, an optional response cache, Server-Timing headers and a larger CLI toolkit with dry runs and automatic purging.", "type": "Product Launch", "date": "2026-11-11", "source_url": "https://www.fastly.com/blog/static-publishing-fastly-compute-whats-new-v8"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": []}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": []}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware: Ubuntu Was Hit Twice in 2026. Is Your DDoS Protection Ready?", "summary": "Radware published an analysis of the October 2026 DDoS attacks on Canonical's ubuntu.com, canonical.com, developer portal and Security API. It was Canonical's second major attack in six months. Radware says even well-built infrastructure is exposed to sustained multi-vector Layer 3/4 and Layer 7 floods. It advises teams to inventory front-door services and test failover. It also promotes its DefensePro hybrid on-prem/cloud scrubbing, behavioral detection with auto-generated signatures, and its Emergency Response Team.", "type": "Research", "date": "2026-11-11", "source_url": "https://www.radware.com/blog/ubuntu-hit-twice-in-2026-ddos/"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Warns Attackers Are Exploiting Patched Email Security Gateway Flaws", "summary": "Barracuda warned that attackers are actively exploiting two recently patched vulnerabilities in its Email Security Gateway. The flaws can give unauthenticated attackers root access to the appliances, and they have been added to CISA's Known Exploited Vulnerabilities catalog. Barracuda customers are being urged to make sure the patches are applied and to check their appliances for signs of compromise.", "type": "Other", "date": "2026-11-11", "source_url": "https://www.isec.news/2026/11/11/barracuda-email-security-gateway-flaws-exploited/"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "Lotte Innovate Signs MOU with Thales to Expand Imperva-Powered AI Security Services in Korea", "summary": "Lotte Innovate signed an MOU with Thales to combine Imperva web application and API protection (WAAP), including web firewalls and API security, with its security operations platform. The goal is stronger detection and response to AI-driven attacks across Lotte Group applications. The partners plan joint security services and co-marketing to win new external customers. Lotte Innovate plans to launch an AI premium security monitoring service in November.", "type": "Partnership", "date": "2026-11-11", "source_url": "https://biz.chosun.com/en/en-it/2026/11/11/4BXMBSKXOJATLFGZ2RGMKIYGZU/"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Palo Alto Networks Warns AI Agents Can Exploit Inherited Logins", "summary": "Palo Alto Networks warned that AI agents can take on human identities and valid credentials, then explore every reachable path and get around traditional access controls. The company said organizations need full visibility into agent tools, connectors, skills and MCP connections to avoid gaps in their defenses. It pointed to its AI-focused acquisitions, including Protect AI, CyberArk, Chronosphere, Koi Security and Portkey, as the basis for an end-to-end security platform.", "type": "Other", "date": "2026-11-11", "source_url": "https://www.businessdesk.co.nz/news/palo-alto-networks-says-ai-agents-can-exploit-inherited-logins/QHHJW7AYKBAQDDTDL4LYCC5MYE/"}]}, "Fortinet ~AI": {"category": "AI Security", "announcements": [{"title": "Fortinet and WEF Outline Containment Framework for AI Agents at Machine Speed", "summary": "Working with the World Economic Forum's Cyber Frontiers initiative, Fortinet published guidance on containing AI agents step by step while keeping humans in control. The approach covers four areas: defining each agent's identity, owner, scope, tools and data access before deployment; automated policies that restrict an agent when it misuses access; an AI-enabled security layer covering tools, credentials, context and memory; and a last-resort kill switch that keeps authorized business running.", "type": "Research", "date": "2026-11-11", "source_url": "https://www.fortinet.com/blog/industry-trends/beyond-the-kill-switch-containing-ai-agents-at-machine-speed"}]}, "Cisco ~AI": {"category": "AI Security", "announcements": [{"title": "Cisco Outshift Open-Sources Scope, Accord and Concord to Catch Multi-Agent Misalignment", "summary": "Cisco's Outshift released three open-source tools under the Apache-2.0 license to make multi-agent AI systems more reliable. Scope reads OpenTelemetry traces and maps them to a multi-agent knowledge graph to find reasoning failures. Accord makes agents agree on goals, terms and 'done' criteria before work starts. Concord resolves conflicts between agents during the work. All three are available as skills for coding tools such as Claude Code and Codex.", "type": "Product Launch", "date": "2026-11-11", "source_url": "https://at-pulse.com/stories/6433/"}, {"title": "Cisco Highlights Data Security Risks from Expanding Shadow AI Adoption", "summary": "Cisco warned that unapproved AI tools, or shadow AI, are raising data breach costs as UAE organizations expand their use of AI. It said organizations with high shadow AI saw breach costs about $670,000 higher on average. It also said 97% of organizations that suffered an AI-related incident lacked proper AI access controls. Cisco recommends better visibility into AI use, stronger access and data controls, and formal AI governance policies.", "type": "Research", "date": "2026-11-11", "source_url": "https://techpulsemea.com/cisco-highlights-growing-data-security-risks-as-shadow-ai-adoption-expands/"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Westcon-Comstor launches EMEA 'Power Alliance' with Check Point and Extreme Networks for AI governance", "summary": "Westcon-Comstor launched the Power Alliance with Check Point and Extreme Networks to target AI governance in EMEA. It pairs Check Point's security controls and policy intelligence with Extreme Platform ONE, Extreme's AI-powered platform. Partners get a dedicated Check Point and Extreme sandbox in Westcon-Comstor's 3D Lab to validate integrated offerings, speed up proof-of-value and shorten sales cycles. The program also includes technical and sales training, go-to-market support and customer engagement activities.", "type": "Partnership", "date": "2026-11-11", "source_url": "https://www.itweb.co.za/article/power-alliance-targets-emea-ai-governance-opportunity/LPwQ5MlbgbYvNgkj"}, {"title": "Check Point: What 70 European CISOs said about securing the AI era", "summary": "A Check Point blog post shares takeaways from its Leaders Point EMEA meeting of more than 70 European CISOs. Because AI speeds up attacks, CISOs want to prevent risk up front rather than rely on patching. They said AI agents holding legitimate credentials across email, endpoints, networks and cloud need purpose-built controls that check in real time whether each action fits the agent's intended purpose. They also called for a named human owner to sign off on the risk of every AI use case.", "type": "Research", "date": "2026-11-11", "source_url": "https://blog.checkpoint.com/security/what-70-european-cisos-told-us-about-securing-the-ai-era/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare adds metric views to Web Assets Operations for API/endpoint prioritization", "summary": "The Web Assets > Operations page now offers metric-focused views for traffic, errors, latency, response size and security. The views support server-side sorting, so teams can rank and prioritize operations across large API and endpoint inventories. This extends Cloudflare's endpoint management and API security tooling.", "type": "Product Launch", "date": "2026-11-11", "source_url": "https://developers.cloudflare.com/changelog/post/2026-11-11-web-assets-metric-views/"}]}, "AWS ~AS": {"category": "Application Security", "announcements": [{"title": "AWS Network Security Manager expands to European Sovereign Cloud and 31 more Regions", "summary": "AWS Network Security Manager is now generally available in the AWS European Sovereign Cloud and 31 additional Regions across the Americas, Asia Pacific, Europe, the Middle East and Africa. The service automatically and continuously applies AWS WAF and AWS Shield protections to internet-facing assets such as Application Load Balancers. It manages policies centrally, detects drift and remediates automatically, which cuts down manual security work.", "type": "Product Launch", "date": "2026-11-11", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/network-security-mgr-eu-sovereign-cloud/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "OpenAI Codex available on Amazon Bedrock with governed, gateway-based access paths", "summary": "Amazon Bedrock now supports inference for OpenAI Codex, and AWS published guidance on governed access. It recommends starting with a least-privilege pilot using native IAM and IAM Identity Center. Teams can then move to AgentCore Gateway, AWS-managed gateway infrastructure for routing and guardrails, as needs grow. Supported models include GPT-5.6 Sol, Terra and Luna, depending on Region. The guidance focuses on IAM, Regional limits and centralized security and governance for enterprise AI coding agents.", "type": "Product Launch", "date": "2026-11-11", "source_url": "https://aws.amazon.com/blogs/machine-learning/openai-codex-on-amazon-bedrock/"}]}, "Barracuda Networks ~P": {"category": "Platforms", "announcements": [{"title": "Barracuda Discloses 44-Hour Machine-Speed Intrusion of Its Cloud Environment", "summary": "Barracuda disclosed a breach that began November 1 with a valid cloud access key used by a third-party vendor. Over about 44 hours the attacker moved across roughly 10 cloud accounts, harvesting secrets from secret stores, IaC state files, metadata services and Kubernetes service accounts. Barracuda linked the indicators to 'ARTEX'. It rotated credentials and notified customers who may be affected, telling them to revoke and recreate Managed XDR Cloud and Monitored Endpoint integration credentials.", "type": "Other", "date": "2026-11-11", "source_url": "https://blog.barracuda.com/2026/11/11/anatomy-of-a-machine-speed-intrusion"}]}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-11-11.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
</html>
