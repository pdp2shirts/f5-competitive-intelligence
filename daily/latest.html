"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks to Acquire Applied Compute, Bringing Secure Open-Weight AI to the Enterprise", "summary": "Palo Alto Networks signed a definitive agreement to acquire Applied Compute for about $4.5B in an all-stock deal. Applied Compute's post-training and inference platform for open-weight AI models, plus its research team, will help enterprises train, adapt and deploy open-weight and closed models securely across public and sovereign clouds. Co-founder and CEO Yash Patil will become Co-Chief AI Officer. The deal is expected to close in fiscal Q3 2027.", "type": "Acquisition", "date": "2026-11-18", "source_url": "https://www.paloaltonetworks.com/company/press/2026/palo-alto-networks-to-acquire-applied-compute--bringing-secure-open-weight-ai-to-the-enterprise"}, {"title": "Palo Alto Networks Reports Fiscal First Quarter 2027 Financial Results", "summary": "For the quarter ended Oct 31, 2026, revenue was $3.44B, up 39% YoY. Next-Generation Security ARR reached $9.73B (up 66%) and RPO hit $21.0B (up 35%). Non-GAAP EPS was $1.05. The company raised FY2027 guidance to $14.52B\u2013$14.57B in revenue and $11.475B\u2013$11.525B in NGS ARR, and extended its $1B share-repurchase authorization.", "type": "Financial", "date": "2026-11-18", "source_url": "https://www.paloaltonetworks.com/company/press/2026/palo-alto-networks-reports-fiscal-first-quarter-2027-financial-results"}, {"title": "Agent Collaboration Introduced in Cortex", "summary": "Palo Alto Networks introduced Agent Collaboration across Cortex XSIAM, AgentiX, XDR and Cortex Cloud. Persistent AI agents act as visible members of investigation teams and can be sent to cases for one-off or recurring tasks. A Case Resolution Center tracks each agent task as In Progress, Pending or Completed, and sensitive actions need human approval. Agents inherit full case context, which supports multi-agent orchestration.", "type": "Feature Update", "date": "2026-11-18", "source_url": "https://www.paloaltonetworks.com/blog/security-operations/agent-collaborators/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Brings Network Security to Microsoft Sovereign Private Cloud on Azure Local", "summary": "At Microsoft Ignite 2026, Fortinet said FortiGate VM is validated for Microsoft Azure Local Sovereign Private Cloud. FortiGate VM inspects L4\u2013L7 traffic, enforces segmentation and logs activity for compliance in regulated, public sector and critical infrastructure environments. It keeps enforcing policy during disconnected operations and could support per-tenant isolation once Azure Local multitenancy ships.", "type": "Partnership", "date": "2026-11-18", "source_url": "https://www.fortinet.com/blog/cloud-security/fortinet-brings-network-security-to-microsoft-sovereign-private-cloud-on-azure-local"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "From Flashlight to Floodlight: What Six Months of Frontier AI Has Changed at Cisco", "summary": "Cisco reported six months of frontier-AI-driven security hardening tied to Project Glasswing. More than 50 engineers used frontier AI to scan 6.7B lines of Cisco and third-party code, and about 1,500 engineers delivered nearly 4,000 fixes in 2026 hardening releases. Cisco is moving to a predictable hardening release cadence and urges customers to upgrade. It expects about 70% of its code to be AI-assisted next year.", "type": "Research", "date": "2026-11-18", "source_url": "https://blogs.cisco.com/news/from-flashlight-to-floodlight-what-six-months-of-frontier-ai-has-changed-at-cisco"}, {"title": "AgenticOps: A Crew of Four AI Agents for Managed Services", "summary": "Cisco outlined AgenticOps for managed service partners. It is a four-agent 'digital engineering crew' (Scout, Detective, Architect, Test Pilot) that monitors security advisories, checks live inventory, designs fixes with rollback, and sandbox-tests changes in Cisco Modeling Labs before a human approves them. Cisco positions it as a way for partners to resolve vulnerabilities faster and to launch offerings like Continuous Vulnerability Management.", "type": "Feature Update", "date": "2026-11-18", "source_url": "https://blogs.cisco.com/partner/the-power-of-agenticops-how-a-crew-of-4-specialized-ai-agents-can-supercharge-your-managed-services"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Named a Leader in the 2026 Gartner Magic Quadrant for SIEM", "summary": "Gartner named CrowdStrike a Leader in its 2026 Magic Quadrant for SIEM. CrowdStrike positions Falcon Next-Gen SIEM as the foundation of an 'agentic SOC.' It points to detection-ready data, cross-domain correlation with native Falcon endpoint, cloud, identity and AI-agent telemetry, built-in adversary intelligence, and up to 50% data storage savings.", "type": "Research", "date": "2026-11-18", "source_url": "https://www.crowdstrike.com/en-us/blog/crowdstrike-named-leader-2026-gartner-mq-siem/"}]}, "Zscaler": {"category": "Platforms", "announcements": []}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Scales Its SASE Platform on Microsoft Azure for Global Enterprise Deployment", "summary": "Check Point expanded its Microsoft collaboration to deploy Check Point SASE on Azure. The deployment adds 48 Azure PoPs, uses Microsoft Entra for identity-centric Zero Trust, routes optimally to Microsoft 365 and Azure, and covers Private Access, Internet Access, SaaS Security and integrated AI security for AI apps and agents. Check Point cites a 99.8% malware block rate and 1.13 Gbps secure browsing in Miercom's 2026 Hybrid Mesh assessment. Microsoft Marketplace availability is planned for H1 2027.", "type": "Partnership", "date": "2026-11-18", "source_url": "https://www.checkpoint.com/press-releases/check-point-scales-its-sase-platform-on-microsoft-azure-for-global-enterprise-deployment/"}, {"title": "Check Point at Stephens Conference: Rebuild Points to 2027 Growth", "summary": "At the Stephens Annual Investment Conference, Check Point described a difficult 2024 marked by product-revenue pressure and sales-force disruption. It laid out a path to stronger growth in 2027 and beyond, driven by new products and AI-enabled offerings.", "type": "Financial", "date": "2026-11-18", "source_url": "https://www.investing.com/news/transcripts/check-point-at-stephens-conference-rebuild-points-to-2027-growth-93CH-5036764"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare at RBC Conference: AI Traffic Drives Growth and Margins", "summary": "At the RBC Global Technology conference, Cloudflare pointed to a record Q3: ARR over $3 billion, its highest margins, a 6% revenue beat and raised full-year guidance. Leadership said rising AI-driven machine traffic is fueling growth and highlighted monetization products including Monetization Gateway, Wallet and Identity. It also cited 10 million developers and a record annual contract value quarter.", "type": "Financial", "date": "2026-11-18", "source_url": "https://www.investing.com/news/transcripts/cloudflare-at-rbc-conference-ai-traffic-drives-growth-and-margins-93CH-5036486"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Comcast and Fastly Launch In-Network Delivery Model for Major Game Launches", "summary": "Comcast and Fastly announced a delivery model that embeds Fastly's edge platform inside Comcast's distributed network, which reaches about 65 million homes and businesses. Large game files are served from within Comcast's network, cutting network round-trip time by more than 40% and absorbing peak demand around launches such as Grand Theft Auto VI on Nov 19. Fastly shares rose about 10% intraday on the news.", "type": "Partnership", "date": "2026-11-18", "source_url": "https://www.businesswire.com/news/home/20261117657209/en/Comcasts-Network-Powers-Gamings-Biggest-Moments-with-Fastly-Delivering-Faster-Downloads-and-Less-Lag"}, {"title": "Fastly Outlines 2029 Growth Plan at RBC Global Industrials Conference", "summary": "Fastly presented itself as a multi-product edge cloud company with six product suites across delivery, security and compute, targeting $1.1\u20131.3B revenue by 2029 through AI, international expansion and deeper product adoption. Q3 security revenue was $45M, up 32% year over year, and about one-third of large customers use four or more suites. Management guided capex at 10\u201312% of revenue through 2029, helped by the Comcast partnership.", "type": "Financial", "date": "2026-11-18", "source_url": "https://www.investing.com/news/transcripts/fastly-at-rbc-global-industrials-conference-2026-growth-plan-widens-93CH-5036934"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "NetScaler Console Service Update Fixes Sentinel Export, ACME and Multi-Tenant Issues", "summary": "The Nov 18 NetScaler Console service release notes list fixes for analytics exports to Microsoft Sentinel failing with HTTP 413, SSL dashboard drill-down and CSR issues, AWS agent upgrade boot problems, and memory exhaustion in multi-tenant analytics services. They also cover ACME certificate issuance failures and false 'disconnected' or license grace-period alerts after brief connectivity glitches.", "type": "Feature Update", "date": "2026-11-18", "source_url": "https://docs.netscaler.com/us/en/netscaler-console-service/release-notes/whats-new.html"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": []}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "FAA Pauses Rollout of HPE Juniper Routers After Installation Issue", "summary": "The FAA paused its migration from Cisco to HPE Juniper routers after one unit, the 69th following 68 successful installs, reportedly behaved abnormally during installation at a facility tied to a nationwide ground stop that affected thousands of flights. Early reports point to a copper-to-fiber media converter or a router feature left enabled during testing rather than a basic product flaw.", "type": "Customer", "date": "2026-11-18", "source_url": "https://www.sdxcentral.com/news/faa-now-grounds-hpe-juniper-routers/"}, {"title": "HPE Names Jennifer Nason, Adviser on Juniper Deal, to Board of Directors", "summary": "HPE appointed Jennifer Nason, former Global Chair of Investment Banking at JPMorgan who advised HPE on its Juniper Networks acquisition, to its board effective Nov 18, 2026. An accompanying 8-K amends HPE's cooperation agreement with Elliott Investment Management to cap board size at 15 directors until the 2027 annual meeting and 13 after that. HPE frames the move as supporting its AI, cloud and networking strategy.", "type": "Financial", "date": "2026-11-18", "source_url": "https://www.hpe.com/us/en/newsroom/press-release/2026/11/hpe-names-jennifer-nason-to-board-of-directors.html"}]}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware Says AI Xploit Shield Customers Already Covered Against Java4Shell", "summary": "Radware published a blog post on the new critical Java remote-code-execution vulnerability known as Java4Shell. It states that customers using its AI Xploit Shield protection are already covered. The post highlights AI-driven automated detection and fast mitigation as proactive defense against emerging Java exploits.", "type": "Feature Update", "date": "2026-11-18", "source_url": "https://www.radware.com/blog/java-has-a-new-shell/"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "Imperva Issues Customer Guidance on Critical NGINX HTTP/2 Vulnerabilities (CVE-2026-123633, CVE-2026-123007)", "summary": "Imperva published guidance on two memory-safety flaws in NGINX HTTP/2 handling, a use-after-free and a flow-control integer underflow, that can allow unauthenticated code execution on affected NGINX OSS and NGINX Plus servers. It urges patching to fixed releases (NGINX OSS 1.30.7/1.31.9; NGINX Plus 37.x hotfixes). It also positions Imperva Cloud WAF and its HTTP/2 'client to Imperva' mode as interim mitigation. This directly targets F5 NGINX customers.", "type": "Research", "date": "2026-11-18", "source_url": "https://www.imperva.com/blog/critical-nginx-http-2-vulnerabilities-cve-2026-123633-and-cve-2026-123007-what-imperva-customers-need-to-know/"}, {"title": "Imperva Details Java4Shell (CVE-2026-114938) Protections Across Cloud WAF, Imperva for AWS and Google Cloud", "summary": "Imperva analyzed Java4Shell, a critical OpenJDK Base64 decoding flaw affecting Java 17, 21, 25 and 27 on x86-64 CPUs with AVX-512 VBMI, which can lead to memory leakage or remote code execution. Imperva says Cloud WAF, Imperva for AWS and Imperva for Google Cloud now block exploitation attempts in common Base64 input fields, with a WAF Gateway version with dedicated protection forthcoming. It advises patching runtimes, rebuilding containers and inventorying bundled JREs.", "type": "Research", "date": "2026-11-18", "source_url": "https://www.imperva.com/blog/java4shell-cve-2026-114938-what-you-need-to-know-and-how-imperva-protects-you/"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Prisma Browser Extends Agentic Security to Desktop and Extension-Based AI Agents", "summary": "Palo Alto Networks is extending Prisma Browser's agentic security beyond in-browser agents. Coverage now includes desktop agents (through an embedded MCP server or their own embedded browsers) and browser-extension agents. It adds visibility into AI agent activity, access governance, and protection against unauthorized actions, session hijacking and data exposure when agents share authenticated sessions with employees.", "type": "Feature Update", "date": "2026-11-18", "source_url": "https://www.paloaltonetworks.com/blog/sase/ai-agent-browser-security-for-desktop-agents-prisma-browser/"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike Brings the Human Advantage to AI Detection and Response", "summary": "CrowdStrike paired Falcon Guardian AI runtime visibility with human-led MDR and threat hunting. Falcon Guardian records human prompts, AI instructions and agent activity at the OS level. Falcon Graph links that activity to endpoint execution. Falcon Complete analysts and OverWatch hunters correlate AI signals with endpoint, identity, cloud and SaaS telemetry to catch threats such as prompt injection and AI supply-chain poisoning.", "type": "Feature Update", "date": "2026-11-18", "source_url": "https://www.crowdstrike.com/en-us/blog/crowdstrike-brings-human-advantage-aidr/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare WAF Emergency Release Protects Against Java4Shell (CVE-2026-114938)", "summary": "Cloudflare shipped an emergency WAF release with six new Managed Ruleset detections for Java4Shell, a critical memory-corruption RCE flaw in OpenJDK's Base64 decoder. The rules catch malformed Base64 in headers, query values, bodies, path segments, JWT components and WebAuthn values. They are on by default in Log mode for paid plans, a Free-plan rule is in development, and Enterprise WAF Attack Score adds another layer. Cloudflare stresses that patching Java is the only complete fix.", "type": "Feature Update", "date": "2026-11-18", "source_url": "https://blog.cloudflare.com/java4shell-waf-protection/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Clairic and Clairic-flash Extraction Models Released as Open-Weight on Workers AI", "summary": "Cloudflare's newly named Workers AI Superintelligence team released open weights for Clairic (27B) and the new Clairic-flash (9B) document-extraction models. Both are hosted on Workers AI and published on Hugging Face. Updates include PDF and multi-page support (up to four pages or images per request), better handling of tables, lists and dates, and parallel slot autoregressive generation. Pricing is $0.24 and $0.10 per million input tokens, with both at $0.10 until December 1, 2026.", "type": "Product Launch", "date": "2026-11-18", "source_url": "https://blog.cloudflare.com/open-clairic/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Amazon SageMaker AI Adds Cross-Region Inference Routing", "summary": "SageMaker AI now offers an inference router that redirects requests to healthy endpoints in other Regions or AWS accounts when local capacity or health is constrained, with no changes to existing endpoints or models. Customers register real-time and asynchronous endpoints with the router and point apps at it. The router prefers the local Region and shifts traffic to remote endpoints as issues rise.", "type": "Feature Update", "date": "2026-11-18", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/sagemaker-cross-region-routing/"}, {"title": "AWS Lambda Supports GPU-Accelerated Functions on Lambda Managed Instances", "summary": "Lambda now runs GPU-accelerated Event Functions on Lambda Managed Instances using EC2 G-series GPUs. This brings serverless AI inference, media processing and simulation without managing GPU drivers or scaling. GPU base images ship with frameworks such as vLLM, SGLang and PyTorch, plus up to 32 GB NVMe and SOCI lazy loading and S3 streaming to cut startup time.", "type": "Product Launch", "date": "2026-11-18", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-lambda-gpu-managed-instances/"}]}, "AWS ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Amazon CloudFront Adds Origin Mutual TLS for WebSocket and gRPC", "summary": "CloudFront now supports origin mTLS for WebSocket and gRPC traffic, authenticating to origins such as Application Load Balancer, API Gateway, on-premises and non-AWS origins with TLS certificates instead of shared secrets or IP allow-lists. It targets persistent and streaming apps like chat, collaboration tools and live dashboards. There is no extra charge, and it is available on pay-as-you-go and Business/Premium plans.", "type": "Feature Update", "date": "2026-11-18", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-cloudfront-origin-mtls-websockets-grpc/"}, {"title": "Amazon CloudFront Functions Now Supports Network Calls", "summary": "CloudFront Functions adds cf.fetch(), which lets edge functions call external APIs mid-request and use the response for authentication, routing or personalization. It also adds cf.beacon() for background analytics calls. This extends CloudFront's edge programmability for traffic-steering and request-handling logic.", "type": "Feature Update", "date": "2026-11-18", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/cloudfront-functions-network-calls/"}]}, "Akamai ~P": {"category": "Platforms", "announcements": [{"title": "Akamai Extends Enterprise Security Controls to Microsoft Edge for Business Browser on Mobile", "summary": "In collaboration with Microsoft, Akamai is bringing its Akamai Workforce Protector (formerly LayerX) security extension to Microsoft Edge for Business on iOS and Android. Managed mobile devices get real-time threat prevention, malicious URL blocking, generative AI governance and granular DLP inside mobile browsing sessions, deployed through existing Microsoft device-management tools without a separate corporate browser.", "type": "Partnership", "date": "2026-11-18", "source_url": "https://www.akamai.com/newsroom/press-release/akamai-extends-its-enterprise-security-controls-to-microsoft-edge-for-business-browser-on-mobile"}, {"title": "Akamai Cloud Pulse Monitoring for Linodes and Block Storage Enters Limited Availability", "summary": "Akamai Cloud Pulse monitoring for Linodes and Block Storage volumes is now in Limited Availability across all core regions. Metrics can be viewed in dashboards, pulled through the Linode API, or exported to external observability tools with an OTEL collector. New alerting supports up to 20,000 Linodes per alert definition.", "type": "Feature Update", "date": "2026-11-18", "source_url": "https://techdocs.akamai.com/cloud-computing/changelog/nov-18-2026-monitoring-for-linodes-and-block-storage-la"}]}, "Barracuda Networks ~P": {"category": "Platforms", "announcements": [{"title": "Barracuda Adds Centralized News Center to BarracudaONE Platform", "summary": "Barracuda added a News Center inside its BarracudaONE platform that consolidates product releases, feature updates and announcements across the Barracuda portfolio, with notification badges on the dashboard. Posts are categorized by product and update type for filtering, so customers and MSPs no longer have to monitor email, websites and support portals separately. It is found under Resources, then News Center.", "type": "Feature Update", "date": "2026-11-18", "source_url": "https://documentation.campus.barracuda.com/wiki/spaces/NC/pages/1000964155/What+s+New+-+18+November+2026+News+Center+in+BarracudaONE"}]}, "Imperva (Thales) ~AI": {"category": "AI Security", "announcements": [{"title": "Imperva: Shadow AI Detection Starts in Your Release Notes", "summary": "Imperva argues that most enterprise AI risk comes from AI features quietly added to existing SaaS products through routine updates, creating uninventoried data flows to LLMs. It recommends starting with an AI inventory that covers every LLM call, the data in and out, and ownership. The post promotes an AI Discovery Playbook and a ShadowAI-Watch tool, and positions Imperva AI Application Security around discovering, assessing and governing AI assets.", "type": "Research", "date": "2026-11-18", "source_url": "https://www.imperva.com/blog/shadow-ai-shipped-in-release-notes/"}, {"title": "Thales Warns AI Agents Are Moving Beyond Enterprise Guardrails", "summary": "In CRN Asia coverage, Thales' Tim Chang said rapid AI agent adoption makes agent behavior hard to predict, and that companies often deploy guardrails and then patch gaps with point solutions. Thales argues guardrails alone are not enough as agents reach websites and APIs. It promotes a unified 'security fabric' for centrally controlling agentic workflows across internal and external applications.", "type": "Research", "date": "2026-11-18", "source_url": "https://www.crnasia.com/news/2026/cybersecurity/thales-warns-ai-agents-are-moving-beyond-enterprise-guardrai"}]}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-11-18.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
