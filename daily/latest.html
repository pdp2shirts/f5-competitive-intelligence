ssway-E gateways. Cisco released patches in late October, and CISA told federal agencies to patch within three days. Researchers report attackers used AI-assisted tooling to gain root, move laterally and try to steal credentials.", "type": "Research", "date": "2026-11-23", "source_url": "https://www.bleepingcomputer.com/news/security/cisa-flags-critical-cisco-expressway-rce-flaw-as-actively-exploited/"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike to Acquire Zscaler, Bringing Network Security and Zero Trust to the Falcon Platform", "summary": "CrowdStrike agreed to buy Zscaler in an all-stock deal valued at about $43.9B, paying 1.135 CrowdStrike shares per Zscaler share (about a 34% premium). The deal adds Zscaler's Zero Trust and SASE network security to CrowdStrike's endpoint, identity, cloud and data security on one Falcon platform and Falcon Flex contract. CrowdStrike cites a $185B+ addressable market expansion, cross-sell into about 8,000 Zscaler customers and roughly $1B in revenue synergies within 30 months. Jay Chaudhry will keep running Zscaler and join CrowdStrike's board. Close is expected in H2 of CrowdStrike FY2028.", "type": "Acquisition", "date": "2026-11-23", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-to-acquire-zscaler-bringing-network-security-and-zero-trust-to-the-falcon-platform/"}, {"title": "CrowdStrike Reports Third Quarter Fiscal Year 2027 Financial Results", "summary": "CrowdStrike reported Q3 FY2027 revenue of $1.58B (up 28% YoY) and subscription revenue of $1.50B (up 29%). ARR reached $6.26B (up 27%), with $419.2M of net new ARR. Non-GAAP operating income was $405.5M and non-GAAP EPS was $0.34, beating estimates. Full-year guidance was raised to about $6.08B in revenue. The results came out alongside the Zscaler acquisition announcement, with AI security demand cited as a growth driver.", "type": "Financial", "date": "2026-11-23", "source_url": "https://ir.crowdstrike.com/news-releases/news-release-details/crowdstrike-reports-third-quarter-fiscal-year-2027-financial/"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler Reports Q1 FY2027 Results Alongside Agreement to Be Acquired by CrowdStrike", "summary": "Zscaler reported Q1 FY2027 revenue of $949.3M, up 20% year over year, with ARR up 21% to $3.882B, RPO up 23% to $7.287B, and free cash flow of $416.5M (44% of revenue). The company skipped its earnings call because of its definitive agreement to be acquired by CrowdStrike in an all-stock deal valued at about $43.9B. Zscaler operates independently until close.", "type": "Financial", "date": "2026-11-23", "source_url": "https://ir.zscaler.com/news-releases/news-release-details/zscaler-announces-first-quarter-fiscal-year-2027-financial"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Sherweb Adds Check Point MSP Platform to Its Cloud Marketplace", "summary": "Sherweb expanded its Check Point partnership by adding the Check Point MSP Platform to the Sherweb Marketplace. MSPs get a single pane for managing Check Point security, which cuts admin overhead as they scale recurring revenue. The update also includes Workforce AI to help clients adopt AI with governance and security controls. It's available now, with a migration path for current Email Security and SASE users to be announced later.", "type": "Partnership", "date": "2026-11-23", "source_url": "https://www.msspalert.com/brief/sherweb-adds-check-point-msp-platform-to-cloud-marketplace"}, {"title": "GreyNoise Exposes Active Intrusion Campaign Against Check Point Security Management Servers", "summary": "GreyNoise reported a campaign (GT13) that compromised at least 22 organizations worldwide by targeting Check Point Security Management Servers between Oct 17 and Nov 2, 2026. The actor used 99 relay IPs and AI-assisted tooling, and tried to exploit several CVEs, including CVE-2026-16232, a SmartConsole auth bypass. Affected sectors include energy, financial services, government and mining. Customers are urged to patch, hunt for threats and review management exposure.", "type": "Research", "date": "2026-11-23", "source_url": "https://www.greynoise.io/blog/check-point-security-management-servers-intrusion-campaign"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Adds Feedback Channel for CLI and MCP Coding Agents", "summary": "Cloudflare added a feedback feature to the Cloudflare CLI ('cf feedback') and its MCP server. Coding agents can call a submit_feedback tool with message, type and impact fields and get back a submission ID for tracking. It's part of a wider set of Nov 23 developer changelog updates aimed at agent-driven workflows on its developer platform.", "type": "Product Launch", "date": "2026-11-23", "source_url": "https://developers.cloudflare.com/changelog/post/2026-11-23-agent-feedback/"}]}, "AWS": {"category": "Platforms", "announcements": []}, "HiddenLayer": {"category": "AI Security", "announcements": [{"title": "HiddenLayer Hosts 'AI Security Scramble' Networking Event in Austin", "summary": "HiddenLayer hosted its AI Security Scramble on November 23 at ROK Golf in Bee Cave, TX: a free, no-sales-pitch networking social with a simulator golf scramble for AI security practitioners. It's a minor local community and field-marketing touchpoint rather than a product or corporate announcement, but shows HiddenLayer investing in practitioner relationships in its home market.", "type": "Event", "date": "2026-11-23", "source_url": "https://aievents.now/austin/events/hiddenlayer-ai-security-scramble-2026-11-23"}]}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": []}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": []}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "HPE Reports Fiscal Q4 2026 Results: Juniper-Powered Networking Hits $3.1B as AI Network Orders Reach a Record", "summary": "HPE reported fiscal Q4 2026 revenue of $14.5B, up 50% year over year, and raised FY2027 guidance to 27-35% revenue growth. Networking revenue grew 12.3% to $3.1B at a 22.1% operating margin, with orders up 56%. Management said 'networks for AI' orders hit a record $1.2B, with about $1.7B in backlog, and that the Juniper integration is ahead of plan, driven by AI data center fabrics, DCI routing and the AMD Helios and Oracle OCI deals.", "type": "Financial", "date": "2026-11-23", "source_url": "https://www.hpe.com/us/en/newsroom/press-release/2026/11/hpe-reports-fiscal-2026-fourth-quarter-results.html"}]}, "Radware": {"category": "Application Security", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "Harmonic Security Integrates AI-Use Risk Detections with CrowdStrike Falcon Next-Gen SIEM", "summary": "Harmonic Security announced an integration that sends its AI-use risk detections (sensitive data exposure, prompt injection, unsafe agent actions) into CrowdStrike Falcon Next-Gen SIEM. SOC teams get a single view of AI-related risk inside Falcon, with faster investigation, simpler data onboarding and automated response. The integration is available in the CrowdStrike Marketplace. Harmonic Security published the announcement, not CrowdStrike.", "type": "Partnership", "date": "2026-11-23", "source_url": "https://www.harmonic.security/resources/harmonic-security-announces-new-integration-with-crowdstrike-falcon-r-next-gen-siem"}]}, "Cisco ~AI": {"category": "AI Security", "announcements": [{"title": "Cisco and OpenAI Launch Shirudo, A New Project to Safeguard Agentic AI", "summary": "Cisco and OpenAI launched Shirudo, an open-source project for self-defending infrastructure. Built on eBPF (with roots in Isovalent's Tetragon), it lets AI agents find vulnerabilities, generate cryptographically signed shields and test them. The shields protect running Linux systems without reboots while patches roll out. Cisco frames it as a move from human-paced patching to agent-driven defense against AI-powered attacks. The code is on GitHub, and a community webinar is planned for December 15.", "type": "Product Launch", "date": "2026-11-23", "source_url": "https://newsroom.cisco.com/c/r/newsroom/en/us/a/y2026/m11/cisco-and-openai-launch-shirudo-a-new-project-to-safeguard-agentic-ai.html"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point Research 23rd November Threat Intelligence Report Highlights AI-Driven Threats", "summary": "Check Point Research's weekly report covers major breaches, including the FBI NCIC, RIKEN (Fugaku) and the EU Commission. It also highlights AI threats such as 'gatekeeper asymmetry' that bypasses AI security filters, exploitation of AI frameworks against East Asian universities, and the AI-powered TheMailer phishing kit. Vulnerability coverage includes critical PHP fixes.", "type": "Research", "date": "2026-11-23", "source_url": "https://research.checkpoint.com/2026/23rd-november-threat-intelligence-report/"}]}, "Cloudflare ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Cloudflare Extends Flamingo Testing Framework to Probe DNS Propagation in Production", "summary": "Cloudflare extended Flamingo, its end-to-end testing framework, to send DNS queries from every data center. It continuously measures how fast DNS changes reach authoritative nameservers (within 90 seconds) and the 1.1.1.1 resolver (within 600 seconds). The data feeds SLOs and release decisions, triggering automatic rollbacks when propagation slows so problems are caught before customers see them.", "type": "Other", "date": "2026-11-23", "source_url": "https://blog.cloudflare.com/probing-dns-at-cloudflare/"}]}, "AWS ~AI": {"category": "AI Security", "announcements": [{"title": "AWS WAF Adds Automated Discovery and Protection for LLM, MCP, and A2A Endpoints Using Bedrock Guardrails", "summary": "AWS WAF now automatically discovers LLM, MCP and A2A endpoints behind API Gateway, ALB and CloudFront across an AWS Organization through the new API Portal, with no agents required. A new AWS WAF AI Security managed rule group adds protocol validation and content inspection through Bedrock Guardrails, detecting prompt injection, jailbreaks, harmful content and sensitive data in responses. AI Security launches in seven regions.", "type": "Product Launch", "date": "2026-11-23", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/waf-ai-endpoint-discovery-protection/"}]}, "AWS ~AS": {"category": "Application Security", "announcements": [{"title": "AWS Launches API Security Managed Rules and API Portal Discovery for AWS WAF", "summary": "AWS made API Portal, API Security and AI Security generally available. API Portal discovers APIs and AI endpoints from configuration and live traffic across CloudFront, ALB and API Gateway. The API Security rule group protects against BOLA, authentication attacks such as tampered tokens and credential stuffing, and reconnaissance, using single-request rules plus behavioral detections. Data-exfiltration detection is coming.", "type": "Product Launch", "date": "2026-11-23", "source_url": "https://aws.amazon.com/blogs/security/introducing-api-and-ai-security-on-aws-from-discovery-to-protection/"}, {"title": "AWS WAF Introduces Simplified Pricing with Bundled Bot Control and Anti-DDoS", "summary": "AWS WAF moves to simplified pricing: $0.01/hour per protected resource, $0.60 per million base requests, and $5.00 per million premium requests for advanced protections like API Security and AI Security. Bot Control and Anti-DDoS no longer carry separate charges, and each web ACL now includes 2,500 WCUs. Existing customers move to the new pricing automatically on February 1, 2027.", "type": "Product Launch", "date": "2026-11-23", "source_url": "https://aws.amazon.com/blogs/security/introducing-aws-waf-simplified-pricing/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Amazon EC2 G7 Instances Now Available in Bare-Metal Size with NVIDIA Blackwell GPUs", "summary": "AWS made a metal size of EC2 G7 instances generally available, with 8 NVIDIA RTX PRO 4500 Blackwell Server Edition GPUs, custom Intel Xeon 6 processors, 192 vCPUs, 768 GiB of memory and 700 Gbps of EFA networking. It targets physical AI simulation, AI agent sandboxes and custom virtualization workloads, and is available in US East (N. Virginia) via On-Demand, Spot and Savings Plans.", "type": "Product Launch", "date": "2026-11-23", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-g7-metal-size/"}]}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Akamai Warns 1,615 New TLD Applications Expand DNS Impersonation and Name-Collision Risk", "summary": "An Akamai security blog looks at ICANN's 2026 round of 1,615 new top-level domain applications, to be delegated starting in 2027. It warns that infrastructure-sounding strings such as .agent, .api and .hub enable brand look-alike domains, and that name collisions could make internal names resolve publicly and leak credentials or tokens. Akamai advises auditing internal DNS, extending look-alike and Certificate Transparency monitoring, and setting up .brand governance before delegation.", "type": "Research", "date": "2026-11-23", "source_url": "https://www.akamai.com/blog/security/1615-new-tlds-dns-ready-for-bigger-namespace"}]}, "Barracuda Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Barracuda AI Data Security for MSPs Gets ANZ Channel Push", "summary": "Techpartner.news covered Barracuda AI Data Security, an AI security and governance product for MSPs built on BarracudaONE and the Barracuda IQ engine. It covers 1,300+ GenAI tools (Copilot, ChatGPT, Claude, Gemini), blocks sensitive data in prompts and files, detects prompt injection and jailbreak attempts, and exports audit trails in one click. It's bundled with SecureEdge Premium Access. Barracuda first announced it globally in September (GA October), so this is regional follow-on coverage.", "type": "Product Launch", "date": "2026-11-23", "source_url": "https://www.techpartner.news/news/barracuda-introduces-ai-data-security-product-aimed-at-msps-630522"}]}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-11-23.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
</html>
