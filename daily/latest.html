"use strict";
var DATA={"HiddenLayer": {"category": "AI Security", "announcements": [{"title": "HiddenLayer: Agent Skills Are the Missing Piece of AI Agent Inventories", "summary": "HiddenLayer argues that listing which AI agents exist is not enough: security teams also need visibility into the skills each agent can call, because skills define what agents can actually do and can be malicious, compromised or come from untrusted sources. It recommends a three-step Discover, Assess and Govern process that catalogs skill origins, analyzes the tools and data each skill reaches, and restricts or approves skills by risk and environment. The piece pushes 'capability visibility' alongside runtime monitoring, a framing that overlaps with F5 AI Guardrails and SurePath AI workload discovery.", "type": "Thought Leadership", "date": "2026-11-10", "source_url": "https://www.hiddenlayer.com/insight/your-ai-agent-inventory-is-missing-something"}, {"title": "HiddenLayer CEO: Production Guardrails Shouldn't Rely on the Model Provider", "summary": "On the ZeroSum podcast, HiddenLayer CEO Chris Sestito said the bigger AI risk is the bad actors AI enables, not the model itself. He noted that a widely publicized jailbreak still works across major models, said production guardrails should not depend only on the model vendor, and called for technology policy rather than AI-specific policy. He also raised open questions about accountability when agents break the law. The message backs the case for independent, model-agnostic runtime protection.", "type": "Thought Leadership", "date": "2026-11-10", "source_url": "https://www.hiddenlayer.com/news/ai-just-made-every-bad-actor-a-hacker"}]}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": [{"title": "Mindgard Feeds Red-Team Findings to Guardian Agents for Autonomous AI Remediation", "summary": "Mindgard enhanced its AI security platform so trusted guardian agents receive validated adversarial findings and mitigation guidance directly, including code-level fixes and guardrail rules. The guardian agents can then apply fixes and runtime protections themselves without exposing the customer's stack, which removes manual ticketing and shortens time-to-fix after red-teaming. The release ties offensive testing to remediation across the AI lifecycle and goes straight at the F5 AI Red Team to AI Guardrails loop.", "type": "Product Update", "date": "2026-11-10", "source_url": "https://www.businesswire.com/news/home/20261110720120/en/Mindgard-Announces-Enhanced-Guardian-Agent-Support-Enabling-Vulnerability-Remediation-Across-the-Entire-AI-Lifecycle"}]}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware Cloud WAF Suffers Service Disruptions in Asia Pacific and Europe on the Same Day", "summary": "Radware's status page reported two separate Cloud WAF service incidents on November 10. The first hit the Asia Pacific Hong Kong and Singapore PoPs from about 09:43 to 11:58 UTC. The second hit the Europe Frankfurt instances serving London and Amsterdam from about 10:50 to 13:07 UTC. Each lasted a little over two hours before Radware applied fixes and resolved it, and the Chennai PoP had another short incident on November 8. Several regional outages in a few days give customers a reason to ask about the resilience of Radware's cloud WAAP footprint.", "type": "Service Incident", "date": "2026-11-10", "source_url": "https://isdown.app/status/radware-cloud-waf/incidents/684284-radware-cloud-waf-incident-notification-europe-frankfurt"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Confirms Active Exploitation of Chained ESG Flaws Granting Root Access; WAF and ADC Also Affected", "summary": "Barracuda updated its advisory on November 10 to confirm attackers are exploiting two recently patched flaws: CVE-2026-116606, a pre-auth authorization bypass in Email Security Gateway, and CVE-2026-111560, a command injection that also affects Barracuda Load Balancer ADC, Web Application Firewall, WAF Control Center, Message Archiver and Web Security Gateway. Chained together, they give root access through an exposed admin UI. Barracuda says a small number of organizations were hit and urges immediate patching and locking down admin interfaces. This comes days after a separate XDR credential-store incident.", "type": "Security Advisory", "date": "2026-11-10", "source_url": "https://www.bleepingcomputer.com/news/security/hackers-exploit-barracuda-email-security-gateway-flaws-to-get-root-access/"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "Thales Partners with Lotte Innovate to Embed Imperva WAAP in AI-Based Managed Security Service in Korea", "summary": "Lotte Innovate and Thales announced an expanded partnership that puts Imperva web application and API protection (WAAP) inside Lotte Innovate's security monitoring platform. The goal is to detect and respond to AI-powered and automated attacks. The companies signed an MOU on October 28 and announced it publicly on November 10\u201311. Lotte plans to launch an 'AI Premium Security Monitoring' service in November, roll the integrated protection out across Lotte Group affiliates, and sell it to outside enterprise customers with joint marketing. This is a managed-service partner motion for Imperva WAAP in the APAC market.", "type": "Partnership", "date": "2026-11-10", "source_url": "https://www.ebn.co.kr/news/articleView.html?idxno=1731175"}]}, "Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Launches Cortex Cloud Sensor for Kubernetes, Container and Linux Runtime Protection", "summary": "Palo Alto Networks introduced Cortex Cloud Sensor, a lightweight, cloud-optimized runtime agent for Kubernetes, containers and Linux workloads. It delivers active protection (anti-malware, exploit prevention, real-time response), continuous workload visibility with file integrity monitoring and cloud/endpoint analytics, and incident context that maps workloads to clusters and accounts with code-to-runtime correlation and AI-driven remediation guidance through Cortex. The launch deepens Cortex Cloud as a consolidated CNAPP-plus-runtime platform, competing for the same Kubernetes footprint where F5 NGINX and BIG-IP Next for Kubernetes deliver ingress and app security.", "type": "Product Launch", "date": "2026-11-10", "source_url": "https://www.paloaltonetworks.com/blog/cloud-security/introducing-the-cortex-cloud-sensor-best-in-class-protection-purpose-built-for-cloud-workloads/"}, {"title": "Palo Alto Networks Data Security MCP Server Brings DLP Intelligence into Claude Code and Cursor", "summary": "Palo Alto Networks released a generally available, locally deployed Data Security MCP Server that connects its Data Security (DLP) service to MCP-compatible AI agents such as Claude Code and Cursor via public APIs. Security teams can use agents to assess exposure, investigate incidents, tune policies to cut false positives, run compliance audits and generate reports while keeping deployment and access under their own control. The move positions Palo Alto's SASE data security as agent-native tooling and shows MCP becoming a standard integration surface for security platforms.", "type": "Product Launch", "date": "2026-11-10", "source_url": "https://www.paloaltonetworks.com/blog/sase/introducing-the-palo-alto-networks-data-security-mcp-server/"}, {"title": "Prisma Browser Adds Element-Level Web Controls to Strip Risky Widgets and AI Copilots from SaaS Pages", "summary": "Palo Alto Networks detailed Web User Interaction Control (WUIC) in Prisma Browser, which lets administrators control individual elements on web pages and SaaS apps rather than allowing or blocking whole sites. Organizations can surgically remove risky widgets, embedded AI copilots, chat and summary features, or actions such as share, download and export, which network-level inspection cannot distinguish. The capability strengthens Palo Alto's enterprise-browser pitch as a SASE control point for shadow AI and data loss inside sanctioned applications.", "type": "Product Update", "date": "2026-11-10", "source_url": "https://www.paloaltonetworks.com/blog/sase/surgical-web-security-control-elements-and-widgets-with-prisma-browser/"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Palo Alto Networks Model Security Compass: Claude Fable 5.2 Scores First-Ever Perfect Result", "summary": "Palo Alto Networks reported that Anthropic's Claude Fable 5.2 achieved a perfect score on its Model Security Compass benchmark, the first model to do so. Across thousands of tests in realistic agent environments covering hijacking, rule override, credential leaks and fake packages, Fable 5.2 showed a 0% attack success rate while completing 99.5% of harmless tasks. Publishing a model-security benchmark positions Palo Alto (Prisma AIRS) as an arbiter of model safety for enterprise AI buyers, a thought-leadership lane F5 AI Red Team and AI Guardrails also compete in.", "type": "Research", "date": "2026-11-10", "source_url": "https://www.paloaltonetworks.com/blog/security-operations/claude-fable-5-2-hits-a-perfect-score-on-our-security-benchmark-the-first-model-ever-to-do-it/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Discloses Critical FortiOS HA Flaw (CVSS 9.0) Among November PSIRT Advisories", "summary": "Fortinet's November 10 PSIRT batch includes FG-IR-26-273 (CVE-2026-126259, CVSS 9.0), a critical missing-authentication flaw letting an unauthenticated attacker run commands as super admin via crafted HA packets on FortiOS systems using FGSP with standalone-config-sync or autoscale. Fixes require FortiOS 8.0.1+, 7.6.8+, 7.4.13+ and later. Companion advisories cover a high-severity FortiOS/FortiSASE out-of-bounds RCE (CVE-2026-126256), FortiAnalyzer/FortiManager command injection, and FortiAuthenticator DoS and out-of-bounds write bugs. Customers face another round of urgent firewall patching across the Security Fabric.", "type": "Security Advisory", "date": "2026-11-10", "source_url": "https://fortiguard.fortinet.com/psirt/FG-IR-26-273"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Will Ship No New Products Without Cloud Control Integration Starting 2027", "summary": "At Cisco Live Melbourne, Cisco said that from 2027 every new product must integrate with Cisco Cloud Control, its SaaS management and AgenticOps platform unifying inventory, topology, telemetry, alerts, identity and workflows across networking, security, compute and observability. Cloud Control is GA in the US, with EU, UK and a sovereign Sydney instance targeted for February 2027 and Japan, India and Canada by mid-2027. The mandate is Cisco's strongest platformization lock-in move yet, pulling customers toward a single Cisco control plane for humans and AI agents.", "type": "Strategy", "date": "2026-11-10", "source_url": "https://www.theregister.com/networks/2026/11/10/cisco-to-link-all-future-products-to-its-saas-y-cloud-control-management-tool/5308660"}, {"title": "Cisco Partner Summit Expands Incentives, Ecosystem Deal Registration and Partner Access to Cisco IQ", "summary": "Cisco broadened its channel strategy at Partner Summit with new ecosystem deal registration, larger adoption and growth incentives, partner access to Cisco IQ, and expanded Cisco Cloud Control capabilities for managed and professional services. The program rewards partners for customer adoption, ongoing advisory and lifecycle engagement rather than initial hardware sales alone, letting MSPs tie recurring services to Cisco platform usage. The changes sharpen Cisco's partner economics around its platform and services motion.", "type": "Partnership", "date": "2026-11-10", "source_url": "https://www.channele2e.com/news/cisco-rewards-partners-for-driving-growth-and-customer-adoption"}, {"title": "Cisco Publishes CNSA 2.0 Blueprint for Quantum-Resilient WAN on 8000 Series Secure Routers", "summary": "Cisco outlined a CNSA 2.0-aligned blueprint for quantum-resilient WAN security on its 8000 Series Secure Routers, built on three pillars: hardware root of trust, quantum-safe control- and data-plane encryption, and crypto-agility with real-time visibility. Cisco ties the guidance to federal timelines requiring quantum-safe purchases by 2027 and full transition by 2031, which commercial buyers are expected to follow. The post adds to a crowded post-quantum narrative across networking and security vendors heading into 2027 refresh cycles.", "type": "Thought Leadership", "date": "2026-11-10", "source_url": "https://blogs.cisco.com/networking/safeguard-your-wan-from-quantum-threats-part-2-the-cnsa-2-0-blueprint"}, {"title": "Cisco Cyber Vision 5.6 Moves OT Security from Visibility to In-Network Segmentation", "summary": "Cisco released Cyber Vision 5.6, shifting OT security from asset visibility toward protection with in-network segmentation enforced on Cisco Industrial Ethernet switches. New capabilities include AI-assisted asset grouping, policy simulation (with enforcement planned for early 2027), and Snort signatures mapped to MITRE ATT&CK for clearer alerts, aligned to IEC 62443, CISA Zero Trust and NIS2. The release extends Cisco's platform reach into industrial networks, bundling OT security with its switching footprint.", "type": "Product Update", "date": "2026-11-10", "source_url": "https://blogs.cisco.com/industrial-iot/cisco-cyber-vision-5-6-the-time-for-ot-protection-is-now"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cisco Launches 100G Top-of-Rack Nexus Switch for AI-Agent and Consolidated Server Traffic", "summary": "At Cisco Live Melbourne, Cisco introduced the N9348C8D-H2, a 1U top-of-rack switch with 48x 100G SFP-DD ports and 8x 400G QSFP-DD uplinks. Cisco argues server consolidation onto dual high-core-count CPUs, plus AI agents and automated networks, is overwhelming 25G-only TORs with east-west and north-south traffic. Cisco paired the launch with its Cisco Canvas agentic operations story and new scale-out data center hardware, positioning the network fabric as the foundation for agentic AI workloads.", "type": "Product Launch", "date": "2026-11-10", "source_url": "https://www.theregister.com/networks/2026/11/10/ye-olde-server-consolidation-has-made-cisco-push-top-of-rack-switching-to-100g/5308970"}]}, "CrowdStrike": {"category": "Platforms", "announcements": []}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler Surpasses $1 Billion in Total Contract Value Through Microsoft Marketplace", "summary": "Zscaler said it has passed $1 billion in lifetime total contract value transacted through Microsoft Marketplace, calling it a new phase of its Microsoft partnership. Zscaler frames the milestone as evidence that enterprises increasingly buy security through cloud marketplaces to draw down cloud commitments, simplify procurement and speed deployment, backed by deep technical integration and joint go-to-market. Zscaler will meet customers at Microsoft Ignite (Nov 17-20, San Francisco), signaling a heavy hyperscaler co-sell push into year end.", "type": "Partnership", "date": "2026-11-10", "source_url": "https://www.zscaler.com/blogs/partner/zscaler-surpasses-1-billion-total-contract-value-through-microsoft-marketplace"}]}, "Zscaler ~AI": {"category": "AI Security", "announcements": [{"title": "Commvault and Zscaler Partner to Govern and Recover Enterprise AI Agents", "summary": "Commvault announced a strategic partnership with Zscaler combining Zscaler's AI application discovery, runtime governance and inline policy enforcement with Commvault's data, application and identity recovery, including AgentRecover. The joint offering targets the full AI-agent lifecycle: discovering sanctioned and shadow AI, enforcing guardrails to prevent unauthorized agent activity and data exposure, and rapidly restoring systems after attacks or unintended agent actions. It extends Zscaler's AI security story from prevention into resilience through a partner ecosystem.", "type": "Partnership", "date": "2026-11-10", "source_url": "https://www.prnewswire.com/news-releases/commvault-announces-strategic-partnership-with-zscaler-to-help-enterprises-adopt-ai-with-confidence-control-and-resilience-302934264.html"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Named a Leader in The Forrester Wave: Enterprise Firewall Solutions, Q4 2026", "summary": "Check Point was named a Leader in Forrester's Q4 2026 Enterprise Firewall Wave, earning top scores in 15 of 26 criteria including advanced threat prevention, threat intelligence, cloud/containerized enforcement, performance and efficacy, and product security. Forrester cited its AI Network Firewall, Hybrid Mesh Network Security, agentic orchestration and Maestro Hyperscale Orchestrator, plus pricing flexibility and above-average customer feedback, and recommended Check Point for organizations with advanced AI use cases or complex firewall needs. Expect the report to appear in competitive deals against network-security and platform consolidation pitches.", "type": "Analyst Recognition", "date": "2026-11-10", "source_url": "https://www.checkpoint.com/press-releases/check-point-named-a-leader-in-enterprise-firewall-solutions/"}, {"title": "Check Point Research Exposes CopperDragon, a China-Nexus Espionage Tooling Supplier", "summary": "Check Point Research published CopperDragon, linking three China-nexus espionage clusters (SilentDelivery, OceanGate, DarkWire) across 21 countries to a shared 'digital quartermaster' supplying the Sparrow malware framework and infrastructure. The report details new Windows and Linux malware (SquadC, AnnobinDoor, SparrowShell), kernel-level capabilities, compromised internet-facing servers and watering-hole campaigns with fake certificate warnings, targeting government, telecom, military and critical infrastructure. CPR stresses segmentation and inspection of encrypted east-west traffic, reinforcing Check Point's prevention-first platform narrative.", "type": "Research", "date": "2026-11-10", "source_url": "https://blog.checkpoint.com/security/copperdragon-uncovering-a-global-china-nexus-cyber-espionage-framework/"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point Joins Westcon-Comstor Power Alliance with Extreme Networks to Sell AI Governance", "summary": "Westcon-Comstor launched a Power Alliance pairing Check Point's policy controls and security intelligence with Extreme Networks' AI-powered Extreme Platform ONE so channel partners can package AI governance solutions. A dedicated Check Point + Extreme sandbox in Westcon's demo environment lets partners test and demonstrate joint offerings. The move pushes Check Point's AI security story through distribution and bundles it with networking, a channel motion that competes for the same partner mindshare F5 targets with AI Guardrails.", "type": "Partnership", "date": "2026-11-10", "source_url": "https://channelpostmea.com/2026/11/10/westcon-comstor-launches-power-alliance-with-check-point-and-extreme-networks/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare CEO Calls AI Agent Optimization 'the New SEO' as OpenAI Pays for Page-Update Signals", "summary": "Following Q3 results, Matthew Prince described AI agent optimization as the new version of SEO, revealing that OpenAI now pays Cloudflare for signals that tell crawlers when pages change, cutting redundant fetches. The 'Act 4' business generated first revenue in Q3, though amounts and any publisher revenue share were not disclosed. Monetization Gateway and Pay Per Use, in beta since September 30, let sellers charge AI agents per request. Cloudflare is positioning its edge as the toll layer for agent traffic.", "type": "Strategy", "date": "2026-11-10", "source_url": "https://reachbrief.com/articles/cloudflare-s-act-4-bet-openai-pays-for-web-page-update-signals"}, {"title": "Cloudflare Workers AI to Retire 24 Models on November 20, Returning HTTP 410", "summary": "Cloudflare moved the retirement of 24 Workers AI models (16 text LLMs and 8 image, speech, vision and embedding models) from November 15 to November 20, 2026. After the cutoff, calls return HTTP 410 Gone (error 5028). Several models lack one-to-one replacements, and embedding swaps require regenerating vectors. The churn highlights operational risk for customers building inference on a single provider's hosted catalog, an opening for model-agnostic AI gateway and routing positioning.", "type": "Product Update", "date": "2026-11-10", "source_url": "https://nadali.media/en/articles/cloudflare-workers-ai-model-retirement-november/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare WAF Activates New 'Dangerous File Upload' Detection and Merges Directory Traversal Rule", "summary": "Cloudflare's scheduled November 10 WAF release turned on a new 'Generic Rules - Dangerous File Upload' managed detection (initially in Log mode) and merged its beta 'Broken Access Control - Directory Traversal' rule into the original rule. The update follows a November 3 release adding PHP out-of-memory CVE coverage and a phpMyAdmin authentication-bypass detection. Cloudflare continues weekly managed-rule cadence across Free and Managed Rulesets, a frequency customers compare against WAF signature update timelines.", "type": "Product Update", "date": "2026-11-10", "source_url": "https://developers.cloudflare.com/changelog/post/scheduled-waf-release/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Network Firewall Launches Next-Generation Firewall (NGFW) Policy Model", "summary": "AWS introduced an NGFW policy model for AWS Network Firewall that separates firewall and IPS rules so each scales independently, raising rule capacity and simplifying management. It supports deny-by-default authoring (such as allowed-domain lists), stateful evaluation with full connection context, managed IPS rule groups from AWS or AWS Marketplace partners with automatic updates, custom IPS groups, and embedded rule groups that draw capacity on demand. Existing policies keep working. NGFW policy is free in all commercial and GovCloud (US) Regions.", "type": "Product Launch", "date": "2026-11-10", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/network-firewall-launches-ngfw-policy/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Amazon Bedrock AgentCore Web Search API Now Generally Available", "summary": "AWS made the InvokeWebSearch API generally available in Amazon Bedrock AgentCore, giving applications and agent loops ranked web results with text extracts, plus optional title, URL and publication time, through one SDK/CLI call. Domain and publication-time filters are supported, along with IAM authentication, PrivateLink access from VPCs and CloudTrail logging. Pricing is $7 per 1,000 queries with no gateway charges. It is available in N. Virginia, Ohio, Oregon, Sydney, Tokyo and Ireland.", "type": "Product Launch", "date": "2026-11-10", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-bedrock-agentcore-web-search-api/"}, {"title": "Amazon Bedrock Adds bedrock-runtime Access for OpenAI Daybreak Cyber Models", "summary": "Amazon Bedrock now serves OpenAI's Daybreak models, Daybreak Red (GPT-5.6 Cyber) and Daybreak Blue (GPT-5.6 Sol), through the bedrock-runtime endpoint via US and Global cross-Region inference profiles. Daybreak Blue targets defensive work such as vulnerability discovery, detection engineering and incident response. Daybreak Red supports exploit reproduction and mitigation development under stricter identity verification. Access requires Daybreak enrollment with OpenAI and AWS account-team approval, and inference data is not used for training.", "type": "Product Update", "date": "2026-11-10", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/openai-gpt-daybreak-on-amazon-bedrock-runtime/"}, {"title": "Amazon ElastiCache Serverless Adds Vector, Full-Text and Hybrid Search for RAG", "summary": "ElastiCache Serverless for Valkey now supports vector, full-text and hybrid search plus server-side aggregations, with microsecond latency and up to 99% recall. Writes become searchable immediately, and multiple search types can be combined in one query. AWS positions it for retrieval-augmented generation, recommendations and product discovery on usage-based serverless caches. It is available in all commercial Regions, GovCloud (US) and the AWS European Sovereign Cloud on ElastiCache version 9 for Valkey.", "type": "Product Update", "date": "2026-11-10", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/amazon-elasticache-serverless-search-aggregations/"}]}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Akamai ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Akamai Functions Goes GA with SLA; Akamai Contributes Open-Source Agent Sandbox to Spin", "summary": "Akamai made Akamai Functions, its WebAssembly-based edge-native serverless platform, generally available with an enterprise SLA across 4,350+ edge locations. GA adds self-service sign-up via Akamai Control Center, Property Manager integration with Functions as an origin type, WASI world support, intelligent resource scheduling, Standard and Extended resource tiers, and per-application limits. Akamai pitches sub-millisecond cold starts, pay-per-execution billing and isolated execution for AI and agent workloads. It is also contributing Akamai Agent Sandbox building blocks, which run agent-generated code in isolated WebAssembly sandboxes, to the open-source Spin project, pushing its edge into AI agent compute against F5 Distributed Cloud and NGINX.", "type": "Product Launch", "date": "2026-11-10", "source_url": "https://www.akamai.com/blog/edge/webassembly-didnt-miss-the-moment-ai-was-just-late"}, {"title": "Akamai Prices $2.2B Convertible Notes to Fund AI Cloud Build-Out", "summary": "Akamai priced its $2.2B convertible senior notes offering: $1.1B of 1.00% notes due 2028 (initial conversion price about $112.41 per share) and $1.1B due 2031, with conversion premiums of roughly 40% and 27.5%. Proceeds fund Akamai's cloud and AI infrastructure push, which follows more than $14B in multi-year Cloud Infrastructure Services commitments, including an $11.6B Anthropic deal. AKAM rose about 3.5% intraday as pricing eased dilution concerns. Following the Nov 9 launch of the offering, it confirms Akamai is investing heavily in GPU and inference capacity to compete as an AI cloud, not just a CDN/security vendor.", "type": "Financial", "date": "2026-11-10", "source_url": "https://seekingalpha.com/news/4669696-akamai-prices-22b-convertible-note-offering"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": []}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "A10 Networks ~AI": {"category": "AI Security", "announcements": [{"title": "A10 Pitches TrojAI Red Teaming Plus Runtime Defense, Cites Fortune 50 AI Firewall Deployment", "summary": "A10 Networks presented 'Securing Enterprise AI \u2013 From Red Teaming to Runtime' at the IANS Virtual Forum on Nov 10, demonstrating TrojAI Detect for automated AI red teaming and TrojAI Defend against prompt injection, jailbreaks and data leakage in production. Same-day coverage of A10's record Q3 (revenue up 22.6% to $91.5M) cited AI security proof points: a Fortune 50 financial firm runs A10 AI Firewall across about 800 AI applications and 50,000 daily sessions, and another uses A10 for pre-production AI red teaming. Security is about 65% of product revenue, positioning A10 against F5 AI Guardrails and AI Red Team.", "type": "Event", "date": "2026-11-10", "source_url": "https://ciberseguridadtic.es/mercado/a10-networks-consolida-su-crecimiento-y-empieza-a-materializar-su-apuesta-por-la-seguridad-de-ia-2026111014384.htm"}]}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Security Advisory 0207: Unauthenticated BGP Flaw Can Reset Sessions Across EOS Trains", "summary": "Arista disclosed CVE-2026-120982 (CVSS 8.7) in EOS. An unauthenticated BGP peer can send crafted messages that trigger repeated BGP session resets and disrupt traffic. The flaw affects EOS 4.33.x through 4.36.x (up to 4.36.2F) and all end-of-support trains on platforms running BGP with the multi-agent routing model, including CloudEOS. No hotfix is available. Fixes ship in 4.37.0F, 4.36.3M, 4.35.7M, 4.34.9M and 4.33.11M. Interim mitigations are to discard BGP attribute type 22 globally or to enable TCP-AO neighbor authentication. The advisory lands days after Arista's record Q3 and hits the routing layer of its AI and data center fabrics.", "type": "Security Advisory", "date": "2026-11-10", "source_url": "https://www.arista.com/en/support/advisories-notices/security-advisory/25029-security-advisory-0207"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": []}};

  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
