"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Launches PAN-OS 12.2 'Ceres' with Advanced Virtual Patching", "summary": "Palo Alto Networks released PAN-OS 12.2 Ceres, a major platform release built for AI-accelerated threats. Advanced Virtual Patching uses frontier AI to discover undisclosed vulnerabilities and push protections within hours, while Advanced IP Defense blocks attacker infrastructure using telemetry from 70,000+ customers. Ceres also adds quantum-safe certificate automation, Prisma AIRS AI and agent security, and browser-to-firewall integration for Layer 7 protection without endpoint decryption. The company will demo the release at its InterSECt 2026 virtual conference on August 19-20.", "type": "Product Launch", "date": "2026-08-04", "source_url": "https://www.paloaltonetworks.com/blog/2026/08/redefining-network-security-for-the-frontier-ai-era/"}, {"title": "FireMon Integrates with Palo Alto Networks for Hybrid Security Policy Governance", "summary": "FireMon announced an integration with Palo Alto Networks to help enterprises strengthen security policy governance across hybrid environments. The tie-up gives joint customers unified visibility, rule analysis, and compliance reporting spanning Palo Alto firewalls and other estate components. It reinforces Palo Alto's platform ecosystem strategy by extending policy management and audit capabilities across on-premises, cloud, and hybrid deployments.", "type": "Partnership", "date": "2026-08-04", "source_url": "https://www.marketminute.com/article/bizwire-2026-8-4-firemon-integrates-with-palo-alto-networks-to-help-enterprises-strengthen-security-policy-governance-across-hybrid-environments"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Unit 42 Publishes 'Frontier AI Vulnerability Burst' Research on Autonomous Zero-Day Discovery", "summary": "Palo Alto Networks' Unit 42 released research showing frontier AI models are industrializing zero-day discovery in open-source software. The team built NOVA, an autonomous vulnerability analyzer that used frontier models to surface thousands of previously unknown flaws across open-source projects, demonstrating attackers can compress the patch window from months to hours. The findings underpin the company's push toward AI-driven virtual patching and prevention-first defense.", "type": "Research", "date": "2026-08-04", "source_url": "https://unit42.paloaltonetworks.com/frontier-ai-vulnerability-burst/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "FortiGuard Labs Details QuickFox Supply Chain Attack Deploying FDMTP Implant", "summary": "Fortinet's FortiGuard Labs published threat research on a long-running supply chain compromise of the QuickFox VPN/proxy application. A trojanized Windows installer used a modified Electron renderer HTML file to fetch a JavaScript loader, which fingerprinted the host before deploying an FDMTP implant for persistent command-and-control. Infections trace back to mid-2025, with multiple staging domains and C2 endpoints still active at disclosure. Mac builds showed modified files but execution guardrails limited impact to Windows endpoints.", "type": "Research", "date": "2026-08-04", "source_url": "https://www.fortinet.com/blog/threat-research/quickfox-supply-chain-attack-used-to-deploy-fdmtp-implant"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Tenable and Cisco Partner to Streamline Enterprise Exposure Management", "summary": "Tenable and Cisco announced a partnership to streamline enterprise exposure management, connecting Tenable's vulnerability and exposure data with Cisco's security platform. The integration is intended to give joint customers consolidated risk visibility and faster prioritization across networks, endpoints, and cloud assets. It extends Cisco's platform consolidation strategy by folding third-party exposure intelligence into its unified security operations workflow.", "type": "Partnership", "date": "2026-08-04", "source_url": "https://techafricanews.com/2026/08/04/tenable-and-cisco-partner-to-streamline-enterprise-exposure-management/"}]}, "Cisco ~AI": {"category": "AI Security", "announcements": [{"title": "Cisco Unveils Antares, a Family of Open-Weight Small Language Models for AI Security", "summary": "Cisco announced Antares, a family of specialized small-language-model security tools aimed at making secure AI accessible beyond organizations with frontier-AI budgets. The first two models ship as open weights on Hugging Face and are designed to be deployed locally and evaluated against open benchmarks. Cisco positions Antares as an affordable alternative to frontier models for finding vulnerabilities in code and systems, and as a first step toward community-integrated, specialized AI security tooling.", "type": "Product Launch", "date": "2026-08-04", "source_url": "https://newsroom.cisco.com/c/r/newsroom/en/us/a/y2026/m08/cisco-antares-helping-to-make-ai-secure-for-all.html"}, {"title": "Cisco Talos: Adversaries Weaponizing Claude Code, Codex, Cursor and Gemini", "summary": "Cisco Talos published a data-driven report showing threat actors are abusing cloud-based AI coding assistants including Claude Code, Codex, Cursor, and Gemini to build malware, automate campaigns, and hunt vulnerabilities. Researchers harvested prompt logs from compromised endpoints, finding attackers routinely defeat model guardrails with simple jailbreak framing and sometimes run on corporate infrastructure using stolen enterprise API tokens. Talos concludes model-level safety controls are insufficient and urges layered defenses around AI tool usage.", "type": "Research", "date": "2026-08-04", "source_url": "https://blog.talosintelligence.com/keep-going-bro-youve-got-this-a-data-driven-look-at-how-adversaries-are-weaponizing-ai/"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cisco Introduces Cisco Compatible Solutions for AI Ecosystem Program", "summary": "Cisco launched Cisco Compatible Solutions for AI, a validated ecosystem program pairing Cisco infrastructure, including Intel-powered compute and AI PODs, with a growing roster of independent software vendors. The program gives enterprises a tested, interoperable AI stack rather than requiring them to assemble disparate integrations, and supports deployments across edge, scalable AI PODs, and distributed environments. Cisco frames it as a response to rising pressure for measurable AI ROI and faster time-to-value on production AI infrastructure.", "type": "Announcement", "date": "2026-08-04", "source_url": "https://blogs.cisco.com/news/your-ai-strategy-needs-a-trusted-ecosystem-enter-cisco-compatible-solutions-for-ai"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Falcon Fund Invests in Above Security for AI-Driven Insider Risk", "summary": "Above Security announced a strategic investment from the CrowdStrike Falcon Fund to advance AI-driven insider risk investigations. The funding supports Above Security's mission to democratize elite insider risk management, bringing behavioral investigation capabilities into the Falcon ecosystem. For CrowdStrike, the deal extends the Falcon platform into insider threat detection, an area increasingly tied to identity, SaaS, and AI tool misuse, and continues its strategy of using the Falcon Fund to expand platform adjacencies without full acquisitions.", "type": "Funding", "date": "2026-08-04", "source_url": "https://www.prnewswire.com/news-releases/above-security-announces-strategic-investment-from-the-crowdstrike-falcon-fund-furthering-its-mission-to-democratize-elite-insider-risk-management-302842676.html"}, {"title": "CrowdStrike Announces Date of Fiscal Second Quarter 2027 Financial Results", "summary": "CrowdStrike issued an investor notice setting the date for its fiscal second quarter 2027 financial results, including the earnings release timing and accompanying conference call and webcast details. The announcement gives investors a fixed checkpoint on Falcon platform ARR growth and module adoption, which analysts are watching closely amid competitive pressure in the consolidated security platform market.", "type": "Earnings", "date": "2026-08-04", "source_url": "https://ir.crowdstrike.com/news-releases/news-release-details/crowdstrike-announces-date-fiscal-second-quarter-2027-financial"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler Named a Leader in Both 2026 Gartner Magic Quadrants for SASE Platforms and SSE", "summary": "Zscaler announced it was named a Leader in Gartner's 2026 Magic Quadrant for SASE Platforms, its first year in that quadrant, and a Leader in the 2026 Magic Quadrant for Security Service Edge for the fifth consecutive year. The company credited its cloud-native, proxy-based Zero Trust SASE architecture, in-line inspection of 100% of encrypted traffic at scale, and its new ZAgent Framework for agentic AI in SASE management. CEO Jay Chaudhry emphasized securing users, devices, workloads, and AI agents anywhere.", "type": "Award", "date": "2026-08-04", "source_url": "https://www.zscaler.com/press/zscaler-recognized-leader-both-2026-gartner-magic-quadrant-sase-platforms-and-sse-2026"}, {"title": "Zscaler Pushes On-Premises DSPM for Data Security in the AI Era", "summary": "Zscaler published product guidance urging enterprises to modernize on-premises data security with Data Security Posture Management. The company argues many organizations cannot migrate all sensitive data to the cloud quickly, leaving on-prem estates exposed as AI tools broaden data access. Zscaler positions DSPM as a bridge architecture that discovers, classifies, and governs sensitive data wherever it resides, extending its data protection footprint beyond cloud-delivered inspection.", "type": "Announcement", "date": "2026-08-04", "source_url": "https://www.zscaler.com/blogs/product-insights/prem-data-security-ai-era-why-it-s-time-modernize-dspm"}]}, "Zscaler ~AI": {"category": "AI Security", "announcements": [{"title": "Zscaler Joins CSAI Foundation as a Vanguard Member Alongside Qualys and Rubrik", "summary": "Zscaler joined the CSAI Foundation as a Vanguard Member together with Qualys and Rubrik. The foundation brings security vendors together to establish shared standards and practices for securing AI systems and AI-driven operations. Membership positions Zscaler in a cross-industry effort to shape AI security governance and interoperability, complementing its own zero trust controls for AI agents and AI application traffic.", "type": "Partnership", "date": "2026-08-04", "source_url": "https://www.financialcontent.com/article/bizwire-2026-8-4-qualys-rubrik-and-zscaler-join-csai-foundation-as-vanguard-members"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Named a Visionary Leader in the 2026 Frost Radar for Enterprise Risk Mitigation Platforms", "summary": "Frost & Sullivan named Check Point a Visionary Leader in its 2026 Frost Radar for Enterprise Risk Mitigation and Management Platforms, awarding it the highest Growth Index score among 15 vendors evaluated. Analysts credited Check Point's integrated platform combining attack surface management, cyber threat intelligence and digital risk protection with built-in exposure prioritization and safe remediation, backed by ThreatCloud AI and CAASM. Check Point also received Frost & Sullivan's Best Practices Customer Value Leadership Award.", "type": "Award", "date": "2026-08-04", "source_url": "https://www.prnewswire.com/news-releases/check-point-software-named-a-visionary-leader-in-the-2026-frost-radar-for-enterprise-risk-mitigation-and-management-platforms-302840981.html"}, {"title": "Check Point Warns of High-Severity Authentication Bypass Vulnerability", "summary": "Check Point issued a warning about a high-severity authentication bypass vulnerability that could allow attackers to gain full management-level access to affected systems. The advisory urges administrators to apply the available fix promptly given the potential for complete administrative compromise. Coverage of the disclosure appeared on August 4, 2026.", "type": "Security Advisory", "date": "2026-08-04", "source_url": "https://cybercory.com/2026/08/04/check-point-warns-of-high-severity-authentication-bypass-that-could-give-attackers-full-ma"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "The Agent Development Lifecycle Arrives on Cloudflare", "summary": "Cloudflare announced the Agent Development Lifecycle (ADLC), extending agents beyond code generation into the full software delivery lifecycle. New primitives include Workflows for orchestrating multi-step processes and Artifacts as a storage layer for code and outputs, plus @cloudflare/ci for running CI/CD across millions of repositories on Cloudflare's platform. The move stakes out a broader platform position, letting autonomous agents build, ship and maintain software end to end on Cloudflare infrastructure.", "type": "Product Launch", "date": "2026-08-04", "source_url": "https://blog.cloudflare.com/agent-development-lifecycle/"}]}, "Cloudflare ~AI": {"category": "AI Security", "announcements": [{"title": "Cloudflare Gives AI Agents an Identity and a Wallet with Cloudflare Wallets and cloudflare.pay", "summary": "Cloudflare launched Cloudflare Wallets and cloudflare.pay, giving every account a stable web identity that can be extended to individual AI agents. An Account Wallet holds stablecoins, while Virtual Wallets assigned to agents enforce human-set guardrails: spending caps, approved merchant lists and maximum transaction sizes. Paired with Cloudflare's Monetization Gateway, it completes a two-sided agentic commerce market where agents can autonomously buy APIs, MCP tools and content. Handle reservations opened immediately; full funding and Virtual Wallet issuance roll out over the coming months.", "type": "Product Launch", "date": "2026-08-04", "source_url": "https://www.cloudflare.com/press/press-releases/2026/cloudflare-gives-ai-agents-an-identity-and-a-wallet/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Introducing Cloudflare Agents: A Unified Interface for Deploying and Observing Agents at Scale", "summary": "Cloudflare introduced Cloudflare Agents, a unified interface for deploying, managing and observing agent sessions at scale on Cloudflare's global network. The offering consolidates agent runtime, session management and observability into a single control surface, positioning Cloudflare's edge compute as the execution fabric for production AI agents. It complements Cloudflare's broader agentic push announced the same day, including Wallets and the Agent Development Lifecycle.", "type": "Product Launch", "date": "2026-08-04", "source_url": "https://blog.cloudflare.com/agents-on-cloudflare/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Security Hub Extended Adds Supply Chain Security as Its 10th Category", "summary": "AWS added Supply Chain Security as the tenth category in Security Hub Extended, onboarding Chainguard and Socket as curated partners to detect and block malicious dependencies before they enter builds. The addition brings the Extended lineup to 23 curated partner solutions, all available under pay-as-you-go pricing on a single AWS bill. Findings from participating solutions are emitted in Open Cybersecurity Schema Framework format and aggregated in Security Hub, reinforcing AWS's consolidation of third-party security tooling into one native platform.", "type": "Product Launch", "date": "2026-08-04", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-security-hub-extended-adds-supply-chain-security/"}, {"title": "AWS Launches Kiro Crew, an Autonomous Agentic Orchestrator for 24/7 Code Development", "summary": "AWS launched Kiro Crew, an autonomous agentic orchestrator designed to run continuous, round-the-clock software development work. The service coordinates multiple AI coding agents against development tasks without constant human supervision, extending AWS's Kiro developer tooling into fully autonomous operation. It underscores AWS's push to make agentic workflows a native layer of its cloud platform rather than a bolt-on developer utility.", "type": "Product Launch", "date": "2026-08-04", "source_url": "https://siliconangle.com/2026/08/04/aws-launches-kiro-crew-autonomous-agentic-orchestrator-24-7-code-development/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Amazon Bedrock Launches Web Search for OpenAI GPT Models", "summary": "AWS made Web Search generally available on Amazon Bedrock, a built-in server-side tool that grounds foundation model outputs in current web knowledge. It supports GPT-5.4, GPT-5.5 and GPT-5.6 variants, enabled through a single API parameter with no third-party search provider or extra keys. Grounding runs entirely inside AWS with zero data egress and CloudTrail audit trails, drawing on Amazon's web index of tens of billions of documents plus a knowledge graph. Available in US East (N. Virginia), US East (Ohio) and US West (Oregon).", "type": "Product Launch", "date": "2026-08-04", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-bedrock-web/"}]}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Networks Reports First $3 Billion Quarter in Q2 2026 Results", "summary": "Arista reported Q2 2026 revenue of $3.036 billion, up 37.7% year over year and its first $3 billion quarter, with non-GAAP operating margin of 49.9% and non-GAAP EPS of $1.02. The company guided Q3 revenue to roughly $3.3 billion, well above consensus, citing AI-driven networking demand and its Arista 2.0 platform strategy spanning data center to campus. It also noted Gartner Magic Quadrant Leader recognition for Enterprise Wired and Wireless LAN.", "type": "Earnings", "date": "2026-08-04", "source_url": "https://investor.wedbush.com/wedbush/article/bizwire-2026-8-4-arista-networks-inc-reports-second-quarter-2026-financial-results"}, {"title": "Arista Details 1.6 Tbps Etherlink AI Fabrics and Open Co-Packaged Optics Direction", "summary": "Alongside Q2 results, Arista highlighted its 1.6 Tbps Etherlink 7060XE7 series for AI fabrics, delivering up to 100 Tbps system bandwidth with liquid-cooled options and Linear Pluggable Optics that cut interconnect power roughly 60%. Executives outlined scale-up, scale-out and scale-across AI fabric designs, including multi-planar leaf-spine topologies, and signaled a move toward open co-packaged optics for next-generation AI data center networking.", "type": "Product Launch", "date": "2026-08-04", "source_url": "https://convergedigest.com/arista-q2-2026-ai-networking-scale-across-1-6t/"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": []}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "NetScaler ADC and Gateway Security Bulletin Covers Six New CVEs Including HTTP/2 DoS", "summary": "Citrix published bulletin CTX696604 disclosing six vulnerabilities in NetScaler ADC and NetScaler Gateway, including CVE-2026-13474, an HTTP/2 denial-of-service flaw scored 8.7, and CVE-2026-8451, a SAML IDP memory overread scored 8.8. Affected builds include 14.1 before 14.1-72.61 and 13.1 before 13.1-63.18, plus FIPS and NDcPP variants. Citrix urges customer-managed deployments to upgrade immediately; cloud-managed services are patched by Citrix.", "type": "Security Advisory", "date": "2026-08-04", "source_url": "https://support.citrix.com/external/article/CTX696604"}, {"title": "Citrix Publishes Edge Hardening Guidance for NetScaler Appliances", "summary": "A Citrix blog post urged customers to assume compromise at the edge and harden internet-facing NetScaler ADC and Gateway deployments. Recommendations include enabling file integrity monitoring to detect webshells and configuration drift, externalizing syslog, WAF and gateway telemetry to a hardened SIEM, synchronizing trusted time sources across devices, and configuring real-time alerts for unexpected admin shell access or unusual outbound traffic. The guidance reinforces detection and response rather than introducing new product features.", "type": "Announcement", "date": "2026-08-04", "source_url": "https://www.citrix.com/blogs/2026/08/04/containing-threat-actors-at-the-edge/"}]}, "A10 Networks ~AI": {"category": "AI Security", "announcements": [{"title": "A10 Networks Promotes TrojAI-Powered AI Security at Black Hat USA 2026", "summary": "A10 Networks spotlighted its AI security portfolio with newly acquired TrojAI at Black Hat USA 2026, showcasing full-lifecycle protection from pre-deployment red teaming to runtime defense for agentic workflows. Shares rose about 1.5% to roughly $30 on the day, with 17 of 26 analysts rating the stock a buy and a median target of $32. Investors were positioning ahead of A10's Q2 2026 results, scheduled for August 5.", "type": "Announcement", "date": "2026-08-04", "source_url": "https://tradersunion.com/news/companies/show/2885571-a10-networks-stock-up-1-5percent/"}]}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware Named Most Valuable Pioneer in QKS Group's 2026 AI Maturity Matrix for WAAP", "summary": "Radware was named Most Valuable Pioneer in QKS Group's 2026 AI Maturity Matrix for Web Application and API Protection. The designation credits Radware's AI-first architecture for embedding AI across visibility, detection and autonomous response rather than bolting it on at the perimeter. QKS evaluated AI integration in product architecture, governance and business outcomes, highlighting behavioral intelligence, intent-based enforcement and AI SOC Xpert automation protecting web apps, APIs, bots, LLM abuse and agentic attack surfaces across multi-cloud environments.", "type": "Award", "date": "2026-08-04", "source_url": "https://www.prnewswire.com/news-releases/radware-recognized-as-the-most-valuable-pioneer-in-qks-groups-ai-maturity-matrix-for-web-application-and-api-protection-2026-302842410.html"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Research: Malware Signing - When Trust Becomes an Attack Surface", "summary": "Barracuda published threat research examining how attackers abuse code-signing certificates to make malware appear legitimate and bypass trust-based security controls. The analysis explains how stolen, fraudulently obtained or misused signing certificates turn a foundational trust mechanism into an attack surface, and outlines detection and defensive considerations for organizations relying on signature validation.", "type": "Research", "date": "2026-08-04", "source_url": "https://blog.barracuda.com/2026/08/04/malware-signing--when-trust-becomes-an-attack-surface"}]}, "Barracuda Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Barracuda Red Team Shows AI-Enabled Email Accounts Are the Next Insider Threat", "summary": "Barracuda published red-team research demonstrating how a compromised Microsoft Copilot-enabled mailbox becomes a potent insider threat. In the controlled proof-of-concept, attackers used the AI assistant to map org structure, hide sign-in alerts via inbox rules, mimic the CEO's writing style, and drive wire-transfer fraud before deleting evidence. Barracuda's conclusion: AI assistants grant no new privileges but massively increase the speed, scale and credibility of exploiting existing access, requiring monitoring, containment kill switches and layered defenses.", "type": "Research", "date": "2026-08-04", "source_url": "https://blog.barracuda.com/2026/08/04/ai-enabled-email-accounts-insider-threat"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "Thales Launches Imperva for AWS to Protect Applications and APIs on AWS Marketplace", "summary": "Thales launched Imperva for AWS, a SaaS web application firewall deployed natively on Amazon CloudFront and sold pay-as-you-go through AWS Marketplace. Traffic stays inside the AWS network, delivering enterprise-grade protection for web apps, APIs and client-side code with no added latency. The offering gives security teams centralized visibility and policy management across AWS and multi-cloud estates, simplifying onboarding and cutting operational overhead for regulated organizations facing rising automated bot and API attacks.", "type": "Product Launch", "date": "2026-08-04", "source_url": "https://www.imperva.com/company/press_releases/thales-launches-imperva-for-aws-to-help-organizations-protect-applications-and-apis/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": [{"title": "HiddenLayer Unveils Agent Harness Security to Protect AI-Powered Software Development at Runtime", "summary": "HiddenLayer launched Agent Harness Security, extending its AI Security Platform with inline runtime protection for AI coding agents. The product gives visibility across prompts, tool calls, shell commands, file edits and repo interactions, redacting secrets before models see them, steering agents away from poisoned tool responses and blocking unsafe command execution. It targets prompt injection, sensitive data exposure and unsafe actions without interrupting developers, using content shaping rather than hard blocks. Available now as a stand-alone solution for developer environments.", "type": "Product Launch", "date": "2026-08-04", "source_url": "https://cioinfluence.com/security/hiddenlayer-unveils-agent-harness-security-to-protect-ai-powered-software-development-at-runtime/"}]}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}};

      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
