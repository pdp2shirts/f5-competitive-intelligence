(function(){
"use strict";
var DATA={"Fortinet": {"category": "Platforms", "announcements": [{"title": "CBTS and Fortinet Launch Fully Managed Secure Networking Service for Mid-Market Organizations", "summary": "CBTS and Fortinet launched CBTS Fortinet Managed Services. The fully managed service puts firewalls, switching, wireless and SD-WAN on one Fortinet platform, and CBTS designs, deploys and runs it. It targets mid-market companies with many sites that need stronger security without hiring more IT staff. CBTS engineers manage it 24x7 for one monthly subscription that includes hardware refresh. It is available now across North America.", "type": "Partnership", "date": "2026-10-20", "source_url": "https://www.cbts.com/newsroom/cbts-and-fortinet-launch-fully-managed-secure-networking-service-for-growing-mid-market-organizations"}, {"title": "Critical FortiSIEM Flaw Gets Public Exploit PoC for Unauthenticated Remote Code Execution", "summary": "Researchers published a proof-of-concept exploit for a critical FortiSIEM flaw, CVE-2026-106173 (CVSS 9.4). It is an unauthenticated path-traversal bug in FortiSIEM's gRPC service on port 27918. Attackers can use it to overwrite files and run code remotely, for example by tampering with Redis health-check scripts that cron runs. Fortinet has released patches: FortiSIEM 7.5.0 users should upgrade to 7.5.1 or later. Version 7.6 is not affected.", "type": "Research", "date": "2026-10-20", "source_url": "https://thehackernews.com/2026/10/critical-fortisiem-flaw-gets-public.html"}]}, "Cisco ~AI": {"category": "AI Security", "announcements": [{"title": "Cisco AI Defense and Workday Agent Passport Bring Trust to Enterprise AI Agents", "summary": "Cisco is combining Cisco AI Defense with Workday Agent Passport to build trust and safety into enterprise AI agents. Agent Passport is now in Early Access. It gives each agent a signed, auditable record of what was verified, who verified it and which standards were used. Cisco AI Defense runs adversarial tests to issue security stamps for agents. Together they aim to secure agents from development through production.", "type": "Partnership", "date": "2026-10-20", "source_url": "https://blogs.cisco.com/ai/building-trust-into-enterprise-ai-agents-cisco-ai-defense-and-workday-agent-passport"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Splunk State of Observability 2026: Avoiding the Hidden Costs of AI Agents", "summary": "Cisco released its sixth annual Splunk State of Observability report, based on a survey of 2,050 ITOps and engineering professionals. It finds that companies are deploying AI agents faster than they can monitor them. 55% cannot control AI costs, and 60% report unexpected billing spikes. Production AI agents produce 4-5x more telemetry than traditional apps. 81% say monitoring AI workloads has increased collaboration with security teams, which supports Cisco's pitch for a single observability and security platform.", "type": "Research", "date": "2026-10-20", "source_url": "https://newsroom.cisco.com/c/r/newsroom/en/us/a/y2026/m10/splunk-state-of-observability-2026-avoiding-the-hidden-costs-of-ai-agents.html"}, {"title": "Cisco and Schneider Electric Unveil Digital Spine for Autonomous Buildings", "summary": "Cisco and Schneider Electric announced a joint Digital Spine solution in APJC that connects IT, OT and IoT so buildings can run autonomously. Edge processing handles responses locally. The companies claim up to about 20% lower HVAC energy use, up to 50% fewer truck rolls and up to 35% lower unplanned service costs. Security is built in with Cisco and Splunk tools for unified IT/OT visibility, micro-segmentation and continuous monitoring, aligned with SOCI, Essential Eight and IEC 62443.", "type": "Partnership", "date": "2026-10-20", "source_url": "https://news-blogs.cisco.com/apjc/2026/10/20/digital-spine-for-autonomous-buildings/"}, {"title": "Cisco Launches OT Security Practitioner Certification and Cisco Modeling Labs 2.11", "summary": "Cisco made two related announcements. The first is a new OT Security Practitioner certification that covers both IT and OT security skills for industrial environments. The second is Cisco Modeling Labs 2.11, launching November 11, 2026. It adds Kali Linux support for testing defenses, single sign-on through OIDC/OAuth2, cluster support for wireless nodes, and a Download All Labs feature.", "type": "Product Launch", "date": "2026-10-20", "source_url": "https://blogs.cisco.com/learning/ot-security-cml"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Achieves UK NCSC CIR Enhanced Level Assurance", "summary": "CrowdStrike reached the Enhanced Level of the UK National Cyber Security Centre's Cyber Incident Response (CIR) scheme, its highest assurance level. It builds on the Standard Level CrowdStrike already held. The government-backed validation confirms the company can respond to the most severe breaches, including nation-state attacks, in large, multinational and regulated environments. CrowdStrike now offers a CIR Enhanced Level retainer that gives UK organizations priority incident response access.", "type": "Event", "date": "2026-10-20", "source_url": "https://www.crowdstrike.com/en-us/blog/crowdstrike-achieves-uk-ncsc-cir-enhanced-level-assurance/"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike Joins Industry Ecosystem Supporting Fortanix Confidential AI", "summary": "CrowdStrike joined an industry ecosystem that supports Fortanix Confidential AI. The platform runs AI workloads on Kubernetes inside hardware-based Trusted Execution Environments, which protect data and models while they are processed. The aim is to let enterprises in regulated sectors use frontier AI models without risking data privacy or intellectual property.", "type": "Partnership", "date": "2026-10-20", "source_url": "https://fiscal.ai/company/NASDAQ_CRWD/news/2026-10-20/crowdstrike-joins-industry-ecosystem-supporting-fortanix-confidential-ai/"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "More than 10 Million Developers Are Building on Cloudflare as AI Agents Reshape Application Development", "summary": "Cloudflare says more than 10 million developers now build on its platform, up from 7.4 million. It ties the growth to AI-native, agent-driven development. Cloudflare reports that daily AI-agent traffic grew more than 1,700% year over year and that over half of Internet traffic is now non-human. The release presents Workers, Workers AI, AI Gateway, R2, KV, D1 and Durable Objects as one full-stack platform to build, secure, observe and scale apps for people and agents. The announcement came during Cloudflare Connect 2026.", "type": "Product Launch", "date": "2026-10-20", "source_url": "https://www.cloudflare.com/press/press-releases/2026/more-than-10-million-developers-are-building-on-cloudflare/"}, {"title": "8 eMudhra Certificates Compromised: Cloudflare Details Mitigations Across Zero Trust, WARP, Tunnel and CDN", "summary": "On October 19, Cloudflare learned that the private keys for eight eMudhra intermediate certificates had been compromised, which could let attackers forge certificates for any domain. Cloudflare says it has seen no active exploitation on its services. By October 20 it had shipped patched Cloudflare One/WARP and cloudflared clients and fully deployed CDN and Zero Trust mitigations. It advises customers to upgrade clients, review mTLS trust stores and origin TLS settings, and rebuild affected container images.", "type": "Research", "date": "2026-10-20", "source_url": "https://blog.cloudflare.com/emudhra-certificate-compromise/"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Reply to All Now Available for Check Point Encrypted Emails", "summary": "Check Point added Reply to All to Check Point Email Encryption, part of its Avanan email security line. Recipients of emails encrypted by a DLP policy can now reply to every recipient instead of only the original sender. The conversation stays end-to-end protected and readable only by authenticated users. The feature is rolling out gradually and should reach all customer portals within seven days.", "type": "Feature Update", "date": "2026-10-20", "source_url": "https://blog.checkpoint.com/product-updates/reply-to-all-now-available-for-encrypted-emails/"}]}, "Check Point Software ~AS": {"category": "Application Security", "announcements": [{"title": "Check Point Research: AI-Powered Antidetect Browsers Are Scaling Online Fraud and Account Takeovers", "summary": "Check Point Research says antidetect browsers such as AdsPower, MultiLogin and Kameleo, combined with AI, let attackers run thousands of browser identities that look like real users, devices and locations. Criminals use them for account takeover, payment fraud and coordinated influence operations, helped by automation templates and Model Context Protocol integrations. Check Point urges defenders to look past single-account behavior to infrastructure signals: residential proxies, WebRTC anomalies, cookie injection and session-continuity breaks.", "type": "Research", "date": "2026-10-20", "source_url": "https://blog.checkpoint.com/security/antidetect-browsers-how-ai-is-scaling-online-fraud-and-account-takeovers/"}]}, "AWS ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Amazon ECS Gateway: A Fully Managed Ingress Solution for ECS Services", "summary": "AWS launched Amazon ECS Gateway, a managed ingress layer that provisions and manages Application Load Balancers, ACM certificates, listener rules, target groups and security groups for ECS services. Platform teams set networking standards (subnets, TLS, WAF) once per gateway, and application teams opt in per service. It supports host-based routing and up to 25 services per shared ALB. The gateway itself is free; customers pay for the underlying ALB and other resources. It is available in all commercial Regions.", "type": "Product Launch", "date": "2026-10-20", "source_url": "https://aws.amazon.com/blogs/aws/introducing-amazon-ecs-gateway-a-fully-managed-ingress-solution-for-ecs-services/"}]}, "AWS ~AI": {"category": "AI Security", "announcements": [{"title": "Amazon Bedrock Guardrails Adds Standard Tier for Contextual Grounding Checks", "summary": "Amazon Bedrock Guardrails added a Standard tier for contextual grounding checks. It extends hallucination detection beyond summarization and Q&A to conversational content and reasoning over sources. AWS says it handles varied phrasings better and supports more languages. Customers choose the tier per guardrail in the console or API; existing guardrails stay on Classic until upgraded, and pricing is the same for both tiers. The Standard tier requires cross-Region inference with a guardrail profile.", "type": "Feature Update", "date": "2026-10-20", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/bedrock-guardrails-grounding-standard/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": [{"title": "HiddenLayer Unifies AI Security Policy Across AWS, Azure and Databricks", "summary": "HiddenLayer's platform now finds models and agents across Amazon Bedrock, SageMaker, Azure AI Foundry/ML and Databricks Unity Catalog, and puts them in one inventory. Security teams can then apply a single policy from development through production. The release includes AI Supply Chain Security model scanning in CI/CD pipelines, AI Attack Simulation, and AI Runtime Security with a default policy for prompt-injection detection and data redaction. It integrates with LiteLLM, Azure API Management, LangChain and the OpenAI Agents SDK.", "type": "Feature Update", "date": "2026-10-20", "source_url": "https://www.hiddenlayer.com/insight/multi-cloud-ai-security-aws-azure-databricks"}]}, "Operant AI": {"category": "AI Security", "announcements": [{"title": "Operant AI Positions Agent Protector Against 'Dollar Exfiltration' in Agentic Holiday Commerce", "summary": "Operant AI is pitching Agent Protector as a real-time governance layer for AI agent payments over the x402, MPP and AP2 protocols ahead of the 2026 holiday shopping season. Features include task-aware payment gating, controls on which MCP servers, networks and destinations agents can pay, spending caps per agent, team or asset, and intent checks for prompt injection, task drift and runaway loops. It keeps audit logs of decisions without holding wallet keys.", "type": "Feature Update", "date": "2026-10-20", "source_url": "https://www.operant.ai/art-kubed/dollar-exfiltration-season-is-your-business-ready-for-the-first-agentic-holiday"}]}, "Pillar Security": {"category": "AI Security", "announcements": [{"title": "Pillar Security Publishes CISO Buyer's Guide for AI Agent Endpoint Security", "summary": "Pillar Security published a buyer's guide for evaluating security for AI coding agents and desktop assistants on employee devices. It splits the market into three layers: configuration posture, runtime observability and runtime enforcement. It advises testing vendors on real developer traffic in monitor mode, and asking them to disclose what they cannot detect. It also gives a weighted scoring model that puts detection coverage and precision first. Pillar presents its own platform as covering all three layers.", "type": "Research", "date": "2026-10-20", "source_url": "https://www.pillar.security/blog/how-to-evaluate-endpoint-security-for-ai-agents"}]}, "Mindgard": {"category": "AI Security", "announcements": [{"title": "Mindgard and Lancaster University Release kNNGuard, a Training-Free AI Guardrail", "summary": "Mindgard and Lancaster University released kNNGuard, which flags unsafe, off-topic and adversarial prompts using a frozen LLM's internal activations and a small labeled set of example prompts, with no fine-tuning. Across six domains, including jailbreaks and prompt injection, it reported the best average F1 score (87.4%) at about 47 ms per prompt. That is faster than NVIDIA's Nemotron guard models. The work was presented at CAMLIS 2026.", "type": "Research", "date": "2026-10-20", "source_url": "https://mindgard.ai/resources/knnguard-a-training-free-guardrail-for-adaptive-ai-defense"}]}, "Akamai ~P": {"category": "Platforms", "announcements": [{"title": "FireMon Integrates Akamai Guardicore Segmentation into Its Policy Control Plane", "summary": "FireMon announced an integration with Akamai Guardicore Segmentation. The integration brings Guardicore's microsegmentation policy into FireMon's normalized policy control plane, which gives one place to govern, validate changes and audit policy across segmentation, firewalls and cloud security groups. Guardicore still enforces the policy. FireMon governs the policy above it, so organizations can keep Zero Trust policy consistent across multi-vendor environments.", "type": "Partnership", "date": "2026-10-20", "source_url": "https://www.firemon.com/press/akamai-guardicore-segmentation-integration"}, {"title": "Raymond James Upgrades Akamai to Strong Buy, Citing Anthropic Cloud Deal", "summary": "Raymond James upgraded Akamai from Outperform to Strong Buy with a $170 target, and the shares rose in pre-market trading on October 20. The analyst pointed to Akamai's seven-year, $11.6 billion cloud infrastructure deal with Anthropic, which could reach $20 billion. Raymond James sees the related $5.5 billion capital commitment as a long-term growth driver rather than a near-term burden. Akamai reports Q3 earnings on November 5.", "type": "Research", "date": "2026-10-20", "source_url": "https://www.investing.com/news/stock-market-news/why-is-akamai-technologies-stock-rallying-today-93CH-4959580"}]}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Akamai DataStream Adds gRPC, Post-Quantum Crypto and Midgress Type Logging", "summary": "An update to Akamai DataStream took effect October 20. DataStream now logs two-way gRPC session activity, both as periodic progress records and as final session totals. New dataset fields in the UI and API cover gRPC status, bidirectional status, PQC versus non-PQC TLS connections, and midgress type. Customers get more detail on modern API traffic and on how far post-quantum cryptography has been adopted across their edge delivery.", "type": "Feature Update", "date": "2026-10-20", "source_url": "https://techdocs.akamai.com/datastream2/changelog/oct-20-2026-grpc-pqc-and-midgress-type-data-support"}]}, "Fastly ~AS": {"category": "Application Security", "announcements": [{"title": "Fastly Calls for More Granular AI Bot and Traffic Controls", "summary": "In an interview at the VSTECS CXO Tech Summit, Fastly VP Rachel Ler said businesses need configurable rules that tell useful automation, such as AI-assisted product discovery or price monitoring, apart from harmful bots. She positioned Fastly's AI Bot Management, bot monitoring, API discovery and AI Runtime Control (ARC) as the tools for managing AI connections, usage and cost. She also suggested token-based verification to cut friction in high-demand events like ticket sales.", "type": "Event", "date": "2026-10-20", "source_url": "https://backendnews.net/fastly-highlights-need-for-stronger-ai-traffic-controls/"}]}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Cloud Builders Vienna 2026 Showcases AI-Centric Data Center Networking", "summary": "Arista held its Cloud Builders EMEA event in Vienna on October 20. Sessions covered AI-centric data center networking, automation, analytics, security, Arista Cognitive Campus, and Network Detection and Response. The event pushed Arista's AI networking and campus story directly to European enterprise and cloud customers.", "type": "Event", "date": "2026-10-20", "source_url": "https://events.arista.com/arista-cloud-builders-vienna-2026"}]}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware Details On-Demand TLS Fingerprint Web DDoS Protection That Works Without a Learning Period", "summary": "Radware described On-Demand TLSFP Web DDoS Protection. It reads TLS Client Hello fingerprints in real time to find and block encrypted HTTPS DDoS traffic, without decrypting it and without first learning what normal traffic looks like. The approach is based on a U.S. patent. Radware says that in testing it caught 2 of 2 reference attacks with no detection delay, blocked only 0.0013% of traffic outside attacks, and handled peaks of about 177K Client Hellos per second.", "type": "Feature Update", "date": "2026-10-20", "source_url": "https://www.radware.com/blog/detecting-web-ddos-attacks-without-a-learning-period/"}]}, "Palo Alto Networks": {"category": "Platforms", "announcements": []}, "Zscaler": {"category": "Platforms", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-10-20.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
</html>
