var DATA={"Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Akamai ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Akamai Adds Monitoring (Beta) for Akamai Inference with Metrics, Alerts and New Dashboards", "summary": "Akamai released Monitoring for Akamai Inference in beta. It adds performance metrics and alerts for its managed model-serving service, available through dashboards and the Linode API. Alerts notify customers when inference services move outside expected patterns. New dashboard features include stacked bar charts, compact legends with tooltips, a global group-by control for dimensions such as model name and API key, tabbed widget navigation, and KPI cards. This builds out the Akamai Inference beta that launched October 27.", "type": "Product Update", "date": "2026-11-02", "source_url": "https://techdocs.akamai.com/cloud-computing/changelog/nov-2-2026-monitoring-for-akamai-inference"}]}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Akamai and Skyfire Enable 2.5 Million Verified Agentic Transactions with Know Your Agent Tokens", "summary": "Akamai detailed how Skyfire's open Know Your Agent (KYA) protocol works with Akamai Bot & Agent Control. KYA tokens are signed JWTs that identify an AI shopping agent's user, operator and agent identity. Akamai's edge validates the tokens, and merchants apply their own policies before a transaction proceeds, with no new integration required. One financial data provider generated 2.5 million KYA-powered agentic transactions on Akamai-protected sites. Akamai says it sees 2.2 billion AI bot requests daily across commerce sites.", "type": "Partnership", "date": "2026-11-02", "source_url": "https://www.akamai.com/blog/security/how-skyfire-akamai-enabled-25-million-agentic-transactions"}, {"title": "MazeBolt Launches Native RADAR Deployment for Akamai DDoS Protection Customers", "summary": "MazeBolt launched a native deployment of its RADAR testing platform for Akamai DDoS protection customers. Enterprises can continuously test Akamai-protected services inside their own environments against known, AI-driven and AI-orchestrated DDoS attacks, without downtime or SLA impact. RADAR reports configuration gaps as services, APIs and regions are added, gives remediation guidance and retests after fixes. Layer 7 support is now available for Akamai environments. MazeBolt found that a substantial share of attack vectors could bypass protections before testing.", "type": "Partnership", "date": "2026-11-02", "source_url": "https://siliconangle.com/2026/11/02/mazebolt-launches-native-radar-deployment-for-akamai-ddos-protection-customers/"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Fastly Launches Self-Serve Free Trial Through AWS Marketplace", "summary": "Fastly introduced a self-serve free trial that customers start with an existing AWS account through AWS Marketplace. Usage is billed on the customer's AWS bill, with no separate vendor contract or sales process. The trial puts Fastly's edge caching in front of AWS origins (EC2, S3, ALB, API Gateway) to cut origin load, latency and data leaving AWS. Optional add-ons include Next-Gen WAF, DDoS protection, Bot Management, real-time logging to S3, Kinesis or CloudWatch, and Terraform/CloudFormation config-as-code.", "type": "Product Update", "date": "2026-11-02", "source_url": "https://www.fastly.com/blog/try-fastly-platform-free-aws-account"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Public PoC Released for Critical NetScaler ADC/Gateway Request-Smuggling Flaw CVE-2026-88773", "summary": "A researcher published a proof-of-concept for CVE-2026-88773, a critical (CVSS 9.3) HTTP request-smuggling flaw in NetScaler ADC and NetScaler Gateway that Citrix patched on September 27 (CTX697096). Affected builds include 14.1 before 14.1-73.37 and 13.1 before 13.1-64.23, plus FIPS/NDcPP versions, wherever HTTP/SSL vservers are configured. No in-the-wild exploitation or CISA KEV listing has been confirmed. Admins are urged to upgrade to 14.1-73.49 or 13.1-64.32 and prioritize internet-facing gateways.", "type": "Threat Intelligence", "date": "2026-11-02", "source_url": "https://www.threatwire.tech/news/upgrade-netscaler-researchers-publish-poc-for-request-smuggling-flaw-cve-2026-88773"}]}, "Citrix (NetScaler) ~P": {"category": "Platforms", "announcements": [{"title": "Citrix Week Kicks Off with Adaptive Enterprise, Flexible Consumption and AI Governance Themes", "summary": "Citrix opened its first Citrix Week (November 2\u20136), focused on helping organizations absorb AI, regulatory and demand-driven change without disrupting existing apps and workspaces. Themes include flexible consumption under Citrix Platform Flex, a more connected platform and governed use of AI agents. The daily schedule covers Citrix Platform Credits (Tuesday), SecurAccess identity and governance for AI agents (Wednesday), SecurSpaces agentic workspaces (Thursday) and Session Insights operational visibility (Friday).", "type": "Event", "date": "2026-11-02", "source_url": "https://www.citrix.com/blogs/2026-11/citrix-week-absorb-change-without-disrupting-the-work"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Launches Cortex XSIAM 4.0 with Autonomous, Enterprise-Aware AI Agents", "summary": "Palo Alto Networks released Cortex XSIAM 4.0, which adds autonomous AI agents to the SOC. The agents draw on enterprise knowledge sources such as Google Drive, Confluence and SharePoint, and they work with analysts through task delegation, review and per-case activity logs. The release also adds global access to frontier AI models, prioritized playbook execution, agentic endpoint security through Cortex XDR, Prisma AIRS telemetry in the SOC, and flexible schema editing. Together these join endpoint, AI-application and exposure-management signals inside one security operations platform.", "type": "Product Launch", "date": "2026-11-02", "source_url": "https://www.paloaltonetworks.com/blog/security-operations/cortex-xsiam-4-0-ai-knows-your-enterprise/"}, {"title": "Cortex Cloud 2.3 Advances Autonomous Cloud Defense", "summary": "Palo Alto Networks released Cortex Cloud 2.3, an update to its cloud security platform focused on autonomous cloud defense. The release adds security initiatives tied to business outcomes: teams can set measurable goals, such as eliminating all critical and high vulnerabilities by a target date, and track remediation and risk reduction against them. The update continues Palo Alto's push to consolidate cloud posture, workload and SecOps capabilities on the Cortex platform.", "type": "Product Update", "date": "2026-11-02", "source_url": "https://www.paloaltonetworks.com/blog/cloud-security/cortex-cloud-2-3-advancing-autonomous-cloud-defense/"}, {"title": "Palo Alto Networks Announces Cortex Cloud SaaS Security", "summary": "Palo Alto Networks announced Cortex Cloud SaaS Security, which unifies SaaS security with its broader cloud security platform. It gives visibility across more than 100 SaaS applications and ranks risks by linking SaaS exposures with cloud, identity, data and AI-tool context. It also offers guided remediation for misconfigurations, excessive permissions and data exposure. The launch extends Palo Alto's platform consolidation strategy to cover SaaS posture inside Cortex Cloud.", "type": "Product Launch", "date": "2026-11-02", "source_url": "https://www.varindia.com/news/palo-alto-networks-announces-cortex-cloud-saas-security"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "New Cortex XDR Integration with Claude Cowork Secures Desktop AI Agents", "summary": "Palo Alto Networks announced a Cortex XDR integration with Claude Cowork, Anthropic's Claude Enterprise desktop agent. A lightweight sensor runs inside the agent's local virtual machine and reports to Cortex XDR which systems the agent touches, which files it changes and which commands it runs. This gives security teams runtime visibility and threat detection for desktop AI agents. It is part of Palo Alto's wider agentic endpoint security push.", "type": "Partnership", "date": "2026-11-02", "source_url": "https://www.paloaltonetworks.com/blog/2026/11/new-cortex-xdr-integration-with-claude-cowork-secures-desktop-ai-agents/"}]}, "Fortinet": {"category": "Platforms", "announcements": []}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Details PHP2Shell Response for AI-Accelerated Threats", "summary": "Cisco described how its security portfolio responds to the PHP2Shell exploit, which it presents as an example of AI-accelerated threats. SnortML and Cisco firewall signatures detected and blocked new PHP2Shell exploit attempts within 24 hours. SnortML is on by default in Cisco Firewall 10.1 under the security-over-connectivity policy. Splunk integration links firewall alerts to more than 10 Splunk detections, giving visibility into activity after an exploit. Cisco is using the case to promote its combined firewall-plus-Splunk platform.", "type": "Threat Intelligence", "date": "2026-11-02", "source_url": "https://blogs.cisco.com/security/php2shell-how-cisco-helps-customers-respond-to-ai-accelerated-threats"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cisco AI Transit Extends SD-WAN Fabric to AI Environments", "summary": "Cisco introduced Cisco AI Transit, which connects AI workloads in NeoClouds, private and sovereign AI clouds, and enterprise AI factories to the existing Cisco SD-WAN fabric. It keeps a single policy model for routing, segmentation, security, performance, visibility and geographic intent. It can be deployed physically or virtually, including as a virtual secure router offered as a service in participating NeoClouds. AI Transit builds on SD-WAN Cloud OnRamp, and launch partners include Armada, Cirrascale and Latitude.", "type": "Product Launch", "date": "2026-11-02", "source_url": "https://blogs.cisco.com/security/cisco-ai-transit-connects-ai-environments-to-your-sd-wan"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike and Dynatrace Partner to Disrupt Legacy SIEM and Observability", "summary": "CrowdStrike and Dynatrace announced a strategic partnership with three integrations that connect CrowdStrike Falcon to Dynatrace AI Observability and log management. The integrations add federated search across Dynatrace data without moving it, correlation of Falcon telemetry with Dynatrace logs, and flexible log routing through Bindplane. The companies aim to cut data ingestion costs, avoid vendor lock-in and speed up incident response. Live demos were offered at Fal.Con Europe 2026 in Barcelona.", "type": "Partnership", "date": "2026-11-02", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-dynatrace-join-forces-disrupt-legacy-siem-observability/"}, {"title": "CrowdStrike and Deloitte Spain Expand Cybersecurity Alliance from Boardroom to SOC", "summary": "CrowdStrike and Deloitte Spain expanded their alliance at Fal.Con Europe to cover the full security lifecycle. Falcon IQ, CrowdStrike's AI-powered risk advisory capability, now feeds Deloitte's executive risk workshops and roadmaps. Deloitte will move clients from legacy architectures to Falcon Next-Gen SIEM. Ongoing operations will run as managed detection and response (MXDR) through Deloitte's EMEA Cybersphere Center in Madrid. The aim is to turn exploitable-risk findings into security investment and remediation plans.", "type": "Partnership", "date": "2026-11-02", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-deloitte-spain-expand-cybersecurity-alliance/"}, {"title": "CrowdStrike Scales Project QuiltWorks Across Europe", "summary": "CrowdStrike expanded Project QuiltWorks, its industry program for responding to frontier AI risk, across Europe. New partners include Almaviva Group, Atos, BT, Computacenter, Deutsche Telekom Security, Orange Cyberdefense, Telef\u00f3nica and TIM. They are meant to add expertise and remediation capacity for European organizations. The expansion strengthens CrowdStrike's partner-delivered Falcon platform reach in EMEA.", "type": "Partnership", "date": "2026-11-02", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-scales-project-quiltworks-across-europe-advancing-industry-response-to-frontier-ai-risk/"}, {"title": "Ignition Technology Commits Multi-Million-Dollar Falcon Flex Investment for European SMBs", "summary": "CrowdStrike announced that distributor Ignition Technology made a multi-million-dollar Falcon Flex commitment in CrowdStrike's Q1 FY27. The goal is to bring CrowdStrike's AI-native security to small, midsize and mid-market businesses in Europe. Ignition will deliver it through its network of managed service providers (MSPs and MSSPs) and its participation in Project QuiltWorks. The deal extends Falcon Flex consumption licensing into the European mid-market channel.", "type": "Customer Win", "date": "2026-11-02", "source_url": "https://ir.crowdstrike.com/news-releases/news-release-details/ignition-technology-brings-crowdstrikes-ai-native-security/"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike and Dell Technologies Announce Integrated AI Security for the Dell AI Factory with NVIDIA", "summary": "CrowdStrike, Dell Technologies and N Q4. Product/license revenue fell about 19%.", "type": "Financial", "date": "2026-11-02", "source_url": "https://www.checkpoint.com/press-releases/check-point-software-reports-2026-third-quarter-financial-results/"}, {"title": "Check Point Research Weekly Threat Intelligence Report: AI-Enabled Attack Groups and Actively Exploited CVEs", "summary": "Check Point Research's November 2 weekly bulletin covers major breaches, including a roughly $6.3B theft from Binance tied to a compromised DevOps laptop, plus incidents at Polymarket, Japan Airlines and the Florida Department of Education. It describes AI-assisted operations by GOLD OGRE ransomware, North Korean actors and China-linked VAPOR PANDA. It also flags exploited vulnerabilities, including a Brotli decompression RCE that affects Node.js and proxies, a critical Linux kernel TCP flaw, and a Cisco ASA/FTD SSL VPN issue.", "type": "Threat Intelligence", "date": "2026-11-02", "source_url": "https://research.checkpoint.com/2026/2nd-november-threat-intelligence-report/"}]}, "Check Point Software ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Check Point Launches Maestro Hyperscale Orchestrator 200 to Secure AI-Scale Traffic", "summary": "Check Point launched the Maestro Hyperscale Orchestrator (MHO) 200 for neoclouds, sovereign AI projects, telcos, governments and enterprises. The 1RU system adds 400GbE ports, raising fabric capacity from 3.2 Tbps to 12.8 Tbps with up to 4.5 Tbps of threat prevention. It supports up to eight independent security groups, Agentic Network Security Orchestration, and discovery of AI apps, LLMs, agents and MCP servers from the firewall. It also integrates with NVIDIA BlueField, supports live patching, and claims 99.999% uptime through two-site failover. It is available worldwide now.", "type": "Product Launch", "date": "2026-11-02", "source_url": "https://www.devopsdigest.com/check-point-secures-ai-scale-traffic-neoclouds-sovereign-ai-and-enterprise-new-maestro-hyperscale"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point Adds Deployment Status View for AI User and Device Visibility", "summary": "Check Point added a Deployment Status screen to its AI security portal that shows every user and device in one view. It lists enrollment state, device OS, client version, browser extension status, applied policy and last connection time. Multiple devices used by the same person are grouped under one user, which exposes gaps like missing extensions or outdated policies. Admins can also run bulk actions such as remote uninstall, device deletion and unassignment, with operation logs for each device.", "type": "Product Update", "date": "2026-11-02", "source_url": "https://blog.checkpoint.com/product-updates/see-every-ai-user-act-on-every-device/"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare One Access Adds Tag-Based Organization and Authorization for Service Tokens", "summary": "Cloudflare Access service tokens can now carry up to five key-value tags, such as environment: production or team: payments. Tags can be searched and filtered on the Service Tokens page and appear in Resource Tagging. A new Service Auth policy selector can authorize tokens by tag, so admins no longer have to list individual tokens. This makes machine-to-machine Zero Trust policy easier to manage at scale.", "type": "Product Update", "date": "2026-11-02", "source_url": "https://developers.cloudflare.com/changelog/post/2026-11-02-service-token-tags/"}]}, "Cloudflare ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Cloudflare Halves DNS Build Delay and Cuts Memory Use 85% with Targeted Zone Builds", "summary": "Cloudflare re-engineered its DNS Zone Builder with a targeted build planner and a zone-level scheduler, so only the smallest provably safe rebuilds run. About 93% of builds now avoid full-zone rebuilds. Median time from a DNS change to edge data fell from about 7.7s to 3.3s, and peak memory dropped from 79 GiB to 12 GiB. Zone Builder now handles roughly 700 record changes per second, with zones exceeding 20 million records.", "type": "Product Update", "date": "2026-11-02", "source_url": "https://blog.cloudflare.com/dns-targeted-zone-builds/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare Postpones AI Search Billing to December 1 and Changes Default Sync Interval", "summary": "Cloudflare moved the AI Search billing start to December 1, 2026. No charges accrue before then, and pricing and limits are unchanged. The default AI Search index sync interval is now 24 hours, and customers can still set it from 15 minutes to 24 hours through instance settings or the API.", "type": "Product Update", "date": "2026-11-02", "source_url": "https://developers.cloudflare.com/changelog/post/2026-11-02-billing-postponed-default-sync-interval/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS KMS Adds Post-Quantum ML-KEM Key Encapsulation; IAM Identity Center Adds Cross-Region Identity Propagation", "summary": "AWS Key Management Service now supports ML-KEM post-quantum key encapsulation across all three NIST FIPS 203 parameter sets, with private keys held in FIPS 140-3 Level 3 HSMs. Aurora also added post-quantum TLS key exchange. Separately, IAM Identity Center now passes user identity across Regions for access control and auditing, so services no longer have to sit in the same Region. That feature has no extra cost.", "type": "Product Update", "date": "2026-11-02", "source_url": "https://aws.amazon.com/blogs/aws/aws-weekly-roundup-gpt-6-1-terra-on-bedrock-step-functions-as-agent-tools-and-more-november-2-2026/"}, {"title": "Amazon Inspector Now Scans EC2 AMIs for Vulnerabilities", "summary": "Amazon Inspector can now scan EC2 Amazon Machine Images for vulnerabilities without launching instances or installing software. Scans can run continuously or one time, and can be enabled per account or across an organization. Results integrate with AWS Security Hub and EC2 Image Builder pipelines. Allowed AMIs and Declarative Policies can enforce the security criteria. It is available in all Inspector Regions.", "type": "Product Launch", "date": "2026-11-02", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/ec2-amis-scanned-through-inspector/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "OpenAI GPT-6.1 Terra GA on Amazon Bedrock; Step Functions Become Agent Tools via AgentCore Gateway", "summary": "OpenAI's GPT-6.1 Terra is now generally available on Amazon Bedrock. It supports up to 1M input tokens, and token costs are at least 50% lower than GPT-6.1 Sol. Separately, Bedrock AgentCore Gateway now exposes existing AWS Step Functions Standard and Express workflows as tools that AI agents can call over MCP, so agents can run multi-step business processes exactly as defined.", "type": "Product Launch", "date": "2026-11-02", "source_url": "https://aws.amazon.com/blogs/aws/aws-weekly-roundup-gpt-6-1-terra-on-bedrock-step-functions-as-agent-tools-and-more-november-2-2026/"}]}, "AWS ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Amazon CloudFront Supports Self-Service Quota Increases in AWS Service Quotas", "summary": "Customers can now view, monitor and request increases for 28 Amazon CloudFront quotas directly in the Service Quotas console or API. Eligible requests from AWS Business Support customers and above, within published thresholds, are approved automatically without a support case. Quotas with metrics publish CloudWatch usage every 5 minutes so teams can see limits coming.", "type": "Product Update", "date": "2026-11-02", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/cloudfront-self-service-quotas/"}]}, "Arista Networks": {"category": "AI Data Delivery", "announcements": []}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "HPE, Ericsson and Red Hat Release Validated Dual-Mode 5G Core Model with Juniper Apstra Fabric", "summary": "HPE, Ericsson and Red Hat released a validated deployment model for Ericsson's dual-mode 5G Core inside HPE Telco Cloud Suite. The stack combines HPE ProLiant Gen12 servers, Juniper Apstra data center fabric automation and Red Hat OpenShift. Validating the stack ahead of time is meant to catch integration problems before operators deploy, covering control-plane and user-plane workloads, performance, resilience and coordinated upgrades. It shows Juniper networking being packaged into HPE's telco infrastructure offerings.", "type": "Partnership", "date": "2026-11-02", "source_url": "https://www.sdxcentral.com/news/hpe-releases-ericsson-5g-core-model-for-telecom-evolution/"}]}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware AI Xploit Shield Delivers Pre-Patch Protection for PHP2Shell and Node2Shell", "summary": "Radware detailed how its AI Xploit Shield built custom protections within minutes of the PHP2Shell (CVE-2026-109618/109619) and Node2Shell (CVE-2026-111497) disclosures, before most organizations could patch. It created three custom signatures for PHP2Shell's multipart upload-progress attack path and an adaptive signature for Node2Shell's malformed Brotli streams, which could run in report mode before blocking. Radware argues that exploitation often starts before CVEs are published, so making a vulnerability unexploitable quickly matters more than waiting for patches.", "type": "Product Update", "date": "2026-11-02", "source_url": "https://www.radware.com/blog/ai-xploit-shield-ahead-of-the-patch/"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Discloses Auth Bypass and Command Injection Flaws Affecting ESG, WAF and Load Balancer ADC", "summary": "Barracuda disclosed two vulnerabilities: a critical pre-authentication authorization bypass in Email Security Gateway (CVE-2026-116606) and a high-severity command injection flaw (CVE-2026-111560). The command injection flaw also affects Barracuda Load Balancer ADC, Web Application Firewall, Web Security Gateway, Message Archiver and WAF Control Center. Used together, the flaws could give an attacker root access. The Canadian Centre for Cyber Security issued advisory AV26-1112 urging updates, for example ESG 9.4.0.030 or later and Load Balancer ADC 6.4.0.", "type": "Threat Intelligence", "date": "2026-11-02", "source_url": "https://www.cyber.gc.ca/en/alerts-advisories/barracuda-networks-security-advisory-av26-1112"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "Imperva Exposes StyleSmuggler Exploitation Deploying PSK Agent RAT Against Magento Stores", "summary": "Imperva researchers detailed a September 9\u201313, 2026 campaign against Magento and Adobe Commerce stores in Western Europe, North America and APAC. Attackers exploited StyleSmuggler (CVE-2026-75650) through the /paypal/transparent/response/ endpoint to run PHP, drop a staged loader and install PSK Agent, an obfuscated Go remote access trojan with shell, SOCKS5 proxy and persistence features. Imperva recommends applying Adobe's VULN-39341 hotfix, auditing for unexpected PHP files and scheduled tasks, and rotating secrets after any compromise.", "type": "Threat Intelligence", "date": "2026-11-02", "source_url": "https://securityboulevard.com/2026/11/stylesmuggler-exploitation-deploys-psk-agent-rat-against-magento-stores/"}, {"title": "Imperva Threat Intelligence Report: November 2, 2026", "summary": "Imperva's November 2 threat intelligence update flags critical memory-corruption flaws in PHP and Node.js runtimes that enable remote code execution. It also covers attackers abusing trusted developer channels such as malicious IDE extensions, compromised AI model repositories and fake development tools. Other themes include stolen credentials and API keys causing financial damage, third-party dependencies as a major data-exposure risk, and attacks on networking gear and e-commerce apps to keep long-term access to high-value environments.", "type": "Threat Intelligence", "date": "2026-11-02", "source_url": "https://imperva.substack.com/p/threat-intelligence-november-2-2026"}]}};

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
