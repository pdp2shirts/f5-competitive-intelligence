"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Acquires AI Agent Startup Console for $500M", "summary": "Palo Alto Networks confirmed a roughly $500 million cash-and-stock acquisition of Console, a 2024-founded startup whose AI agents automate password resets, permission provisioning, and IT troubleshooting for customers including Ramp, Flock Safety, and Scale AI. Console folds into the Cortex platform, adding natural-language, agent-driven investigation and remediation of security alerts. This is Palo Alto's seventh acquisition of 2026, following Chronosphere and Koi, and extends its platformization push deeper into autonomous security operations and adjacent IT workflows.", "type": "Acquisition", "date": "2026-09-03", "source_url": "https://pulse2.com/palo-alto-networks-acquires-console-to-expand-agentic-security-capabilities/"}, {"title": "Palo Alto Networks Earnings Highlight SASE and Network Security Wins", "summary": "Coverage of Palo Alto Networks' latest results spotlights continued momentum in SASE and network security as the primary growth engines behind its platformization strategy. The report frames large multi-product platform deals and consolidation displacement as the key drivers, with SASE attach rates cited as evidence customers are collapsing point tools onto a single vendor. The results give a current read on how effectively platform bundling is converting competitive displacement into recurring revenue.", "type": "Earnings", "date": "2026-09-03", "source_url": "https://www.sdxcentral.com/news/palo-alto-networks-earnings-highlight-sase-and-network-security-wins/"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Orchestrating the Agentic SOC: Palo Alto Networks Details Model Context Protocol Strategy", "summary": "Palo Alto Networks published a practical guide positioning Model Context Protocol as a standardized AI integration layer connecting large language models to SOC tooling. The post details the Cortex MCP Server and native MCP integrations spanning Cortex XSIAM, AgentiX, XDR, and Cloud, letting agents orchestrate tools on demand in response to analyst prompts or events. The stated goal is eliminating the 'integration tax' of brittle custom scripts and enabling agent-driven, end-to-end AI security operations.", "type": "Blog Post", "date": "2026-09-03", "source_url": "https://www.paloaltonetworks.com/blog/security-operations/mcp-client/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet and FIRST: Strengthening Cyber Resilience Through Global Collaboration", "summary": "Fortinet detailed its expanded partnership with FIRST, the global Forum of Incident Response and Security Teams, which it has worked with since 2012 through FortiGuard Labs threat intelligence and national CERT integrations. As a founding partner of FIRST CORE, Fortinet is funding capacity building, training, and regional exercises in under-resourced regions. Stated priorities include expanding engagement in Africa, adding training programs, hosting more regional symposia, and collaborating with FIRST Special Interest Groups on AI security and ransomware response.", "type": "Partnership", "date": "2026-09-03", "source_url": "https://www.fortinet.com/blog/industry-trends/fortinet-and-first-strengthening-cyber-resilience-through-global-collaboration"}, {"title": "Fortinet Links FortiBleed Credentials to Prior Incidents", "summary": "New reporting says Fortinet has traced credentials used in the ongoing FortiBleed campaign against FortiGate devices back to earlier disclosed incidents rather than a new vulnerability, with attackers brute-forcing appliances that have weak passwords and no MFA. Fortinet's guidance centers on resetting admin and VPN credentials, enforcing MFA, upgrading to releases using stronger password hashing, and restricting internet-exposed management interfaces. The campaign has been tied to ransomware activity, keeping edge-device credential hygiene in the spotlight.", "type": "Security Advisory", "date": "2026-09-03", "source_url": "https://insight.tmcnet.com/insight/fortinet-traces-fortibleed-credentials-to-earlier-incidents-mtlgn7qe"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Warns of Unpatched Secure Email Flaws, Patches Critical Switch Vulnerabilities", "summary": "Cisco disclosed a critical unauthenticated remote code execution flaw in Nexus 9000 Series switches running Silicon One (CVE-2026-20212, CVSS 9.8) alongside an IOS XR security hardening release, while warning that ciphertext-decryption weaknesses in Cisco Secure Email remain unpatched. Interim mitigations include infrastructure ACLs limiting management and control-plane access plus a Live Protect shield for select NX-OS releases. Cisco reported no known exploitation at disclosure but noted the window between disclosure and exploitation continues to shrink.", "type": "Security Advisory", "date": "2026-09-03", "source_url": "https://www.securityweek.com/cisco-warns-of-unpatched-secure-email-flaws-patches-critical-switch-vulnerabilities/"}]}, "Cisco ~AI": {"category": "AI Security", "announcements": [{"title": "Your Agent Trusts Things You Never Approved: Cisco Details AI Defense Agent Supply-Chain Scanning", "summary": "Cisco published research on agentic AI supply-chain trust, arguing that agents load skills and MCP servers from lightly vetted registries at machine speed. It describes a partnership with OpenAI bringing Daybreak models into Cisco AI Defense as a tiered scanner: Daybreak Blue for a cybersecurity-tuned first pass and Daybreak Red for heavily obfuscated payloads and exploit chains. Cisco's skill-scanner and mcp-scanner combine YARA, static analysis, Python bytecode checks, shell taint analysis, and semantic review before trust is granted.", "type": "Research Report", "date": "2026-09-03", "source_url": "https://blogs.cisco.com/ai/your-agent-trusts-things-you-never-approved"}]}, "CrowdStrike": {"category": "Platforms", "announcements": []}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike Unveils SafeMind for Agentic Cyber", "summary": "Analyst coverage of CrowdStrike's Fal.Con announcements examines SafeMind, a family of purpose-built security models and harnesses built with NVIDIA that runs natively in the Falcon platform. SafeMind pairs offensive (Red Tempest) and defensive (Blue Solano) models in one closed-loop agentic system that continuously finds and closes attack paths, trained on Falcon telemetry. CrowdStrike claims materially faster end-to-end remediation and lower detection cost versus general-purpose frontier models, positioning owned full-stack models as a differentiator against generic AI.", "type": "Product Launch", "date": "2026-09-03", "source_url": "https://aragonresearch.com/crowdstrike-unveils-safemind-for-agentic-cyber/"}, {"title": "CrowdStrike Launches AI Security Tools for Enterprises", "summary": "Reporting from Fal.Con 2026 summarizes CrowdStrike's enterprise AI security push, including agentic SOC capabilities, an Agentic Identity Provider for AI agent identity, Falcon Guardian AI detection and response, and supply-chain protections. The set targets runtime monitoring of autonomous agents across endpoints, SaaS, cloud, and browsers, plus governance of agent identities. It underscores how quickly platform vendors are packaging AI-agent protection as a standard tier rather than a standalone product.", "type": "Product Launch", "date": "2026-09-03", "source_url": "https://securitybrief.com.au/story/crowdstrike-launches-ai-security-tools-for-enterprises"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler and OpenAI Bring Frontier AI-Powered Security to the Enterprise", "summary": "Zscaler unveiled two new capabilities built with OpenAI's Daybreak Defense Network and GPT cyber models. Endpoint AI Security reasons over full endpoint state \u2014 including AI agents, coding assistants and IDE/browser extensions \u2014 to reconstruct realistic multi-stage attack chains instead of flat CVE lists. Identity Risk Analysis in the Zscaler AI Access Graph traces risky permission paths across humans, service accounts and AI agents spanning Azure, AWS, OCI and GCP, ranking exposure by business impact. Zscaler stresses evidence-grounded output with human review before consequential actions.", "type": "Partnership", "date": "2026-09-03", "source_url": "https://www.zscaler.com/blogs/product-insights/zscaler-and-openai-bringing-frontier-ai-powered-security-enterprise"}, {"title": "Zscaler Announces Strong Fourth Quarter and Fiscal 2026 Financial Results", "summary": "Zscaler reported fiscal Q4 and full-year 2026 results for the period ended July 31, 2026, with revenue and ARR each up 25% year over year and net-new ARR up 24%. Non-GAAP operating margin reached a record 24%. Management credited broadening growth drivers beyond seat-based user solutions \u2014 including non-seat-based products, Z-Flex momentum, larger deal activity and improved sales productivity \u2014 and guided to continued momentum in fiscal 2027, with AI agent security positioned as a next growth driver.", "type": "Earnings", "date": "2026-09-03", "source_url": "https://ir.zscaler.com/news-releases/news-release-details/zscaler-announces-strong-fourth-quarter-and-fiscal-2026"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Brings OpenAI Daybreak Models Across Its Security Platform", "summary": "Check Point is embedding OpenAI's Daybreak frontier cyber models across its security platform through the Daybreak Defense Network. Targeted workflows include Exposure Validation to prove exploitable risk and prioritize remediation, Keystone for intent-driven autonomous policy management, the Autonomous Workspace Platform for faster incident investigation, and NexPloit to convert vulnerability data into verified attack material that speeds protection development. The rollout is phased, with governance guardrails limiting model visibility, constraining actions and validating outputs before automation.", "type": "Partnership", "date": "2026-09-03", "source_url": "https://blog.checkpoint.com/ai-security/check-point-brings-openai-daybreak-models-across-its-security-platform-to-help-defenders-find-validate-and-remediate-risk/"}]}, "Cloudflare": {"category": "Platforms", "announcements": []}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare Partners with OpenAI Daybreak Models to Redefine Vulnerability Management with AI-Powered Edge Defense", "summary": "Cloudflare launched Vulnerability Discovery and Remediation, an invitation-only early access service inside Cloudflare Managed Defense powered by OpenAI Daybreak models including GPT-5.6 Cyber. The service correlates live edge traffic with reconnaissance and hunting across customer-authorized codebases, then deploys WAF rules at the edge for immediate virtual patching and generates verified code patches for developer review. It spans Cloudflare Web Assets, WAF and Workers Observability. Inference runs through Cloudflare AI Gateway to OpenAI rather than on the edge, and every proposed fix or rule requires customer approval.", "type": "Product Launch", "date": "2026-09-03", "source_url": "https://www.cloudflare.com/press/press-releases/2026/cloudflare-partners-with-openai-daybreak-models-to-redefine-vulnerability-management-with-ai-powered-edge-defense/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "Amazon Linux 2027 Is Now Available in Public Preview", "summary": "AWS opened public preview of Amazon Linux 2027, built on AL2023 for cloud-native workloads with a focus on performance, scale and security. It ships kernel 7.1+ with SELinux enforcing by default, accelerated cryptography via AWS-LC, refreshed toolchains and language runtimes, and AI/ML support including AWS Neuron driver access for accelerated inference and training instances. Preview AMIs are available across all commercial AWS Regions for x86-64 and ARM, with container base images on the Amazon ECR Public Gallery.", "type": "Product Launch", "date": "2026-09-03", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/announcing-amazon-linux-2027/"}, {"title": "Amazon S3 Now Supports PrivateLink for FIPS Endpoints", "summary": "AWS extended AWS PrivateLink support to Amazon S3 FIPS endpoints, letting regulated customers reach S3 over private connectivity while meeting FIPS 140 cryptographic module requirements. Traffic stays on the AWS network instead of traversing the public internet, simplifying compliance architectures for government, defense and financial workloads that previously had to choose between private connectivity and FIPS-validated endpoints.", "type": "Product Launch", "date": "2026-09-03", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-s3-privatelink-fips-endpoints/"}]}, "AWS ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "AWS Gateway Load Balancer Now Supports TCP Reset for Faster Failure Recovery", "summary": "AWS Gateway Load Balancer can now send TCP Reset packets to accelerate failure recovery for inline security appliance deployments. RSTs are issued when a target becomes unhealthy, when a target is deregistered after connection draining, and when the TCP idle timeout expires \u2014 cutting traffic interruption from minutes to seconds by signaling invalid connections to clients and servers immediately. The behavior is off by default for backward compatibility and is enabled per target group via Console, CLI or API, at no additional cost in all Regions where GWLB is available.", "type": "Product Launch", "date": "2026-09-03", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-gateway-load-balancer-tcp-reset/"}, {"title": "Amazon CloudFront Announces API Support for Flat-Rate Pricing Plans", "summary": "Amazon CloudFront added API support for its flat-rate pricing plans, letting customers programmatically select, provision and manage predictable-cost CDN tiers instead of configuring them only through the console. The change makes flat-rate delivery pricing consumable through infrastructure-as-code and automated account provisioning, reinforcing AWS's push to simplify CDN cost predictability for content and application delivery buyers.", "type": "Product Launch", "date": "2026-09-03", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/cloudfront-flat-rate-pricing-plans-api/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Introducing Cross-Region Inference for OpenAI GPT-5.6 Models on Amazon Bedrock", "summary": "Amazon Bedrock now offers OpenAI GPT-5.6 models across 25+ AWS Regions using cross-Region inference profiles (CRIS). Three variants \u2014 Sol, Terra and Luna \u2014 balance capability and cost, accept text and image inputs, and support a 1 million token context window with reasoning modes. CRIS automatically routes requests from a source Region to supported destination Regions, expanding usable capacity and absorbing traffic bursts without customers managing routing themselves. Models are reachable through OpenAI-compatible Responses, Chat Completions and Converse APIs.", "type": "Product Launch", "date": "2026-09-03", "source_url": "https://aws.amazon.com/blogs/machine-learning/introducing-cross-region-inference-for-openai-gpt-5-6-models-on-amazon-bedrock/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": [{"title": "HiddenLayer Raises $100 Million Series B for AI Runtime Security", "summary": "HiddenLayer closed a $100 million Series B led by Delta-v Capital with Ten Eleven Ventures, Morgan Stanley, Microsoft's M12, and Booz Allen Ventures participating. The Austin-based firm says ARR grew more than 10x in the past year and will use the capital to expand Agentic Runtime Security and a new Agent Harness Security offering that protects AI coding agents in production. The round funds international go-to-market expansion and deepens coverage of prompt injection, agent manipulation, and malicious tool use.", "type": "Funding", "date": "2026-09-03", "source_url": "https://www.securityweek.com/hiddenlayer-raises-100-million-for-ai-runtime-security/"}]}, "Lasso Security": {"category": "AI Security", "announcements": [{"title": "Lasso Security Launches LEAP CPU-Based AI Guardrails and Raises $30M", "summary": "Lasso Security unveiled LEAP, a transformer-free AI guardrail engine that runs on ordinary CPUs with sub-5ms decision latency and no GPU footprint, claiming GPU-class detection accuracy at thousands of times the throughput of existing guardrails. LEAP is already in production at global enterprises and the U.S. federal government and pairs with RAPID, Lasso's self-hosted model for nuanced judgments, behind a routing layer. Lasso also disclosed a $30 million round led by ClearSky with Entr\u00e9e Capital, iAngels, Singtel Innov8, Mindset, and Swish Data.", "type": "Product Launch", "date": "2026-09-03", "source_url": "https://www.lasso.security/resources/lasso-security-announces-future-of-ai-security-with-cpu-based-guardrails"}]}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": [{"title": "Mindgard Confirms $30M Series A to Scale Automated AI Red Teaming", "summary": "Lancaster University confirmed that spin-out Mindgard has raised a $30 million (\u00a322.2m) Series A led by Album VC, with Karma Ventures and existing backers .406 Ventures, Atlantic Bridge, IQ Capital, and Lakestar. It is among the largest Series A cybersecurity rounds for a UK company and will scale product engineering, sales, and marketing. Mindgard combines AI safety research with offensive security to red-team models, agents, and applications, with deployments across financial services, pharma, gaming, and healthcare.", "type": "Funding", "date": "2026-09-03", "source_url": "https://www.lancaster.ac.uk/news/major-funding-boost-for-lancaster-ai-spin-out-company"}]}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Akamai Introduces More Granular Controls for AI Bot Traffic", "summary": "Akamai split its single \"AI Bots\" category in the Akamai Bot Directory into three distinct types \u2014 AI training crawlers, AI search crawlers, and AI fetchers/agents \u2014 so customers can write policy beyond blanket block/allow. Teams can now block training scrapers while still permitting search indexers, and distinguish real-time agentic user traffic from background crawlers. The controls are enforced through Bot & Agent Control and pair with Akamai's AI Brand Presence capability to preserve visibility in AI search results while protecting intellectual property.", "type": "Product Launch", "date": "2026-09-03", "source_url": "https://www.akamai.com/blog/security/introducing-more-granular-controls-ai-bot-traffic"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Fastly Named a 2026 Gartner Peer Insights Customers' Choice for Edge Distribution Platforms", "summary": "Fastly announced it was named a 2026 Gartner Peer Insights Customers' Choice for Edge Distribution Platforms, based on 92 verified reviews with a 4.8/5 overall rating and 95% willingness to recommend as of April 30, 2026. The recognition cites platform performance, reliability, customer experience, and support. It follows seven consecutive years of Customers' Choice recognition for Cloud Web Application and API Protection (WAAP), and Fastly framed the award around enterprises scaling AI workloads on its edge platform.", "type": "Research Report", "date": "2026-09-03", "source_url": "http://www.upgrademag.com/web/2026/09/03/fastly-named-a-2026-gartner-peer-insights-customers-choice-for-edge-distribution-platforms/"}, {"title": "Fastly Releases Open-Source Fastly Log Analytics for Self-Hosted Edge Log Insights", "summary": "Fastly published Fastly Log Analytics, a self-hosted open-source data lake and interactive dashboard that lets customers ingest and query 100% of their raw Fastly request logs without a third-party analytics vendor or egress costs. It runs on Fastly Object Storage via docker-compose and includes 45 automated anomaly detectors spanning security threats, origin health, edge performance, network path, and traffic metrics, plus traffic dashboards, a global request map, and a click-to-filter raw log viewer. It is community-supported.", "type": "Product Launch", "date": "2026-09-03", "source_url": "https://www.fastly.com/blog/building-fastly-log-analytics-tools-open-source-approach-deeper-insights"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": []}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "HPE and Oracle Deepen Networking Collaboration for Gigawatt-Scale AI Infrastructure", "summary": "HPE and Oracle expanded their networking partnership to support Oracle Cloud Infrastructure's gigawatt-scale AI buildout. The multi-year agreement deploys HPE Juniper Networking PTX and MX routing platforms plus QFX and EX switches across OCI data centers, edge networks, and AI superclusters worldwide, along with networking support services and financing. The companies are jointly developing intelligent telemetry to detect queue buildup, packet loss, and traffic imbalances that degrade GPU utilization. HPE also issued warrants allowing Oracle to purchase HPE stock.", "type": "Partnership", "date": "2026-09-03", "source_url": "https://aithority.com/it-and-devops/cloud/hpe-and-oracle-deepen-networking-collaboration-to-accelerate-gigawatt-scale-ai-infrastructure/"}, {"title": "HPE Inks Blockbuster Juniper Networking Deal With Oracle for AI Data Centers", "summary": "CRN reported that HPE's expanded Oracle agreement is one of the industry's largest AI infrastructure networking initiatives. Oracle will deploy HPE's QFX data center switches, built on Broadcom Tomahawk silicon, alongside PTX routing platforms using HPE's own Express 5 ASIC, across AI clusters, regional data centers, and edge networks. CEO Antonio Neri framed the win as validation of HPE's post-acquisition Juniper portfolio and its AI-driven network operations story, positioning networking as the core of HPE's AI infrastructure strategy.", "type": "Partnership", "date": "2026-09-03", "source_url": "https://www.crn.com/news/networking/2026/hpe-inks-blockbuster-juniper-networking-deal-with-oracle"}]}, "HPE / Juniper Networks ~P": {"category": "Platforms", "announcements": [{"title": "HPE Posts Record Q3 as AI Infrastructure and Networking Demand Surges", "summary": "HPE reported a record fiscal Q3 2026 with revenue of $12.2 billion, up 34% year over year, driven by AI infrastructure, networking, and servers. Campus and branch networking revenue hit record levels as customers modernize edge infrastructure and adopt AI-driven network operations, while routing and data center switching orders ran ahead of revenue and backlog reached an all-time high. HPE guided fiscal 2027 networking revenue up 13\u201317%. Component shortages remain a constraint, prompting multi-year supply agreements.", "type": "Earnings", "date": "2026-09-03", "source_url": "https://www.networkworld.com/article/4218314/hpes-record-q3-ai-infrastructure-networking-demand-drives-growth-but-supply-constraints-tap-the-brakes.html"}, {"title": "Arrow Expands HPE Networking Distribution to Aruba and Juniper Portfolios", "summary": "Arrow Electronics broadened its distribution agreement with HPE to include HPE Aruba Networking and HPE Juniper Networking across the United States, Canada, and select European markets. The expansion gives partners access to HPE's full networking portfolio spanning campus, data center, cloud-managed networking, and AI infrastructure. The move is part of HPE's continued restructuring of its distribution ecosystem following the Juniper acquisition, complementing global distributors TD SYNNEX and Ingram Micro and specialist distributors already in place.", "type": "Partnership", "date": "2026-09-03", "source_url": "https://www.channelinsider.com/channel-business/arrow-hpe-networking-distribution/"}]}, "Radware": {"category": "Application Security", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda CIO Details Flexible Governance Framework for Responsible AI", "summary": "InformationWeek profiled how Barracuda CIO Siroui Mushegian built the company's responsible AI strategy. Barracuda formed an AI council, chaired by Mushegian, to govern internal AI use, set policy, and establish organizational tone, backed by deliberately flexible frameworks that can be revised as AI capabilities shift. The approach emphasizes visibility and access controls over how staff use data and tools to prevent shadow AI, plus cross-functional subcommittees spanning go-to-market and product engineering with a core compliance and legal group.", "type": "Executive Interview", "date": "2026-09-03", "source_url": "https://www.informationweek.com/it-leadership/how-barracuda-s-cio-developed-a-flexible-strategy-for-responsible-ai"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-09-03.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
