"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Launches Unit 42 Threat Intelligence Offering", "summary": "Palo Alto Networks introduced Unit 42 Threat Intelligence, widening customer access to its proprietary research. It has two parts: Cortex XTI, which embeds Unit 42 intelligence directly into the Cortex platform to align global threat visibility with each customer's environment and prioritize actors, campaigns, malware and exposures; and Unit 42 Threat Intel Services, analyst-led engagements delivering tailored insights grounded in active campaigns. The company positions scale plus environmental context as the differentiator, pushing intelligence into SOC prevention, detection, hunting and investigation workflows.", "type": "Product Launch", "date": "2026-08-03", "source_url": "https://www.paloaltonetworks.com/blog/2026/08/introducing-unit-42-threat-intelligence-know-what-matters-understand-the-adversary-and-act-faster/"}, {"title": "Palo Alto Networks and Google Cloud Target AI-Generated Malware", "summary": "Palo Alto Networks and Google Cloud announced an integration embedding WildFire advanced malware sandboxing into Google Cloud NGFW Enterprise, delivering real-time inline protection against AI-generated malware and zero-day ransomware. Files extracted from network traffic are analyzed within Google Cloud regions, with verdicts enforced inline across inbound and internal traffic and no redirection to external sandboxes. The capability leverages Precision AI, preserves application performance, supports regional data-residency requirements, and is managed from the Google Cloud Console. It is currently available in preview.", "type": "Partnership", "date": "2026-08-03", "source_url": "https://www.paloaltonetworks.com/blog/network-security/palo-alto-networks-google-cloud-ai-malware-protection/"}, {"title": "Palo Alto Networks Sets Q4 and FY2026 Earnings Date", "summary": "Palo Alto Networks said it will report fiscal fourth quarter and full fiscal year 2026 results after U.S. markets close on Tuesday, September 1, 2026, covering the quarter ended July 31, 2026. A live video webcast with management follows at 1:30 p.m. Pacific, with a press release issued beforehand and a replay archived for one year. The report will be the first full-year results following the company's CyberArk acquisition earlier in 2026.", "type": "Financial Results", "date": "2026-08-03", "source_url": "https://investors.paloaltonetworks.com/news-releases/news-release-details/palo-alto-networks-announce-fiscal-fourth-quarter-and-fiscal-7"}, {"title": "Unit 42 Research Exposes New Attack Surface in Passwordless Authentication", "summary": "Palo Alto Networks' Unit 42 published research detailing a novel attack surface in passwordless authentication, showing how passkey implementations can be abused despite being marketed as phishing-resistant. The analysis walks through weaknesses in registration and recovery flows and how attackers can subvert trust assumptions in passwordless deployments. Unit 42 outlines detection considerations and hardening guidance for enterprises rolling out passkeys, reinforcing that identity remains a primary adversary target as organizations retire passwords.", "type": "Research/Report", "date": "2026-08-03", "source_url": "https://unit42.paloaltonetworks.com/passwordless-authentication-security-risks/"}, {"title": "Palo Alto Networks Elevates Multi-Tenant Prisma SASE Management with a Reimagined Portal for MSPs", "summary": "Palo Alto Networks released a redesigned Strata Multi-Tenant Cloud Manager portal for Prisma SASE, built for MSPs and large multi-tenant enterprises. The portal organizes management around tenant hierarchies with role-based dashboards for security operators, network operators, and business stakeholders, plus per-tenant isolation for threat visibility, license management, and connectivity health. The update targets simplified governance, policy orchestration, and scalability across large SASE deployments.", "type": "Product Launch", "date": "2026-07-31", "source_url": "https://www.paloaltonetworks.com/blog/sase/palo-alto-networks-elevates-multi-tenant-prisma-sase-management-with-a-reimagined-portal-for-msps/"}, {"title": "Unit 42: The Xcode Assassin Returns \u2014 Deep Dive Into the Latest XCSSET Version", "summary": "Unit 42 published analysis of XCSSET version 40, a resurgent macOS malware family targeting Xcode developer projects. The new variant hides core logic in memory to shrink its footprint, adds stealth modules, and rotates command-and-control infrastructure. Palo Alto Networks maps defenses to its platform, citing Cortex XDR behavioral threat protection against fileless chains, XSIAM correlation across developer repos and identity telemetry, and Advanced URL Filtering and DNS Security to block associated infrastructure.", "type": "Research", "date": "2026-07-31", "source_url": "https://unit42.paloaltonetworks.com/xcsset-v40-malware-analysis/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet and Crime Stoppers International Launch First Live Cybercrime Bounty", "summary": "Fortinet announced that its Cybercrime Bounty program, run with Crime Stoppers International, is now live. The program pairs Crime Stoppers' anonymous reporting channels with FortiGuard Labs threat intelligence to collect, validate and route actionable cybercrime intelligence to law enforcement. Fortinet confirmed the anonymous reporting channel is operational, validation and escalation processes are established, and the first live bounty, Operation Silent Vector I, has launched with a named target. The move positions Fortinet's intelligence apparatus as a direct enabler of law-enforcement disruption.", "type": "Partnership", "date": "2026-08-03", "source_url": "https://www.fortinet.com/blog/industry-trends/from-threat-intelligence-to-action-the-first-cybercrime-bounty-is-now-live"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Named a Leader in 2026 Gartner Magic Quadrant for UCaaS", "summary": "Cisco announced it was again named a Leader in the 2026 Gartner Magic Quadrant for Unified Communications as a Service, marking its eighth consecutive year in the Leaders quadrant. The company credited both its completeness of vision and ability to execute, framing the recognition as validation of its Webex strategy and continued investment in AI-driven collaboration experiences. The recognition supports Cisco's broader platform narrative of consolidating collaboration, networking and security capabilities under a single vendor.", "type": "Industry News", "date": "2026-08-03", "source_url": "https://blog.webex.com/collaboration/eight-years-running-cisco-named-leader-2026-gartner-magic-quadrant-unified-communications-service-ucaas/"}]}, "Cisco ~AI": {"category": "AI Security", "announcements": [{"title": "Cisco Expands IAM Portfolio to Govern Non-Human and Agentic AI Identities", "summary": "Cisco detailed an expansion of its identity and access management portfolio to cover non-human identities, including service accounts, API keys, workload tokens, SaaS grants and AI agents, which now outnumber human identities by as much as 50x. Capabilities from the Splunk, Galileo Technologies and Astrix Security acquisitions are being folded into Cisco Identity Intelligence, Duo and Secure Access, with Cloud Control, Agent Builder and Codex guardrails enforcing policy on agent behavior. Cisco's pitch is a zero-trust, context-aware control plane that sits directly in the agent's path.", "type": "Industry News", "date": "2026-08-03", "source_url": "https://diginomica.com/who-are-these-non-humans-my-enterprise-cisco-expands-iam-portfolio-provide-answers"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cisco Executive Testifies to US Senate on AI's Impact on Network Infrastructure", "summary": "Cisco's Bob Everson testified before the US Senate Subcommittee on Telecommunications and Media at a hearing on intelligent networks powering AI. He reported AI inference traffic grew fourfold in eight months and is increasingly uplink-intensive from prompts, sensor data and agent activity, with one tested AI agent generating about 450% more traffic than a human, roughly 70% inference-related. Cisco cited 34% AI traffic growth in campus and branch networks over the past year, projecting about 96% next year, and highlighted the shift toward distributed, smaller specialized models.", "type": "Industry News", "date": "2026-08-03", "source_url": "https://www.networkworld.com/article/4204576/cisco-exec-testifies-at-us-senate-panel-on-ais-network-impact.html"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Fal.Con 2026 Sells Out at Record Pace", "summary": "CrowdStrike said its Fal.Con 2026 conference in Las Vegas (Aug 31\u2013Sep 3) sold out ahead of schedule, with more than 10,000 attendees from 4,000 organizations across 71 countries. Themed \"Securing the AI Revolution,\" the event features 500-plus sessions and 200-plus customer and partner presentations involving AWS, Anthropic, Dell, Google, NVIDIA and OpenAI. New additions include a Trust in AI CxO Exchange and a Day Zero Threat Research Summit with researchers from Cisco Talos, Google and Palo Alto Networks, alongside a record Global Partner Summit exceeding 1,000 participants.", "type": "Industry News", "date": "2026-08-03", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-falcon-2026-sells-out-record-pace/"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike 2026 Threat Hunting Report: AI Embedded Across Adversary Operations", "summary": "CrowdStrike released its 2026 Threat Hunting Report, concluding AI is now a tool, target and force multiplier for adversaries. Findings include a campaign issuing nearly 200,000 AI model requests in two minutes, DPRK-nexus STARDUST CHOLLIMA poisoning 131 Mastra AI framework npm packages, and 87% of software registry threats in 1H 2026 involving malicious npm packages. Exploitation windows have collapsed, with 88% of proof-of-concept exploits weaponized within 48 hours. Cloud-focused eCrime rose 171% and device-code phishing surged 15x.", "type": "Research/Report", "date": "2026-08-03", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-2026-threat-hunting-report/"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler ThreatLabz Uncovers BINDCLOAK Backdoor in Middle East Government Campaign", "summary": "Zscaler ThreatLabz published part two of its analysis of a targeted campaign against Middle East government entities attributed to an East Asia-linked threat actor. The research details BINDCLOAK, a newly discovered modular stage-three backdoor, and documents code similarities with the OctLurk malware family plus shared command-and-control infrastructure linking the OctLurk-associated actor to this campaign. Part one covered the TELESHIM backdoor and MIXEDKEY loader. Zscaler notes its cloud security platform detects indicators of the campaign across multiple layers.", "type": "Research/Report", "date": "2026-08-03", "source_url": "https://www.zscaler.com/blogs/security-research/targeted-attack-government-entities-middle-east-part-2"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Named a Visionary Leader in 2026 Frost Radar for Enterprise Risk Platforms", "summary": "Frost & Sullivan named Check Point a Visionary Leader in its 2026 Frost Radar for Enterprise Risk Mitigation and Management Platforms, citing a unified platform combining attack surface management, cyber threat intelligence and digital risk protection with built-in prioritization and safe remediation. Frost highlighted Check Point's high Growth Index score among 15 evaluated platforms and its ability to move organizations from risk visibility to measurable risk reduction. Check Point also received Frost & Sullivan's Best Practices Customer Value Leadership recognition in the global ERMM platforms industry.", "type": "Research/Report", "date": "2026-08-03", "source_url": "https://www.prnewswire.com/news-releases/check-point-software-named-a-visionary-leader-in-the-2026-frost-radar-for-enterprise-risk-mitigation-and-management-platforms-302840981.html"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point Launches AI Network Firewall to Close the Network's AI Blind Spot", "summary": "Check Point launched its AI Network Firewall as part of firewall software release R82.20, extending AI security to prompts, model calls and autonomous agent actions from customers' existing firewall deployments. Delivered through the company's AI Defense Plane with no new infrastructure required, it gives security teams visibility and control over AI use by employees, applications and agents, with centralized policy management extended across Check Point SASE and SD-WAN. The release adds dynamic zero-trust enforcement and micro-segmentation across IT and OT environments, and is available now.", "type": "Product Launch", "date": "2026-08-03", "source_url": "https://www.checkpoint.com/press-releases/check-point-revolutionizes-the-firewall-market-new-ai-network-firewall-closes-the-networks-ai-blind-spot-everywhere/"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Introduces Billable Usage API for Programmatic Cost Visibility", "summary": "Cloudflare introduced the Billable Usage API, a single self-serve endpoint returning account-wide usage and cost data broken down by product and service period across Workers, R2, D1, Workers AI, Vectorize, Images and Stream. Built on the FOCUS specification, records include service name, charge period, pricing quantity and contracted cost, with per-zone attribution and daily refreshes moving toward near real-time. Access requires an API token with Billing Read permission, and Cloudflare partnered with Vantage to ingest the data for FinOps cost reports, budgets and alerts.", "type": "Product Launch", "date": "2026-08-03", "source_url": "https://blog.cloudflare.com/billable-usage-api/"}, {"title": "WARP Client Beta Releases for Windows and macOS", "summary": "Cloudflare published beta releases of its WARP client for Windows and macOS via the developer changelog. The updates continue iterative hardening of the Zero Trust endpoint agent that connects devices into Cloudflare One, covering connectivity, device posture, and platform-specific fixes. Beta channels let administrators validate changes ahead of general availability rollouts.", "type": "Product Launch", "date": "2026-07-31", "source_url": "https://developers.cloudflare.com/changelog/post/2026-07-31-warp-windows-beta/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare Launches @cloudflare/computer Agent Runtime", "summary": "Cloudflare released an early preview of @cloudflare/computer, an open-source agent runtime that gives AI agents a \"computer\" abstraction while the platform decides whether code runs in an isolate, container or browser. The design targets running under 10% of agent tasks in containers, keeping coding, audio/video manipulation and document creation workloads primarily in cheaper, faster isolates. Cloudflare positions the library as a way to scale agentic workloads efficiently on Workers and invites early experimentation as it learns from customer usage.", "type": "Product Launch", "date": "2026-08-03", "source_url": "https://blog.cloudflare.com/cloudflare-computer/"}, {"title": "Cloudflare Details Serving Kimi and GLM Models at Scale on Workers AI", "summary": "Cloudflare detailed how it serves memory-intensive open frontier models \u2014 Moonshot's Kimi K-series and Z.ai's GLM \u2014 at scale on Workers AI. Layered on prefill/decode separation, the techniques include quantizing the KV cache, compressing model weights and protecting shared caches to support higher request density without sacrificing accuracy. Cloudflare cited SGLang-based benchmarking and outlined next steps including broader FP8 KV caches, NVFP4 weight validation on Blackwell GPUs and low-cost integrity checks, all aimed at lowering inference cost for customers.", "type": "Product Launch", "date": "2026-08-03", "source_url": "https://blog.cloudflare.com/smaller-faster-safer-models/"}, {"title": "Cloudflare Kicks Off Agents Week with \u201cAgent Cloud\u201d Strategy", "summary": "Cloudflare kicked off Agents Week, reframing its \u201cAgent Cloud\u201d strategy around building a cloud and developer platform designed for AI agents rather than humans, while acting as a translation layer to today's human-centric web. The week's agenda spans agent primitives, the execution layer, a secure agent lifecycle for enterprises, and the emerging agentic web. Cloudflare invited developers to share what their own agents need from an agent cloud.", "type": "Other", "date": "2026-08-02", "source_url": "https://blog.cloudflare.com/agents-week-welcome/"}]}, "Cloudflare ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Cloudflare Workers and Containers Now Support Inbound TCP and gRPC", "summary": "Cloudflare closed its long-standing HTTP-only gap by adding inbound TCP support to Workers and Containers via Spectrum. A new connect(socket) handler lets a Worker accept raw TCP connections and forward sockets to Containers or Durable Objects, enabling full-duplex gRPC workloads with automatic gRPC-web to gRPC translation. Workers can now act as both gRPC servers and clients, supporting unary and server-streaming APIs. The capability is in private beta, extending Cloudflare's edge delivery reach to non-HTTP protocols and low-latency, near-client processing.", "type": "Product Launch", "date": "2026-08-03", "source_url": "https://blog.cloudflare.com/grpc-workers/"}, {"title": "Cloudflare Launches an API for MoQ: Provision Your Own Isolated Relays", "summary": "Cloudflare launched a provisioning API that lets developers create isolated Media over QUIC relays with separate publisher and subscriber credentials and per-app access controls. Relays become available globally across Cloudflare's network within seconds, removing the need to deploy servers or configure load balancing. The API supports MoQ Transport drafts 14 and 16 with authentication, and is free at any scale during the beta preview period.", "type": "Product Launch", "date": "2026-07-31", "source_url": "https://blog.cloudflare.com/moq-relays/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Durable Execution SDK for .NET Now Generally Available", "summary": "AWS made the Lambda Durable Execution SDK for .NET generally available, joining existing Python, TypeScript and Java support. Developers install the SDK via NuGet, author long-running durable workflows in C#, and deploy using the AWS Extensions for .NET CLI with the same tooling already used for Lambda functions. The release extends AWS's serverless orchestration capabilities to enterprise .NET shops, reducing the need for external workflow engines when building resilient, long-lived application logic on Lambda.", "type": "Product Launch", "date": "2026-08-03", "source_url": "https://aws.amazon.com/blogs/developer/aws-durable-execution-sdk-for-net-now-generally-available/"}, {"title": "AWS Introduces Engineering Development Hub Unified Workbench", "summary": "AWS introduced Engineering Development Hub (EDH), a unified cloud-based engineering workbench combining ISV applications, managed compute, data and AI-powered assistance in a single open-source environment for designing, testing and validating complex systems. Target domains include autonomous vehicles, consumer electronics and robotics. EDH is available in US East (N. Virginia) and US West (Oregon) with expansion underway, including the AWS European Sovereign Cloud. Recent enhancements include automated Active Directory password policy handling, configurable nested virtualization on EC2, a UI revamp and built-in AWS Batch support.", "type": "Product Launch", "date": "2026-08-03", "source_url": "https://aws.amazon.com/blogs/industries/engineering-development-hub-a-unified-workbench-to-accelerate-product-development/"}, {"title": "Amazon Aurora DSQL Adds Multi-Region Cluster Support in Four More Regions", "summary": "AWS expanded Amazon Aurora DSQL multi-Region cluster availability to four additional Regions. Multi-Region clusters provide active-active, strongly consistent distributed SQL with automatic failover, letting customers run resilient applications across geographies without managing replication. The expansion broadens data residency and latency options for globally distributed workloads on AWS's serverless distributed SQL service.", "type": "Product Launch", "date": "2026-07-31", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/07/amazon-aurora-dsql-adds-multi-region-clusters-four-more-regions/"}, {"title": "AWS Managed Microsoft AD Now Supports Standard to Enterprise Edition Upgrade", "summary": "AWS Directory Service now allows in-place upgrades of AWS Managed Microsoft AD from Standard to Enterprise Edition without migrating directories or re-joining workloads. Enterprise Edition raises the object limit from 5,000 to 500,000 while preserving existing trust relationships, application integrations, and group policies, with no DNS or workload changes required. Upgrades run from the console, CLI, or API and are available in all Regions offering Directory Service.", "type": "Product Launch", "date": "2026-08-01", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-microsoft-ad-edition-upgrade/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "AWS Cuts Bedrock GPT Model Inference Prices by up to 80%", "summary": "AWS announced sharp price reductions for OpenAI GPT-5.6 models on Amazon Bedrock, cutting on-demand inference pricing for GPT-5.6 Luna by 80% and GPT-5.6 Terra by 20%, effective July 30. Luna now costs $0.20 per million input tokens and $1.20 per million output tokens, with no customer action needed to receive the lower rates. The same weekly roundup covered CloudWatch managed collectors for Prometheus metrics, underscoring AWS's push to undercut rivals on managed AI inference economics.", "type": "Industry News", "date": "2026-08-03", "source_url": "https://aws.amazon.com/blogs/aws/aws-weekly-roundup-price-reduction-of-gpt-models-in-bedrock-cloudwatch-managed-collectors-for-prometheus-metrics-and-more-august-3-2026/"}, {"title": "Superblocks and AWS Announce Strategic Collaboration on Amazon Bedrock", "summary": "AWS and Superblocks announced a strategic collaboration to bring secure enterprise AI application development to Amazon Bedrock. The partnership pairs Superblocks' AI app-building platform with Bedrock's managed foundation models and AWS security and governance controls, letting enterprises generate and deploy internal AI applications on their own cloud infrastructure. The collaboration extends AWS's Bedrock ecosystem further into agentic and generative app development workflows and reinforces Bedrock as the delivery layer for governed enterprise AI workloads.", "type": "Partnership", "date": "2026-08-03", "source_url": "https://press.aboutamazon.com/aws/2026/8/superblocks-and-aws-announce-strategic-collaboration-to-bring-secure-enterprise-ai-app-development-to-amazon-bedrock"}, {"title": "AWS Transform Agent Builder Toolkit Simplifies Building and Publishing Custom Agents", "summary": "AWS introduced the Transform Agent Builder Toolkit, which streamlines how teams build, package, and publish custom agents on AWS Transform. The toolkit standardizes agent definitions and publishing workflows so migration and modernization teams can extend the platform with their own domain-specific agents. It reduces the manual scaffolding previously required to operationalize custom agentic automation.", "type": "Product Launch", "date": "2026-07-31", "source_url": "https://aws.amazon.com/blogs/migration-and-modernization/simplify-how-you-build-and-publish-custom-agents-with-aws-transform-agent-builder-toolkit/"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "A10 Networks Expected to Post Q2 2026 Earnings Wednesday", "summary": "Analyst previews published August 3 set expectations for A10 Networks' second quarter 2026 results, due after market close on Wednesday, August 5, followed by a management call at 1:30 p.m. PT. Coverage framed the print around continued cybersecurity and AI-infrastructure demand driving A10's secure application and network portfolio across on-premises, hybrid cloud and edge deployments for more than 7,000 customers. The report is the next checkpoint on whether A10's pivot toward AI-adjacent security and infrastructure spending is translating into sustained revenue growth.", "type": "Industry News", "date": "2026-08-03", "source_url": "https://www.defenseworld.net/2026/08/03/a10-networks-aten-expected-to-post-quarterly-earnings-on-wednesday.html"}]}, "A10 Networks ~AI": {"category": "AI Security", "announcements": [{"title": "A10 Networks Promotes TrojAI Partnership for End-to-End AI Security at Black Hat", "summary": "A10 Networks shares rose about 1.5% to roughly $30 after the company spotlighted its partnership with TrojAI ahead of Black Hat USA 2026, where the two will jointly demonstrate AI security at booth 5548. The pitch spans the full AI lifecycle: pre-deployment model and application testing paired with runtime defense, with runtime insights feeding back into what gets tested next. The positioning targets enterprise and public sector buyers deploying AI systems. Analyst sentiment remained broadly positive.", "type": "Partnership", "date": "2026-08-03", "source_url": "https://tradersunion.com/news/companies/show/2885571-a10-networks-stock-up-1-5percent/"}]}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Shares Climb 3.28% on AI Ethernet Switching Demand Ahead of Q2 Results", "summary": "Arista Networks stock rose 3.28% on August 3, outpacing the technology equipment sector, as investors positioned ahead of the company's Q2 2026 report scheduled for August 4. Coverage cited accelerating demand for high-speed 400G/800G Ethernet switching in AI data centers, hyperscaler capex momentum and positive sell-side revisions, with analyst price targets averaging roughly $187. The move underscores the industry shift toward Ethernet-based fabrics for large AI training and inference workloads, while flagging supply chain and customer concentration risks.", "type": "Industry News", "date": "2026-08-03", "source_url": "https://www.tradingkey.com/news/market-movers/262071429-market-movers-anet-20260803"}]}, "Arista Networks ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Arista Warns of Active Exploitation of Critical VeloCloud Orchestrator Flaw", "summary": "Arista disclosed that attackers are actively exploiting CVE-2026-16812, an unauthenticated OS command-injection vulnerability in on-premises VeloCloud Orchestrator carrying a maximum CVSS 10.0 score. The VCO web interface is exposed by default with no configuration-based mitigation, letting remote attackers run privileged commands, fully compromise the orchestrator host and potentially pivot to managed VeloCloud Edge devices. Patches exist for the 5.2, 6.1 and 6.4 branches; a remediated 7.0 build was still pending. Arista urged customers to restrict web interface access and hunt for anomalous activity.", "type": "Security Advisory", "date": "2026-08-03", "source_url": "https://gbhackers.com/hackers-exploit-critical-arista-velocloud-flaw/"}]}, "HPE / Juniper Networks ~P": {"category": "Platforms", "announcements": [{"title": "HCLTech Completes Acquisition of HPE's Telco Solutions Business", "summary": "HCLTech closed its acquisition of HPE's Telco Solutions business, a deal announced in December 2025 valued at up to $160 million including a performance earnout. The carve-out transfers roughly 1,400-1,500 telecom product engineering specialists across 39 countries, plus OSS, HSS and 5G subscriber data management IP supporting over a billion devices across 200 deployments. It follows HCLTech's 2024 pickup of HPE's Communications Technology Group and further narrows HPE's telco software footprint as the company concentrates on AI-native networking.", "type": "Acquisition", "date": "2026-08-03", "source_url": "https://www.prnewswire.com/news-releases/hcltech-completes-acquisition-of-hpes-telco-solutions-business-302841311.html"}]}, "HiddenLayer": {"category": "AI Security", "announcements": [{"title": "HiddenLayer Unveils Agent Harness Security for AI-Powered Software Development", "summary": "HiddenLayer launched Agent Harness Security, a runtime protection layer for AI coding agents. It traces full agent activity from initial prompt through files opened, commands run, dependencies installed, code changes and pull requests, detecting prompt injections, secrets flowing into tool calls, unsafe command execution, malicious dependencies and obfuscated payloads inside the development workflow. Rather than block-only enforcement, it redacts secrets before model access and uses corrective context to steer agents away from poisoned tool responses, combining blocking and content-shaping so pipelines keep moving.", "type": "Product Launch", "date": "2026-08-03", "source_url": "https://www.prnewswire.com/news-releases/hiddenlayer-unveils-agent-harness-security-to-protect-ai-powered-software-development-at-runtime-302841271.html"}]}, "Lasso Security": {"category": "AI Security", "announcements": [{"title": "Lasso Research: Agent Harness Choice Swings AI Red-Teaming Results up to 25x", "summary": "Lasso Security published red-team findings comparing the Claude Agent SDK and deepagents harnesses across 20 attacker missions in finance, legal, healthcare, customer support and education, mapped to three OWASP agentic-security categories. Five attacker models were run on both harnesses for 1,000 total attacks. Results varied dramatically by harness rather than model: one model's success rate jumped from 1% under Claude Agent SDK to 24% under deepagents, a 25x swing driven by translation layers and request shaping. Lasso concludes red-teaming should treat the model-harness pair as the unit of analysis.", "type": "Research/Report", "date": "2026-08-03", "source_url": "https://www.lasso.security/blog/claude-agent-sdk-vs-deepagents-agent-harness-red-teaming"}, {"title": "Lasso's Architecture Secures AI Agents with Intent Security", "summary": "Coverage detailed Lasso Security's intent-based architecture for securing AI agents, combining automated red teaming that probes agent logic across three tiers of adversarial testing, from static payloads to dynamic multi-turn probing, to surface prompt injection flaws. Runtime protection sits at the API gateway using thousands of classifiers with sub-50ms checks, while an LLM-as-a-judge semantic layer inspects inputs and outputs to block data leakage and keep agents inside sanctioned scope. Lasso positions continuous validation and posture management as its differentiators against content-filtering guardrails.", "type": "Other", "date": "2026-07-31", "source_url": "https://securitynews.com/security/lassos-architecture-secures-ai-agents-with-intent-security/"}]}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": [{"title": "Pillar Security Discloses First Real-World Agent-to-Agent Privilege Escalation", "summary": "Pillar Security researchers disclosed what they call the first real-world agent-to-agent exploitation in a production multi-agent system, found in Google's open-source Agent Development Kit for Python. A low-privilege, public-facing triage agent could be manipulated via prompt injection to trigger a separate maintainer-only high-privilege agent, opening a path to software supply chain compromise and exposure of CI runner credentials including a bot PAT and a Google Cloud service account key. Google hardened adk-python, removed affected workflows and tightened reviews.", "type": "Research/Report", "date": "2026-08-03", "source_url": "https://www.theregister.com/security/2026/08/03/google-dev-kit-spurs-first-ever-agent-on-agent-violence/"}]}, "Mindgard": {"category": "AI Security", "announcements": []}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware CFO Buys $50,420 of Stock as Shares Trade Below Analyst Targets", "summary": "Coverage reported that Radware CFO Guy Avidan purchased 2,000 shares at an average $25.21, lifting his holding to roughly 95,800 shares worth about $2.42 million. The insider buy follows Q2 results of $0.30 EPS on $82.28 million revenue, a 5.34% net margin, and a share price near the lower half of its $21.68\u2013$32.79 annual range. Institutions hold about 73% of shares, with recent buying from Morgan Stanley, Deutsche Bank and Man Group, while analyst sentiment remains cautious on the DDoS and application security vendor.", "type": "Industry News", "date": "2026-08-03", "source_url": "https://transcriptdaily.com/2026/08/03/radware-nasdaqrdwr-cfo-acquires-50420-00-in-stock.html"}]}, "Barracuda Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Barracuda CISO: Hugging Face AI Incident Is \"Faster, Not Different\"", "summary": "Barracuda CISO Arve Kjoelen published an analysis of the Hugging Face AI incident, arguing that AI-era breaches stem from ordinary misconfiguration and human error rather than exotic new attack classes. The post contends AI compresses timelines and shifts priorities instead of creating a fundamentally new threat model, and explicitly advises against buying a dedicated AI security product to address this scenario. Instead, Barracuda urges hardening the people and processes using AI through practical controls, exposure management and governance.", "type": "Research/Report", "date": "2026-08-03", "source_url": "https://blog.barracuda.com/2026/08/03/hugging-face-incident-faster-not-different"}, {"title": "Barracuda Analysis: IBM Report Sees Deepfakes Emerging as Top AI Attack Threat", "summary": "Barracuda published analysis of IBM's Ponemon Institute research showing deepfake impersonation now accounts for 47% of AI-enabled breaches, with AI-enabled incidents making up roughly a quarter of all breaches. Barracuda notes AI-related breaches average about $6 million versus the $4.99 million global norm, and most target customer PII at roughly $192 per record. It highlights that 85% of organizations plan to increase security spending, prioritizing alert triage, penetration testing, and vulnerability management.", "type": "Research", "date": "2026-07-31", "source_url": "https://blog.barracuda.com/2026/07/31/IBM-deep-fakes--top-ai-threat"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "Thales Launches Imperva for AWS to Protect Applications and APIs", "summary": "Thales launched Imperva for AWS, a SaaS web application firewall built on AWS and deployed natively via Amazon CloudFront to protect web applications, APIs and client-side code from cyber threats and malicious bot traffic. Because inspection stays inside the AWS network, Thales claims zero added latency plus simplified deployment and centralized visibility and policy management across AWS and other clouds. The service is available immediately on AWS Marketplace with pay-as-you-go pricing, targeting cloud-native and regulated enterprises facing rising automated bot traffic.", "type": "Product Launch", "date": "2026-08-03", "source_url": "https://cpl.thalesgroup.com/about-us/newsroom/thales-launches-imperva-aws-help-organizations-protect-applications-apis"}, {"title": "Imperva Cloud Application Security August 2026 Release: HTTP QUERY Support, BOLA Blocking and AI Application Security", "summary": "Imperva shipped its August 2, 2026 Cloud Application Security release, adding native HTTP QUERY method support in Cloud WAF with full inspection and custom-rule usage, plus dashboard visibility for HTTP/2 Bomb (CVE-2026-49975) mitigations. API Security gained BOLA attack alerting and blocking for self-managed WAF Gateway deployments, device identification via MAC and IMEI detection, and Schema Protection now excludes OPTIONS and HEAD by default. AI Application Security entered controlled availability, delivering real-time protection for LLM-driven apps against prompt attacks and data leakage.", "type": "Product Launch", "date": "2026-08-02", "source_url": "https://docs-cybersec.thalesgroup.com/bundle/cloud-application-security/page/release-notes/2026-08-02.htm"}]}, "Fortinet ~AS": {"category": "Application Security", "announcements": [{"title": "Fortinet Publishes FortiWeb Mitigation Guidance for NGINX Flaw CVE-2026-42533", "summary": "Fortinet issued technical guidance for defending against CVE-2026-42533, a heap buffer overflow in NGINX Open Source and NGINX Plus, using FortiWeb. With no default signature yet available, Fortinet recommends an HTTP protocol constraint limiting request URL length to 2KB with alert-and-deny action, plus a custom WAF signature with a supplied regex applied through the web protection profile. The advisory positions FortiWeb as a virtual-patching layer for upstream web server vulnerabilities.", "type": "Security Advisory", "date": "2026-07-31", "source_url": "https://community.fortinet.com/fortiweb-40/technical-tip-defending-against-2026-42533-with-fortiweb-229193"}, {"title": "FortiGuard Outbreak Alert: HTTP/2 Bomb Denial-of-Service Vulnerability", "summary": "FortiGuard Labs issued an outbreak alert for CVE-2026-49975, an HTTP/2 denial-of-service flaw affecting default configurations of widely deployed web infrastructure. The alert details attack behavior, exposure assessment, and Fortinet protections spanning FortiGate, FortiWeb, and FortiNDR Cloud telemetry for detection and mitigation. Fortinet urges customers to validate configurations and apply relevant IPS and protocol protections to blunt volumetric HTTP/2 abuse against internet-facing applications.", "type": "Security Advisory", "date": "2026-07-31", "source_url": "https://community.fortinet.com/fortindrcloud-59/fortiguard-outbreak-alert-http-2-bomb-denial-of-service-vulnerability-229186"}]}, "Check Point Software ~AS": {"category": "Application Security", "announcements": [{"title": "Check Point IPS Advisory CPAI-2026-9752: Microsoft Exchange Server Cross-Site Scripting (CVE-2026-42897)", "summary": "Check Point published advisory CPAI-2026-9752 covering a medium-severity cross-site scripting vulnerability in Microsoft Exchange Server (CVE-2026-42897) that allows network-based spoofing. Affected builds span Exchange 2016 CU23, 2019 CU14/CU15, and Subscription Edition RTM prior to listed patch levels. Check Point IPS blocks the exploit once gateways are updated to the latest signature release and the protection is enabled and pushed to all gateways.", "type": "Security Advisory", "date": "2026-08-02", "source_url": "https://advisories.checkpoint.com/defense/advisories/public/2026/cpai-2026-9752.html"}]}, "Cloudflare ~AI": {"category": "AI Security", "announcements": [{"title": "Cloudflare MCP Portal Adds Manual OAuth Client Configuration", "summary": "Cloudflare shipped a changelog update to its MCP Portal enabling manual OAuth client configuration for Model Context Protocol server connections. The change gives administrators explicit control over credentials and consent flows when brokering agent access to internal MCP servers, rather than relying solely on automatic client registration. It extends Cloudflare's governance controls for enterprise AI agent access.", "type": "Product Launch", "date": "2026-07-31", "source_url": "https://developers.cloudflare.com/changelog/post/2026-07-31-mcp-portal-manual-oauth/"}]}, "Akamai ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Akamai Cloud Adds NVIDIA RTX PRO 6000 Blackwell 8-Card GPU Instances for AI Inference", "summary": "Akamai announced general availability of 8-card NVIDIA RTX PRO 6000 Blackwell Server Edition GPU instances on Akamai Cloud, targeting high-performance AI inference, AI-accelerated graphics, and advanced simulation workloads. The new plans deliver substantially greater VRAM than prior RTX 4000 Ada or Quadro RTX 6000 options, enabling larger models and longer context windows for language and multimodal inference. The 8-card configurations also expose PCIe topology to the VM via virtual NUMA to optimize memory performance and bandwidth.", "type": "Product Launch", "date": "2026-07-31", "source_url": "https://techdocs.akamai.com/cloud-computing/changelog/july-31-2026-nvidia-rtx-pro-6000-blackwell-8-card-gpu-instances"}]}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Akamai Partners With Tenzai to Bring Instant Vulnerability Mitigation to the Edge", "summary": "Akamai joined forces with Tenzai to integrate Tenzai's autonomous AI pentesting platform with Akamai's Web Application Firewall, closing the loop from vulnerability discovery to edge enforcement. Once a risk is validated, Tenzai generates and deploys targeted WAF rules within minutes, applying temporary blocking while developers ship permanent fixes. The tie-up positions Akamai's WAF as core infrastructure for machine-speed, AI-driven security workflows and deepens its competition with Cloudflare, AWS, and Azure for AI-heavy security budgets.", "type": "Partnership", "date": "2026-08-01", "source_url": "https://finance.yahoo.com/technology/ai/articles/akamai-akam-joins-tenzai-bring-141033562.html"}]}, "Fastly ~AS": {"category": "Application Security", "announcements": [{"title": "Fastly Next-Gen WAF Adds Virtual Patch for CVE-2026-66066 (KindaRails2Shell)", "summary": "Fastly released a Next-Gen WAF virtual patch for CVE-2026-66066, dubbed KindaRails2Shell, an arbitrary file read flaw in Ruby on Rails Active Storage that can escalate to remote code execution. The critical bug (CVSS 9.5) stems from unsafe libvips operations left enabled on untrusted image uploads, exposing secrets such as secret_key_base. Customers can enable the template rule from either the Fastly control panel's Virtual Patches section or the Next-Gen WAF console, choosing block or log behavior.", "type": "Security Advisory", "date": "2026-07-31", "source_url": "https://www.fastly.com/documentation/reference/changes/2026/07/added-virtual-patch-for-cve-2026-66066-kindarails2shell/"}]}, "Radware ~AI": {"category": "AI Security", "announcements": [{"title": "Radware Signs AI Security Strategic Partnership with Dunxin Technology in Taiwan", "summary": "Radware announced a strategic AI cybersecurity partnership with Taiwanese integrator Dunxin Technology to build a new generation of defenses for Taiwan enterprises. The alliance pairs Radware's AI-driven application and network security portfolio with Dunxin's local channel reach, advisory, and technical services. Together they aim to deliver integrated protection spanning threat detection, AI governance, resilience, and the safe deployment of enterprise AI initiatives across the Taiwanese market.", "type": "Partnership", "date": "2026-08-01", "source_url": "https://www.ithome.com.tw/pr/177790"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda MSP Threat Advisory: ChonkyChicken Credential-Stealing RAT", "summary": "Barracuda MSP issued a threat advisory on ChonkyChicken, a modular credential-stealing remote access trojan that harvests browser credentials, hijacks active sessions, and enables lateral movement. Additional modules support remote command execution, network reconnaissance, and user surveillance. Barracuda links the malware to the TAG-195 Golden Chickens ecosystem, noting it spreads via ClickFix social engineering and abuses legitimate Windows utilities to evade detection. The advisory urges layered monitoring and credential hygiene for managed service providers.", "type": "Security Advisory", "date": "2026-07-31", "source_url": "https://smartermsp.com/cybersecurity-threat-advisory-credential-stealing-rat/"}]}};

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-08-03.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
</html>
