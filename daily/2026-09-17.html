(function(){
"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Stock Gains on Strong Q4 Results and AI-Driven Platform Growth", "summary": "Palo Alto Networks reported Q4 revenue of $3.41 billion, up 34% year over year, with full-year revenue of $11.5 billion, up 24%. Remaining performance obligation reached $21.2 billion and next-generation security ARR hit $9.1 billion, up 63%, after nearly $1 billion of net-new next-gen ARR in the quarter. Management attributed momentum to rapid scaling of AI-powered security platforms and broader Cortex Exposure Management adoption.", "type": "Earnings", "date": "2026-09-17", "source_url": "https://www.ad-hoc-news.de/boerse/news/corporate-news/palo-alto-networks-stock-gains-after-strong-q4-results-and-ai-driven/70116924"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Palo Alto Networks Named a \u201cMarket Shaper\u201d in Gartner Emerging Market Quadrant for AI Application Security", "summary": "Palo Alto Networks was named a \u201cMarket Shaper\u201d in Gartner\u2019s September 2026 Emerging Market Quadrant for AI Application Security \u2013 Established Vendors, crediting its unified Prisma AIRS platform. The company positions four pillars: Secure AI Coding, Secure Enterprise AI Applications, Govern Agent Actions, and centralized governance through an AI Gateway. Its argument is that fragmented point products cannot deliver unified discovery, risk assessment, runtime protection, and access control, so AI security must be consumed as a single platform.", "type": "Analyst Report", "date": "2026-09-17", "source_url": "https://www.paloaltonetworks.com/blog/2026/09/defining-the-standard-for-ai-security/"}, {"title": "Unit 42 Deploys Frontier AI Models in Production to Automate Cyber Defense and Vulnerability Remediation", "summary": "Palo Alto Networks\u2019 Unit 42 moved frontier AI models into production inside customer environments to automate cyber defense and vulnerability remediation. Building on the Frontier AI Defense initiative launched in May 2026, the capability identifies, validates, and remediates complex attack paths that traditional scanners miss, and adds multi-model orchestration that routes each task to the best-suited model. The rollout follows pilots across more than 1,000 global security operations centers.", "type": "Product Launch", "date": "2026-09-17", "source_url": "https://skyportsystems.net/palo-alto-networks-unit-42-deploys-advanced-frontier-ai-models-to-automate-cyber-defense-and-vulnerability-remediation-2/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Named a Leader in the 2026 Gartner Magic Quadrant for Hybrid Mesh Firewall", "summary": "Fortinet was named a Leader in Gartner\u2019s 2026 Magic Quadrant for Hybrid Mesh Firewall for the second consecutive year, earning its highest-ever score for Ability to Execute. The recognition centers on FortiGate firewalls powered by FortiASICs and FortiOS as part of the AI-Native Security Fabric. Fortinet noted it now appears in 11 Gartner Magic Quadrant reports spanning networking and security, and highlighted investment in AI-driven operations and post-quantum cryptography.", "type": "Analyst Report", "date": "2026-09-17", "source_url": "https://vir.com.vn/fortinet-earns-leader-status-in-gartner-firewall-report-for-second-year-161004.html"}, {"title": "Fortinet Opens $60M New York City Innovation Hub with Cloud PoP and Training Lab", "summary": "Fortinet opened a 40,000-square-foot company-owned Innovation Hub in New York City, backed by more than $60 million in investment. The facility includes a Fortinet Cloud PoP, an executive briefing center, a cybersecurity training lab, and upgraded energy-efficient infrastructure. Fortinet aims to deepen ties with financial services and regional enterprises through on-site experts, hands-on demos, and in-person training that drive Security Fabric and cloud adoption.", "type": "Announcement", "date": "2026-09-17", "source_url": "https://simplywall.st/stocks/us/software/nasdaq-ftnt/fortinet/news/will-new-york-hub-opening-change-fortinet-ftnt-stock-narrati"}, {"title": "UAE Cyber Security Council and Fortinet Launch Cybersecurity Internship Program", "summary": "Fortinet and the UAE Cyber Security Council launched a cybersecurity internship program under the Cyberani Practical Training Initiative. The program develops Emirati talent through structured training, hands-on labs, mentorship from Fortinet experts, and exposure to real-world security environments, with participants able to earn the Fortinet NSE 4 FortiOS certification. The first phase runs with a UAE university and builds toward a planned UAE Center of Excellence for threat intelligence and policy collaboration.", "type": "Partnership", "date": "2026-09-17", "source_url": "https://knowledgemiddleeast.com/training/uae-cyber-security-council-and-fortinet-announce-new-internship-program/"}, {"title": "Fortinet Advisory FG-IR-26-166 Discloses CVSS 8.9 Unauthenticated Access Flaw in FortiSandbox", "summary": "Fortinet published advisory FG-IR-26-166 detailing an improper access control vulnerability (CWE-284) affecting FortiSandbox, FortiSandbox Cloud, and FortiSandbox PaaS, rated CVSSv3 8.9. An unauthenticated attacker can read sensitive data by sending specially crafted HTTP requests. Fortinet recommends restricting web UI access from untrusted networks, isolating the FortiSandbox management interface, reviewing access logs for anomalous HTTP requests, and tracking PSIRT updates for affected versions and patches.", "type": "Security Advisory", "date": "2026-09-17", "source_url": "https://cybersecurefox.com/en/fg-ir-26-166-fortisandbox-unauthenticated-access/"}, {"title": "Fortinet Issues Guidance on Exploited FortiCloud SSO Authentication Bypass CVE-2026-24858", "summary": "Fortinet released guidance on CVE-2026-24858, a FortiCloud SSO flaw that let attackers log into Fortinet devices registered to other customers. Fortinet briefly disabled FortiCloud SSO in late January 2026 and re-enabled it with server-side changes to block exploitation, but already-compromised devices remained affected. CISA added the flaw to its Known Exploited Vulnerabilities catalog. Fortinet documented unauthorized firewall changes, rogue account creation, and VPN reconfigurations during exploitation.", "type": "Security Advisory", "date": "2026-09-17", "source_url": "https://theclarity.today/story/fortinet-releases-guidance-to-address-ongoing-exploitation-of-authentication-85c21326"}]}, "Fortinet ~AI": {"category": "AI Security", "announcements": [{"title": "Fortinet Adds AI Visibility, Native DLP, and Dynamic Risk Scoring to FortiEndpoint", "summary": "Fortinet updated FortiEndpoint with centralized visibility into sanctioned and unsanctioned AI apps and agents running on endpoints, plus granular guardrails to allow, monitor, or block specific tools. Native DLP inspects data shared with AI apps and web services at the endpoint, covering PII, intellectual property, and financial data, with real-time user coaching. FortiAI-assisted operations handle investigations and policy recommendations via natural language, while dynamic risk scoring adjusts access in real time.", "type": "Product Launch", "date": "2026-09-17", "source_url": "https://www.techpartner.news/news/fortinet-adds-ai-visibility-dlp-and-risk-scoring-to-fortiendpoint-platform-628977"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Ships Emergency Patch for Actively Exploited CVSS 10.0 ISE Zero-Day CVE-2026-76460", "summary": "Cisco released an emergency patch for CVE-2026-76460, a CVSS 10.0 authentication bypass in Identity Services Engine and ISE Passive Identity Connector. Remote unauthenticated attackers can send a crafted request to the ise-kong API gateway, bypass the web management interface, and execute commands with root privileges regardless of configuration. Exploitation was observed in the wild and CISA added the flaw to its Known Exploited Vulnerabilities catalog. No workaround exists; patched releases are available.", "type": "Security Advisory", "date": "2026-09-17", "source_url": "https://www.securityweek.com/active-exploitation-triggers-emergency-patch-for-cisco-ise-zero-day/"}, {"title": "Cisco Fixes Dozens of Critical Flaws Across Secure Firewall Management Center, ISE, and Nexus Dashboard", "summary": "Cisco published a coordinated batch of patches covering dozens of vulnerabilities across three product families. Identity Services Engine received fixes for 20 CVEs including 12 critical-severity flaws enabling SQL injection, data tampering, arbitrary command execution, authentication bypass, and denial of service. Secure Firewall Management Center received 18 CVEs with eight critical bugs allowing root-level command execution and privilege escalation. Nexus Dashboard was also patched; patching is the only mitigation.", "type": "Security Advisory", "date": "2026-09-17", "source_url": "https://www.securityweek.com/cisco-fixes-dozens-of-flaws-across-fmc-ise-and-nexus-dashboard/"}]}, "Cisco ~AS": {"category": "Application Security", "announcements": [{"title": "Cisco Discloses Second Actively Exploited Zero-Day in Two Days, Hitting Secure Email Gateway", "summary": "Cisco disclosed CVE-2026-76461, a 9.8-rated zero-day in Secure Email Gateway appliances and the Secure Email Cloud service, its second actively exploited zero-day in as many days. The flaw lets a remote attacker execute arbitrary SQL through crafted emails, with no login or management interface access required, leading to root-level command execution. Cloud customers were upgraded automatically. No workaround exists; on-premises customers must upgrade AsyncOS.", "type": "Security Advisory", "date": "2026-09-17", "source_url": "https://www.infosectoday.io/attackers-use-sql-injection-emails-to-root-cisco-gateways/"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cisco Delivers Trusted AI at Scale with New Splunk Advancements and Cisco AI POD for Splunk", "summary": "Cisco expanded its Splunk portfolio to let enterprises run AI securely and cost-effectively on infrastructure they already control. The new Cisco AI POD for Splunk brings self-managed AI to on-premises, private cloud, and air-gapped Splunk Enterprise deployments using pre-validated AI runtimes, Cisco hardware, NVIDIA acceleration, and a Kubernetes foundation. Cisco also enhanced Splunk Observability Studio and the Network Intelligence App, and added agentic SOC capabilities for autonomous detection, investigation, and response.", "type": "Product Launch", "date": "2026-09-17", "source_url": "https://businessnewsforprofit.com/business/cisco-delivers-trusted-ai-at-scale-through-new-splunk-advancements/"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Named a Leader in The Forrester Wave: External Threat Intelligence Service Providers, Q3 2026", "summary": "CrowdStrike was named a Leader in The Forrester Wave: External Threat Intelligence Service Providers, Q3 2026, earning the highest scores of all evaluated vendors in both Current Offering and Strategy. The company highlighted platform-native intelligence built on proprietary endpoint telemetry, with the Falcon sensor processing roughly seven trillion events daily and tracking more than 290 named adversaries. CrowdStrike positioned Threat AI as the mechanism that converts that data into SOC action.", "type": "Analyst Report", "date": "2026-09-17", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-named-leader-external-threat-intelligence/"}, {"title": "CrowdStrike and Intel Bring On-Device AI to Falcon Data Security for Real-Time Classification", "summary": "CrowdStrike announced a collaboration with Intel that adds on-device AI to its Falcon Data Security platform for real-time data classification. The integration runs OpenVINO-supported, NPU-optimized models directly on Intel Core Ultra-powered endpoints, using dedicated AI hardware to deliver low-latency, efficient, and privacy-preserving classification without shipping data off the device. The approach moves beyond traditional rule-based data protection and aligns with securing the growing installed base of AI-enabled PCs.", "type": "Partnership", "date": "2026-09-17", "source_url": "https://cyberwarriorsmiddleeast.com/crowdstrike-on-device-ai-data-security/"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike Launches SafeMind, Using Adversarial Co-Evolution to Harden AI Defenses", "summary": "CrowdStrike introduced SafeMind, a proactive defense approach from its Cyber Superintelligence Lab that pairs offensive testing with defensive measures in a continuous co-evolution loop. The first offering is the Frontier AI Readiness and Resilience (FAIRR) Service, powered by Red Tempest, which assesses custom applications and dependencies for exploitable weaknesses. CrowdStrike claims 70% improved accuracy, a 99% cost reduction, and six-times-faster autonomous detection creation against novel threats.", "type": "Product Launch", "date": "2026-09-17", "source_url": "https://www.crowdstrike.com/en-us/blog/crowdstrike-safemind-best-offense-builds-best-defense/"}, {"title": "NVIDIA and CrowdStrike Deepen Agentic Cybersecurity Collaboration Across SafeMind, Falcon IQ, and Guardian AI", "summary": "CrowdStrike detailed an expansion of agentic cybersecurity built with NVIDIA, spanning the new SafeMind system, Falcon IQ for operationalizing Project QuiltWorks through agentic workload automation, and a broader Guardian AI safety offering. NVIDIA contributes high-fidelity cyber agent environment testing to validate safety and effectiveness, plus Nemotron models that power the Charlotte AI AgentWorks no-code platform where Falcon IQ runs. The combination pushes toward continuously co-evolving offensive and defensive AI.", "type": "Partnership", "date": "2026-09-17", "source_url": "https://futuretechmarkets.com/markets/nvidia-and-crowdstrike-strengthen-agentic-cybersecurity-frontier-21/"}]}, "Zscaler": {"category": "Platforms", "announcements": []}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Critical Check Point Management Server Flaw CVE-2026-91843 Allows Unauthenticated Root Code Execution", "summary": "Check Point disclosed CVE-2026-91843, a 9.8-severity stack overflow in the unauthenticated login flow of its Security Management Server, Log Servers, and Multi-Domain servers running R82.20, allowing remote code execution as root without credentials. Check Point shipped a fix through its LivePatch channel and advisory sk1000155, with auto-update customers protected and no evidence of active exploitation reported. This is the fifth critical unauthenticated flaw found in the Security Management Server since July 22, 2026.", "type": "Security Advisory", "date": "2026-09-17", "source_url": "https://thehackernews.com/2026/09/critical-check-point-management-server.html"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Workers Traces Now Automatically Include JavaScript RPC Session Spans", "summary": "Cloudflare Workers tracing now automatically captures JavaScript RPC session spans across Worker boundaries and Durable Objects, with no code changes required. The dashboard visualizes caller-side sessions, method calls, callee invocations, nested calls, and callbacks, using execution colors and arrows to show time allocation and session reuse. Developers enable it by setting observability.traces.enabled in their Wrangler config, improving debugging and performance visibility for distributed edge applications.", "type": "Product Launch", "date": "2026-09-17", "source_url": "https://developers.cloudflare.com/changelog/post/2026-09-17-javascript-rpc-session-spans/"}]}, "Cloudflare ~AI": {"category": "AI Security", "announcements": [{"title": "Cloudflare Adds BYOK Enforcement to AI Gateway, Blocking Unified Billing Fallback", "summary": "Cloudflare introduced a \u201cRequire provider credentials\u201d setting for AI Gateway that forces all third-party model provider requests to present matching bring-your-own-key credentials, rejecting non-compliant calls with HTTP 400 instead of silently falling back to Cloudflare Unified Billing. Teams can enable it globally via UI or API and per-request with a header. The change targets deterministic cost attribution, compliance, and tighter secret governance for enterprises routing LLM traffic through Cloudflare.", "type": "Product Launch", "date": "2026-09-17", "source_url": "https://cloudninjas.ca/cloud/enforcing-byok-credentials-in-ai-gateway-to-block-unified-billing-fallback/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare Launches New Controls Separating AI Training from Search Crawling", "summary": "Cloudflare rolled out an expanded AI crawling framework that splits automated traffic into three independent controls \u2014 search, AI training, and AI agents \u2014 replacing the older blanket \u201cBlock AI Bots\u201d switch. A new \u201cDisallow AI Training\u201d setting lets publishers refuse model training while staying indexed in search, and Cloudflare introduced an \u201cAccountable\u201d crawler designation with four criteria operators such as Google, Apple, and Microsoft must meet. Qualifying crawlers will be published on Cloudflare Radar.", "type": "Product Launch", "date": "2026-09-17", "source_url": "https://techedgeai.com/cloudflare-helps-end-the-search-or-ai-training-tradeoff/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Makes Low-Cost Burstable Amazon EC2 T8i Instances Generally Available", "summary": "AWS released Amazon EC2 T8i burstable instances, powered by custom sixth-generation Intel Xeon 6 processors and sixth-generation Nitro cards. T8i delivers up to 30% better price/performance and 70% higher compute performance than T3, with 1.25x more network bandwidth and 2.4x more EBS bandwidth, across nano, micro, small, and medium sizes. The instances keep the familiar CPU credit model and launched across US, European, Asia Pacific, and Canadian regions.", "type": "Product Launch", "date": "2026-09-17", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/ec2-t8i-instances-ga/"}, {"title": "AWS Elastic Beanstalk Introduces Fully Managed Cluster Mode with Amazon EKS", "summary": "AWS launched Cluster Mode for Elastic Beanstalk, adding fully managed Kubernetes through Amazon EKS and shared infrastructure for enterprise workloads. AWS handles deployment, scaling, patching, monitoring, and continuous upgrades while customers focus on application logic. Cluster Mode is generally available in all commercial regions where Elastic Beanstalk is supported, and integrates with AWS MCP Server and agent plugins so developers can query APIs and troubleshoot deployments through AI-assisted workflows.", "type": "Product Launch", "date": "2026-09-17", "source_url": "https://www.thenasguy.com/2026/09/17/aws-elastic-beanstalk-introduces-cluster-mode/"}, {"title": "AWS Announces Energy Industry AI Workflows for Amazon Quick", "summary": "AWS introduced ready-to-use AI workflows in Amazon Quick built for energy and utilities customers, covering grid planning, asset management, drilling exploration, and compliance without custom development. The workflows draw on MCP-connected partners including Accenture, Hitachi, IBM, S&P Global, Seeq, Slalom, and Tiger Data, unifying production monitoring, grid operations, maintenance, and energy trading data in one interface. Quick connects to customer data sources to generate recommendations and automate actions.", "type": "Product Launch", "date": "2026-09-17", "source_url": "https://press.aboutamazon.com/aws/2026/9/aws-announces-new-energy-industry-workflows-for-amazon-quick"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "AWS and NVIDIA to Deploy 2 Million Additional GPUs and Next-Generation AI Infrastructure", "summary": "AWS and NVIDIA announced a major expansion of their collaboration, planning to deploy 2 million additional NVIDIA GPUs (Blackwell Ultra, Rubin, Rubin Ultra) across AWS infrastructure in 2027\u20132028. The expansion covers NVIDIA Vera CPUs, NVLink Fusion with high-bandwidth memory for Trainium, advanced networking via Nitro and EFA, and continued Nemotron open-model support on Bedrock and SageMaker. AWS will also build AI factories for the US government on secure infrastructure.", "type": "Partnership", "date": "2026-09-17", "source_url": "https://www.storagenewsletter.com/2026/09/17/aws-and-nvidia-to-deliver-2-million-additional-gpus-and-next-generation-infrastructure-for-agentic-and-physical-ai/"}, {"title": "Amazon Bedrock Adds Open-Weight Models in AWS European Sovereign Cloud", "summary": "AWS announced general availability of its first open-weight models on Amazon Bedrock within the AWS European Sovereign Cloud, letting EU-resident organizations run generative AI workloads with EU data residency and EU-based operators. The sovereign partition uses a German corporate structure with an initial Brandenburg region. AWS did not detail model names, licensing, or pricing, though prior reporting tied the expansion to Mistral AI and OpenAI models and a zero-operator-access inference engine.", "type": "Product Launch", "date": "2026-09-17", "source_url": "https://letsdatascience.com/news/amazon-bedrock-adds-open-weight-models-in-eu-cloud-725b7fdc"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": [{"title": "Lasso Study Finds Text Watermarking Shifts LLM Refusals and Tool Calls", "summary": "Lasso Security researchers found that SynthID-Text watermarking, intended only for content provenance, measurably changes LLM behavior \u2014 an effect they call \u201csampling drift.\u201d Across 21 model-and-temperature pairs roughly 6.5% of verdicts changed, altering safety refusals, tool selection, and tool arguments, with direction and magnitude varying by model and watermark key. Under prompt injection, some models complied with requests they would normally refuse. Lasso advises re-running agent evaluations with the exact watermark configuration before production.", "type": "Research", "date": "2026-09-17", "source_url": "https://www.unite.ai/lasso-study-finds-text-watermarking-shifts-llm-refusals-and-tool-calls/"}]}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": [{"title": "Pillar Security Named an AI Security Technical Innovator in the Latio 2026 AI Security Market Report", "summary": "Latio\u2019s 2026 AI Security Market Report named Pillar Security an AI Security Technical Innovator, placing it in the Broader AI Security category spanning endpoints, SaaS, and first-party agents. Latio cited Pillar\u2019s unified platform for protecting AI agents, the endpoints they run on, and the applications they touch, including runtime guardrails, shadow AI visibility, DLP, prompt-injection detection, and granular identity-to-resource permissions. The report also highlighted Pillar\u2019s Red Graph Suite for agentic red-teaming and governance.", "type": "Analyst Report", "date": "2026-09-17", "source_url": "https://www.pillar.security/blog/pillar-security-named-an-ai-security-technical-innovator-in-the-latio-2026-ai-security-market-report"}]}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": []}, "Fastly ~AS": {"category": "Application Security", "announcements": [{"title": "Fastly Highlights 43% Security Growth as AI Traffic Fuels Edge Opportunity", "summary": "Speaking at an investor conference, Fastly highlighted $183 million in quarterly revenue, up 23% year over year, with security revenue up 43% and delivery up 17%. Management credited AI and agentic traffic for driving triple-digit year-over-year growth in bot management and DDoS protection, while the Web Application Firewall remains Fastly\u2019s largest product amid rising multi-product adoption across delivery, security, and compute. Fastly said it will discuss its three-year outlook at its upcoming investor day.", "type": "Announcement", "date": "2026-09-17", "source_url": "https://www.marketbeat.com/instant-alerts/event-fastly-highlights-43-security-growth-as-ai-traffic-fuels-edge-opportunity-2026-09-17/"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "NetScaler ADC Authentication Bypass CVE-2026-19490 Lands on CISA KEV With 22,000+ Devices Exposed", "summary": "CVE-2026-19490, an unauthenticated authentication bypass in NetScaler ADC and Gateway rated CVSS 9.3, is being actively exploited after a working proof-of-concept circulated, and has been added to CISA\u2019s Known Exploited Vulnerabilities catalog. The flaw affects SSL VPN, ICA proxy, CVPN, RDP proxy and AAA virtual servers on builds before 14.1-73.32 and 13.1-63.21. Scans found more than 22,000 internet-facing NetScaler ADC instances plus roughly 1,700 Gateways. There is no workaround.", "type": "Security Advisory", "date": "2026-09-17", "source_url": "https://tech-insider.org/citrix-netscaler-cisa-kev-22000-exposed-2026/"}, {"title": "Technical Breakdown: NetScaler SAML Handling Turns Gateway Into an Open Door", "summary": "A technical analysis walks through how CVE-2026-19490 abuses NetScaler\u2019s SAML authentication handling to forge a valid session without credentials, turning an internet-facing Gateway into an unauthenticated entry point. It documents affected builds including FIPS and NDcPP variants, notes the absence of any official mitigation, and stresses the short gap between Citrix\u2019s August 19 disclosure and in-the-wild exploitation. Roughly 239,000 internet-exposed NetScaler instances make the appliance a persistent scanning target.", "type": "Research", "date": "2026-09-17", "source_url": "https://dev.to/kozhevniko/citrix-netscaler-saml-authentication-bypass-why-cve-2026-19490-turns-a-gateway-into-an-open-door-35mp"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Raises 2026 Outlook Again on Sustained AI Data Center Demand", "summary": "Arista lifted its full-year 2026 revenue outlook to roughly $12.6 billion, its third raise of the year, citing continued strength in AI data center networking and hyperscale Ethernet deployments. Management points to AI training and inference fabrics as an ongoing, multi-year driver rather than a one-time build cycle, with quarterly revenue tracking above the $3 billion mark. Commentary flags customer concentration and competition from Cisco and NVIDIA as the main offsets.", "type": "Earnings", "date": "2026-09-17", "source_url": "https://simplywall.st/stocks/us/tech/nyse-anet/arista-networks/news/does-raised-2026-outlook-change-the-bull-case-for-arista-net"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": []}, "HPE / Juniper Networks ~P": {"category": "Platforms", "announcements": [{"title": "HPE Extends Mist and Aruba Central Cloud Management to CX Switches in Self-Driving Network Push", "summary": "HPE detailed plans to bring cloud-managed, AI-native operations to HPE Networking CX switches through both HPE Mist and Aruba Central, with initial support in Fall 2026 for the CX 5420, 6300 and 6400 series. Capabilities include code-based onboarding, Layer 2 and Layer 3 configuration, VSF stack support, firmware upgrades, remote diagnostics, wired SLE and Marvis Actions. The move lets customers standardize configuration and use AI-assisted troubleshooting across mixed Aruba and Juniper estates.", "type": "Announcement", "date": "2026-09-17", "source_url": "https://airheads.hpe.com/blogs/lright-void1/2026/09/17/webinar-recap-hpe-self-driving-network-and-what-th"}]}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware Publishes 7 Cloud WAF Best Practices Drawn from Enterprise Security Teams", "summary": "Radware published a blog distilling seven Cloud WAF best practices reported by enterprise security practitioners in G2\u2019s Fall 2026 review cycle, covering policy tuning, onboarding, false-positive reduction, and operational ownership. The post doubles as social proof for Radware Cloud WAF, citing its Leader placement and 97/100 satisfaction score in the G2 Grid Report for Web Application Firewall. It positions Radware\u2019s WAF as validated by practitioner reviews rather than analyst opinion alone.", "type": "Research", "date": "2026-09-17", "source_url": "https://www.radware.com/blog/cloud-waf-best-practices-from-enterprise-security-teams/"}, {"title": "Analysis: Radware\u2019s Cloud Momentum Still Needs to Reach the Bottom Line", "summary": "A September 17 investor-facing analysis argues that Radware\u2019s cloud security growth has not yet converted into durable profitability. The piece credits continued cloud adoption and recurring-revenue expansion but flags margin and bottom-line pressure as the open question for the company\u2019s trajectory. For competitive watchers, it signals that Radware\u2019s cloud WAF, bot, and DDoS business is scaling on revenue while its earnings quality remains a point of scrutiny.", "type": "Analyst Report", "date": "2026-09-17", "source_url": "https://wordupnews.com/business/radware-cloud-momentum-still-needs-to-reach-the-bottom-line/"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}};

  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
