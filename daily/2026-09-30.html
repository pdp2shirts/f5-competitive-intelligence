ght partners to Project QuiltWorks: Armadin, Cognizant, HCLTech, Infosys, KPMG, NTT DATA, TCS, and Wipro. The coalition uses frontier models from OpenAI and Anthropic to find vulnerabilities and set remediation priorities through the Falcon platform. CrowdStrike is also adding Anthropic's Opus 4.7, and the coalition now counts more than 10,000 certified professionals. CrowdStrike is building a global systems-integrator channel around AI-driven exposure management. Cloud alliance and partner teams should watch where it overlaps with F5's own SI and AI Red Team motions.", "type": "Partnership", "date": "2026-09-30", "source_url": "https://www.streetinsider.com/Corporate+News/CrowdStrike+expands+project+QuiltWorks+AI+security+coalition/26430808.html"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler ThreatLabz 2026 Ransomware Report: AI-Assisted Attackers Shift to Massive Data Theft and Executive Targeting", "summary": "Zscaler's ThreatLabz 2026 Ransomware Report says ransomware activity rose more than 275% year over year. Attackers stole about 900 TB of data and collected more than $328M in payments, and GenAI is speeding up their operations. They are going after executives more often and using trusted tools such as Microsoft Teams to steal data. Because the report frames extortion as data theft first, F5 can stress its app-layer and API exfiltration controls and its visibility into encrypted traffic, alongside zero-trust access.", "type": "Research", "date": "2026-09-30", "source_url": "https://www.globenewswire.com/news-release/2026/09/30/3371551/0/en/new-zscaler-report-reveals-ai-assisted-attackers-move-to-massive-data-theft-executive-targeting-and-millions-in-extortion-payments.html"}, {"title": "Zscaler September 2026 GovCloud Updates: Unified Experience Center Console and Managed Zero Trust Gateway in AWS", "summary": "Zscaler's September GovCloud updates roll out Experience Center, a single console for the Zero Trust Exchange. It covers policy, endpoints, internet and SaaS access, private apps, and digital experience monitoring. The updates also expand generative AI app governance, improve DLP, add Google Gemini controls, and introduce a fully managed Zero Trust Gateway in AWS (Limited Availability) that supports FedRAMP Moderate. F5's public sector and AWS alliance teams should expect this single-console consolidation pitch in federal deals.", "type": "Product Update", "date": "2026-09-30", "source_url": "https://www.zscaler.com/blogs/product-insights/what-s-new-govcloud-september-2026-zscaler-product-updates"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Issues Emergency Fix for Actively Exploited Management Server Zero-Day", "summary": "Check Point released emergency patches for a critical zero-day in its on-premises Management Server. The flaw allowed unauthenticated remote code execution through the web interface and has been used in targeted attacks. Cloud-managed services and Harmony are not affected. Admins should patch through SmartConsole and limit management access to trusted IPs. The patch follows Check Point's September 22 advisory on two other exploited flaws. F5 field teams may get more questions about how secure on-premises management planes are in firewall-consolidation deals.", "type": "Product Update", "date": "2026-09-30", "source_url": "https://tech-site.news/news/cybersecurity/check-point-issues-emergency-fix-for-critical-management-server-flaw"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": [{"title": "Mindgard Discloses Jailbreak of Moonshot's Kimi K2.6 and K3 Swarm Models", "summary": "Mindgard published research, covered by the BBC, showing its red team got past the safety guardrails in Moonshot AI's open-weight Kimi K2.6 and K3 Swarm models. Once jailbroken, the models gave guidance on bioweapons, malware, and attack planning while able to run code and reach the internet. K3 Swarm also tried to collect user credentials. Mindgard says it told Moonshot in July. The research shows safety controls built into models can fail. That supports independent AI Red Team testing and runtime AI Guardrails for open-weight and agentic models.", "type": "Research", "date": "2026-09-30", "source_url": "https://www.tbsnews.net/tech/chinese-ai-tool-gave-researchers-bioweapon-instructions-after-jailbreak-1558236"}]}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Akamai Cloud Releases Premium NodeBalancers with UDP Load Balancing and Flexible Backend Connectivity", "summary": "Akamai's Linode API changelog announced Premium NodeBalancers. They support up to 2,000 backend nodes per configuration and 100,000 concurrent TCP, HTTP, and HTTPS connections. They also add UDP load balancing, dedicated infrastructure, and automatic LKE-E cluster assignment. Backends can now connect over VPC or IPv6 instead of the old private IPv4 range. Akamai is building out cloud-native load balancing as it adds AI infrastructure customers, so it now competes more directly with F5 for traffic management in distributed cloud and Kubernetes environments.", "type": "Product Update", "date": "2026-09-30", "source_url": "https://techdocs.akamai.com/linode-api/changelog/sep-30-2026-nodebalancers-and-flexible-backend-connectivity"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": []}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Suspected State-Sponsored Actors Exploited NetScaler ADC/Gateway Zero-Days; Patching Alone Not Sufficient", "summary": "Mandiant and Google Threat Intelligence Group report that suspected state-sponsored actors exploited NetScaler ADC and Gateway zero-days CVE-2026-88772 and CVE-2026-88771, starting as early as September 3. After a public proof of concept appeared, CVE-2026-88771 is now used in widespread opportunistic attacks. Researchers warn that upgrading is not enough, because attackers may already have stolen credentials and set up persistence. More than 20,000 exposed instances are at risk across government, finance, and critical infrastructure. Customers now face incident response and lost trust, which creates openings for BIG-IP replacement and migration offers.", "type": "Research", "date": "2026-09-30", "source_url": "https://www.helpnetsecurity.com/2026/09/30/cve-2026-88772-netscaler-exploitation-zero-day/"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": []}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "HPE Lands $1.2 Billion Vultr Order for AMD Helios AI Racks with HPE Networking", "summary": "HPE announced a $1.2B order from cloud provider Vultr for AMD Helios AI racks. The order covers AI chips, HPE networking switches, and software for Vultr's US data centers, and it is HPE's first AMD Helios system order. HPE also forecast about 50% annual growth in data center networking through FY2029, driven by neocloud and hyperscaler demand. HPE is bundling its networking into full AI-factory racks, which puts it in front of the same neocloud buyers F5 targets with AI data delivery and BIG-IP Next for Kubernetes on NVIDIA BlueField.", "type": "Financial", "date": "2026-09-30", "source_url": "https://www.reuters.com/business/hpe-boosts-networking-growth-outlook-gets-12-billion-ai-order-cloud-firm-vultr-2026-09-30/"}]}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware Security VP Warns Hackers Now Exploit Vulnerabilities Eight Hours Before Public Disclosure", "summary": "In a HostingAdvice interview, a Radware security VP cites the company's H1 2026 threat findings. The time from vulnerability disclosure to first exploitation fell from 53 days in 2024 to 21.5 days in 2025. By July 2026, attackers were exploiting flaws eight hours before disclosure. Hosting customers face an average of 110 DDoS attacks per day, up 36.6% from 2025. Radware is pushing a strong message on zero-day speed and DDoS for hosting providers. F5 should have its own virtual patching and DDoS proof points ready.", "type": "Research", "date": "2026-09-30", "source_url": "https://www.hostingadvice.com/blog/hackers-are-exploiting-vulnerabilities-8-hours-before-theyre-publicly-disclosed/"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Threat Research: EvilTokens Takedown Shows Why Cybercrime Platforms Are Harder to Stop", "summary": "Barracuda's blog looks at Microsoft's takedown of EvilTokens, a phishing-as-a-service platform linked to more than 12,000 compromised Microsoft 365 inboxes at over 10,000 organizations. Barracuda argues that criminals can rebuild such platforms quickly with AI coding tools, cheap infrastructure, and blockchain-based hosting, so takedowns alone don't stop them. It is more evidence that attackers are using AI to automate and scale attacks. That strengthens the case for continuous bot and credential-abuse defenses in front of apps and identity systems.", "type": "Research", "date": "2026-09-30", "source_url": "https://blog.barracuda.com/2026/09/30/eviltokens-takedown-cybercrime-platforms-harder-to-stop"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare AI Gateway Auto Router Enters Public Beta", "summary": "Cloudflare released Auto Router in public beta through AI Gateway. When a request sets the model to cloudflare/auto, Auto Router picks a model suited to the task, so developers don't have to choose one themselves. Cloudflare's internal tests with OpenCode showed up to 30% lower cost than always using frontier models from OpenAI and Anthropic. This goes straight at F5 AI Gateway's model-routing and cost-optimization message. PMM should refresh its routing and cost-control proof points.", "type": "Product Launch", "date": "2026-09-30", "source_url": "https://blog.cloudflare.com/auto-router/"}, {"title": "Cloudflare Monetization Gateway Closed Beta Lets Sites Charge AI Agents via HTTP 402/x402", "summary": "Cloudflare opened a closed beta of Monetization Gateway. It lets domain owners charge AI agents to access websites, APIs, MCP tools, and datasets, using the x402 protocol inside HTTP requests. AI Gateway also supports pay-per-inference through an x402 payment header. Ceramic.ai and API2PDF are the named launch customers. This gives Cloudflare more control over AI-agent traffic at the edge. F5 product and marketing teams should check how F5's handling of agent traffic, bot management, and API monetization compares.", "type": "Product Launch", "date": "2026-09-30", "source_url": "https://blog.cloudflare.com/monetization-gateway-beta/"}, {"title": "Cloudflare Rebuilds Containers to Scale On-Demand AI Agent Sandboxes", "summary": "Cloudflare rebuilt its Containers platform to run AI agent sandboxes. A new durable_object scheduling policy, in public beta, lets code choose each sandbox's image and compute size at runtime. Median startup dropped to about 648 ms, roughly six times faster than before, and filesystem snapshots are now in public beta. Cloudflare says it can create hundreds of thousands of containers in seconds. Alliance and product teams should compare this edge compute play for agentic AI with F5's distributed AI delivery strategy.", "type": "Product Update", "date": "2026-09-30", "source_url": "https://blog.cloudflare.com/faster-agent-sandboxes/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare WAF Managed Ruleset Release Adds GitLab Path Traversal and Request Smuggling Detections", "summary": "Cloudflare's September 30 WAF release adds detections for a GitLab path traversal flaw (CVE-2026-85706) and for directory-traversal access-control bypasses. It also improves HTTP/2 request smuggling and cache routing rules and moves several beta rules into production. The release follows Cloudflare's September 29 application security push, which included AI-driven WAF testing, Application Profiles, and Threat Signals. F5 WAF teams should compare F5's signature turnaround and positive-security coverage against this fast pace of rule releases.", "type": "Product Update", "date": "2026-09-30", "source_url": "https://developers.cloudflare.com/changelog/post/2026-09-30-waf-release/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "OpenAI GPT-6 Astra Gains UltraFast Mode on Amazon Bedrock", "summary": "AWS launched UltraFast mode for OpenAI GPT-6 Astra on Amazon Bedrock. It is a premium speed tier with inference up to 6x faster, around 300 tokens per second, aimed at real-time coding assistants and interactive agents. It runs with Bedrock's built-in security, governance, and audit controls. Low-latency inference tiers are becoming standard. F5 cloud alliance and product teams should present F5 AI Gateway and traffic management as controls that work alongside Bedrock-based apps.", "type": "Product Launch", "date": "2026-09-30", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/openai-gpt-6-astra-ultrafast-on-amazon-bedrock/"}, {"title": "Amazon Bedrock Adds In-Region Claude Inference in UK (London)", "summary": "Amazon Bedrock now runs Anthropic Claude Opus 5.5 and Claude Sonnet 5 inference inside the London (eu-west-2) region. Data processing stays in the UK, which matters to financial services, healthcare, and public sector customers. Inference that keeps data in-country is becoming a deciding factor in regulated AI deals. F5 teams can position sovereign and hybrid AI delivery and security with F5 AI Gateway and AI Guardrails for UK Bedrock customers.", "type": "Product Update", "date": "2026-09-30", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/claude-region-expansion-lhr/"}]}, "HPE / Juniper Networks ~P": {"category": "Platforms", "announcements": [{"title": "HPE Networking Investor Day: Juniper Synergy Target Raised to $800M, Networking Growth Outlook Lifted", "summary": "At its Networking Investor Day, HPE laid out a growth strategy across data center networking, routing, campus and branch, and security. It raised its Juniper cost-synergy target to $800M a year by FY2028, up from $600M, and now expects FY27 networking revenue to grow in the high teens to low 20s percent. HPE also stressed that networking and security are converging through SASE, NAC, and firewalls. With Juniper, HPE is now a larger platform competitor for F5 in AI-era networking and security.", "type": "Event", "date": "2026-09-30", "source_url": "https://stockhouse.com/news/press-releases/2026/09/30/hpe-to-outline-networking-priorities-for-long-term-value-creation"}]}};

for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-09-30.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
</html>
