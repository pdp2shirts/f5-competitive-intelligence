(function(){
"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Has No PAN-OS Fix for PHP2Shell and Offers a Paid Virtual Patch", "summary": "The Inference reports that Palo Alto Networks has not shipped a PAN-OS or Panorama fix for the PHP2Shell flaws. These are two PHP bugs that allow code execution on the firewall management plane without logging in. For now, Palo Alto is offering a blocking signature from its paid prevention portfolio, and its scores disagree: 9.2 in its blog versus 8.7 in its advisory. For F5, this is a talking point on management-plane exposure and patch transparency, and a prompt to check how exposed F5's own PHP components are.", "type": "Research", "date": "2026-10-22", "source_url": "https://theinference.org/article/palo-alto-networks-has-no-pan-os-fix-for-php2shell-calls-it-9-2-and-sells-a-paid-virtual-patch"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Idira Agent Identity Security Now Generally Available for Prisma AIRS", "summary": "Palo Alto Networks made Idira agent identity security generally available inside Prisma AIRS. Idira now acts as the identity provider for AI agents that go through the Prisma AIRS AI Agent Gateway. It adds agent inventories, short-lived OAuth 2.1 tokens, fine-grained access policies enforced at runtime, and audit trails that tie each agent and MCP tool call back to a human identity. For F5, this pushes Palo Alto further into identity-led control of AI agents and MCP traffic. F5 AI Guardrails and AI gateway messaging should cover agent identity and attribution.", "type": "Product Launch", "date": "2026-10-22", "source_url": "https://www.paloaltonetworks.com/blog/identity-security/idira-agent-identity-security-now-ga-for-prisma-airs/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Ships Coordinated Critical Security Hardening Release for FortiOS, FortiManager and FortiAnalyzer", "summary": "Fortinet released critical and high-severity fixes for FortiOS, FortiManager, FortiAnalyzer, FortiMail and FortiAuthenticator. It says AI-assisted testing with frontier AI model providers found the vulnerabilities. Fortinet is urging customers to patch internet-facing devices right away, and full CVE advisories are due on November 10. For F5, this shows AI-driven vulnerability discovery speeding up patch cycles across the industry. It is a chance to stress F5's secure-by-design practices and its WAF virtual-patching value for exposed infrastructure.", "type": "Product Update", "date": "2026-10-22", "source_url": "https://cybersecuritynews.com/fortinet-urges-to-patch-critical-flaws/"}, {"title": "Colt Launches Fortinet-Powered Quantum-Ready SD-WAN and SASE Services", "summary": "Colt announced managed SD-WAN and SASE services built on Fortinet security technology and marketed as quantum-ready. The services combine Colt's global network with Fortinet's converged networking and security, applying the same policy across users, sites and cloud apps, with post-quantum cryptography support. For F5, this extends Fortinet's reach through service providers and ties its SASE story to post-quantum readiness. F5's cloud alliance and service provider teams should compare their own managed-service and post-quantum messaging.", "type": "Partnership", "date": "2026-10-22", "source_url": "https://www.colt.net/resources/insights/colt-helps-enterprises-simplify-security-and-prepare-for-quantum-threats-with-fortinet-powered-sase"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Outlines Post-Quantum Readiness Roadmap for Infrastructure", "summary": "Cisco says post-quantum readiness is a priority now, citing NSA guidance for 2027 and a June 2026 U.S. Executive Order on federal post-quantum cryptography adoption. Cisco plans quantum-safe communications across most core products by December 2026 and quantum-safe secure boot on new campus, branch and data-center devices. For F5, post-quantum readiness is becoming a buying requirement for traffic-handling and TLS-terminating gear. F5's post-quantum TLS support on BIG-IP and F5 Distributed Cloud should be positioned clearly, especially with federal customers.", "type": "Strategy", "date": "2026-10-22", "source_url": "https://blogs.cisco.com/news/are-you-post-quantum-ready-build-quantum-readiness-into-todays-infrastructure"}, {"title": "Cisco Patches 34 Vulnerabilities Across Expressway, IOS XR, Snort 3 and Unified Communications", "summary": "Cisco fixed 34 vulnerabilities, including a critical remote code execution flaw in Expressway and three critical Unified Communications issues. It also fixed 13 Snort 3 CVEs, including a denial-of-service bug triggered by crafted GTP traffic that affects several security products. For F5, the Snort 3 flaws are a reminder of the risk in shared inspection engines across Cisco firewalls. That supports a defense-in-depth message for F5 application security in front of critical apps.", "type": "Product Update", "date": "2026-10-22", "source_url": "https://www.securityweek.com/cisco-patches-34-vulnerabilities-across-multiple-products/"}]}, "Cisco ~AI": {"category": "AI Security", "announcements": [{"title": "Cisco DevNet Introduces Antares, an On-Device AI Security Analyst Prototype", "summary": "Cisco described Antares, a prototype security analyst built on IBM Granite 4.0 1B. It runs fully offline on a laptop, with no cloud APIs or GPUs, to find likely-vulnerable files in code repositories. Cisco reports a 31.7% hit-at-any rate on the public VLoc benchmark across 500 repositories. For F5, this shows Cisco investing in small, local AI models for security work. F5 product and AI security teams should track small-model and on-device trends for privacy-sensitive customers.", "type": "Research", "date": "2026-10-22", "source_url": "https://blogs.cisco.com/cisco-devnet/antares-security-analyst-laptop-part-1"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike Intelligence Documents Real-World Agentic AI Attack Campaigns", "summary": "CrowdStrike Intelligence reports that threat actors are using AI agents to plan and carry out intrusions with little human direction. In one campaign, a single actor breached at least 15 Argentine healthcare organizations and stole credentials and medical data. CrowdStrike also notes that commercial AI safety controls can be bypassed. For F5, this backs the case for runtime AI protection, bot defense and API security against automated AI-driven attacks. These findings can serve as proof points in F5 AI Guardrails and application security messaging.", "type": "Research", "date": "2026-10-22", "source_url": "https://www.cybersecuritydive.com/news/agentic-ai-cyberattacks-harnesses-crowdstrike/833714/"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler Responds to eMudhra Intermediate Certificate Compromise Across ZIA and ZPA", "summary": "Zscaler says it found no evidence that the compromised eMudhra TLS intermediate certificates affected its own environment. It removed the affected intermediates from root bundles across Internet & SaaS (ZIA) and Private Access (ZPA), and it released Private Access software version 26.58.5 for App Connectors, Private Service Edges and related components. Some eMudhra-issued certificates may no longer be trusted. For F5, this is a reminder to check the trust stores on BIG-IP, NGINX and Distributed Cloud and to give customers equally fast, clear guidance on certificate hygiene.", "type": "Product Update", "date": "2026-10-22", "source_url": "https://trust.zscaler.com/zscaler.net/posts/32406"}, {"title": "Zscaler Positions DSPM to Operationalize Security Classification Guides", "summary": "A Zscaler blog post argues that Security Classification Guides should be turned into working rules instead of left as static documents. The steps it describes are: break guides into atomic rules, build classifiers, scan cloud, SaaS, data-lake and AI-pipeline repositories, map data to access entities, and enforce policy through its Zero Trust engine. Zscaler DSPM is presented as the tool that closes this gap. For F5, this is Zscaler pushing data security into public-sector and AI-pipeline deals. F5 should be ready to explain how its app and API security works alongside data-posture tools.", "type": "Strategy", "date": "2026-10-22", "source_url": "https://www.zscaler.com/blogs/product-insights/stop-treating-security-classification-guides-static-documents"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Research Q3 2026 Brand Phishing Report: Microsoft Most Impersonated, AI Tools Targeted", "summary": "Check Point Research's Q3 2026 Brand Phishing Report finds Microsoft is impersonated in 33% of brand phishing attempts. Attackers increasingly target AI and developer tools such as Claude and Google Antigravity, using fake invoices and malicious install commands. Some campaigns trick victims into running terminal commands or installing remote-access software. For F5, the report shows AI-tool impersonation is becoming a mainstream threat. Marketing can cite it to support campaigns on AI usage governance and bot and fraud protection.", "type": "Research", "date": "2026-10-22", "source_url": "https://www.presseportal.de/pm/14890/6375741"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point Introduces Custom Guardrails for AI Agents", "summary": "Check Point added Custom Guardrails to its AI Security platform. Organizations write their own AI safety rules in plain language and can describe, test and deploy them in under five minutes. The rules run locally on every message and tool call at millisecond latency, with no LLM in the loop. Self-hosted deployment is planned for November 2026. This competes directly with F5 AI Guardrails' custom policy capabilities. Product marketing should update its competitive positioning on ease of policy authoring, latency and self-hosted options.", "type": "Product Launch", "date": "2026-10-22", "source_url": "https://blog.checkpoint.com/ai-security/custom-guardrails-ai-agents/"}, {"title": "Check Point Workforce AI Security Adds Upstream Proxy and Port Selection on macOS and Windows", "summary": "Check Point Workforce AI Security now supports upstream proxy routing and admin-selectable ports on macOS and Windows. Traffic can pass through an existing proxy, so current inspection and compliance controls stay in place, and choosing the port avoids conflicts with VPNs, other security agents and developer tools. The update removes deployment blockers in restrictive enterprise networks. For F5, this shows Check Point lowering the friction of rolling out endpoint AI security. F5 should make sure its own AI security deployment story covers environments that are already proxied or heavily locked down.", "type": "Product Update", "date": "2026-10-22", "source_url": "https://blog.checkpoint.com/product-updates/upstream-proxy-and-port-selection-on-macos-and-windows/"}]}, "Check Point Software ~AS": {"category": "Application Security", "announcements": [{"title": "Check Point: PHP2Shell Is 'Log4Shell at AI Speed,' Hitting ~10% of Organizations", "summary": "Check Point published a CISO-focused post on the PHP2Shell vulnerabilities. It argues that AI speeds up discovery, disclosure and exploitation, so teams must find exposure, reduce risk, deploy protections and patch at the same time. Check Point Research data shows PHP2Shell activity affecting about 10% of organizations worldwide and 14% in Europe. For F5, competitors are using PHP2Shell as a WAF and virtual-patching story. Sellers and marketing should point customers to F5 Advanced WAF and Distributed Cloud WAAP signatures and attack data.", "type": "Research", "date": "2026-10-22", "source_url": "https://blog.checkpoint.com/ai-security/php2shell-log4shell-at-ai-speed-a-cisos-perspective/"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Achieves South Korea ISMS Certification", "summary": "Cloudflare earned South Korea's ISMS certification after a 10-day audit by KISA (Korea Internet & Security Agency) covering 80 controls. The certification adds Korea-specific regulatory requirements on top of its ISO 27001-family certifications, and the work included localizing consent flows and sign-up paths. The move strengthens Cloudflare's position in Korean regulated industries and public-sector deals. F5 field and alliance teams in APJ should confirm which local certifications F5 Distributed Cloud Services hold, so they are ready for compliance questions in Korean deals.", "type": "Strategy", "date": "2026-10-22", "source_url": "https://blog.cloudflare.com/k-isms/"}, {"title": "Cloudflare Tunnel Adds URL Path Normalization for Access-Validated Ingress", "summary": "Starting with cloudflared 2026.10.0, Cloudflare Tunnel can normalize URL paths before matching ingress rules, which tightens security for tunnels that use Access validation. The path sent to the origin does not change. The feature is off by default for now and will become the default in new releases by January 25, 2027. The same day, Cloudflare made a granular Tunnel Read and Monitor role generally available. For F5, Cloudflare keeps hardening its zero-trust app connector. F5 should be ready to compare it with Distributed Cloud App Connect and BIG-IP APM path-handling controls.", "type": "Product Update", "date": "2026-10-22", "source_url": "https://developers.cloudflare.com/changelog/post/2026-10-22-cloudflared-path-normalization/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare MCP Servers Retire /sse Endpoint, Standardize on /mcp", "summary": "As of this date, Cloudflare's MCP servers serve only the /mcp endpoint. Requests to the legacy /sse endpoint return 410 Gone and point to the /mcp URL, and clients may need to sign in again. The change aligns Cloudflare's agent tooling with the current MCP transport standard. For F5, MCP traffic is consolidating on standard HTTP transports. F5 AI Gateway and AI Guardrails should support inspecting and governing /mcp traffic, and product teams should confirm they handle the newer transport.", "type": "Product Update", "date": "2026-10-22", "source_url": "https://developers.cloudflare.com/changelog/post/2026-10-22-cloudflare-mcp-servers-retire-sse/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare Reports Millions of PHP2Shell Attacks Blocked; Full-Transaction WAF Free for All Plans", "summary": "News coverage says Cloudflare blocked millions of PHP2Shell exploit attempts with its expanded WAF. The new full transaction detection checks each HTTP request together with the server's response, and response rules can block the origin's reply before it reaches the attacker. The managed PHP2Shell rules went out about nine hours before public disclosure and are available on every plan, including Free. For F5, Cloudflare now offers free response-side WAF inspection. Product and product marketing should check how F5 WAF response inspection and data-leak prevention compare.", "type": "Product Launch", "date": "2026-10-22", "source_url": "https://www.makeuseof.com/cloudflare-stopped-millions-of-php2shell-attacks-and-turned-on-a-new-free-waf-for-everyone/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Interconnect \u2013 Last Mile Enters Preview with Megaport", "summary": "AWS launched a preview of AWS Interconnect \u2013 last mile, a fully managed service that connects branch offices, data centers and remote sites to AWS. It is built with Megaport's software-defined network and automates BGP, VLAN and ASN setup from the AWS Console, CLI or API. Bandwidth will scale from 1 to 100 Gbps at GA, with a 99.99% SLA. The preview covers the San Jose and N. Virginia metros. For F5, AWS is moving further into hybrid connectivity.", "type": "Product Launch", "date": "2026-10-22", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-announces-AWS-interconnect-last-mile-megaport-preview/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Amazon SageMaker AI Adds Training Session APIs for Serverless Model Customization", "summary": "Amazon SageMaker AI now offers training session APIs. Customers can run their own training loops, such as supervised fine-tuning or DPO reinforcement learning, without provisioning GPUs. SageMaker handles GPU allocation, distributed execution, fault recovery, checkpointing and security. For F5, more custom models on AWS means more inference endpoints to deliver and protect. Alliances and sellers should pair F5 AI Gateway and AI Guardrails with SageMaker-hosted models.", "type": "Product Update", "date": "2026-10-22", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/training-session-apis-on-sagemaker-ai/"}]}, "AWS ~AS": {"category": "Application Security", "announcements": [{"title": "AWS Continuum for Code Vulnerabilities Is Generally Available", "summary": "AWS Continuum for code vulnerabilities is now generally available. The service finds code vulnerabilities, confirms which are exploitable, ranks them by business impact, and proposes fixes as pull requests for human approval: patches, dependency upgrades or config changes. AWS plans to add automatic remediation within defined guardrails later. For F5, AWS is adding AI-driven vulnerability remediation to its native security portfolio. F5 messaging should present WAF and API security as runtime protection during the window between disclosure and patch, which complements code-level fixes.", "type": "Product Launch", "date": "2026-10-22", "source_url": "https://aws.amazon.com/blogs/aws/aws-continuum-for-code-vulnerabilities-is-now-generally-available/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": [{"title": "HiddenLayer Research: \"Man-in-the-Model\" Shows How Compromised LLM Gateways Can Hijack Coding Agents", "summary": "HiddenLayer published research on how LLM gateways and inference intermediaries, such as LiteLLM-style proxies and agent harnesses, can be used to attack coding agents. If one of these layers is compromised, an attacker can read the agent's permissions, change requests and responses, and plant tool calls that look like they came from the model. That could get around guardrails and approval steps. The research shows that the AI gateway is now part of the attack surface.", "type": "Research", "date": "2026-10-22", "source_url": "https://www.hiddenlayer.com/research/blog-llm-gateway-coding-agent-security"}]}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai ~P": {"category": "Platforms", "announcements": [{"title": "Akamai Positions Guardicore Microsegmentation as a 'Radar' for Nonhuman and Agentic AI Traffic", "summary": "Akamai argues that application logs can't show how AI agents and other nonhuman identities actually connect. It proposes Layer 3\u20134 microsegmentation through Guardicore as a live map that exposes hidden AI infrastructure. The post lays out four steps: passive flow mapping, policy design, targeted enforcement and forensic review. For F5, Akamai is pitching its platform story around agentic-AI visibility at the network layer. That puts more pressure on F5 to explain how its application- and API-layer controls for AI traffic complement or improve on segmentation-led approaches.", "type": "Strategy", "date": "2026-10-22", "source_url": "https://www.akamai.com/blog/security/mapping-todays-nonhuman-interactions-requires-better-radar"}]}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Akamai Details Sub-Four-Hour Global WAF Response to PHP2Shell RCE Flaws, Powered by Agentic AI Threat Intelligence", "summary": "Akamai described how it handled the two critical PHP RCE flaws (CVE-2026-109618/109619). It prepared protections while the flaws were still under embargo and deployed Rapid Rule 3000991 across its whole network in Alert mode. The rule switched to active blocking in under four hours. Akamai says agentic AI now runs its CVE triage, variant hunting and rule validation. For F5, speed and AI-driven virtual patching are becoming key WAF talking points, so teams should be ready to show F5's own PHP2Shell signature timeline and response process.", "type": "Research", "date": "2026-10-22", "source_url": "https://www.akamai.com/blog/security-research/beyond-day-zero-akamai-rapid-response-ai-threat-intelligence"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Fastly Launches Platform Metrics API (Beta) with Location Grouping and Curated Metric Sets", "summary": "Fastly introduced a beta historical metrics API. It can group results by data center or region and offers bundled metric sets for delivery, compute, DDoS and NGWAF. It also adds cursor-based paging of up to 10,000 results per page and a single entity_id across resource types. For F5, Fastly is making observability across delivery and security easier to build on. Product and product marketing teams should compare it with F5 Distributed Cloud analytics and API access, especially for customers who build their own dashboards.", "type": "Product Update", "date": "2026-10-22", "source_url": "https://community.fastly.com/t/introducing-the-platform-metrics-api-beta/4543"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "NetScaler Management Interfaces Exposed to PHP2Shell RCE Flaws; Fixes Promised by October 27", "summary": "Citrix disclosed that the PHP2Shell flaws (CVE-2026-109618/109619, CVSS 9.2) affect NetScaler management GUIs on NSIP, SNIP and Cluster IP. They could allow unauthenticated code execution. Fixes for all supported versions are planned by October 27. Until then, Citrix advises restricting management access with ACLs and isolating management interfaces, and it has released WAF signature v186 to protect PHP backends. For F5, this adds to a run of NetScaler vulnerabilities following the actively exploited CVE-2026-88771 series. Expect more ADC replacement conversations, plus migration work for professional services.", "type": "Product Update", "date": "2026-10-22", "source_url": "https://support.citrix.com/external/article/CTX697263/citrix-security-advisory-for-cve20261096.html"}]}, "A10 Networks ~AI": {"category": "AI Security", "announcements": [{"title": "A10 Networks Promotes AI Security at Scale at CyberVerse 2026 London", "summary": "A10 Networks took part in Infinigate's CyberVerse 2026 channel event in London on October 22. Its message was secure, scalable delivery of AI applications as companies move from AI experiments to production. The event supports A10's push with its AI Gateway and AI red teaming. For F5, A10 is pitching an ADC-plus-AI-security story in EMEA that overlaps directly with F5 AI Gateway, AI Guardrails and AI Red Team. Field and channel marketing teams should be ready with differentiated proof points.", "type": "Event", "date": "2026-10-22", "source_url": "https://cyberverse2026.vfairs.com/"}]}, "Arista Networks ~P": {"category": "Platforms", "announcements": [{"title": "Arista Security Advisory 0199: Actively Exploited Critical Flaw in VeloCloud Orchestrator On-Prem", "summary": "Arista disclosed CVE-2026-114625 (CVSS 9.9), a SQL-injection-class flaw in on-prem VeloCloud Orchestrator. It is being actively exploited and lets an authenticated attacker impersonate a local superuser. Fixed releases are 5.2.3.18, 6.1.3.10 and 6.4.2.12, and Arista advises restricting web access to the orchestrator. For F5, this is a security setback for Arista's SD-WAN and branch platform shortly after its AI-driven Zero Trust Branch launch. Field teams can use it when customers ask about operational risk from consolidating their network stack.", "type": "Product Update", "date": "2026-10-22", "source_url": "https://www.arista.com/en/support/advisories-notices/security-advisory/24838-security-advisory-0199"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "HPE Pushes Combined Juniper\u2013Aruba AI-Native Data Center Networking in Hong Kong", "summary": "HPE is promoting an AI data center networking offering in Hong Kong that combines Juniper and Aruba. It is built on Juniper QFX5140/QFX5252 switches, Data Center Director, Mist AI and Marvis, with RDMA/RoCEv2 for GPU-to-GPU traffic. The offering bundles SRX firewalls, SASE, NAC and SD-WAN and targets financial institutions running AI and HPC workloads. For F5, HPE is selling end-to-end AI infrastructure networking in APJ. Cloud alliance and field teams should present F5's AI data delivery and security layer as complementary to HPE fabrics.", "type": "Strategy", "date": "2026-10-22", "source_url": "https://it-square.hk/article/2026/10/20261022hpenoreferrer"}]}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware Details Root Cause Studio, a Tool-Driven AI Approach to Support Case Analysis", "summary": "A Radware blog post describes Root Cause Studio, an internal AI system for analyzing customer support archives. It indexes case files and gives the model about two dozen fixed search and inspection tools, so the model never reads raw files. Radware says this keeps the cost at about 6,000 tokens per turn whatever the archive size, and that it returns root causes down to the exact file and line. For F5, Radware is using AI-driven support efficiency as a selling point. F5 operations and support teams may want to compare AI-assisted triage approaches.", "type": "Strategy", "date": "2026-10-22", "source_url": "https://www.radware.com/blog/posts/the-cheapest-token-is-the-one-you-never-send/"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "Imperva Threat Research Reports Early PHP2Shell Attack Wave: 482K Requests Across 103 Countries in 24 Hours", "summary": "Imperva published early attack data for the PHP2Shell vulnerabilities (CVE-2026-109618/109619). In the first 24 hours after disclosure it saw about 482K requests, 122K attack sessions and 22K targeted sites across 103 countries, and 64.5% of the targeted sites were in the US. Imperva says Cloud WAF protected customers out of the box at embargo lift, while Elastic WAF and WAF Gateway needed updates. For F5, Imperva is using its threat telemetry to claim it responds fastest. F5 should publish its own PHP2Shell coverage for Advanced WAF and Distributed Cloud WAAP, along with proof of signature timing.", "type": "Research", "date": "2026-10-22", "source_url": "https://www.imperva.com/blog/php2shell-early-attack-activity-through-impervas-lens/"}, {"title": "Imperva Discloses Node2Shell RCE in Node.js Brotli Decoder (CVE-2026-111497), Ships WAF Rules", "summary": "Imperva researchers disclosed Node2Shell, a high-severity flaw (CVE-2026-111497) in the Brotli decoder bundled with Node.js. They showed remote code execution on the official Node.js 24.22.0 image, and Express 5 and body-parser 2 setups that decompress Brotli request bodies are exposed. Fixed versions are 22.23.4, 24.22.1 and 26.12.1, and Imperva has added WAF rules. For F5, Imperva is building a reputation for original vulnerability research. F5 teams should confirm Node.js exploit coverage in F5 WAF and NGINX App Protect, and professional services may see virtual-patching requests.", "type": "Research", "date": "2026-10-22", "source_url": "https://www.imperva.com/blog/node2shell-from-brotli-data-to-remote-code-execution/"}]}};

});

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){

  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}

  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
