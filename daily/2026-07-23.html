include central visibility and policy control over approved versus unapproved AI tools, built-in data loss prevention that inspects information shared with AI tools, and risk-based adaptive access tied to device health. FortiAI-Assist adds a natural-language interface for analysts to investigate events and identify high-risk devices, all unified within the Fortinet Security Fabric.", "type": "Product Update", "date": "2026-07-23", "source_url": "https://context.ph/2026/07/23/fortinet-upgrades-fortiendpoint-platform-to-secure-ai-adoption-and-streamline-endpoint-security/"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Patches Actively Exploited Catalyst SD-WAN Vulnerability", "summary": "Cisco warned that a vulnerability in its Catalyst SD-WAN components (Controller, Manager, Validator) has been exploited in the wild, in limited cases involving configuration changes pushed to edge devices. CVE-2026-20245 carries a CVSS score of 7.8, and Cisco PSIRT began receiving exploitation reports in June. Cisco released software updates and issued a Live Protect shield to provide temporary coverage while customers plan upgrades, noting no available workarounds.", "type": "Security Advisory", "date": "2026-07-23", "source_url": "https://www.isssource.com/cisco-clears-sd-wan-vulnerability/"}, {"title": "Tenable Joins Cisco's SolutionsPlus Program as Exposure Management Partner", "summary": "Tenable joined Cisco's SolutionsPlus program, giving Cisco Vulnerability Management customers a path to migrate to unified exposure management with Tenable One. The offering delivers real-time visibility, context, and prioritization across the attack surface using native Tenable sensors, 330+ integrations, and Tenable Hexa AI for rapid action. The partnership includes a secure transition path plus Tenable Professional Services to accelerate deployment and strengthen preemptive defense in the AI era.", "type": "Partnership", "date": "2026-07-23", "source_url": "https://www.globenewswire.com/news-release/2026/07/23/3332170/0/en/Tenable-Joins-Cisco-s-SolutionsPlus-Program-as-an-Exposure-Management-Partner-for-Vulnerability-Management-Customers.html"}]}, "Cisco ~AI": {"category": "AI Security", "announcements": [{"title": "Cisco Launches Antares Open-Weight AI Models to Find Code Vulnerabilities", "summary": "Cisco released Antares, a family of open-weight, security-focused small language models built to locate vulnerabilities in real-world source code. The initial Antares-350M and Antares-1B models (Apache 2.0, on Hugging Face) can be self-hosted to keep sensitive code on-premises, using vulnerability-centered prompts to iteratively inspect repositories and rank risky files with audit traces. In benchmarks, Antares-1B outperformed far larger models. Cisco also published a Vulnerability Localization Benchmark, tying the effort into its Foundry AI-for-defense framework.", "type": "Product Launch", "date": "2026-07-23", "source_url": "https://www.webpronews.com/ciscos-antares-models-challenge-ai-giants-in-hunt-for-software-flaws/"}, {"title": "Cisco Unveils Enterprise Local AI Architecture with AMD Ryzen AI Halo", "summary": "Cisco announced an enterprise-ready local AI architecture built on AMD Ryzen AI Halo, combining on-device execution with cloud providers and a Semantic Router for cost optimization. Cisco Cloud Control provides unified policy, control, and visibility across devices and agents, while Splunk observability, AI Defense for model/agent security, and DefenseClaw for on-device guardrails deliver full-stack protection. The network can quarantine problematic agents and correlate device, employee, and agent identities across the fleet.", "type": "Product Launch", "date": "2026-07-23", "source_url": "https://blogs.cisco.com/ai/from-one-desk-to-the-whole-enterprise-making-local-ai-resilient"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "Cato Networks and CrowdStrike Partner to Unify Network and Endpoint Security", "summary": "CrowdStrike and Cato Networks announced a joint integration unifying the Cato SASE Platform with the CrowdStrike Falcon platform. Cato XOps correlates with Falcon Discover to link endpoint detections with network telemetry, enrich asset visibility, and stream Cato network data into Falcon Next-Gen SIEM for broader threat hunting. The collaboration closes visibility gaps and speeds investigations through a single security-operations workflow, generally available worldwide via the CrowdStrike Marketplace.", "type": "Partnership", "date": "2026-07-23", "source_url": "https://siliconangle.com/2026/07/23/cato-networks-crowdstrike-partner-unify-network-endpoint-security/"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike and Cerebras Partner to Power Falcon AI Detection and Response", "summary": "CrowdStrike partnered with Cerebras Systems to run Falcon AI Detection and Response (AIDR) models on Cerebras' CS-3 wafer-scale inference hardware, delivering real-time, AI-native security across data, models, agents, and identities. Cerebras named CrowdStrike its first security-specific fast-inference customer and will standardize on Falcon to protect its own operations. The deal underscores the importance of low-latency AI for preventing and understanding threats in AI-heavy environments.", "type": "Partnership", "date": "2026-07-23", "source_url": "https://www.sdxcentral.com/news/crowdstrike-taps-cerebras-systems-ai-chips-for-cybersecurity-at-speed/"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Discloses Actively Exploited SmartConsole Zero-Day (CVE-2026-16232)", "summary": "Check Point disclosed a critical authentication-bypass zero-day (CVE-2026-16232, CVSS 9.3) in its Security Management and Multi-Domain Management products, exploited in the wild via SmartConsole. Unauthenticated attackers could obtain an admin login token and gain full privileges to alter security policies. Check Point patched within 72 hours, notified affected customers, and released jumbo hotfixes for R81.20, R82, and R82.10. CISA added the flaw to its Known Exploited Vulnerabilities catalog with a July 25 federal remediation deadline.", "type": "Security Advisory", "date": "2026-07-23", "source_url": "https://www.securityweek.com/new-check-point-zero-day-vulnerability-exploited-in-the-wild/"}]}, "Cloudflare ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Cloudflare Introduces Cache Response Rules", "summary": "Cloudflare launched Cache Response Rules, a new rule type that runs after the origin responds but before content is cached. It lets customers fix caching issues caused by Set-Cookie, ETag, Last-Modified, or restrictive Cache-Control headers without changing origin code, rewriting directives, managing cache-tags, and stripping headers at the edge. When conflicts arise, response-phase rules take precedence over cache rules. The feature is available on all Cloudflare plans and exposed via Dashboard, Rulesets API, and Terraform.", "type": "Product Launch", "date": "2026-07-23", "source_url": "https://blog.cloudflare.com/introducing-cache-response-rules/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Turns Security Hub into an AI and Multicloud Security Control Plane", "summary": "AWS expanded Security Hub into a unified security control plane spanning cloud and AI workloads, now extending to Microsoft Azure. New capabilities include Azure resource monitoring against CIS benchmarks, GuardDuty AI Protection for AI workloads, GuardDuty AI-powered investigations in preview, and a Security Hub AI inventory that maps Bedrock models and SageMaker endpoints to compute, networking, IAM, and data stores. AWS positions the release as a blueprint for consolidating security tooling in the AI era.", "type": "Product Update", "date": "2026-07-23", "source_url": "https://siliconangle.com/2026/07/22/aws-turns-security-hub-ai-multicloud-security-control-plane/"}]}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Akamai Warns PQC Migration Deadlines Demand a Coherent DNS Estate", "summary": "Akamai highlighted that the U.S. executive order on post-quantum cryptography (EO 14412) sets hard migration deadlines\u2014key establishment by end of 2030 and digital signatures by end of 2031\u2014for federal entities and contractors. Akamai stressed that crypto-agility extends beyond algorithm choices to a cryptographically coherent DNS estate, and noted it already supports PQC on its CDN for quantum-safe traffic today. It urged organizations to inventory DNSSEC deployment and dependencies across multi-cloud DNS providers.", "type": "Thought Leadership", "date": "2026-07-23", "source_url": "https://www.akamai.com/blog/security/pqc-migration-deadline-dns-estate"}]}, "Akamai ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Akamai CEO Pitches Distributed Edge Infrastructure for AI Inference", "summary": "Akamai CEO Tom Leighton argued that massive centralized data centers are not the optimal path for scaling AI, outlining Akamai's alternative of a distributed AI infrastructure built on its network of existing facilities. The approach targets low latency, high performance, and cost-effective compute for AI inference rather than concentrating power in hyperscale campuses. Backed by NVIDIA, Akamai aims to extend its internet-style edge architecture to AI, emphasizing inference over training in a federated, edge-centric model.", "type": "Thought Leadership", "date": "2026-07-23", "source_url": "https://www.fastcompany.com/91576638/akamais-ceo-thinks-bigger-data-centers-wont-solve-every-ai-problem"}]}, "Fastly ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Fastly Joins Experian Agent Trust Ecosystem to Advance Trusted AI Commerce", "summary": "Fastly joined Experian's Agent Trust ecosystem to help verify AI agents, authorize transactions, and make real-time trust decisions in autonomous commerce. The integration extends Fastly's edge cloud to the trust framework, enabling identity verification, delegated authority, and transaction confidence at the edge without rewriting existing APIs, authentication, payment workflows, or security controls. The collaboration aims to let trusted AI commerce scale with near-instantaneous, millisecond authorization while preserving customer experience.", "type": "Partnership", "date": "2026-07-24", "source_url": "https://ca.finance.yahoo.com/news/fastly-joins-experian-agent-trust-130000956.html"}]}, "Citrix (NetScaler) ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Citrix Brings Unified LLM and Agentic AI Governance to NetScaler with MCP Gateway", "summary": "Citrix announced NetScaler MCP Gateway capabilities, delivering unified governance for both LLM and Model Context Protocol (MCP) agent traffic from a single platform. New features add secure routing, authentication, and observability for backend MCP servers, plus policy-based model routing and token-level usage tracking for high-volume LLM traffic with per-team visibility. A single-pass architecture handles governance, security, rate limiting, and observability in one data path to minimize latency, included at no extra cost for platform-license customers.", "type": "Product Launch", "date": "2026-07-23", "source_url": "https://thesiliconreview.com/2026/07/citrix-netscaler-mcp-gateway-ai-llm-agentic-governance"}]}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Introduces AI-Driven Zero Trust Edge Threat Management for VeloCloud SD-WAN", "summary": "Arista Networks unveiled AI-driven Edge Threat Management (ETM) for VeloCloud SD-WAN, delivering integrated zero-trust security for enterprise branch offices via a software upgrade. ETM unifies security and SD-WAN on a single edge platform with advanced firewalling, threat prevention, zone-based segmentation, DNS/Geo-IP filtering, and AI-powered policy insights managed from the VeloCloud Orchestrator. Built on Arista AVA, tools like Policy Explainer and Traffic Simulation simplify complex policies. ETM will be generally available in Q4 2026 across current VeloCloud platforms.", "type": "Product Launch", "date": "2026-07-23", "source_url": "https://digitrendz.blog/tech-news/223630/arista-brings-ai-zero-trust-to-velocloud-sd-wan/"}]}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware 2026 Cyber Survey Highlights Urgent Need to Secure the AI Layer", "summary": "Radware released its 2026 Cyber Survey on AI, API, and application security, conducted with Osterman Research. It found 83% of organizations use GenAI/LLMs and 96% plan AI agents within 12 months, yet only 17% have full visibility into AI-driven processes and just 14% into AI crawler traffic. API development is outpacing security, with 48% updating APIs daily but only 19% maintaining automated inventories. Application-layer DDoS attacks hit 71% monthly, with downtime averaging roughly $451,800 per hour.", "type": "Research Report", "date": "2026-07-23", "source_url": "https://ai-techpark.com/radware-survey-highlights-need-to-secure-ai-layer/"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Advances Partner Success Program with New Offerings", "summary": "Barracuda Networks announced enhancements to its Partner Success Program aimed at MSPs and channel partners. Updates include a redesigned partner experience with a through-channel marketing automation platform for co-branded campaigns and 'do-it-for-me' execution, a forthcoming Partner Locator, and integration with the AI-powered BarracudaONE cyber-resilience platform. The company also expanded its Mastery Program with deeper role-based learning, new technical labs, and advanced certification badges, plus guided partner journeys to accelerate time to value.", "type": "Business Update", "date": "2026-07-23", "source_url": "https://smbtech.au/news/barracuda-expands-partner-program-with-new-demand-generation-tools-and-training-pathways/"}]}};

  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-07-23.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
</html>
