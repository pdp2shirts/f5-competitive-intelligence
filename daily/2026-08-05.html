"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Cortex Cloud Adds Software Supply Chain Security Module", "summary": "Palo Alto Networks introduced a Software Supply Chain Security module inside Cortex Cloud to build trust into the SDLC. It adds Software Supply Chain Trust Scores, a continuous integrity metric evaluating SBOM dependencies and the build environment, plus a Supply Chain Attack Threat Center tracking emerging supply chain threats and CVEs in real time. The module extends Cortex Cloud's code-to-cloud coverage, reinforcing Palo Alto's platformization strategy of folding adjacent security functions into a single suite.", "type": "Product Launch", "date": "2026-08-05", "source_url": "https://www.paloaltonetworks.com/blog/cloud-security/software-supply-chain-security-module-new/"}, {"title": "Palo Alto Networks at Black Hat: How AI Erased the 50-Day Patch Window", "summary": "At Black Hat 2026 Palo Alto Networks argued AI-driven vulnerability discovery has collapsed the traditional patch window. Unit 42's agentic AI research system NOVA surfaced roughly 14,090 previously unreported vulnerabilities across 3,915 open-source projects in about two months. The company pitched PAN-OS 12.2 Ceres and its Advanced Virtual Patching capability as the answer, shielding unpatched systems at the network layer while fixes are developed and deployed.", "type": "Research", "date": "2026-08-05", "source_url": "https://www.networkworld.com/article/4205156/palo-alto-networks-at-black-hat-how-ai-erased-the-50-day-patch-window.html"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Prisma AIRS: Unified Data Protection for Claude via Inference Hooks", "summary": "Palo Alto Networks announced the Prisma AIRS API now integrates directly with Claude Enterprise through Anthropic's inference hooks, classifying prompts in real time before data is accessed. Existing enterprise DLP policies, confidentiality definitions and compliance dashboards automatically govern Claude usage with no new rules to author, and Claude events flow into the same audit reporting as other channels. The company positions Claude as one more governed channel, tying the news to Prisma AIRS AI Gateway general availability and Black Hat 2026 demos.", "type": "Product Launch", "date": "2026-08-05", "source_url": "https://www.paloaltonetworks.com/blog/2026/08/prisma-airs-unified-data-protection-for-claude/"}]}, "Fortinet": {"category": "Platforms", "announcements": []}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco IOS XE Software Security Hardening Release: August 2026", "summary": "Cisco published a security hardening release for IOS XE Software addressing multiple internally discovered vulnerabilities found during a comprehensive internal security review. Issues are grouped by CWE class with a single CVE per grouping, and Cisco reported no evidence of active exploitation. No workarounds are available, so customers must upgrade to fixed releases (for example 17.9 to 17.9.10). The advisory was part of Cisco's August 5 PSIRT bundle covering IOS, IOS XE, IMC, RoomOS and Terminal Services Agent.", "type": "Security Advisory", "date": "2026-08-05", "source_url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-iosxe-V8NMuMZJ"}, {"title": "Cisco Catalyst SD-WAN Software Security Hardening Release: August 2026", "summary": "Cisco issued a companion hardening release for Catalyst SD-WAN Software as part of its August 5 PSIRT advisory bundle. The release remediates multiple internally discovered vulnerabilities identified through Cisco's internal security review process, grouped by CWE class. Cisco directs customers to upgrade to the listed fixed software releases, noting there are no workarounds. The bundled disclosure approach spans Cisco's networking and collaboration portfolio, underscoring the maintenance burden that accompanies broad platform consolidation.", "type": "Security Advisory", "date": "2026-08-05", "source_url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-sdwan-faLcR3K"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike Announces $100,000 International AI Security Challenge with AWS", "summary": "CrowdStrike, with AWS, launched \"AI Unlocked: Agents of Chaos,\" a $100,000 international AI red-teaming challenge. The virtual, interactive game teaches defenders how prompt injection, agent hijacking and rogue AI behavior can be exploited and stopped in enterprise AI agents. It runs in three acts \u2014 Sanctum ($10,000), Gatekeeper ($20,000) and Basilisk ($70,000) \u2014 from August 31 to September 29, 2026, with on-site play at Fal.Con 2026 in Las Vegas. The program showcases CrowdStrike's Falcon AI Detection and Response capabilities.", "type": "Other", "date": "2026-08-05", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-announces-international-ai-security-challenge/"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler Wins 3 CRN Tech Innovator Awards", "summary": "Zscaler announced three 2026 CRN Tech Innovator Awards: Security/Secure Access Service Edge for the Zero Trust Exchange, Security/Network Security Enterprise for Zscaler Internet Access, and Edge Computing and IoT for Zscaler Cellular. The company positioned the recognition as validation of its AI security platform, enterprise network security capabilities and edge connectivity portfolio. Zscaler highlighted the awards as a partner enablement moment for conversations around secure access for users, apps, AI agents and devices across distributed environments.", "type": "Award", "date": "2026-08-05", "source_url": "https://www.zscaler.com/blogs/partner/zscaler-wins-3-crn-tech-innovator-awards"}]}, "Zscaler ~AI": {"category": "AI Security", "announcements": [{"title": "Zscaler Integrates With Claude Inference Hooks to Scale AI While Addressing Risks", "summary": "Zscaler announced a collaboration with Anthropic to enforce Zero Trust policy directly inside Claude Enterprise using Claude inference hooks. A single policy defined in Zscaler is enforced at the model layer across all Claude touchpoints, and AI Guard evaluates conversations in real time to prevent data exposure rather than relying on after-the-fact audits. Zscaler frames the integration as eliminating governance fragmentation by giving security teams unified visibility and enforcement across the AI attack surface.", "type": "Partnership", "date": "2026-08-05", "source_url": "https://www.zscaler.com/blogs/product-insights/zscaler-integrates-claude-inference-hooks-scale-ai-while-addressing-risks"}]}, "Check Point Software": {"category": "Platforms", "announcements": []}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare OS Is the First AI Workspace Built Around How Companies Actually Work", "summary": "Cloudflare launched Cloudflare OS, an open-source AI workspace running on its global network that gives every employee a secure, browser-based environment connected to internal company systems. It combines an isolated agent runtime for code execution, a Zero Trust security and governance framework for internal data access, and a platform for personal apps anyone can build and share. Cloudflare OS is available now on GitHub, with a managed deployment option coming to the dashboard and partner-led implementations from Presidio, Happy Cog and others.", "type": "Product Launch", "date": "2026-08-05", "source_url": "https://www.cloudflare.com/press/press-releases/2026/cloudflare-os-is-the-first-ai-workspace-built-around-how-companies-actually-work/"}]}, "Cloudflare ~AI": {"category": "AI Security", "announcements": [{"title": "Cloudflare Gives Companies Full Visibility to Audit and Analyze AI Use", "summary": "Cloudflare introduced Identity-Aware AI Gateway and User Insights, giving IT and security teams real-time visibility into which employees or AI agents are calling AI services. Teams can set individual or team spending limits and automatically flag risky content without changing existing workflows. User Insights learns normal AI usage patterns for every user and automated system, then alerts when behavior deviates from the baseline. The features target AI cost control, data-leak risk and policy enforcement while preserving developer velocity.", "type": "Product Launch", "date": "2026-08-05", "source_url": "https://www.cloudflare.com/press/press-releases/2026/cloudflare-gives-companies-full-visibility-to-audit-and-analyze-ai-use/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Amazon DynamoDB Now Supports Real-Time Vector Search at Any Scale", "summary": "AWS made native vector search generally available in Amazon DynamoDB, letting customers store embeddings alongside operational data without a separate vector store. It delivers single-digit millisecond latency with 99%+ recall, scales to trillions of vectors, supports up to 4096 dimensions with Euclidean, cosine and dot-product metrics, and allows attribute filtering at query time via a new SearchVectors API. Target use cases include semantic memory for AI agents, retrieval-augmented generation, product similarity and personalized recommendations, with serverless pay-as-you-use pricing.", "type": "Product Launch", "date": "2026-08-05", "source_url": "https://aws.amazon.com/blogs/aws/amazon-dynamodb-now-supports-real-time-vector-search-at-any-scale/"}]}, "AWS ~AI": {"category": "AI Security", "announcements": [{"title": "AWS Partners with Anthropic and OpenAI to Bring AWS Continuum into Developer Workflows", "summary": "AWS expanded AWS Continuum into coding environments through integrations with Anthropic Claude Code, OpenAI Codex and Kiro. Continuum for code vulnerabilities, now in preview, performs on-demand scanning, prioritizes findings using the customer's actual AWS context (IAM policies, configurations, network topology and exposure surfaces), validates exploitability in a sandbox, and returns prioritized remediation guidance to the coding assistant. An agent-team loop orchestrates model selection, environment access and secure code delivery so developers do not manage orchestration themselves.", "type": "Partnership", "date": "2026-08-05", "source_url": "https://aws.amazon.com/blogs/security/aws-partners-with-anthropic-and-openai-to-bring-aws-continuum-into-developer-workflows/"}]}, "AWS ~AS": {"category": "Application Security", "announcements": [{"title": "AWS Reintroduces Network Firewall Proxy for Secure Egress Connectivity", "summary": "AWS folded its explicit proxy capability directly into AWS Network Firewall rather than shipping it standalone, so one policy model and one firewall now cover both transparent filtering and explicit proxy inspection. A new no-source-preservation deployment mode attaches the firewall to a NAT Gateway, masking the client's original source IP and routing egress through the NAT address. This enables centralized egress control even with overlapping CIDRs and eliminates duplicate rule languages, unifying egress policy management under a single service.", "type": "Product Launch", "date": "2026-08-05", "source_url": "https://aws.amazon.com/blogs/networking-and-content-delivery/reintroducing-network-firewall-proxy-for-secure-egress-connectivity/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": [{"title": "How To Secure Coding Agents: A Five-Layer Security Model for Agent Harnesses", "summary": "HiddenLayer published research arguing the real attack surface for AI coding agents is the entire agent harness \u2014 prompts, tools, skills, MCP servers and orchestration logic \u2014 not just the model. It proposes a five-layer security model: visibility into every trust relationship, control to contain compromised components, validation instead of assumption, monitoring outside the model itself, and governance with clear ownership. The piece complements HiddenLayer's recently launched Agent Harness Security runtime product and positions whole-ecosystem defense as essential as enterprises scale AI-assisted development.", "type": "Research", "date": "2026-08-05", "source_url": "https://www.hiddenlayer.com/research/how-to-secure-coding-agents"}]}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai ~AI": {"category": "AI Security", "announcements": [{"title": "Akamai Workforce Protector (Formerly LayerX) Advances Enterprise Security", "summary": "Akamai launched Akamai Workforce Protector, the rebranded LayerX technology, as an interaction-layer security product governing how employees and AI agents use AI, SaaS, web and private applications. It delivers real-time data loss prevention, AI usage control, secure enterprise browser capabilities and visibility into modern desktop AI apps and agentic workflows, natively integrated with Akamai's global private access solution. Akamai positions it to close gaps left by traditional SSE, CASB and DLP tools and to stop sensitive data reaching unauthorized AI models.", "type": "Product Launch", "date": "2026-08-05", "source_url": "https://www.stocktitan.net/news/AKAM/akamai-workforce-protector-formerly-layer-x-advances-enterprise-et3pqjy3a39v.html"}, {"title": "Akamai Research: Nearly Half of Enterprise AI Use Bypasses Corporate Security", "summary": "Akamai released its 2026 State of the Internet security report, finding roughly 47% of enterprise AI interactions run through personal, unmanaged accounts, creating major shadow AI visibility gaps. The report details three AI-native attack techniques \u2014 Vibe hacking, CursorJacking and CometJacking \u2014 that bypass traditional perimeters by exploiting local environments, browser extensions and public web pages. It also notes nearly 75% of AI extensions request high or critical permissions, and recommends SSO-based shadow AI elimination, real-time prompt inspection and least-privilege controls for autonomous agents.", "type": "Research", "date": "2026-08-05", "source_url": "https://www.stocktitan.net/news/AKAM/akamai-research-nearly-half-of-enterprise-ai-use-bypasses-corporate-hzghlxofnbj9.html"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Fastly Announces Second Quarter 2026 Financial Results", "summary": "Fastly reported Q2 2026 revenue of $183.3 million, up 23% year over year, with record GAAP gross margin of 63.3% and non-GAAP gross margin of 65.8%. Security revenue grew 43% to $41.7 million while Network Services rose 17% to $133.9 million. LTM net revenue retention hit 117%, the highest in over three years, and RPO reached $341 million, up 38%. Operating loss narrowed to $14.4 million from $36.9 million, and Fastly raised full-year revenue outlook to $732\u2013746 million.", "type": "Financial", "date": "2026-08-05", "source_url": "https://finviz.com/news/377939/fastly-announces-second-quarter-2026-financial-results"}]}, "Fastly ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Fastly Research: AI Traffic Grows 6.5x Faster Than Human Traffic", "summary": "Alongside its Q2 results, Fastly published research showing AI and machine-generated traffic is growing 6.5 times faster than human traffic this year, arguing organizations need new strategies to manage machine-to-machine traffic at the edge. Fastly paired the finding with product and partnership momentum including a Skyfire collaboration for edge-enabled trusted commerce with real-time AI agent transactions, a new C++ SDK for Fastly Compute aimed at secure low-latency AI workloads, and an anti-piracy collaboration with LALIGA.", "type": "Research", "date": "2026-08-05", "source_url": "https://www.stocktitan.net/news/FSLY/fastly-announces-second-quarter-2026-financial-8e1htq49ycp7.html"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "A10 Networks Reports Financial Results for the Second Quarter of 2026", "summary": "A10 Networks reported Q2 2026 revenue of $80.1 million, up 15.5% year over year, with first-half revenue of $155.1 million. Non-GAAP gross margin was 80.3%, adjusted EBITDA margin 30.5%, and non-GAAP diluted EPS $0.25. Management credited demand for security-focused, next-generation networking for AI infrastructure, the June 2026 completion of the TrojAI acquisition, and a multi-year Microsoft agreement supporting scaled AI deployments. Cash and marketable securities totaled $357.3 million as of June 30, 2026.", "type": "Financial", "date": "2026-08-05", "source_url": "https://investor.wedbush.com/wedbush/article/bizwire-2026-8-5-a10-networks-reports-financial-results-for-the-second-quarter-of-2026"}, {"title": "A10 Networks Raises Full-Year 2026 Outlook and Declares Quarterly Dividend", "summary": "Alongside Q2 results, A10 Networks raised full-year 2026 guidance, lifting expected revenue growth to 12-14% year over year (from 10-12%) and EPS growth to 14-16% (from 12-14%). The company cited robust security and AI-infrastructure-related demand, the completed TrojAI acquisition, and an extended long-term Microsoft agreement. The board approved a quarterly dividend of $0.06 per share, payable September 1, 2026 to stockholders of record on August 17, 2026.", "type": "Financial", "date": "2026-08-05", "source_url": "https://www.stocktitan.net/sec-filings/ATEN/8-k-a10-networks-inc-reports-material-event-f8dec2dea811.html"}]}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Q2 Earnings Call Centers on Supply Gains and 2026 Guidance Raise", "summary": "Arista's Q2 2026 earnings call highlighted the company's first $3 billion quarter, with revenue of $3.036 billion up 37.7% year over year on AI-driven data center networking demand. Executives pointed to easing supply constraints and raised full-year expectations, guiding Q3 revenue to roughly $3.3 billion. Arista also emphasized its 1.6 Tbps AI fabric platforms, including liquid-cooled options, as central to scaling AI back-end networks.", "type": "Financial", "date": "2026-08-05", "source_url": "https://finance.yahoo.com/markets/stocks/articles/anet-q2-earnings-call-centers-140000921.html"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": []}, "Radware": {"category": "Application Security", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "Thales Launches Imperva for AWS to Help Organizations Protect Applications and APIs", "summary": "Thales announced Imperva for AWS, a SaaS-based Imperva Web Application Firewall deploying natively on Amazon CloudFront to protect web applications, APIs and client-side code without traffic leaving the AWS network. The offering adds bot and API protection, centralized policy management and visibility across AWS and multi-cloud environments, and claims zero added latency. It is available on AWS Marketplace with pay-as-you-go pricing, targeting faster onboarding and lower operational overhead for highly regulated enterprise workloads.", "type": "Product Launch", "date": "2026-08-05", "source_url": "https://www.imperva.com/company/press_releases/thales-launches-imperva-for-aws-to-help-organizations-protect-applications-and-apis/"}]}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-08-05.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
</html>
