(function(){
"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Patches Actively Exploited PAN-OS Zero-Day (CVE-2026-0322)", "summary": "Palo Alto Networks released patches for CVE-2026-0322, a remote code execution zero-day in the PAN-OS management interface. It has been exploited in limited attacks and affects PA-Series, VM-Series and Panorama. An authenticated attacker with network access could gain root privileges. CISA added the flaw to its Known Exploited Vulnerabilities (KEV) catalog with an October 17 remediation deadline. Palo Alto also issued medium- and low-severity advisories for PAN-OS, GlobalProtect and Prisma Cloud.", "type": "Security Advisory", "date": "2026-10-15", "source_url": "https://www.securityweek.com/palo-alto-networks-patches-pan-os-zero-day-exploited-for-remote-code-execution/"}, {"title": "Palo Alto Networks Releases Inaugural State of Critical Infrastructure Cybersecurity Report", "summary": "Palo Alto Networks published its first State of Critical Infrastructure Cybersecurity Report, produced with Sapio Research. It found that 68% of organizations lack full real-time OT visibility, 59% had a significant breach in the past year, and 95% worry about attacks powered by frontier AI. The report also highlights OT security work with Siemens (virtual firewalls), NVIDIA (Prisma AIRS on BlueField) and IBM/Red Hat (Project Lightwell virtual patching).", "type": "Research/Report", "date": "2026-10-15", "source_url": "https://technologymagazine.com/news/palo-alto-networks-ai-worsens-critical-infrastructure-risk"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Palo Alto Networks Expands Prisma AIRS with Agent Runtime Protection, AI Supply Chain Scanning and AI Gateway Controls", "summary": "Palo Alto Networks announced new security features to help enterprises deploy AI agents safely. They include runtime protection for Claude Enterprise through Prisma AIRS and AI supply chain scanning that now covers agent skills and components as well as models. New AI Gateway features add tool security and intelligent routing. The company said it has shipped more than 20 gateway updates since launch, giving enterprises tighter control over agent data access, tool use and AI costs.", "type": "Product Launch", "date": "2026-10-15", "source_url": "https://www.paloaltonetworks.com/blog/ai-security/agentic-innovation-meets-enterprise-control/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Attackers Exploit FortiGate/FortiManager Flaws to Deploy Stealthy PEERSTITCH Malware", "summary": "Security researchers reported a campaign that exploits Fortinet vulnerabilities to install PEERSTITCH, a memory-resident implant, on FortiGate firewalls. It leaves no files on disk and blends its traffic into legitimate host processes, which makes it hard to detect. Reporting links the campaign to CVE-2024-47575, a FortiManager authentication bypass. Attackers used it to steal configurations and credentials for more than 500 managed FortiGate firewalls at a telecom MSP.", "type": "Security Advisory", "date": "2026-10-15", "source_url": "https://cybersecuritynews.com/fortinet-vulnerabilities/"}, {"title": "Multiple Vulnerabilities Disclosed Across FortiOS, FortiManager, FortiAnalyzer, FortiMail, FortiProxy and FortiSwitch", "summary": "GovCERT.HK issued Security Alert A26-10-26 on multiple vulnerabilities across Fortinet products, including FortiAnalyzer, FortiMail, FortiManager, FortiOS, FortiProxy and FortiSwitch. Crafted requests could enable spoofing, denial of service, information disclosure, tampering or privilege escalation. Fortinet has released patches, and administrators are urged to apply them promptly.", "type": "Security Advisory", "date": "2026-10-15", "source_url": "https://www.govcert.gov.hk/en/alerts_detail.php?id=2115"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Patches Actively Exploited Critical Flaws in Secure Email Gateway and Secure Email and Web Manager", "summary": "Cisco released critical updates for Secure Email Gateway and Secure Email and Web Manager. They address several vulnerabilities, including CVE-2026-76519, which is being actively exploited. It lets attackers write arbitrary files and gain root access when File Reputation is enabled. Most of the related high-severity CVEs score CVSS 9.8. There are no workarounds, so customers must upgrade to fixed releases.", "type": "Security Advisory", "date": "2026-10-15", "source_url": "https://www.isssource.com/cisco-updates-secure-email-gateway-web-manager/"}, {"title": "Atlanta Hawks and State Farm Arena Sign Multiyear Cisco Partnership for Wi-Fi 7 and Venue Security", "summary": "The Atlanta Hawks and State Farm Arena announced a multiyear partnership with Cisco to upgrade connectivity and security at the venue. The deal includes a Wi-Fi 7 rollout for fans, ticketing and point-of-sale, plus a new Production Command Center powered by Cisco for year-round live events. Cisco becomes the arena's Proud Technology Partner.", "type": "Customer Win", "date": "2026-10-15", "source_url": "https://www.nba.com/hawks/news/atlanta-hawks-state-farm-arena-partner-with-cisco-to-enhance-connectivity-with-networking-and-wireless-uprgrades-to-benefit-fans-and-concertgoers"}, {"title": "Cisco Highlights AI-Ready Campus Network Wins at Notre Dame, Auburn and Georgetown", "summary": "Cisco described campus network upgrades at Notre Dame, Auburn and Georgetown that are meant to support AI workloads. Notre Dame Athletics signed a multi-year deal to modernize its campus-wide network, and Georgetown completed one of the largest Wi-Fi 7 deployments in higher education. Cisco presents its switching, wireless, MFA, visibility and security analytics as a single platform behind these projects.", "type": "Customer Win", "date": "2026-10-15", "source_url": "https://newsroom.cisco.com/c/r/newsroom/en/us/a/y2026/m10/cisco-and-higher-ed-building-a-foundation-for-future-learning.html"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Exposes 'Slim Spider' Group Targeting Cloud Infrastructure Behind Brazil's Pix Payments", "summary": "CrowdStrike's Threat Hunting Report 2026 identified Slim Spider, a Brazilian cybercrime group targeting the cloud infrastructure that banks and fintechs use for Pix transactions. In one intrusion, the group stole credentials and digital-asset secrets from a national financial institution. It then moved into the institution's software development environment and automated its attacks through web dashboards.", "type": "Research/Report", "date": "2026-10-15", "source_url": "https://tiinside.com.br/en/15/10/2026/novo-grupo-cibercriminoso-brasileiro-mira-a-infraestrutura-de-nuvem-do-pix-revela-crowdstrike/"}, {"title": "Citi Raises CrowdStrike and Palo Alto Networks Price Targets on Improving Security Spending Momentum", "summary": "Citi raised its CrowdStrike price target to $295 from $260 and kept its Buy rating. It also raised targets for Palo Alto Networks and Zscaler, citing CIO surveys that show cybersecurity spending improving as AI deployments drive more security investment. Despite the upgrade, cybersecurity stocks pulled back from record highs, and CRWD traded about 3% lower during the session.", "type": "Financial", "date": "2026-10-15", "source_url": "https://finance.yahoo.com/markets/stocks/articles/cybersecurity-stocks-retreat-record-highs-120216160.html"}]}, "Zscaler ~AI": {"category": "AI Security", "announcements": [{"title": "Zscaler Brings Anthropic Claude Mythos 5.1 to Endpoint AI Security (Limited Preview)", "summary": "Zscaler announced that Anthropic's Claude Mythos 5.1 is now in limited preview inside Zscaler Endpoint AI Security. Mythos 5.1 improves Exploit Paths, which links AI activity across endpoints so security teams can map possible attack paths and decide where to step in. It pulls related events from several AI apps into one attack-chain view, helping teams rank risky agent behavior, block it before it causes harm, protect sensitive data and enforce endpoint policy in real time.", "type": "Partnership", "date": "2026-10-15", "source_url": "https://prtimes.jp/main/html/rd/p/000000120.000055108.html"}, {"title": "ThreatLabz: Threat Actor Abuses ARTEX Agentic AI Pentesting Framework Against South Korean Banks", "summary": "Zscaler ThreatLabz reported a campaign that misused ARTEX, an open-source agentic pentesting framework built on LLMs, against South Korean financial institutions. The attackers automated reconnaissance, vulnerability assessment and exploitation, and stole personal data on about 67,000 people starting in late September 2026. Zscaler recommends zero-trust architecture, red-teaming of external assets, and controlled agent workflows with defined roles to reduce this kind of AI-driven attack.", "type": "Research/Report", "date": "2026-10-15", "source_url": "https://www.zscaler.com/blogs/security-research/threat-actor-abuses-agentic-ai-pentesting-framework-target-south-korean"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Exposes Fake Calendar-Invite Campaign Targeting Microsoft Credentials at 40,000+ Organizations", "summary": "Check Point's Email Security researchers described a large phishing campaign, running since about September 25, 2026, that uses fake calendar invites and .ics files to steal Microsoft credentials. It has sent more than 302,000 unique phishing emails to over 40,000 organizations from 33,000+ sender domains. Volume rose to more than 740,000 emails in the first two weeks of October. The attackers rely on trusted workplace formats to get past users' suspicion.", "type": "Research/Report", "date": "2026-10-15", "source_url": "https://blog.checkpoint.com/securing-user-and-access/fake-calendar-invites-target-thousands-of-organizations-in-microsoft-credential-phishing-campaign/"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point Launches Dangerous Deviation Detection for AI Agents", "summary": "Check Point added Dangerous Deviation Detection to its AI Security offering. It checks each tool call after the agent picks it but before it runs, and flags dangerous actions the user or system instructions did not ask for. It works alongside prompt attack detection, so inputs and intended actions get two separate checks. Flagged calls can be blocked or sent to a human for approval. It runs on Check Point infrastructure with no calls to outside AI providers and already handles live customer traffic.", "type": "Product Launch", "date": "2026-10-15", "source_url": "https://blog.checkpoint.com/ai-security/dangerous-deviation-detection-ai-agents/"}, {"title": "Check Point IPS Advisory for Flowise AI Agent Builder RCE (CVE-2026-91932)", "summary": "Check Point published advisory CPAI-2026-14193 for a high-severity remote code execution flaw (CVE-2026-91932) in Flowise, an LLM and agent app builder, through version 3.1.4. Attackers can get around path validation through the args array and run arbitrary code. Check Point has released IPS protection for Security Gateway R75 through R82 and tells customers to install the latest IPS update and apply policy.", "type": "Security Advisory", "date": "2026-10-15", "source_url": "https://advisories.checkpoint.com/defense/advisories/public/2026/cpai-2026-14193.html/"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Makes Its Secure Web Gateway and DLP Fully Programmable with Workers", "summary": "Cloudflare tied Gateway and DLP to its Workers developer platform. A new Gateway \"Forward\" action, in public beta on all Zero Trust plans, sends matching traffic to custom Worker code that can rewrite requests and responses, show coaching pages, or trigger tasks such as Slack alerts using identity and device posture context. Gateway still handles TLS decryption and policy enforcement. Custom Functions in Gateway policies and custom DLP validation functions are due later this year.", "type": "Product Launch", "date": "2026-10-15", "source_url": "https://blog.cloudflare.com/programmable-gateway-dlp/"}, {"title": "Cloudflare Open-Sources Void Full-Stack Deployment Platform, SDK and CLI", "summary": "Cloudflare open-sourced Void, a single JavaScript package and Vite plugin made up of the Void Platform, SDK and CLI, for building and deploying full-stack apps on Cloudflare. Developers write server and client code together, with types carried from the database through to the UI. Void provisions Cloudflare resources, runs migrations and deploys automatically. Cloudflare positions it as a safe way to ship AI-assisted (\"vibe-coded\") internal apps without handing out broad cloud access.", "type": "Product Launch", "date": "2026-10-15", "source_url": "https://blog.cloudflare.com/deploy-with-void/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare and OpenAI Share Results of Joint AI Discovery Pilot for the Agentic Web", "summary": "Cloudflare and OpenAI published first results from a July-October 2026 pilot that fed signals from Cloudflare's network into OpenAI's crawler to improve content discovery for ChatGPT Search. Using about 1% of Cloudflare's network, it surfaced large numbers of pages OpenAI had not found before, while spam and change-detection filters cut wasted crawling. The next phase tests better page selection, faster change signals and business results for site owners, with AI Crawl Control governing AI access.", "type": "Partnership", "date": "2026-10-15", "source_url": "https://blog.cloudflare.com/cloudflare-openai-discovery-agentic-web/"}]}, "AWS ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Amazon CloudFront Adds Dual-Stack (IPv6) Support for VPC Origins", "summary": "CloudFront now supports end-to-end IPv6 delivery to private VPC origins through dual-stack VPC origins: ALB, NLB or EC2 origins in private subnets that only CloudFront can reach. Previously VPC origins were IPv4 only, forcing customers to choose between IPv6 and keeping origins private. The feature is available at no extra cost in all commercial regions that support VPC origins.", "type": "Product Update", "date": "2026-10-15", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/cloudfront-vpc-origin-dualstack/"}]}, "AWS ~AI": {"category": "AI Security", "announcements": [{"title": "AWS Introduces 'Trust in Depth' Framework for Securing Autonomous AI Agents", "summary": "AWS published Trust in Depth, which applies defense-in-depth to autonomous AI agents. It stacks independent layers: verified agent identity, firm policy boundaries enforced at Bedrock AgentCore Gateway rather than inside the agent, Bedrock Guardrails, Automated Reasoning checks, monitoring, and escalation to humans. It also uses AWS Agent Registry and per-session permissions that change as a task progresses, aiming to give agents more autonomy while keeping control that can be proven and audited.", "type": "Research/Report", "date": "2026-10-15", "source_url": "https://aws.amazon.com/blogs/machine-learning/trust-in-depth-giving-agents-more-autonomy-without-losing-control/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Web Search on Amazon Bedrock AgentCore Expands to AWS GovCloud and Three More Regions", "summary": "AWS expanded the fully managed Web Search tool in Amazon Bedrock AgentCore to US East (Ohio), US West (Oregon), Asia Pacific (Sydney) and AWS GovCloud (US-West). The tool keeps AI agents' answers current by pulling in web results, and running closer to users lowers latency for research, summarization and Q&A. GovCloud support adds compliance and data residency for government AI workloads.", "type": "Product Update", "date": "2026-10-15", "source_url": "https://aws-news.com/article/2026-10-15-web-search-on-amazon-bedrock-agentcore-expands-to-aws-govcloud-and-3-regions"}]}, "HiddenLayer": {"category": "AI Security", "announcements": [{"title": "HiddenLayer Releases July-September Quarterly AI Threat Landscape Update", "summary": "HiddenLayer published its AI Threat Landscape Report quarterly update for July-September, finding that AI agents are becoming central to security risk. Threats covered include agents acting beyond their intended scope, AI-enabled cybercrime, vulnerable agent tools, and errors in high-stakes settings. The report gives security teams practical steps they can take now and calls for continuous monitoring and strong governance.", "type": "Research/Report", "date": "2026-10-15", "source_url": "https://www.hiddenlayer.com/report-and-guide/quarterly-ai-threat-landscape-update-september"}, {"title": "HiddenLayer Research Shows Decision Model Jev Is Vulnerable to Prompt Injection", "summary": "HiddenLayer tested TypeSafe's Jev, a model that returns decisions rather than text, in a simulated online checkout. A planted sponsored ad (an indirect prompt injection) steered Jev to click a fake 'Confirm Price' button 91% of the time. HiddenLayer concludes that limiting outputs to a fixed set of choices does not stop manipulation, and recommends in-application testing plus runtime monitoring. The research appeared Oct 14; media coverage followed Oct 15.", "type": "Research/Report", "date": "2026-10-15", "source_url": "https://aitamer.news/posts/hiddenlayer-decision-model-prompt-injection/"}]}, "Lasso Security": {"category": "AI Security", "announcements": [{"title": "Lasso Introduces AI-BOM for AppSec to Trace Vulnerabilities to Affected Agents", "summary": "Lasso introduced an AI Bill of Materials (AI-BOM) that applies the SBOM idea to agent-based AI applications, linking each component to the agents that use it. Each entry shows component type, how many agents use it, how it was discovered, and any vulnerabilities and severity, mapped to the OWASP Top 10 for Agentic Applications. The AI-BOM is the discovery step of Lasso's platform and feeds risk management, automated red teaming and runtime protection.", "type": "Product Update", "date": "2026-10-15", "source_url": "https://www.lasso.security/blog/ai-bom-for-appsec-trace-vulnerabilities-to-affected-agents"}]}, "Operant AI": {"category": "AI Security", "announcements": [{"title": "Operant Agent Protector Extends to Defend Agentic Commerce Payments", "summary": "Operant AI extended Agent Protector to block payments that AI agents should not make across the x402, MPP and AP2 payment protocols. Before any payment goes through, it checks the payment against the agent's task, the MCP server, the destination, the amount and company policy, and enforces spending limits and approved destinations. The Semantic Firewall flags prompt injection, agents drifting off task, and runaway payment loops. Operant holds no keys or payment proofs.", "type": "Product Update", "date": "2026-10-15", "source_url": "https://www.operant.ai/art-kubed/stop-dollar-exfiltration-operant-agent-protector-now-defends-agentic-commerce"}]}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "AI, Enterprise SaaS Workloads Drive Akamai Cloud Momentum", "summary": "Akamai announced a new wave of Akamai Cloud Computing customers, mostly software and SaaS firms, with growth across APAC, Japan and EMEA. They use CPU compute, GPU capacity (including NVIDIA RTX PRO 6000 Blackwell) and storage for model training, low-latency inference, core-to-edge app hosting and cloud disaster recovery. Examples include an APAC logistics provider moving AI warehouse workloads and a developer platform moving about 1,500 microservices to Akamai LKE. Customers and contract values were not disclosed.", "type": "Customer Win", "date": "2026-10-15", "source_url": "https://www.akamai.com/newsroom/press-release/ai-enterprise-saas-workloads-drive-akamai-cloud-momentum"}]}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Akamai Adds API Security Dimensions and AI Assistant Insights to Web Security Analytics", "summary": "Akamai updated Web Security Analytics with new API Security dimensions: Incident Type, Incident Severity, Attacker Identifier and API URL, helping users assess threats and trace endpoints in sample request logs. The AI Assistant now counts how often a fixable issue recurs so teams can prioritize long-term fixes. A single consent flow now covers all AI features; accounts with Attack Insights that have not consented to AI Assistant will lose Attack Insights until they do.", "type": "Product Update", "date": "2026-10-15", "source_url": "https://techdocs.akamai.com/security-ctr/changelog/oct-15-2026-improvements-to-web-security-analytics"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": []}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Podcast Breaks Down Citrix NetScaler Zero-Days Allowing Unauthenticated Code Execution on Edge Appliances", "summary": "A Security Boulevard podcast published Oct 15 reviews the NetScaler ADC/Gateway zero-days disclosed in late September 2026, including CVE-2026-88771/88772, which let attackers run code without logging in and reach credentials and session data. Researchers warned of active exploitation before Citrix released bulletin CTX697096, and CISA added CVE-2026-88771 to its KEV list. The podcast warns that patching does not undo earlier breaches, so organizations should also hunt for signs of compromise.", "type": "Security Advisory", "date": "2026-10-15", "source_url": "https://securityboulevard.com/2026/10/podcast-citrix-netscaler-zero-days-code-execution-on-your-edge-box-no-login-no-special-config/"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Mizuho Cuts A10 Networks Price Target to $30, Maintains Neutral", "summary": "On October 15, Mizuho cut its A10 Networks (ATEN) price target from $34 to $30 and kept a Neutral rating. Analyst consensus remains Hold, with an average target of about $30.38. A10's last reported quarter brought revenue of $80.14M, up 15.5% year over year, and EPS of $0.25, beating estimates. Q3 2026 results are due November 5.", "type": "Financial", "date": "2026-10-15", "source_url": "https://www.marketbeat.com/instant-alerts/analyst-a10-networks-nyse-aten-stock-price-target-cut-by-mizuho-2026-10-15/"}]}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Shares Drop ~6% on Insider Sales and Valuation Concerns Ahead of Earnings", "summary": "Arista Networks (ANET) stock fell about 6.09% on October 15. Reported causes were profit-taking, insider sales under pre-arranged 10b5-1 plans, and concern about its high valuation ahead of early-November earnings. Coverage also cited reliance on hyperscalers such as Microsoft and Meta and rising competition in Ethernet-based AI fabrics, including from Nvidia. Analysts still rate it Buy overall, with an average price target of about $242.", "type": "Financial", "date": "2026-10-15", "source_url": "https://www.tradingkey.com/news/market-movers/262219135-market-movers-anet-20261015"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": []}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware Frames AI Threat Detection as the Next Frontier of Application Security", "summary": "A Radware blog post argues application security now has to follow attacker behavior and intent, because attackers can pose as legitimate users. It presents Radware's integrated capability set: AI Xploit Shield, Agent Trust Management, Behavioral API Security, MCP Protection, LLM Firewall and Agentic AI Protection, aiming to close gaps between the web, API and AI-interaction layers. The post followed Radware's October 14 MCP Server Protection launch.", "type": "Product Update", "date": "2026-10-15", "source_url": "https://www.radware.com/blog/ai-threat-detection/"}]}, "Barracuda Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Barracuda Signs OpenAI's Collective Cyber Defense Call to Action", "summary": "Barracuda announced it signed OpenAI's call to action on collective cyber defense. Writing from the CISO's perspective, Barracuda says vulnerability disclosures are growing faster than security staffing, so defenders need high-performance AI to automate and scale protection for customers, MSPs and partners. It supports the principles but notes a remaining gap between finding vulnerabilities and fixing them quickly, calling for more automation and collaboration among governments, AI vendors and software providers.", "type": "Partnership", "date": "2026-10-15", "source_url": "https://www.barracuda.co.jp/blog/openai-collective-cyber-defense/"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "Thales Adds Second Imperva Application Security PoP in Jakarta", "summary": "Thales opened a second Imperva Application Security point of presence in Jakarta, in a separate data center, adding capacity and geographic redundancy as AI-driven bot traffic grows. Indonesia becomes the only Southeast Asian market with two Imperva PoPs. The PoP delivers WAF, Advanced Bot Protection, API Security, DDoS protection and content delivery. Thales says more than half of Indonesia's leading banks use Imperva; the footprint is now 17 PoPs in APJ and 61 worldwide.", "type": "Product Update", "date": "2026-10-15", "source_url": "https://www.indotelko.com/read/1792020087/trafik-bot-berbasis-ai-meningkat-thales-perkuat-ketahanan-digital-indonesia"}]}, "Imperva (Thales) ~AI": {"category": "AI Security", "announcements": [{"title": "Thales Launches CipherTrust DSPM to Protect Sensitive Data from AI Exposure", "summary": "Thales launched CipherTrust Data Security Posture Management (DSPM), combining data discovery and classification with analytics on access, activity and behavior. Teams can encrypt, mask or tokenize data directly based on risk signals, while AI-driven behavioral analytics flag unusual access and insider risk and link signals into attack chains. Coverage spans multi-cloud, on-premises, SaaS and third-party environments, and Thales positions it as going beyond visibility-only DSPM.", "type": "Product Launch", "date": "2026-10-15", "source_url": "https://itbrief.news/story/thales-launches-tool-to-secure-sensitive-data-from-ai"}, {"title": "Thales Expands Google Cloud Collaboration to Secure Agentic AI with AI Security Fabric", "summary": "Thales DIS Japan announced a wider partnership with Google Cloud connecting Thales AI Security Fabric to Gemini Enterprise. The integration provides real-time protection, visibility and policy enforcement across AI agents, models, data and tools, controlling what agents can access, share or run. It targets prompt injection, sensitive data leakage, unsafe outputs and unauthorized actions. Global coverage of the partnership first appeared October 14.", "type": "Partnership", "date": "2026-10-15", "source_url": "https://prtimes.jp/main/html/rd/p/000000037.000106675.html"}]}};

  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
