ing OCP APAC Summit appearances in Taipei as near-term catalysts. Risks cited include heavy hyperscaler customer concentration and pricing pressure in high-performance switching.", "type": "Analyst Report", "date": "2026-08-17", "source_url": "https://simplywall.st/stocks/us/tech/nyse-anet/arista-networks/news/the-bull-case-for-arista-networks-anet-could-change-followin-2"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "HPE Positions PTX 12200 Router for Scale-Across AI Data Center Interconnect", "summary": "HPE Networking detailed its PTX 12200 router as a high-scale data center interconnect platform for AI, built on Express 5 silicon with industry-leading 800G port density. Integrated ZR coherent optics simplify the optical layer and dark-fiber use, while line-rate MACsec provides encryption in transit. HPE framed the platform around scale-up, scale-out, and scale-across designs for distributed GPU clusters, with a roadmap toward 1.6T and 3.2T interfaces.", "type": "Product Launch", "date": "2026-08-17", "source_url": "https://convergedigest.com/hpes-ptx-12200-a-really-big-router-for-scale-across/"}]}, "Radware": {"category": "Application Security", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Integrated Email Protection Named Best Email Security in 2026 Tech Ascension Awards", "summary": "Barracuda announced that Barracuda Integrated Email Protection was named Best Email Security Solution in the 2026 Tech Ascension Awards, citing AI-powered detection and rapid API-based deployment for Microsoft 365 and Google Workspace. The product combines behavioral AI, natural language processing, social graph analysis, and real-time URL inspection to catch phishing, business email compromise, account takeover, impersonation, and AI-assisted attacks. Barracuda pointed to customer results including removal of more than 12,000 malicious emails at one deployment.", "type": "Company News", "date": "2026-08-17", "source_url": "https://www.financialcontent.com/article/bizwire-2026-8-17-barracuda-named-best-email-security-solution-in-the-2026-tech-ascension-awards"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}, "Fortinet ~AI": {"category": "AI Security", "announcements": [{"title": "Fortinet Acquires Virtue AI to Advance Continuous AI Protection", "summary": "Fortinet announced the acquisition of Virtue AI, adding automated AI validation, runtime protection, and security for autonomous agentic systems to its AI-native Security Fabric. Virtue AI contributes Guardian Agent technology, automated red-teaming across hundreds of attack vectors and 1,000+ risk categories, and real-time guardrails that extend FortiAIGate from development through runtime. Terms were undisclosed and described as immaterial, with enforcement and threat intelligence coordinated through FortiGuard Labs.", "type": "Acquisition", "date": "2026-08-17", "source_url": "https://www.fortinet.com/corporate/about-us/newsroom/press-releases/2026/fortinet-advances-continuous-ai-protection-with-the-acquisition-of-virtue-ai"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike Teaches Charlotte AI to Reason Through Detection Triage", "summary": "CrowdStrike published research on a reasoning-enabled triage model that extends its NVIDIA Nemotron-powered Charlotte AI beyond fast true/false-positive verdicts to a transparent, step-by-step chain of reasoning analysts can audit. The classifier reasons across command lines and behavioral signals, reaching 82.6% accuracy and outperforming off-the-shelf and larger models. Initial coverage focuses on Windows endpoint detections, with plans to expand platforms, and the work supports CrowdStrike's Open Secure AI Alliance participation.", "type": "Research", "date": "2026-08-17", "source_url": "https://www.crowdstrike.com/en-us/blog/teaching-ai-to-reason-through-detection-triage/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "AWS Ships EC2 Application Status Checks, IAM Role Manager, and OpenAI Daybreak on Bedrock", "summary": "AWS's weekly roundup detailed new EC2 application-level status checks that detect app-layer failures such as a web server refusing requests or a stopped Docker daemon, plus an IAM role manager that auto-creates or reuses default roles across six service consoles. AWS also made OpenAI Daybreak models available to eligible customers on Amazon Bedrock, offering governed access to frontier AI for defensive security work and vulnerability research, alongside new foundation models in SageMaker JumpStart.", "type": "Product Launch", "date": "2026-08-17", "source_url": "https://aws.amazon.com/blogs/aws/aws-weekly-roundup-ec2-application-status-checks-iam-role-manager-openai-daybreak-on-bedrock-and-more-august-17-2026/"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cisco's AI Networking Supercycle Puts It in Position to Sell Supercomputer Fabrics", "summary": "Analysis of Cisco's record fourth quarter argued the company is finally positioned to sell large-scale AI supercomputer systems and the networks connecting them. Cisco posted $17.3 billion in quarterly revenue with networking product orders up 40% year over year and $4 billion in Q4 hyperscaler AI infrastructure orders, $9.3 billion for fiscal 2026. Management guided to roughly $7.5 billion of AI infrastructure revenue in fiscal 2027, signaling sustained hyperscaler and enterprise AI fabric demand.", "type": "Company News", "date": "2026-08-17", "source_url": "https://www.nextplatform.com/connect/2026/08/17/cisco-can-finally-sell-lots-of-supercomputers-and-their-networks/5288804"}]}, "Zscaler ~AI": {"category": "AI Security", "announcements": [{"title": "Zscaler CISO Calls for an Agentic SOC and a SecOps Revolution", "summary": "Zscaler CISO Sam Curry argued that AI-driven threats require rebuilding security operations rather than automating existing workflows, urging teams to create new signals and instrumentation instead of merely correlating alerts. He described \u201cagentic SOCs\u201d as a human-AI partnership that changes both outcomes and analyst development, favoring apprenticeship over rigid tiering. Curry also flagged destabilizing AI patches from frontier models and a broader, business-focused CISO mandate as emerging operational risks.", "type": "Company News", "date": "2026-08-17", "source_url": "https://www.databreachtoday.co.uk/ai-demands-secops-revolution-a-32565"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare Says Bot Blocking Is Driving New Publisher AI Licensing Deals", "summary": "Cloudflare reported that its default AI crawler blocking and bot management controls are pushing AI companies to strike licensing agreements with publishers, turning unpaid scraping into negotiated access. The company positioned its bot detection and pay-per-crawl controls as leverage that restores publisher bargaining power over content used for model training. The framing extends bot management from a pure security control to a content monetization and access governance play.", "type": "Company News", "date": "2026-08-17", "source_url": "https://pressgazette.co.uk/platforms/cloudflare-says-bot-blocking-is-fueling-publisher-ai-deals/"}]}, "Akamai ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Akamai Details Edge Architecture for Serving Humans and AI Crawlers Separately", "summary": "Akamai published guidance on treating AI agents and human visitors as two distinct audiences, classifying each request at the edge with Bot Manager and then assembling either an AI-optimized or human-ready page using Akamai Functions, edge KV data, and GPUs. The approach caches both variants at the edge to cut origin trips, improve Core Web Vitals, and lower AI inference cost. It positions edge compute as the control point for agentic traffic rather than origin infrastructure.", "type": "Company News", "date": "2026-08-17", "source_url": "https://www.akamai.com/blog/trends/website-two-audiences-humans-ai"}, {"title": "Akamai Makes the Case for Distributed Inference to Cut AI Agent Latency", "summary": "Akamai SVP of Product Jon Alexander argued that AI workloads are moving from centralized training clusters toward multi-stage agent workflows that repeatedly call multiple models and tools across geographies. Each hop adds latency, so Akamai positions distributed inference closer to users and data as the architectural answer for real-time, multi-turn agents. The message frames AI traffic management and model-serving placement as a delivery problem, not just a compute problem.", "type": "Company News", "date": "2026-08-17", "source_url": "https://tfir.io/ai-agent-latency-distributed-inference-akamai/"}]}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Akamai Advisory CISO Warns Agentic AI Shoppers Break Traditional Bot Detection", "summary": "Akamai Advisory CISO Steve Winterfeld outlined how agentic AI shopping bots are shifting commerce traffic from human-driven to machine-to-machine, defeating bot-detection methods that rely on human behavioral cues. Akamai research cited commerce as the top target for API-related attacks, with 85% of surveyed commerce companies reporting API security incidents. The guidance points retailers toward API-layer controls and agent-aware policy rather than blanket bot blocking.", "type": "Research", "date": "2026-08-17", "source_url": "https://tfir.io/agentic-ai-shoppers-api-security-commerce-akamai/"}]}, "Fastly ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Fastly Scales India to 62 PoPs as AI Traffic Drives Edge Demand", "summary": "Fastly detailed an aggressive India buildout, growing from 4 to 62 points of presence in two years and targeting a double-digit share of global business from what is now its fourth-largest market by potential. The company tied the expansion to AI traffic, which it said rose roughly 30% between January and May 2026, noting over 51% of AI requests reach origin infrastructure versus under 9% for human traffic. Fastly plans roughly 5x India go-to-market growth by end of 2027.", "type": "Company News", "date": "2026-08-17", "source_url": "https://brandequity.economictimes.indiatimes.com/news/digital/fastly-eyes-double-digit-india-contribution-as-ai-traffic-grows/133285821"}]}, "Barracuda Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Barracuda Research Shows Microsoft Copilot Turning One Stolen Login Into $247,500 Fraud", "summary": "Barracuda researchers published a proof-of-concept showing how a single compromised Microsoft 365 session, with no malware, can be escalated through Microsoft Copilot into a $247,500 wire fraud. Attackers used legitimate Copilot actions to suppress sign-in alerts, map the org and identify the CEO, locate a pending transfer, draft a convincing payment-change request, and set forwarding rules to intercept replies. Barracuda recommends phishing-resistant MFA and monitoring Copilot queries into invoices and executive mail.", "type": "Threat Intelligence", "date": "2026-08-17", "source_url": "https://startupfortune.com/researchers-show-how-microsoft-copilot-can-turn-one-login-into-247500/"}]}};

  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-08-17.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
</html>
