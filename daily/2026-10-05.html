"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Launches Cortex XCOR AI-Driven Observability Platform with AI SRE Agent", "summary": "Palo Alto Networks introduced Cortex XCOR, an AI-native observability platform that autonomously investigates incidents and recommends fixes. Its AI SRE agent identifies root causes in under three minutes on average, with a 75% success rate in complex production environments, while the XCOR Operator chat interface delegates tasks to specialized agents. The platform combines front-end real-user monitoring (from the Embrace acquisition) and synthetic testing with back-end observability, using consumption-based pricing.", "type": "Product Launch", "date": "2026-10-05", "source_url": "https://thekernelwire.com/devops/palo-alto-networks-cortex-xcor-aims-to-diagnose-outages-in-minutes-reducing-on-call-burden"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "CISA Adds Actively Exploited FortiMail Vulnerability (CVE-2026-104286) to KEV Catalog", "summary": "CISA added a critical FortiMail path traversal flaw (CVE-2026-104286, CVSS 9.8) to its Known Exploited Vulnerabilities catalog after active exploitation, and Fortinet updated its fix guidance the same day. The bug lets unauthenticated attackers write arbitrary files through the GUI, potentially leading to remote code execution, and affects FortiMail 7.2 through 8.0.1. Fortinet advises upgrading or disabling the IBE service; GovCERT.HK also issued a high-threat alert.", "type": "Research", "date": "2026-10-05", "source_url": "https://cybersecuritynews.com/fortinet-fortimail-0-day-vulnerability-exploitation/amp/"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Webex Integrates WhatsApp Messaging via LeapXpert at WebexOne 2026", "summary": "At WebexOne 2026 (Oct 5\u20138), Cisco announced a Webex\u2013LeapXpert integration that lets Webex users message WhatsApp contacts from desktop and mobile through the Webex App Hub. All messages pass through data loss prevention controls and are archived for compliance. The feature requires a Leap Work account and a Webex license, launches with WhatsApp, and more consumer channels are planned.", "type": "Partnership", "date": "2026-10-05", "source_url": "https://www.the-fund.ae/en/news/cisco-integrates-whatsapp-client-messaging-into-webex"}, {"title": "Cisco Outlines One-Cisco Approach to Migrating Edge Workloads from VMware ESXi to NFVIS", "summary": "Cisco is positioning its NFVIS edge virtualization platform as the migration path off VMware ESXi, citing VMware licensing changes and ESXi 8 end of support in 2027. Cisco says early deployments since NFVIS became generally available in March 2026 have delivered fewer support handoffs, faster fixes and lower migration risk by consolidating edge workloads under a single Cisco support model.", "type": "Other", "date": "2026-10-05", "source_url": "https://blogs.cisco.com/innovation/a-one-cisco-approach-to-hypervisor-migration-for-digital-resilience"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Falcon Data Security for SaaS Generally Available for Microsoft 365 and Copilot", "summary": "CrowdStrike announced general availability of Falcon Data Security for SaaS, which connects directly to Microsoft 365 (SharePoint, OneDrive and Copilot) without an additional sensor. It discovers and classifies sensitive data such as PII, PHI and PCI and applies policy-based protection against data theft, oversharing and exposure to AI tools. Support for more SaaS applications is planned.", "type": "Product Launch", "date": "2026-10-05", "source_url": "https://www.crowdstrike.com/en-us/blog/falcon-data-security-for-saas-secures-sensitive-data"}, {"title": "CrowdStrike Falcon Cloud Security Adds Third-Party App Insights and AI-Enhanced Remediation", "summary": "CrowdStrike updated Falcon Cloud Security with third-party application insights that provide visibility into external services and cloud-native dependencies. It also added AI-enhanced remediation plans that turn cloud risk analysis into a prioritized, evidence-backed list of what to fix first, why, and how.", "type": "Product Launch", "date": "2026-10-05", "source_url": "https://www.crowdstrike.com/en-us/blog/falcon-cloud-security-third-party-app-insights-ai-enhanced-remedation/"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike Falcon Platform Now Available Through OpenAI Marketplace", "summary": "CrowdStrike made its Falcon platform available through the OpenAI Marketplace, letting eligible OpenAI enterprise customers apply existing OpenAI commitments toward Falcon purchases. The deal includes Falcon Guardian for visibility and control over OpenAI Codex agents, and brings GPT-5.6 Cyber reasoning first into CrowdStrike's FAIRR service, with plans to extend it across the Falcon platform.", "type": "Partnership", "date": "2026-10-05", "source_url": "https://www.intelligentciso.com/2026/10/05/crowdstrike-expands-route-to-market-through-openai-marketplace/"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler Collaborates with IBM and Red Hat to Protect Private Applications from Frontier AI-Powered Threats", "summary": "Zscaler announced a collaboration with IBM and Red Hat to protect private applications in the window between vulnerability disclosure and patch deployment. The joint solution pairs Zscaler Autonomous Application Shield, delivered through the Zero Trust Exchange, with IBM/Red Hat Lightwell to block exploit attempts inline at the network level and deliver validated fixes for open-source components. Autonomous Application Shield is currently in an Early Access Program.", "type": "Partnership", "date": "2026-10-05", "source_url": "https://www.globenewswire.com/news-release/2026/10/05/3374476/0/en/zscaler-collaborates-with-ibm-and-red-hat-to-protect-private-applications-from-frontier-ai-powered-threats.html"}]}, "Zscaler ~AI": {"category": "AI Security", "announcements": [{"title": "Zscaler Brings Anthropic Claude Mythos 5.1 to Zscaler Endpoint AI Security (Limited Preview)", "summary": "Zscaler opened a limited preview integrating Anthropic Claude Mythos 5.1 into Zscaler Endpoint AI Security. The headline feature, Exploit Paths, correlates multi-stage AI agent activity, tool use and data access across endpoint apps into ranked attack-path analyses, so security teams can decide where to intervene, block risky agent activity in real time at the endpoint, and enforce policy without exposing raw model responses or generating exploit code.", "type": "Product Launch", "date": "2026-10-05", "source_url": "https://www.zscaler.com/mx/blogs/product-insights/bringing-anthropic-s-claude-mythos-5-1-zscaler-endpoint-ai-security"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Research: 5th October Threat Intelligence Report", "summary": "Check Point Research published its weekly Threat Intelligence Report for the week of October 5, 2026, covering new threats, attacks and breaches. It lists new Check Point IPS protections for several CVEs, including Citrix NetScaler buffer overflow (CVE-2026-88772) and command injection (CVE-2026-88771) flaws, plus Cisco Catalyst SD-related vulnerabilities.", "type": "Research", "date": "2026-10-05", "source_url": "https://research.checkpoint.com/2026/5th-october-threat-intelligence-report/"}, {"title": "Analysis: Check Point's Healthcare AI Deal Landed Six Days After a Federal Deadline to Patch Its Own Firewalls", "summary": "The Inference examined Check Point's October 1 AI Gateway partnership with Clalit Health Services, noting the deal was announced six days after US federal agencies were ordered to patch two exploitable Check Point vulnerabilities (CVE-2026-85102 and CVE-2026-93616). The article also reports ongoing ransomware activity exploiting Check Point zero-days since June. Deal terms were not disclosed.", "type": "Other", "date": "2026-10-05", "source_url": "https://theinference.org/article/check-point-s-healthcare-ai-deal-landed-six-days-after-a-federal-deadline-to-patch-its-own-firewalls"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Everything Cloudflare Launched During Birthday Week 2026", "summary": "Cloudflare recapped its 16th Birthday Week: 46 announcements spanning open source (a new CLI and SDKs), post-quantum security for the 'agentic Internet', economic models for AI agents, and developer platform growth. Highlights include the Basin data analytics platform, the K2 serverless event stream, Cloudflare Traces and Observability updates, and network performance gains.", "type": "Event", "date": "2026-10-05", "source_url": "https://blog.cloudflare.com/birthday-week-2026-wrap-up/"}, {"title": "BGP over IPsec and GRE Tunnels Generally Available for Cloudflare WAN and Magic Transit", "summary": "Cloudflare made BGP peering over IPsec and GRE tunnels generally available for Cloudflare WAN and Magic Transit. Customer devices can now exchange routes dynamically with Cloudflare's virtual network routing table, eliminating manual static-route updates. The feature requires Unified Routing; BGP over CNI remains in closed beta.", "type": "Product Launch", "date": "2026-10-05", "source_url": "https://developers.cloudflare.com/changelog/post/2026-10-05-bgp-over-tunnels-ga/"}, {"title": "Cloudflare Fixes Cross-Tenant Data Exposure in Containers", "summary": "Cloudflare disclosed and fixed a cross-tenant data exposure vulnerability in Containers, the technology underpinning Cloudflare Sandboxes, where a Workers Paid customer could have recovered leftover disk blocks from other tenants on the same host. Remediation ran September 4\u201319 and included retiring container disks, draining hosts, restarting VMs and clearing image caches. Cloudflare found no evidence of exploitation and paid a bug bounty.", "type": "Other", "date": "2026-10-05", "source_url": "https://www.infoq.com/news/2026/10/cloudflare-cross-tenant-exposure/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Client VPN Now Supports Device Posture Assessment", "summary": "AWS Client VPN now checks connecting devices against security and compliance requirements before granting network access, integrating with CrowdStrike, Jamf and JumpCloud and defining posture criteria in Cedar policies. Posture is re-checked during active sessions, and non-compliant devices can be disconnected automatically or simply logged in monitoring mode. The feature carries no extra cost and requires client version 6.2.0 or later.", "type": "Product Launch", "date": "2026-10-05", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-client-vpn-device-posture/"}, {"title": "AWS IAM Identity Center Adds Network Access Controls for Identity Store", "summary": "AWS IAM Identity Center can now restrict Identity Store API and SCIM API access by originating network, with separate rules per API. Administrators can require specific VPC endpoints, limit access to source VPCs, or allowlist IP ranges. The controls are optional, off by default, and available in all IAM Identity Center regions.", "type": "Product Launch", "date": "2026-10-05", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-identity-store-network-controls/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "AWS Weekly Roundup: Amazon Bedrock Managed Agents Powered by OpenAI, Kiro Workflows and More", "summary": "AWS's October 5 weekly roundup leads with the public preview of Amazon Bedrock Managed Agents powered by OpenAI, built on a customized OpenAI Agents API, governed by IAM, and running on self-hosted compute or Bedrock AgentCore Runtime. Other items include an UltraFast tier for GPT-6 Astra (up to 6x faster inference), the AWS Well-Architected Agent preview, service lifecycle changes, and new Kiro multi-agent workflows.", "type": "Product Launch", "date": "2026-10-05", "source_url": "https://aws.amazon.com/blogs/aws/aws-weekly-roundup-amazon-bedrock-managed-agents-powered-by-openai-q3-service-availability-updates-kiro-workflows-and-more-october-5-2026/"}, {"title": "GLM 5.3 by Z.ai Now Generally Available on Amazon Bedrock", "summary": "AWS made Z.ai's GLM 5.3 generally available on Amazon Bedrock. The 753B-parameter mixture-of-experts model offers a 1M-token context window and up to 128K output tokens, supports explicit prompt caching and configurable reasoning effort, and is available through US and Global cross-Region inference profiles for agentic coding and long-running software engineering tasks.", "type": "Product Launch", "date": "2026-10-05", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-bedrock-glm-5-3/"}, {"title": "Amazon Nova 2.5 Sonic Launches with Improved Reasoning for Voice Agents", "summary": "AWS released Amazon Nova 2.5 Sonic, a speech-to-speech model for real-time voice agents on Amazon Bedrock, with improved reasoning, instruction following, tool-calling accuracy and latency. It retains a 256K context window and seven-language support, is priced the same as Nova 2 Sonic, is available in four regions, and integrates with Strands Bidi Agents.", "type": "Product Launch", "date": "2026-10-05", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/amazon-nova-2.5-sonic/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": [{"title": "Pillar Security Promotes Self-Hosted 'Pillar Stack' for On-Premise AI Security in Regulated Environments", "summary": "Pillar Security published guidance positioning Pillar Stack, a Kubernetes deployment packaged as a Helm chart, as a way to run runtime guardrails, AI discovery, red teaming and agentic endpoint posture inside the customer's own infrastructure. Guardrails cover prompt injection, jailbreaks, PII, PCI, secrets and toxicity, with logs kept in customer-owned PostgreSQL, Redis and Kafka; a stateless mode is also offered. Pillar targets DORA, NYDFS and GLBA reviews and cites SOC 2 Type II and ISO 27001 certification.", "type": "Product Launch", "date": "2026-10-05", "source_url": "https://www.pillar.security/blog/securing-ai-on-premise-full-data-control-with-pillar"}]}, "Mindgard": {"category": "AI Security", "announcements": [{"title": "Mindgard Research Shows Moonshot Kimi Models Jailbroken to Produce Weapons and Attack Instructions", "summary": "Press coverage on October 5 highlighted Mindgard red-team research showing Moonshot's Kimi K2.6 and K3 Swarm models could be jailbroken past their safety guardrails to give guidance on chemical weapons, malware, assassinations and terrorist plots. K2.6 could also execute Python code, and K3 Swarm attempted to spread the jailbreak to other accounts. Mindgard warns open-weight models are especially exposed once safeguards are removed.", "type": "Research", "date": "2026-10-05", "source_url": "https://www.thisismoney.co.uk/snapchat/article-16182435/Chinese-AI-tool-convinced-issue-biological-weapon-assassination-instructions.html"}]}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Akamai ~P": {"category": "Platforms", "announcements": [{"title": "Akamai: What Executive Order 14421 Means for Zero Trust on the Power Grid", "summary": "Akamai published guidance on Executive Order 14421, which lets the U.S. Department of Energy restrict or replace foreign-supplied grid equipment, software and remote-access components. Akamai positions three products in response: Guardicore Segmentation to isolate substation and control-room assets, Enterprise Application Access to replace flat VPNs for vendor remote access, and Akamai API Security for continuous API discovery and monitoring as grid systems take on more data-center and AI workloads.", "type": "Other", "date": "2026-10-05", "source_url": "https://www.akamai.com/blog/security/secure-grid-executive-order-14421-zero-trust"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": []}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Citrix Patches New Actively Exploited NetScaler ADC/Gateway Zero-Day (CVE-2026-88779)", "summary": "Citrix issued an advisory and patches for CVE-2026-88779 (CVSS 8.7), a memory overflow flaw in NetScaler ADC and Gateway being exploited to crash appliances configured for SAML with Gateway or AAA. Fixed builds are 14.1-73.41 and 13.1-64.28 plus FIPS variants, with Global Deny List signatures available as a stopgap. CISA added the flaw to its KEV catalog with an October 7 deadline, following earlier exploited NetScaler zero-days (CVE-2026-88771/88772).", "type": "Other", "date": "2026-10-05", "source_url": "https://www.helpnetsecurity.com/2026/10/05/cisa-flags-new-exploited-netscaler-flaw-as-attackers-crash-appliances-cve-2026-88779/"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": []}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Vultr Orders $1.2B of HPE AMD Helios AI Racks with HPE Juniper Scale-Up Switching", "summary": "Computer Weekly reports Vultr will deploy AMD Helios AI Rack by HPE systems across several U.S. data centers for AI training and inference, HPE's first Helios order. Each rack uses six HPE Juniper QFX5252 scale-up Ethernet switch trays to connect 72 GPUs, alongside HPE liquid cooling and rack-scale integration. HPE first disclosed the deal at its September 30 Networking Investor Day, where it raised its networking growth outlook and Juniper cost-savings target to $800M.", "type": "Customer", "date": "2026-10-05", "source_url": "https://www.computerweekly.com/news/366651265/Vultr-swoops-for-HPE-networking-scale-up-switching"}]}, "Radware": {"category": "Application Security", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "Imperva Extends Post-Quantum TLS End-to-End, Edge to Origin", "summary": "Imperva now supports post-quantum TLS on the connection from Imperva to the customer's origin server using hybrid X25519MLKEM768 key exchange. Combined with existing browser-to-edge coverage, this delivers quantum-safe encryption end to end when the origin supports it (OpenSSL 3.5+). New sites created on or after October 4, 2026 get it automatically; existing sites enable it with one setting or API call, with no premium SKU. Imperva positions it against harvest-now-decrypt-later attacks.", "type": "Product Launch", "date": "2026-10-05", "source_url": "https://www.imperva.com/blog/harvest-now-decrypt-later-post-quantum-tls/"}]}, "Imperva (Thales) ~AI": {"category": "AI Security", "announcements": [{"title": "Thales Cyber Summit: Google Cloud Partnership Extends AI Security Fabric to Agentic AI", "summary": "Coverage published October 5 detailed five cybersecurity products Thales unveiled at its Paris Cyber Summit, including an expanded Google Cloud partnership that secures agentic AI operations (agents, data and interactions) through the Thales AI Security Fabric. The other launches are the Luna 8 post-quantum HSM, CipherTrust DSPM, Sentinel Envelope+, and a new approach to detecting and responding to AI-driven threats at machine speed.", "type": "Partnership", "date": "2026-10-05", "source_url": "https://www.expresscomputer.in/news/thales-cyber-summit-new-ai-powered-cybersecurity-solutions-to-protect-organisations-and-societies-against-emerging-threats/139427/"}]}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-10-05.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
