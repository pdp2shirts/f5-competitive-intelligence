(function(){
"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "NTT DATA and Palo Alto Networks Sign Global Strategic Alliance to Accelerate Secure AI Transformation", "summary": "Palo Alto Networks and NTT DATA signed a multi-year global alliance targeting roughly $1 billion in joint business by end of 2029. The partnership pairs Palo Alto's AI-powered security platforms and Unit 42 threat intelligence with NTT DATA's consulting, engineering, and managed services, backed by 2,000+ certified experts and Forward Deployed Engineers. It covers joint engineering, co-innovation, and coordinated global delivery to help enterprises modernize cybersecurity, govern AI, and deploy AI securely at scale.", "type": "Partnership", "date": "2026-08-20", "source_url": "https://www.paloaltonetworks.com/company/press/2026/ntt-data-and-palo-alto-networks-sign-global-strategic-alliance-to-accelerate-secure-ai-transformation"}, {"title": "Harnessing AI for Prevention: Introducing Frontier Virtual Patching with PAN-OS 12.2", "summary": "Palo Alto Networks detailed Frontier Virtual Patching in PAN-OS 12.2, using AI-discovered vulnerability intelligence to push network-level protections within hours instead of waiting on vendor patch cycles and maintenance windows. The capability shields unpatched and unpatchable systems, including OT and legacy infrastructure, without requiring reboots, and pairs with Advanced IP Defense to block direct-to-IP and proxy evasion. Palo Alto frames it as a response to AI-accelerated exploit development collapsing the traditional patch window.", "type": "Product Update", "date": "2026-08-20", "source_url": "https://www.paloaltonetworks.com/blog/network-security/harnessing-ai-for-prevention-introducing-frontier-virtual-patching/"}, {"title": "Scale Network Security Beyond Human Limits: Network Security Agents in PAN-OS 12.2", "summary": "PAN-OS 12.2 adds six AI-driven Network Security Agents that automate policy analysis, configuration hygiene, and threat response tasks that previously required manual analyst effort. The agents operate autonomously across the network security stack, aiming to scale operations for teams facing AI-speed attacks and growing rule complexity. Palo Alto positions the agents as part of a broader shift toward autonomous, network-level protection embedded directly in the firewall operating system rather than bolted on as separate tooling.", "type": "Product Update", "date": "2026-08-20", "source_url": "https://www.paloaltonetworks.com/blog/network-security/scale-network-security-beyond-human-limits-introducing-network-security-agents-in-pan-os-12-2/"}]}, "Fortinet": {"category": "Platforms", "announcements": []}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Patches Critical Crosswork and Secure Workload Vulnerabilities", "summary": "Cisco released patches addressing 15 vulnerabilities, headlined by critical flaws in Crosswork and Secure Workload. Crosswork 7.2.1-SP fixes four critical CVEs including three rated CVSS 10.0, while Secure Workload releases 4.0.4.16 and 3.10.9.1 resolve five issues covering access-control bypass, command injection, path traversal, and an out-of-bounds write. A high-severity BroadWorks OCI XML parser flaw allows unauthenticated remote reading of sensitive configuration data. Cisco reported no known exploitation in the wild.", "type": "Security Advisory", "date": "2026-08-20", "source_url": "https://www.securityweek.com/cisco-patches-critical-crosswork-secure-workload-vulnerabilities/"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike's Fal.Con 2026 Unites Cybersecurity's Ecosystem to Secure the AI Revolution", "summary": "CrowdStrike announced that Fal.Con 2026 will be the largest vendor-hosted cybersecurity conference to date, with a record 150+ ecosystem sponsors led by AWS, Accenture, Anthropic, Dell, EY, Google Cloud, Intel, NVIDIA, and OpenAI. The sold-out event runs August 31 to September 2 and is expected to draw more than 10,000 attendees from 4,000 organizations across 71 countries. Programming includes a Global Partner Summit, Fal.Con Hub, and Partner Theatre, with keynotes livestreamed via Fal.Con Digital.", "type": "Partnership", "date": "2026-08-20", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrikes-fal-con-2026-unites-cybersecuritys-ecosystem-to-secure-the-ai-revolution/"}, {"title": "CrowdStrike Named Frost Radar Leader in Cloud Workload Protection for Fourth Consecutive Time", "summary": "Frost & Sullivan named CrowdStrike the Frost Radar leader in Cloud Workload Protection Platforms for the fourth consecutive year, calling it the strongest overall leader on both growth and innovation indices. The report credits CrowdStrike's shift from posture-only protection to runtime-first security for cloud and AI workloads, delivered through the unified Falcon Cloud Security platform that ties together endpoint, identity, cloud posture, vulnerability management, and SOC operations in a single console.", "type": "Analyst Report", "date": "2026-08-20", "source_url": "https://www.crowdstrike.com/en-us/press-releases/frost-radar-cloud-workload-protection-leader-2026/"}, {"title": "CrowdStrike Global CTO Elia Zaitsev Departs to Launch $170M AI-Cyber Venture Fund", "summary": "CrowdStrike global CTO Elia Zaitsev is leaving after 13 years to co-found Cognition, a venture fund targeting $170 million with former CrowdStrike corporate development leaders Gur Talpaz and Tayler Sipperly. The fund will lead seed and Series A rounds, backing three to four AI-security startups annually with roughly $6 million seed and $15 million Series A checks. Its thesis is that agentic AI creates a new attack surface. CrowdStrike shares fell about 2.8% premarket on the news.", "type": "Executive", "date": "2026-08-20", "source_url": "https://www.axios.com/2026/08/20/exclusive-crowdstrikes-cto-is-leaving-to-launch-an-ai-cyber-fund"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zero Trust Can't Stop at a Claim: Zscaler Argues Regulators Now Demand Proof", "summary": "Zscaler published a thought-leadership piece arguing that regulators, auditors, and investors increasingly require demonstrated resilience rather than documented control models. Citing DORA as the benchmark, the post says organizations must prove critical services stay operational under real threat simulations and worst-case disruption, with C-suite accountability and evidence of improvement over time. It also notes frontier AI is accelerating vulnerability discovery, compressing remediation timelines and making proof-of-performance, not paperwork, the new compliance bar for Zero Trust programs.", "type": "Research", "date": "2026-08-20", "source_url": "https://www.zscaler.com/blogs/company-news/zero-trust-can-not-stop-at-a-claim-you-need-to-prove-it"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point CEO Warns Autonomous AI Agents Create a 'Frankenstein' Security Moment", "summary": "Check Point CEO Nadav Zafrir argued that autonomous AI agents represent a 'Frankenstein moment' for cybersecurity, insisting AI systems should never be trusted to secure themselves and that independent, external security layers must monitor agent behavior. He flagged risks to critical infrastructure, deepfakes, and erosion of public trust. The commentary landed alongside Q2 2026 results showing $674M revenue, subscription revenue up 12% to $333M, and AI security products growing roughly 40%, even as legacy firewall hardware demand stayed weak.", "type": "Executive", "date": "2026-08-20", "source_url": "https://www.whalesbook.com/news/English/technology/Check-Point-CEO-Warns-AI-Agents-Pose-Frankenstein-Security-Risks/6a87171e84d2dd5c12de216e"}]}, "Check Point Software ~AS": {"category": "Application Security", "announcements": [{"title": "Check Point Research Exposes StopAndProtect Operation on ~2,000 Hijacked WordPress Sites", "summary": "Check Point Research detailed StopAndProtect, a cybercrime operation that turned nearly 2,000 compromised WordPress sites into shared attack infrastructure for malware delivery, data theft, surveillance, and ransomware. Infections begin with a fake CAPTCHA 'ClickFix' prompt that tricks visitors into running a PowerShell command, chaining loaders that deploy SilentEncryptor ransomware, a data-stealing collector, and SMB/USB worm components. Compromised sites act as payload hosts and command relays, with over 6,000 unique victim IPs observed by late July.", "type": "Research", "date": "2026-08-20", "source_url": "https://securityaffairs.com/197537/hacking/stopandprotect-turns-2000-hacked-wordpress-sites-into-a-criminal-network.html"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Spectre-Class Side-Channel Attack on Cloudflare Workers Stole Auth Tokens 360x Faster", "summary": "Cloudflare disclosed that researchers demonstrated a Spectre-class side-channel attack against Cloudflare Workers that exfiltrated live JWT authentication tokens at up to 12 bits per second with over 99% accuracy, roughly 360x faster than prior methods. The attack ran in Cloudflare's production environment, though no third-party customer data was accessed. Cloudflare shipped three mitigations: Memory Protection Keys isolation for Worker heaps, updated Dynamic Process Isolation for long-lived Workers, and enhanced behavioral detection for remote-timer Spectre patterns.", "type": "Security Advisory", "date": "2026-08-20", "source_url": "https://www.techtimes.com/articles/325073/20260820/cloudflare-workers-spectre-exploit-stole-auth-tokens-360-faster-prior-attack.htm"}, {"title": "Cloudflare Gives AI Agents Stablecoin Wallets and Human-Readable Payment Handles", "summary": "Cloudflare's agent payments push centers on Cloudflare Wallets, which gives AI agents running on Cloudflare's network a stablecoin balance plus human-readable names for transactions, adding trust and accountability to agent-initiated payments. It builds on the Monetization Gateway, which lets sites charge agents in stablecoins per request via the x402 protocol, and adds a cloudflare.pay handle reservation service layering readable labels over cryptographic identities. The move parallels AWS making Bedrock AgentCore Payments generally available for autonomous agent transactions.", "type": "Product Launch", "date": "2026-08-20", "source_url": "https://dataconomy.com/2026/08/20/cloudflare-stablecoin-wallets-for-ai-agents/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare Adds Agent Tracing to Workers AI Observability with OpenTelemetry Support", "summary": "Cloudflare launched agent tracing for Workers AI Observability, automatically generating end-to-end traces for each phase of an AI agent workflow: agent invocation, LLM calls, tool execution, and human approvals. The system is OpenTelemetry-compatible, converting existing instrumentation spans into Cloudflare's format and merging them with native Workers traces, with native APIs available for teams not using OpenTelemetry. Span-based pricing arrives in October 2026; until then agent spans carry no charge beyond standard Workers observability costs.", "type": "Product Launch", "date": "2026-08-20", "source_url": "https://www.webpronews.com/cloudflare-launches-agent-tracing-for-workers-ai-observability-with-opentelemetry-support/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Commits $1 Billion to Forward Deployed Engineering Org Embedding AI Engineers with Customers", "summary": "AWS unveiled a $1 billion investment in a new Forward Deployed Engineering organization that places AWS AI engineers directly inside customer teams to co-create and operate agentic AI systems. Announced at the AWS Summit in Johannesburg, the program is designed to accelerate enterprise AI adoption by pairing hands-on engineering with customer operations rather than leaving deployment to the customer alone. It signals a services-led motion around agentic AI that complements the Bedrock and AgentCore product lines.", "type": "Financial", "date": "2026-08-20", "source_url": "https://cioafrica.co/aws-puts-1-billion-into-sending-its-engineers-to-your-office/"}, {"title": "AWS Lambda MicroVMs Expands to Five Additional Regions", "summary": "AWS expanded Lambda MicroVMs to five additional Regions \u2014 Asia Pacific (Mumbai, Singapore, Sydney) and Europe (Frankfurt, Stockholm) \u2014 bringing total availability to ten Regions. MicroVMs are a serverless compute primitive offering VM-level isolation, near-instant start and resume, and state retention between invocations, targeting workloads that need stronger isolation than standard Lambda execution environments while keeping serverless economics. The broader footprint makes the primitive viable for latency- and residency-sensitive deployments in EMEA and APAC.", "type": "Product Update", "date": "2026-08-20", "source_url": "https://mwpro.co.uk/blog/2026/08/20/aws-lambda-microvms-is-now-available-in-5-additional-aws-regions/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "AWS Opens Las Vegas Local Zone for Low-Latency Edge and AI Inference Workloads", "summary": "AWS announced general availability of a new Local Zone in Las Vegas, Nevada (us-west-2-las-2a), pushing compute, storage, and networking closer to the region to deliver single-digit millisecond latency, local data residency, and edge AI/ML inference while preserving full AWS API compatibility. Supported services include C7i, M7i, R7i, and C8gn EC2 instances, EBS volumes, ECS, EKS, Application Load Balancer, and Direct Connect. Customers enable it through the Regions and Zones console tab or the ModifyAvailabilityZoneGroup API.", "type": "Product Launch", "date": "2026-08-20", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-local-zones-las-vegas-nevada/"}]}, "Akamai ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Akamai Breaks Down the Hidden Location and Egress Costs of AI Inference", "summary": "Akamai published analysis arguing that AI inference economics are driven less by token pricing than by where inference runs and how far data must travel. The piece details how cross-availability-zone, cross-region, and cross-cloud data movement plus egress charges inflate total cost, while distance adds latency that raises time-to-first-token and total token consumption. The takeaway positions distributed, edge-placed inference as a cost and performance lever rather than a purely architectural preference.", "type": "Research", "date": "2026-08-20", "source_url": "https://tfir.io/ai-inference-location-cost-egress-akamai/"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": []}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Citrix Urges Admins to Patch Critical NetScaler ADC and Gateway Flaws Immediately", "summary": "Citrix released emergency fixes for two NetScaler vulnerabilities and urged administrators to patch without delay. CVE-2026-19490 is a critical (CVSS 9.3) authentication bypass affecting appliances configured as a Gateway, AAA virtual server, or with a SAML action, while CVE-2026-19489 is a high-severity denial-of-service issue triggered when SIP ALG is enabled on large LSN groups. Affected builds include NetScaler ADC and Gateway 14.1 before 14.1-73.32 and 13.1 before 13.1-63.21, plus corresponding FIPS/NDcPP releases.", "type": "Security Advisory", "date": "2026-08-20", "source_url": "https://www.bleepingcomputer.com/news/security/citrix-urges-admins-to-patch-new-netscaler-flaws-as-soon-as-possible/"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Says AI Networking Demand Is Broadening as Supply Constraints Cap Upside to 40% Growth Guide", "summary": "At the Rosenblatt technology conference, Arista CFO Chantelle Breithaupt said AI networking demand is now broad-based across hyperscalers, neoclouds, AI labs, enterprises, and campus buyers, with the Etherlink AI portfolio growing from four or five customers in 2024 to more than 100 today. Arista reaffirmed roughly 40% revenue growth, noting component supply \u2014 not demand \u2014 is the limiting factor. She also flagged expansion from 800G scale-out toward scale-across networking and 1.6T customer trials targeting 2027 production.", "type": "Financial", "date": "2026-08-20", "source_url": "https://www.marketbeat.com/instant-alerts/arista-networks-says-ai-demand-broadens-as-supply-limits-upside-to-40-growth-guide-2026-08-20/"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": []}, "Radware": {"category": "Application Security", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Research Finds the Average Web App Carries 20 Security Flaws", "summary": "Barracuda published findings showing the average web application contains roughly 20 security vulnerabilities, most stemming from basic misconfiguration rather than sophisticated flaws. Drawn from hundreds of Barracuda Application Security Insight scans over five months in 2026, seven categories account for about 90% of issues: information disclosure (25%), brand impersonation (23%), client-side attacks (14%), data exposure (10%), weak encryption, outdated software, and weak session protection. Barracuda warns attackers chain these low- and medium-severity issues into account takeover and data theft.", "type": "Research", "date": "2026-08-20", "source_url": "https://cxotoday.com/cybersecurity/average-web-app-has-20-flaws-most-driven-by-basic-oversight-barracuda-finds/"}, {"title": "Barracuda Takes Four Wins in CRN's 2026 Annual Report Card Awards", "summary": "Barracuda was recognized with four wins in CRN's 2026 Annual Report Card awards, which are graded directly by solution providers on partner program quality, product capability, and support. Barracuda executives credited partner feedback and collaboration, pointing to managed service provider momentum, recurring revenue, and simplified security operations as the drivers behind the scores. The awards were highlighted alongside CRN's XChange August 2026 conference coverage, reinforcing Barracuda's channel-first go-to-market position in email, application, and MSP-delivered security.", "type": "Award", "date": "2026-08-20", "source_url": "https://lifestyle.kotaradio.com/story/381443/barracuda-honored-with-four-wins-in-2026-crn-annual-report-card-awards/"}, {"title": "Barracuda Opens Five Cybersecurity Centres of Excellence in Karnataka, India", "summary": "Barracuda opened five Cybersecurity Centres of Excellence at engineering colleges across Karnataka, India, in Bagalkot, Vijayapura, Tumakuru, Mysuru, and Moodbidri. Each centre offers industry-led sessions, hands-on security labs, mentoring, internships, and sponsorships aimed at students in tier-two and tier-three cities. Barracuda framed the program as a response to India's cybersecurity skills shortage, citing roughly 39,000 unfilled security positions in 2026, and positioned the centres as local hubs connecting practitioners with emerging talent.", "type": "Partnership", "date": "2026-08-20", "source_url": "https://www.thehindu.com/news/national/karnataka/barracuda-networks-opens-five-cybersecurity-coes-in-karnataka/article71369573.ece"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-08-20.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
