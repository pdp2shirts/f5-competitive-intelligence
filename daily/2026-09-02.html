"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Paid $500M for Thrive-Backed Console, Sources Say", "summary": "TechCrunch reported Palo Alto Networks paid roughly $500 million in cash and stock for Console, the two-year-old AI agent startup it is folding into Cortex. Console had raised $29 million at a ~$157 million valuation, making this Palo Alto's seventh acquisition of 2026. Console's agentic technology automates routine IT help desk and operations tasks; inside Cortex it is intended to let security teams investigate and resolve alerts through natural language. The deal pushes Palo Alto's platformization pitch toward autonomous, agent-driven security outcomes rather than dashboards and tickets.", "type": "Acquisition", "date": "2026-09-02", "source_url": "https://techcrunch.com/2026/09/02/palo-alto-networks-paid-500m-for-thrive-backed-console-sources-say/"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Egypt and Cisco Partner to Train 3,000 AI Instructors", "summary": "Egypt's government and Cisco signed an agreement to train 3,000 AI instructors nationwide, expanding a digital skills partnership that has already mentored roughly 670,000 Egyptian students through Cisco Networking Academy programs. The signing was attended by Prime Minister Mostafa Madbouly, Minister Raafat Hindy, Cisco CEO Chuck Robbins, and EVP Francine Katsoudas. The program builds instructor capacity to scale AI curriculum across Egyptian institutions, reinforcing Cisco's public-sector skills-development motion in emerging markets and its positioning as an AI infrastructure and enablement partner to national digital transformation programs.", "type": "Partnership", "date": "2026-09-02", "source_url": "https://www.connectingafrica.com/ai/egypt-cisco-to-train-3-000-ai-instructors"}, {"title": "Cisco Discloses Nexus 9000 Series Silicon One Remote Code Execution Vulnerability", "summary": "Cisco PSIRT published an advisory disclosing a remote code execution vulnerability affecting Nexus 9000 Series Switches running Silicon One. The advisory was part of Cisco's pre-announced September 2, 2026 bundled publication, which also covered issues in IOS XR Software, Desk Phone 9800 and IP Phone 7800/8800 SIP software, and Secure Email ciphertext decryption. The Nexus 9000 flaw carries high-impact severity for data center switching fabrics, requiring customers to review fixed software releases and patching timelines for affected platforms in AI and enterprise data center deployments.", "type": "Product Update", "date": "2026-09-02", "source_url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-n9k-s1-rce-EH8dEtr"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Broadcom and Cisco Tie AI Factory Deployment to Workload Needs at VMware Explore", "summary": "At VMware Explore 2026, Broadcom and Cisco unveiled a validated design pairing VMware Cloud Foundation with Cisco UCS infrastructure so AI factory deployments are sized to actual workloads rather than generic GPU buys. The design maps smaller models to targeted processors and large-model training to GPU-dense systems, spanning edge inference, Cisco AI PODs, and eight-GPU UCS C885A M8 nodes. Sizing begins with latency, response time, and concurrent-user requirements. Fully configured AI factories ship on-site, reducing deployment complexity while preserving hardware and location choice, shifting IT teams toward consuming AI capacity instead of building bespoke infrastructure.", "type": "Partnership", "date": "2026-09-02", "source_url": "https://siliconangle.com/2026/09/02/broadcom-and-cisco-tie-ai-factory-deployment-to-workload-needs-vmwareexplore/"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Extends Its Endpoint Advantage to Secure the Software Supply Chain", "summary": "At Fal.Con 2026, CrowdStrike introduced Real-Time Supply Chain Attack Protection, a Falcon capability that blocks malicious open-source packages at the endpoint before any code executes. It intercepts installs at the command line \u2014 npm install, pip install \u2014 across Windows, macOS, and Linux, extending protection beyond developer workstations to every endpoint where agentic applications run. It uses the existing Falcon sensor, adversary intelligence, and SOAR for automated investigation and remediation, and adds granular controls such as minimum package age plus a global package inventory for visibility and rapid response.", "type": "Product Launch", "date": "2026-09-02", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-extends-endpoint-advantage-to-secure-software-supply-chain/"}, {"title": "CrowdStrike Unveils the Next Evolution of the Agentic SOC", "summary": "CrowdStrike announced the next evolution of its agentic SOC at Fal.Con 2026, introducing AI agents that run coordinated, multi-domain investigations across endpoint, identity, SaaS, cloud, and network in parallel. Powered by Charlotte AI, the agents share a common context layer, persistent memory, and expert training to converge on trusted verdicts with justification, cutting investigation time from hours to minutes on a single sensor, console, and platform. The release includes Charlotte Agentic SOAR, a governed no-code automation workspace for building and controlling security agents and workflows with full auditability.", "type": "Product Launch", "date": "2026-09-02", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-unveils-next-evolution-of-the-agentic-soc/"}, {"title": "CrowdStrike Brings the Falcon Platform to the Anthropic Claude Marketplace", "summary": "CrowdStrike made the Falcon platform available in Anthropic's Claude Marketplace, letting Anthropic customers purchase Falcon against existing Claude commitments. The integration centers on Charlotte AI AgentWorks, which allows security teams to build custom Falcon-grounded agents in natural language, deploy them from Claude, and run triage, enrichment, hunting, and response workflows conversationally with inline results. Capabilities include no-code agent creation, enterprise controls, scoped permissions, human-in-the-loop approvals, and full auditability. The move creates an AI-native procurement path for security tooling and deepens CrowdStrike's distribution through frontier model marketplaces.", "type": "Partnership", "date": "2026-09-02", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-brings-falcon-platform-to-anthropic-claude-marketplace/"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "Introducing the CrowdStrike Agentic Identity Provider for AI Agent Identity Security", "summary": "CrowdStrike introduced the Agentic Identity Provider at Fal.Con 2026, positioning Falcon Next-Gen Identity Security as the identity control plane for AI-driven enterprises. Agentic IdP establishes cryptographically verifiable identities for AI agents, with automatic registration through Falcon Guardian, short-lived minimal-scope access tokens, continuous authorization, and attribution of every agent action back to the initiating human or workload. CrowdStrike argues traditional identity providers cannot securely manage autonomous agents, and frames Continuous Identity as the replacement for static, credential-based models \u2014 securing agent-to-resource access at machine speed across the enterprise.", "type": "Product Launch", "date": "2026-09-02", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-agentic-identity-provider-foundation-for-ai-agent-identity-security/"}, {"title": "CrowdStrike and OpenAI Expand Partnership to Secure the Agentic Era", "summary": "CrowdStrike expanded its partnership with OpenAI to secure enterprise AI agents as organizations move workloads into agentic operations. The collaboration pairs CrowdStrike's Falcon platform telemetry and adversary intelligence with OpenAI's models and agent infrastructure, targeting runtime visibility, controls, and protection for AI agents operating with delegated permissions. Announced during Fal.Con 2026, the deal reinforces CrowdStrike's positioning as the security control plane for agentic enterprises and signals continued consolidation of AI model providers and security vendors into joint go-to-market motions around safe enterprise AI adoption.", "type": "Partnership", "date": "2026-09-02", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-and-openai-expand-partnership-to-secure-the-agentic-era/"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Software Shareholders Approve All 2026 Annual General Meeting Proposals", "summary": "Check Point Software Technologies announced that shareholders approved all five proposals presented at its 2026 Annual General Meeting, held September 2, 2026 in Tel Aviv. Approximately 81.2 million shares were voted, representing roughly 79.5% of outstanding shares, signaling broad shareholder support for the company's governance agenda. The vote clears governance overhead heading into the second half of Check Point's fiscal year as the vendor pushes its four-pillar strategy across Hybrid Mesh Network Security, Workspace Security, Exposure Management, and AI Security.", "type": "Financial", "date": "2026-09-02", "source_url": "https://www.prnewswire.com/news-releases/check-point-software-shareholders-approve-all-2026-annual-general-meeting-proposals-302868146.html"}]}, "Check Point Software ~AS": {"category": "Application Security", "announcements": [{"title": "Check Point Research: Chinese-Speaking Actor Turns Brazilian Government Sites Into an SEO Weapon", "summary": "Check Point Research published threat intelligence on \"Gambling Goblin,\" a Chinese-speaking cybercrime cluster linked to Earth Berberoka. Active since mid-2025, the group compromises Brazilian federal, state, and municipal government web servers, installing malicious Apache modules and hijacking high-reputation gov.br domains for large-scale SEO manipulation. Phishing pages impersonate Google Play, Microsoft Store, and Amazon to divert search traffic, with dozens of real domains rotated daily under paths like /jogos and /nova to evade takedowns. The campaign has expanded with localized Vietnamese, Spanish, and English infrastructure and could deliver malware through fake app stores.", "type": "Research", "date": "2026-09-02", "source_url": "https://research.checkpoint.com/2026/gaming-the-system-how-a-chinese-speaking-actor-turned-brazilian-government-sites-into-an-seo-weapon/"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Adds Optional OAuth Scopes, Letting Developers Mark What Users May Decline", "summary": "Cloudflare introduced optional OAuth scopes, allowing developers to designate which permissions a user can decline without breaking the authorization flow. The change gives applications finer-grained consent handling: core scopes remain required while secondary capabilities become opt-in, reducing the all-or-nothing permission prompts that drive user drop-off and over-provisioned tokens. The update is relevant to agentic and MCP-style integrations where least-privilege access matters, and it aligns Cloudflare's developer platform with emerging identity best practices for AI agents accessing third-party resources.", "type": "Product Update", "date": "2026-09-02", "source_url": "https://www.infoq.com/news/2026/09/cloudflare-optional-oauth-scopes/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare Expands Support for AI Coding Agents with Cursor Cloud Agents on Sandboxes", "summary": "Cloudflare announced that Cursor Cloud Agents can now run on Cloudflare Sandboxes, giving developers and enterprises a secure, customer-controlled environment for executing AI coding agent work. Each Cursor session runs isolated on Cloudflare Containers: Cursor handles the agent loop, inference, and planning while Cloudflare executes commands, file edits, and repository operations inside the customer's own infrastructure. An open-source Workers template ships the Worker, Durable Object namespace, container app, R2 binding, and cron trigger. The move extends existing support for Devin Outposts and Claude Managed Agents, positioning Cloudflare Sandboxes as the execution layer for agentic software.", "type": "Product Launch", "date": "2026-09-02", "source_url": "https://www.cloudflare.com/press/press-releases/2026/cloudflare-expands-support-for-ai-coding-agents-with-cursor-cloud-agents-on-cloudflare-sandboxes/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "Amazon Connect Announces General Availability of Agentic CX Designer", "summary": "AWS made Agentic CX Designer for Amazon Connect generally available. The no-code visual canvas lets teams design and deploy AI-powered self-service experiences across voice and digital channels, combining agentic and deterministic AI so conversations stay controlled where exact outcomes matter \u2014 eligibility checks, approvals, routing, and compliance. Guardrails, integrations, testing, and deployment live in a single interface with no coding required. GA regions include US East (N. Virginia), US West (Oregon), Canada (Central), Tokyo, Seoul, Singapore, Sydney, Frankfurt, and London.", "type": "Product Launch", "date": "2026-09-02", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/agentic-cx-designer/"}]}, "AWS ~AI": {"category": "AI Security", "announcements": [{"title": "AWS Config Now Supports 60 New Resource Types Including Bedrock and SageMaker", "summary": "AWS Config added support for 60 additional resource types spanning Bedrock, EC2, SageMaker, IAM, and Organizations, expanding coverage for discovery, assessment, auditing, and remediation. Accounts recording all resource types automatically pick up the new types, and they are immediately usable in Config rules and aggregators. Support extends to all Regions where the underlying resources exist. The expansion notably deepens configuration visibility into AI/ML infrastructure such as Bedrock and SageMaker resources, giving governance and compliance teams inventory and drift detection over generative AI workloads.", "type": "Product Update", "date": "2026-09-02", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-config-new-resource-types/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": [{"title": "HiddenLayer Raises $100M Series B to Advance AI Security", "summary": "HiddenLayer announced a $100 million Series B led by Delta-v Capital, with Ten Eleven Ventures, Morgan Stanley, Microsoft's M12, and Booz Allen Ventures participating, bringing total funding to roughly $156 million. The Austin-based firm says ARR grew more than 10x in the past year. Funds will expand its enterprise AI security platform, emphasizing Agentic Runtime Security \u2014 real-time visibility and enforcement against agent manipulation, misuse, and unauthorized actions \u2014 and the newly launched Agent Harness Security, which protects AI coding agents that write and ship code with limited human oversight. European expansion is also planned.", "type": "Funding", "date": "2026-09-02", "source_url": "https://www.hiddenlayer.com/news/hiddenlayer-100m-series-b-ai-security"}]}, "Lasso Security": {"category": "AI Security", "announcements": [{"title": "Lasso Security Launches CPU-Only LEAP AI Guardrail and Raises $30M", "summary": "Lasso Security unveiled LEAP, a transformer-free AI guardrail that runs on ordinary CPUs with no GPU requirement, claiming GPU-class detection accuracy at under five milliseconds per decision and thousands of times the throughput of existing guardrails. LEAP pairs with Lasso's RAPID self-hosted policy engine behind a routing layer, and deploys in customer clouds, regulated environments, and air-gapped networks. The company says LEAP is already in production at global enterprises and the U.S. federal government. Lasso also disclosed $30 million led by ClearSky, taking total funding past $37 million.", "type": "Funding", "date": "2026-09-02", "source_url": "https://siliconangle.com/2026/09/02/lasso-security-launches-cpu-only-ai-guardrail-raises-30m/"}]}, "Arista Networks ~P": {"category": "Platforms", "announcements": [{"title": "Arista Warns Customers of Elevated Volume of Security Advisories as AI Accelerates Discovery", "summary": "Arista told customers to expect an unusually large batch of security advisories, explaining that AI-assisted code analysis is surfacing vulnerabilities in EOS and related software far faster than traditional review. Working with Anthropic, Google and OpenAI on AI-enabled security tooling, Arista said it will publish advisories on a predictable, pre-announced cadence over the coming months rather than piecemeal, so security teams can plan patching and change-control windows. Each advisory ships with a software fix and remediation guidance, and Arista pointed customers to CloudVision's Compliance Dashboard to triage exposure.", "type": "Research", "date": "2026-09-02", "source_url": "https://www.networkworld.com/article/4217638/arista-warns-customers-ahead-of-next-weeks-security-disclosures.html"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "HPE and Oracle Deepen Networking Collaboration to Accelerate Gigawatt-Scale AI Infrastructure", "summary": "HPE and Oracle expanded their partnership into a multi-year, global deployment of HPE Juniper Networking across Oracle Cloud Infrastructure data centers, edge sites and AI clusters. The agreement covers PTX and MX routing platforms plus QFX and EX switching, along with networking support services and financing. The design targets low-latency, high-availability AI backbones for large GPU clusters, with RoCEv2 congestion management and intelligent telemetry that gives deeper fabric visibility and earlier fault detection to protect GPU utilization. As part of the deal, HPE issued Oracle warrants to purchase HPE common stock.", "type": "Partnership", "date": "2026-09-02", "source_url": "https://www.stocktitan.net/news/HPE/hpe-and-oracle-deepen-networking-collaboration-to-accelerate-a35rytvvva14.html"}, {"title": "HPE Posts Record Q3 FY2026 Revenue of $12.2B and Raises Outlook on AI and Networking Demand", "summary": "HPE reported record third-quarter fiscal 2026 revenue of roughly $12.2 billion, driven by AI systems demand and the Juniper-boosted networking business, and raised full-year guidance to 34\u201337% revenue growth with non-GAAP EPS of $3.75\u2013$3.85 and free cash flow of at least $3.75 billion. Q4 revenue guidance was set at $13.9\u2013$14.8 billion. Management cited a strong order backlog and durable AI-driven growth, and reiterated plans to return at least 75% of free cash flow to shareholders. Shares fell despite the beat as investors questioned margin mix.", "type": "Financial", "date": "2026-09-02", "source_url": "https://siliconangle.com/2026/09/02/ai-demand-lifts-hpe-and-netapp-to-record-quarters-investors-sell-both/"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Overhauls Partner Success Program, Merging MSP and Reseller Tracks", "summary": "Barracuda revamped its Partner Success Program, collapsing separate MSP and reseller tracks into one unified program to reduce friction and deepen enablement. New capabilities include a through-channel marketing automation platform for co-branded campaigns, turnkey campaign execution, account mapping, and a Partner Locator connecting customers to certified partners. The Barracuda Mastery training program expands with role-based learning paths, technical labs, and advanced badges, with AI and compliance badges planned. SVP of global channels Michelle Hodges framed the shift as moving partners from administrative support to customer-success-style enablement, tracking win signals, churn indicators, and account planning.", "type": "Partnership", "date": "2026-09-02", "source_url": "https://www.channelpronetwork.com/2026/09/02/latest-barracuda-partner-success-program-changes/"}, {"title": "Barracuda Survey: Educational Institutions Face Cyber Risks Far Beyond Phishing", "summary": "Barracuda published research showing education institutions absorb roughly 1,200 phishing emails per day each \u2014 58.8 million across 536 institutions over three months. A survey of 2,000 IT and security leaders, including 113 in education, found the sector disproportionately hit by email-initiated attacks: 38% of ransomware incidents started via email versus 28% globally, and 27% suffered account takeover versus 20% globally. Recovery lags badly, with 18% needing up to a week to restore operations. Skills gaps compound the problem, and Barracuda argues AI-powered detection and response must supplement prevention.", "type": "Research", "date": "2026-09-02", "source_url": "https://cxotoday.com/cybersecurity/barracuda-survey-educational-institutions-face-cyber-risks-far-beyond-phishing/"}]}, "Fortinet": {"category": "Platforms", "announcements": []}, "Zscaler": {"category": "Platforms", "announcements": []}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": []}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Radware": {"category": "Application Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-09-02.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
