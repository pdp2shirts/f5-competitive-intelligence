(function(){
"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Announces 2026 North America Partner of the Year Awards", "summary": "At its Executive Partner Summit, Palo Alto Networks named 2026 North America Partner of the Year winners across Prisma AIRS (Cognizant), Frontier AI Partner (NTT DATA), SASE (Trace3), Cortex (Presidio), and Cloud Provider (AWS). Leadership framed the message as \"the AI era is the platform era\" and a partner era, reinforcing the company's platformization push through channel and GSI motions.", "type": "Announcement", "date": "2026-08-26", "source_url": "https://www.paloaltonetworks.com/blog/2026/08/celebrating-excellence-palo-alto-networks-announces-the-2026-north-america-partner-of-the-year-awards/"}, {"title": "Axis Communications Joins Palo Alto Networks Frontier AI Critical Defense Program as Founding Partner", "summary": "Axis Communications joined Palo Alto Networks' Frontier AI Critical Defense Program as a founding partner. The program delivers network-level \"virtual patches\" that block exploitation of software vulnerabilities in critical infrastructure and connected security devices during the gap between disclosure and vendor patching. It targets intelligent edge devices such as IP cameras and access control systems, responding to a surge in AI-discovered open-source vulnerabilities.", "type": "Partnership", "date": "2026-08-26", "source_url": "https://asmideast.com/axis-palo-alto-networks-ai-defense-program/"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Unit 42: Only 12 of 405 AI-Linked Malware Samples Reached Live Endpoints", "summary": "Palo Alto Networks' Unit 42 found that roughly 97% of 405 AI-associated malware samples never left sandboxes or test environments. Only 12 reached live endpoints, and all triggered standard security alerts. The live samples spanned five families across three countries with no industry concentration, including ransomware, backdoors, and infostealers. The takeaway: AI accelerates attacker tooling, but existing defenses still detect the output.", "type": "Research", "date": "2026-08-26", "source_url": "https://pivotnews.ai/security/unit-42-finds-only-12-of-405-ai-linked-malware-samples-hit"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Expands FortiEndpoint with AI-Era Governance and Data Protection", "summary": "Fortinet expanded FortiEndpoint with visibility and governance over sanctioned and unsanctioned AI tools, native data loss prevention for AI-related data, real-time user coaching, endpoint risk scoring, and FortiAI-Assist for natural-language investigation. Adaptive zero-trust access re-evaluates device health as risk changes, and endpoint telemetry feeds the broader Fortinet Security Fabric under a \"one agent, one console, one license\" consolidation model. Availability is expected in Q3 2026.", "type": "Product Launch", "date": "2026-08-26", "source_url": "https://www.itweb.co.za/article/fortinet-expands-fortiendpoint-with-new-capabilities-for-the-ai-era/6GxRKqYQ1bKqb3Wj"}, {"title": "Fortinet Federal Achieves CMMC Level 2 Certification", "summary": "Fortinet Federal achieved Cybersecurity Maturity Model Certification Level 2 following assessment by an authorized C3PAO, validating implementation of 110 security requirements aligned to NIST SP 800-171 Rev. 2 for protecting Controlled Unclassified Information. Fortinet notes its portfolio supports nearly all 14 CMMC Level 2 domains, with FortiGate mapping to 83 of the 110 requirements, strengthening its position in federal and defense contractor engagements.", "type": "Announcement", "date": "2026-08-26", "source_url": "https://www.stocktitan.net/news/FTNT/fortinet-federal-achieves-cmmc-level-2-9uzqyxqgrkkm.html"}]}, "Fortinet ~AI": {"category": "AI Security", "announcements": [{"title": "Fortinet Acquires Virtue AI to Advance Continuous AI Protection", "summary": "Fortinet announced the acquisition of Virtue AI, extending its Security for AI strategy beyond FortiAIGate's LLM protection into AI runtime protection, automated AI validation, and security for autonomous AI systems. Virtue AI's Guardian Agent and runtime capabilities will fold into Fortinet's AI-native Security Fabric to deliver lifecycle governance of AI systems, backed by FortiGuard Labs threat intelligence. Financial terms were not disclosed.", "type": "Acquisition", "date": "2026-08-26", "source_url": "https://www.fortinet.com/corporate/about-us/newsroom/press-releases/2026/fortinet-advances-continuous-ai-protection-with-the-acquisition-of-virtue-ai"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Cloud Control Reaches General Availability for U.S. Customers", "summary": "Cisco made Cloud Control, its single management plane across Cisco applications, generally available in the U.S., with more than 300 customers onboarded and a global pre-GA waitlist above 5,000. The platform uses an agenticOps model with Cisco Agentic Workflows so AI agents co-manage infrastructure, surfacing availability, latency, and packet-loss alerts in a shared human-plus-AI investigative workspace. Rollout is phased and U.S.-first, with other geographies to follow.", "type": "Product Launch", "date": "2026-08-26", "source_url": "https://www.sdxcentral.com/news/cisco-agentifies-suite-with-single-cloud-pane-of-glass/"}, {"title": "Cisco IQ Air-Gapped Virtual Appliance Now Generally Available", "summary": "Cisco announced general availability of the Cisco IQ Air-Gapped Virtual Appliance for on-premises deployments, bringing lifecycle intelligence, proactive security assessment, and AI-powered infrastructure insights to environments with strict data sovereignty requirements. Cisco IQ's SaaS deployment has already been adopted by more than 11,000 customers across three regions. A Tethered Virtual Appliance, keeping data on-site with an outbound-only secure connection for updates, is planned next.", "type": "Product Launch", "date": "2026-08-26", "source_url": "https://blogs.cisco.com/customerexperience/cisco-iq-engineering-sovereignty-in-the-ai-era"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cisco and NVIDIA Take Secure AI Factory to Rack Scale with Supermicro", "summary": "Cisco detailed an expanded Secure AI Factory with NVIDIA, adding Supermicro liquid- and air-cooled rack-scale compute so Cisco sells validated full-stack AI infrastructure rather than networking alone. The NVIDIA Cloud Partner-compliant architecture unifies Cisco Silicon One front-end switching with NVIDIA Spectrum-X back-end under Nexus One, supporting trillion-parameter training and high-throughput inference for enterprise, neocloud, and sovereign cloud buyers. Supermicro systems ship through Cisco channels starting October 2026.", "type": "Partnership", "date": "2026-08-26", "source_url": "https://siliconangle.com/2026/08/26/the-network-becomes-the-computer-as-cisco-and-nvidia-accelerate-ai-factory-rack-scale-cisconvidiaaifactory/"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Reports Record Q2 FY2027 Results and Raises Full-Year Guidance", "summary": "CrowdStrike posted Q2 FY2027 revenue of $1.47 billion, up 26% year over year, with record net new ARR of $333 million (up 51%) and ending ARR of $5.84 billion. Falcon Flex ending ARR topped $2.29 billion, up 101%. The company raised FY27 revenue guidance to $5.99-$6.01 billion and lifted its net new ARR growth outlook to 34% at the midpoint. CEO George Kurtz cited AI security as a major market opportunity.", "type": "Financial", "date": "2026-08-26", "source_url": "https://www.stocktitan.net/sec-filings/CRWD/8-k-crowd-strike-holdings-inc-reports-material-event-0a9108f2f537.html"}, {"title": "SPECTRE Backdoor Silently Blinds CrowdStrike Falcon and Other EDRs at Kernel Level", "summary": "Researchers detailed SPECTRE, a backdoor that gains kernel read/write access and unlinks security-product callbacks from Windows notification lists, so process creation, thread creation, and image load events go unobserved by CrowdStrike Falcon, SentinelOne, and Microsoft Defender. The agents keep running and dashboards show a clean status while attackers operate undetected, a reminder that endpoint telemetry alone can be defeated without independent network-layer visibility.", "type": "Research", "date": "2026-08-26", "source_url": "https://www.techtimes.com/articles/325580/20260826/spectre-backdoor-blinds-crowdstrike-sentinelone-kernel-level-without-killing-them.htm"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "Theta Lake Integrates AI Interaction Governance with CrowdStrike Falcon Next-Gen SIEM", "summary": "Theta Lake announced an integration that streams AI interaction governance telemetry from enterprise communications into CrowdStrike Falcon Next-Gen SIEM. The integration correlates AI usage activity with endpoint, identity, and cloud signals, automates response through CrowdStrike Fusion SOAR, and preserves chain-of-custody and auditability for AI interaction content. It gives SOC teams interaction timelines and contextual AI data inside existing security operations workflows.", "type": "Partnership", "date": "2026-08-26", "source_url": "https://thetalake.com/press-release-theta-lake-announces-ai-interaction-governance-integration-with-crowdstrike-falcon-next-gen-siem/"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler Publishes August 2026 GovCloud Product Update Across ZIA, ZPA, and Zero Trust Branch", "summary": "Zscaler released its August 2026 GovCloud product update, adding WebSocket traffic inspection and improved firewall rule management to ZIA, a recommended Manager release plus Private Service Edge security fixes for ZPA, and BGP route filtering, DNS-over-HTTPS, and FIPS enablement improvements for Zero Trust Branch. Zscaler Deception gained detection rules for actively exploited CVEs, while Zidentity added customizable password policies. The update deepens Zscaler's federal parity story across inspection, routing flexibility, and compliance.", "type": "Product Launch", "date": "2026-08-26", "source_url": "https://www.zscaler.com/blogs/product-insights/what-s-new-govcloud-august-2026-zscaler-product-updates"}, {"title": "Evercore Adds Zscaler to Tactical Underperform List Ahead of Q4 Results", "summary": "Evercore ISI placed Zscaler on its Tactical Underperform list ahead of fiscal Q4 results due September 3, citing channel checks that point to an in-line quarter with limited upside and possible FY27 ARR growth landing at the low end of management's 16-17% guidance. Evercore holds an In Line rating with a $155 price target. Shares fell roughly 3% premarket even as JPMorgan raised its target to $215.", "type": "Financial", "date": "2026-08-26", "source_url": "https://www.tipranks.com/news/the-fly/zscaler-added-to-tactical-underperform-list-at-evercore-thefly-news"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point Adds Contextual AI Agent Protection That Blocks Harmful Agent Actions Before Execution", "summary": "Check Point unveiled a contextual protection layer in Check Point AI Security that evaluates an AI agent's full context, original user intent, prior actions, and applicable policy before an action executes, blocking outcomes that are harmful or inconsistent with the assigned task. Unlike signature or rule-based controls, it infers harmful behavior from the agent's overall activity across multiple steps. The capability is in production and rolling out via Workforce AI Security, native AI Gateway integrations, and direct APIs and plugins.", "type": "Product Launch", "date": "2026-08-26", "source_url": "https://blog.checkpoint.com/ai-security/stopping-the-ai-agent-actions-no-rule-could-see-coming/"}]}, "Check Point Software ~AS": {"category": "Application Security", "announcements": [{"title": "Check Point Blocks Debt-Relief Phishing Campaign Targeting 9,000+ Organizations", "summary": "Check Point reported blocking a large-scale debt-relief phishing campaign that hit more than 9,000 organizations with roughly 24,700 emails in 14 days. Attackers used fraudulent debt-relief offers and attacker-controlled phone numbers rather than malicious links or attachments, evading link- and attachment-based filters. Check Point positioned its AI-driven Email Security, which scores message intent, behavior, and campaign context, as the prevention-first answer to social-engineering campaigns that carry no traditional malicious payload.", "type": "Research", "date": "2026-08-26", "source_url": "https://cxotoday.com/cybersecurity/check-point-blocks-massive-debt-relief-phishing-campaign-targeting-9000-organizations/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare Ships Emergency WAF Release for Next.js Remote Code Execution Flaws", "summary": "Cloudflare issued an emergency WAF managed ruleset update covering two Next.js remote code execution vulnerabilities: CVE-2026-75604, affecting Windows-hosted Next.js apps on the Pages Router and App Router without Cache Components, and GHSA-2xp9-vwfh-vxw4, an RCE via the Next.js Image Optimizer processing attacker-controlled AVIF images. The Image Optimizer detection ships in Block mode. Cloudflare advises customers to upgrade Next.js to 16.3.3 or 15.5.24 and validate the new blocking rules against existing traffic.", "type": "Product Launch", "date": "2026-08-26", "source_url": "https://developers.cloudflare.com/changelog/post/2026-08-26-emergency-waf-release/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare Radar Researcher Adds Richer Sources and URL Scanner Explanations", "summary": "Cloudflare updated Radar Researcher, the plain-language AI tool for exploring Internet data launched during Agents Week, with a richer set of underlying data sources and natural-language explanations of URL Scanner results. The update extends Cloudflare's use of its own developer and AI platform to make Radar's Internet telemetry queryable conversationally, reinforcing Radar as a public-facing proof point for Cloudflare's agentic AI story.", "type": "Announcement", "date": "2026-08-26", "source_url": "https://mwpro.co.uk/blog/2026/08/26/radar-radar-researcher-adds-richer-sources-and-url-scanner-explanations/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "AWS to Acquire DuckLabs, the Team Behind Open-Source DuckDB", "summary": "Amazon signed a definitive agreement to acquire DuckLabs, the Amsterdam team behind the open-source in-process analytics database DuckDB, with the deal closing in early September 2026. Co-founders Hannes Muhleisen and Mark Raasveldt join AWS and keep leading DuckDB's technical direction. DuckDB, DuckLake, and Quack stay free and MIT-licensed under the independent DuckDB Foundation. AWS frames the move as accelerating fast, lightweight analytics directly against S3 and lakehouse storage for data and AI workloads.", "type": "Acquisition", "date": "2026-08-26", "source_url": "https://www.aboutamazon.com/news/company-news/aws-ducklabs"}]}, "AWS ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "CDN Tsunami Research Flags HTTP/3 Amplification Risk in Amazon CloudFront", "summary": "New research disclosed two denial-of-service techniques, HTTP/3 bandwidth amplification and HTTP/3 connection amplification, caused by a mismatch between edge HTTP/3 handling and backend HTTP/1.1 translation across six major CDNs including Amazon CloudFront, Cloudflare, Fastly, Alibaba, Baidu, and Tencent. Researchers measured up to 350x bandwidth amplification and single client connections spawning hundreds of backend TCP sessions. Cloudflare avoided amplification by buffering full HTTP/3 payloads at the edge.", "type": "Research", "date": "2026-08-26", "source_url": "https://www.thenextgentechinsider.com/posts/cdn-tsunami-attack-leverages-http3-for-up-to-350-dos-amplification"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Fastly Reports Record Revenue and Raises Full-Year Guidance as AI Traffic Accelerates", "summary": "Coverage published August 26 recaps Fastly's Q2 2026 results: revenue of $183.3 million (up 23% year over year) with security revenue up 43% to $41.7 million, record 63.3% GAAP gross margin, and $39.3 million operating cash flow. Fastly raised full-year 2026 guidance to $732-746 million, citing continued AI-driven traffic growth, and pointed to its Experian AI-agent verification partnership as a security expansion vector. An Investor Day is set for September 22, 2026.", "type": "Financial", "date": "2026-08-26", "source_url": "https://kalkine.com/news/technology/fastly-nysefsly-reports-record-revenue-and-raises-full-year-guidance"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "CISA Adds Actively Exploited NetScaler Flaw CVE-2026-8452 to KEV Catalog, Orders Federal Patching by August 29", "summary": "CISA added Citrix NetScaler ADC and NetScaler Gateway vulnerability CVE-2026-8452 to its Known Exploited Vulnerabilities catalog on August 26, one of six CVEs added that day, and directed federal agencies under Binding Operational Directive 26-04 to remediate by August 29. The memory overflow affects appliances configured with Gateway VPN or AAA virtual servers. Citrix had characterized the flaw as denial-of-service only, but researchers have demonstrated unauthenticated remote code execution as root on unpatched devices.", "type": "Announcement", "date": "2026-08-26", "source_url": "https://www.cisa.gov/news-events/alerts/2026/08/26/cisa-adds-six-known-exploited-vulnerabilities-catalog"}, {"title": "New NetScaler Auth Bypass and DoS Flaws CVE-2026-19490 and CVE-2026-19489 Draw Urgent Patch Calls", "summary": "Analysis published August 26 details two additional NetScaler ADC and Gateway flaws disclosed by Citrix: CVE-2026-19490, a CVSS 9.3 authentication bypass allowing remote unauthenticated access to VPN and proxy services without a valid login, and CVE-2026-19489, a SIP ALG memory overflow causing denial of service. Exposure depends on Gateway or AAA configuration. Appliances used purely as load balancers are largely unaffected. Fixed builds are 14.1-73.32 and 13.1-63.21 and later.", "type": "Research", "date": "2026-08-26", "source_url": "https://aliteq.com/citrix-netscaler-cve-2026-19490-19489-auth-bypass-patch-now-2026"}]}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Positioned as the Purest Way to Own AI Ethernet as EtherLink Passes 100 Customers", "summary": "An analysis published August 26 frames Arista as the clearest pure-play on AI Ethernet for data centers, citing Q2 FY26 revenue near $3.0B (up roughly 37.7%) and non-GAAP EPS of $1.02. Management raised full-year revenue guidance to about $12.6B and targets at least $3.5B in AI Fabrics revenue, with EtherLink switches now serving 100+ cumulative customers. The piece sizes the AI networking opportunity at $15-20B by 2030.", "type": "Research", "date": "2026-08-26", "source_url": "https://247wallst.com/investing/2026/08/26/3-ai-networking-stocks-dominating-a-quiet-niche/"}, {"title": "Arista Faces New Political Risk as Voters Push Back on AI Data Center Buildouts", "summary": "Coverage published August 26 flags growing US voter and local-government resistance to rapid AI data center expansion as an emerging risk to Arista's outlook. Permitting delays or regulatory friction could slow the timing and scale of hyperscale AI facilities that deploy Arista's high-bandwidth Ethernet fabrics. The story adds an external, non-technical variable to a growth story otherwise driven by AI networking demand.", "type": "Announcement", "date": "2026-08-26", "source_url": "https://finance.yahoo.com/technology/ai/articles/arista-networks-anet-faces-political-121519866.html"}, {"title": "Arista Shares Jump on Renewed AI Fabric Demand Confidence", "summary": "Arista stock rose roughly 3-6% on August 26, leading a hardware-sector rally and closing near $202. Drivers cited include the post-earnings repricing after Q2 revenue topped $3B, raised full-year guidance, multiple analyst price-target increases, and continued traction of the EtherLink portfolio tied to hyperscale AI buildouts. The move reflects sustained investor conviction in AI data center networking spend.", "type": "Financial", "date": "2026-08-26", "source_url": "https://www.tradingkey.com/news/market-movers/262133528-market-movers-anet-20260826"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Research Finds the Average Web Application Contains 20 Security Vulnerabilities", "summary": "Barracuda's Application Security Insight research, covered August 26, analyzed hundreds of application scans over five months in 2026 and found the average web application carries about 20 distinct vulnerabilities. Seven categories account for roughly 90% of findings, led by information disclosure (~25%) and brand impersonation/spoofing (~24%), followed by client-side attacks such as XSS (14%). Barracuda attributes most issues to preventable misconfigurations and recommends continuous scanning, patching, and tighter encryption and session controls.", "type": "Research", "date": "2026-08-26", "source_url": "https://enterprisetimes.in/latest-news/barracuda-average-web-application-has-20-security-vulnerabilities/"}, {"title": "Barracuda Extends AI-Powered Post-Delivery Email Protection for Microsoft 365", "summary": "Coverage on August 26 details Barracuda Integrated Email Protection on the BarracudaONE platform adding AI-driven post-delivery security for Microsoft 365. The offering re-evaluates already-delivered messages using URL, identity, and telemetry signals, performs tenant-wide clawback to limit lateral movement, and includes Bailey, a conversational AI assistant that explains verdicts in plain language and can reverse actions.", "type": "Product Launch", "date": "2026-08-26", "source_url": "https://itranrubber.com/article/ai-powered-email-protection-barracuda-s-new-solution-for-microsoft-365"}]}, "Check Point Software": {"category": "Platforms", "announcements": []}, "Cloudflare": {"category": "Platforms", "announcements": []}, "AWS": {"category": "Platforms", "announcements": []}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": []}, "Radware": {"category": "Application Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-08-26.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
