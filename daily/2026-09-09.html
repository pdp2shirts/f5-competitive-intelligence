(function(){
"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Cortex XDR Scores Perfect 100% in SE Labs 2026 Ransomware Test", "summary": "Palo Alto Networks published results showing Cortex XDR earned a perfect 100% Total Accuracy Rating and a AAA award in SE Labs' 2026 Ransomware Test. The vendor highlights flawless detection and protection across all measured attack stages, and positions the result as proof of readiness against both commodity ransomware and emerging AI-assisted attacks. The post is being used as a third-party validation proof point for competitive endpoint and SecOps platform deals.", "type": "Analyst Report", "date": "2026-09-09", "source_url": "https://www.paloaltonetworks.com/blog/security-operations/cortex-xdr-scores-perfect-100-in-se-labs-2026-ransomware-test/"}, {"title": "PAN-OS Buffer Overflow via XML Processing (CVE-2026-0310)", "summary": "Palo Alto Networks disclosed CVE-2026-0310, a HIGH severity (7.2) buffer overflow in PAN-OS XML processing reachable by an unauthenticated attacker with network access to the management web or dataplane interface. PA-Series hardware firewalls risk arbitrary code execution with root privileges, while VM-Series faces denial of service. Panorama, Prisma Access and Cloud NGFW are also impacted. Mitigation is restricting management access to trusted internal IPs and upgrading to fixed versions.", "type": "Security Advisory", "date": "2026-09-09", "source_url": "https://security.paloaltonetworks.com/CVE-2026-0310"}, {"title": "GlobalProtect App Local Privilege Escalation Vulnerabilities (CVE-2026-0307)", "summary": "Palo Alto Networks issued an advisory covering local privilege escalation flaws in the GlobalProtect app, tracked as CVE-2026-0307. The issues allow a local user on an endpoint running the VPN client to gain elevated privileges, and customers are directed to upgrade to the fixed GlobalProtect app releases listed in the advisory. Endpoint agent hygiene remains a recurring friction point for remote access deployments built on GlobalProtect.", "type": "Security Advisory", "date": "2026-09-09", "source_url": "https://security.paloaltonetworks.com/CVE-2026-0307"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Launches FortiManagement Cloud for Distributed SMB Operations", "summary": "Fortinet introduced FortiManagement Cloud, a cloud-based unified management and analytics platform aimed at SMBs and distributed enterprises. It gives a single dashboard for provisioning, configuring, monitoring and maintaining FortiGate firewalls, FortiSwitch switches, FortiAP access points and FortiExtender 5G/LTE gateways, including standalone devices. Fortinet positions the offering as a way to cut operational complexity and consolidate network and security control for organizations with many small sites and limited IT staff.", "type": "Product Launch", "date": "2026-09-09", "source_url": "https://www.fortinet.com/blog/secure-networking/fortimanagement-cloud-centralized-network-and-security-control-for-distributed-smb-operations"}, {"title": "Fortinet Patches 10 Vulnerabilities Including Critical FortiMonitorOnSight and Chrome Extension Flaws", "summary": "Fortinet shipped patches for 10 vulnerabilities, including two critical issues: CVE-2026-84390 (CVSS 9.6) in the FortiMonitorOnSight web portal, which allows unauthenticated authentication bypass through a forged or reused JWT, and CVE-2026-84388 (9.1) in the Fortinet Privileged Access Agent Chrome extension, which lets an attacker proxy a victim's browser traffic. Remediation requires FortiPAM 1.9.1/1.8.4 and Chrome extension 8.0.1.123 or later.", "type": "Security Advisory", "date": "2026-09-09", "source_url": "https://www.securityweek.com/fortinet-patches-critical-vulnerabilities-in-fortimonitoronsight-chrome-extension/"}, {"title": "FortiOS and FortiProxy Agentless ZTNA Portal MITM Flaw (CVE-2026-84393)", "summary": "Fortinet disclosed a high-severity certificate validation weakness in the Agentless ZTNA portal of FortiOS and FortiProxy, letting an unauthenticated network-path attacker intercept or manipulate traffic between the ZTNA portal and backend applications. FortiOS 7.6.1-7.6.6 and FortiProxy 7.6.2-7.6.6 are affected, with fixes in 7.6.7 and later. No in-the-wild exploitation was reported at publication, and Fortinet advises immediate upgrade plus review of ZTNA access policies.", "type": "Security Advisory", "date": "2026-09-09", "source_url": "https://firsthackersnews.com/fortinet-ztna-flaw/"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Confirms Active Exploitation of Critical Secure Firewall Management Center Flaw", "summary": "Cisco confirmed active exploitation of CVE-2026-20079, a maximum-severity (CVSS 10.0) authentication bypass in Secure Firewall Management Center, alongside a second FMC vulnerability. The bugs allow remote attackers to gain root-level access to the management plane that controls Cisco firewall estates. CISA added the flaw to its Known Exploited Vulnerabilities catalog with a September 12 federal patching deadline, and reporting ties activity to nation-state and ransomware operators.", "type": "Security Advisory", "date": "2026-09-09", "source_url": "https://severitydaily.com/cisco-fmc-cve-2026-20079-exploitation-confirmed-kev-due-september-12/"}, {"title": "Cisco Bundles Fixes for Multiple Critical IOS XR Vulnerabilities into One Patch Set", "summary": "Cisco released a September 2026 IOS XR security hardening bundle covering more than seven vulnerabilities, including at least two critical remote code execution issues rated up to CVSS 9.8 (CVE-2026-20274 and CVE-2026-20279). All IOS XR releases are affected and no workarounds exist. Cisco is delivering software maintenance upgrades for current trains, with releases 26.2.2 and 26.3.1 to include the fixes natively. Exploitation was not known at disclosure.", "type": "Security Advisory", "date": "2026-09-09", "source_url": "https://gixtools.net/2026/09/cisco-bundles-fixes-for-multiple-vulnerabilities-some-critical-into-one-patch/"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cisco Executives Say AI Agents Are Fueling a Multi-Year Networking Super Cycle", "summary": "At the Goldman Sachs Communacopia + Technology Conference, Cisco leadership argued AI agents are driving a multi-year networking boom: agents consume roughly 5x the bandwidth of human users and run continuously, forcing new traffic patterns, lower latency requirements and capacity re-planning across hyperscalers, neoclouds, sovereign clouds and enterprises. Cisco cited orders up about 35% over two quarters and pointed to a unified management plane spanning Nexus, Catalyst, Meraki, Splunk and Webex as its monetization strategy.", "type": "Executive", "date": "2026-09-09", "source_url": "https://www.watchlistnews.com/cisco-systems-sees-ai-agents-fueling-a-multi-year-networking-boom/11218185.html"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "Wipro and CrowdStrike Launch CISO Command Center", "summary": "Wipro and CrowdStrike launched the CISO Command Center, a joint offering that pairs Wipro's CyberTransform and CyberShield managed services with the CrowdStrike Falcon platform and Security Cloud. The center is pitched as a shift from tool-centric to risk-led security operations, unifying endpoint, cloud security, exposure management and AI security telemetry inside a modern SOC. The partners position it as AI-native, proactive risk management that lets CISOs prioritize by business impact.", "type": "Partnership", "date": "2026-09-09", "source_url": "https://www.crowdstrike.com/en-us/press-releases/wipro-crowdstrike-launch-ciso-command-center/"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler Launches Agentic SOC to Contain AI-Driven Threats", "summary": "Zscaler launched Zscaler Agentic SOC, an AI-first security operations platform that unifies exposure management, detection, investigation and automated containment. It fuses zero trust telemetry from roughly 750 billion daily transactions, a decoy mesh network and third-party tool data into a context graph, then applies specialized AI agents for triage, root-cause analysis, verdicts and closed-loop remediation such as isolating users and blocking C2 traffic. Zscaler partnered with Anthropic and OpenAI for deeper reasoning. Available globally at launch.", "type": "Product Launch", "date": "2026-09-09", "source_url": "https://www.helpnetsecurity.com/2026/09/09/zscaler-agentic-soc-solution/"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Discloses Two CVSS 9.8 Quantum VPN Certificate Flaws Enabling Unauthenticated RCE", "summary": "Check Point issued emergency updates for two critical flaws, CVE-2026-85102 and CVE-2026-85103, both rated CVSS 9.8, in the certificate-handling path of Quantum Security Gateway. The bugs stem from improper ASN.1 certificate validation and a heap-based buffer overflow in ASN.1 decoding, allowing unauthenticated remote code execution and potential full administrative control of VPN gateways. Affected products include Security Gateway, Security Management Server and Spark Firewall across R81.20, R82 and R82.10. Patches are available.", "type": "Security Advisory", "date": "2026-09-09", "source_url": "https://securityonline.info/checkpoint-vpn-vulnerabilities/"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Rebuilds Workers Module Registry for Node.js Compatibility", "summary": "Cloudflare rewrote the Workers module registry inside workerd to align closely with Node.js module resolution and semantics. Behind the new_module_registry compatibility flag, Workers now support real URL-based module specifiers, full import.meta handling, Node-like resolution of node: built-ins, validated import attributes, Node ESM rules for require(), lazy module compilation and WebAssembly source-phase imports. Broad Node.js API compatibility is now on by default, and compressed bundles up to 64 MiB are supported on all plans.", "type": "Product Launch", "date": "2026-09-09", "source_url": "https://blog.cloudflare.com/workers-module-registry-nodejs/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare AI Gateway Custom Costs Now Support Cache Tokens", "summary": "Cloudflare added cache-token pricing to AI Gateway custom costs. Customers can now include per_cache_read_token and per_cache_write_token values in the cf-aig-custom-cost header so gateway cost reporting reflects negotiated cache rates from model providers. If a cache rate is supplied, AI Gateway uses it; if omitted, it falls back to per_token_in. AI Gateway also reconciles providers that report cache tokens inside input tokens versus separately, avoiding double counting and improving cost attribution for cached LLM inference traffic.", "type": "Product Launch", "date": "2026-09-09", "source_url": "https://developers.cloudflare.com/changelog/post/2026-09-09-custom-cache-token-costs/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Lambda Adds Support for Graviton5-Powered EC2 Instances on Lambda Managed Instances", "summary": "AWS Lambda now supports Graviton5-powered EC2 instance families (C9g, C9gd, M9g, M9gd) through Lambda Managed Instances, delivering up to 25% higher compute performance than Graviton4. Lambda Managed Instances let functions run on EC2 hardware with fully managed infrastructure, so teams get Graviton5 price-performance without operating servers. Customers can specify a Graviton5 instance type in a capacity provider or let Lambda select defaults. Available in all Regions where both offerings exist.", "type": "Product Launch", "date": "2026-09-09", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/aws-lambda-graviton5-ec2/"}, {"title": "Amazon Makes Agentic AI Platform Quick Generally Available for Windows and macOS Desktop", "summary": "Amazon made Quick, its agentic AI platform, generally available as a desktop application for Windows and macOS, moving the assistant from browser-only access onto the endpoint. The desktop client is positioned for enterprise knowledge work, connecting to business data sources and running multi-step agentic tasks locally alongside other applications. The release deepens the amount of corporate data and application access flowing through agentic clients, an adoption signal for any vendor selling controls around enterprise AI usage.", "type": "Product Launch", "date": "2026-09-09", "source_url": "https://siliconangle.com/2026/09/09/amazon-makes-its-agentic-ai-platform-quick-generally-available-for-desktop-on-windows-and-macos/"}, {"title": "AWS Details Multi-Year Rebuild of Its Routing Control Plane Without Downtime", "summary": "AWS disclosed how it spent several years rebuilding the routing control plane behind its border network, the layer that steers API calls, CloudFront streams and Route 53 lookups, and completed the migration across its global network without customer-visible downtime. The replacement system was written from scratch and is now in production everywhere. The account is a rare look at how hyperscalers modernize core traffic-direction infrastructure incrementally.", "type": "Research", "date": "2026-09-09", "source_url": "https://www.helpnetsecurity.com/2026/09/09/aws-routing-control-plane-network/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Amazon Bedrock Managed Knowledge Base Adds Native Confluence Data Center Connector", "summary": "Amazon Bedrock Managed Knowledge Base now supports Confluence Data Center as a native data source connector, letting customers ingest self-hosted Confluence content directly into managed RAG pipelines without building custom extraction jobs. The connector broadens the enterprise content Bedrock can index for retrieval-augmented generation, covering on-premises and self-managed wiki deployments that previously required bespoke integration work. It continues AWS's strategy of collapsing the AI data pipeline into managed Bedrock services.", "type": "Product Launch", "date": "2026-09-09", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-bedrock-managed-knowledge-base-confluence-data-center-native-data-source-connector/"}, {"title": "Amazon Bedrock Knowledge Base Adds APIs and Console Support for Debugging Document-Level Access Control", "summary": "Amazon Bedrock Managed Knowledge Base added new APIs and console tooling for debugging document-level access control, giving administrators visibility into why a specific user can or cannot retrieve a given document through a RAG workflow. The capability targets a common enterprise blocker in AI deployments, where inherited source-system permissions must be enforced at retrieval time. By making access decisions inspectable, AWS is addressing AI data governance concerns that stall production rollouts.", "type": "Product Launch", "date": "2026-09-09", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-bedrock-knowledge-base-debugging-document-access-control/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": [{"title": "Lasso Details LEAP Architecture: CPU-Based AI Guardrails With GPU-Class Accuracy", "summary": "Lasso published a technical deep dive on LEAP, its transformer-free guardrail engine that runs inline on ordinary CPUs while claiming transformer-level detection accuracy. LEAP inspects every prompt, response, retrieved document, and tool call, with a tier-1 model called Sheriff handling roughly 90% of requests in about 1ms and escalating only complex cases. Lasso positions LEAP for customer-managed VPC and air-gapped deployments so content never leaves the security boundary.", "type": "Product Launch", "date": "2026-09-09", "source_url": "https://www.lasso.security/blog/introducing-leap-cpu-based-ai-security-guardrails-with-gpu-class-accuracy"}]}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": [{"title": "Mindgard Expands AI and Cloud Ecosystem With Anthropic, NVIDIA, Microsoft, Google Cloud and AWS", "summary": "Mindgard announced an ecosystem expansion spanning Anthropic's Cyber Verification Program, NVIDIA Inception, Microsoft Founders Hub, Google Cloud's AI growth program, and AWS Activate. The company says the ties keep its automated red teaming close to frontier models, infrastructure, and deployment architectures so it can test multi-provider, multi-model enterprise AI stacks. Coverage noted the announcement carries no capital commitments or exclusivity, framing the partnerships as integrations and supported deployment paths following Mindgard's $30M Series A.", "type": "Partnership", "date": "2026-09-09", "source_url": "https://www.innovationopenlab.com/news-biz/72135/mindgard-expands-ai-and-cloud-ecosystem-with-anthropic-nvidia-microsoft-google-cloud-and-aws.html"}]}, "Akamai ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Akamai CEO Positions Company as AI Inference and Compute Provider at Citi Global TMT Conference", "summary": "At Citi's 2026 Global TMT Conference, CEO Tom Leighton framed Akamai's evolution from a content delivery company into a compute and security business, crediting the Linode acquisition for enabling enterprise-grade cloud workloads. He emphasized supporting end-to-end AI workloads from training through inference on Akamai's distributed edge footprint, targeting large cloud customers with mission-critical applications. The remarks reinforce Akamai's push to monetize AI traffic and inference delivery rather than defend declining CDN pricing.", "type": "Financial", "date": "2026-09-09", "source_url": "https://seekingalpha.com/article/4944646-akamai-technologies-inc-akam-presents-at-citis-2026-global-tmt-conference-transcript"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Fastly CFO Details Edge Security and Compute Momentum at Citi Global TMT Conference", "summary": "Fastly CFO Richard Wong and IR head Vernon Essi presented at Citi's 2026 Global TMT Conference, reviewing 13 months of structural change across the edge cloud platform and its 166 points of presence. Disclosed metrics included Q2 revenue of $183.3M up 23%, security revenue up 43%, compute and other up 69%, record 65.8% non-GAAP gross margin, and 117% net revenue retention. Management flagged continued mid- to high-single-digit delivery price erosion.", "type": "Financial", "date": "2026-09-09", "source_url": "https://seekingalpha.com/article/4944484-fastly-inc-fsly-presents-at-citis-2026-global-tmt-conference-transcript"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "CISA Adds Critical NetScaler Authentication Bypass CVE-2026-19490 to Known Exploited Vulnerabilities Catalog", "summary": "CISA added CVE-2026-19490, a Citrix NetScaler ADC and NetScaler Gateway authentication bypass using an alternate path or channel, to its Known Exploited Vulnerabilities catalog, confirming active exploitation. The CVSS 9.3 flaw affects appliances configured as AAA virtual servers or Gateway, including SSL VPN, ICA Proxy, CVPN, and RDP Proxy deployments. Federal agencies received a compressed September 12 remediation deadline. Citrix advisory CTX696939 lists no mitigations, making upgrades to fixed builds the only control.", "type": "Security Advisory", "date": "2026-09-09", "source_url": "https://www.cisa.gov/news-events/alerts/2026/09/09/cisa-adds-four-known-exploited-vulnerabilities-catalog"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Discloses Critical EOS P4Runtime Code Injection Flaw with CVSS 10.0 Score", "summary": "Arista published Security Advisory 0174 covering CVE-2026-73453, a critical code injection vulnerability in EOS when P4Runtime is enabled. An unauthenticated P4Runtime client can achieve arbitrary code execution and gain full administrative control of an affected switch, earning a CVSS v3.1 base score of 10.0. Arista found the issue internally and reported no known exploitation in customer networks. P4Runtime is disabled by default, and fixes ship in EOS 4.36.2 and later.", "type": "Security Advisory", "date": "2026-09-09", "source_url": "https://www.arista.com/en/support/advisories-notices/security-advisory/24730-security-advisory-0174"}, {"title": "Arista Targets $12.6B in 2026 Revenue on AI, Campus and Cloud Networking Demand", "summary": "Speaking at the Goldman Sachs Communacopia + Technology Conference, CTO Ken Duda and CFO Chantelle Breithaupt set an approximately $12.6 billion 2026 revenue target implying roughly 40% growth, after Arista's first $3 billion quarter. Management said it will invest across AI and data center switching fabric, software, campus, and routing, citing improved supply and order visibility that supported a full-year guidance raise of more than $1 billion. Multiyear purchase commitments surged to roughly $9.7 billion.", "type": "Financial", "date": "2026-09-09", "source_url": "https://www.marketbeat.com/instant-alerts/event-arista-networks-targets-126b-as-ai-campus-and-cloud-networking-growth-accelerates-2026-09-09/"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Oracle Plans Global HPE Juniper Networking Rollout Across Its AI Data Centers", "summary": "Reports detailed Oracle's multiyear plan to deploy HPE Juniper Networking across its global AI data centers, edge networks and regional fabrics. The rollout spans PTX and MX routing platforms, QFX and EX switches, support services and financing, targeting large GPU cluster demands for bandwidth, latency, congestion management and RoCEv2 backend fabrics. Both companies are adding intelligent telemetry for deeper device and fabric visibility to protect GPU utilization, and HPE issued Oracle warrants to purchase HPE stock.", "type": "Partnership", "date": "2026-09-09", "source_url": "https://technode.global/2026/09/09/oracle-hpe-juniper-global-ai-data-center-networking/"}, {"title": "HPE Networking Revenue Jumps 74.9% as AI Infrastructure Demand Accelerates", "summary": "Coverage of HPE's Q3 2026 results showed networking revenue up 74.9% to $2.9 billion, with data center networking revenue more than doubling to $382 million, driven largely by the Juniper acquisition. Normalized networking revenue grew roughly 10% with orders up 36%, and segment operating margin reached about 22%. HPE raised its FY2026 revenue growth outlook to 34-37% and guided to at least $3.75 billion in free cash flow, citing AI and inference-driven demand.", "type": "Financial", "date": "2026-09-09", "source_url": "https://finance.yahoo.com/technology/ai/articles/hewlett-packard-enterprise-hpe-ai-135550535.html"}]}, "HPE / Juniper Networks ~P": {"category": "Platforms", "announcements": [{"title": "HPE Networking Issues Advance Notification of Security Advisories", "summary": "HPE published HPESBNW05139 rev.1, an advance notification of upcoming HPE Networking security advisories dated September 9, 2026. The bulletin alerts customers to pending advisories affecting HPE Networking products ahead of full public disclosure, pointing to affected product lists, severity ratings, CVE references and remediation guidance. Advance notifications like this drive patch planning and maintenance-window scheduling for networking fleets, including estates inherited through the Juniper acquisition.", "type": "Security Advisory", "date": "2026-09-09", "source_url": "https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05139en_us&docLocale=en_US"}]}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware H1 2026 Global Threat Report: Web DDoS Attacks More Than Doubled", "summary": "Radware released its H1 2026 Global Threat Analysis Report, showing web DDoS mitigations up 110.6% year over year and 36.3% versus H2 2025, with the first half of 2026 already representing nearly 83% of all 2025 volume. If trends hold, full-year 2026 could finish roughly 166% above 2025, with North America up as much as 190%. The report also flags a negative patch window: mean time from CVE disclosure to first confirmed exploitation averaged about minus eight hours.", "type": "Research", "date": "2026-09-09", "source_url": "https://siliconangle.com/2026/09/09/radware-finds-web-ddos-attacks-doubled-as-the-patch-window-turns-negative/"}, {"title": "Radware: Cyberthreats Reach the Automated Tipping Point", "summary": "Radware argued that AI-enabled attackers now operate autonomously at machine speed, discovering vulnerabilities, compromising applications and adapting in real time. Telemetry from Radware Cloud Protection Services showed malicious web application and API activity surging 66% quarter over quarter in Q4 2025 to about 7,000 malicious transactions per application per day, then doubling to more than 14,000 in H1 2026. Vulnerability exploitation is the dominant growth driver, pushing defenders toward automated application and API protection.", "type": "Research", "date": "2026-09-09", "source_url": "https://www.radware.com/blog/cyberthreats-reach-automated-tipping-point/"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Threat Spotlight: Phishing Pages Generated Inside the Victim's Browser", "summary": "Barracuda researchers detailed a phishing technique that builds attack pages in memory inside the victim's own browser using blob URLs, leaving no hosted phishing URL for security tools to block or scan. Victims are routed through legitimate Microsoft services such as Microsoft OAuth and Teams redirects, so the links look trustworthy in email and reputation checks. Barracuda recommends layered detection that inspects redirect chains and browser-side behavior rather than relying on URL blocklists.", "type": "Research", "date": "2026-09-09", "source_url": "https://blog.barracuda.com/2026/09/09/browser-based-phishing-blob-urls-microsoft-redirects"}]}, "Barracuda Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Barracuda Signs OpenAI's Call for Collective Action on Cyber Defense", "summary": "Barracuda explained why it signed OpenAI's call for collective action on cyber defense, arguing defenders need AI-powered speed as published vulnerabilities double while security headcount stays flat. The company pushed for government incentives tied to demonstrated security improvements and asked frontier labs to deliver automated vulnerability discovery and triage, dynamic application security testing and autonomous red teaming. Barracuda also argued essential security features should ship included rather than be upsold.", "type": "Partnership", "date": "2026-09-09", "source_url": "https://blog.barracuda.com/2026/09/09/barracuda-openai-collective-cyber-defense"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}};

  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
