(function(){
"use strict";
var DATA={"CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "Falcon IQ Launches with 50+ AI Agents to Operationalize Project QuiltWorks", "summary": "At Fal.Con 2026 CrowdStrike launched Falcon IQ, an AI assessment and remediation layer built on NVIDIA Nemotron open models and Charlotte AI AgentWorks, shipping 50+ prebuilt agents that discover, prioritize and remediate vulnerabilities at runtime across the Falcon platform. Partners can customize agents and load service catalogs for co-branded playbooks. F5 product marketing should sharpen how AI Guardrails and AI Red Team differentiate against agent-swarm automation narratives; sellers should ask customers whether autonomous remediation agents have guardrails governing their own model traffic.", "type": "Product Launch", "date": "2026-08-31", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-falcon-iq-operationalizes-project-quiltworks-at-machine-speed/"}, {"title": "Project QuiltWorks Expands with 12 New Data Sources to Secure Frontier AI Risk", "summary": "CrowdStrike expanded Project QuiltWorks with real-time data from twelve vendors including Zscaler, Netskope, Rubrik, Abnormal AI, HackerOne, Horizon3, Picus, SafeBreach and ExtraHop, feeding Falcon Next-Gen SIEM. Falcon Onum pipelines cut onboarding friction and storage costs by up to 50 percent, with Charlotte AI agents automating data onboarding. F5 product and product marketing should track this ecosystem consolidation around frontier AI risk and position F5's AI delivery and security telemetry as data worth integrating rather than being absorbed into a rival's SIEM narrative.", "type": "Partnership", "date": "2026-08-31", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-expands-project-quiltworks-across-tech-ecosystem-to-secure-frontier-ai-risk/"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "Falcon Platform Now Runs on Google Cloud for In-Region Data Processing", "summary": "CrowdStrike and Google announced the Falcon platform is now available on Google Cloud infrastructure, starting in U.S. regions with more planned, adding a third hyperscaler alongside AWS and Azure. The move targets data sovereignty and localization requirements with a single sensor, console and data layer. F5 cloud alliances can mirror the motion with Google Cloud go-to-market, and sellers in regulated or sovereign accounts should expect sovereignty to become a standard platform requirement in security and app delivery evaluations.", "type": "Partnership", "date": "2026-08-31", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-google-announce-falcon-platform-on-google-cloud/"}, {"title": "CrowdStrike Brings the Falcon Platform to Snowflake Marketplace", "summary": "CrowdStrike will sell the Falcon platform through Snowflake Marketplace, letting customers draw down pre-committed Snowflake capacity to buy security. Federated search queries Snowflake data directly from Falcon investigations without moving it, Falcon Next-Gen SIEM correlates Snowflake data with CrowdStrike telemetry, and Falcon Onum routes telemetry natively to Snowflake. Operations and product marketing should note the procurement play: consuming existing cloud and data commitments lowers buying friction, a tactic F5 can evaluate for marketplace-based transacting of security and delivery products.", "type": "Partnership", "date": "2026-08-31", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-brings-falcon-platform-to-snowflake-marketplace/"}, {"title": "Cognizant Launches Managed OT Security Service Powered by Falcon for XIoT", "summary": "Cognizant and CrowdStrike expanded their collaboration to launch Cognizant Cybersecurity for Operational Technology, powered by CrowdStrike Falcon for XIoT, delivering unified IT/OT visibility with 24/7 managed security operations. The service spans OT asset discovery, threat detection and response, vulnerability and attack surface management, identity and data protection, and governance for manufacturing, energy and critical infrastructure. F5 professional services and cloud alliances should note the SI-led delivery model as competitors scale reach through managed-service partners rather than direct sales.", "type": "Partnership", "date": "2026-08-31", "source_url": "https://news.cognizant.com/2026-08-31-Cognizant-and-CrowdStrike-Protect-Critical-Operations-Across-Converged-IT-and-OT-Environments"}, {"title": "CLEAR Verified Human Identity Integrated into the Falcon Platform", "summary": "CrowdStrike and CLEAR announced an integration bringing CLEAR1 verified human identity into the Falcon platform, so when Falcon flags risky activity CLEAR1 can verify in real time whether a real person is behind it and feed that signal into allow, investigate or block decisions across Falcon Next-Gen SIEM and Charlotte Agentic SOAR. It is available now to existing customers of both. F5 product teams evaluating bot defense and identity signals should note the shift toward high-assurance human verification as an anti-impersonation control.", "type": "Partnership", "date": "2026-08-31", "source_url": "https://www.prnewswire.com/news-releases/crowdstrike-brings-clears-verified-human-identity-into-the-falcon-platform-302864476.html"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "AMD, Cisco and HUMAIN Bring Saudi AI Infrastructure Live with Silicon One Networking", "summary": "AMD, Cisco and HUMAIN announced production AI infrastructure is live in Saudi Arabia, pairing AMD Instinct MI355X GPUs and EPYC CPUs with Cisco Silicon One-based N9000 series networking and 800G optics to deliver a low-latency AI fabric for GPU-as-a-service training and inference. The venture plans up to 250MW starting in 2027 and as much as 1GW by 2030. F5 cloud alliances and product marketing should watch sovereign AI factory buildouts as the emerging battleground for AI traffic management and inference delivery attach.", "type": "Partnership", "date": "2026-08-31", "source_url": "https://newsroom.amd.com/news/amd-cisco-humain-expand-saudi-arabia-ai-infrastructure/"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "China-Linked Fire Ant Group Hijacks Cisco Routers for Covert Espionage Infrastructure", "summary": "Researchers disclosed that the China-linked Fire Ant group is compromising Cisco routers and other trusted network infrastructure to steal credentials, blind security logging and stage covert attack infrastructure inside victim networks. The campaign highlights edge network devices as a persistent espionage target. F5 sellers and professional services should proactively raise infrastructure hardening, log integrity and upgrade hygiene with customers, while product marketing can reinforce messaging on securing the network edge and validating device firmware integrity.", "type": "Research", "date": "2026-08-31", "source_url": "https://thehackernews.com/2026/08/china-linked-fire-ant-hijacks-cisco.html"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Launches Free High School Cybersecurity Curriculum for U.S. Schools", "summary": "Fortinet's Training Institute launched a free two-course technical high school cybersecurity curriculum for U.S. districts, spanning roughly 180 days and 145 hours and delivered through its Security Awareness and Training Service to prepare students for advanced coursework and certifications. Chicago Public Schools is an early pilot adopter. F5 marketing and operations should note the workforce-development play as a long-horizon brand and pipeline motion that builds practitioner familiarity with Fortinet's ecosystem years before purchase decisions.", "type": "Company News", "date": "2026-08-31", "source_url": "https://www.fortinet.com/corporate/about-us/newsroom/press-releases/2026/fortinet-launches-free-high-school-cybersecurity-curriculum-to-build-next-generation-of-cyber-defenders"}]}, "Zscaler ~AI": {"category": "AI Security", "announcements": [{"title": "Zscaler Publishes Security Leader Guidance on the Hugging Face Breach", "summary": "Zscaler published guidance framing four questions security leaders must answer following the Hugging Face breach, covering exposure to third-party AI model repositories, containment steps and how to govern AI supply chain risk. The piece positions Zscaler's zero trust and AI security portfolio against model supply chain exposure. F5 product marketing can use the same event to reinforce AI supply chain and model provenance messaging, while sellers get a timely customer conversation starter about who inspects traffic to public model hubs.", "type": "Research", "date": "2026-08-31", "source_url": "https://www.zscaler.com/blogs/product-insights/hugging-face-breach-key-questions-every-security-leader-must-answer"}]}, "Operant AI": {"category": "AI Security", "announcements": [{"title": "Operant AI Launches Semantic Firewall for Real-Time AI Agent Intent Enforcement", "summary": "Operant AI unveiled the Operant Semantic Firewall, an inline control plane that reads the intent behind prompts, tool calls and data movements, then allows, blocks or redacts agent actions before execution. It runs inside the enterprise perimeter, including VPC, on-prem and air-gapped deployments, so decisions never leave customer infrastructure. The release adds Live Browser AI Protection for ChatGPT, Claude, Copilot and Gemini sessions plus a Token Meter for per-agent budget enforcement across Bedrock, Vertex and Foundry. This is a direct sovereignty-and-runtime challenge to F5 AI Guardrails positioning.", "type": "Product Launch", "date": "2026-08-31", "source_url": "https://physicalainews.com/operant-ai-unveils-semantic-firewall-to-enforce-ai-agent-intent-in-real-time/"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point Adds Contextual AI Protection to Stop Harmful Agent Actions", "summary": "Check Point detailed a new contextual AI protection capability that evaluates an AI agent's full task flow, user intent, prior tool activity and applicable policy before an action executes, rather than relying on predefined rules or signatures. Enforcement decisions are made in roughly 50 milliseconds and the capability is in production, rolling out to AI Security customers through Workforce AI Security, native AI Gateway integrations and direct APIs and plugins. Product marketing should refresh AI Guardrails competitive comparisons around intent-based, multi-step behavioral enforcement and latency claims.", "type": "Product Launch", "date": "2026-08-31", "source_url": "https://cxotoday.com/media-coverage/stopping-the-ai-agent-actions-no-rule-could-see-coming/"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Blocks Debt-Relief Phishing Campaign Hitting 9,000+ Organizations", "summary": "Check Point disclosed it intercepted a large phishing operation that sent roughly 24,700 fraudulent debt-relief emails to more than 9,000 organizations over 14 days. The campaign used no malicious links or attachments, instead driving victims to call attacker-controlled phone numbers where personal and financial data was harvested through live social engineering. Check Point used the disclosure to promote its Email Security product's intent-, user-risk- and campaign-context-based detection. A useful proof point for F5 marketing on why link-and-attachment inspection alone is insufficient in prevention-first messaging.", "type": "Research", "date": "2026-08-31", "source_url": "https://gecnewswire.com/check-point-blocks-debt-relief-phishing-campaign-targeting-9000-organisations/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Adaptive Intelligence Adds Continuous Self-Retraining to Cloudflare Bot Management", "summary": "Cloudflare launched Adaptive Intelligence, a continuous detection engine inside Cloudflare Bot Management that learns from live traffic across its global network and autonomously generates short-lived, disposable rules. The goal is to invalidate attacker reconnaissance and make automated campaigns such as credential stuffing and scraping slower and more expensive. It uses Cloudflare Precursor signals to separate humans from bots and retrains without downtime. This pressures F5 Distributed Cloud Bot Defense messaging, so product marketing should sharpen accuracy proof points and sellers should expect self-updating-defense objections in bot deals.", "type": "Product Launch", "date": "2026-08-31", "source_url": "https://www.cloudflare.com/press/press-releases/2026/cloudflare-introduces-adaptive-intelligence-reverses-the-economics-of-automated-cyber-attacks/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Interconnect Extends Managed Multicloud Connectivity to Microsoft Azure in Preview", "summary": "AWS opened a public preview of AWS Interconnect &ndash; multicloud for private, on-demand connectivity between AWS and Microsoft Azure, joining generally available Google Cloud and Oracle Cloud options. The managed service offers MACsec encryption, four-nines availability and scalable bandwidth in US East (N. Virginia), US West (N. California), Asia Pacific (Sydney) and Europe (Frankfurt). Cloud alliances and professional services should note that hyperscaler-native cross-cloud plumbing erodes DIY interconnect projects; F5 messaging should pivot to app-layer policy, security and traffic steering consistency across those clouds.", "type": "Product Launch", "date": "2026-08-31", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-announces-AWS-interconnect-multicloud-microsoft-azure-preview/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "EC2 R9g and R9gd Instances on Graviton5 Reach General Availability", "summary": "AWS made Amazon EC2 R9g and R9gd memory-optimized instances generally available on Graviton5, claiming roughly 3x faster packet processing than Graviton4, up to 100 Gbps network and 72 Gbps EBS bandwidth, up to 11.4 TB local NVMe on R9gd, and configurable bandwidth reallocation between EBS and VPC networking. They are positioned for data-intensive caching, analytics and AI-adjacent workloads. Product marketing should factor the packet-processing gains into BIG-IP VE and NGINX-on-Graviton performance claims, and cloud alliances can use the launch to refresh AWS co-sell benchmarks.", "type": "Product Launch", "date": "2026-08-31", "source_url": "https://aws.amazon.com/blogs/aws/amazon-ec2-r9g-and-r9gd-instances-powered-by-aws-graviton5-processors-are-now-generally-available/"}]}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Akamai Passes $1B in APJ Revenue and Names New Regional Sales and Channel Leaders", "summary": "Akamai disclosed that APJ revenue surpassed US$1 billion in 2025 and appointed Sean Li as SVP Regional Sales and MD for APJ plus Fiona Zhang as Regional VP of Channel Sales and Programmes. The company tied the momentum to API sprawl and vibe-coding risk, citing 81% of APJ organizations hitting an API security incident, average losses above US$1 million, nearly 65 billion regional web app and API attacks in 2025, and Layer 7 DDoS up about 104% since 2023. F5 field and channel teams in APJ should expect intensified Akamai API security competition.", "type": "Company News", "date": "2026-08-31", "source_url": "https://itwire.com/business-it-news/security/akamai-charts-us-1b-apj-milestone-as-vibe-coding-and-shadow-ai-supercharge-cyberthreats"}, {"title": "Akamai Threat Research Flags Turbo Mirai Botnet and Agentic AI Risk to Retail", "summary": "Akamai security leadership published threat guidance on Turbo Mirai-class botnets and escalating retail DDoS activity, arguing that AI-enabled botnets and agentic AI traffic are compressing attack setup time and overwhelming legacy mitigation. The commentary frames edge-based, always-on DDoS and bot defense as the required control point heading into peak retail season. F5 product marketing should refresh peak-season DDoS and bot proof points, sellers can use the retail seasonality hook for pipeline conversations, and product teams should weigh agentic-traffic classification gaps in the roadmap.", "type": "Research", "date": "2026-08-31", "source_url": "https://tfir.io/retail-ddos-turbo-mirai-agentic-ai-akamai-winterfeld/"}]}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Analysts Upgrade Akamai to Overweight on Compute Segment Momentum", "summary": "Akamai received an Overweight upgrade with analysts citing accelerating gains in its Compute (cloud infrastructure) segment as the main growth engine, alongside continued security contribution. The upgrade reinforces that Akamai's narrative is shifting from CDN delivery toward distributed compute and AI infrastructure. Product marketing should account for this repositioning in competitive battlecards, while cloud alliances and product teams should watch Akamai's compute expansion as an emerging adjacency to F5's distributed application delivery story rather than a pure CDN comparison.", "type": "Financial", "date": "2026-08-31", "source_url": "https://seekingalpha.com/news/4638488-akamai-upgraded-to-overweight-due-to-gains-in-compute-segment"}]}, "Fastly ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Fastly Demonstrates Edge Injection of WebMCP to Make Sites AI-Agent-Ready", "summary": "Fastly published a Compute-based proof of concept that intercepts HTML responses at the edge, classifies forms with heuristics and injects WebMCP attributes in flight, exposing site forms as machine-readable tools for AI agents with no developer code changes. WebMCP is an early W3C community draft usable today via origin trials. This stakes out edge platforms as the enablement layer for agentic web traffic, a direct narrative overlap with F5's AI Data Delivery and AI Gateway story. Product marketing and product teams should evaluate an F5 position on agent-facing traffic transformation.", "type": "Research", "date": "2026-08-31", "source_url": "https://www.fastly.com/es-latam/blog/instantly-ai-agent-ready-webmcp-on-demand"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "HPE Sells Former Juniper Sunnyvale Campus for $330.8M in Sale-Leaseback", "summary": "HPE sold the former Juniper Networks headquarters campus at 1133/1137 Innovation Way in Sunnyvale to New York investor Bluerock for $330.8 million, leasing 1133 Innovation back through 2047 with extension options. The move monetizes real estate absorbed in the $14B Juniper acquisition closed July 2025. For F5 teams it signals HPE is optimizing the Juniper integration balance sheet rather than expanding footprint, useful context when positioning against HPE Networking's AI-native roadmap and when field teams assess HPE/Juniper account stability and integration distraction.", "type": "Company News", "date": "2026-08-31", "source_url": "https://www.bizjournals.com/sanjose/news/2026/08/31/hpe-330m-sale-leaseback-sunnyvale.html"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Deutsche Bank Initiates A10 Networks Coverage at Hold with $28 Target", "summary": "Deutsche Bank initiated coverage of A10 Networks (ATEN) with a Hold rating and a $28 price target, calling out A10's load balancing portfolio as a differentiator versus cloud-native alternatives. The note validates that analysts still see on-prem and hybrid ADC value in an AI-driven market. F5 product marketing should update competitive positioning on A10's load balancing plus AI Gateway and TrojAI story, while sellers can use the neutral rating to reinforce F5's broader platform breadth in ADC displacement conversations.", "type": "Financial", "date": "2026-08-31", "source_url": "https://markets.businessinsider.com/news/stocks/a10-networks-initiated-with-a-hold-at-deutsche-bank-1036509609"}]}, "Palo Alto Networks": {"category": "Platforms", "announcements": []}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": []}, "Radware": {"category": "Application Security", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-08-31.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
