(function(){
"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Launches Unified Identity Security Dashboard on Cortex", "summary": "Palo Alto Networks added a Unified Identity Security Dashboard to Cortex. It combines identity posture management (Cortex Cloud Posture) and identity threat detection and response (Cortex ITDR) in one view across cloud, SaaS and on-prem environments. Risk funnels, high-risk rankings and watchlists link misconfigurations to active threats. Customers get it under their existing Cortex licenses. The launch strengthens Palo Alto's single-platform pitch for identity, which F5 needs to answer with its own platform message.", "type": "Product Update", "date": "2026-11-05", "source_url": "https://www.paloaltonetworks.com/blog/cloud-security/unifying-identity-posture-and-threat-detection-with-the-cortex-platform/"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Palo Alto Networks Reportedly in Talks to Buy AI-Agent Security Startup Clutch Security for ~$500M", "summary": "The Information reports that Palo Alto Networks is negotiating to buy Clutch Security, an Israeli startup that tracks the credentials and identities used by AI agents, for about $500 million. It would be Palo Alto's fifth acquisition of 2026 and would add agent identity protection to Prisma AIRS. Palo Alto declined to comment. The deal would intensify competition with F5 AI Guardrails in agentic AI security.", "type": "Acquisition", "date": "2026-11-05", "source_url": "https://www.theinformation.com/articles/palo-alto-networks-talks-pay-500-million-ai-security-startup"}]}, "Fortinet": {"category": "Platforms", "announcements": []}, "Fortinet ~AI": {"category": "AI Security", "announcements": [{"title": "Fortinet and Equinix Secure Distributed AI at Scale with FortiAIGate on Equinix Distributed AI Hub", "summary": "Fortinet made FortiAIGate available on the Equinix Distributed AI Hub as a validated reference architecture. FortiAIGate inspects LLM and MCP traffic and enforces central guardrail policies. It also tracks cost per token, supports data sovereignty, and shows both sanctioned and shadow AI use. NVIDIA GPU-accelerated inspection is designed to avoid slowing AI workloads. Because F5 also partners with Equinix, this puts Fortinet directly against F5 AI Guardrails and F5's AI gateway positioning in that partner motion.", "type": "Partnership", "date": "2026-11-05", "source_url": "https://www.fortinet.com/corporate/about-us/newsroom/press-releases/2026/fortinet-and-equinix-secure-distributed-ai-at-scale"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Partner Summit 26: Building Trusted AI at Scale with Security, Observability and Tokenomics", "summary": "A Cisco blog post lays out a partner framework for 'Trusted AI at scale' with three pillars: security, observability, and tokenomics/ROI. The stack combines Splunk, Cisco Data Fabric and Cisco AI Defense to govern agentic AI. Partners get enablement, co-selling across the portfolio, advisory and managed services, and sovereign deployment options. Cisco is using its channel to bundle AI security with observability, and F5's partner teams will run into that motion.", "type": "Event", "date": "2026-11-05", "source_url": "https://blogs.cisco.com/partner/partner-summit-26-building-trusted-ai-at-scale-together"}, {"title": "Cisco: Firewalling the AI Era \u2013 Why the Network Still Decides", "summary": "In a Cisco blog post, Anton Chuvakin argues that AI agents acting with delegated authority need firewall policy based on behavior and task. The question becomes whether an agent is acting within its role, not just whether it can connect. He says this requires combining identity, application, endpoint and network signals. The post promotes Cisco's Hybrid Mesh Firewall model of enforcement spread across physical, virtual and cloud environments, a narrative F5 product marketing should be ready to counter.", "type": "Research/Report", "date": "2026-11-05", "source_url": "https://blogs.cisco.com/security/firewalling-the-ai-era-why-the-network-still-decides"}]}, "Cisco ~AI": {"category": "AI Security", "announcements": [{"title": "Cisco Open-Sources Project Quarry to Detect Dangerous AI Agent Behavior Across Sessions", "summary": "Cisco open-sourced Project Quarry, an alpha-stage detection language and engine released under Apache 2.0. Security teams write rules describing suspicious sequences of agent actions, such as file reads, command runs and external calls. The engine checks whole multi-turn sessions, including tool calls and their results, against those rules and exports the findings. Quarry extends Cisco's AI Defense work on agentic AI security, an area where F5 AI Guardrails competes.", "type": "Product Launch", "date": "2026-11-05", "source_url": "https://www.linkedin.com/pulse/cisco-open-sources-project-quarry-detect-dangerous-d0khe"}]}, "CrowdStrike": {"category": "Platforms", "announcements": []}, "Zscaler": {"category": "Platforms", "announcements": []}, "Check Point Software": {"category": "Platforms", "announcements": []}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point Research Discloses ChatGPT Lockdown Mode Bypass Enabling Silent Data Exfiltration", "summary": "Check Point Research disclosed a flaw that bypassed ChatGPT Lockdown Mode, a feature meant to stop data exfiltration through prompt injection. The flaw was in HTML page previews inside code blocks, which use nested sandboxed frames. Attackers could use it to steal chat histories, phish for credentials and deliver malware, with zero-click risk in the desktop app. OpenAI fixed it by September 18, 2026. Check Point says the case shows that weaknesses in the application around a model can undermine AI security controls.", "type": "Research/Report", "date": "2026-11-05", "source_url": "https://research.checkpoint.com/2026/chatgpt-lockdown-mode-bypass-phishing-malware-delivery-and-silent-data-exfiltration/"}, {"title": "Check Point Establishes AI Cyber Attack Validation Team in Japan, Offers Free Agentic Exposure Validation", "summary": "Check Point set up an AI Cyber Attack Validation team in Japan and is offering free Agentic Exposure Validation (AEV) assessments to organizations there. AEV uses AI to simulate attacker behavior and shows how separate weaknesses chain into real attack paths, which goes beyond a vulnerability list. The read-only assessment takes up to 24 hours and returns prioritized fixes. Check Point will also publish anonymized findings on exposure trends.", "type": "Product Launch", "date": "2026-11-05", "source_url": "https://prtimes.jp/main/html/rd/p/000000567.000021207.html"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Announces Third Quarter 2026 Financial Results", "summary": "Cloudflare reported Q3 2026 revenue of $782.5M, up 39% year over year, its best quarter ever, and annualized revenue passed $3B. Non-GAAP operating income was $137.1M (a 17.5% margin), and current remaining performance obligations grew 37%. Q4 guidance is $845M\u2013$846M, and full-year 2026 guidance rose to about $2.96B. Cloudflare pointed to growth in AI agent tooling, bot management and government business (FedRAMP High).", "type": "Earnings", "date": "2026-11-05", "source_url": "https://www.cloudflare.com/press/press-releases/2026/cloudflare-announces-third-quarter-2026-financial-results/"}, {"title": "Cloudflare Appoints Christian Smith as President of Revenue", "summary": "Cloudflare named Christian Smith President of Revenue. He will lead worldwide sales and revenue operations as the company pushes toward $5B in annual recurring revenue. Smith previously led Splunk's global go-to-market and helped scale its ARR past $4B during the move to cloud. He succeeds Mark Anderson, who retires from the full-time role at the end of 2026 and stays on as an advisor.", "type": "Executive/Leadership", "date": "2026-11-05", "source_url": "https://www.cloudflare.com/press/press-releases/2026/cloudflare-appoints-christian-smith-as-president-of-revenue/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare Launches Trusted Agent Delegation Coalition and Agent Traffic Controls", "summary": "Cloudflare proposed an 'Intermediation Principle': a website should keep its security relationship with each user even when an AI agent acts for that user. It launched the Trusted Agent Delegation (TAD) coalition to develop open standards with the IETF. Security Analytics now reports agents as their own traffic category. Account Abuse Protection (early access) ties logins and sign-ups to specific personal agents, so WAF rules can block a bad agent without blocking legitimate users.", "type": "Product Launch", "date": "2026-11-05", "source_url": "https://blog.cloudflare.com/trusted-agent-delegation/"}]}, "AWS": {"category": "Platforms", "announcements": []}, "AWS ~AS": {"category": "Application Security", "announcements": [{"title": "AWS WAF AI Traffic Monetization Now Supports Fiat Payouts Through Stripe", "summary": "AWS WAF's AI traffic monetization now pays publishers in local currency through Stripe, alongside the existing stablecoin payouts, so no crypto wallet is needed. When an AI agent requests protected content, AWS WAF returns an HTTP 402 response listing the payment credentials it accepts. Content is delivered once the agent retries with a valid credential, and revenue appears in WAF console analytics. The integration is free for AWS WAF customers on CloudFront; standard WAF and Stripe fees apply.", "type": "Product Update", "date": "2026-11-05", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/aws-waf-stripe-fiat-payouts/"}]}, "AWS ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "AWS Interconnect \u2013 Last Mile Adds Northern Virginia Metro", "summary": "AWS Interconnect \u2013 last mile, a managed private connection service, added Northern Virginia as its second US metro after New York. By default it provisions two diverse locations with four redundant links, carries a 99.99% availability SLA and encrypts all traffic with MACsec. Lumen customers in the continental US can reach all public AWS Regions and Local Zones. Megaport and Equinix offer the service in preview.", "type": "Product Update", "date": "2026-11-05", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/interconnect-last-mile-northern-virginia/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Web Answer on Amazon Bedrock AgentCore Now Generally Available", "summary": "AWS made Web Answer generally available on Amazon Bedrock AgentCore. The managed tool answers a natural-language question in a single call, citing current web sources, and handles search planning, parallel searches and evidence gathering itself. Users can set domain allow/deny lists and publish-date filters. It attaches to an AgentCore Gateway, is called over MCP, uses IAM authentication and has zero data egress. It is available in US East (N. Virginia) and priced per tool call.", "type": "Product Launch", "date": "2026-11-05", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/web-answer-amazon-bedrock/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": [{"title": "How HiddenLayer Secures Cursor AI Agents", "summary": "HiddenLayer released an integration that secures Cursor AI coding agents. Cursor hooks route agent actions to an on-device HiddenLayer plug-in, which checks prompts, tool calls, shell commands, MCP calls and file reads against policy before they run. Each decision to block, redact or log appears in the HiddenLayer Console. Session-level analysis catches attacks chained across steps, such as SSH key theft. Five prompt-injection detections ship with it, it deploys through MDM, and the same plug-in covers Claude Code and GitHub Copilot CLI.", "type": "Product Update", "date": "2026-11-05", "source_url": "https://www.hiddenlayer.com/insight/how-hiddenlayer-secures-cursor"}]}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": [{"title": "Inspecting the Inspector: RCE in MCP's Official Debugging Tool", "summary": "Pillar Security disclosed a high-severity remote code execution flaw (CVE-2026-119025, CVSS 4.0 score 7.7) in MCP Inspector on Windows and WSL. During the remote MCP OAuth flow, a malicious MCP server could run code on a developer's machine with no user interaction. The cause is how the 'open' npm package hands URLs to PowerShell. Fixes are in open 11.0.0, @modelcontextprotocol/inspector 2.12.0 and opencode-ai 1.18.33. Pillar warns that a routine npm update is not enough without explicit version pins.", "type": "Research/Report", "date": "2026-11-05", "source_url": "https://www.pillar.security/blog/inspecting-the-inspector-rce-in-mcps-official-debugging-tool"}]}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Akamai ~P": {"category": "Platforms", "announcements": [{"title": "Akamai Reports Third Quarter 2026 Financial Results", "summary": "Akamai reported Q3 2026 revenue of $1.122B, up 6% year over year. Security revenue was $622M (+9%) and Cloud Infrastructure Services revenue was $109M (+34%), while Delivery fell 3% to $391M. Akamai lowered its full-year 2026 guidance but forecast 2027 CIS revenue of $1.1B\u2013$1.3B and 2028 total revenue above $7.0B. CEO Tom Leighton cited more than $14B in multi-year CIS commitments signed this year, plus the new Akamai Inference and Agent Sandbox services.", "type": "Earnings", "date": "2026-11-05", "source_url": "https://www.akamai.com/newsroom/press-release/akamai-reports-third-quarter-2026-financial-results"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Fastly Shares Drop Sharply After Q3 Results as Customer Concentration and CRO Transition Weigh", "summary": "Fastly shares fell about 25% on November 5, even though Q3 2026 revenue hit a record $190.2M (+20%) and full-year guidance rose to $744\u2013$748M. Investors focused on the planned retirement of go-to-market president Scott Lovett and on customer concentration. DA Davidson noted that the top 10 customers drove 39% of revenue and 92% of sequential growth, while all other customers grew 8% year over year. Fastly cited a seven-figure deal with a leading AI company and said security revenue grew 32%.", "type": "Earnings", "date": "2026-11-05", "source_url": "https://stockstory.org/us/stocks/nasdaq/fsly/news/why-up-down/why-fastly-fsly-shares-are-getting-obliterated-today"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "A10 Networks Reports Financial Results for the Third Quarter of 2026", "summary": "A10 Networks posted record Q3 2026 revenue of $91.5M, up 22.6% year over year, with non-GAAP EPS of $0.31 and a 32.2% adjusted EBITDA margin. It raised full-year 2026 revenue growth guidance to about 16% (from 12\u201314%). CEO Dhrupad Trivedi credited rising network traffic, AI deployments and security demand. Analysts highlighted AI security wins, including a Fortune 50 financial services firm deploying A10's AI firewall across about 800 AI applications. That is a direct competitive signal against F5 in ADC and AI security.", "type": "Earnings", "date": "2026-11-05", "source_url": "https://www.businesswire.com/news/home/20261105742453/en/A10-Networks-Reports-Financial-Results-for-the-Third-Quarter-of-2026"}]}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista CEO Jayshree Ullal: The AI Network Can Pay for Itself", "summary": "In a November 5 interview, Arista CEO Jayshree Ullal argued that AI networking pays for itself by cutting wasted compute. Arista EOS and full-network telemetry find idle AI accelerators and reassign them, which can lift utilization from about 30%. Ullal positioned open Ethernet and the Ultra Ethernet Consortium against NVIDIA InfiniBand and NVLink. The interview follows Arista's Q3 results of $3.66B revenue (+58.5%), with AI networking revenue expected to reach about $7B in 2027.", "type": "Executive/Leadership", "date": "2026-11-05", "source_url": "https://www.fierce-network.com/cloud/arista-ceo-jayshree-ullal-ai-network-can-pay-itself"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Kappa Data Becomes HPE Networking Distribution Partner for Benelux", "summary": "HPE named Kappa Data its Benelux distribution partner for networking and security, effective November 1, 2026. The deal covers HPE's full networking portfolio, including Aruba, Juniper and Mist, plus data center and security solutions. Kappa Data will support partners from presales and bill-of-materials work through technical aftersales and marketing. The move widens HPE Networking's channel reach in the region after the Juniper acquisition, in line with HPE's push into AI-driven, self-driving networks.", "type": "Partnership", "date": "2026-11-05", "source_url": "https://itdaily.com/news/business/kappa-data-hpe-distribution-partner/"}]}, "Radware": {"category": "Application Security", "announcements": []}, "Radware ~AI": {"category": "AI Security", "announcements": [{"title": "Radware: Who Is Prompt-Injecting Coding Agents?", "summary": "Radware scanned about 145 million items of public GitHub content (issues, pull requests and comments) for hidden prompt injections aimed at AI coding agents. It found 2,281 hidden-text cases, including 47 targeted attacks, many aimed at a project's own AI bots. Hidden-text cases more than doubled from June to September 2026. Radware released an open-source ipi-scan toolset and the full dataset. It advises giving issue-reading bots no secrets and the minimum write access they need.", "type": "Research/Report", "date": "2026-11-05", "source_url": "https://www.radware.com/blog/prompt-injecting-coding-agents/"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-11-05.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
</html>
