(function(){
"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "2026 State of Global Critical Infrastructure Cybersecurity Report: 95% of Leaders Fear Frontier AI-Powered Attacks", "summary": "Palo Alto Networks released survey findings from more than 1,600 critical infrastructure security leaders across 11 countries and five sectors. 95% are concerned about frontier AI-powered attacks, and 60% had a significant breach in the past year, often with physical safety concerns. The report promotes PAN-OS 12.2 Frontier Virtual Patching, ruggedized NGFWs, OT microsegmentation and attack-path mapping, and its Frontier AI Critical Defense Program. PANW is using AI-threat research to pull OT and critical infrastructure buyers toward its platform.", "type": "Research", "date": "2026-10-06", "source_url": "https://www.paloaltonetworks.com/blog/network-security/state-of-global-critical-infrastructure-cybersecurity-2026-95-of-leaders-concerned-about-frontier-ai-powered-attacks/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet and Aramco Sign MoU to Strengthen Industrial Cybersecurity in Saudi Arabia", "summary": "Fortinet signed a Memorandum of Understanding with Aramco on industrial and OT cybersecurity in Saudi Arabia. It covers localizing security solutions for industrial sectors, exploring an in-country Fortinet Cloud deployment, joint research, and talent development through training programs, bootcamps and access to Fortinet platforms. The deal deepens Fortinet's Security Fabric presence with Middle East energy and sovereign-cloud customers, a region where F5 field and alliance teams compete.", "type": "Partnership", "date": "2026-10-06", "source_url": "https://arabiandaily.com/fortinet-and-aramco-sign-mou-to-strengthen-industrial-cybersecurity-in-saudi-arabia/"}, {"title": "FBI and Secret Service Warn FortiBleed Credential Campaign Against FortiGate Firewalls and VPNs Remains Active", "summary": "A joint FBI and U.S. Secret Service advisory says FortiBleed, a global campaign using stolen credentials against internet-facing FortiGate firewalls and SSL VPN gateways, is still active. Attackers create admin accounts, lock out legitimate users, and hand access to ransomware affiliates; hundreds of thousands of devices may have been targeted. The agencies urge credential resets, phishing-resistant MFA and restricting external management. Customers worried about Fortinet edge exposure may be open to conversations about replacing or augmenting remote-access and edge security.", "type": "Research", "date": "2026-10-06", "source_url": "https://cyberscoop.com/fortibleed-fortinet-vpn-ransomware-fbi-warning/"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Unveils Prototype Quantum Network Controller as Control Plane for Quantum Networks", "summary": "Cisco introduced a prototype Quantum Network Controller that coordinates quantum computers, memories and switches across a network. Applications request entanglement with a target fidelity and timing through simplified APIs, and a new Network-Aware Quantum Compiler plans computations against realistic network constraints with distributed error correction. Cisco positions it as an early, partner-focused launch. It is a long-horizon research signal with little near-term F5 overlap, but it adds to Cisco's networking-innovation story.", "type": "Product Launch", "date": "2026-10-06", "source_url": "https://www.networkworld.com/article/4231343/cisco-readies-new-control-plane-for-quantum-networks.html"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike, AWS, and NVIDIA Expand Global Cybersecurity Startup Accelerator for the Agentic Era", "summary": "CrowdStrike, AWS and NVIDIA opened their fourth annual Cybersecurity Startup Accelerator to applicants worldwide. Applications close November 2, 2026; the eight-week program runs January 11 to March 8, 2027, with up to ten finalists pitching at RSAC 2027. New this year, startups get access to Falcon Foundry, Falcon APIs and CrowdStrike Marketplace, plus possible Falcon Fund investment. The program strengthens CrowdStrike's agentic-AI ecosystem with AWS and NVIDIA, two partners F5 alliances also work with.", "type": "Partnership", "date": "2026-10-06", "source_url": "https://www.nasdaq.com/press-release/crowdstrike-aws-and-nvidia-expand-global-cybersecurity-startup-accelerator-defining"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler Hosts 2026 Investor Day, Reaffirms Q1 and Fiscal 2027 Guidance", "summary": "At its October 6 Investor Day in New York, Zscaler reaffirmed Q1 FY27 revenue guidance of $935M-$939M (~19% YoY) and FY27 revenue of $3.908B-$3.938B, with ARR of $4.396B-$4.426B. CEO Jay Chaudhry pitched Zscaler as 'the cybersecurity platform for the AI era' and repeated the $10B ARR goal, driven by zero trust, data security and secure AI adoption. Expect sharper platform-consolidation and AI-security messaging against F5's platform story.", "type": "Financial", "date": "2026-10-06", "source_url": "https://www.globenewswire.com/news-release/2026/10/06/3375261/0/en/zscaler-hosts-2026-investor-day-reaffirms-first-quarter-and-fiscal-2027-guidance.html"}, {"title": "Zscaler ThreatLabz and TRM Labs Join Forces to Track Cybercrime and Nation-State Activity", "summary": "Zscaler ThreatLabz and TRM Labs announced a collaboration combining ThreatLabz threat intelligence with TRM's on-chain crypto analytics to link ransomware and nation-state operations to cryptocurrency payments, with co-authored research and briefings. ThreatLabz cites more than $327.8M in known ransom payments from April 2025 to March 2026, with the average payment up 5.3% to $431.9K. It is mainly a threat-research and brand play that adds to Zscaler's threat-intelligence credibility.", "type": "Partnership", "date": "2026-10-06", "source_url": "https://www.zscaler.com/blogs/partner/trm-labs-and-zscaler-threatlabz-join-forces-track-cybercrime-and-nation-state"}]}, "HiddenLayer": {"category": "AI Security", "announcements": [{"title": "HiddenLayer Granted US Patent 12754996 for Machine Learning Model Parameter-Based Encryption", "summary": "HiddenLayer was granted US Patent 12754996, 'Machine learning model parameter based encryption,' issued October 6, 2026. The method uses password-derived keys to alter the weights and biases of a paired encoder and decoder so data sits in a 'hidden compartment' that only correctly keyed models can reveal; wrong keys can return decoy data. It adds to HiddenLayer's model- and data-protection IP, an area adjacent to F5 AI Guardrails' model and data protection story.", "type": "Research", "date": "2026-10-06", "source_url": "https://exa.ai/library/legal/patent/32n38342xj7"}]}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Fastly Meets 100% Renewable Electricity Commitment as Market-Based Emissions Fall 94%", "summary": "Fastly reported meeting its 100% renewable electricity commitment. Its 2025 Sustainability Report says it covered all non-renewable electricity across its global network and offices with Environmental Attribute Certificates, cutting market-based Scope 1 and 2 emissions 94% year over year while total Scope 1-3 emissions fell 3%. The report adds carbon-intensity disclosure, third-party assurance and a customer sustainability dashboard, giving Fastly a procurement and ESG proof point for edge and CDN deals.", "type": "Research", "date": "2026-10-06", "source_url": "https://bytejournal.org/news/2026-10-06-fastly-meets-100-renewable-commitment-as-market-based-emissions-fall-9/"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Citrix Patches Another Actively Exploited NetScaler Zero-Day (CVE-2026-88779)", "summary": "Trade press on October 6 covered CVE-2026-88779, the third actively exploited NetScaler ADC/Gateway zero-day in weeks: a memory overflow that can cause denial of service on SAML SP/IdP configurations. Fixed builds (14.1-73.41, 13.1-64.28 and FIPS variants) shipped October 3, and CISA added the flaw to its KEV catalog. It follows late-September patches for CVE-2026-88771 through 88778, with admins reporting reboots even on patched systems. This is a strong ADC displacement opening for F5 BIG-IP.", "type": "Product Update", "date": "2026-10-06", "source_url": "https://fieldeffect.com/blog/citrix-patches-another-exploited-netscaler-vulnerability"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Networks to Announce Q3 2026 Financial Results on November 3, 2026", "summary": "Arista said it will report Q3 2026 results after market close on Tuesday, November 3, 2026, with a conference call and webcast at 1:30 PM PT. It also listed December investor events: the UBS Global AI and Tech Conference, the Wells Fargo TMT Summit and the Barclays Global Tech Conference. Arista's AI networking fabric growth makes the call worth watching for AI data center networking demand signals relevant to F5's AI Data Delivery positioning.", "type": "Financial", "date": "2026-10-06", "source_url": "https://www.arista.com/en/company/news/press-release/24817-pr-20261006"}]}, "Radware": {"category": "Application Security", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Introduces Tiered Support Plans (Core, Plus, Pro) for Customers, Partners and MSPs", "summary": "Barracuda launched three support tiers, Core, Plus and Pro, each bundling onboarding, technical support, advisory services, customer and partner success, and training. Plus includes two advisory credits a year and Pro includes four, usable for migrations, optimization, configuration and assurance reviews. The plans are designed to work with the BarracudaONE AI risk-prioritization platform. F5 professional services and customer success teams can benchmark their own onboarding and advisory packaging against this MSP-heavy competitor.", "type": "Product Update", "date": "2026-10-06", "source_url": "https://pt.blog.barracuda.com/2026/10/06/introducing-barracuda-support-plans"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "Imperva Research: The Hidden DoS Vector in SQL Parsers", "summary": "Imperva researchers found denial-of-service flaws in SQL parsers caused by recursive stack overflow and parse-tree (AST) object inflation. Affected projects include SQLGlot and SQLFluff, with the SQLFluff issues fixed upstream as CVE-2026-46373 and CVE-2026-46374. Imperva recommends depth limits, node counting and input-size validation, noting that LLM-enabled data tools widen the attack surface. F5 can counter with its own WAF and application-layer DoS protection messaging.", "type": "Research", "date": "2026-10-06", "source_url": "https://www.imperva.com/blog/the-hidden-dos-vector-in-sql-parsers/"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cisco Expands Cisco-Validated SONiC Across Nexus N9000 for Open AI Fabrics", "summary": "Cisco made security-hardened, Cisco-validated SONiC available on Nexus N9000 (Cloud Scale silicon, 100G/400G leaf-spine) and on N9100 with NVIDIA Spectrum-X for AI backend fabrics, with Nexus Dashboard visibility and full-stack TAC support. Silicon One-based N9000 support is on the roadmap. The move targets neoclouds, web-scale operators and AI infrastructure providers wanting open networking with vendor lifecycle support, strengthening Cisco's AI fabric pitch alongside NVIDIA, which is relevant to F5's AI data delivery and NVIDIA alliance motion.", "type": "Product Update", "date": "2026-10-06", "source_url": "https://convergedigest.com/cisco-validated-sonic-nexus-n9000-ai-fabrics/"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike Research Shows Leading LLM Safety Classifier Can Be Systematically Bypassed", "summary": "CrowdStrike's Cyber Superintelligence Lab found the leading publicly deployed LLM safety classifier can be bypassed by splitting harmful requests into harmless-looking subtasks and reassembling the results, succeeding in 9 of 10 offensive security categories across about 515 technique classes. The work supports Microsoft Research's 'Capability Laundering' findings that per-exchange checks are insufficient. CrowdStrike can now argue single-exchange guardrails fall short, so F5 AI Guardrails messaging should emphasize multi-turn and agent-level detection.", "type": "Research", "date": "2026-10-06", "source_url": "https://www.crowdstrike.com/en-us/blog/how-attackers-can-bypass-llm-safety-classifiers/"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point PromptGuardX: Securing the Files AI Agents Trust", "summary": "Check Point announced PromptGuardX, extending its AI Defense Plane to the file layer. Working with Threat Emulation, it scans files such as PDFs for prompt injection and other content-borne attacks before they reach AI agents, LLMs or copilots. It covers Quantum gateways, Harmony Email & Collaboration and other Threat Emulation-enabled gateways, adding a pre-ingestion check alongside prompt inspection and runtime enforcement. It competes directly with F5 AI Guardrails on prompt-injection defense; watch for 'upstream file inspection' messaging.", "type": "Product Launch", "date": "2026-10-06", "source_url": "https://blog.checkpoint.com/ai-security/check-point-promptguardx-securing-the-files-ai-agents-trust/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare WAF Managed Rules Release 2026-10-06", "summary": "Cloudflare published a WAF managed-rules release dated October 6, 2026. Scheduled changes include merging a new 'Generic Rules - Template Injection - 2 - Beta' rule into the existing 'Generic Rules - Template Injection - 2' rule, with logging set for October 12. The release reflects Cloudflare's frequent, published WAF rule cadence, which it uses to compete with F5 Advanced WAF and Distributed Cloud WAAP on speed of coverage for new threats.", "type": "Product Update", "date": "2026-10-06", "source_url": "https://developers.cloudflare.com/changelog/post/2026-10-06-waf-release/"}]}, "AWS ~AS": {"category": "Application Security", "announcements": [{"title": "AWS Certificate Manager Now Supports ACME Issuance Through AWS PrivateLink", "summary": "AWS Certificate Manager now lets ACME clients request and renew public TLS certificates privately within a VPC through AWS PrivateLink. Private DNS resolves the ACME directory URL automatically, so clients need no reconfiguration, and issuance is logged in CloudTrail and CloudWatch. It is available in all commercial Regions. This strengthens AWS-native certificate lifecycle management, which matters for F5 certificate-automation and BIG-IP/NGINX TLS termination discussions in AWS deployments.", "type": "Product Update", "date": "2026-10-06", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/AWS-Certificate-Manager-ACME-Privatelink/"}]}, "AWS ~AI": {"category": "AI Security", "announcements": [{"title": "Two Flaws in Amazon Bedrock AgentCore SDK Could Expose AWS Credentials", "summary": "MSSP Alert reported two vulnerabilities (CVE-2026-12530 and CVE-2026-16796) in the Amazon Bedrock AgentCore Python SDK's Code Interpreter helper that could allow arbitrary command execution in AI sandboxes and exposure of temporary AWS credentials. AWS fixed them in SDK versions 1.6.1 and 1.18.1 and advises upgrading, restricting execution-role permissions and monitoring Code Interpreter activity. It is a timely proof point for independent runtime protection of agentic AI, such as F5 AI Guardrails, on hyperscaler platforms.", "type": "Research", "date": "2026-10-06", "source_url": "https://www.msspalert.com/news/two-vulnerabilities-in-amazon-bedrock-agentcore-sdk-could-expose-aws-credentials"}]}, "Akamai ~P": {"category": "Platforms", "announcements": [{"title": "Akamai Security Research: How Akamai ExAR Contained a LATAM Supply Chain Attack", "summary": "Akamai published a security research post on a Latin American supply chain attack, describing how its ExAR approach detected the intrusion, contained it and stopped lateral movement while operations continued. The post covers attacker techniques, remediation steps and Zero Trust and microsegmentation recommendations. Akamai is using incident-response stories to promote its Guardicore/Zero Trust platform, extending its message beyond CDN and WAF.", "type": "Research", "date": "2026-10-06", "source_url": "https://www.akamai.com/blog/security-research/how-akamai-exar-contained-latam-supply-chain-attack"}]}, "Arista Networks ~P": {"category": "Platforms", "announcements": [{"title": "Arista Issues Batch of Wi-Fi Access Point Security Advisories (0189-0197), Including CVSS 9.0 RCE Flaw", "summary": "Arista published several security advisories for its Wi-Fi access points. Advisory 0197 (CVE-2026-102167, CVSS v4 9.0) is a stack overflow on wired uplink endpoints that could allow remote code execution; others cover WIPS sensors, Captive Portal denial-of-service bugs and a VXLAN L2-proxy memory exposure. Fixes are in releases 22.1.1F-61+ and 21.4.0M-12+, and Arista reports no known exploitation. Services and operations teams may field questions about campus edge hygiene.", "type": "Product Update", "date": "2026-10-06", "source_url": "https://www.arista.com/en/support/advisories-notices/security-advisory/24813-security-advisory-0197"}]}, "HPE / Juniper Networks ~P": {"category": "Platforms", "announcements": [{"title": "HPE Networking Discloses 37 CVEs Across ClearPass Policy Manager and AOS-Switch, Including Unauthenticated RCE", "summary": "HPE Networking published advisories HPESBNW05156 (AOS-Switch) and HPESBNW05158 (ClearPass Policy Manager) covering 37 CVEs, twelve scoring 9.8 or higher, including authentication bypass and unauthenticated remote code execution. AOS-S 16.11.0031 and earlier are affected, with fixes in 16.11.0032+. HPE recommends restricting management interfaces to isolated VLANs. This is relevant for F5 operations and services teams working in mixed HPE campus environments.", "type": "Product Update", "date": "2026-10-06", "source_url": "https://csaf.arubanetworking.hpe.com/2026/hpe_networking_-_hpesbnw05156.txt"}]}, "Barracuda Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Barracuda Pushes AI Data Security Solution to MSPs for AI Governance", "summary": "Barracuda is promoting Barracuda AI Data Security to MSPs. Delivered in the BarracudaONE multi-tenant console, it offers risk assessments, prompt inspection, automated auditing, Shadow AI discovery and protection against sensitive data leaking into LLMs. Basic Shadow AI visibility is free, with deeper controls as paid add-ons. First announced September 22, the push brings Barracuda into prompt-inspection and AI-governance territory where F5 AI Guardrails competes, especially in the SMB and MSP channel.", "type": "Product Launch", "date": "2026-10-06", "source_url": "https://www.e-channelnews.com/barracudas-new-solution-secures-msp-ai-governance/"}]}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-10-06.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
</html>
