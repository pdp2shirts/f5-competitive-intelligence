(function(){
"use strict";
var DATA={"Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Palo Alto Networks Launches Unit 42 Continuous Frontier AI Defense with Claude Mythos and GPT-5.6-Cyber", "summary": "Palo Alto Networks turned its Unit 42 Frontier AI Defense from a point-in-time assessment into an always-on agentic offensive security service, running Anthropic's Claude Mythos 5 and OpenAI's GPT-5.6-Cyber in a multi-model harness to continuously find, validate and remediate exposures across apps, identities, cloud and networks. It claims exposures in every customer tested, 37% high or critical. This raises the bar on AI-native security services and pressures F5 to articulate how AI Guardrails and AI Red Team fit a continuous validation narrative rather than a one-time test.", "type": "Product Launch", "date": "2026-09-22", "source_url": "https://www.paloaltonetworks.com/company/press/2026/palo-alto-networks-delivers-anthropic-s-mythos-and-openai-s-gpt-5-6-to-customers-with-unit-42-continuous-frontier-ai-defense"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Adds Sovereign On-Prem AI, Post-Quantum Dashboard and Automated Deception to FortiNDR", "summary": "Fortinet extended FortiNDR with FortiAI Sovereign for fully on-premises, air-gapped AI investigation, a post-quantum cryptography readiness dashboard, and dynamic deception that turns decoys into active response triggers. The move targets regulated, sovereignty-sensitive buyers who cannot send telemetry to cloud AI. For F5, it signals that data sovereignty and quantum readiness are becoming table-stakes proof points in enterprise security conversations, and gives product marketing a cue to sharpen how F5 positions on-prem and air-gapped AI delivery and PQC support across BIG-IP and Distributed Cloud.", "type": "Product Launch", "date": "2026-09-22", "source_url": "https://www.fortinet.com/blog/security-operations/sovereign-ai-meets-quantum-ready-defense-with-fortindr"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Unveils Secure Networking Reference Architecture Treating the Network as a Security Layer", "summary": "Cisco published a secure networking reference architecture built on three pillars \u2014 Trust the Infrastructure, Secure Every Flow, Assure Every Experience \u2014 unified by Cisco Data Fabric, shared policy context, crypto-agile MACsec/IPsec, post-quantum readiness and observability via Splunk, ThousandEyes and AI Canvas. It is a consolidation play that folds networking, security and observability into one operating model. F5 should expect this architecture to frame enterprise RFPs, and product marketing needs a clear answer on where application delivery and app security sit inside a Cisco-led reference design.", "type": "Product Launch", "date": "2026-09-22", "source_url": "https://blogs.cisco.com/networking/your-network-is-a-security-layer-its-time-to-treat-it-like-one"}, {"title": "Notre Dame Athletics Selects Cisco as Official Technology Partner for Campus-Wide Network Modernization", "summary": "Cisco won a multi-year deal with University of Notre Dame Athletics covering nearly 1,000 Catalyst 9300X switches, Catalyst Center automation, zero-touch provisioning, ThousandEyes visibility and Cisco Professional Services. It follows a similar Georgetown Wi-Fi 7 win, showing Cisco bundling hardware, management, observability and services into AI-ready campus refreshes. For F5, the services-attached motion is the notable part: professional services and field teams should watch for follow-on application delivery and security requirements once these modernized campus networks go live.", "type": "Customer Win", "date": "2026-09-22", "source_url": "https://newsroom.cisco.com/c/r/newsroom/en/us/a/y2026/m09/notre-dame-athletics-selects-cisco-to-enhance-campus-wide-network-connectivity.html"}]}, "Cisco ~AI": {"category": "AI Security", "announcements": [{"title": "Cisco Talos Documents ClosedQuorum, the First Reported Autonomous AI Command-and-Control Implant", "summary": "Cisco Talos detailed CLOSEDQUORUM, a Go-based Windows implant that replaces a human operator by polling DeepSeek, Qwen, Mistral and Google Gemini and executing whichever action wins a plurality vote. Talos also released CAIRN, a tracking toolkit for AI-integrated malware. This is a concrete proof point that attackers are operationalizing commercial LLMs, strengthening the case F5 makes for AI traffic inspection and outbound model-call governance. Product marketing can cite it in AI Security narratives; sellers can use it to open AI-egress visibility conversations.", "type": "Research", "date": "2026-09-22", "source_url": "https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Internet2 and Cisco Add AI Capacity to the National Research Platform", "summary": "Internet2 and Cisco announced an expansion of AI compute and network capacity on the National Research Platform, extending Cisco's footprint in research and education AI infrastructure. The deal reinforces Cisco's positioning as the connectivity layer for distributed AI workloads and GPU-backed research clusters. For F5, it is a reminder that AI data delivery wins are being landed through consortium and public-sector infrastructure programs; cloud alliances and field teams targeting higher-ed and research accounts should map where inference traffic management fits alongside Cisco's fabric.", "type": "Partnership", "date": "2026-09-22", "source_url": "https://www.prnewswire.com/news-releases/internet2-and-cisco-add-ai-capacity-to-the-national-research-platform-302886325.html"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "Tamnoon Integrates with CrowdStrike Falcon Cloud Security to Extend Cloud Risk Remediation Workflows", "summary": "Tamnoon launched a CrowdStrike Marketplace integration that pulls Falcon Cloud Security findings into its agent-driven managed remediation platform, enriches them with environment context, drives human-supervised fixes and writes resolution status back into Falcon. The move shows CrowdStrike expanding its platform gravity through marketplace partners rather than building every remediation workflow itself. F5 cloud alliances and product marketing should note the ecosystem-led consolidation pattern, and professional services can position managed remediation adjacency where F5 telemetry feeds customer cloud security programs.", "type": "Partnership", "date": "2026-09-22", "source_url": "https://www.prnewswire.com/news-releases/tamnoon-integrates-with-crowdstrike-falcon-cloud-security-to-extend-cloud-risk-remediation-workflows-302884275.html"}]}, "Zscaler ~AI": {"category": "AI Security", "announcements": [{"title": "Zscaler Joins Blueprint Alliance as Founding Member to Secure the Agentic Enterprise", "summary": "Zscaler became a founding member of the Blueprint Alliance, a cross-industry coalition with Okta, AWS, CrowdStrike, Google Cloud, Databricks, Proofpoint, Salesforce, ServiceNow and Wiz building an open multi-vendor reference architecture for securing AI agents. Zscaler contributes AI asset discovery, secure access to GenAI apps, automated red teaming, prompt hardening and runtime guardrails. This is a standards-level challenge to F5's AI Guardrails and AI Red Team positioning: competitors are framing agentic security as an interoperable ecosystem rather than point products. PMM and cloud alliances should assess whether F5 needs a seat at this table.", "type": "Partnership", "date": "2026-09-22", "source_url": "https://www.zscaler.com/blogs/company-news/zscaler-joins-blueprint-alliance-help-secure-agentic-enterprise"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Issues Emergency Advisory for Actively Exploited Management Server Zero-Day CVE-2026-93616", "summary": "Check Point published an urgent advisory covering two actively exploited flaws: CVE-2026-93616, a pre-authentication path traversal zero-day in the Security Management web service allowing arbitrary script execution, and CVE-2026-85102, a certificate validation bug in VPN negotiation enabling unauthenticated RCE. Exploitation was observed against Check Point Spark customers globally and fixes are available now. Sellers and field teams have an opening on firewall management-plane risk; professional services should expect customer requests to audit exposed management interfaces across the estate.", "type": "Security Advisory", "date": "2026-09-22", "source_url": "https://blog.checkpoint.com/security/security-advisory-action-required-active-exploitation-of-cve-2026-85102-and-a-management-pre-authentication-vulnerability-cve-2026-93616/"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Launches Worker Previews: Isolated Preview Environments for Every Branch and Agent Change", "summary": "Cloudflare shipped Worker Previews, giving every Git branch or pull request a production-like isolated environment with its own code, config, URL, observability and isolated Durable Objects, KV, D1 and R2 resources. Previews are configured in Wrangler 4.135.0+ and auto-created through Workers Builds. The framing is explicitly AI-agent-centric: safely test what an agent changed before merging. This deepens Cloudflare's developer-platform moat beyond CDN and security, which is where consolidation pressure on F5 originates. Product and product marketing should note the developer-workflow lock-in effect.", "type": "Product Launch", "date": "2026-09-22", "source_url": "https://blog.cloudflare.com/worker-previews/"}]}, "Cloudflare ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Cloudflare Ships Vary Header Support in Cache Rules Across All Plans", "summary": "Cloudflare added full HTTP Vary header support to Cache Rules on every plan tier from Free to Enterprise, letting customers control per-header cache behavior with normalization, exact passthrough or bypass instead of hand-rolling custom cache keys or Workers logic. This removes a long-standing caching correctness gap and reduces cache fragmentation. For F5 field and product marketing, it is a reminder that Cloudflare keeps closing traditional delivery and caching feature gaps for free, eroding differentiation arguments around advanced traffic and content handling.", "type": "Product Launch", "date": "2026-09-22", "source_url": "https://blog.cloudflare.com/vary-support/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare Joins Global Operation With Microsoft to Disrupt EvilTokens Phishing-as-a-Service", "summary": "Cloudforce One detailed its role in a coordinated takedown with Microsoft and law enforcement of EvilTokens, a phishing-as-a-service platform that abused Cloudflare Workers and stolen Cloudflare API keys to host phishing pages and harvest Microsoft 365 tokens for business email compromise. Cloudflare purged hundreds of domains and Workers projects and built new detections. Notably, its own platform was the abuse vector. Marketing can use this threat-intel visibility play as a benchmark; sellers should expect customers to ask how F5 handles platform abuse and credential-driven phishing infrastructure.", "type": "Research", "date": "2026-09-22", "source_url": "https://www.cloudflare.com/threat-intelligence/research/report/cloudflare-participates-in-global-operation-to-disrupt-eviltokens-phishing-as-a-service/"}]}, "AWS ~AI": {"category": "AI Security", "announcements": [{"title": "AWS Named Founding Member of the Blueprint Alliance for Securing AI Agents", "summary": "AWS joined Okta, Zscaler, CrowdStrike, Google Cloud, Databricks, Docker, Proofpoint, Salesforce, ServiceNow and Wiz in launching the Blueprint Alliance, a coalition advancing a shared open reference architecture for agentic AI security built around four questions: where are my agents, what can they do, what are they doing, and how do I respond. With both hyperscalers and major security vendors aligned on one framework, F5 risks sitting outside the emerging standard for AI agent governance. Cloud alliances and PMM should evaluate participation or interoperability messaging.", "type": "Partnership", "date": "2026-09-22", "source_url": "https://www.okta.com/newsroom/press-releases/industry-leaders-form-the-blueprint-alliance/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Anthropic's Claude Opus 5.5 Now Available on AWS via Amazon Bedrock", "summary": "AWS made Claude Opus 5.5 available through Amazon Bedrock and the Claude Platform on AWS, including AWS GovCloud (US), with lower token cost than Opus 5, zero data retention by default, regional data residency, and Bedrock Guardrails and Knowledge Bases integration. Every frontier model AWS lands on Bedrock increases inference traffic that needs routing, securing and governing. That is the demand signal behind F5's AI Data Delivery story, while Bedrock Guardrails competes with F5 AI Guardrails at the model layer. Product and PMM should track native guardrail parity closely.", "type": "Product Launch", "date": "2026-09-22", "source_url": "https://www.aboutamazon.com/news/aws/anthropic-claude-4-opus-sonnet-amazon-bedrock"}]}, "Akamai ~AI": {"category": "AI Security", "announcements": [{"title": "Akamai SOTI Report: Securing Agentic AI Requires a Shift to Behavioral Governance", "summary": "Akamai released a State of the Internet security report arguing that CISOs must move from identity-based controls to behavioral governance of nonhuman identities as agentic AI executes tasks across APIs. It flags AI-driven surges in bot and API threats, notes MCP traffic now accounts for roughly 4% of AI bot POST transactions, and cites sensitive data appearing in over 6% of AI chats. This is Akamai using thought leadership to claim the agentic-AI security narrative F5 targets with AI Guardrails and API Security, and it hands sellers and PMM fresh counter-proof points.", "type": "Research", "date": "2026-09-22", "source_url": "https://www.globenewswire.com/news-release/2026/09/22/3366103/0/en/akamai-report-securing-agentic-ai-requires-shift-to-behavioral-governance.html"}]}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "VST ECS Expands Enterprise Cybersecurity Portfolio Through Partnership with Akamai", "summary": "Akamai added distributor VST ECS Philippines as a channel partner, effective September 22, bringing app and API security, DDoS protection, Zero Trust, microsegmentation, bot management, DNS and cloud security to banking, retail, government, BPO, telecom and healthcare accounts. The motion deepens Akamai's APAC channel reach in a region where F5 competes for the same WAAP and API security budgets. F5 channel and field teams in APJ should expect more Akamai-led displacement attempts, and marketing should refresh regional partner enablement accordingly.", "type": "Partnership", "date": "2026-09-22", "source_url": "https://www.philstar.com/business/biz-memos/2026/09/22/2557862/vst-ecs-strengthens-enterprise-portfolio-expands-cybersecurity-offerings-through-partnership-akamai"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Fastly Investor Day: $1.1B\u2013$1.3B Revenue Target by 2029 as AI Traffic Surges", "summary": "At its September 22 Investor Day, Fastly set 2029 targets of $1.1B\u2013$1.3B revenue (14\u201321% CAGR), 67\u201371% gross margin, 20\u201322% operating margin and 12\u201315% free cash flow margin, with capex at 10\u201312% of revenue. Growth is pinned on a unified edge cloud platform, multi-product adoption and international expansion, plus a move to single-line revenue reporting in 2027. Fastly is explicitly betting on AI traffic growth and platform consolidation \u2014 the same thesis F5 sells, so PMM should sharpen platform-breadth and hybrid/multicloud differentiation.", "type": "Financial", "date": "2026-09-22", "source_url": "https://www.marketbeat.com/instant-alerts/event-fastly-targets-up-to-13b-revenue-by-2029-as-ai-traffic-surges-2026-09-22/"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Attackers Exploit Citrix NetScaler Vulnerabilities to Deploy Targeted Malware", "summary": "Fresh reporting details active exploitation of Citrix NetScaler ADC and Gateway flaws, including the CVE-2026-19490 authentication bypass now on CISA's KEV list, being used to deploy targeted malware on unpatched appliances. Coverage stresses that patching alone is insufficient and that forensic triage of the exposure window is required. Sustained NetScaler exploitation pressure creates displacement conversations for F5 sellers and migration work for professional services, while PMM can reinforce BIG-IP lifecycle, hardening and upgrade-hygiene messaging.", "type": "Security Advisory", "date": "2026-09-22", "source_url": "https://www.techshotsapp.com/technology/hackers-exploit-citrix-netscaler-vulnerabilities-to-deploy-targeted-malware"}]}, "A10 Networks ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "A10 Networks Launches A10 AI Gateway as an Intelligent Control Plane for All AI Operations", "summary": "A10 pushed a fresh regional launch wave for A10 AI Gateway, positioned as a central control plane giving enterprises visibility into AI usage, cost management, access control and security across AI agents, applications and LLMs, with general availability cited for Q4 2026. It runs inside the customer's environment and pairs with TrojAI by A10 Networks. This is a direct competitive overlay on F5's AI Gateway and AI Data Delivery story, so PMM and sellers should be ready on routing, token governance and sovereignty differentiators.", "type": "Product Launch", "date": "2026-09-22", "source_url": "https://itwire.com/guest-articles/company-news/a10-networks-launches-a10-ai-gateway-an-intelligent-control-plane-for-unified-management-of-all-ai-operations"}]}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Pushes \u201cScale-Across\u201d Networking as the Next Frontier for Distributed AI Fabrics", "summary": "Arista introduced \u201cscale-across\u201d networking, extending AI fabrics beyond a single data center to link geographically distributed GPU clusters constrained by power and compute scarcity. The 7800 AI Spine anchors the design with SRv6 multiplane forwarding, real-time congestion signaling, deterministic routing, multi-tenancy and coherent ZR/ZR+ optics, all under one EOS image spanning scale-up, scale-out and scale-across. For F5, this reframes AI data delivery as a multi-region problem and raises the bar on inference traffic steering, congestion awareness and tenant isolation across distributed AI estates.", "type": "Product Launch", "date": "2026-09-22", "source_url": "https://blogs.arista.com/blog/the-next-frontier-for-ai-fabrics-scale-across-networking"}, {"title": "Arista Discloses Actively Exploited CVSS 10.0 VeloCloud Orchestrator Flaw (CVE-2026-93952)", "summary": "Arista published Security Advisory 0183 for CVE-2026-93952, a CVSS 10.0 improper input validation flaw in on-prem VeloCloud Orchestrator that lets unauthenticated remote attackers reach privileged internal functions and potentially compromise the orchestrator and managed SD-WAN Edges. Fixes ship in VCO 5.2.3.16+ and 6.4.2.8+, and CISA added it to the KEV catalog the same day. The incident underscores customer sensitivity to control-plane exposure in network infrastructure and supports F5 conversations on hardened management planes for distributed edge and AI transport.", "type": "Security Advisory", "date": "2026-09-22", "source_url": "https://www.arista.com/en/support/advisories-notices/security-advisory/24765-security-advisory-0183"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "QuEra Computing Partners with HPE to Bring Fault-Tolerant Quantum Computing to On-Prem HPC", "summary": "QuEra Computing announced a collaboration with HPE to deliver fault-tolerant neutral-atom quantum systems into on-premises HPC environments built on the HPE Cray platform, letting national labs, HPC centers and enterprises run hybrid quantum-classical workloads locally. The move extends HPE's AI-factory story upward into accelerated scientific computing, where Juniper-derived fabrics supply the interconnect. For F5, it signals that HPE is bundling compute, storage and networking into turnkey stacks, making differentiated traffic management and secure data delivery the contested layer.", "type": "Partnership", "date": "2026-09-22", "source_url": "https://www.quera.com/press-releases/quera-computing-collaborates-with-hpe-to-bring-fault-tolerant-quantum-computing-to-on-premises-hpc-environments"}, {"title": "HPE Raises Quarterly Dividend 9.6% Amid AI Server Rally Following Juniper Close", "summary": "HPE lifted its quarterly dividend 9.6% to $0.1425 per share, its tenth consecutive annual increase, with shares rallying roughly 12% on broader AI server momentum. Coming after the Juniper Networks acquisition closed earlier in 2026, the raise signals management confidence in cash flow to fund integration while networking becomes a larger share of revenue. For F5, it means a well-capitalized combined HPE Juniper will keep investing aggressively in AI data center networking and bundled AI infrastructure deals.", "type": "Financial", "date": "2026-09-22", "source_url": "https://alphabetastock.com/hpe-stock-dividend-increase-ai-server-rally/"}, {"title": "HPE Networking Issues Advance Notification of September 22 Security Advisory", "summary": "HPE Networking published HPESBNW05136, an advance notification of a security advisory effective September 22, 2026, pre-alerting customers and channel partners to forthcoming fixes across HPE Networking products ahead of the formal bulletin. The cadence reflects the enlarged HPE Juniper Networking portfolio now carrying campus, data center and AI fabric duties. For F5 audiences, it is a reminder that competitors' infrastructure patch load is a live customer pain point worth addressing in secure-by-default AI data delivery positioning.", "type": "Security Advisory", "date": "2026-09-22", "source_url": "https://support.hpe.com/hpesc/public/docDisplay?docId=hpesbnw05136en_us&docLocale=en_US"}]}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware Threat Intelligence: Attackers Now Exploit Vulnerabilities Before CVEs Are Disclosed", "summary": "Radware VP of Cyber Threat Intelligence Pascal Geenens published data showing the \u201czero-day clock\u201d has gone negative: since July 2026 first exploits often appear before or at CVE publication, with a zero-day exploitation rate above 80%. Radware's H1 2026 data attributes 62.1% of web app and API attacks to vulnerability exploitation, with malicious app/API transactions up 104% and web DDoS up 110.6% year over year. Radware is using this telemetry to push virtual patching and always-on WAAP, the same urgency argument F5 makes for WAF and DDoS defenses.", "type": "Research", "date": "2026-09-22", "source_url": "https://www.cybersecurity-insiders.com/attackers-arent-waiting-for-vulnerabilities-to-be-disclosed/"}]}, "Barracuda Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Barracuda Launches AI Data Security for Governance of Generative AI Use", "summary": "Barracuda announced Barracuda AI Data Security, combining AI visibility, data protection, threat defense and governance on the BarracudaONE platform, with coverage of 1,300+ generative AI tools including Copilot, ChatGPT, Claude and Gemini. It targets 100\u20131,000-employee organizations and MSPs with multitenant management, prebuilt sensitive-data detection and audit-ready policy enforcement. Available October 2026 at no extra cost with SecureEdge Premium Access. The free-with-platform bundling pressures standalone AI guardrail pricing and pushes AI data governance into the midmarket, adjacent to F5's AI Guardrails and SurePath AI positioning.", "type": "Product Launch", "date": "2026-09-22", "source_url": "https://www.barracuda.com/company/news/2026/barracuda-ai-data-security-ai-governance"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-09-22.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
