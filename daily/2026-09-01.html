"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Acquires Console to Agentify Security", "summary": "Palo Alto Networks acquired Console, an AI-native platform bringing agentic capabilities to enterprise operations, and will fold it into Cortex. The deal lets security teams express goals in natural language while software investigates signals, prioritizes work, and remediates automatically at machine speed. Executives framed it as a shift toward autonomous, \"software-as-an-agent\" security operations; no price or integration timeline was disclosed.", "type": "Acquisition", "date": "2026-09-01", "source_url": "https://www.paloaltonetworks.com/company/press/2026/palo-alto-networks-acquires-console-to-agentify-security"}, {"title": "Palo Alto Networks Reports Fiscal Q4 and Full-Year 2026 Results", "summary": "Palo Alto Networks reported fiscal Q4 and full-year 2026 results for the period ended July 31, 2026, with quarterly Net New NGS ARR approaching $1 billion and NGS ARR reaching roughly $9.1 billion. Management credited Network & AI Security, Cortex, and its identity platform, and reiterated the FY30 target of $20 billion NGS ARR. CFO Dipak Golechha pointed to a 40% adjusted free cash flow margin goal for FY28.", "type": "Financial", "date": "2026-09-01", "source_url": "https://www.prnewswire.com/news-releases/palo-alto-networks-reports-fiscal-fourth-quarter-and-fiscal-year-2026-financial-results-302866744.html"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet: Defending Critical Infrastructure in the Age of Internet-Connected Facilities", "summary": "Fortinet published guidance on securing critical infrastructure and building-management environments as facilities become increasingly internet-connected. The piece argues OT and facility systems now carry the same exposure as IT networks, and calls for segmentation, continuous visibility, and converged IT/OT security operations built on the Fortinet Security Fabric. It positions Fortinet's OT portfolio against the growing attack surface created by connected industrial and facility assets.", "type": "Research", "date": "2026-09-01", "source_url": "https://www.fortinet.com/blog/operational-technology/defending-critical-infrastructure-in-the-age-of-internet-connected-facilities"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "China-Linked 'Fire Ant' Campaign Used Compromised Cisco Routers as Attack Platform", "summary": "Researchers disclosed that the China-linked \"Fire Ant\" campaign hijacked compromised Cisco routers and used them as covert infrastructure to persist, tamper with logs, and pivot into additional high-value targets. The activity overlaps with UNC3886 and follows earlier Salt Typhoon and Volt Typhoon operations against Cisco network devices. The findings reinforce that routers and edge network gear must be treated as first-class security assets requiring hardening and monitoring.", "type": "Research", "date": "2026-09-01", "source_url": "https://therecord.media/router-hacks-fire-ant-group-china"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike Launches SafeMind Cybersecurity Frontier Models, Built with NVIDIA", "summary": "At Fal.Con 2026, CrowdStrike unveiled SafeMind, a family of purpose-built cybersecurity frontier models running natively in the Falcon platform. Built with NVIDIA Nemotron and CoreWeave, SafeMind pairs an offensive model (Red Tempest) that probes attack paths against a digital twin with a defensive model (Blue Solano) that remediates findings in a closed loop. CrowdStrike claims 29% higher detection, six-times faster remediation, and up to 99% cost savings versus leading baselines.", "type": "Product Launch", "date": "2026-09-01", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-launches-frontier-models-for-cybersecurity-with-nvidia/"}, {"title": "CrowdStrike Unveils Falcon Guardian to Secure AI Agents at Runtime on the Endpoint", "summary": "CrowdStrike launched Falcon Guardian, an AI Detection and Response (AIDR) product that secures AI agents at runtime on the endpoint where they execute. The offering gives security teams visibility into agent activity and blocks prompt injection, data leakage, and malicious agent behavior without deploying a separate sensor. It extends the Falcon platform from endpoint and cloud protection into governing autonomous AI agents in enterprise environments.", "type": "Product Launch", "date": "2026-09-01", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-unveils-falcon-guardian-ai-agent-security/"}, {"title": "CrowdStrike Establishes Cyber Superintelligence Lab for Frontier AI Defense Research", "summary": "CrowdStrike announced the Cyber Superintelligence Lab, a research unit combining offensive research, incident response, and frontier AI work under Dr. Bartley Richardson. The lab produced the SafeMind models and introduces Project QuiltWorks, a program giving customers trusted access to standalone models and harnesses. The move signals CrowdStrike investing in in-house AI model development rather than relying solely on third-party foundation models for security outcomes.", "type": "Announcement", "date": "2026-09-01", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-establishes-cyber-superintelligence-lab/"}, {"title": "CrowdStrike Extends Falcon Platform Across Google Cloud's Enterprise AI Ecosystem", "summary": "CrowdStrike expanded its Google Cloud partnership, delivering Falcon Guardian through Google Agent Gateway to provide runtime protection for Google Cloud AI applications against prompt injection, data leakage, and malicious agent activity. Falcon MCP now integrates CrowdStrike threat intelligence into Gemini Enterprise, Charlotte AI, and Falcon Shield workflows, with governance tied to Google Cloud's Agent Registry. CrowdStrike is also building regional Falcon deployments on Google Cloud infrastructure.", "type": "Partnership", "date": "2026-09-01", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-extends-falcon-platform-across-google-cloud-enterprise-ai-ecosystem/"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "JFrog Traffic Controller Partners with Zscaler, Cloudflare and Netskope to Block Malicious Packages", "summary": "JFrog introduced its Software Supply Chain Traffic Controller with integrations into Zscaler, Cloudflare, and Netskope, routing all developer package requests through a single trusted path. The Zscaler integration lets enterprises enforce policy at the network edge so malicious or unapproved open-source packages are blocked before reaching build systems. The tie-up extends Zscaler's zero trust enforcement into the software supply chain and developer toolchain.", "type": "Partnership", "date": "2026-09-01", "source_url": "https://www.msp-channel.com/news/23582-jfrog-traffic-controller-partners-with-zscaler-cloudflare-and-netskope-to-block-malicious-packages"}]}, "Zscaler ~AI": {"category": "AI Security", "announcements": [{"title": "Zscaler: AI Agents Are the New Weakest Link", "summary": "Zscaler research and executive commentary argue that autonomous AI agents have become the enterprise's weakest security link, operating with broad permissions and minimal oversight. The company points to red-team findings that enterprise AI systems fail quickly under adversarial testing, and pushes zero trust controls \u2014 agent registries, AI access graphs, and runtime guardrails \u2014 as the answer. The message positions Zscaler's Zero Trust Exchange as the enforcement point for agentic AI traffic.", "type": "Research", "date": "2026-09-01", "source_url": "https://www.techzine.eu/blogs/security/143954/zscaler-ai-agents-are-the-new-weakest-link/"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Launches Security Hardening Assessment to De-Risk Enterprise AI Transformation", "summary": "Check Point introduced a Security Hardening Assessment service pairing automated validation across 50+ hardening controls with expert review to find configuration gaps and prioritize remediation by risk and business impact. It flags excessive permissions, weak access controls, data exposure, monitoring gaps, and configuration drift, and delivers compliance reporting for governance and audits. Check Point positions it as continuous risk management for organizations scaling AI adoption, bundled with threat intel, MDR, and professional services.", "type": "Product Launch", "date": "2026-09-01", "source_url": "https://www.itvoice.in/security-hardening-assessment-prepare-for-ai-transformation-without-increasing-risk"}, {"title": "Check Point: Security Must Follow the Workspace as the Inbox Disappears", "summary": "Check Point published a workspace security perspective arguing that email-centric defenses no longer match how work happens, as collaboration shifts across SaaS apps, chat, and browser-based workflows. The post ties recent campaign data \u2014 including a large-scale debt-relief phishing operation targeting 9,000+ organizations \u2014 to the case for post-delivery protection and unified workspace security rather than gateway-only email filtering.", "type": "Announcement", "date": "2026-09-01", "source_url": "https://blog.checkpoint.com/securing-user-and-access/the-inbox-is-disappearing-why-security-must-follow-the-workspace/"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare D1 Begins Enforcing Free Tier Daily Query Limits", "summary": "Cloudflare began enforcing daily free-tier limits on D1 queries for the Workers Free plan. Once daily row read or write limits are exceeded, queries fail with errors returned through the Workers Binding API and REST API until limits reset at midnight UTC, with email alerts sent to affected users. Stored data is unaffected; Cloudflare advises adding indexes, reducing full-table scans, or upgrading to a paid plan.", "type": "Announcement", "date": "2026-09-01", "source_url": "https://developers.cloudflare.com/changelog/post/2026-09-01-d1-free-tier-limit-enforcement/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare AI Gateway Consolidates Usage Invoices and Standardizes Model Names", "summary": "Cloudflare changed AI Gateway billing so monthly usage invoices show a single total cost per model instead of separate input- and output-token line items, and standardized model naming to a provider/model format. The change applies to usage invoices, not AI Gateway credit purchases. It simplifies cost attribution for teams routing multi-provider LLM traffic through Cloudflare's AI gateway.", "type": "Announcement", "date": "2026-09-01", "source_url": "https://developers.cloudflare.com/changelog/post/2026-09-01-billing-and-model-names/"}]}, "Cloudflare ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Cloudflare Details Cache Transcoding to Save Petabytes of CDN Cache Storage", "summary": "Cloudflare detailed Cache Transcoding, an experiment that re-encodes eligible cached assets with Zstandard before writing them to disk on its Pingora-based cache tier. Assets stay compressed in storage and across Tiered Cache transfers, decoding only when served to clients. In testing, on-disk size fell to roughly one third of original, unlocking petabytes of additional effective cache capacity and cutting cross-data-center bandwidth within existing CPU budgets.", "type": "Announcement", "date": "2026-09-01", "source_url": "https://blog.cloudflare.com/cache-transcoding/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "Amazon Quick Reaches GA for Building Custom Apps with Natural Language", "summary": "AWS announced general availability of Amazon Quick, which lets users build live custom applications \u2014 project trackers, dashboards, training portals \u2014 by describing them in natural language with no coding. Generated apps auto-connect to real-time data through direct integrations with systems including Salesforce, Jira, and Asana. The launch extends AWS's push to put agentic, business-user-facing app creation directly on its platform.", "type": "Product Launch", "date": "2026-09-01", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-quick-custom-apps-natural-language/"}, {"title": "AWS Confirms First Saudi Arabia Cloud Region for December 2026 Launch", "summary": "Speaking at the LEAP technology conference in Riyadh, AWS confirmed its first Saudi Arabia cloud region will launch by December 2026. AWS also expanded its collaboration with PIF-backed HUMAIN to deliver 50 MW of computing capacity in a Saudi AI Zone by 2028, using AWS Trainium chips and NVIDIA AI systems for AI training and inference. The region targets local data residency and sovereign AI workloads.", "type": "Announcement", "date": "2026-09-01", "source_url": "https://w.media/aws-saudi-arabia-cloud-region-set-for-december-2026-launch/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Anthropic's Claude Fable 5.1 Frontier Model Now Generally Available on AWS", "summary": "AWS made Anthropic's Claude Fable 5.1 generally available through Amazon Bedrock and the Claude Platform on AWS. The model improves reasoning on hard coding, scientific research, and enterprise workflow tasks, and can sustain long-running projects across codebases and sessions. Fable 5.1 is designated a Covered Model with enhanced data retention and safety controls, and enterprises can use Enterprise Frontier Safeguards to keep data inside their own cloud environment.", "type": "Product Launch", "date": "2026-09-01", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/claude-fable-5-1-aws/"}, {"title": "Amazon EC2 R9g and R9gd Instances Powered by AWS Graviton5 Now Generally Available", "summary": "AWS made memory-optimized EC2 R9g and R9gd instances powered by Graviton5 generally available. The instances deliver up to 25% better compute performance than Graviton4-based R8g, with AWS citing up to 30% faster database workloads and 35% faster web and machine learning workloads, a 5x larger cache, and the fastest cloud memory in its fleet. AWS describes Graviton5 as its most energy-efficient processor to date.", "type": "Product Launch", "date": "2026-09-01", "source_url": "https://www.hpcwire.com/bigdatawire/this-just-in/amazon-ec2-r9g-and-r9gd-instances-powered-by-aws-graviton5-now-generally-available/"}]}, "Akamai ~P": {"category": "Platforms", "announcements": [{"title": "Akamai Passes US$1B APJ Revenue Milestone and Names New Regional Sales Leadership", "summary": "Akamai disclosed that APJ revenue surpassed US$1 billion, appointing Sean Li as SVP Regional Sales and Managing Director for APJ and Fiona Zhang as Regional VP of Channel Sales and Programmes. Akamai framed the milestone against rising AI-driven risk from \"vibe coding\" and shadow AI \u2014 unvetted code, misconfigurations, and shadow APIs bypassing perimeter defenses \u2014 and pointed to continued investment in zero trust, edge security, and enterprise browser security.", "type": "Announcement", "date": "2026-09-01", "source_url": "https://itwire.com/business-it-news/security/akamai-charts-us-1b-apj-milestone-as-vibe-coding-and-shadow-ai-supercharge-cyberthreats"}, {"title": "Piper Sandler Upgrades Akamai to Overweight on Compute Demand, Cuts Target to $125", "summary": "Piper Sandler raised Akamai Technologies to Overweight from Neutral, citing rising demand in Akamai's compute business that is driving increased capital expenditure. The firm lowered its price target to $125 from $140, still implying roughly 15% upside from the prior close. The call reflects analyst confidence that Akamai's shift from content delivery toward compute and security is gaining traction, even as spending rises.", "type": "Financial", "date": "2026-09-01", "source_url": "https://www.marketscreener.com/news/piper-sandler-upgrades-akamai-technologies-to-overweight-from-neutral-adjusts-pt-to-125-from-140-ce7858dddf8ef321"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Fastly Names Ingram Micro Its First Distributor in Singapore", "summary": "Fastly signed Ingram Micro as its first distributor in Singapore, using Ingram's reseller and system-integrator network to reach local enterprises with Fastly's programmable edge cloud platform for modernizing websites, applications, and APIs. The agreement includes partner training, enablement, and go-to-market support, and Fastly signaled plans to add distributors across Thailand, Indonesia, and Malaysia. Executives tied the move to AI-era digital modernization and AI monetization initiatives.", "type": "Partnership", "date": "2026-09-01", "source_url": "https://www.crnasia.com/news/2026/distributor/ingram-micro-is-fastly-s-first-distributor-in-singapore"}]}, "Lasso Security": {"category": "AI Security", "announcements": [{"title": "NEWORDER Brings Lasso Security's Agentic AI Protection to South Africa", "summary": "Lasso Security named Pretoria-based cybersecurity firm NEWORDER as its official South Africa partner, giving local enterprises in-country access to its agentic AI security platform under a single contract and deployment team. The platform sits between an organization's AI agents and its business systems, discovering registered and unregistered agents, verifying each instruction before execution, and blocking unsafe actions. NEWORDER will also run continuous adversarial testing of client AI agents.", "type": "Partnership", "date": "2026-09-01", "source_url": "https://techcentral.co.za/neworder-lasso-security-ai-agent-controls/285558/"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Citrix Acquires Numecent to Broaden Windows Application Management and Delivery", "summary": "Citrix, part of Cloud Software Group, completed its acquisition of Numecent, maker of Cloudpaging and Cloudpager. Cloudpaging packages Windows applications into isolated containers that run independently of the underlying OS and stream to endpoints on demand, while Cloudpager provides cloud-based provisioning, updating, rollback, and metering across physical and virtual Windows endpoints. Citrix plans deeper integration with Citrix DaaS, extending application delivery beyond virtual desktops to physical Windows devices.", "type": "Acquisition", "date": "2026-09-01", "source_url": "https://www.citrix.com/news/announcements/sep-2026/citrix-acquires-numecent-to-simplify-and-broaden-application-management-and-delivery-capabilities-across-windows-environments.html"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Research: Education Sector Faces 1,200 Phishing Emails Per Institution Per Day", "summary": "Barracuda published research showing education institutions receive roughly 1,200 phishing emails daily, based on 58.8 million phishing emails observed across 536 institutions over three months. Email initiated 38% of ransomware incidents and 27% of account takeovers in the sector, both above global averages, while only 34% of education respondents could reliably detect and block phishing. Barracuda positions AI-powered security as the fix for slow detection and response.", "type": "Research", "date": "2026-09-01", "source_url": "https://blog.barracuda.com/2026/09/01/education-cybersecurity-phishing-ransomware-account-takeover"}, {"title": "Barracuda Named Official Partner of Airspeeder Team Australia for Inaugural Series", "summary": "Barracuda announced it will serve as Official Partner of Airspeeder Team Australia for the inaugural Airspeeder International Series, the first AI-powered electric flying car (eVTOL) racing championship. Barracuda branding will appear on the Team Australia Mk3C speeder and uniforms throughout the 2026 season, and the company will host customers and partners at race events and team facilities. The series opens in Adelaide in November 2026.", "type": "Partnership", "date": "2026-09-01", "source_url": "https://chiefit.me/barracuda-named-partner-of-airspeeder-team-australia-for-inaugural-racing-series/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": []}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Radware": {"category": "Application Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-09-01.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
</html>
