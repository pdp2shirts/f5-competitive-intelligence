"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Cortex Cloud Adds Agentless File Integrity Monitoring", "summary": "Palo Alto Networks added agentless File Integrity Monitoring (FIM) to Cortex Cloud alongside its existing agent-based FIM. Agentless FIM scans VM disk snapshots during normal scan cycles and logs created, modified, and deleted files plus permission and ownership changes. That extends coverage to legacy images and locked-down appliances where agents can't run, and supports at-least-weekly PCI DSS 11.5.2 change detection. Palo Alto positions agent-based FIM for real-time detection and blocking, and recommends running both together for full cloud-VM coverage.", "type": "Product Launch", "date": "2026-11-24", "source_url": "https://www.paloaltonetworks.com/blog/cloud-security/agentless-file-integrity-monitoring/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Attackers Target Industrial Refrigeration and Cold Chain Systems", "summary": "Fortinet details attacks on internet-exposed industrial refrigeration controllers (Danfoss AK-SM/AK-SC, Copeland/Dixell XWEB). About 700 French retail sites were hit in October 2026, and a second wave in November reached at least 11 more countries. Attackers used weak passwords and legitimate controller functions to change temperature setpoints, defrost cycles, and alarm thresholds, causing spoilage and at least 15 fires. Fortinet recommends removing direct internet access, segmenting OT from IT, and routing vendor remote access through MFA-protected managed access.", "type": "Research", "date": "2026-11-24", "source_url": "https://www.fortinet.com/blog/industry-trends/attackers-target-industrial-refrigeration-and-cold-chain-systems"}, {"title": "Fortinet Brings 'Security for Every Industry' to GITEX Global 2026", "summary": "Fortinet announced its GITEX Global 2026 presence in Dubai (Hall 5, Booth D20) under a 'Security for Every Industry' theme. The booth has six industry zones: retail, education, healthcare, financial services, government, and telecom. Demos cover AI-driven security, OT security, and incident response across the full Fortinet platform (secure networking, SecOps, SASE, Zero Trust, cloud security, data protection). Regional partners including Help AG, Alpha Data, and Nozomi will also show Fortinet technology, and Fortinet plans on-site customer and partner announcements.", "type": "Event", "date": "2026-11-24", "source_url": "https://www.intelligentciso.com/2026/11/24/fortinet-brings-security-for-every-industry-to-gitex-global-2026/"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Unveils Intelligent Workplace Experience and Workplace Designer Beta", "summary": "Cisco outlined its Intelligent Workplace Experience, which ties together collaboration, secure connectivity, and workplace intelligence, with Cisco as customer zero. Cisco says its own offices have cut their real estate footprint by 16% and saved $100M since 2022. It also introduced Cisco Workplace Designer, a planning tool for aligning goals, spaces, AI-powered wireless networking, and collaboration device requirements, with a beta starting November 30, 2026. IDC named Cisco a Leader in AI-enabled smart conference room hardware.", "type": "Product Launch", "date": "2026-11-24", "source_url": "https://blogs.cisco.com/networking/the-intelligent-workplace-is-taking-shape-were-building-it-ourselves"}, {"title": "Cisco to Participate in December Events with the Financial Community", "summary": "Cisco announced its executives will appear at several December investor events: the UBS Global Technology and AI Conference (Dec 1), the Nasdaq Investor Conference in London (Dec 8), the Wells Fargo TMT Summit (Dec 8), and the Barclays Global Technology Conference (Dec 9), among others. Leaders including Mark Patterson will hold fireside chats. Separately, Cisco set its 2026 virtual annual stockholder meeting for December 15.", "type": "Financial", "date": "2026-11-24", "source_url": "https://newsroom.cisco.com/c/r/newsroom/en/us/a/y2026/m11/cisco-to-participate-in-december-events-with-the-financial-community.html"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Signal Reprioritizes Falcon Automated Leads", "summary": "CrowdStrike updated Automated Leads, powered by CrowdStrike Signal in the Falcon platform, with a new prioritization layer. Leads are now ranked by how unusual the host activity is and by how closely it resembles real intrusions. CrowdStrike reports up to 70% less lead volume, with hunter-confirmed malicious activity surfacing more often at Moderate and Cautious sensitivity. The system catches malicious endpoint activity whether a human, malware, or an AI agent issued the commands, and it complements Falcon Guardian for agent discovery and control.", "type": "Product Launch", "date": "2026-11-24", "source_url": "https://www.crowdstrike.com/en-us/blog/reprioritizing-automated-leads-crowdstrike-signal/"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler Ships November 2026 GovCloud Updates, Including Client Connector 5.0 and New Exploit Detections", "summary": "Zscaler's November GovCloud roundup adds Real User Monitoring on FedRAMP High, Client Connector 5.0 for iOS (TLS 1.3, native IPv6, disaster recovery for Private Access) and tighter VM credential permissions. New ThreatParse rules detect exploits for Citrix NetScaler and Atlassian flaws, and new deception datasets now emulate Cisco Firepower, Cisco IOS XE and F5 BIG-IP. Zscaler keeps building out its federal SSE footprint, and it's now explicitly modeling F5 BIG-IP in its deception tooling.", "type": "Product Launch", "date": "2026-11-24", "source_url": "https://www.zscaler.com/blogs/product-insights/what-s-new-govcloud-november-2026-zscaler-product-updates"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "AI-Assisted Campaign Compromises Check Point Security Management Servers at 22 Organizations", "summary": "GreyNoise and press reports say attackers compromised about two dozen Check Point Security Management servers across 22 organizations in 17 countries. They got in through the SmartConsole authentication bypass CVE-2026-16232. Once inside, they stole firewall databases, credentials and CA files, created certificates and unloaded security policies to switch protections off. Check Point confirmed the CVE was being exploited. Researchers suspect the attackers used an AI-powered offensive tool, though that isn't confirmed.", "type": "Research", "date": "2026-11-24", "source_url": "https://www.bleepingcomputer.com/news/security/hackers-compromise-check-point-servers-in-22-organizations/"}, {"title": "Check Point Research Exposes Volant Manticore, a New Iran-Nexus Espionage Group", "summary": "Check Point Research describes Volant Manticore, an Iran-linked group tied to MOIS that is probably made up of former MuddyWater operators. It has targeted telecoms, airlines and critical infrastructure in Cyprus and, since September 2026, Saudi healthcare organizations. Its tools include KuboShell, a new backdoor that takes commands over IPFS, plus the Homa Framework and legitimate RMM tools such as NetLock and MeshCentral. Some phishing lures use AI-generated CV personas.", "type": "Research", "date": "2026-11-24", "source_url": "https://research.checkpoint.com/2026/volant-manticore-flying-under-the-radar/"}]}, "Cloudflare": {"category": "Platforms", "announcements": []}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Network Firewall Introduces Automated Internet Firewall Mode (Preview)", "summary": "The new mode inspects inbound and outbound traffic at each VPC's internet gateway, so traffic no longer has to be routed through a central firewall endpoint. It includes built-in NAT, up to 100 Gbps per Availability Zone, and per-subnet connectivity policies (Flexible, Bidirectional, Outbound-only, Excluded). Customers start from an AWS managed baseline rule template, and policies can extend automatically to new VPCs. AWS is turning native perimeter security into a default that takes almost no configuration.", "type": "Product Launch", "date": "2026-11-24", "source_url": "https://aws.amazon.com/blogs/security/aws-network-firewall-introduces-automated-internet-firewall-mode-preview/"}, {"title": "AWS Details Context-Aware Rules for Network Firewall", "summary": "AWS Network Firewall can now match traffic by AWS resource (VPC, subnet, security group, Transit Gateway attachment) instead of IP address. That keeps rules in sync as workloads scale or move. Transit Gateway tags each packet with sender context, which maps back to a context store in AWS Network Manager. The feature requires Transit Gateway-attached firewalls and costs nothing extra.", "type": "Product Launch", "date": "2026-11-24", "source_url": "https://aws.amazon.com/blogs/security/introducing-context-aware-rules-for-aws-network-firewall/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": [{"title": "HiddenLayer Launches Policy-Based Security Hooks for Claude Code Agents", "summary": "HiddenLayer introduced an on-device plug-in that hooks Anthropic's Claude Code agent loop, checking prompt submissions, pre-tool calls and tool outputs against a single project policy with NONE, DETECT, REDACT or BLOCK decisions. It evaluates whole sessions to catch multi-step exfiltration and abuse, ships five prompt-injection detections at launch (e.g., Coerced Data Exfiltration, Coerced Secret Read), deploys via MDM, and logs all activity in the HiddenLayer Console. It extends HiddenLayer's agent-harness runtime security after its Cursor integration earlier in November.", "type": "Product Launch", "date": "2026-11-24", "source_url": "https://www.hiddenlayer.com/insight/how-hiddenlayer-secures-claude-code"}]}, "Lasso Security": {"category": "AI Security", "announcements": [{"title": "Lasso Security Joins Linux Foundation's Open Secure AI Alliance", "summary": "Lasso Security announced it has joined the Open Secure AI Alliance, a Linux Foundation initiative with more than 100 member organizations including NVIDIA, Microsoft and Cloudflare. Lasso will contribute its expertise in securing AI agents at runtime and collaborate on agent security, runtime controls and AI vulnerability disclosure. No commercial terms or product changes were disclosed.", "type": "Partnership", "date": "2026-11-24", "source_url": "https://mandos.io/data/news/lasso-security-lasso-has-joined-the-open-secure-ai-alliance"}]}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": []}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Shares Drop ~6% Amid AI Infrastructure Selloff and Customer Concentration Concerns", "summary": "Arista Networks stock fell 6.27% on Nov 24, 2026, as AI infrastructure stocks weakened broadly and institutions took profits. Investors flagged that Microsoft and Meta together make up about 42% of revenue, along with uncertainty about the pace of hyperscaler capex. Other concerns included competition in next-generation AI networking fabrics and about $11.4B in component purchase commitments for AI networking chips and optics.", "type": "Financial", "date": "2026-11-24", "source_url": "https://www.tradingkey.com/news/market-movers/262320519-market-movers-anet-20261124"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Sunway Group Selects HPE Private Cloud AI for Sovereign Enterprise-Wide AI", "summary": "Malaysia's Sunway Group picked HPE Private Cloud AI, co-developed with NVIDIA, as a sovereign, multi-tenant AI backbone that keeps data inside Sunway's own environment. The turnkey stack pairs HPE infrastructure with NVIDIA accelerated computing and NVIDIA AI Enterprise. It will support AI agents and LLMs across real estate, construction, education, healthcare, retail and hospitality. HPE Services will provide consulting, AI engineering, training and enablement.", "type": "Partnership", "date": "2026-11-24", "source_url": "https://www.hpe.com/us/en/newsroom/press-release/2026/11/sunway-group-accelerates-secure-and-sovereign-enterprise-wide-artificial-intelligence-with-hpe.html"}, {"title": "HPE Networking Surges Post-Juniper With Record $1.2B AI Networking Orders; Stock Falls on Margin Worries", "summary": "After its Q4 FY26 results, HPE said networking revenue grew 12% to $3.1B and networking orders rose 56%. Orders for networks for AI hit a record $1.2B, helped by AMD Helios racks built with Juniper QFX switching trays and a multi-year Oracle OCI rollout of PTX/MX routers and QFX/EX switches. HPE expects networking to exceed 40% of group operating profit by Q4 FY27. Shares fell about 12% on Nov 24 after a warning that AI-server mix and supply constraints will pressure margins.", "type": "Financial", "date": "2026-11-24", "source_url": "https://www.thestack.technology/hpe-sees-networking-bonanza-thanks-amd-oracle-for-the-good-times-markets-sweat-the-margins/"}]}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware Discloses Cloud WAF Breach Exposing Customer Cloud Access Keys", "summary": "Radware disclosed that an unauthorized party accessed an internal, publicly reachable Cloud WAF management API without authentication on November 19. The exposure potentially included customer contact details and, for a subset of customers, credentials used to export logs to AWS S3, Azure Blob Storage or SFTP. Radware blocked the attacker, rotated internal credentials, and told affected WAF/bot customers to rotate log-export credentials and review storage access logs. It says traffic inspection, certificates, application traffic and cloud DDoS services were not affected.", "type": "Other", "date": "2026-11-24", "source_url": "https://www.bleepingcomputer.com/news/security/radware-discloses-breach-exposing-customer-cloud-access-keys/"}, {"title": "Radware Research: BOPLA API Business Logic Attack on Tier-1 Bank Lending Workflow", "summary": "Radware published a case study of an API business-logic attack at a tier-1 bank, where an attacker used a valid Bearer token to call lending and insurance workflow actions out of sequence and with unexpected parameters. Radware says its API Business Logic Protection detected the high-severity BOPLA (Broken Object Property Level Authorization) attack by correlating parameters, call sequence and actor history. The takeaway it pushes: legitimate-looking requests can still break application rules when the user journey context is wrong.", "type": "Research", "date": "2026-11-24", "source_url": "https://www.radware.com/blog/bopla-attack-tier-1-bank-lending-workflow/"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}, "Barracuda Networks ~P": {"category": "Platforms", "announcements": [{"title": "Barracuda Updates Managed XDR Integration Credentials Incident Investigation", "summary": "Barracuda posted a November 24 update to its Trust Center advisory on the November 2026 incident affecting Barracuda Managed XDR. The investigation says impact is limited to API integration credentials for Managed XDR Cloud/Monitored Endpoint integrations, traced to a cloud access key exposed in a third-party GitHub configuration file. Barracuda found no evidence of customer data exposure beyond those credentials. Notified customers should revoke and recreate MXDR integration credentials; customers not using MXDR need to do nothing.", "type": "Other", "date": "2026-11-24", "source_url": "https://trust.barracuda.com/security/barracuda-xdr-integration-credentials"}]}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Akamai Brings Visa Trusted Agent Protocol Verification to Bot & Agent Control for Agentic Commerce", "summary": "Akamai is working with Visa to bring Trusted Agent Protocol (TAP) verification to its edge security. Visa TAP-enabled AI shopping agents now show up in Akamai's bot directory, so merchants can tell legitimate agents apart from impersonators. Agents sign their requests, Akamai checks the signatures at the edge, and merchant policies decide whether an agent can only browse or can also check out and change accounts. Origin infrastructure doesn't need to change. Akamai says it sees 2.2 billion AI bot requests a day across its commerce customers.", "type": "Partnership", "date": "2026-11-24", "source_url": "https://www.akamai.com/blog/security/make-holiday-shopping-agent-ready-visa-tap"}, {"title": "Akamai Security Research Discloses Critical Kyverno Namespace Isolation Bypass (CVSS 10.0)", "summary": "Akamai Security Research disclosed a critical Kyverno vulnerability (GHSA-pcx2-xcq4-65vf, CVSS 10.0). A URL parser differential in the apiCall feature lets a restricted tenant reach cluster-scoped resources or other namespaces. Validation relied on path.Clean(), so a crafted query string could slip past the namespace checks, opening the door to unauthorized data access and privilege escalation across namespaces. The fix is Kyverno 1.19.2 or later. Akamai recommends real URL parsing over file-system path utilities.", "type": "Research", "date": "2026-11-24", "source_url": "https://www.akamai.com/blog/security-research/url-parser-differential-broke-kyvernos-namespace-isolation"}]}, "Akamai ~AI": {"category": "AI Security", "announcements": [{"title": "Akamai: AI Assistants Must Separate Relevance From Authorization", "summary": "An Akamai AI blog post argues that enterprise AI assistants can surface results that are semantically relevant but that the user isn't allowed to see. It says a deterministic, policy-driven authorization layer has to filter results before answers are shown. The example is Miranda, a visual search system over 289,222 images. It splits the work four ways: an LLM handles the request, embeddings rank by similarity, authoritative metadata carries classifications, and a deterministic layer applies the access rules. The core message is that similarity is not permission.", "type": "Research", "date": "2026-11-24", "source_url": "https://www.akamai.com/blog/ai/2026/nov/ai-assistant-relevant-allowed-miranda-learns-say-no"}]}, "Akamai ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Akamai Turns Away Some AI Infrastructure Deals as Power Shortages Meet $14B Deal Surge", "summary": "Akamai said it is turning away some large AI infrastructure opportunities because power is scarce, even though it has signed about $14B in large multi-year cloud commitments this year. Management expects power availability to improve in the second half of 2028 and into 2029. Some project revenue has been delayed by data-center build-outs, and recent capex is funded by a $2.5B convertible note offering. Akamai also pointed to rising CPU demand alongside GPUs for edge and latency-sensitive inference.", "type": "Financial", "date": "2026-11-24", "source_url": "https://www.themarketsdaily.com/2026/11/24/akamai-technologies-turns-away-ai-business-as-power-shortage-meets-14-billion-deal-surge.html"}]}, "HPE / Juniper Networks ~P": {"category": "Platforms", "announcements": [{"title": "HPE CEO Says Juniper Circuit-to-Packet Device in FAA Outage Worked 'As Configured'", "summary": "HPE CEO Antonio Neri said the device tied to the FAA network outage was an HPE Juniper Circuit to Packet (CTP) platform, not a router. He said it operated as configured, with a multicast feature enabled that the use case didn't need. Installer L3Harris is replacing legacy Cisco gear with Juniper hardware as part of the FAA upgrade. The FAA has paused new installations and disabled multicast on about 60 similar devices while the investigation continues.", "type": "Other", "date": "2026-11-24", "source_url": "https://www.sdxcentral.com/news/hpe-ceo-clarifies-faa-smoking-gun-not-router-in-latest-twist-to-aviation-outage-saga/"}]}, "Fortinet ~AS": {"category": "Application Security", "announcements": [{"title": "FortiGuard Labs Holiday Threats Report: 4,400+ Malicious Domains Target Shoppers", "summary": "FortiGuard Labs' 2026 Holiday Season Cyber Threats Report analyzed more than 24,000 newly registered holiday domains and classified over 4,400 as malicious, many of them using delivery and shipping lures. It also tracked about 1.72 million infostealer logs tied to major e-commerce platforms from August to October, underground sales of stolen retail sessions, and access to 1,000+ compromised OpenCart storefronts for payment skimming. Fortinet tells retailers to patch storefronts, monitor checkout scripts, revoke compromised sessions, and watch for brand impersonation.", "type": "Research", "date": "2026-11-24", "source_url": "https://www.fortinet.com/blog/threat-research/fake-delivery-notices-stolen-logins-and-malicious-domains-threaten-holiday-shoppers"}]}, "Fortinet ~AI": {"category": "AI Security", "announcements": [{"title": "Fortinet AI Cybersecurity Summit 2026 in Seoul Warns of Attacks on AI Agents", "summary": "At Fortinet Korea's AI Cybersecurity Summit 2026 in Seoul on November 24, Fortinet CISO Daniel Kwong warned that threats to AI agents will grow as they work on their own. He cited agents executing malicious instructions that leak customer data, attacks on AI memory and vector databases, and manipulation of AI-driven security operations. Fortinet pitched its AI-native Security Fabric as a way to unify AI decisions across firewall, email, and endpoint, with AWS and Dell also presenting.", "type": "Event", "date": "2026-11-24", "source_url": "https://news.sbs.co.kr/english/article.do?news_id=N1008861650"}]}, "Cloudflare ~AI": {"category": "AI Security", "announcements": [{"title": "Cloudflare Updates Prompt Logging for AI Security for Apps", "summary": "Customers can now log LLM prompts by turning on payload logging and writing WAF custom rules that reference cf.llm.prompt fields. When a rule matches, the extracted prompt is logged, or the full request body if no prompt can be extracted. This replaces the old AI Security Log Mode Ruleset. It pulls AI prompt inspection further into Cloudflare's standard WAF rules engine.", "type": "Product Launch", "date": "2026-11-24", "source_url": "https://developers.cloudflare.com/changelog/post/2026-11-24-ai-security-prompt-logging/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare Issues Emergency WAF Release Adding Blocking Detections to Free Ruleset", "summary": "Cloudflare pushed an emergency WAF update that adds two new detections to the Cloudflare Free Ruleset, both set to Block: 'Anomaly - Embedded Application Request' and 'Generic Rules - Authentication Bypass.' It follows a run of fast-response WAF rules for recent critical flaws (ruby2shell, PHP flaws, Java4Shell). Cloudflare keeps using free-tier protection to stress how fast it ships WAF rules.", "type": "Product Launch", "date": "2026-11-24", "source_url": "https://developers.cloudflare.com/changelog/post/2026-11-24-emergency-waf-release/"}]}, "Cloudflare ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Cloudflare Polish Adds Automatic AVIF Image Conversion", "summary": "Cloudflare's Polish image optimization can now automatically convert JPEG and PNG images from the origin to AVIF, alongside the existing WebP conversion. Polish picks the best format based on browser support, which cuts file sizes and load times for image-heavy sites. It can be turned on from the dashboard, the CLI or the REST API.", "type": "Product Launch", "date": "2026-11-24", "source_url": "https://developers.cloudflare.com/changelog/post/2026-11-24-avif-in-polish/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare Positions Itself as Infrastructure for AI-Driven Commerce at RBC Capital Markets Conference", "summary": "At an RBC Capital Markets tech conference, Cloudflare pitched its network as the secure, low-latency backbone for AI-enabled and agentic transactions in retail, finance and healthcare. It put its networking, zero trust and content delivery front and center, along with operational discipline and cost efficiency, to appeal to investors interested in AI infrastructure.", "type": "Event", "date": "2026-11-24", "source_url": "https://aktiensensor.com/articles/cloudflare-strengthens-aidriven-commerce-by-boosting-secure-highperformance-networking/"}]}, "AWS ~AI": {"category": "AI Security", "announcements": [{"title": "Amazon Bedrock Launches Trusted Access API with Anthropic Enterprise Frontier Safeguards", "summary": "Bedrock's new Trusted Access Program API gives customers one place to discover, request and enroll in model-provider programs, with IAM and SCP controls at the account, organization or project level. The first offerings are Anthropic's Enterprise Frontier Safeguards and Enterprise Data Controls for frontier Claude models. Both add automated safety monitoring and Safety Case reviews while customer data stays under customer control. Both are in public preview.", "type": "Product Launch", "date": "2026-11-24", "source_url": "https://aws.amazon.com/blogs/machine-learning/introducing-the-amazon-bedrock-trusted-access-api-with-anthropics-enterprise-frontier-safeguards-and-enterprise-data-controls/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "AWS Pre-re:Invent Roundup: GPU Inference on Lambda Managed Instances and New Bogot\u00e1 Local Zone with ALB", "summary": "AWS's Nov 24 weekly roundup covers GPU-accelerated inference on Lambda Managed Instances (G4dn through G6e, container-based, no GPU drivers to manage) and 30-minute Lambda timeouts. It also announces a Bogot\u00e1 Local Zone with Application Load Balancer and Direct Connect for single-digit-millisecond latency, plus STS GetScopedCredentials for narrowing permissions at runtime. Together these broaden serverless AI inference and edge delivery ahead of re:Invent.", "type": "Product Launch", "date": "2026-11-24", "source_url": "https://aws.amazon.com/blogs/aws/aws-weekly-roundup-local-zone-in-bogota-30-minute-lambda-timeout-and-more-november-24-2026/"}]}};

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';

    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
