ions rather than production attacks. Only twelve samples appeared in Cortex XDR production telemetry and fewer still reached customer environments. The report tracks the shift from AI brand abuse toward genuine agentic execution, giving defenders a calibrated view of real versus hyped AI malware risk.", "type": "Research", "date": "2026-08-25", "source_url": "https://unit42.paloaltonetworks.com/ai-enabled-malware-analysis/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Expands FortiEndpoint with New Capabilities for the AI Era", "summary": "Fortinet announced FortiEndpoint enhancements that add AI visibility and governance, native data security and DLP, endpoint risk scoring, and FortiAI-assisted operations to its unified endpoint platform. Fortinet is pitching a single agent, console, and license that consolidates endpoint security, secure access, data security, AI governance, and operations, with adaptive zero-trust access decisions driven by continuous endpoint risk scoring. Availability is expected in Q3 2026.", "type": "Product Launch", "date": "2026-08-25", "source_url": "https://www.fortinet.com/corporate/about-us/newsroom/press-releases/2026/fortinet-expands-fortiendpoint-with-new-capabilities-for-the-ai-era"}, {"title": "Cantor Fitzgerald Reiterates Neutral on Fortinet Following Virtue AI Acquisition", "summary": "Cantor Fitzgerald reiterated a Neutral rating and $185 price target on Fortinet after its August 2026 acquisition of Virtue AI, an enterprise AI security platform for automated red teaming and AI governance. Fortinet characterized the deal as financially immaterial; Virtue AI had raised roughly $30 million in 2025. Analysts cited strong revenue and billings growth alongside a valuation that already reflects the AI security expansion.", "type": "Report", "date": "2026-08-24", "source_url": "https://uk.investing.com/news/stock-market-news/cantor-fitzgerald-reiterates-neutral-rating-on-fortinet-stock-93CH-4844504"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Launches Sovereign Critical Infrastructure in Canada", "summary": "Cisco launched Sovereign Critical Infrastructure in Canada, giving government, financial services, healthcare, and other critical infrastructure operators more control over where and how their technology runs. The offering is configurable for on-premises and fully air-gapped deployments inside customer facilities with no external internet connection, and spans Cisco's core networking and security product portfolio. It extends Cisco's digital sovereignty push into a second major national market.", "type": "Product Launch", "date": "2026-08-25", "source_url": "https://newsroom.cisco.com/c/r/newsroom/en/us/a/y2026/m08/cisco-launches-sovereign-critical-infrastructure-in-canada-government-and-organizations-gain-more-choice-and-control.html"}, {"title": "Cisco Cloud Control Reaches General Availability for U.S. Customers", "summary": "Cisco announced that Cisco Cloud Control is now generally available to U.S. customers, opening self-service onboarding after a controlled pre-GA period. More than 300 customers have already onboarded and the global pre-GA waitlist exceeded 5,000 sign-ups. Cloud Control is Cisco's unified cloud-delivered IT operations control plane, and GA marks the start of broad commercial availability.", "type": "Product Launch", "date": "2026-08-25", "source_url": "https://blogs.cisco.com/ai/cisco-cloud-control-us-general-availability"}, {"title": "Cisco and Teleport Partner to Bring Infrastructure Identity to Agentic IT", "summary": "Cisco announced a strategic partnership with Teleport, becoming its largest strategic investor, to embed identity-native infrastructure access across Cisco's portfolio. The model replaces long-lived credentials and secret vaults with short-lived cryptographic identity and action-based authorization, brokered and session-recorded by Teleport with Cisco supplying network and infrastructure context. The first use case is privileged access for network and infrastructure admins, with a stated path to autonomous agents and physical AI.", "type": "Partnership", "date": "2026-08-25", "source_url": "https://www.networkworld.com/article/4213281/cisco-taps-teleport-for-infrastructure-identity-management-tech.html"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cisco Expands Secure AI Factory with NVIDIA for the Rack-Scale Era", "summary": "Cisco expanded its Secure AI Factory with NVIDIA by adding Supermicro liquid- and air-cooled rack-scale compute, enabling trillion-parameter training and high-throughput inference for enterprises, neoclouds, and sovereign clouds. The NVIDIA Cloud Partner-compliant architecture unifies Cisco Silicon One front-end switching with NVIDIA Spectrum-X back-end fabric and Nexus One management, and supports NVIDIA Vera Rubin NVL72 and HGX Rubin NVL8 systems. Supermicro compute becomes orderable through Cisco starting October 2026.", "type": "Partnership", "date": "2026-08-25", "source_url": "https://newsroom.cisco.com/c/r/newsroom/en/us/a/y2026/m08/cisco-secure-ai-factory-nvidia-rack-scale.html"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Shares Slip 2.8% as Options Market Prices a $15 Billion Earnings Swing", "summary": "CrowdStrike stock fell 2.78% to $185.38 ahead of fiscal Q2 results due after the close on August 26, 2026. Options pricing implied roughly an 8% move, about $15.1 billion in market capitalization, with an expected trading band of $170.55 to $200.21. Company guidance called for ARR of approximately $5.793 to $5.795 billion, making the print a key read on whether AI security demand is converting into Falcon platform revenue.", "type": "Earnings", "date": "2026-08-25", "source_url": "https://ts2.tech/en/crowdstrike-stock-falls-2-8-as-options-price-a-15-billion-earnings-swing/"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler Positions Zero Trust Cloud for Continuous Compliance in an AI-Driven Multicloud World", "summary": "Zscaler detailed how its Zero Trust Cloud delivers continuous, verifiable compliance across multicloud environments using identity- and context-based workload access, app-to-app and in-app microsegmentation, least-privilege defaults, and immutable centralized logging for auditors. TLS inspection with privacy controls and inline DLP address exfiltration risk. Zscaler cited a large Brazilian digital bank cutting risk across AWS, Azure, and Google Cloud, and a financial firm meeting PCI DSS 4.0 and SWIFT CSP requirements via workload identity segmentation.", "type": "Announcement", "date": "2026-08-25", "source_url": "https://www.zscaler.com/blogs/product-insights/zero-trust-or-bust-winning-compliance-ai-driven-multicloud-world"}, {"title": "Zscaler Pairs Zero Trust with Schwarz Digits' Sovereign Cloud for Europe", "summary": "Zscaler's zero-trust platform is being paired with Schwarz Digits' STACKIT sovereign cloud to secure European access under sovereignty requirements, running the Zero Trust Exchange in German data centers. The positioning extends sovereignty beyond data residency to cover AI model access, policy control, operational continuity, and the architecture linking users, agents, applications, and data. It targets European procurement mandates that increasingly demand sovereign operational control, not just local storage.", "type": "Partnership", "date": "2026-08-25", "source_url": "https://insight.tmcnet.com/insight/zscaler-and-schwarz-digits-pair-zero-trust-with-sovereign-cloud-mt8a20r6"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Blocks Large-Scale Debt-Relief Phishing Campaign Targeting 9,000+ Organizations", "summary": "Check Point disclosed that it blocked a large-scale phishing campaign spanning roughly 24,700 emails aimed at more than 9,000 organizations over 14 days, using fake debt-relief offers to push victims toward attacker-controlled phone numbers. The company said its Email Security product detected the campaign by analyzing message intent \u2014 language, structure, sender behavior and requested action \u2014 rather than only links or attachments, with ThreatCloud AI correlating messages to broader campaign activity to stop delivery.", "type": "Research", "date": "2026-08-25", "source_url": "https://blog.checkpoint.com/securing-user-and-access/check-point-blocks-large-scale-debt-relief-email-phishing-campaign-targeting-more-than-9000-organizations/"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Says EmDash Version 1.0 Is Releasing Soon", "summary": "Cloudflare signaled that version 1.0 of EmDash, its own content management system, is close to release after completing a staged migration of the Cloudflare blog onto the platform by August 12, 2026. The company frames EmDash as a modern CMS that avoids WordPress-era vulnerabilities and performance bottlenecks, and points to the live blog migration as production validation ahead of the general release.", "type": "Announcement", "date": "2026-08-25", "source_url": "https://www.searchenginejournal.com/cloudflare-says-emdash-version-1-0-is-releasing-soon/586951/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare Introduces Bot Preference Sync to Align AI Bot Controls with robots.txt", "summary": "Cloudflare launched Bot Preference Sync, which automatically keeps a site's robots.txt aligned with the AI bot policies configured at the Cloudflare zone level across Search, Agent, and Training categories. New directives are prepended so existing Disallow rules are preserved, the feature can be toggled on or off, and it is rolling out to customers on all plans including Free, defaulting to on for new customers while existing users are prompted to migrate off legacy managed robots.txt.", "type": "Product Launch", "date": "2026-08-25", "source_url": "https://blog.cloudflare.com/bot-preference-sync/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Lambda Introduces Managed Runtimes in Public Preview for Node.js 26 and Python 3.15", "summary": "AWS opened public preview of Lambda managed runtimes for Node.js 26 and Python 3.15 so customers, partners, and upstream communities can test workloads and give feedback ahead of general availability. Preview runtimes may include breaking changes, are excluded from the SLA and AWS Support, and are not intended for production, but functions graduate automatically when the runtime reaches GA. They are available in commercial, GovCloud (US), and China Regions at standard Lambda pricing.", "type": "Product Launch", "date": "2026-08-25", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-lambda-node-js-python-public-preview/"}, {"title": "AWS Lambda Functions Now Support Full IAM Resource-Based Policies", "summary": "AWS extended Lambda to support full IAM resource-based policies, letting administrators define granular multi-principal, multi-action permissions in a single policy document with the complete set of IAM condition keys such as source IP and principal tags. The change simplifies permission management at scale in multi-account environments and allows access from several services to be granted in one policy, updated in a single step through the console, CLI, SDKs, or infrastructure-as-code. Available in all commercial Regions at no extra charge.", "type": "Announcement", "date": "2026-08-25", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/08/aws-lambda-full-iam-resource-based-policies/"}, {"title": "AWS Lambda MicroVMs Now Support AWS PrivateLink", "summary": "AWS added PrivateLink support to Lambda MicroVMs, enabling private connectivity from a customer VPC to MicroVM management APIs and to each MicroVM's HTTP endpoint without traversing the public internet. Endpoints can be created via the console, CLI, CloudFormation, or SDKs, and the capability is available in all Regions where Lambda MicroVMs are offered. AWS positions it for regulated workloads in financial services, healthcare, and government that require strict network isolation.", "type": "Announcement", "date": "2026-08-25", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/08/lambda-microvms-supports-privatelink"}]}, "Akamai ~P": {"category": "Platforms", "announcements": [{"title": "Akamai Announces Strategic Alliance with Deloitte Canada for Platform-Based Cyber Resilience", "summary": "Akamai and Deloitte Canada formed a strategic alliance pairing Deloitte's cybersecurity advisory and managed services with Akamai's security portfolio to move Canadian organizations off fragmented, reactive tooling and onto a unified security platform. The partners position the work as building proactive, platform-based resilience and defense-in-depth against machine-speed AI-driven attacks, while reducing security stack complexity, cutting operational cost, and accelerating digital transformation for CISOs and security teams.", "type": "Partnership", "date": "2026-08-25", "source_url": "https://www.stocktitan.net/news/AKAM/akamai-announces-strategic-alliance-with-deloitte-canada-to-help-6q7w91x1brop.html"}]}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Akamai Research Deconstructs the Architecture of AI-Orchestrated Web Attacks", "summary": "Akamai security research published an analysis of AI-orchestrated web attacks, arguing the threat landscape has shifted from human-driven intrusion to machine-scale exploitation. The post describes a widening \"speed gap\" in which AI-assisted attackers can identify vulnerabilities and generate working exploits far faster than defenders can patch, and makes the case for machine-scale, automated web application defense rather than manual response workflows.", "type": "Research", "date": "2026-08-24", "source_url": "https://www.akamai.com/blog/security/deconstructing-architecture-oai-orchestrated-web-attacks"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "HPE Advances Aruba Central and Juniper Mist Convergence with New APs and Application Experience Predictor", "summary": "HPE detailed progress converging Juniper Mist with Aruba Central, delivering access points that can be managed from either platform ahead of its Q3 2026 target, including a new tri-band AP for hospitality and small sites. It introduced an Application Experience Predictor that pairs Mist's Large Experience Model with Aruba Central telemetry and digital twins to forecast collaboration app performance, plus beta organization-level Mist insights inside Aruba Central. Switch convergence remains undecided.", "type": "Product Launch", "date": "2026-08-25", "source_url": "https://www.dawnliphardt.com/from-telemetry-to-access-points-hpe-deploys-the/"}, {"title": "HPE Appoints Infinigate UK as Specialist Distributor for Combined Aruba and Juniper Portfolio", "summary": "HPE named Infinigate UK a specialist value-added distributor for its full networking portfolio, extending Infinigate's existing Juniper focus to include HPE Aruba Networking. Partners gain distribution, technical support, lifecycle services, and enablement across campus, data center, secure connectivity, and AI-driven network operations. The move follows HPE's earlier selection of Ingram Micro and TD SYNNEX as global distributors, and signals HPE pushing a unified post-acquisition networking motion through the UK channel.", "type": "Partnership", "date": "2026-08-25", "source_url": "https://pressat.co.uk/releases/hpe-appoints-infinigate-uk-as-specialist-distributor-for-hpe-networking-portfolio-b8904c44a63f1f13053e53431f897ab0/"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "NetScaler ADC Vulnerability CVE-2026-8452 Draws Renewed Scrutiny of Citrix Appliance Security", "summary": "A published analysis of NetScaler ADC vulnerability CVE-2026-8452 walks through affected appliance behavior, exposure risk, and required remediation for Citrix ADC estates. The write-up lands amid an unusually heavy NetScaler patch cycle this month and is being used by rival load balancing vendors as a migration argument. It reinforces the pattern of perimeter-facing NetScaler appliances being high-value targets and pressures customers to accelerate patching or reassess their ADC platform choice.", "type": "Security Advisory", "date": "2026-08-25", "source_url": "https://www.skudonet.com/blog/netscaler-vulnerability-cve-2026-8452/"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Names ANZ Winners of 2026 Partner Awards", "summary": "Barracuda announced the Australia and New Zealand winners of its 2026 Partner Awards, naming Winthrop Australia Partner of the Year, Alliance Business Technologies MSP Partner of the Year, and Synnex Australia Distributor of the Year, alongside category wins for email security, collaboration, compliance and XDR/managed services. ANZ leadership tied the awards to continued channel investment, including the CyberCert alliance, an enhanced Partner Success Program, a refreshed partner portal, and the Barracuda Mastery training program.", "type": "Announcement", "date": "2026-08-25", "source_url": "https://channellife.com.au/story/barracuda-names-anz-winners-of-2026-partner-awards"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "Thales Imperva Launches SSL Integration Center with DigiCert Trust Lifecycle Manager for Bring-Your-Own-CA", "summary": "Thales introduced the Imperva SSL Integration Center, a framework inside Imperva Cloud WAF that connects external certificate workflows \u2014 CLM platforms, internal PKI, or multiple CAs \u2014 to protected applications without rebuilding processes. DigiCert Trust Lifecycle Manager is the first supported integration, using a TLM Agent and post-enrollment script to automatically issue, renew and deploy certificates via the Provisioning API. The move targets shrinking TLS certificate lifetimes, cutting renewal-driven outages and manual uploads.", "type": "Product Launch", "date": "2026-08-24", "source_url": "https://securityboulevard.com/2026/08/bring-your-own-ca-introducing-the-thales-imperva-ssl-integration-center-featuring-digicert-trust-lifecycle-manager/"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": []}, "Radware": {"category": "Application Security", "announcements": []}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-08-25.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
