var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Cortex Data Security Reaches General Availability", "summary": "Palo Alto Networks moved Cortex Data Security to general availability after two months in public preview, positioning it as an AI-native operating model for protecting data across cloud, SaaS, AI, and on-prem environments. The release bundles DSPM-powered discovery and classification, unified DLP and DDR for Cortex XDR customers, AI lifecycle security, agentic SOAR automation via XSOAR and AgentiX, and access governance covering both human and AI-agent identities. An October follow-on adds DLP Harmonization and Unified DDR to centralize policy visibility and near-real-time detection across cloud data stores, SaaS, and AI infrastructure.", "type": "Product Launch", "date": "2026-09-15", "source_url": "https://www.paloaltonetworks.com/blog/security-operations/cortex-data-security-ga-dlp-ddr/"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Idara Extends Privileged Access Management to AI Agents", "summary": "Palo Alto Networks unveiled Idara, an identity offering that extends privileged access management beyond human users to autonomous AI agents, building on its CyberArk integration. Rather than granting agents broad standing entitlements, Idara emphasizes runtime authorization, evaluating each individual action against target, data sensitivity, and risk before it executes. The launch signals that identity is becoming a core control plane for agentic AI security and puts Palo Alto in direct contention for the agent-governance layer enterprises are now building alongside AI runtime protection and guardrails.", "type": "Product Launch", "date": "2026-09-15", "source_url": "https://www.identityaccessmanagement.co.uk/palo-alto-networks-unveils-idara-following-cyberark-integration-identity-management-extends-to-ai-agents/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Opens $60M New York City Innovation Hub", "summary": "Fortinet opened a company-owned Innovation Hub in New York City, a 40,000-square-foot facility representing more than $60 million of investment and tripling its prior NYC footprint. The site houses sales and other functions plus an Executive Briefing Center, a Cybersecurity Training Center, and a Fortinet Cloud point of presence powered by the company's ASIC technology for high-performance, AI-enabled security delivery. Fortinet is targeting financial services and regional enterprise customers with hands-on demonstrations, executive briefings, and training, expanding a global hub network that includes Chicago, Atlanta, London, and Sydney.", "type": "Event", "date": "2026-09-15", "source_url": "https://www.fortinet.com/corporate/about-us/newsroom/press-releases/2026/fortinet-expands-us-presence-with-new-company-owned-innovation-hub-in-new-york-city"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cisco Brings Splunk AI On-Premises With NVIDIA-Accelerated AI POD", "summary": "Cisco announced Splunk advancements built to run, defend, and observe AI where customer data already resides. Cisco AI POD for Splunk delivers a pre-validated, Kubernetes-based AI runtime on Cisco hardware with NVIDIA acceleration for on-premises, private cloud, and air-gapped deployments, supporting Cisco's Deep Time Series model plus open models without data egress. Splunk Agent Observability adds Tokenomics for real-time AI token spend attribution and forecasting, along with runtime guardrails against unsafe agent actions. Cisco also signed a multi-year AWS agreement to co-develop an agentic security operations center.", "type": "Product Launch", "date": "2026-09-15", "source_url": "https://www.prnewswire.com/news-releases/cisco-delivers-trusted-ai-at-scale-through-new-splunk-advancements-302878467.html"}]}, "Cisco ~AS": {"category": "Application Security", "announcements": [{"title": "Cisco Patches Actively Exploited Secure Email Gateway Zero-Day", "summary": "Cisco warned customers of an actively exploited zero-day in Cisco Secure Email Gateway running AsyncOS, rated CVSS 9.8, that allows unauthenticated remote code execution through crafted emails carrying malicious SQL statements. Both physical and virtual appliances are affected and no workarounds exist, so patching is the only remediation. Cisco PSIRT confirmed exploitation in the wild, and CISA added the flaw to its Known Exploited Vulnerabilities catalog with a September 17 federal remediation deadline. Cisco advises reviewing mail_logs on every device in a cluster for suspicious SQL patterns.", "type": "Security Advisory", "date": "2026-09-15", "source_url": "https://cyberscoop.com/cisco-secure-email-gateway-zero-day-exploited/"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike Research Details LLM-Generated PhantomRaven Stealer", "summary": "CrowdStrike published research on PhantomRaven, an information stealer distributed through typosquatted npm packages that the company assesses with high confidence was largely generated by a large language model, citing verbose machine-style code comments. The actor, active since November 2022, used the bespoke malware to find exploitable conditions and claim bug bounty payouts from at least nine technology, retail, and hospitality companies rather than selling stolen data. CrowdStrike recommends private registries, restricting install script execution by default, and developer training on dependency-confusion attacks as AI tooling lowers attacker barriers.", "type": "Research/Report", "date": "2026-09-15", "source_url": "https://www.crowdstrike.com/en-us/blog/phantomraven-llm-generated-information-stealer-for-bug-bounty-hunting/"}]}, "Zscaler ~AI": {"category": "AI Security", "announcements": [{"title": "Zscaler Positions Deception as Frontline Countermeasure to AI-Enabled Attacks", "summary": "Zscaler published product-insights research arguing that AI-enabled adversaries now automate reconnaissance, credential validation, exploit development, phishing and post-compromise data processing, collapsing defender detection windows. The piece positions deception \u2014 decoys, honeytokens, synthetic assets and canaries \u2014 as a strategic early-detection and containment layer that forces attackers to reveal themselves against fake targets. Drawing on five documented cyber-operation case studies, Zscaler maps network, web-application and AI-stack deception patterns, framing them as complementary to patching, identity hardening, ZTNA and DLP rather than a replacement, and tying deception telemetry into its wider Zero Trust and Agentic SOC narrative.", "type": "Research/Report", "date": "2026-09-15", "source_url": "https://www.zscaler.com/blogs/product-insights/countermeasures-ai-enabled-attacks-start-deception"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point to Debut AI Network Firewall and AI Defense Plane at GISEC Global 2026", "summary": "Check Point announced it will showcase an AI-powered, prevention-first security lineup at GISEC Global 2026 in Dubai, headlined by its AI Network Firewall and AI Defense Plane. Four demonstration pods will feature live demos and customer use cases spanning hybrid networks, AI workloads and digital workspaces. The messaging centers on a unified security architecture delivering prevention, visibility and control across multivendor environments without adding operational complexity \u2014 reinforcing Check Point's consolidation pitch in the Middle East and its positioning that enterprises can secure AI adoption from infrastructure they already own.", "type": "Event", "date": "2026-09-15", "source_url": "https://gecnewswire.com/check-point-software-to-showcase-ai-powered-security-at-gisec-global-2026/"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point Ships Synchronous Control Monitoring to Block Harmful AI Agent Actions in Real Time", "summary": "Check Point introduced Synchronous Control Monitoring, a runtime alignment mechanism that inspects and blocks unsafe AI agent actions at the moment of execution rather than after the fact. Delivered as part of Check Point's AI security portfolio, it provides centralized policy enforcement over agent execution across managed workstations, giving security teams a control point for autonomous agents operating on endpoints. The capability extends Check Point's AI Defense Plane strategy into agent runtime governance and competes directly with runtime AI guardrail approaches, targeting enterprises deploying agentic AI on employee devices without existing execution-level controls.", "type": "Product Launch", "date": "2026-09-15", "source_url": "https://blog.checkpoint.com/ai-security/synchronous-control-monitoring-preventing-harmful-agent-actions-in-real-time/"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Adds Per-Worker Granular Permissions for Teammates and AI Agents", "summary": "Cloudflare introduced resource-level access control for its Developer Platform, letting administrators scope access to individual Workers instead of the whole account. Four new roles \u2014 Metadata Read-Only, Content Read-Only, Editor and Admin \u2014 can be assigned to members, user groups or scoped API tokens via dashboard, API or Terraform, with Durable Objects inheriting the parent Worker's permissions. Cloudflare explicitly frames the feature around least-privilege access for AI agents and CI/CD pipelines: debugging agents get metadata only, code-review agents get content read, automation gets Editor. Legacy Worker permissions keep working, with no deprecation date set.", "type": "Product Launch", "date": "2026-09-15", "source_url": "https://blog.cloudflare.com/workers-granular-authorization/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare Launches \u201cAccountable\u201d AI Crawler Designation and Disallow AI Training Control", "summary": "Cloudflare replaced its single Block AI Bots switch with three independent crawler controls \u2014 Search, AI Training and AI Agents \u2014 plus a new Disallow AI Training setting that lets sites stay indexed in search while refusing model training. Cloudflare also defined an \u201cAccountable\u201d crawler designation with four operator requirements, naming Apple, Google and Microsoft as meeting or aligning with the criteria. New defaults took effect for new domains and free-plan sites: ad-supported pages allow search crawling but block training and agent access. Managed Robots.txt is deprecated in favor of Bot Preference Sync.", "type": "Product Launch", "date": "2026-09-15", "source_url": "https://www.cloudflare.com/press/press-releases/2026/cloudflare-helps-end-the-search-or-ai-training-tradeoff/"}, {"title": "Cloudflare WAF Managed Ruleset Moves SSRF and Command Injection Detections to Block", "summary": "Cloudflare's September 15 WAF release promoted several Cloudflare Managed Ruleset detections from log-only to blocking. SSRF \u2013 Cloud \u2013 3, which targets attempts to reach cloud instance metadata endpoints, and Command Injection \u2013 Generic 10 now block by default. The beta Version Control \u2013 Information Disclosure rule was merged into the original rule and also set to block, closing exposure of source-control history left on web roots. The update tightens default protection against cloud credential theft via SSRF, remote command execution and repository information disclosure without customer rule authoring.", "type": "Product Launch", "date": "2026-09-15", "source_url": "https://developers.cloudflare.com/changelog/post/2026-09-15-waf-release/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS and Salesforce Expand Partnership to Embed CRM Data and Agents Across Both Platforms", "summary": "AWS and Salesforce expanded their decade-long partnership to put CRM data, AI agents and model choice into everyday work tools. Salesforce data and context now surface in Amazon Quick; AWS frontier agents arrive in Slack starting with the DevOps Agent; and Agentforce gains model choice through Amazon Bedrock. Agentforce Voice will interoperate with Amazon Connect Customer over the Agent2Agent protocol for real-time bidirectional voice this fall, while Data 360 Zero Copy and Informatica headless expansions broaden cross-environment data access without migrations. Most integrations are generally available now.", "type": "Partnership", "date": "2026-09-15", "source_url": "https://press.aboutamazon.com/aws/2026/9/aws-and-salesforce-put-crm-data-ai-agents-and-model-choice-into-the-tools-teams-use-every-day"}, {"title": "Cognition and AWS Sign Multi-Year Strategic Collaboration Agreement for Devin", "summary": "AWS and Cognition signed a multi-year Strategic Collaboration Agreement to help enterprises run Cognition's Devin autonomous software engineering platform in production on AWS. The agreement targets legacy workload migration, security backlog remediation and engineering debt reduction, with Devin already purchasable through AWS Marketplace alongside an Agent Toolkit for AWS. Both companies committed to deeper integrations into customer AWS environments. AWS cited existing deployments at Mercedes-Benz, Echo Global Logistics and ActiveCampaign as proof points, positioning agentic engineering on AWS as a mainstream modernization path rather than an experiment.", "type": "Partnership", "date": "2026-09-15", "source_url": "https://press.aboutamazon.com/aws/2026/9/cognition-and-aws-sign-multi-year-collaboration-agreement"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": [{"title": "Lasso Named a Leader in Latio's 2026 AI Security Market Report", "summary": "Lasso Security was named var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-09-15.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
