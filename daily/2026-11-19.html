(function(){
"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Firewalls Integrate with AWS Transit Gateway Context Sharing for Real-Time Policy Enforcement", "summary": "Palo Alto Networks firewalls now ingest AWS resource context (VPC, subnet, security group, Transit Gateway attachment IDs, region) inline via GENEVE TLVs, enforcing tag-based policy from the first packet. This enables agentless micro-segmentation managed from Panorama across auto-scaling cloud environments. In-band tags are available now for VM-Series and Prisma AIRS on self-managed firewalls, with Cloud NGFW and Managed AI Runtime Security support coming next year.", "type": "Product Update", "date": "2026-11-19", "source_url": "https://www.paloaltonetworks.com/blog/2026/11/palo-alto-networks-firewalls-integrate-with-aws-transit-gateway-context-sharing/"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Prisma AIRS Adds Agent Identity Security, OpenAI Codex Integration and Prisma SASE AI Gateway to Tame AI Sprawl", "summary": "Palo Alto Networks outlined a Prisma AIRS strategy for securing enterprise AI agent sprawl. New capabilities include Agent Identity Security (unique verified agent IDs, least-privilege runtime access, end-to-end traceability), a native OpenAI Codex integration via the Prisma AIRS Runtime API, Cortex Agentic Endpoint Security coverage for local coding agents like Cursor and Claude Code, and an AI Gateway in Prisma SASE/Strata Cloud Manager governing MCP calls, LLM interactions and agent-to-agent traffic.", "type": "Product Launch", "date": "2026-11-19", "source_url": "https://www.paloaltonetworks.com/blog/ai-security/navigating_ai_sprawl/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Westlands Advisory Names Fortinet a Leader in OT Cybersecurity Platforms", "summary": "Fortinet was named a Leader in the Westlands Advisory OT Cybersecurity Navigators 2026 report for the fourth straight time, citing its AI-Enabled OT Security Platform. Alongside the recognition, Fortinet detailed OT portfolio expansions: rugged FortiGate rail models, 5G FortiExtender Vehicle units, FortiAP 222KL, FortiOS EV-charging protection and a built-in MQTT broker, an expanded FortiGuard OT Security Service, and 10+ transportation and maritime certifications. It also tied in FortiAI and the FortiGuard Inline AI Security Service.", "type": "Research Report", "date": "2026-11-19", "source_url": "https://www.fortinet.com/corporate/about-us/newsroom/press-releases/2026/westlands-advisory-names-fortinet-a-leader-in-ot-cybersecurity-platforms"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Qumulo and Cisco Turn Storage and Network Into a Unified Ransomware Defense", "summary": "Cisco and Qumulo launched an integrated ransomware defense pairing Qumulo NeuralProtect storage-layer AI/ML detection with Cisco Hypershield and N9300 Series Smart Switches. When NeuralProtect detects ransomware at write time, it locks snapshots and revokes write access. Hypershield then pushes L4 microsegmentation policy to N9300 switches to isolate the threat automatically, with no extra security appliances. It's available now through Qumulo, Cisco and channel partners.", "type": "Partnership", "date": "2026-11-19", "source_url": "https://www.businesswire.com/news/home/20261119996793/en/Qumulo-and-Cisco-Turn-Storage-and-Network-Into-a-Unified-Ransomware-Defense"}, {"title": "DXC Collaborates with Cisco to Turn AI-Powered Network Insights into Action with DXC OASIS", "summary": "DXC Technology is integrating Cisco AgenticOps capabilities, AI Assistant, Experience Metrics and MCP context tools into its DXC OASIS orchestration platform. The goal is to turn real-time network intelligence into governed, human-supervised remediation across IT systems. The initial scope covers Wi-Fi performance in Cisco Meraki environments, with broader Cisco technologies to follow. In a pilot, incident resolution time fell from 1-2 hours to 5-7 minutes.", "type": "Partnership", "date": "2026-11-19", "source_url": "https://dxc.com/newsroom/11192026-dxc-collaborates-with-cisco-to-turn-ai-powered-network-insights-into-action-with-dxc-oasis"}, {"title": "Cisco Cuts Less Than 1% of Workforce in Latest Layoff Round", "summary": "Cisco confirmed another round of layoffs affecting less than 1% of its roughly 82,400 employees, reportedly carried out around November 18. Cisco framed the cuts as targeted role and location adjustments as it shifts investment toward AI, silicon, optics and security. Headcount is down about 8,000 since mid-2024, even as Q1 FY27 revenue rose 24%.", "type": "Executive News", "date": "2026-11-19", "source_url": "https://www.sdxcentral.com/news/cisco-lays-off-more-employees/"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Helps Identify, Patch, and Protect Against NGINX2Root (CVE-2026-123007 et al.)", "summary": "CrowdStrike published guidance on NGINX2Root, a set of critical NGINX flaws (CVE-2026-123007, 123634, 123633, 121810, 113425) disclosed November 18. Falcon Exposure Management finds affected nginx hosts on Linux, macOS, network scan and EASM. Because exploitation happens in memory, Falcon relies on post-exploitation behavioral detections (suspicious nginx child processes, webshells, credential access) plus a crash-burst indicator. The post positions Falcon as the protection layer for NGINX estates while customers patch.", "type": "Research Report", "date": "2026-11-19", "source_url": "https://www.crowdstrike.com/en-us/blog/crowdstrike-helps-protect-against-nginx2root-cve-2026-123007/"}, {"title": "CrowdStrike Helps Identify, Patch, and Protect Against Java4Shell (CVE-2026-114938)", "summary": "CrowdStrike detailed Falcon coverage for Java4Shell, a HotSpot JVM memory-corruption flaw that Oracle and OpenJDK fixed November 17. Falcon Exposure Management flags vulnerable Java runtimes across Windows, Linux and macOS, with new sensor-based detection of previously missed Java installs. Falcon Cloud Security finds affected container images, and IOA behavioral detections block post-exploitation activity such as web shells and suspicious Java child processes.", "type": "Research Report", "date": "2026-11-19", "source_url": "https://www.crowdstrike.com/en-us/blog/crowdstrike-helps-protect-against-java4shell-cve-2026-114938/"}, {"title": "Jamf Brings Apple Device Management and Security Apps to CrowdStrike Falcon Foundry", "summary": "Jamf released three apps on CrowdStrike Falcon Foundry that bring Apple device management and security data into Falcon workflows for detection-driven remediation. One of them, the Jamf App Resilience Platform, uses Falcon Real Time Response to continuously validate and repair the Jamf management framework. The launch extends the Falcon platform's partner app ecosystem into Apple fleet management.", "type": "Partnership", "date": "2026-11-19", "source_url": "https://www.jamf.com/resources/press-releases/jamf-brings-apple-device-management-and-security-apps-to-crowdstrike-falcon-foundry/"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler Details Endpoint Context to Close the 'Process-to-Packet' Gap for SOCs", "summary": "Zscaler introduced Endpoint Context, which uses Zscaler Client Connector to attach process-level endpoint data (PIDs, parent/child relationships, command lines, binary hashes, signing status, CVE risk mapping) to each network transaction across the Zero Trust Exchange in real time. Zscaler positions it as a complement to EDR that speeds detection and response by tying host activity to encrypted traffic inline.", "type": "Product Update", "date": "2026-11-19", "source_url": "https://www.zscaler.com/blogs/product-insights/closing-process-packet-chasm-why-we-built-zscaler-endpoint-context-and-why"}]}, "Zscaler ~AI": {"category": "AI Security", "announcements": [{"title": "Zscaler Lays Out Six-Tool Defense-in-Depth Approach to Stopping Prompt Injection", "summary": "Zscaler argues that no single control blocks all prompt injection and recommends layering zero trust access, AI-aware DLP, an AI gateway for MCP/A2A traffic, AI runtime protection, AI-SPM for shadow AI discovery, and AI red teaming. It maps these to its own AI Guard (real-time prompt/output inspection) and AI Gateway, and cites ThreatLabz data showing a 16-minute median time to first critical failure in AI systems.", "type": "Other", "date": "2026-11-19", "source_url": "https://www.zscaler.com/blogs/product-insights/how-to-stop-prompt-injection-with-6-ai-security-tools"}]}, "Check Point Software": {"category": "Platforms", "announcements": []}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point Research: 'Gatekeeper Asymmetry Doom' Makes Powerful LLMs More Vulnerable", "summary": "Check Point Research published an analysis arguing that when input-vetting systems are less capable than the models they protect, bypasses are inevitable. It highlights PuzzleMask, a technique that hides policy-violating payloads in obfuscated wrappers to slip past lightweight pre-screening guardrail models. The authors urge more powerful or better-used gatekeepers to shrink AI guardrail bypass surfaces.", "type": "Research Report", "date": "2026-11-19", "source_url": "https://research.checkpoint.com/2026/30-years-of-gatekeeper-asymmetry-doom-the-paradox-that-makes-powerful-llms-more-vulnerable/"}, {"title": "Check Point Positions 'Agentic Steering' Over Kill Switches for AI Agent Security", "summary": "Check Point's AI Security blog argues that a kill switch should be a last resort for misbehaving AI agents. It recommends steering instead: evaluating each agent action against its assigned task, blocking risky steps and guiding the agent back on course. The approach uses pre-deployment red teaming and live monitoring, and aims to cut risk while keeping task completion rates.", "type": "Other", "date": "2026-11-19", "source_url": "https://blog.checkpoint.com/ai-security/ai-agent-kill-switch-agentic-steering/"}]}, "Cloudflare": {"category": "Platforms", "announcements": []}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare Says Its Proxy Shields Origins from Worst of Five 'nginx2root' NGINX Vulnerabilities", "summary": "Cloudflare analyzed five newly disclosed nginx memory-corruption CVEs (nginx2root), disclosed by F5 and nginx.org, that can let unauthenticated attackers crash workers or achieve code execution. Cloudflare says its Rust-based FL2 edge and connection termination protect proxied origins from HTTP/2 and HTTP/3 attack traffic. It warns that directly reachable origins, Spectrum TCP/UDP apps and the mail proxy still need patching to nginx 1.30.7 or 1.31.9.", "type": "Research Report", "date": "2026-11-19", "source_url": "https://blog.cloudflare.com/nginx2root/"}, {"title": "Cloudflare Issues WAF Emergency Release for PHP, Ruby and PHP-FPM CVEs", "summary": "Cloudflare pushed an emergency WAF release updating PHP remote code execution detections and adding new rules for Ruby heap and integer overflows, PHP-FPM and PHP SOAP CVEs. It also adds generic authentication-bypass and embedded-application-request anomaly rules. Most new detections block by default, while the PHP rules start in log mode so customers can review impact first.", "type": "Product Update", "date": "2026-11-19", "source_url": "https://developers.cloudflare.com/changelog/post/2026-11-19-emergency-waf-release/"}]}, "Cloudflare ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Cloudflare Workers and Containers Add Inbound TCP and gRPC in Public Beta", "summary": "Cloudflare opened a public beta of inbound TCP connections to Workers and bidirectional gRPC in Containers, routed through Spectrum. Worker-origin Spectrum apps are available on Pro and Business zones (one app on a single TCP port per zone without Spectrum Enterprise). This extends Cloudflare's developer platform beyond HTTP to raw TCP and gRPC workloads at the edge.", "type": "Product Update", "date": "2026-11-19", "source_url": "https://developers.cloudflare.com/changelog/post/2026-11-19-inbound-tcp/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Network Firewall Adds Explicit Proxy and NAT Gateway Association", "summary": "AWS Network Firewall can now be associated with a NAT Gateway and run as both an explicit proxy and a transparent routed firewall under one centrally managed policy. It works with existing managed rule groups, threat defense, Geo-IP, URL/domain filtering and EKS/ECS container rules. Traffic enters through a VPC endpoint and exits through the NAT Gateway IP, in Regions across the US, Europe and Asia Pacific.", "type": "Product Update", "date": "2026-11-19", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/network-firewall-proxy-nat-gateway/"}, {"title": "AWS Site-to-Site VPN Now Supports Post-Quantum Key Exchanges", "summary": "AWS Site-to-Site VPN tunnels can now use post-quantum key exchanges in line with NIST guidance. The option is set through the CreateVpnConnection and ModifyVpnTunnelOptions APIs at no extra charge. It's available in all commercial and GovCloud (US) Regions that offer Site-to-Site VPN.", "type": "Product Update", "date": "2026-11-19", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/site-to-site-vpn-post-quantum/"}]}, "AWS ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "AWS Network Load Balancer Now Supports Mutual TLS Authentication", "summary": "AWS Network Load Balancer now verifies X.509 client certificates on TLS listeners, offloading mTLS from backend applications. Customers attach a trust store (a CA bundle from any CA or AWS Private CA), can add revocation lists, and can filter clients by certificate fields such as Common Name, OU, DNS name or SAN/SPIFFE IDs. It's available in all commercial and GovCloud (US) Regions with NLB.", "type": "Product Update", "date": "2026-11-19", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/network-load-balancer-mtls/"}]}, "AWS ~AI": {"category": "AI Security", "announcements": [{"title": "Amazon Bedrock AgentCore Identity Adds Private Certificate Authority Support", "summary": "Amazon Bedrock AgentCore Identity now trusts identity-provider TLS certificates issued by private CAs (AWS Private CA, enterprise CAs or self-signed roots) for custom OAuth 2.0 credential providers over private VPC Lattice connections. Certificates can be stored in Secrets Manager or S3 and rotated without downtime. This strengthens identity controls for enterprise AI agents connecting to private systems.", "type": "Product Update", "date": "2026-11-19", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/11/bedrock-agentcore-identity-private-ca/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": [{"title": "When agents go out of bounds: How Lasso is helping enterprises secure the AI agents they build and use", "summary": "YourStory profiles Lasso Security (part of the NetApp Excellerator program) and its platform for securing AI agents on endpoints, in code and in the cloud. Lasso's Intent Security Engine learns what each agent is meant to do and checks every action against that purpose in real time. It flags, masks or blocks out-of-scope actions inline in under 50 ms, and Lasso claims about 98.6% detection accuracy. The platform also covers agent discovery, AI-BOM, AI-SPM, automated red teaming, runtime protection and rogue-agent protection.", "type": "Other", "date": "2026-11-19", "source_url": "https://yourstory.com/2026/11/agents-lasso-enterprises-secure-ai-agents"}]}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Java4Shell: A Closer Look and Patch Analysis (CVE-2026-114938)", "summary": "Akamai's Security Intelligence Group published an analysis of Java4Shell (CVE-2026-114938), a critical memory corruption flaw in the JVM's AVX-512 VBMI Base64 decoding path that can enable remote code execution across OpenJDK 17, 21, 25 and downstream builds such as Corretto, Temurin and Zulu. The post breaks down the four-line upstream fix, lists patched versions, and provides asset mappings and detection scripts to help customers find vulnerable hosts.", "type": "Research Report", "date": "2026-11-19", "source_url": "https://www.akamai.com/blog/security-research/java4shell-closer-look-patch-analysis-cve-2026-114938"}, {"title": "Akamai MFA: OATH Hardware Tokens Now Support SHA-256 and SHA-512", "summary": "Akamai MFA now supports SHA-256 and SHA-512, alongside SHA-1, for OATH TOTP and HOTP hardware tokens. The update adds a full-page token setup dialog with no preset defaults to reduce errors, an optional HOTP counter column, post-upload summaries with a downloadable CSV of duplicate tokens, and usability improvements across the MFA console.", "type": "Product Update", "date": "2026-11-19", "source_url": "https://techdocs.akamai.com/mfa/changelog/nov-19-2026-oath-hardware-tokens-sha256-sha512"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": []}, "Fastly ~AI": {"category": "AI Security", "announcements": [{"title": "Fastly Launches AI Firewall, AI Runtime Control and API Security in Japan", "summary": "Fastly Japan announced AI Runtime Control (central governance of model access, token usage, rate limits, budgets and failover through one endpoint), AI Firewall (edge inspection of prompts to block prompt injection before traffic reaches models) and API Security (contract enforcement for agent and traditional API traffic). The tools extend Fastly's edge security portfolio of Bot Management, DDoS Protection and Next-Gen WAF to AI apps moving from proof of concept to production.", "type": "Product Launch", "date": "2026-11-19", "source_url": "https://prtimes.jp/main/html/rd/p/000000077.000037639.html"}]}, "Fastly ~AS": {"category": "Application Security", "announcements": [{"title": "Fastly Launches WAF and CDN Security Packages for Japanese SMEs", "summary": "Nikkei reports that Fastly will offer security services to small and mid-sized businesses in Japan, sold and deployed by partner System Support. There are two plans: WAF-only (setup from about 700,000 yen, annual fee from 1,000,000 yen) and WAF plus CDN (setup from 1,400,000 yen, annual fee from 1,800,000 yen). The move takes Fastly's enterprise WAF and CDN down-market beyond its entertainment and e-commerce base.", "type": "Product Launch", "date": "2026-11-19", "source_url": "https://www.nikkei.com/article/DGXZQOUC191AJ0Z11C26A1000000/"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": []}, "Citrix (NetScaler) ~AI": {"category": "AI Security", "announcements": [{"title": "Vulcan and Citrix Asean and South Asia Bring GenAI Guardrails to 16 Asian Markets", "summary": "At Singapore FinTech Festival 2026, Vulcan and Citrix Asean and South Asia signed a distribution agreement to sell and support Vulcan Protect, a real-time runtime guardrail for GenAI, across 16 Asian markets. Vulcan Protect integrates with NetScaler AI Gateway for prompt screening and output governance. The deal includes joint professional services and targets financial institutions putting GenAI into production, addressing prompt injection and data leakage.", "type": "Partnership", "date": "2026-11-19", "source_url": "https://citrixasean.com/vulcan-and-citrix-asean-and-south-asia-bring-real-time-genai-guardrails-to-16-asian-markets/"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": []}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Experts Look Beyond HPE Juniper Devices for Answers on FAA Ground Stop", "summary": "TechTarget reports that there is still no definitive root cause for the FAA network outage that triggered a nationwide ground stop during the agency's swap of legacy Cisco routers for HPE Juniper gear. HPE says its equipment performed as configured. The FAA and L3Harris are examining installation and configuration issues, including a non-default multicast/broadcast setting and a blocked site. Experts caution against blaming a single device as Senate pressure mounts on further Juniper deployments.", "type": "Other", "date": "2026-11-19", "source_url": "https://www.techtarget.com/news/experts-look-beyond-hpe-devices-for-answers-on-faa-ground-stop/875209/"}, {"title": "HPE Says Customers Set the Limits on Marvis Autonomous Networking", "summary": "HPE positions Marvis AI autonomous fixes (restoring VLAN settings, blocking rogue DHCP servers) as opt-in. Customers set autonomy per organization or per site, and Marvis only recommends actions where permission isn't granted. Safeguards include up to three retries before escalation, logged AI actions, automatic reopening of recurring issues, Zero Trust controls on configuration changes, and Dry Run testing in Mist Access Assurance.", "type": "Product Update", "date": "2026-11-19", "source_url": "https://techwireasia.com/2026/11/hpe-customers-set-limits-autonomous-networking/"}]}, "HPE / Juniper Networks ~P": {"category": "Platforms", "announcements": [{"title": "TD SYNNEX Extends Full HPE Portfolio, Including HPE Networking, to Partners in 37+ Countries", "summary": "TD SYNNEX now distributes the complete HPE portfolio, including HPE Networking (Juniper), compute, storage and hybrid cloud, across more than 37 countries, territories and regions. It gives partners a single global source for integrated HPE solutions. TD SYNNEX adds technical training, pre-sales support, go-to-market resources, logistics, financing and an expanded team of HPE specialists, building on its earlier selection as a global HPE distribution partner.", "type": "Partnership", "date": "2026-11-19", "source_url": "https://ir.tdsynnex.com/news/news-details/2026/TD-SYNNEX-Extends-Full-HPE-Portfolio-to-Partners-Across-37-Countries-Territories-and-Regions/default.aspx"}]}, "Radware": {"category": "Application Security", "announcements": []}, "Radware ~AI": {"category": "AI Security", "announcements": [{"title": "MCP: The New Open Door to the AI-Powered Enterprise, Part 1", "summary": "Radware argues that the Model Context Protocol (MCP) creates a new network-facing security boundary. MCP servers expose tool manifests that let AI agents discover and invoke enterprise tools, data and actions, so exposed MCP endpoints become attack targets. Radware says protecting the MCP server, based on who is requesting, which tool is invoked and what workload runs behind it, matters as much as protecting the agent. The post supports its MCP Server Protection offering.", "type": "Other", "date": "2026-11-19", "source_url": "https://www.radware.com/blog/mcp-the-new-open-door-to-the-ai-powered-enterprise-part-1/"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Patch Management vs. IT Outages: Balancing Cyber Risk in the AI Era", "summary": "Barracuda says AI-assisted attackers now find and exploit vulnerabilities in minutes, which shrinks the window for safe patch testing. It urges IT teams to rank patches by system criticality, use real-time mitigations when updates can't be deployed right away, and weigh the risk of an outage against the risk of leaving known vulnerabilities open.", "type": "Other", "date": "2026-11-19", "source_url": "https://blog.barracuda.com/2026/11/19/patch-management-it-outages-ai-era"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "The Agentic Shift: How AI Is Redefining Application Security", "summary": "Imperva says autonomous AI agents, not humans, increasingly drive application and API traffic. It cites bots at 53% of traffic, AI-enabled bot attacks up 12.5x, 27% of bot attacks targeting APIs and 21% targeting business logic. It flags new risks like prompt injection, unsafe tool invocation and excessive permissions, and calls for integrated WAF, API security, bot management, DDoS and AI-specific controls across hybrid environments.", "type": "Other", "date": "2026-11-19", "source_url": "https://www.imperva.com/blog/the-agentic-shift-why-ai-is-redefining-application-security/"}, {"title": "Four Days Early: Why AI-Found Vulnerabilities Demand WAF Protection That's Already On", "summary": "Imperva says AI-discovered vulnerabilities, including PHP2Shell and a Brotli-related Node.js flaw, became exploitable days before fixes were fully in place, giving attackers a head start. Its argument is that having a WAF rule isn't enough. Protection has to be on by default and enforced before disclosure to close the gap that AI-speed discovery creates.", "type": "Other", "date": "2026-11-19", "source_url": "https://www.imperva.com/blog/why-ai-found-vulnerabilities-demand-protection-thats-already-on/"}]}};

  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
