(function(){
"use strict";
var DATA={"Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Palo Alto Networks Introduces CLARA Agent for Cloud & AI Risk Insights on Google Cloud Gemini Enterprise", "summary": "Palo Alto Networks launched CLARA Agent, which links Strata Cloud Manager to Google Cloud Gemini Enterprise. Users can ask plain-language questions about security data and get answers backed by evidence. It finds production AI/ML models, flags unsanctioned shadow AI and ranks vulnerabilities. It uses the A2A protocol and MCP servers, needs no extra infrastructure, and is sold on Google Cloud Marketplace. For F5, this is another sign that AI-security vendors are building agent-based tools into the Google Cloud ecosystem.", "type": "Product Launch", "date": "2026-09-29", "source_url": "https://www.paloaltonetworks.com/blog/2026/09/introducing-clara-agent-instant-cloud-ai-risk-insights-available-on-google-cloud-gemini-enterprise/"}]}, "Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "KDDI Launches \"SASE Gateway powered by Palo Alto Networks\" Using SP Interconnect", "summary": "Palo Alto Networks and KDDI launched \"SASE Gateway powered by Palo Alto Networks.\" It uses the SP Interconnect architecture to connect KDDI's carrier networks directly to Prisma SASE. The aim is simpler zero-trust security for customers on closed corporate networks in Japan. The deal shows Palo Alto Networks using telecom carriers to sell its SASE platform to enterprises in the region.", "type": "Partnership", "date": "2026-09-29", "source_url": "https://www.paloaltonetworks.com/blog/2026/09/sase-gateway-provided-by-kddi-how-sp-interconnect-simplifies-closed-network-zero-trust/"}]}, "Fortinet ~AI": {"category": "AI Security", "announcements": [{"title": "Fortinet Expands AI Security Across Google Cloud Gemini Enterprise", "summary": "Fortinet announced new AI security integrations with Google Cloud Gemini Enterprise. FortiAIGate now inspects prompts and responses between apps and models and enforces policy on them. FortiOS 8.0 adds controls for AI and Model Context Protocol (MCP) traffic and shadow-AI discovery on FortiGate firewalls. Fortinet also deepened its integration with Google Unified Security. FortiAIGate competes directly with F5 AI Guardrails, and Fortinet is pitching one Security Fabric for the whole AI lifecycle.", "type": "Partnership", "date": "2026-09-29", "source_url": "https://www.fortinet.com/blog/cloud-security/fortinet-expands-ai-security-across-google-cloud-gemini-enterprise"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Bell and Cisco to Collaborate on Sovereign AI Infrastructure for Canada", "summary": "Bell Canada and Cisco signed an MOU to build a sovereign AI infrastructure platform in Canada. It combines Bell's data centers, connectivity and operations with Cisco's AI PODs and its AI, security, observability and Sovereign Critical Infrastructure technology. The partners will also look at usage-based pricing for AI capacity. For F5, this adds to Cisco's growing presence in sovereign AI infrastructure and AI networking deals with service providers.", "type": "Partnership", "date": "2026-09-29", "source_url": "https://www.prnewswire.com/news-releases/bell-and-cisco-to-collaborate-on-sovereign-ai-infrastructure-for-canada-889841003.html"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Talos Announces Executive Threat Detection Service", "summary": "Cisco Talos Incident Response launched Executive Threat Detection, a threat-hunting service driven by intelligence. It covers up to 10 executives, with monthly custom hunts and reports run by a dedicated Talos team. The goal is to find long-term, stealthy attackers in executive environments that automated tools can miss. It adds to Cisco's range of managed security services.", "type": "Product Launch", "date": "2026-09-29", "source_url": "https://blog.talosintelligence.com/securing-the-keys-to-the-kingdom-announcing-executive-threat-detection/"}, {"title": "Cisco Secure Access Makes Geolocation-Based Access Control Generally Available", "summary": "Cisco Secure Access now offers Geolocation-Based Access Control as a generally available feature. It covers both Secure Internet Access and Secure Private Access. Admins can combine country or region conditions with identity in access policies, automate geolocation workflows, and troubleshoot with policy and event context. This strengthens Cisco's SSE/SASE platform against other zero-trust access offerings.", "type": "Feature Update", "date": "2026-09-29", "source_url": "https://community.cisco.com/t5/secure-access-announcements/announcement-ga-release-source-based-geolocation-based-access/ta-p/5571810/jump-to/first-unread-message"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike Brings the Falcon Platform to the OpenAI Marketplace", "summary": "CrowdStrike's Falcon platform is now sold in the OpenAI Marketplace. Eligible OpenAI enterprise customers can pay for it from their existing OpenAI commitments. The partnership also covers Falcon Guardian runtime protection for OpenAI Codex agents and GPT-5.6 Cyber reasoning, starting with the FAIRR service. For F5, this shows a new way platform vendors are selling agent runtime security: through AI model providers' marketplaces.", "type": "Partnership", "date": "2026-09-29", "source_url": "https://finviz.com/news/396686/crowdstrike-brings-the-falcon-platform-to-the-openai-marketplace"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point and NVIDIA Integrate Real-Time AI Agent Safeguards via OpenShell and Open Agent Safety Platform", "summary": "Check Point Software and NVIDIA have combined Check Point's semantic monitoring with NVIDIA's Open Agent Safety Platform and its open-source OpenShell runtime. The integration checks each action an AI agent proposes in under 100 milliseconds, before it runs, looking at intent, context, tool calls and past behavior rather than single prompts. OpenShell passes each proposed action to Check Point for a decision and then enforces it. NVIDIA Sentry on BlueField-4 adds hardware-isolated monitoring. Check Point will contribute its security work back to the OpenShell community.", "type": "Partnership", "date": "2026-09-29", "source_url": "https://securitybrief.ca/story/check-point-nvidia-add-real-time-ai-agent-safeguards"}, {"title": "Check Point's Brian Linder on Closing the 51-Point AI Security Gap", "summary": "Check Point's Head of Cyber Evangelists, Brian Linder, discussed company research on AI security readiness. It found that 77% of organizations have rewritten their security strategy because of AI, but only 26% have the architecture to enforce it, and 78% had AI-related security incidents in the past year. Check Point positioned three products as its answer: the AI Network Firewall (R82.20), which blocks prompt injection inline; Agentic Exposure Validation; and the AI Defense Plane. CEO Nadav Zafrir said the company is expanding sales capacity for AI security.", "type": "Executive", "date": "2026-09-29", "source_url": "https://itwire.com/business-it-news/data/every-ai-agent-needs-a-human-name-on-it-check-points-brian-linder-on-closing-the-51-point-ai-security-gap"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare and Deutsche Telekom Form Strategic Partnership for Secure, Resilient European Internet", "summary": "Cloudflare and Deutsche Telekom announced a strategic partnership. Deutsche Telekom's enterprise arm, T-Systems, will add Cloudflare's security and connectivity products to its portfolio, and the two companies will connect their networks directly. The deal gives Cloudflare access to Deutsche Telekom's sales and service reach across Europe. Planned managed security services will cover digital sovereignty, protection for AI workloads, and post-quantum cryptography at scale, alongside joint solutions for European data protection and infrastructure resilience.", "type": "Partnership", "date": "2026-09-29", "source_url": "https://www.cloudflare.com/press/press-releases/2026/cloudflare-and-deutsche-telekom-join-forces-for-a-secure-and-resilient-internet/"}, {"title": "Cloudflare to Become Public Certificate Authority for the Post-Quantum Web, Acquiring GlobalSign Root", "summary": "Cloudflare announced plans to become a public Certificate Authority, issuing both traditional certificates and post-quantum Merkle Tree Certificates. It has agreed to buy publicly trusted root CA key material from GlobalSign, giving it broad device trust from day one; the deal is expected to close in about two months. Cloudflare has applied to the Chrome, Apple, Microsoft and Mozilla root programs. Production issuance of Merkle Tree Certificates is planned for Q1 2027, with classical certificates to follow once the root programs accept Cloudflare.", "type": "Acquisition", "date": "2026-09-29", "source_url": "https://www.cloudflare.com/press/press-releases/2026/cloudflare-announces-public-certificate-authority-for-the-post-quantum-web/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare Launches Adaptive Application Security for the AI Era: Vulnerability Discovery, Application Profiles, Free Threat Signals", "summary": "Cloudflare announced adaptive application security features that connect code findings, live traffic and threat intelligence. Vulnerability Discovery and Remediation (early access) uses frontier AI models to find app-specific vulnerabilities and automatically deploy WAF mitigations, ranked by how much production traffic hits the affected route. Application Profiles (closed beta) learns how a web application normally behaves and flags requests that don't fit. Threat Signals, an agentic open-source threat intelligence feature, and the Cloudforce One Threat Events Platform are now free for every Cloudflare account.", "type": "Product Launch", "date": "2026-09-29", "source_url": "https://blog.cloudflare.com/ai-era-framework/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Amazon Bedrock Managed Agents, Powered by OpenAI, Enters Preview", "summary": "AWS launched a preview of Amazon Bedrock Managed Agents, developed with OpenAI. It runs a customized OpenAI Agents API inside AWS with native IAM, governance and CloudTrail integration. Features include durable sessions, multi-step coordination, tool use, code execution, reusable skills, optional human approval, and Model Context Protocol (MCP) tool connections. Each agent gets its own IAM role, and its actions are logged in CloudTrail. The preview carries no extra charge in US East and US West regions. The same day, AWS made OpenAI's GPT-6.1 Sol generally available on Bedrock.", "type": "Product Launch", "date": "2026-09-29", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/bedrock-managed-agents-preview/"}, {"title": "Amazon Bedrock Expands In-Region Claude Model Availability to India, South Korea, and Singapore", "summary": "Amazon Bedrock now runs Claude models in-region in India, South Korea and Singapore. India gets Claude Opus 5, Sonnet 5 and Haiku 4.5, with cross-Region inference between Mumbai and Hyderabad; Seoul gets Opus 5 and Sonnet 5; Singapore gets Sonnet 5. Inference and data processing stay inside the chosen Region, meeting data-location requirements in regulated sectors such as financial services, healthcare and the public sector.", "type": "Feature Update", "date": "2026-09-29", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/claude-region-expansion-in-sk/"}]}, "AWS ~AS": {"category": "Application Security", "announcements": [{"title": "Route 53 Resolver DNS Firewall Support for Palo Alto Networks Advanced DNS Security Now Generally Available", "summary": "Amazon Route 53 Resolver DNS Firewall support for Palo Alto Networks Advanced DNS Security is now generally available in all regions where DNS Firewall is offered. Security teams can block malicious DNS traffic from VPCs, such as command-and-control, malware, phishing and newly registered domains, without extra firewalls or VPC changes. Customers enable it in the DNS Firewall console and can share licenses through AWS License Manager. Rule groups can be applied across accounts through Resource Access Manager, Route 53 Profiles or Firewall Manager.", "type": "Partnership", "date": "2026-09-29", "source_url": "https://mwpro.co.uk/blog/2026/09/29/amazon-route-53-resolver-dns-firewall-support-for-palo-alto-networks-advanced-dns-security-is-now-generally-available-ga/"}]}, "Lasso Security": {"category": "AI Security", "announcements": [{"title": "Lasso Makes Its Claude Compliance API Integration Generally Available", "summary": "Lasso made its integration with Anthropic's Claude Compliance API generally available, bringing Claude Enterprise and Claude Platform activity into the Lasso AI Security Platform. Claude users now appear in Lasso's inventory as agents, along with the MCP servers and skills they use. For Claude Enterprise, Lasso also scans conversation content for sensitive data and secrets. Security teams get per-user timelines, policy-based risk ratings, and violation alerts that can feed SIEM/SOAR tools, plus an audit trail supporting SOC 2, ISO and GDPR audits.", "type": "Feature Update", "date": "2026-09-29", "source_url": "https://www.lasso.security/blog/bringing-claude-enterprise-activity-into-lasso-with-claudes-compliance-api"}]}, "Mindgard": {"category": "AI Security", "announcements": [{"title": "Mindgard Red-Team Research Jailbreaks Moonshot's Kimi K2.6 and K3 Swarm Models", "summary": "The BBC reported Mindgard's AI red-teaming findings on Moonshot AI's open-weight Kimi K2.6 and K3 Swarm models. Mindgard's jailbreak got past the models' safety guardrails, and the models then discussed biological weapons and assassinations. Mindgard warned that a jailbroken Kimi K2.6 could run code on its hosting infrastructure and reach the internet, creating a risk of cyberattacks. Mindgard first notified Moonshot in July. Moonshot says it is reviewing the findings internally and welcomes outside input.", "type": "Research", "date": "2026-09-29", "source_url": "https://www.bbc.com/news/articles/cmrergq3j7lgo"}]}, "Akamai ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Akamai Adds SoftServe to Partner Connect Program to Speed Up Edge AI and Multicloud Deployments", "summary": "Akamai announced that SoftServe has joined the Akamai Partner Connect program. The two companies will help enterprises optimize multicloud environments, lower infrastructure costs and deploy edge AI faster. SoftServe will offer AI consulting, custom-built LLMs and SLMs, cloud strategy, and AI inferencing tuned for distributed GPU networks, plus managed services for high tech, healthcare, financial services and manufacturing, all built on Akamai's globally distributed platform.", "type": "Partnership", "date": "2026-09-29", "source_url": "https://www.stocktitan.net/news/AKAM/akamai-welcomes-soft-serve-to-partner-connect-pg71jsfu0nqw.html"}]}, "Fastly ~AS": {"category": "Application Security", "announcements": [{"title": "Fastly Unveils AEDA: Autonomous Edge Defense Agent in Google Gemini Enterprise", "summary": "Fastly launched the Autonomous Edge Defense Agent (AEDA) in Gemini Enterprise, built with Google Cloud. The AI-powered agent pairs Fastly's real-time edge telemetry with Gemini Enterprise's reasoning to give security teams fast, evidence-backed context during incidents. Fastly says this cuts mean time to resolution from hours to seconds and moves teams from reactive, rule-based defense toward autonomous response. An early access preview and demo are available.", "type": "Product Launch", "date": "2026-09-29", "source_url": "https://www.fastly.com/blog/fastly-unveils-aeda-autonomous-edge-security-gemini-enterprise"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Comcast and Fastly Embed Edge Delivery Software Inside Comcast's Network for Peacock Live Streaming", "summary": "Fastly and Comcast (NBCUniversal) will run Fastly's content and application delivery software inside Comcast's network, starting with live sports and high-demand streaming on Peacock. The system uses more than 200 Comcast edge compute centers to deliver content closer to viewers and cut duplicate traffic. Unlike a traditional CDN, it runs inside the ISP's network. Comcast sees future uses in gaming, cybersecurity, AI inference and enterprise cloud services.", "type": "Partnership", "date": "2026-09-29", "source_url": "https://in.investing.com/news/stock-market-news/comcast-fastly-partner-to-enhance-peacock-streaming-capacity-93CH-5609622"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Citrix Patches Eight NetScaler ADC/Gateway Flaws, Including Two Actively Exploited RCE Zero-Days", "summary": "Citrix released patches for eight vulnerabilities in NetScaler ADC and NetScaler Gateway. Two of them, CVE-2026-88771 and CVE-2026-88772, are critical zero-days that allow remote code execution and are being actively exploited. CISA added both to its Known Exploited Vulnerabilities catalog, and CISA and the UK NCSC warn that attacks may increase. Mandiant reports attackers used the flaws for weeks to deploy web shells, steal credentials and move laterally in government, finance, education and legal organizations.", "type": "Research", "date": "2026-09-29", "source_url": "https://www.itpro.com/cloud/cloud-security/citrix-netscaler-vulnerabilities-being-actively-exploited"}]}, "HPE / Juniper Networks ~AI": {"category": "AI Security", "announcements": [{"title": "HPE Expands NVIDIA Collaboration to Secure and Govern Agentic AI in Enterprise Production", "summary": "HPE is expanding its work with NVIDIA to secure and govern AI agents. It will integrate NVIDIA OpenShell with HPE Private Cloud AI to enforce access policies, monitor agent activity and keep auditable records. The NVIDIA Open Agent Safety Platform and Sentry, running on BlueField-4 DPUs with DOCA, add hardware-isolated, out-of-band policy enforcement. NVIDIA Confidential Computing will protect models and data in HPE AI Factory solutions, including sovereign deployments. Availability is planned for Q4 2026.", "type": "Partnership", "date": "2026-09-29", "source_url": "https://www.hpcwire.com/aiwire/2026/09/29/hpe-teams-with-nvidia-to-bring-secure-governed-agentic-ai-into-enterprise-production/"}]}, "Radware ~AI": {"category": "AI Security", "announcements": [{"title": "Radware Introduces Agent Trust Management to Help Businesses Securely Embrace the AI Agent Economy", "summary": "Radware launched Agent Trust Management to govern how AI agents interact with applications. Arguing that allow-or-block decisions are too blunt for agent traffic, the tool records what an agent says it intends to do, keeps checking that its actions match, and controls which workflows it can use. It identifies agents from several signals, with cryptographic checks for standards-compliant agents and AI-based behavior and anomaly detection. It is available now in Radware Cloud Application Protection and extends Radware's bot management to AI agents.", "type": "Product Launch", "date": "2026-09-29", "source_url": "https://www.globenewswire.com/news-release/2026/09/29/3370603/0/en/radware-introduces-agent-trust-management-to-help-businesses-securely-embrace-the-ai-agent-economy.html"}]}, "Zscaler": {"category": "Platforms", "announcements": []}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-09-29.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
