"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": []}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Unit 42 Uses Frontier-AI Agent NOVA to Find 14,000+ Open-Source Vulnerabilities", "summary": "Palo Alto Networks published Unit 42 research showing its agentic AI research system, NOVA, confirmed more than 14,000 vulnerabilities across 3,915 open-source projects in two months, with 99.4% zero-days and 40% rated high or critical. It positions Cortex Cloud software composition analysis as the remedy. Palo Alto is using the 'AI accelerates attackers' narrative to sell more platform. F5 can counter with runtime app and API protection (WAF, virtual patching) that shields vulnerable open-source components before patches land.", "type": "Research", "date": "2026-10-07", "source_url": "https://www.paloaltonetworks.com/blog/cloud-security/securing-open-source-software-in-the-frontier-ai-era/"}]}, "Fortinet": {"category": "Platforms", "announcements": []}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Unveils Agentic Collaboration Experiences at WebexOne 2026, Guarded by Cisco AI Defense", "summary": "At WebexOne 2026, Cisco launched agentic Webex experiences: digital teammates (including Claude Managed Agents), a new 'Dialog' customer-engagement agent, and Intelligent Workplace Experiences managed through Cisco Cloud Control. Webex AI Agents run inside Cisco AI Defense guardrails with Splunk telemetry. Cisco is embedding AI Defense in its own apps to showcase a combined networking, security and observability platform. F5 should emphasize AI Guardrails that work across any vendor's apps and models.", "type": "Product Launch", "date": "2026-10-07", "source_url": "https://investor.cisco.com/news/news-details/2026/Cisco-Unveils-New-Agentic-Collaboration-Experiences/default.aspx"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cisco Discloses Critical Unauthenticated RCE Flaws in Nexus 3000/9000 NX-OS and ACI Contract Bypass", "summary": "Cisco's scheduled October 7 security release includes critical remote code execution flaws in NX-OS NGOAM (CVE-2026-76485, -76486, -76501) and NX-API on Nexus 3000/9000 switches and UCS 6300, plus a DHCP contract-bypass flaw in Nexus 9000 ACI mode. No workarounds exist beyond disabling affected features or applying Live Protect shields. Nexus 9000 anchors Cisco's data center and AI fabric story; upgrade and hardening work in these accounts opens doors for F5 services and traffic-management conversations.", "type": "Other", "date": "2026-10-07", "source_url": "https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-ngoam-rce-LWKQ4BU"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Named a Leader in 2026 IDC MarketScape for Modern Endpoint Security; AIDR Business Up 79x", "summary": "CrowdStrike was named a Leader in the IDC MarketScape: Worldwide Modern Endpoint Security for Enterprises 2026. It says its AI Detection and Response (AIDR) business grew more than 79-fold in three quarters and cited Falcon Guardian for securing AI agents at the point of execution. CrowdStrike is pitching endpoint-runtime AI security as a growth line. F5 product marketing should position AI Guardrails at the app, model and API layer as a complement to endpoint controls.", "type": "Research", "date": "2026-10-07", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-named-leader-2026-idc-marketscape-modern-endpoint-security-enterprises/"}, {"title": "CrowdStrike and CyberCert Partner to Advance SMB Cybersecurity Across Australia and New Zealand", "summary": "CrowdStrike is pairing the Falcon platform with CyberCert's SMB1001 certification so MSSPs can deliver managed security bundled with certification to small and mid-sized businesses in Australia and New Zealand. Qualifying customers and partners get free certification credits for a limited time. The move shows CrowdStrike growing through MSSP channels by tying its platform to compliance frameworks. F5 channel and marketing teams in the region could consider a similar compliance-led managed-service offer.", "type": "Partnership", "date": "2026-10-07", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-cybercert-partner-to-advance-cybersecurity-for-smbs-across-australia-and-new-zealand/"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike Reports AI-Driven ARTEX Agentic Pentesting Campaign Against South Korean Finance", "summary": "CrowdStrike reports a late-September to early-October campaign against South Korean financial firms using ARTEX, an open-source agentic pentesting tool driven by LLMs such as DeepSeek v4.1-flash and GLM-5.3, alongside Claude Code sessions, resulting in data theft. CrowdStrike assesses the actor as likely Chinese-speaking but unnamed. This is concrete evidence of AI-accelerated attacks, supporting F5 messaging on AI red teaming, bot and API defense, and runtime app protection for financial services.", "type": "Research", "date": "2026-10-07", "source_url": "https://www.crowdstrike.com/en-us/blog/unknown-threat-actor-uses-artex-to-target-south-korean-finance/"}]}, "Zscaler": {"category": "Platforms", "announcements": []}, "Check Point Software": {"category": "Platforms", "announcements": []}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point Red Team Breaks 'Jev' Decision-Output AI Model in Every Configuration Tested", "summary": "Check Point researchers red-teamed Jev, an AI model that returns typed decisions instead of text. Every configuration tested could be manipulated into downgrading risk to 'low' and recommending an investment despite warning signs, at roughly $0.50 per successful attack. Typed inputs and instructions to distrust documents did little to help. The research shows decision-making AI needs continuous adversarial testing; use it to support F5 AI Red Team and AI Guardrails positioning against Check Point's Lakera-powered AI Defense Plane.", "type": "Research", "date": "2026-10-07", "source_url": "https://agihunt.info/en/p/1a117247f853e6147d97802f708"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Organizations Now Generally Available", "summary": "Cloudflare announced general availability of Cloudflare Organizations, an organization-level layer for managing multiple Cloudflare accounts, now production-ready with full support after earlier previews. It strengthens Cloudflare's enterprise platform story by simplifying multi-account governance for large customers. Expect it to surface against F5 Distributed Cloud tenant management in platform-consolidation deals.", "type": "Product Launch", "date": "2026-10-07", "source_url": "https://developers.cloudflare.com/changelog/post/2026-10-07-organizations-generally-available/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare Launches Multi-Agent AI Security Operations Harness in Managed Defense (Early Beta)", "summary": "Cloudflare introduced an agentic security operations harness in Cloudflare Managed Defense. Specialist AI agents gather evidence, correlate alert bursts and recommend actions while human analysts make the final call. It uses Cloudflare's open-source Clef decision model on Workers AI for first-pass scoring, plus OpenAI and Anthropic models for deeper analysis. Early beta is open to eligible WAF, DDoS and Magic Transit customers. Bundling AI-driven managed SOC services with WAAP raises the bar for F5 Distributed Cloud WAAP managed services.", "type": "Product Launch", "date": "2026-10-07", "source_url": "https://blog.cloudflare.com/agentic-security-operations/"}, {"title": "Cloudflare Uses Frontier-AI Attack Harness to Probe and Harden Its WAF", "summary": "InfoQ reports Cloudflare used frontier AI models in a black-box harness to mutate attack payloads its WAF already blocked. Across 45 scenarios and 1,107 mutation attempts, the effort produced 49 findings, mostly command injection and SSRF, leading to two new SSRF detections and one improved rule in the Managed Ruleset. AI-driven WAF evasion testing is becoming a competitive proof point; F5 product and PMM teams should be ready to explain how F5 WAF signatures are validated against AI-generated attack variants.", "type": "Research", "date": "2026-10-07", "source_url": "https://www.infoq.com/news/2026/10/cloudflare-sec-harness/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Config Adds 77 New Resource Types, Including Bedrock AgentCore", "summary": "AWS Config now supports 77 additional resource types across EC2, S3 Files, Q Business, Bedrock AgentCore and other services. Accounts recording all resource types track them automatically, and they work with Config rules and aggregators. AWS keeps adding native governance for AI agent infrastructure. F5 alliances and professional services teams should ensure F5 deployments on AWS fit into customers' Config-based compliance workflows.", "type": "Product Launch", "date": "2026-10-07", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-config-new-resource-types/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Claude Haiku 5.5 Launches on Amazon Bedrock at ~75% Lower Cost Than Haiku 4.5", "summary": "AWS made Anthropic's Claude Haiku 5.5 available on Amazon Bedrock, targeting subagents and high-volume, cost-sensitive workloads at about 75% lower cost than Haiku 4.5 for many tasks. It is offered via US, EU, AU, JP and global cross-region inference plus GovCloud, and integrates with IAM, CloudTrail and Bedrock Guardrails. Cheaper, high-volume agentic inference means more multi-model AI traffic to route, secure and govern, a direct opening for F5 AI Gateway and AI Guardrails with AWS customers.", "type": "Product Launch", "date": "2026-10-07", "source_url": "https://aws.amazon.com/blogs/machine-learning/introducing-claude-haiku-5-5-on-aws/"}]}, "AWS ~AI": {"category": "AI Security", "announcements": [{"title": "AWS Details Real-Time Access Control for RAG With Amazon Quick and Bedrock Knowledge Bases", "summary": "AWS published a two-layer access-control pattern for retrieval-augmented generation: documents are pre-filtered using cached access lists, then permissions are re-checked live against the source system (such as Google Drive) so unauthorized content never reaches the LLM. It works alongside Bedrock Guardrails and grounding checks. AWS is building data-leakage and authorization controls into its native AI stack; F5 should emphasize a cross-cloud, model-agnostic guardrail layer that goes beyond Bedrock-only controls.", "type": "Product Launch", "date": "2026-10-07", "source_url": "https://aws.amazon.com/blogs/machine-learning/rethinking-access-control-for-rag-with-amazon-quick-and-amazon-bedrock/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": [{"title": "Pillar Security Compares 2026 AI Agent Security Frameworks, Positions SAIL 2.0", "summary": "Pillar Security published a comparison of AI agent security frameworks, including NIST AI RMF, MITRE ATLAS, OWASP and ISO 42001, positioning its own SAIL 2.0 as the lifecycle option. SAIL 2.0 lists 91 agent risks across seven lifecycle phases, each mapped to six standards, and Pillar says its discovery, red-teaming and runtime-guardrail features enforce it. Pillar is using standards-based governance to influence buyers, challenging F5 AI Guardrails and AI Red Team; F5 should map its controls to the same standards.", "type": "Research", "date": "2026-10-07", "source_url": "https://www.pillar.security/blog/best-ai-security-frameworks-for-ai-agents-2026"}]}, "Mindgard": {"category": "AI Security", "announcements": [{"title": "Mindgard: Security Teams Need Evidence, Not Vendor Claims, on AI Threats", "summary": "In a blog post by founder and CSO Dr. Peter Garraghan, Mindgard argues AI security programs should be built on evidence of how systems behave under attack rather than vendor promises. It cites prompt and context manipulation, multi-turn attack paths, coding-environment abuse and data exposure as present-day risks requiring continuous testing. The piece reinforces Mindgard's continuous red-teaming pitch, which overlaps directly with F5 AI Red Team; F5 can answer with red-team results tied back to F5 AI Guardrails.", "type": "Other", "date": "2026-10-07", "source_url": "https://mindgard.ai/blog/when-ai-threats-become-marketing"}]}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": []}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Announces Rack-Scale Architectures for Scale-Up and Scale-Out AI Fabrics", "summary": "Arista launched a liquid-cooled, rack-scale Ethernet portfolio for AI, developed with AMD, Arm, Broadcom, d-Matrix, Meta, Microsoft and Qualcomm under the ESUN initiative. Etherlink SU-144 supports up to 144 accelerators per rack, or more than 1,024 XPUs across racks, and new 7060EX7 switches deliver 102.4 Tbps with Ultra Ethernet compliance and cluster load balancing. Arista is pushing open Ethernet deeper into AI clusters; F5 should frame BIG-IP Next for Kubernetes on NVIDIA BlueField as the inference-aware layer above the fabric.", "type": "Product Launch", "date": "2026-10-07", "source_url": "https://www.arista.com/en/company/news/press-release/24818-pr-20261007"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "HPE Launches Four AMD EPYC-Powered ProLiant Gen13 Servers for Agentic AI and Inference", "summary": "HPE announced four ProLiant Gen13 servers on 6th Gen AMD EPYC processors (DL525, DL585a, XD245 and XD285) targeting agentic AI, inference, analytics and HPC, with more cores, higher memory bandwidth, PCIe Gen6, post-quantum readiness and iLO 8 management. Availability runs from late 2026 into 2027. HPE is bundling compute, Juniper networking and financing into full on-prem AI stacks; F5 alliances and field teams should position F5 AI Data Delivery and AI Guardrails as the vendor-neutral traffic and security layer.", "type": "Product Launch", "date": "2026-10-07", "source_url": "https://business.am-news.com/am-news/article/bizwire-2026-10-7-hpe-accelerates-enterprise-ai-innovation-with-next-generation-amd-cpu-powered-servers"}]}, "HPE / Juniper Networks ~P": {"category": "Platforms", "announcements": [{"title": "HPE Networking Chief Touts Unified Juniper Channel Program and 'Lead-to-Cash' Overhaul", "summary": "HPE Networking EVP Rami Rahim said Juniper partners will join HPE's Partner Ready Vantage program on November 1, letting all 60,000 HPE partners sell the combined Aruba, Mist and Juniper portfolio; only about 10% of the two partner bases previously overlapped. Integrated quoting and ordering launch in November, with supply chain unification targeted for end of 2027. A much larger HPE channel will push campus, branch and data center cross-sell, so F5 partner and alliance teams should expect more competition for shared resellers.", "type": "Partnership", "date": "2026-10-07", "source_url": "https://www.sdxcentral.com/news/hpe-networking-chief-touts-channel-partner-opportunity-teases-lead-to-cash-program/"}]}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware Named a Leader in 2026 IDC MarketScape for Worldwide Web Application and API Protection Platforms", "summary": "IDC named Radware a Leader in its 2026 MarketScape for Worldwide Web Application and API Protection (WAAP) Platforms. Radware will likely use this third-party validation in competitive WAF and API security deals where F5 Distributed Cloud WAAP and Advanced WAF compete. Product marketing should review F5's placement in the same report and refresh battlecards and proof points accordingly.", "type": "Research", "date": "2026-10-07", "source_url": "https://www.globenewswire.com/news-release/2026/10/07/3376276/0/en/radware-named-a-leader-in-2026-idc-marketscape-for-worldwide-web-application-and-api-protection-platforms.html"}, {"title": "Radware Schedules Q3 2026 Earnings Conference Call for October 28", "summary": "Radware will report Q3 2026 results and provide its Q4 outlook on a conference call on October 28, 2026, at 8:30 a.m. EDT. The release describes Radware as a provider of AI-driven application security and delivery for multi-cloud environments. The call will offer insight into demand for Radware's cloud security services, DDoS and WAAP offerings, which compete directly with F5's application security portfolio.", "type": "Financial", "date": "2026-10-07", "source_url": "https://www.globenewswire.com/news-release/2026/10/07/3376270/0/en/radware-schedules-conference-call-for-its-third-quarter-2026-earnings.html"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": []}, "Barracuda Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Barracuda Research: Phishing Emails Target Both Humans and AI Assistants in the Same Message", "summary": "Barracuda Research found phishing emails that combine social engineering aimed at people, such as password-protected attachments, with hidden prompt injections aimed at AI email assistants, concealed via HTML comments, invisible CSS text and zero-width characters. Barracuda is using the finding to promote Email Gateway Defense, Behavioral AI and Automated Threat Response. It shows prompt injection now arrives through everyday content, strengthening the case for F5 AI Guardrails to inspect inputs before AI agents act on them.", "type": "Research", "date": "2026-10-07", "source_url": "https://blog.barracuda.com/2026/10/07/email-attacks-target-both-humans-ai-assistants"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-10-07.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
</html>
