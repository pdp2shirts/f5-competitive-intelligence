"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "China's Cyberspace Administration Opens Security Review Into Palo Alto Networks Products", "summary": "China's Cyberspace Administration launched a cybersecurity review of Palo Alto Networks products, saying the probe aims to ensure safe operation of critical information infrastructure and safeguard national security. Beijing gave no specific reason, and observers compared the action to the 2023 Micron review. Palo Alto Networks said there is no impact on its ability to support customers or deliver products in the region. The move raises questions about the vendor's access to Chinese critical-infrastructure accounts where domestic suppliers offer overlapping capabilities.", "type": "Security Advisory", "date": "2026-08-07", "source_url": "https://www.theregister.com/security/2026/08/07/china-launches-mysterious-probe-into-security-of-palo-alto-networks-products/5284453"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Prisma AIRS Runtime API Natively Integrates With OpenAI Codex", "summary": "Palo Alto Networks announced a native integration between the Prisma AIRS Runtime API and OpenAI Codex, extending centralized AI security governance to AI-assisted coding. Codex prompts are inspected in real time through AIRS without heavy client-side hooks, letting organizations enforce data-loss prevention and threat controls org-wide while preserving developer velocity. The integration builds on Palo Alto's wider OpenAI collaboration, including the Daybreak Cyber Partner Program. Setup uses an AIRS API key and endpoint configured in the Codex Global Admin Console, demoed at Black Hat 2026.", "type": "Partnership", "date": "2026-08-07", "source_url": "https://www.paloaltonetworks.com/blog/2026/08/strengthening-security-of-ai-coding-prisma-airs-api-integration-with-openai-codex/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Pushes Unified Network Security Platform and AI Governance at Black Hat 2026", "summary": "At Black Hat 2026, Fortinet executives outlined a converged network security platform strategy built on the Fortinet Security Fabric, arguing that natively integrated components sharing a single data model beat bolted-on tool collections. The next phase is a SASE Firewall that merges secure access edge and next-generation firewall across on-premises and cloud with consistent policy. Fortinet also detailed governance for internal AI workloads, covering AI factories, sanctioned agents, MCP servers, token usage and machine-to-machine traffic, with monitoring for compliance and data integrity.", "type": "Executive", "date": "2026-08-07", "source_url": "https://siliconangle.com/2026/08/07/network-security-platform-ai-governance-fortinet-blackhat/"}, {"title": "FortiOS 7.6 Earns IEC 62443-4-2 Security Level 4 Certification", "summary": "Fortinet announced that FortiOS v7.6.x achieved IEC 62443-4-2 Security Level 4, the standard's highest product security level, for OT, critical infrastructure and industrial automation environments. The certification spans all seven foundational requirement categories, including identification and authentication, access control, system integrity, data confidentiality, restricted data flow, timely event response and resource availability, across software, embedded, host and network device evaluations. It complements Fortinet's earlier IEC 62443-4-1 ML2 validation, providing independent evidence of secure-by-design development for industrial buyers.", "type": "Award", "date": "2026-08-07", "source_url": "https://www.isssource.com/fortinet-earns-security-level-4-certification/"}, {"title": "Fortinet Raises 2026 Guidance on AI Security and SASE Momentum", "summary": "Coverage of Fortinet's raised full-year 2026 outlook put guidance at $8.02-$8.18 billion, roughly 19% year-over-year growth, following strong Q2 results. The stock has climbed on improved revenue, an optimistic AI security and SASE outlook, and investor focus on Fortinet's position securing AI infrastructure. Analysts flagged valuation risk, noting shares trading near 60x earnings and roughly 16-18x price-to-sales, leaving limited room for error if macro conditions weaken or data-center spending slows.", "type": "Financial", "date": "2026-08-08", "source_url": "https://finance.yahoo.com/markets/stocks/articles/fortinet-ftnt-lifted-2026-guidance-201009350.html"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Launches Talent Bridge to Power Partner Growth Through Skills-Based Connections", "summary": "Cisco introduced Talent Bridge, a skills-based talent platform designed to strengthen partner growth by connecting early-career talent from Cisco's learning ecosystem with partner organizations. The program launches first in the United States and Mexico, with expansion planned to the United Kingdom, Spain, the Philippines, India and South Africa, and broader rollout through 2027. Cisco positioned the platform as a way to sustain partner talent pipelines and streamline how partners discover, engage and onboard skilled candidates across its global channel ecosystem.", "type": "Partnership", "date": "2026-08-07", "source_url": "https://www.accessnewswire.com/newsroom/en/industrial-and-manufacturing/cisco-powering-partner-growth-through-skills-based-talent-connections-1204594"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Draws Investor Focus as Fal.Con 2026 Sells Out Ahead of Q2 Earnings", "summary": "Analyst coverage highlighted CrowdStrike's momentum heading into its August 26, 2026 earnings, citing a rapidly sold-out Fal.Con 2026 conference and a newly launched global AI security challenge run with AWS. Both moves reinforce the company's AI-centric security positioning, which has supported strong one-year and three-year share performance. The piece cautioned that valuation leaves little margin for error, flagging risks if newer offerings such as Falcon Flex underperform or if competitive cloud-security spending compresses margins.", "type": "Financial", "date": "2026-08-07", "source_url": "https://simplywall.st/stocks/us/software/nasdaq-crwd/crowdstrike-holdings/news/is-crowdstrike-holdings-crwd-fully-valued-as-falcon-2026-and"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike Warns AI Adoption Is Creating 'Underdefended' Attack Surfaces", "summary": "CrowdStrike research warned that rapid enterprise AI adoption is opening underdefended attack surfaces and compressing exploit timelines. Attackers use AI to generate malicious code, automate operations, abuse enterprise AI services and target software supply chains, with one campaign firing roughly 200,000 requests at an AI model service in minutes. AI-triggered detections now outnumber human-led leads by 2.5x, increasing analyst workload. Patch windows are collapsing: 88% of observed exploitation of public proof-of-concept code occurred within 48 hours.", "type": "Research", "date": "2026-08-07", "source_url": "https://www.techticker.net/2026/08/07/crowdstrike-warns-ai-adoption-is-creating-underdefended-attack-surfaces/"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler ThreatLabz Details Which Employee Roles Ransomware Crews Target First", "summary": "Zscaler ThreatLabz researcher Brett Stone-Gross shared early findings from a real-world ransomware campaign, showing attackers deliberately select victims by role rather than at random. The research found manager-level and business-privileged staff in finance, sales, operations, HR and marketing were disproportionately targeted for initial access and lateral movement. The findings preview the forthcoming ThreatLabz 2026 Ransomware Report and reinforce Zscaler's Zero Trust messaging around least-privilege access, segmentation of critical business functions and tighter monitoring of privileged business users.", "type": "Research", "date": "2026-08-07", "source_url": "https://www.scworld.com/resource/zscalers-brett-stone-gross-on-which-roles-are-targeted-in-ransomware-attacks"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point CEO: AI Is Rewriting Cyber Defence", "summary": "In an executive interview published during Black Hat week, Check Point's CEO laid out how AI is reshaping both attack and defence, positioning the company's AI Defense Plane and hybrid mesh architecture as the strategic response. The discussion frames AI-driven activity, including prompts, model calls and autonomous agent actions, as a new enterprise attack surface requiring platform-level visibility and governance rather than point tools. It reinforces Check Point's consolidation strategy across network, cloud, workspace and AI security.", "type": "Executive", "date": "2026-08-07", "source_url": "https://www.frontier-enterprise.com/check-point-ceo-ai-is-rewriting-cyber-defence/"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Introducing Radar Researcher: An AI Tool for Exploring Internet Data in Plain Language", "summary": "Cloudflare launched Radar Researcher in beta, an AI assistant inside Cloudflare Radar that lets anyone query its Internet measurement data catalog in plain language instead of technical query syntax. Users can track evolving events such as government Internet shutdowns by asking across multiple datasets and refreshing results as situations develop. Built on Cloudflare's own developer platform, the tool is available now via the Researcher button in the Radar header, with more datasets, analysis capabilities and integrations planned.", "type": "Product Launch", "date": "2026-08-07", "source_url": "https://blog.cloudflare.com/introducing-radar-researcher/"}, {"title": "Cloudflare Announces Ambassadors, Community Engineers and Another $1M in Open-Source Funding", "summary": "Cloudflare refreshed its developer community program, introducing a Cloudflare Ambassadors track and a Community Engineers initiative to deepen engagement with builders on its platform. Alongside the program changes, the company committed another $1 million in funding to open-source projects it depends on and that its developer ecosystem relies upon. The move reinforces Cloudflare's developer-platform strategy as it pushes Workers, Agents and its wider Agentic Internet stack.", "type": "Partnership", "date": "2026-08-07", "source_url": "https://blog.cloudflare.com/community-program-refresh/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Unveiling Good and Bad Behaviors on the Agentic Internet", "summary": "Cloudflare's Web Integrity & Trust team detailed Precursor, a CDN-injected client-side detection system that continuously evaluates behavioral signals throughout a session rather than at a single checkpoint, making evasion harder. Cloudflare reported 206 million evaluation events across 73,438 zones in a 24-hour window and released a Precursor Trace demo showing how cursor acceleration, correction and rhythm are scored. It also previewed Adaptive Intelligence, a self-updating bot detection engine that retrains on live traffic and will roll out to all Bot Management customers.", "type": "Product Launch", "date": "2026-08-07", "source_url": "https://blog.cloudflare.com/good-and-bad-agentic-behaviors/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "Amazon EC2 R8i and R8i-Flex Instances Now Available in Europe (Milan)", "summary": "AWS expanded availability of its memory-optimized EC2 R8i and R8i-Flex instances to the Europe (Milan) region. Powered by custom Intel Xeon 6 processors, the instances deliver up to 15% better price-performance and 2.5x the memory bandwidth of prior-generation Intel instances, with up to 20% higher performance than R7i and larger gains on PostgreSQL, NGINX and deep learning recommendation workloads. R8i-Flex is the first memory-optimized Flex family, offered from large through 16xlarge plus bare metal and a new 96xlarge size.", "type": "Product Launch", "date": "2026-08-07", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/08/amazon-ec2-r8i-r8i-flex/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "AWS Adds Persistent Runtime Instances for Production AI Agents", "summary": "AWS made AgentCore runtime instances generally available, letting customers run production AI agents on dedicated EC2 capacity instead of only ephemeral microVMs. Capacity providers allow selection of GPU, memory-optimized or compute-optimized instance types, while AgentCore handles provisioning, patching, scaling and lifecycle management. Sessions can persist up to 14 days, targeting long-running agentic workloads that previously hit runtime limits. The release strengthens AWS's position as the serving and routing layer for enterprise AI inference and agent workloads.", "type": "Product Launch", "date": "2026-08-07", "source_url": "https://stechtimes.com/en/article/aws-adds-persistent-runtime-instances-for-production-ai-agents-msiabhf2"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Akamai Q2 2026 Earnings Call Highlights: Record Cloud Growth Alongside Delivery Declines", "summary": "Coverage of Akamai's Q2 2026 earnings call detailed revenue of $1.10 billion, up from $1.04 billion a year earlier, with security and cloud infrastructure offsetting continued erosion in traditional content delivery. Cloud Infrastructure Services grew 39% year over year to $99.3 million while security revenue reached $604 million. Non-GAAP EPS of $1.59 beat consensus, though GAAP net income fell to $79.4 million on higher costs tied to AI capacity buildout.", "type": "Financial", "date": "2026-08-07", "source_url": "https://finance.yahoo.com/markets/stocks/articles/akamai-technologies-inc-akam-q2-051152539.html"}]}, "Akamai ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "AKAM Q2 Deep Dive: Cloud Infrastructure Commitments Drive Revenue, Margin Pressures Emerge", "summary": "A deep-dive analysis of Akamai's quarter highlighted more than $2.8 billion in multiyear Cloud Infrastructure Services commitments, including a $600 million GPU deal and an Anthropic contract, funded partly by $3.5 billion of zero-coupon convertible notes. Management flagged a six-to-nine-month lag before large AI and inference deals convert to revenue, and analysts noted elevated capex is compressing near-term margins even as AI-driven delivery demand accelerates.", "type": "Financial", "date": "2026-08-07", "source_url": "https://business.theeveningleader.com/theeveningleader/article/stockstory-2026-8-7-akam-q2-deep-dive-cloud-infrastructure-commitments-drive-revenue-margin-pressures-emerge"}, {"title": "Akamai Stock Slides As Profit Shrinks Under AI Buildout Costs", "summary": "Akamai shares fell as investors weighed shrinking GAAP profitability against the company's aggressive AI infrastructure buildout. Coverage noted Cloud Infrastructure Services up 39% year over year and security up 10%, aided by Zero Trust, micro-segmentation and NVIDIA and LayerX ties, but flagged that heavy GPU and edge inference capex is weighing on earnings quality. Bears question whether AI-driven delivery upside will translate into stronger near-term earnings.", "type": "Financial", "date": "2026-08-08", "source_url": "https://simplywall.st/stocks/us/software/nasdaq-akam/akamai-technologies/news/akamai-akam-stock-slides-as-profit-shrinks-under-ai-buildout"}]}, "Akamai ~AI": {"category": "AI Security", "announcements": [{"title": "Akamai Launches Workforce Protector to Secure Enterprise AI Adoption", "summary": "Akamai's Workforce Protector, built on its LayerX acquisition, extends the platform to govern enterprise AI usage at the point of interaction. It detects shadow AI, enforces adaptive policies inside browser sessions, and blocks sensitive data from being uploaded to unauthorized AI models or downloaded to endpoints. Akamai positions it as filling gaps left by SSE, CASB and DLP, deployable without changing browsers or network architecture.", "type": "Product Launch", "date": "2026-08-07", "source_url": "https://www.ai-market-watch.com/news/akamai-launches-workforce-protector-to-enhance-enterprise-security-for-safe-ai-a-fqt9n4"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Fastly Releases Terraform Provider v9.5.1 with Delivery Configuration Fixes", "summary": "Fastly shipped version 9.5.1 of its Terraform provider, fixing ordering bugs in infrastructure-as-code deployments. Healthcheck blocks are now processed before backend blocks in service_compute, and dictionary and response_object blocks are processed before rate_limiter blocks in service_vcl, so resources referencing newly created objects no longer fail within the same apply. The release also updates the go-fastly build dependency to v17.2.0.", "type": "Product Launch", "date": "2026-08-07", "source_url": "https://newreleases.io/project/github/fastly/terraform-provider-fastly/release/v9.5.1"}, {"title": "Fastly Stock Falls As Profit Spike Meets Durability Doubts", "summary": "Fastly shares slid despite a strong Q2, as investors questioned the durability of its profit inflection. The quarter delivered $183.3 million revenue, up 23%, with security up 43% to $41.7 million on triple-digit DDoS and bot management growth, and record 63.3% GAAP gross margin. Concerns centered on rising customer concentration, with the top ten customers now 37% of revenue versus 31% a year ago.", "type": "Financial", "date": "2026-08-07", "source_url": "https://simplywall.st/stocks/us/software/nasdaq-fsly/fastly/news/fastly-fsly-stock-falls-as-profit-spike-meets-durability-dou"}]}, "Citrix (NetScaler) ~AS": {"category": "Application Security", "announcements": [{"title": "Citrix NetScaler Flaw CVE-2026-8451 Exploited Within 24 Hours of Disclosure", "summary": "Analysis of CVE-2026-8451, a pre-authentication memory overread in NetScaler ADC and Gateway configured as a SAML identity provider, rated CVSS 8.8. Crafted requests to /saml login endpoints leak memory fragments including live session cookies. Found by watchTowr Labs, exploitation began within roughly 24 hours of disclosure. It is the fourth CitrixBleed-style session-handling flaw, following CVE-2026-3055 and CVE-2025-5777, with patches issued June 30, 2026.", "type": "Security Advisory", "date": "2026-08-09", "source_url": "https://tech-insider.org/citrix-netscaler-cve-2026-8451/"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "A10 Networks Lifts 2026 Guidance After AI Security Demand Growth", "summary": "A10 raised full-year 2026 revenue growth guidance to 12-14% from 10-12% and EPS growth to 14-16%, citing demand for integrated security and traffic management in AI environments. Q2 revenue grew 15%, the fourth double-digit quarter in five. The company highlighted an expanded multi-year Microsoft agreement with mutual performance commitments and the TrojAI acquisition, which adds red teaming and runtime AI protection to its portfolio.", "type": "Financial", "date": "2026-08-07", "source_url": "https://dailymarketupdates.com/briefs/2026-08-07-a10-networks-lifts-2026-guidance-after-ai"}]}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista's New 7060XE7 and 7800 AI Spine Platforms Seen Expanding Its AI Networking TAM", "summary": "Analyst coverage examined Arista's newly launched AI networking platforms, including the 7060XE7 Series of 1.6 Tbps Etherlink AI fabric switches delivering up to 100 Tbps of system bandwidth with liquid-cooled options, and the 7800 AI Spine that lets customers scale AI clusters without adding network tiers. The coverage argues the portfolio expands Arista's addressable market across scale-up, scale-out and scale-across AI deployments, supporting both traditional AI training clusters and geographically distributed AI environments.", "type": "Research", "date": "2026-08-07", "source_url": "https://www.zacks.com/stock/news/2971266/how-aristas-new-ai-platform-could-expand-anets-growth-story"}, {"title": "Arista's Competitive Threat Reframed as NVIDIA Spectrum-X Gains Ethernet Share", "summary": "An analysis argued the real competitive risk to Arista is not conventional switching rivals but NVIDIA's data-center Ethernet push. NVIDIA captured 21.5% of Q1 2026 data-center Ethernet switch revenue with 192.7% year-over-year growth by selling AI factories, integrated GPU systems bundled with switches and software, rather than displacing Arista box-for-box. The piece frames this as an additive market shift that could reshape how AI networking fabrics are purchased over the long term.", "type": "Research", "date": "2026-08-08", "source_url": "https://www.ainvest.com/news/arista-rising-competition-problem-isn-2608/"}, {"title": "Investors React to Arista's Earnings Beat and New AI Ethernet Platforms", "summary": "A market analysis reviewed investor reaction to Arista's Q2 2026 results and its new AI-focused Ethernet platforms. Arista posted $3.036 billion in revenue and $1.213 billion in net income, with Q3 guidance near $3.3 billion. The piece credits the 7060XE7 Series and 7800 AI Spine launches with expanding Arista's addressable market across scale-up, scale-out and distributed AI clusters, while flagging customer concentration among a few hyperscale AI buyers and execution risk from rapid product cycles.", "type": "Financial", "date": "2026-08-09", "source_url": "https://simplywall.st/stocks/us/tech/nyse-anet/arista-networks/news/how-investors-are-reacting-to-arista-networks-anet-earnings"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": []}, "Radware": {"category": "Application Security", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Opens Five Cybersecurity Centers of Excellence Across Karnataka, India", "summary": "Barracuda announced the opening of five Cybersecurity Centers of Excellence at engineering colleges across Karnataka, India, spanning Bagalkot, Vijayapura, Tumkur, Mysore and Moodbidri. The centers aim to close the gap between academic coursework and real-world security practice by giving students hands-on exposure to industry security technologies, with a deliberate focus on Tier-2 and Tier-3 cities. Barracuda positions the initiative as addressing the shortage of skilled cybersecurity professionals and building a talent pipeline in underserved regions.", "type": "Partnership", "date": "2026-08-07", "source_url": "https://blog.barracuda.com/2026/08/07/barracuda-cybersecurity-centers-of-excellence-india"}, {"title": "Barracuda Research: AI Assistants Turn One Compromised Mailbox Into $250K CEO Fraud", "summary": "Barracuda detailed a controlled proof-of-concept showing how a single compromised employee account with an AI assistant can escalate to CEO fraud and fraudulent wire transfers totaling $250,000. Researchers used a Copilot-style assistant to establish persistence, map the organization, surface relevant conversations, generate phishing messages matching the victim's writing style, and then manipulate finance approvals after compromising the CEO's mailbox. Barracuda concludes AI-enabled mailboxes magnify attacker speed and scale rather than granting new privileges.", "type": "Research", "date": "2026-08-07", "source_url": "https://enterprisetimes.in/latest-news/thanks-to-ai-assistants-a-compromised-email-account-can-escalate-into-ceo-fraud/"}, {"title": "Barracuda Warns Calendar Invites Are Being Weaponized for Phishing via .ics Files", "summary": "Barracuda warned that attackers are increasingly abusing .ics calendar invites to bypass traditional email defenses. Malicious invites carry phishing links, QR codes and business-themed lures covering HR, payroll and policy notices that harvest credentials, including through adversary-in-the-middle platforms. Warning signs include unexpected .ics attachments, organizer mismatches, embedded HTML and unusual sign-in or OAuth activity. Barracuda advises treating calendar invites as active content, parsing ICS metadata and decoded QR codes, and enforcing phishing-resistant MFA.", "type": "Research", "date": "2026-08-07", "source_url": "https://australiancybersecuritymagazine.com.au/barracuda-warns-calendar-invites-are-being-used-for-phishing-via-ics-files/"}, {"title": "Barracuda Reports LogoKit Phishing-as-a-Service Now Builds Personalized Fake Login Pages", "summary": "Barracuda research showed the LogoKit phishing-as-a-service platform has evolved into a real-time deception tool that generates individually tailored phishing pages. Rather than serving one generic fake login, LogoKit uses the victim's email address and domain to impersonate their corporate environment, pulling company logos, favicons and live screenshots of the real site from legitimate commercial web services. Stolen credentials are exfiltrated over Telegram while victims are redirected to the genuine site to avoid suspicion.", "type": "Research", "date": "2026-08-07", "source_url": "https://enterprisetimes.in/latest-news/phishing-platform-logokit-focuses-on-personalized-attacks/"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}};
