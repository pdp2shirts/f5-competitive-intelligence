"use strict";
var DATA={"Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cisco Extends MACsec Encryption to 800ZR Coherent Optics for Secure AI Networks", "summary": "Cisco detailed a silicon-to-optics platform strategy for the agentic AI era, arguing AI agents can drive up to 450% more network traffic than traditional workflows, with roughly 70% coming from AI inference. Cisco says securing that traffic matters as much as transporting it, and is extending MACsec (IEEE 802.1AE) link encryption to the optical layer via 800ZR coherent pluggables so operators can secure high-capacity optical transport without adding separate encryption devices. Cisco also highlighted quantum-resistant cryptographic readiness and is demonstrating the optical, routing, and secure transport portfolio at ECOC 2026.", "type": "Product Launch", "date": "2026-09-21", "source_url": "https://blogs.cisco.com/news/the-ai-era-demands-more-than-speed-building-secure-intelligent-networks-from-silicon-to-optics"}, {"title": "Cisco Posts Industry-First Multi-Vendor MLPerf Inference Results Across NVIDIA and AMD Accelerators", "summary": "Cisco published what it calls the industry's first MLPerf Inference submission spanning multiple accelerator vendors, running distributed inference across eight NVIDIA H200 GPUs and eight AMD Instinct MI350X GPUs connected over a Cisco Silicon One G200 Ethernet fabric for MLPerf Inference v6.1. Using vLLM-based distributed inference, Cisco reported up to 104.7% of the combined standalone throughput of the two pools, indicating no net penalty for cross-architecture operation. Cisco positions the result as proof that standard Ethernet fabrics can pool heterogeneous GPUs, improving inference unit economics and freeing enterprises from single-vendor accelerator lock-in.", "type": "Research", "date": "2026-09-21", "source_url": "https://blogs.cisco.com/datacenter/industrys-first-mlperf-inference-benchmarking-across-multi-vendor-accelerators"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco 2026 Global AI Partner Study Finds AI Security Awareness Falling as Advisory Demand Surges", "summary": "Cisco released its 2026 Global AI Partner Study, surveying 1,702 partners across 30 countries. Partner awareness of AI-specific security threats fell to 29% from 35% a year earlier, while security and compliance ranked as partners' second-largest internal skills gap and cybersecurity emerged as a top customer AI talent gap. Governance and explainability remain weak: partners can identify AI risks but struggle to explain model decisions or demonstrate regulatory compliance. Advisory and consulting services grew from 12% to 50% of partner opportunity. Cisco is responding with an AI-Era Cyber Defense Partner Hub and its 360 Partner Program.", "type": "Research", "date": "2026-09-21", "source_url": "https://blogs.cisco.com/partner/partner-study-shows-a-maturing-ai-market-expanding-opportunity-for-partners"}, {"title": "Cisco Identity Services Engine Authentication Bypass CVE-2026-76460 Under Active Exploitation", "summary": "Singapore's Cyber Security Agency and multiple advisories flagged active in-the-wild exploitation of CVE-2026-76460, a maximum-severity authentication bypass (CVSS 10.0) in Cisco Identity Services Engine and ISE Passive Identity Connector. Successful exploitation can grant highly privileged root-level access and remote command execution, and the flaw affects all configurations with no available workaround. Cisco has released fixed releases and urges immediate upgrade; organizations still running ISE 3.0, which has reached end of maintenance, must migrate to a supported fixed train. Defenders are advised to verify affected versions against Cisco's advisory urgently.", "type": "Threat Intel", "date": "2026-09-21", "source_url": "https://www.csa.gov.sg/alerts-and-advisories/alerts/al-2026-126/"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "Horizon3 Integrates NodeZero Exposure Validation with CrowdStrike Falcon Next-Gen SIEM", "summary": "Horizon3 announced an integration that feeds validated NodeZero findings into CrowdStrike Falcon Next-Gen SIEM, now available in the CrowdStrike Marketplace. Validated exposure data showing genuinely exploitable attack paths can be correlated with endpoint, identity, and cloud telemetry inside Falcon investigations, helping analysts prioritize which findings matter and tune policy accordingly. The integration closes the loop between proactive offensive validation and runtime protection, reinforcing CrowdStrike's strategy of pulling third-party security signals into Falcon Next-Gen SIEM as the central data and correlation layer rather than leaving validation results in a separate console.", "type": "Partnership", "date": "2026-09-21", "source_url": "https://www.securitysolutionsmedia.com/2026/09/21/horizon3-announces-integration-with-crowdstrike-falcon-next-gen-siem/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet FortiCloud SSO Flaws Still Exploited, Leaving 10,000+ Devices Exposed", "summary": "A report warned that critical FortiCloud SSO vulnerabilities CVE-2025-59718 and CVE-2025-59719 (CVSS 9.8) remain actively exploited, leaving more than 10,000 devices worldwide at risk. Attackers can bypass authentication using crafted SAML messages to obtain full administrative access, create rogue accounts, and exfiltrate firewall configurations. Patches through FortiOS 7.4.10 proved insufficient, with comprehensive fixes pending in FortiOS 7.4.11, 7.6.6, and 8.0.0. Affected products span FortiOS, FortiProxy, FortiSwitchManager, and FortiWeb. Recommended interim mitigations include disabling FortiCloud SSO login, rotating admin accounts, and auditing configurations for unauthorized changes.", "type": "Threat Intel", "date": "2026-09-21", "source_url": "https://www.ctrlaltnod.com/news/fortinet-sso-exploit-over-10-000-devices-at-risk-despite-patches/"}]}, "Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Morgan Stanley Lifts Palo Alto Networks Target to $410, Citing AI Security Demand and Consolidation", "summary": "Morgan Stanley raised its Palo Alto Networks price target to $410 from $394, keeping an Overweight rating and naming PANW its preferred cybersecurity pick. The thesis is that enterprise AI adoption will expand security spending while pushing customers to consolidate onto fewer vendors, with AI security products, identity management, and SIEM as the main growth drivers toward a roughly $300 billion cybersecurity software market by 2028. Morgan Stanley expects Palo Alto to gain about 75 basis points of share over two years versus consensus expectations of a 50 basis point decline.", "type": "Financial", "date": "2026-09-21", "source_url": "https://finviz.com/news/393715/morgan-stanley-raises-palo-alto-networks-price-target-to-410-on-ai-security-demand"}]}, "Zscaler ~AI": {"category": "AI Security", "announcements": [{"title": "Zscaler AI Bookings Jump More Than 50% Sequentially as Security for AI Scales", "summary": "Coverage of Zscaler's Q4 FY2026 results highlighted Security for AI bookings growing more than 50% sequentially, with AI Protect bookings surpassing $100 million over the trailing twelve months. Roughly 70% of Security for AI deals also attach Data Security. Q4 revenue was $898.2 million, up 25% year over year, and ARR reached $3.77 billion, also up 25%. Newer products include Zero Trust Exchange for Agents and Endpoint AI Security, with broader scaling expected in the second half of FY2027. FY2027 guidance implies roughly 17% revenue growth, materially slower than FY2026.", "type": "Financial", "date": "2026-09-21", "source_url": "https://sg.finance.yahoo.com/news/zscalers-ai-bookings-jump-50-130400163.html"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point Research Says Agent Security Must Watch Behavior, Not Just Attackers", "summary": "Check Point published research arguing AI agents can cause harm without any attacker present, simply by acting on their context. Across a two-day internal hackathon with 19 R&D teams, three independent demonstrations converged on the same conclusions: agents improvise when they hit walls, every file, page, and message in an agent's context is an attack surface, and blocking is not the only guardrail \u2014 steering an agent back to its intended task preserves security with less productivity loss. Check Point paired the post with a white paper covering context poisoning and runtime protection for production agents.", "type": "Research", "date": "2026-09-21", "source_url": "https://blog.checkpoint.com/ai-security/no-attacker-required-what-a-two-day-hackathon-taught-us-about-agent-security/"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Patches CVSS 9.8 Unauthenticated Root RCE in Security Management and Log Servers", "summary": "Check Point issued an emergency patch for CVE-2026-91843, a CVSS 9.8 stack-based buffer overflow in the Security Management Server and Log Server login process (R80\u2013R82) that gives unauthenticated attackers root access over the internet. It is the third critical Check Point flaw disclosed in two weeks; two earlier bugs, CVE-2026-50751 and CVE-2026-16232, are already exploited in the wild, and CVE-2026-85103 and CVE-2026-85102 were patched the prior week. Check Point issued patches plus interim guidance to restrict management console access to trusted IP addresses until customers can upgrade.", "type": "Threat Intel", "date": "2026-09-21", "source_url": "https://threatvectr.com/story/check-point-patches-critical-login-flaw-that-hands-attackers-root-on-firewall"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare Makes Python Workers Generally Available on Its Developer Platform", "summary": "Cloudflare announced that Python Workers are generally available, making Python a first-class, fully supported language on the Cloudflare Developer Platform two years after its initial preview. Developers can bring existing Python code and libraries and run popular frameworks including FastAPI, Django, and Flask directly inside Workers. Python Workers support native bindings to Workers AI, R2, D1, Hyperdrive, Durable Objects, Queues, and Workflows, and a Python Worker can be created from inside another Worker using Dynamic Workers. The release removes the prior requirement for JavaScript glue code when running Python at Cloudflare's edge.", "type": "Product Launch", "date": "2026-09-21", "source_url": "https://blog.cloudflare.com/python-workers-ga/"}, {"title": "Cloudflare Proposes an Agent Development Lifecycle to Replace the Traditional SDLC", "summary": "Cloudflare introduced the Agent Development Lifecycle (ADLC), a model in which AI agents autonomously handle development, testing, deployment, and maintenance instead of human-gated pipelines. Components include Workflows as the orchestration layer that spawns containers and dispatches subagents, @cloudflare/ci as a CI/CD system running on Workflows with autonomous failure triage and remediation, OpenTelemetry-compatible observability capturing model calls, tool executions and token usage with session replay, and an Agent Access Model issuing short-lived task-bound credentials with least-privilege enforcement and a Trust Ratchet that progressively reduces agent capabilities.", "type": "Product Launch", "date": "2026-09-21", "source_url": "https://www.infoq.com/news/2026/09/cloudflare-adlc-agents/"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Adds Per-Worker Scoped Access Roles from the Dashboard", "summary": "A Cloudflare changelog entry added the ability to grant teammates scoped access to individual Workers directly from the Workers dashboard. Administrators open a Worker, choose Invite, enter an email address, and select one of four access levels: Metadata Read-Only (settings, metrics, logs, traces but no code or deploy), Content Read-Only (read code, settings, and observability data with no modify or deploy), Editor (update and deploy but not delete), or Admin (Editor plus delete). Existing account members gain access immediately; others receive an invitation. Only Super Administrators can issue invites from a Worker's dashboard.", "type": "Product Launch", "date": "2026-09-21", "source_url": "https://developers.cloudflare.com/changelog/post/2026-09-21-invite-members-to-workers/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "AWS Releases Strands Harness, an Open-Source Multi-Cloud AI Agent Harness", "summary": "AWS debuted Strands Harness, an open-source, general-purpose agent harness built on the Strands Harness SDK that deploys in any environment including AWS, Google Cloud, Azure, Modal, and Cloudflare. It ships Python and TypeScript libraries, a CLI, and a skills file with shell, file, and web tools, and works with any AI model provider. AWS claims near-parity benchmark scores with Claude Code and Codex on Harbor tests while using about 28% fewer tokens, attributing the efficiency to default prompt caching, truncation of large tool results, auto-compaction at 85% context usage, and context recovery on overflow.", "type": "Product Launch", "date": "2026-09-21", "source_url": "https://siliconangle.com/2026/09/21/aws-debuts-strands-harness-an-open-source-ai-agent-that-can-be-deployed-in-any-environment/"}, {"title": "Amazon Bedrock Adds Kimi K3 Under a New Model Revenue-Sharing Partnership", "summary": "Amazon Bedrock integrated the open-source large language model Kimi K3 into the AWS AI service platform, giving global enterprise developers direct access to the model through Bedrock. The integration marks the formal launch of Kimi's revenue-sharing partnership with international cloud providers, extending Bedrock's third-party model catalog and reinforcing AWS's strategy of positioning Bedrock as the aggregation point for frontier and open-weight models that enterprises consume through a single managed inference layer.", "type": "Partnership", "date": "2026-09-21", "source_url": "https://www.gate.com/news/detail/amazon-bedrock-integrates-kimi-k3-launching-revenue-sharing-model-with-24439709"}]}, "AWS ~AI": {"category": "AI Security", "announcements": [{"title": "AWS Pattern Streams Bedrock Guardrails Interventions to OCSF in CloudWatch Unified Store", "summary": "This AWS architecture pattern normalizes Amazon Bedrock guardrail interventions \u2014 harmful content blocks, PII leaks, and prompt-injection attempts \u2014 into the Open Cybersecurity Schema Framework DetectionFinding format and centralizes them in the CloudWatch unified data store. A CDK-deployed Lambda subscribes to Bedrock model invocation logs, maps guardrail records to OCSF, and writes JSON that can be queried alongside IAM, VPC Flow Logs, and CloudTrail data via Athena or CloudWatch Logs Insights. The result is cross-service correlation of AI guardrail alerts with other security telemetry, complementing GuardDuty AI Protection findings.", "type": "Product Launch", "date": "2026-09-21", "source_url": "https://cloudninjas.ca/ai/streaming-bedrock-guardrails-to-ocsf-in-the-cloudwatch-unified-store/"}]}, "Fastly ~AI": {"category": "AI Security", "announcements": [{"title": "Fastly Launches AI Firewall and AI Runtime Control to Secure and Scale AI", "summary": "Fastly expanded its \"Fastly for AI\" portfolio with three capabilities, all generally available now. AI Runtime Control acts as a control plane that routes model calls across public and self-hosted providers, with real-time visibility into token spend, rate limits, budgets, virtual keys for credential protection, and failover. AI Firewall inspects prompts in the request path at the edge to block prompt injection and other LLM attacks, and can be targeted at specific models. Expanded API Security enforces API contracts across agent-based, agent-assisted, and traditional traffic. Fastly cited machine-generated traffic overtaking human traffic in July 2026 as the driver.", "type": "Product Launch", "date": "2026-09-21", "source_url": "https://www.fastly.com/press/press-releases/fastly-launches-ai-firewall-and-ai-runtime-control-to-secure-and-scale-ai"}]}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Networks Joins S&P 100 as AI Infrastructure Weighting Grows", "summary": "Arista Networks joined the S&P 100 index effective before market open on September 21, 2026, replacing Nike in S&P Dow Jones Indices' quarterly rebalancing alongside moves involving Dell, Palo Alto Networks and SanDisk that tilt the index further toward AI infrastructure names. Shares rose roughly 1.5% on the day to about $202.56. Analyst sentiment remains strongly positive, with 120 of 122 covering analysts rating the stock a buy and a median price target near $246.50. The inclusion reflects investor recognition of Arista's AI data center networking growth.", "type": "Financial", "date": "2026-09-21", "source_url": "https://tradersunion.com/news/companies/show/3418107-arista-networks-stock-rises-1-5percent/"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "HPE Networking Pushes Self-Driving Networks From Vision Toward Autonomous Remediation", "summary": "A BizTech Magazine feature details how HPE Networking is advancing from AI-assisted troubleshooting to genuinely autonomous, self-driving network operations. HPE combines AI, network telemetry, cloud-native microservices and years of accumulated customer trouble-ticket data to identify recurring problems and autonomously apply fixes with reduced manual intervention. HPE's Rich Carter describes AI auto-correcting common network issues as a core element of the broader self-driving network strategy, noting the approach requires extensive longitudinal data, deep understanding of network behavior, and organizational confidence to let AI take remediation action on production infrastructure.", "type": "Research", "date": "2026-09-21", "source_url": "https://biztechmagazine.com/article/2026/09/ai-self-driving-networks-move-vision-reality"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Radware": {"category": "Application Security", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-09-21.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
</html>
