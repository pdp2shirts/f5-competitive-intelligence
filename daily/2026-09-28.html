(function(){
"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Named a Leader in the IDC MarketScape for SASE", "summary": "Palo Alto Networks said IDC MarketScape named it a Leader in the Worldwide Secure Access Service Edge (SASE) 2026 Vendor Assessment. The company is using the IDC excerpt to back its Prisma SASE platform. Analyst validation like this strengthens Palo Alto's pitch for consolidating network and security spend into one platform, which competes with F5's multicloud app delivery and security platform story.", "type": "Research/Report", "date": "2026-09-28", "source_url": "https://www.paloaltonetworks.co.uk/resources/research/palo-alto-networks-named-leader-in-the-idc-marketscape-for-sase"}, {"title": "Semtech and Palo Alto Networks Secure Industrial IoT with Zero Trust", "summary": "Semtech and Palo Alto Networks completed an integration of Semtech AirLink 5G/LTE edge routers with Palo Alto Networks Next-Generation Firewalls and ZTPKI. The joint Zero Trust offering targets industrial IoT and critical infrastructure. It provides continuous asset visibility, AI-powered threat prevention and automated certificate and identity management across remote OT sites. It shows Palo Alto pushing its platform out to the distributed edge.", "type": "Partnership", "date": "2026-09-28", "source_url": "https://www.worldports.org/semtech-and-palo-alto-networks-secure-industrial-iot-with-zero-trust/"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Securing AI Agents at Scale with NVIDIA", "summary": "Palo Alto Networks described a joint approach with NVIDIA for securing agentic AI, built on NVIDIA's Open Agent Security Platform reference design. Prisma AIRS AI Gateway runs on NVIDIA Vera CPUs for governance, and Prisma AIRS AI Runtime Security runs on BlueField DPUs for hardware-isolated runtime protection. IDIRA-powered Agent Identity Security is planned, with an agent identity broker on BlueField. This competes directly with F5 AI Guardrails and AI Gateway positioning inside NVIDIA AI factory deployments.", "type": "Partnership", "date": "2026-09-28", "source_url": "https://www.paloaltonetworks.com/blog/2026/09/securing-ai-agents-at-scale-with-nvidia/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Targets Fragmented AWS Security with Unified Approach to Cloud, Applications and AI", "summary": "Fortinet laid out a unified security approach for AWS and hybrid environments that combines FortiGate VM cloud firewalls, FortiCNAPP for application and workload protection, and FortiAIGate. FortiAIGate sits between applications and LLMs to enforce guardrails, detect prompt injection and jailbreaks, and apply data loss prevention. The bundle is sold through AWS Marketplace and integrates with AWS Gateway Load Balancer and CloudFront. This overlaps with F5's AWS app security and AI Guardrails motions.", "type": "Product Update", "date": "2026-09-28", "source_url": "https://security-storage-und-channel-germany.de/language/en/fortinet-targets-fragmented-aws-security-with-unified-approach-to-cloud-applications-and-ai/"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Secure Firewall 200 Series: Branch Security for the AI Era", "summary": "Cisco introduced the Secure Firewall 200 Series for branch offices. It combines AI-powered threat detection, SnortML exploit detection and the Encrypted Visibility Engine, which inspects TLS 1.3 traffic without full decryption. It also includes native SD-WAN, zero-touch provisioning, and central management through Cisco Cloud Control with multitenancy for MSPs. It extends Cisco's pitch to consolidate security and networking in distributed and hybrid environments.", "type": "Product Launch", "date": "2026-09-28", "source_url": "https://blogs.cisco.com/security/future-proofing-branch-firewall-security-for-the-ai-era"}]}, "Cisco ~AI": {"category": "AI Security", "announcements": [{"title": "Arcade.dev Announces Strategic Investment from Cisco Investments to Govern Every Agent Action", "summary": "Cisco Investments joined an extended Series A for Arcade.dev, whose action runtime enforces governance at the moment AI agents interact with enterprise systems. The runtime plugs into existing DLP, identity provider, compliance and SIEM policies. It can block unauthorized actions, require human review for sensitive ones, and log every action with provenance. It signals Cisco building out agentic AI security alongside AI Defense, adjacent to F5 AI Guardrails and MCP/agent governance.", "type": "Financial", "date": "2026-09-28", "source_url": "https://www.arcade.dev/blog/cisco-investments-backs-arcade/"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cisco Nexus One and Cisco Secure Firewall Integrations with Rafay Enable Fully Self-Service AI Cloud", "summary": "The Rafay Platform, which Cisco resells through its Solutions Plus program, now integrates with Cisco Nexus One and Cisco Secure Firewall. A single tenant request can set up both the network and the security policies for self-service AI and GPU cloud environments, including inbound access, NAT and port-forwarding. This is Cisco competing for AI factory and neocloud infrastructure where F5 positions AI traffic management and security.", "type": "Partnership", "date": "2026-09-28", "source_url": "https://blogs.cisco.com/datacenter/cisco-nexus-one-and-cisco-secure-firewall-integrations-with-rafay-enable-fully-self-service-ai-cloud"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "Horizon3 Announces Integration with CrowdStrike Falcon Next-Gen SIEM", "summary": "Horizon3 released an integration that sends validated NodeZero exposure findings into CrowdStrike Falcon Next-Gen SIEM. There they are correlated with endpoint, identity and cloud telemetry to speed investigations and confirm fixes. The integration is available now in the CrowdStrike Marketplace. It shows Falcon's partner ecosystem feeding CrowdStrike's platform consolidation push.", "type": "Partnership", "date": "2026-09-28", "source_url": "https://presskl.com/2026/09/28/horizon3-announces-integration-with-crowdstrike-falcon-next-gen-siem/"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "A Win for Defenders: CrowdStrike and NVIDIA Extend Security Across the AI Stack", "summary": "CrowdStrike and NVIDIA expanded their collaboration around NVIDIA's open-source Open Agent Safety Platform. It covers the OpenShell secure agent runtime, NVIDIA Sentry monitoring and agent quarantine on BlueField-4 DPUs, and Vera CPUs. NVIDIA DOCA Argus telemetry feeds CrowdStrike Falcon Next-Gen SIEM so agent activity can be tied to enterprise security context. CrowdStrike is now competing inside the same NVIDIA agentic AI ecosystem as F5's AI security and AI data delivery offerings.", "type": "Partnership", "date": "2026-09-28", "source_url": "https://www.crowdstrike.com/en-us/blog/crowdstrike-nvidia-extend-security-across-ai-stack/"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "What's New in Zscaler SSE: ZIA and ZPA Unified Under Real-Time Zero Trust", "summary": "Zscaler recapped the SSE changes it announced at ZenithLive 2026. Internet Access (ZIA) and Private Access (ZPA) now run under one real-time Zero Trust framework that checks every internet, SaaS and private-app transaction, which Zscaler says adds no operational complexity. It pushes Zscaler's platform-consolidation story further and competes with F5's secure application access and platform positioning.", "type": "Product Update", "date": "2026-09-28", "source_url": "https://www.zscaler.com/blogs/product-insights/what-s-new-zscaler-sse-0"}, {"title": "Zscaler Delivers Same-Day Support for macOS 27 and iOS 27", "summary": "Zscaler validated its products for macOS 27 and iOS 27 on release day, the second year in a row it has done so. Zscaler Client Connector, ZDX and DLP are covered, and Zero Trust Browser for macOS 27 has been added. The message is that customers can roll out new Apple OS versions without waiting on security, raising the bar for client compatibility in zero-trust access deals.", "type": "Product Update", "date": "2026-09-28", "source_url": "https://www.zscaler.com/blogs/partner/zscaler-delivers-same-day-support-macos-27-and-ios-27"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Research 28th September Threat Intelligence Report", "summary": "Check Point's weekly threat report covers active exploitation of two critical pre-auth RCE flaws in its own Security Gateway and Security Management products, CVE-2026-85102 and CVE-2026-93616, both rated CVSS 9.8, with fixes available. The report also says Check Point IPS protects against an F5 BIG-IP heap overflow, CVE-2026-94127. Because it names an F5 CVE, F5 field and PSIRT teams should be ready for customer questions and have patch guidance on hand.", "type": "Threat Research", "date": "2026-09-28", "source_url": "https://research.checkpoint.com/2026/28th-september-threat-intelligence-report/"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point and Clalit Health Services Partner to Secure AI Adoption in Healthcare", "summary": "Check Point is partnering with Clalit Health Services to bring AI into Clalit's healthcare workflows while protecting medical data. The deal gives Clalit real-time visibility and control over AI usage and AI agents, a unified AI Gateway, cyber-risk reduction and digital workspace protection. This is a reference win for Check Point in AI gateway and AI security, the same space as F5 AI Guardrails.", "type": "Customer Win", "date": "2026-09-28", "source_url": "https://www.jpost.com/business-and-innovation/tech-and-start-ups/article-910001"}, {"title": "Check Point and NVIDIA Beta Integration for Agent Action Governance", "summary": "Check Point and NVIDIA released a beta integration of Check Point's semantic monitoring with NVIDIA's Open Agent Safety Platform, enabled through NVIDIA OpenShell. Security boundaries sit in the infrastructure, outside the agent, and every agent action is checked before it runs, with verdicts in under 100 milliseconds. This puts Check Point into agentic AI runtime security alongside NVIDIA, an alliance partner F5 also works with.", "type": "Partnership", "date": "2026-09-28", "source_url": "https://wpnews.pro/news/the-goal-tells-an-agent-what-to-do-security-has-to-govern-how"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Introducing cf: The Agentic CLI for the Entire Cloudflare API", "summary": "During Birthday Week, Cloudflare launched cf in open beta, an agent-oriented CLI that exposes more than 3,000 Cloudflare API operations, outputs JSON by default and uses a TypeScript config file. AI agents can deploy, monitor, secure and configure Cloudflare services from a single tool. cf will replace Wrangler, which keeps support for 18 months after the beta. It raises expectations for agent-driven automation of app delivery and security, relevant to F5's API and automation story.", "type": "Product Launch", "date": "2026-09-28", "source_url": "https://blog.cloudflare.com/cloudflare-cf-cli-launch/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "The Road to the Agentic Browser: Kitesurf Update", "summary": "Cloudflare updated Kitesurf, its browser for AI agents that runs on Workers. The update adds WebMCP support, so agents can call functions a site exposes instead of simulating clicks, plus full Browser Run API coverage (CDP, Playwright, Puppeteer, MCP), wider web-standards support and lower agent-loop latency. It advances Cloudflare's agent-traffic edge strategy; F5 should expect AI agent traffic to customers' apps to grow.", "type": "Product Update", "date": "2026-09-28", "source_url": "https://zerohour.day/item/019d3657d23b8a22fdfb54a363c164b76b867037"}]}, "Cloudflare ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "BEACON: Open Dataset of Billions of Real-User Web Performance Measurements", "summary": "Cloudflare launched BEACON (Browser Experience Across Cloudflare's Observed Network), an open dataset of anonymized real-user performance measurements from the top 10,000 websites across major browser engines. The data is updated daily in Google BigQuery and follows RUM Archive standards. It gives Cloudflare public web-performance proof points that F5 marketing and PMM may need to answer in app delivery conversations.", "type": "Research/Report", "date": "2026-09-28", "source_url": "https://blog.cloudflare.com/how-fast-is-the-web/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare Splits AI Bot Blocking into Search, Training, and Agent Crawler Controls", "summary": "Cloudflare replaced its single Block AI Bots switch with three separate controls for search, AI training and AI agent crawlers, and added an 'Accountable' designation for crawlers meeting transparency criteria. Google, Microsoft, Apple, OpenAI and Anthropic have adopted it. Mixed-use crawlers make up 36.6% of verified crawler traffic on Cloudflare's network. This strengthens Cloudflare's bot management for AI traffic and competes with F5 bot defense.", "type": "Product Update", "date": "2026-09-28", "source_url": "https://www.emarketer.com/content/cloudflare-crawler-controls-give-publishers-leverage-ai-licensing"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS European Sovereign Cloud to Demonstrate Independent Operation", "summary": "On October 24, 2026, AWS will temporarily disconnect the European Sovereign Cloud in Brandenburg from its global backbone. The region will run over EU-only ISP connectivity with operational data transfers disabled, to show it can operate independently of non-EU infrastructure. This strengthens AWS's sovereignty story for EU regulated customers, relevant to F5's sovereign and hybrid multicloud positioning.", "type": "Event", "date": "2026-09-28", "source_url": "https://aws.amazon.com/blogs/security/aws-european-sovereign-cloud-demonstrating-an-independent-operation/"}]}, "AWS ~AI": {"category": "AI Security", "announcements": [{"title": "Two RCE CVEs Disclosed in Amazon Bedrock AgentCore Python SDK Code Interpreter", "summary": "BeyondTrust disclosed two RCE flaws in the Amazon Bedrock AgentCore Python SDK Code Interpreter helper: CVE-2026-12530, a newline injection, and CVE-2026-16796, an extras bypass. Either could expose execution-role credentials. Both are fixed in bedrock-agentcore v1.18.1. The findings show hyperscaler agent frameworks still carry real risk, supporting F5 AI Red Team and runtime guardrail messaging.", "type": "Threat Research", "date": "2026-09-28", "source_url": "https://www.beyondtrust.com/blog/entry/amazon-bedrock-agentcore-python-sdk-rce-cves"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "AWS Weekly Roundup: SageMaker HyperPod Inference Gateway, CloudWatch Omni, Strands Harness", "summary": "AWS's September 28 weekly roundup includes the SageMaker HyperPod Inference Gateway, a Kubernetes-native, GPU-aware routing layer for LLM inference installed as an EKS add-on, which AWS says cuts time-to-first-token latency by up to 82%. It supports OpenAI-compatible model servers such as vLLM and SGLang. Other items are CloudWatch Omni observability and the Strands agent harness. GPU-aware inference routing competes directly with F5's AI Data Delivery and AI gateway positioning.", "type": "Product Launch", "date": "2026-09-28", "source_url": "https://aws.amazon.com/blogs/aws/aws-weekly-roundup-gpt-6-sol-and-luna-claude-opus-5-5-on-amazon-bedrock-strands-harness-and-more-september-28-2026/"}, {"title": "Claude Sonnet 5.5 Now Available on AWS via Amazon Bedrock and Claude Platform on AWS", "summary": "AWS made Anthropic's Claude Sonnet 5.5 available through Amazon Bedrock, with regional data residency and managed Guardrails and Knowledge Bases, and through Claude Platform on AWS, which gives native Anthropic access with AWS billing and authentication. The model is tuned for coding and knowledge work at lower cost per task. This deepens Bedrock as an enterprise AI hub whose built-in guardrails compete with third-party AI security such as F5 AI Guardrails.", "type": "Product Update", "date": "2026-09-28", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/claude-sonnet-5-5-aws/"}, {"title": "Grok 4.7 Now Available on Amazon Bedrock", "summary": "AWS added Grok 4.7 to Amazon Bedrock with US Geo and Global cross-Region inference. The model is tuned for coding, agent tasks and knowledge work, with better mixed-document handling, more reliable repo-scale coding and stronger browser-use agents than 4.6. Bedrock's growing model catalog increases multi-model inference traffic, supporting the case for F5 AI gateway and traffic management in front of those endpoints.", "type": "Product Update", "date": "2026-09-28", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-bedrock-grok-4-7/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai ~AI": {"category": "AI Security", "announcements": [{"title": "Akamai State of the Internet: 'Speed, Scale, and Nonhuman Identity: The Agentic Threat Landscape'", "summary": "Akamai's latest State of the Internet report (Vol. 12, Issue 5) says AI bot traffic rose 300% in 2025, daily API attacks per organization rose 113%, and 87% of surveyed firms had an API incident. It highlights MCP risks and recommends trust isolation, proxy gateways and human approval for AI agent actions, presenting edge-based runtime protection as the answer. This competes directly with F5's AI Guardrails, API security and bot defense narrative on agentic AI.", "type": "Research/Report", "date": "2026-09-28", "source_url": "https://cisoforum.in/when-ai-gets-hands-akamai-warns-security-chiefs-the-rules-have-changed/"}]}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Akamai Joins Chainguard's Athena Coalition to Auto-Shield App & API Protector Customers", "summary": "Akamai joined Chainguard's Athena Coalition and says App & API Protector customers will be protected automatically against newly disclosed vulnerabilities. The move strengthens Akamai's pitch of fast virtual patching at the edge for its WAAP. F5 sellers may hear this in Distributed Cloud WAAP and Advanced WAF competitions and should be ready to explain how quickly F5 ships threat signatures.", "type": "Partnership", "date": "2026-09-28", "source_url": "https://www.itsecuritynews.info/akamai-joins-athena-coalition-to-shield-users-from-new-vulnerabilities/"}, {"title": "System Change Indications on Web Security Analytics Now Generally Available", "summary": "Akamai made System Change Indications generally available in Web Security Analytics (WSA) and Security Center. The feature adds visual cues so users can spot security and product updates and find configuration changes around service incidents. It is a small operational improvement to Akamai's WAAP analytics and a comparison point for observability and change tracking in F5 Distributed Cloud WAAP dashboards.", "type": "Product Update", "date": "2026-09-28", "source_url": "https://techdocs.akamai.com/security-ctr/changelog/sep-28-2026-system-change-indications-on-wsa-general-availability"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Comcast and Fastly Launch In-Network Edge Delivery Model for Peacock Live Events", "summary": "Comcast and Fastly, working with NBCUniversal, said Fastly's content and application delivery software will run inside Comcast's distributed edge network of more than 200 AI-powered edge compute centers, scaling Peacock's live sports streams, APIs and security closer to viewers. Comcast said the model could later cover AI inference, gaming and enterprise cloud services. This puts Fastly's programmable edge inside carrier networks, where F5 sells SP traffic management and distributed delivery.", "type": "Partnership", "date": "2026-09-28", "source_url": "https://www.lightreading.com/cable-technology/comcast-and-fastly-connect-to-support-peacock-s-live-sports-streams"}]}, "Fastly ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Fastly: AI Traffic Places New Demands on Business Websites", "summary": "Fastly reported that over 51% of AI requests on its network must go back to origin for fresh data, versus under 9% of human requests. AI traffic grew about 30% from January to May 2026, roughly 6.5x faster than human traffic, and crawlers made up 85% of it. Fastly advises deciding which AI bots to accelerate, challenge or block. The findings support F5 messaging on AI-era bot management and origin offload.", "type": "Research/Report", "date": "2026-09-28", "source_url": "https://backendnews.net/fastly-ai-traffic-raises-new-demands-on-business-websites/"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Citrix Confirms Actively Exploited NetScaler ADC/Gateway Zero-Days; CISA Orders Patching by Sept 30", "summary": "Citrix confirmed that NetScaler ADC and Gateway zero-days CVE-2026-88771 (unauthenticated RCE in default configurations) and CVE-2026-88772 (memory overflow when DTLS is enabled) are being actively exploited, and released patches along with six other fixes. CISA added both to its KEV catalog and ordered federal agencies to patch by September 30; Palo Alto Unit 42 separately counted 50,000+ exposed instances. This is another NetScaler security crisis F5 teams can use for displacement and migration offers.", "type": "Threat Research", "date": "2026-09-28", "source_url": "https://cyberscoop.com/citrix-zero-days-delayed-disclosure/"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": []}, "HPE / Juniper Networks ~AI": {"category": "AI Security", "announcements": [{"title": "HPE to Integrate NVIDIA Open Agent Safety Platform into Private Cloud AI and AI Factory", "summary": "HPE plans to integrate NVIDIA's Open Agent Safety Platform into its Private Cloud AI and AI Factory solutions in Q4 2026. The integration includes NVIDIA OpenShell running on Vera-based ProLiant DL394 Gen12 servers as an agent runtime with monitoring, sandboxing and Zerto-powered rollback, plus BlueField-4 DPU isolation and NVIDIA Confidential Computing. HPE is building agentic AI runtime security into on-prem AI factories where F5 positions AI Guardrails and BIG-IP Next for Kubernetes on BlueField.", "type": "Partnership", "date": "2026-09-28", "source_url": "https://www.gurufocus.com/news/9100096/hewlett-packard-enterprise-hpe-to-integrate-nvidia-open-agent-safety-platform-in-q4-2026"}]}, "Radware": {"category": "Application Security", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "BarracudaONE September 2026 Release: Authenticator Risk Detection and Streamlined Product Trials", "summary": "Barracuda's BarracudaONE release dated 2026.09.28 adds a Microsoft Entra ID risk flag for when Microsoft Authenticator is enabled without showing the app name and sign-in location. It also lets users start trials from the Home page for SecureEdge, Integrated Email Protection and Barracuda Application Protection, its WAAP product. Lower-friction WAAP trials increase pressure on F5 in the mid-market and MSP channel, where fast self-service evaluation shapes vendor selection.", "type": "Product Update", "date": "2026-09-28", "source_url": "https://documentation.campus.barracuda.com/wiki/spaces/ONE/pages/877297673/Release+Notes+-+September+2026+2026.09.28"}]}, "Imperva (Thales) ~AI": {"category": "AI Security", "announcements": [{"title": "Thales Expands Collaboration with Google Cloud to Help Secure Agentic AI Workflows", "summary": "Thales integrated its AI Security Fabric with Gemini Enterprise, applying real-time security, governance, visibility and policy enforcement to interactions between users, AI agents, models and tools. It targets prompt injection, data leakage, unsafe outputs, unauthorized actions and agent-to-agent risks. This directly challenges F5 AI Guardrails inside the Google Cloud alliance motion; expect Thales co-sell pitches in Google Cloud accounts and sharpen F5's Google positioning.", "type": "Partnership", "date": "2026-09-28", "source_url": "https://www.marketscreener.com/news/thales-expands-collaboration-with-google-cloud-to-help-secure-agentic-ai-workflows-ce785adcda8df62d"}]}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-09-28.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
