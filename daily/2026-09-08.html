var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Closes FY2026 with $3.41B Quarter and NGS ARR up 63% to $9.1B", "summary": "Palo Alto Networks reported record fiscal Q4 2026 revenue of $3.41B, up 34% year over year, with non-GAAP EPS of $1.02. Next-Generation Security ARR reached $9.1B, up 63%, after nearly $1B of net new NGS ARR in the quarter, and remaining performance obligation crossed $20B for the first time at $21.2B. The company added a record 22 net new platformizations and cited net revenue retention above 120% in the platformized cohort. FY2027 NGS ARR guidance is $11.075-$11.175B.", "type": "Earnings", "date": "2026-09-08", "source_url": "https://finance.biggo.com/quote/PANW/earnings-call/US_PANW_2026-09-08"}, {"title": "Palo Alto Networks Launches Prisma Browser for MSPs with Multi-Tenant Management", "summary": "Palo Alto Networks introduced Prisma Browser for MSPs, a multi-tenant version of its enterprise browser aimed at NextWave MSSP partners that lets service providers deploy and centrally manage browser security across hundreds of end customers. The offering bundles AI-driven threat protection, enterprise DLP, and browser-native data controls that block sensitive data from moving into unsanctioned GenAI apps. Flexible licensing and centralized administration are positioned to remove the operational friction of managing individual Prisma Browser tenants, with the product marketed as a secure browser built for the agentic AI era.", "type": "Product Launch", "date": "2026-09-08", "source_url": "https://www.paloaltonetworks.com/blog/sase/managed-enterprise-browser-security-with-prisma-browser-for-msps/"}]}, "Fortinet ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Fortinet Discloses ZTNA Certificate Validation Flaw Enabling Man-in-the-Middle Attacks", "summary": "Fortinet disclosed CVE-2026-84393, a certificate-validation vulnerability in the Agentless ZTNA portal of FortiOS and FortiProxy. An unauthenticated remote attacker can intercept or modify traffic between the ZTNA portal and backend destinations, potentially exposing session tokens and application content. Affected versions span FortiOS and FortiProxy 7.6.1 through 7.6.6; the 7.2, 7.4 and 8.0 branches are unaffected. Fortinet recommends upgrading to 7.6.7 or later and published an upgrade-path tool. No active exploitation was known at disclosure, though internet-exposed ZTNA portals raise the risk profile.", "type": "Threat Intel", "date": "2026-09-08", "source_url": "https://thedailytechfeed.com/serious-ztna-flaw-in-fortios-fortiproxy-opens-door-to-mitm-attack/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Attackers Exploit FortiGate Firewalls to Deploy Custom PivotC2 Node.js Malware", "summary": "SOCRadar's Threat Research Unit reported an active campaign exploiting CVE-2025-25249, a critical heap-based buffer overflow in the cw_acd daemon of FortiOS and FortiSwitchManager. Attackers implant a custom Node.js remote access Trojan called PivotC2, turning compromised Fortinet devices into long-term footholds for espionage and data theft. Devices using CAPWAP for centralized access point management are exposed, with FortiOS 6.4 through 7.6.3 and FortiSwitchManager 7.0.x and 7.2.x affected. Patches shipped after the January 2026 disclosure, making unpatched edge appliances the primary risk.", "type": "Threat Intel", "date": "2026-09-08", "source_url": "https://cybersecuritynews.com/fortigate-firewalls-hacked-to-deploy-malware/"}, {"title": "Fortinet Executives Pitch AI-Led Security Strategy and Data Advantage at Goldman Sachs Conference", "summary": "CEO Ken Xie and CFO Christiane Ohlgart presented Fortinet's AI-led cybersecurity strategy at the Goldman Sachs Communacopia + Technology Conference. They emphasized that Fortinet builds its own AI/ML models and infrastructure, including global GPU-equipped data centers, and has shipped more than 20 AI-enabled products concentrated in security operations. Management framed telemetry from its network security installed base as a structural data advantage for analyzing the intrusion landscape, positioning Security Fabric as an AI-driven consolidation platform rather than a collection of point products.", "type": "Earnings", "date": "2026-09-08", "source_url": "https://seekingalpha.com/article/4944044-fortinet-inc-ftnt-presents-at-goldman-sachs-communacopia-technology-conference-2026"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cisco Expands Secure AI Factory with NVIDIA by Adding Supermicro Rack-Scale Systems", "summary": "Cisco expanded its Secure AI Factory with NVIDIA to include Supermicro liquid- and air-cooled compute systems, validated, sold and supported by Cisco starting in October 2026. The systems target high-density GPU deployments for trillion-parameter training and high-throughput inference on NVIDIA Vera Rubin NVL72 and HGX Rubin NVL8 platforms, with rack-to-fabric liquid cooling. The architecture pairs Cisco Silicon One front-end networking with NVIDIA Spectrum-X back-end switching managed through Cisco Nexus One, delivering NVIDIA Cloud Partner-compliant reference architectures aimed at neocloud and sovereign cloud customers.", "type": "Partnership", "date": "2026-09-08", "source_url": "https://techitupme.com/cisco-expands-secure-ai-factory-with-nvidia-and-supermicro/"}, {"title": "Cisco Frames AI Agents as Driver of a Multi-Year Networking Super Cycle", "summary": "At the Goldman Sachs Communacopia + Technology Conference, Cisco executives said AI agents consume substantial bandwidth and run continuously, driving demand for high-performance, low-latency networks and machine-scale security. Hyperscaler AI orders reached $9.3B in the last fiscal year including $4B in Q4, with companywide orders up 40% and roughly 25% growth excluding hyperscalers. Cisco cited more than $100B of installed-base refresh opportunity, campus and branch growth near 20%, firewall growth above 30% for two straight quarters, and high-single-digit FY2027 security revenue growth.", "type": "Earnings", "date": "2026-09-08", "source_url": "https://www.marketbeat.com/instant-alerts/event-cisco-systems-sees-ai-agents-fueling-a-multi-year-networking-boom-2026-09-08/"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Bundles Critical IOS XR Vulnerability Fixes into a Single Patch Set", "summary": "Cisco disclosed more than half a dozen vulnerabilities in Linux-based IOS XR and bundled the fixes into a single patch set. Two flaws rated CVSS 9.8, CVE-2026-20274 and CVE-2026-20279, allow remote code execution and root access, with additional high-severity issues scored 8.8 to 8.2 covering buffer handling, unexpected condition checks, control-flow failures and protection mechanism flaws. All IOS XR releases including IOS XR7 are affected and no workarounds exist. Fixes ship as software maintenance upgrades and targeted patches, with releases 26.2.2 and 26.3.1 including them natively.", "type": "Threat Intel", "date": "2026-09-08", "source_url": "https://www.networkworld.com/article/4219946/cisco-bundles-fixes-for-multiple-vulnerabilities-some-critical-into-one-patch.html"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "Rubrik and CrowdStrike Expand Integration to Cut Identity Recovery from Days to Hours", "summary": "CrowdStrike and Rubrik announced an expanded integration linking Falcon Next-Gen Identity Security for real-time detection and identity risk management with Rubrik Identity Resilience for immutable backup and recovery. Charlotte Agentic SOAR acts as the orchestration layer, creating a closed loop across detection, containment, investigation and targeted recovery. The joint workflow can surgically reverse malicious Active Directory changes and reduce identity recovery time objectives from days to hours with less manual intervention, building on a prior integration the two companies announced in December 2025.", "type": "Partnership", "date": "2026-09-08", "source_url": "https://thejournal.com/articles/2026/09/08/rubrik-crowdstrike-announce-expanded-integration-to-speed-identity-recovery.aspx"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "Analysis: CrowdStrike Bets on Proprietary AI Models to Secure the AI Revolution", "summary": "Futurum published an analysis of CrowdStrike's Fal.Con 2026 strategy, concluding the company is expanding its remit around securing AI rather than repositioning itself. Highlights include the new Cyber Superintelligence Lab led by former NVIDIA leader Bartley Richardson, the SafeMind agentic system built with NVIDIA, and two in-house models: Red Tempest for offensive security and Blue Solano for defense on NVIDIA Nemotron. Falcon Guardian, strengthened by the Pangea acquisition, uses an Agent Graph for AI agent discovery, prompt visibility, posture management and malicious prompt detection, plus on-device inference in sensor 8.10.", "type": "Research", "date": "2026-09-08", "source_url": "https://futurumgroup.com/insights/crowdstrike-bets-on-its-own-models-to-secure-the-ai-revolution/"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point Research Discloses Cross-Account ChatGPT Data Leak That Exposed Victims' Gmail", "summary": "Check Point Research disclosed a vulnerability in ChatGPT's sandbox environment that allowed an attacker to read a victim's connected Gmail data through a hidden cross-account channel. The researchers abused an internal Artifactory instance and item-management features to attach and read properties across accounts, retrieving the victim's email content in a single turn. OpenAI has decommissioned the affected Artifactory instance, so the path is not exploitable today, but Check Point warns the broader architectural pattern persists and urges shadow-AI visibility, runtime protection and governance over what AI agents can access.", "type": "Research", "date": "2026-09-08", "source_url": "https://blog.checkpoint.com/research/chatgpt-let-attackers-read-victims-gmail-through-a-hidden-channel-between-accounts/"}]}, "Cloudflare ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Cloudflare Launches Automatic Key Exchange for Post-Quantum Origin Handshakes", "summary": "Cloudflare introduced Automatic Key Exchange, an extension of Automatic SSL/TLS that learns each origin server's supported key agreement methods and preferentially negotiates post-quantum hybrid X25519MLKEM768 on the first handshake. During rollout, HelloRetryRequest rates fell from roughly 52% to 3.7%, cutting over 150 ms from p90 handshake latency, while post-quantum origin connections grew from about 25 billion to 45 billion per day. Most domains are upgraded automatically with no manual configuration, with controls available under SSL/TLS origin connection and post-quantum settings.", "type": "Product Launch", "date": "2026-09-08", "source_url": "https://blog.cloudflare.com/automatic-key-exchange-for-origins/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "OpenAI GPT-6 Astra Now Generally Available on Amazon Bedrock", "summary": "AWS made OpenAI's GPT-6 Astra generally available on Amazon Bedrock, bringing deeper reasoning, professional-quality writing and design, advanced browser use, and a context window up to one million tokens. The model is accessible through Bedrock APIs and can be used with ChatGPT Work and Codex on Bedrock, targeting autonomous agents, large document analysis and complex software investigation. New enterprise plugins extend Astra's browser capabilities across business applications, and AWS provides security, governance and auditability controls over model invocations.", "type": "Product Launch", "date": "2026-09-08", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/openai-gpt-6-astra-on-amazon-bedrock/"}, {"title": "AWS Releases Nx Plugin for Scaffolding Full-Stack AI Applications", "summary": "AWS released version 1.0 of the Nx Plugin for AWS, an open-source toolkit that extends Nx with generators for AI agents, Model Context Protocol servers on Amazon Bedrock AgentCore, APIs, websites and databases. It emits deployable infrastructure using AWS CDK or Terraform and bakes in security and observability practices including WAF, CloudWatch access logs and X-Ray tracing. Generated code belongs to the customer with no runtime plugin dependency, and Nx migrations apply to customized workspaces for consistent, type-safe, reproducible builds.", "type": "Product Launch", "date": "2026-09-08", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/nx-plugin-for-aws/"}]}, "AWS ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Amazon API Gateway Adds Mutual TLS for Backend Integrations", "summary": "AWS announced that Amazon API Gateway now supports mutual TLS for backend integrations, allowing the gateway to present a client certificate when connecting to backend endpoints. This extends mTLS beyond inbound client authentication to the connection between API Gateway and origin services, helping customers meet zero-trust and regulatory requirements for mutually authenticated service-to-service traffic without deploying additional proxy infrastructure.", "type": "Product Launch", "date": "2026-09-08", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-api-gateway-mutual-tls-backend/"}]}, "Lasso Security": {"category": "AI Security", "announcements": [{"title": "Lasso Launches LEAP CPU-Based AI Guardrail and Discloses $30M Round", "summary": "Lasso Security unveiled LEAP, a transformer-free AI guardrail that inspects AI prompts, responses and agent actions on ordinary server CPUs with sub-5-millisecond decisions and no GPU requirement. LEAP pairs with RAPID, a self-hosted engine that handles higher-judgment policy calls, with traffic routed between the two to hold down inference cost. Lasso says LEAP is already in production at large enterprises and parts of the U.S. federal government, citing BMW, Leonardo Defence, Kaufman Rossin, eToro and Fiverr. The company also disclosed a $30 million round led by ClearSky.", "type": "Product Launch", "date": "2026-09-08", "source_url": "https://itbrief.co.uk/story/lasso-launches-ai-guardrail-leap-raises-usd-30m"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Direct Fetch Arrives for Fastly Object Storage to Speed Cloud Migrations", "summary": "Fastly introduced Direct Fetch for Fastly Object Storage, an S3-compatible server-side transfer API that moves data directly from an S3-compatible source into a Fastly bucket without the client downloading and re-uploading. Clients issue a PutObject or UploadPart with an empty payload plus a fastly-object-storage-source-url header, and Fastly fetches and writes the object. Fastly positions the feature as dramatically faster for migrations by bypassing local clients and public internet hops, scaling with its edge network, requiring minimal client compute and supporting pre-signed URLs for private assets.", "type": "Product Launch", "date": "2026-09-08", "source_url": "https://www.fastly.com/blog/accelerate-migrations-introducing-direct-fetch-fastly-object-storage"}, {"title": "Fastly Object Storage Adds Frankfurt Region and Bucket Lifecycle Rules", "summary": "Fastly announced new Object Storage capabilities including a new eu-central-1 storage region in Frankfurt, Germany, expanding data residency options for European customers. The release also adds bucket lifecycle rules that automatically delete objects after a configurable number of days, with S3-compatible lifecycle policy support via PUT, GET and DELETE operations. Fastly bundled the update with its Direct Fetch transfer capability, positioning Object Storage as a more complete origin and migration target for edge-delivered content.", "type": "Product Launch", "date": "2026-09-08", "source_url": "https://community.fastly.com/t/new-fastly-object-storage-capabilities-and-a-new-storage-region/4493"}, {"title": "Fastly Opens Public Beta of Rewritten Terraform Provider", "summary": "Fastly launched the public beta of a new Terraform provider, published as fastly/fastly-beta on the Terraform Registry. The provider is a ground-up rewrite built on HashiCorp's modern Plugin Framework, replacing the older implementation. Fastly is asking practitioners who manage Fastly services as code to test the beta against real production configurations and share feedback ahead of general availability.", "type": "Product Launch", "date": "2026-09-08", "source_url": "https://community.fastly.com/t/introducing-the-public-beta-of-the-new-fastly-terraform-provider/4494"}]}, "Citrix (NetScaler) ~AI": {"category": "AI Security", "announcements": [{"title": "Citrix Pairs NetScaler AI Gateway With Protecto to Secure Enterprise LLM Traffic", "summary": "Citrix delivered a joint technical session detailing integration between NetScaler AI Gateway and Protecto for securing enterprise LLM traffic. NetScaler acts as the control plane for AI traffic, handling routing, policy enforcement, authentication, rate limiting and observability, while Protecto adds context-aware data masking and tokenization to keep PII and PHI from reaching LLMs without destroying prompt meaning. The session covered the end-to-end request flow, integration architecture and live demonstrations of block-on-detection and mask-and-continue enforcement modes.", "type": "Partnership", "date": "2026-09-08", "source_url": "https://www.citrix.com/events/2026/citrix-netscaler-ai-gateway-protecto-securing-enterprise-llm-traffic.html"}]}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Posts First $3B Quarter and Raises 2026 Outlook to $12.6B on AI Networking Demand", "summary": "At the Goldman Sachs Communacopia + Technology Conference, Arista management reported its first quarter above $3 billion in revenue and raised full-year 2026 guidance to roughly $12.6 billion on improved supply visibility. New and extended multi-year purchase commitments nearly tripled to $9.7 billion, which the company framed as durable AI and data-center demand. Gross margin guidance was held at 62-64% despite tariffs and component inflation, and executives pointed to continued runway in AI networking, scale-across Ethernet, campus switching, and ongoing investment in EOS and CloudVision.", "type": "Earnings", "date": "2026-09-08", "source_url": "https://www.investing.com/news/transcripts/arista-networks-at-goldman-sachs-conference-ai-demand-drives-growth-93CH-4892139"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Juniper Acquisition Drives 117% Networking Growth for HPE as AI Data-Center Orders Surge", "summary": "Analysis of HPE's latest results shows the $14 billion Juniper Networks acquisition delivering outsized returns, with networking product revenue up 117% year over year for the nine months ended July 31, 2026 and data-center routing and switching demand accelerating from hyperscalers and neo-clouds. Backlog remains elevated on demand for routers, switches and AI-driven operations software. Juniper platforms now anchor deployments including Oracle Cloud Infrastructure fabrics, AMD's Helios rack design and scale-up routing work with Tensordyne, positioning HPE to sell Juniper switching beyond its own rack systems.", "type": "Earnings", "date": "2026-09-08", "source_url": "https://www.futuriom.com/articles/news/how-the-juniper-networks-deal-is-paying-off-for-hpe/2026/09"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Details Browser-in-the-Browser Phishing Chaining DocuSign, Adobe and Microsoft", "summary": "Barracuda published threat research on a layered phishing campaign that chains DocuSign, Adobe Acrobat and Microsoft sign-in trust cues into one realistic document-sharing workflow. The final stage uses browser-in-the-browser deception, rendering a fake Microsoft login window inside the attacker's own domain so harvested credentials go to the attacker. Barracuda notes the landing pages are modern web apps with victim-specific branding, multi-stage redirects, CAPTCHA evasion and embedded analytics, signaling attackers now build end-to-end workflows simulating legitimate business processes across multiple trusted brands.", "type": "Threat Intel", "date": "2026-09-08", "source_url": "https://blog.barracuda.com/2026/09/08/browser-in-the-browser-phishing-docusign-adobe-microsoft"}]}, "Barracuda Networks ~P": {"category": "Platforms", "announcements": [{"title": "Barracuda Pitches Unified Partner Success Program and Single Barracuda1 Portal to MSPs", "summary": "In a ChannelCon 2026 interview, Barracuda SVP of Global Channels and Alliances Michelle Hodges positioned the company's unified Partner Success Program, which consolidates seven separate partner access points into a single Barracuda1 portal. Additions include single-pane-of-glass tenant visibility, refreshed incentives, partner badging, co-selling tools and proactive customer-success analytics intended to reduce churn. Hodges framed the effort around helping MSPs operationalize AI, manage compliance and build cyber resilience against AI-driven threats, with guidance to advise customers on AI risk and recovery planning before incidents occur.", "type": "Partnership", "date": "2026-09-08", "source_url": "https://www.e-channelnews.com/interview-with-barracuda-at-channelcon-2026/"}]}, "Zscaler": {"category": "Platforms", "announcements": []}, "Check Point Software": {"category": "Platforms", "announcements": []}, "Cloudflare": {"category": "Platforms", "announcements": []}, "AWS": {"category": "Platforms", "announcements": []}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Radware": {"category": "Application Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-09-08.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
