(function(){
"use strict";
var DATA={"Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Palo Alto Networks and NVIDIA Advance Agentic AI Security, Join OpenShell Reference Architecture", "summary": "At NVIDIA GTC Berlin, Palo Alto Networks announced a five-part agentic AI security collaboration aligned with the NVIDIA OpenShell Reference Architecture. It covers an AI gateway on NVIDIA Vera CPUs, AI Runtime Security on BlueField DPUs, agent identity governance through NVIDIA Sentry, and visibility from Cortex XSIAM integrated with NVIDIA DOCA Argus. Security processing runs in silicon, apart from the host. The company says this makes enforcement tamper-resistant and raises token throughput for AI factory and edge agent workloads.", "type": "Partnership", "date": "2026-10-21", "source_url": "https://www.paloaltonetworks.com/blog/2026/10/advancing-agentic-ai-security-with-palo-alto-networks-and-nvidia/"}, {"title": "Palo Alto Networks Launches Cortex XDR One to Stop Rogue AI Agents on Endpoints", "summary": "Cortex XDR One combines Cortex XDR and Cortex Agentic Endpoint Security into a single sensor and console. It inventories AI apps and both sanctioned and shadow agents, and uses Koi technology to enforce real-time guardrails against prompt injection and malicious instructions. Small LLMs on the device keep protection working offline. Palo Alto claims up to 95% fewer false alarms and automated incident handling. It can be deployed as a standalone AI-agent security layer or as part of the XDR platform.", "type": "Product Launch", "date": "2026-10-21", "source_url": "https://itdaily.com/news/software/palo-alto-networks-stops-runaway-ai-agents-with-cortex-xdr-one/"}]}, "Palo Alto Networks ~AS": {"category": "Application Security", "announcements": [{"title": "Palo Alto Networks Responds to Critical PHP Vulnerabilities Exposing ~22M Instances", "summary": "Palo Alto Networks published guidance on critical PHP flaws CVE-2026-109618 and CVE-2026-109619 (CVSS 9.2), which it says expose about 22 million PHP instances worldwide. It urges immediate virtual patching and AI-driven vulnerability detection against fast, AI-enabled exploitation. It positions Frontier Virtual Patching and Advanced Threat Prevention as real-time mitigations.", "type": "Research", "date": "2026-10-21", "source_url": "https://www.paloaltonetworks.com/blog/2026/10/millions-of-php-instances-exposed-what-organizations-need-to-do-right-now/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Issues Coordinated Frontier-AI Security Hardening Release Across FortiOS, FortiManager, FortiAnalyzer", "summary": "Fortinet announced a coordinated hardening release across FortiOS, FortiManager, FortiAnalyzer, FortiMail and FortiAuthenticator. It fixes critical and high-severity flaws found through frontier AI-assisted security testing, done with Anthropic, OpenAI, Google and SpaceX. FortiOS, FortiManager and FortiAnalyzer updates arrive October 22. FortiMail and FortiAuthenticator fixes are available now. Customers are told to patch internet-facing devices first. Full technical details follow on November 10 via PSIRT.", "type": "Feature Update", "date": "2026-10-21", "source_url": "https://www.fortinet.com/blog/ciso-collective/fortinet-releases-security-hardening-release-for-multiple-products"}, {"title": "Fortinet Wins Crime Stoppers International 2026 Cybersecurity Leadership Award", "summary": "Fortinet received Crime Stoppers International's 2026 Cybersecurity Leadership Award (Corporate & Private Sector). The award recognizes FortiGuard Labs threat intelligence, its support for INTERPOL operations Serengeti 2.0 and Red Card, and its cybersecurity education programs. Fortinet also extended its partnership with Crime Stoppers International.", "type": "Event", "date": "2026-10-21", "source_url": "https://www.fortinet.com/blog/industry-trends/fortinet-recognized-by-crime-stoppers-international-for-cybersecurity-leadership"}]}, "Cisco ~AI": {"category": "AI Security", "announcements": [{"title": "Cisco Expands Secure AI Factory with NVIDIA to Secure AI Agents on BlueField DPUs", "summary": "Cisco detailed infrastructure-level security for AI agents that enforces policy on NVIDIA BlueField DPUs, independent of the workload, so a compromised host cannot bypass controls. The services run on the DPU using VPP and NVIDIA DOCA. They include stateful L4 inspection, microsegmentation and possible L7 services such as accelerated TLS termination through NVIDIA Sentry. Agents are governed through a Plan-Observe-Enforce workflow, and a shared appliance is planned for servers without DPUs.", "type": "Feature Update", "date": "2026-10-21", "source_url": "https://blogs.cisco.com/news/securing-ai-agents-across-the-ai-factory"}, {"title": "Cisco and Fortanix Make Confidential AI Verifiable on Kubernetes", "summary": "Fortanix Confidential AI now supports CNCF Confidential Containers inside Cisco Secure AI Factory with NVIDIA. AI workloads run in hardware TEEs on confidential CPUs and GPUs. Model keys are released only after combined CPU, GPU and software attestation. The target is sensitive workloads in finance, healthcare and government. An end-to-end demo is running at NVIDIA GTC Berlin.", "type": "Partnership", "date": "2026-10-21", "source_url": "https://blogs.cisco.com/datacenter/cisco-and-fortanix-help-make-confidential-ai-verifiable-from-data-to-kubernetes"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cisco Unveils Blueprint to Turn Distributed Capacity into AI Inference Infrastructure", "summary": "At NVIDIA GTC Berlin, Cisco unveiled a routing framework for distributed AI inference. It chooses paths based on latency, throughput, cost and jurisdiction, and uses network slicing to isolate traffic. Service providers can use it to sell inference connectivity, sovereign AI and managed edge AI services. It builds on Crosswork AI and NVIDIA technology for agentic operations, letting providers sell assured AI outcomes rather than plain bandwidth.", "type": "Product Launch", "date": "2026-10-21", "source_url": "https://blogs.cisco.com/news/turn-distributed-capacity-into-ai-infrastructure"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike and NVIDIA Expand AI Agent Security from Software to Silicon", "summary": "CrowdStrike is integrating Falcon Guardian (AI Detection and Response) with the NVIDIA OpenShell secure runtime. It also plans in-silicon enforcement through NVIDIA Sentry on BlueField-4 DPUs. AIDR would then cover agent prompts, model interactions and runtime activity across the OpenShell Reference Architecture, and contain threats at machine speed. Autodesk is named as a Falcon Guardian customer.", "type": "Partnership", "date": "2026-10-21", "source_url": "https://ir.crowdstrike.com/news-releases/news-release-details/crowdstrike-and-nvidia-expand-ai-agent-security-software-silicon/"}, {"title": "CrowdStrike Uncovers Four New Agentic AI Attack Campaigns", "summary": "CrowdStrike exposed four previously unreported threat actors who left their autonomous Supervisor/Executor AI agent frameworks in open directories. The frameworks were inspired by PentestGPT and used MCP servers and Claude-based models. Targets included healthcare in Argentina and government and private sectors in Brazil, the U.S. and elsewhere. CrowdStrike warns agentic AI lets lower-skilled actors finish intrusions within hours.", "type": "Research", "date": "2026-10-21", "source_url": "https://www.crowdstrike.com/en-us/blog/crowdstrike-uncovers-new-agentic-ai-campaigns/"}]}, "CrowdStrike ~AS": {"category": "Application Security", "announcements": [{"title": "CrowdStrike Delivers Falcon Protections Against PHP2Shell RCE Zero-Days", "summary": "CrowdStrike verified that the critical PHP flaws CVE-2026-109618 and CVE-2026-109619 (PHP2Shell) let a single anonymous POST open a shell on Apache mod_php without authentication. Falcon now detects post-exploitation activity such as web shell deployment, and new Exposure Management detections for Linux and Windows identify vulnerable PHP installations.", "type": "Research", "date": "2026-10-21", "source_url": "https://www.crowdstrike.com/en-us/blog/crowdstrike-protects-customers-from-php-rce-zero-days/"}]}, "Zscaler ~AI": {"category": "AI Security", "announcements": [{"title": "Zscaler Integrates Security for AI with NVIDIA OpenShell Reference Architecture", "summary": "Zscaler announced support for NVIDIA's OpenShell Reference Architecture, which NVIDIA unveiled at GTC Berlin. The integration adds Zscaler's Zero Trust access controls, data protection and security operations to OpenShell's runtime governance and NVIDIA Sentry's in-silicon monitoring on BlueField-4 DPUs. The goal is to enforce boundaries for autonomous AI agents across runtimes, APIs, data stores and cloud identities. Reports linked the news to a stock rise of about 7%.", "type": "Partnership", "date": "2026-10-21", "source_url": "https://www.zscaler.com/blogs/partner/zscaler-supports-nvidia-openshell-reference-architecture"}, {"title": "ThreatLabz Details Global AI-Assisted Hacking Campaign", "summary": "Zscaler ThreatLabz published research on a global, mostly financially motivated hacking campaign. The attackers combined customized ARTEX penetration-testing frameworks with AI coding assistants such as Claude Code and Codex. Targets included financial institutions, payment platforms and dating apps in many countries. The attackers used automation and shared AI workflows to keep investigations going across sessions, and Zscaler recommends Zero Trust defenses.", "type": "Research", "date": "2026-10-21", "source_url": "https://www.zscaler.com/blogs/security-research/inside-global-ai-assisted-hacking-campaign"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point Advances AI Agent Safety with NVIDIA OpenShell Reference Architecture", "summary": "Check Point announced a layered approach to AI agent safety built on NVIDIA's OpenShell Reference Architecture. NVIDIA OpenShell handles policy-based runtime governance, and Check Point adds contextual oversight of agent actions. NVIDIA BlueField and Sentry provide hardware-isolated enforcement, and the Check Point AI Factory Firewall protects the underlying AI infrastructure. The goal is to keep agents on task and prevent unintended or harmful actions.", "type": "Partnership", "date": "2026-10-21", "source_url": "https://blog.checkpoint.com/ai-security/keeping-ai-agents-on-task-check-point-advances-ai-agent-safety-with-nvidia-openshell-reference-architecture/"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Positions Hybrid Mesh Network Security for AI-Era Data Centers", "summary": "Check Point says security has to move beyond the perimeter as AI workloads shift on-premises. It cites 29% of organizations already running AI on-prem or in private cloud and another 49% considering it. While 76% call data center perimeter security critical for AI, only 35% feel fully or mostly secured. Check Point pitches Hybrid Mesh Network Security, with unified policy, east-west inspection and AI-driven policy management, and notes its Gartner Hybrid Mesh Firewall MQ Leader status.", "type": "Feature Update", "date": "2026-10-21", "source_url": "https://blog.checkpoint.com/hybrid-mesh/as-ai-is-reshaping-the-data-center-security-has-to-keep-up/"}, {"title": "Check Point Research Exposes Fraudulent Airline Support Numbers Spread via Search and AI Answers", "summary": "Check Point researchers found scammers mass-producing PDFs that impersonate more than 20 travel brands. The PDFs are hosted on trusted university, government and commercial domains, which helps fake support numbers show up in search results, on social media and in AI-generated answers such as Meta AI. Callers are pushed into callback fraud. Because the PDFs contain no malicious code, traditional antivirus scanning misses the threat.", "type": "Research", "date": "2026-10-21", "source_url": "https://blog.checkpoint.com/research/how-fraudulent-airline-support-numbers-exploit-search-results-and-ai-generated-answers/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare WAF Adds Full Transaction Detection and Response Rules; Deploys php2shell Protections", "summary": "Cloudflare made two WAF capabilities generally available. Full transaction detection checks each HTTP request together with its response to find evidence of exploitation. Response rules can block an origin's response before it reaches the requester. Cloudflare used full transaction detection to ship protections for the php2shell PHP vulnerabilities (CVE-2026-109618/109619), active by default about 9 hours before public disclosure, including for Free plan customers.", "type": "Product Launch", "date": "2026-10-21", "source_url": "https://blog.cloudflare.com/full-transaction-waf/"}, {"title": "Cloudflare Launches Vulnerability Discovery and Remediation Service with OpenAI", "summary": "Cloudflare launched a Vulnerability Discovery and Remediation service using OpenAI Daybreak and Codex. It analyzes code the customer authorizes and adds context from live traffic and security signals. The service ranks findings, proposes patches and edge protections, and runs automated checks and human review before customers get the results. Customers decide what changes to apply.", "type": "Partnership", "date": "2026-10-21", "source_url": "https://openai.com/index/cloudflare-cyber/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Commerce and Cloudflare Bring AI Shopping Assistants to BigCommerce Stores via WebMCP", "summary": "Commerce (BigCommerce) and Cloudflare announced WebMCP support for BigCommerce stores. The standard lets browser-based AI agents search, compare and add products to carts directly, with no site changes. Merchants keep control of catalog accuracy, pricing and branding. The feature is on by default for eligible merchants.", "type": "Partnership", "date": "2026-10-21", "source_url": "https://investors.bigcommerce.com/news-releases/news-release-details/commerce-and-cloudflare-bring-ai-shopping-assistants-bigcommerce/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Network Firewall Adds Route 53 Resolved IP Validation", "summary": "AWS Network Firewall can now confirm that a connection's destination IP was resolved by the VPC's Route 53 Resolver. This allows domain-based filtering for any protocol, including SFTP and SSH, not just HTTP/HTTPS. It also blocks SNI spoofing by matching resolved IPs against the SNI. The feature costs nothing extra and is available in all regions that support both Network Firewall and Route 53 Resolver DNS Firewall.", "type": "Feature Update", "date": "2026-10-21", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/network-firewall-route-53-ip-validation/"}, {"title": "AWS Transform Now Builds New Networks and Modernizes Security Groups", "summary": "AWS Transform for migrations now offers three ways to move networks to AWS. Customers can build a new network from scratch, migrate and modernize an existing one, or convert on-prem access rules into optimized security groups for existing VPCs. During conversion it flags stale rules, recommends optimizations and deploys the updated security groups without redeploying the network stack. It works in all AWS commercial and GovCloud regions.", "type": "Feature Update", "date": "2026-10-21", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-transform-new-networks/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "AWS Neuron 2.33 Adds Native PyTorch on Trainium, Neuron Observer, and vLLM Integrations", "summary": "AWS released Neuron 2.33. It includes TorchNeuron, a native PyTorch backend for Trainium Trn2/Trn3 in public beta. Neuron Observer, also in public beta, detects Trainium health issues within a second. The release adds Neuron vLLM 0.29.0 integrations and new Deep Learning AMIs/containers with PyTorch 2.14. It also adds 25 experimental NKI kernels for models including DeepSeek-V3.2 and Qwen3.5.", "type": "Product Launch", "date": "2026-10-21", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-announce-neuron-2-33-0/"}]}, "Lasso Security": {"category": "AI Security", "announcements": [{"title": "Lasso Security Publishes Agentic AI Red Teaming Playbook for Automated Adversarial Testing", "summary": "Lasso Security released a playbook for red teaming AI agents and LLM applications at every stage, from scoping and planning through production. It covers agentic risks such as prompt injection, tool misuse, memory poisoning, system prompt extraction and cascading failures, and explains where traditional pen testing misses AI-specific threats. Lasso uses the playbook to pitch its AI Security Platform, which combines discovery, risk management, automated red teaming and runtime protection.", "type": "Research", "date": "2026-10-21", "source_url": "https://www.lasso.security/resources/ai-red-teaming-playbook-automated-adversarial-testing"}]}, "Pillar Security": {"category": "AI Security", "announcements": [{"title": "Pillar Security Presents 'Privilege Escalation in Google's ADK CI' at AI Agent Security Summit New York", "summary": "Pillar Security AI Security Researcher Ariel Fogel spoke at the AI Agent Security Summit at Pier Sixty in New York on October 21, 2026. His talk, 'Privilege Escalation in Google's ADK CI,' covered privilege-escalation risk in the CI pipeline for Google's Agent Development Kit. The talk adds to a busy October of conference appearances for Pillar's research team.", "type": "Event", "date": "2026-10-21", "source_url": "https://www.pillar.security/events-webinars"}]}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Akamai Security Intelligence Group Details Critical PHP Core RCE Vulnerabilities; App & API Protector Updated", "summary": "Akamai's Security Intelligence Group published research on two critical remote code execution vulnerabilities in PHP core, each rated CVSS v4.0 9.2, after PHP released security patches. Akamai says it has updated App & API Protector to defend against exploitation. It urges organizations to apply vendor patches promptly or deploy WAF rules to block attacks.", "type": "Research", "date": "2026-10-21", "source_url": "https://www.akamai.com/blog/security-research/critical-remote-code-execution-vulnerabilities-php-core"}]}, "Fastly ~AS": {"category": "Application Security", "announcements": [{"title": "Fastly Releases Next-Gen WAF Virtual Patch for Critical 'php2shell' PHP Vulnerabilities", "summary": "Fastly released a virtual patch for two critical PHP vulnerabilities, known as php2shell (CVE-2026-109618 and CVE-2026-109619), that allow remote code execution and denial of service. The patch is available in Fastly's Next-Gen WAF and Classic control panels, with block or log modes. Fastly recommends that customers enable the patch, audit their servers and upgrade to patched PHP versions, and says it is monitoring for exploitation.", "type": "Feature Update", "date": "2026-10-21", "source_url": "https://www.fastly.com/documentation/reference/changes/2026/10/added-virtual-patch-for-CVE-2026-109618-and-CVE-2026-109619/"}, {"title": "Spur Expands Monocle Session Enrichment to Fastly and Amazon CloudFront", "summary": "Spur Intelligence announced that its Monocle session enrichment can now be deployed on Fastly's edge platform and Amazon CloudFront, extending beyond Cloudflare. Security teams can use real-time trust signals at the edge to detect and block risky traffic, such as anonymized and proxy-based sessions, with little friction for legitimate users. The release also adds AI traffic analysis and live health status monitoring.", "type": "Partnership", "date": "2026-10-21", "source_url": "https://www.globenewswire.com/news-release/2026/10/21/3385612/0/en/spur-expands-monocle-session-enrichment-with-fastly-and-amazon-cloudfront-integration.html"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "HPE Teams with NVIDIA to Advance Secure Agentic AI Across Enterprises and Industrial Environments", "summary": "HPE expanded its collaboration with NVIDIA. HPE introduced the NVIDIA Vera CPU Rack for scalable agentic AI workloads and added support for NVIDIA's OpenShell architecture for secure, governed AI agent operations. HPE is also advancing modular AI factory deployment with NVIDIA DSX POD. It is updating HPE Private Cloud AI with new APIs, GPU support and developer tools for hybrid and sovereign environments.", "type": "Partnership", "date": "2026-10-21", "source_url": "https://www.businesswire.com/news/home/20261021721099/en/HPE-Teams-With-NVIDIA-to-Advance-Secure-Agentic-AI-Across-Enterprises-and-Industrial-Environments"}, {"title": "Schneider Electric, NVIDIA and HPE Collaborate on Physical AI for Process Industries", "summary": "Schneider Electric, NVIDIA and HPE announced a strategic collaboration that introduces Industrial AI Agents at the Edge, built on HPE Private Cloud AI and NVIDIA technology. The agents provide real-time operational technology monitoring, cybersecurity and energy optimization inside industrial environments. The partners say the approach addresses data sovereignty, security and AI cost barriers. Early deployments include CMPC Chile.", "type": "Partnership", "date": "2026-10-21", "source_url": "https://www.se.com/ww/en/about-us/newsroom/news/press-releases/Schneider-Electric-NVIDIA-HPE-announce-strategic-collaboration-to-accelerate-Physical-AI-for-Process-Industries-6ad89a6d51489951020d90e6/"}]}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware Named a Leader and Emerging Innovator in QKS Group SPARK Matrix: Bot Management, 2026", "summary": "QKS Group named Radware a Leader and Emerging Innovator in its SPARK Matrix: Bot Management, 2026 report. The report credits Radware's intent-based bot detection, which combines behavioral analysis, real-time signature generation and AI to stop advanced bots and AI agents across multi-cloud environments. It also notes that Radware bundles bot management with its WAF, API and DDoS protection.", "type": "Research", "date": "2026-10-21", "source_url": "https://www.prnewswire.com/news-releases/radware-positioned-as-a-leader-and-emerging-innovator-in-the-spark-matrix-bot-management-2026-by-qks-group-302915410.html"}, {"title": "Radware Ships Rapid Protections for Critical PHP2Shell Vulnerabilities (CVE-2026-109618/109619)", "summary": "Radware released targeted protections for the critical PHP2Shell flaws (CVSS 9.2), which allow unauthenticated code execution. The protections cover Cloud Application Protection, AI Xploit Shield and on-premises AppWall/DefensePro. AI Xploit Shield's Shield Creator generated custom signatures for the specific exploit patterns. Radware's message is 'protect first, patch safely': block attacks during the patching window while teams test and roll out PHP upgrades.", "type": "Feature Update", "date": "2026-10-21", "source_url": "https://www.radware.com/blog/php2shell-act-fast/"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "NetScaler Issues Mitigation Guidance for Critical PHP Flaws in Management Portal (CVE-2026-109618 & CVE-2026-109619)", "summary": "Citrix published guidance for two critical PHP memory-safety flaws (CVSS v4.0 9.2) in the NetScaler management interfaces: NSIP GUI, management-enabled SNIP and Cluster IP. Unauthenticated attackers could use them to run code. No patch is available yet, and Citrix says it is upgrading the PHP package. Until then, customers should isolate management interfaces and restrict them with ACLs. This follows a string of actively exploited NetScaler zero-days this autumn.", "type": "Feature Update", "date": "2026-10-21", "source_url": "https://community.citrix.com/techzone-blogs/110_security-updates/protecting-netscaler-management-access-from-php-cve-2026-109618-cve-2026-109619-r1640/?tab=comments"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": [{"title": "Barracuda Cybersecurity Skills Gap Report: 68% of Security Teams Face AI Skills Gaps", "summary": "Barracuda's Cybersecurity Skills Gap Report surveyed 2,000 IT and security decision-makers at organizations with 100 to 2,000 employees. 94% report cybersecurity skills gaps and 68% report AI-related gaps. 56% say AI has led to security headcount cuts. 79% say AI is changing security roles, but 69% still keep humans responsible for final incident-response decisions. The skills most in demand are AI governance, identity security and risk management.", "type": "Research", "date": "2026-10-21", "source_url": "https://www.businesswire.com/news/home/20261021927232/en/Cybersecurity-Teams-Under-Pressure-as-AI-Exposes-Skills-Gaps-and-Drives-Head-Count-Reduction"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": []}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-10-21.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
