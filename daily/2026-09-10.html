var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Named a Leader in the 2026 Gartner Magic Quadrant for Hybrid Mesh Firewall", "summary": "Palo Alto Networks was named a Leader in the 2026 Gartner Magic Quadrant for Hybrid Mesh Firewall for the second consecutive time, and positioned furthest for Completeness of Vision. The company tied the recognition to its integrated platform story, highlighting preemptive protection, agentic security operations, AI runtime security, and quantum-safe capabilities spanning every enterprise environment.", "type": "Award", "date": "2026-09-10", "source_url": "https://www.paloaltonetworks.com/blog/2026/09/palo-alto-networks-named-a-leader-in-the-2026-gartner-magic-quadrant-for-hybrid-mesh-firewall-securing-every-environment-at-the-speed-of-frontier-ai/"}, {"title": "Palo Alto Networks CEO Sees AI Driving Cybersecurity Consolidation and New Demand", "summary": "Speaking at the Goldman Sachs Communacopia + Technology Conference, CEO Nikesh Arora said AI is intensifying focus on vulnerabilities and creating fresh demand for integrated security tooling, data consolidation, and traffic inspection. He argued AI-driven compute growth will increase network traffic and the need for inspection via SASE and next-gen firewalls, and cited roughly $100 million in Prisma AIRS revenue from securing AI traffic.", "type": "Announcement", "date": "2026-09-10", "source_url": "https://www.marketbeat.com/instant-alerts/event-palo-alto-networks-ceo-sees-ai-driving-cybersecurity-consolidation-and-new-demand-2026-09-10/"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Secure AI Coding: Governing Every Agent, Artifact, and Identity", "summary": "Palo Alto Networks introduced an integrated approach to AI coding security designed to close visibility gaps across endpoint activity, LLM traffic, token usage, and agent identity. The company positions it as a way to govern what gets installed, what runs, what data leaves the enterprise, and which identities are used \u2014 replacing the fragmentation that comes from stitching together separate point tools for developer AI assistants and coding agents.", "type": "Product Launch", "date": "2026-09-10", "source_url": "https://www.paloaltonetworks.com/blog/2026/09/secure-ai-coding-governing-every-agent-artifact-and-identity/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Named a Leader in the 2026 Gartner Magic Quadrant Report for Hybrid Mesh Firewall", "summary": "Fortinet announced it was named a Leader in the 2026 Gartner Magic Quadrant for Hybrid Mesh Firewall, with the highest score for Ability to Execute for the second consecutive year. The release centers on FortiGate firewalls powered by FortiASICs and FortiOS as part of the Fortinet AI-Native Security Fabric across physical, virtual, cloud-native, and as-a-service deployments, and notes Fortinet's recognition across 11 Gartner Magic Quadrant reports overall.", "type": "Award", "date": "2026-09-10", "source_url": "https://www.fortinet.com/corporate/about-us/newsroom/press-releases/2026/fortinet-named-a-leader-in-the-2026-gartner-magic-quadrant-report-for-hybrid-mesh-firewall"}, {"title": "CISA Warns of Actively Exploited Fortinet Heap-Based Buffer Overflow (CVE-2025-25249)", "summary": "CISA added an actively exploited Fortinet flaw (CVE-2025-25249) affecting FortiOS, FortiSwitchManager, and FortiSASE to its Known Exploited Vulnerabilities catalog, setting a September 12 federal patch deadline. The heap-based buffer overflow enables unauthenticated remote code execution and has been tied to the PivotC2 campaign installing native remote-access malware on FortiGate devices. Fortinet customers are urged to patch, limit external management exposure, rotate credentials, and hunt for indicators of compromise.", "type": "Research", "date": "2026-09-10", "source_url": "https://cybersecuritynews.com/fortinet-heap-based-buffer-overflow/"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Global Industry Leaders Join Cisco's WebexOne to Showcase What's Next for AI-Powered Work", "summary": "Cisco previewed WebexOne, its AI-powered collaboration event running October 5\u20138 in Austin, promising executive-led sessions and new innovations. The agenda emphasizes Intelligent Workplace Experiences that combine AI collaboration, secure networking, and smart spaces, with Cisco leaders including Jeetu Patel outlining the AI collaboration strategy. Cisco frames the event around measurable employee and customer experience impact rather than a single product launch.", "type": "Announcement", "date": "2026-09-10", "source_url": "https://newsroom.cisco.com/c/r/newsroom/en/us/a/y2026/m09/media-alert-global-industry-leaders-join-cisco-webexone-to-showcase-what-s-next-for-ai-powered-work.html"}, {"title": "Cisco Warns of Active Exploitation of Secure Firewall Management Center Flaws", "summary": "Cisco confirmed that two Secure Firewall Management Center vulnerabilities (CVE-2026-20079 and CVE-2026-20316) are under active exploitation by nation-state and ransomware actors, with one flaw allowing root-level access. Cisco urged customers to apply hotfixes immediately, and CISA added the issue to its Known Exploited Vulnerabilities catalog with a September 12 federal patch deadline. The incident puts renewed scrutiny on centralized firewall management planes.", "type": "Announcement", "date": "2026-09-10", "source_url": "https://www.securityweek.com/organizations-warned-of-cisco-secure-fmc-exploitation/"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Infleqtion and Cisco Announce Collaboration to Advance Networked Quantum Technology", "summary": "Cisco and Infleqtion announced a collaboration to connect and scale neutral-atom quantum computers and sensors using Cisco's quantum networking stack. The work targets architectures that link multiple quantum devices into distributed, interoperable networks, drawing on Cisco's quantum networking hardware and software research and its Universal Quantum Switch prototype for routing quantum information while preserving entanglement. Research themes include quantum memory, optical transduction, and network-aware software for coordinating multi-modal workloads.", "type": "Partnership", "date": "2026-09-10", "source_url": "https://infleqtion.com/infleqtion-and-cisco-announce-collaboration-to-advance-networked-quantum-technology/"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Advances Project QuiltWorks with Regional Partner Expertise Across North America", "summary": "CrowdStrike announced the first geographic localization of Project QuiltWorks, assembling a North American partner cohort that includes CDW, GuidePoint Security, Optiv, Presidio, EVOTEK, Echelon Risk + Cyber, Consortium, Pondurance, NETbuilder, and Blackthorne Consulting. The partners deliver frontier AI readiness assessments, architecture and engineering, offensive security, MDR, and remediation services for U.S. and Canadian customers, aiming to shorten the path from AI risk findings to remediation at regional scale.", "type": "Partnership", "date": "2026-09-10", "source_url": "https://www.crowdstrike.com/en-us/press-releases/crowdstrike-advances-project-quiltworks-with-partners-across-north-america/"}]}, "CrowdStrike ~AI": {"category": "AI Security", "announcements": [{"title": "CrowdStrike Details Falcon Guardian Momentum and Forthcoming AI Gateway", "summary": "At the Goldman Sachs Communacopia + Technology Conference, CrowdStrike executives positioned Falcon Guardian \u2014 now generally available and integrated with Pangea for prompt inspection \u2014 as potentially a larger opportunity than traditional EDR given the ratio of AI agents to humans. They also outlined a forthcoming AI Gateway for environments without CrowdStrike agents, transparently proxying agentic traffic and integrating with major third-party AI gateways to enforce control points.", "type": "Announcement", "date": "2026-09-10", "source_url": "https://stockanalysis.com/stocks/crwd/transcripts/740964-goldman-sachs-communacopia-technology-conference-2026/"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler Redefines Zero Trust SASE for the AI Era", "summary": "Zscaler expanded Zero Trust SASE within a single cloud-native architecture, introducing the ZAgent Framework for agentic administration that automates governance, root-cause analysis, drift detection and policy validation. New components include a Zero Trust Browser and Enterprise Browser for unmanaged/BYOD devices as a VPN and VDI replacement, a Zero Trust B2B Gateway to secure partner and supply-chain access without network exposure, and a Zero Trust Gateway for Google Cloud that extends existing AWS support to multi-cloud workload protection.", "type": "Product Launch", "date": "2026-09-10", "source_url": "https://ir.zscaler.com/news-releases/news-release-details/zscaler-redefines-zero-trust-sase-ai-era"}]}, "Zscaler ~AI": {"category": "AI Security", "announcements": [{"title": "Zscaler Expands Project AI-Guardian, Uniting Tech Giants to Secure Enterprise AI at Scale", "summary": "Zscaler announced the next phase of Project AI-Guardian, broadening the initiative beyond global system integrators to a technology alliance including AWS, Google Cloud, Databricks, OpenAI, CoreWeave, Equinix, Glean, Saviynt and Deep Cogito, plus new integrations from Coforge and NTT DATA. Built on the Zero Trust Exchange and AI Protect portfolio, the program shares security signals, identity context and inline enforcement actions in real time across the AI pipeline \u2014 from compute infrastructure through autonomous agent interactions \u2014 using AI Access Graph, AI attack-surface modeling and AI governance services.", "type": "Partnership", "date": "2026-09-10", "source_url": "https://www.zscaler.com/press/zscaler-expands-ai-guardian-uniting-tech-giants-secure-enterprise-ai-scale"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Named a Leader in the 2026 Gartner Magic Quadrant for Hybrid Mesh Firewall", "summary": "Check Point announced it was named a Leader in Gartner's 2026 Magic Quadrant for Hybrid Mesh Firewall. The company tied the recognition to its Hybrid Mesh Network Security strategy and its recently launched AI Network Firewall, which it positions as the first to deliver AI security from existing physical firewalls without additional infrastructure. Executives framed the placement as validation of a unified, agentic-orchestration platform spanning the enterprise edge through AI data centers as enterprise AI adoption accelerates.", "type": "Award", "date": "2026-09-10", "source_url": "https://www.prnewswire.com/news-releases/check-point-named-a-leader-in-the-2026-gartner-magic-quadrant-for-hybrid-mesh-firewall-302875461.html"}, {"title": "Check Point Warns of Two Critical VPN Flaws Enabling Unauthenticated Remote Code Execution", "summary": "Check Point disclosed two critical vulnerabilities affecting Quantum Security Gateway and Quantum Security Management: an authentication bypass and RCE in Remote Access and site-to-site VPN, and an ASN.1 decoding heap overflow leading to RCE. The flaws were found internally, with no evidence of active exploitation reported. Check Point urges customers to apply the latest Jumbo Hotfix for affected R82 and R81.20 versions; Live Patch customers receive automatic protection, while others must follow the published advisories.", "type": "Announcement", "date": "2026-09-10", "source_url": "https://cybercory.com/2026/09/10/check-point-warns-of-two-critical-vpn-flaws-that-could-enable-unauthenticated-remote-code-execution/"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "PuzzleMask: The Prompt Injection Hiding in Plain Sight", "summary": "Check Point Research published findings on PuzzleMask, a prompt-injection technique that conceals malicious instructions inside content that appears benign to human reviewers and conventional filters. The research details how the obfuscation evades common LLM input inspection and argues that static keyword or pattern-based guardrails are insufficient, pointing instead toward context-aware inspection of model inputs and outputs. The post reinforces Check Point's AI-security positioning following its Lakera acquisition and AI Defense Plane rollout.", "type": "Research", "date": "2026-09-10", "source_url": "https://blog.checkpoint.com/security/puzzlemask-the-prompt-injection-hiding-in-plain-sight/"}]}, "Cloudflare": {"category": "Platforms", "announcements": []}, "Cloudflare ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "1.1.1.1 Now Supports Post-Quantum DNSSEC, All 2,420 Bytes of It", "summary": "Cloudflare's 1.1.1.1 resolver now validates DNSSEC signatures using the NIST-standardized post-quantum ML-DSA-44 algorithm, a first step toward post-quantum readiness for DNS. The deployment stress-tests large DNS responses, since ML-DSA-44 signatures run 2,420 bytes, and is designed to prevent downgrade or fallback to conventional signatures. Cloudflare frames the work as part of its goal to reach full post-quantum security across its systems by 2029, running in parallel with its post-quantum TLS efforts.", "type": "Feature Update", "date": "2026-09-10", "source_url": "https://blog.cloudflare.com/post-quantum-dnssec-1111/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Use Cloudflare Containers with Codex via the OpenAI Agents API", "summary": "Cloudflare shipped an integration that runs OpenAI's Codex on Cloudflare Containers through the OpenAI Agents API, with OpenAI managing the agent session and Cloudflare providing the self-hosted execution environment. A reference Workers template maintains one container per Codex session, keeps work alive across reconnections, and auto-shuts down when idle. Cloudflare notes the pattern can be extended to restrict data and network access or wire agent execution into other Cloudflare products.", "type": "Feature Update", "date": "2026-09-10", "source_url": "https://developers.cloudflare.com/changelog/post/2026-09-10-using-openai-agents-api-with-cloudflare-containers/"}]}, "Cloudflare ~AS": {"category": "Application Security", "announcements": [{"title": "Cloudflare WAF Emergency Release \u2013 September 10, 2026", "summary": "Cloudflare published an emergency WAF release on September 10, pushing out-of-band managed ruleset updates to address newly observed exploitation activity. Emergency releases are deployed rapidly across the Cloudflare network rather than following the normal staged rollout schedule, giving customers on managed rulesets immediate coverage without action on their part. The release underscores the operational cadence advantage Cloudflare markets for cloud-delivered WAF versus self-managed rule maintenance.", "type": "Feature Update", "date": "2026-09-10", "source_url": "https://developers.cloudflare.com/changelog/post/2026-09-10-emergency-waf-release/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "Announcing Second-Generation Single-Rack AWS Outposts", "summary": "AWS announced general availability of second-generation single-rack Outposts, a self-contained 42U rack combining compute, storage and networking for low-latency on-premises workloads with data residency requirements. Each unit scales to 2,688 vCPU and 100 TB of EBS storage, supports the latest x86 EC2 families (M7i/M8i, C7i/C8i, R7i/R8i), and offers accelerated networking instances. AWS targets space- and power-constrained sites such as manufacturing and gaming while keeping APIs, management, governance and security consistent with multi-rack Outposts and AWS Regions.", "type": "Product Launch", "date": "2026-09-10", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/single-rack-aws-outposts/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Reduce LLM Latency with Prefix-Aware Routing on Amazon SageMaker Inference", "summary": "AWS introduced prefix-aware routing for Amazon SageMaker real-time inference endpoints, directing requests that share the same prompt prefix to the same instance so the KV cache stays warm and is reused. In Llama 3.1 70B benchmarks AWS reported up to a 77% reduction in P50 time-to-first-token and up to 16% higher throughput, with KV cache hit rates rising from roughly 25% to over 80%. It is enabled through a new RoutingStrategy with PrefixAwareRoutingConfig.", "type": "Feature Update", "date": "2026-09-10", "source_url": "https://dataforcee.us/2026/09/10/reduce-llm-latency-with-prefix-aware-routing-on-amazon-sagemaker-inference/"}]}, "AWS ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Amazon API Gateway Now Supports 1 MB Execution Logs with Configurable Delivery Destinations", "summary": "AWS expanded API Gateway execution logging from a 1 KB truncated, API Gateway-managed CloudWatch log group to entries up to 1 MB that can be delivered simultaneously to CloudWatch Logs, Amazon S3 and Amazon Data Firehose. Customers can now capture full request and response payloads for debugging, archive Parquet in S3 for Athena analysis, stream to SIEM via Firehose, and keep real-time CloudWatch alerting. Delivery is configured through the console, CLI or CloudFormation and is available in all REST API Regions.", "type": "Feature Update", "date": "2026-09-10", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/09/amazon-api-gateway-1-mb-execution-logs/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": [{"title": "Lasso Research Discloses MaxKBypass (CVE-2026-77521): Prompt Injection Escapes MaxKB Agent Sandbox", "summary": "Lasso Security's research team published a disclosure for CVE-2026-77521, dubbed MaxKBypass, a critical prompt-injection flaw in the MaxKB agent platform affecting versions up to 2.10.4-LTS. Untrusted input could reach dangerous execution capabilities because the sandbox environment prefix was applied globally rather than per-invocation, letting attackers break out of the agent sandbox. The writeup maps the issue to CWE-749, CWE-78, CWE-250 and OWASP LLM01, and details the code changes required to enforce sandboxing on every call.", "type": "Research", "date": "2026-09-10", "source_url": "https://www.lasso.security/blog/cve-2026-77521-maxkbypass---from-prompt-injection-to-bypassing-maxkb-agents-sandbox"}]}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": [{"title": "Mindgard Expands AI and Cloud Ecosystem with Anthropic, NVIDIA, Microsoft, Google Cloud and AWS", "summary": "Mindgard announced an expansion of its AI security ecosystem through alignments with Anthropic's Cyber Verification Program, NVIDIA Inception, Microsoft Founders Hub, Google Cloud's high-growth AI program and AWS Activate. The company says the arrangements keep it close to frontier models, infrastructure and deployment architectures while preserving independent security assessment. Mindgard plans to feed resulting insights into new platform capabilities for finding vulnerabilities and hardening defenses across increasingly distributed, multi-model, multi-provider enterprise AI environments. The move follows Mindgard's $30M Series A.", "type": "Partnership", "date": "2026-09-10", "source_url": "https://aithority.com/it-and-devops/cloud/mindgard-expands-ai-and-cloud-ecosystem-with-anthropic-nvidia-microsoft-google-cloud-and-aws/"}]}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "ITV Selects Akamai TrafficPeak to Optimize World Cup Streaming", "summary": "Akamai announced that UK broadcaster ITV deployed TrafficPeak, powered by Hydrolix, on Akamai Cloud to optimize World Cup 2026 streaming on ITVX. The managed observability service cut log latency from 5\u201315 minutes to subsecond ingestion, giving ITV's network operations center real-time visibility across its multi-CDN delivery footprint. That allowed operators to distinguish core platform issues from last-mile bottlenecks, isolate problems proactively and protect ad revenue during peak live-event traffic. TrafficPeak runs as a containerized Kubernetes managed service within ITV's Akamai Cloud environment.", "type": "Announcement", "date": "2026-09-10", "source_url": "https://www.stocktitan.net/news/AKAM/itv-selects-akamai-traffic-peak-to-optimize-world-cup-0ci1fr36acr6.html"}]}, "Akamai ~AI": {"category": "AI Security", "announcements": [{"title": "Akamai and MuleSoft Unify Real-Time API Defense and AI Policy Control Across Agent Fabric", "summary": "Akamai and MuleSoft announced an expanded bi-directional integration linking Akamai API Security with MuleSoft's Agent Fabric to unify runtime API defense with AI policy control across APIs, agents and MCP servers. The integration monitors live API traffic, syncs MuleSoft Exchange API specifications to detect drift, shadow and undocumented endpoints, and feeds Akamai behavioral risk scores into MuleSoft's control plane for policy enforcement across agentic workflows. More than 20 joint customers already use it, with native onboarding and enhanced AI/MCP runtime security planned for H2 2026.", "type": "Partnership", "date": "2026-09-10", "source_url": "https://www.stocktitan.net/news/AKAM/akamai-and-mule-soft-unify-real-time-api-defense-and-ai-policy-9g7a6t07ejk1.html"}]}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Introducing AI Assistant for Akamai Web Security Analytics", "summary": "Akamai introduced an AI Assistant for Akamai Web Security Analytics aimed at helping SOC and AppSec teams investigate security events faster. The assistant lets analysts query WAF, bot and DDoS telemetry in natural language instead of building manual filters and queries, then take guided remediation actions inside the investigative flow. The capability is positioned to reduce time-to-insight for web application and API protection teams and lower the expertise barrier for security reporting and rule changes.", "type": "Feature Update", "date": "2026-09-10", "source_url": "https://www.itsecuritynews.info/introducing-ai-assistant-for-akamai-web-security-analytics/"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": []}, "Fastly ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Comcast and Fastly Partner on Next-Generation Content and Application Delivery for Xfinity Members", "summary": "Comcast and Fastly announced a partnership to embed Fastly's programmable edge software into Comcast's edge compute platform and extend it into the network via vCMTS across more than 200 U.S. edge sites. The goal is to move live streaming and applications closer to Xfinity customers, cutting latency, raising peak streaming capacity and improving video quality during large events. The combined platform delivers real-time traffic management, security, edge compute and AI services \u2014 including edge AI inference \u2014 on a single programmable layer.", "type": "Partnership", "date": "2026-09-10", "source_url": "https://www.fastly.com/de/press/press-releases/comcast-fastly-partner-to-develop-next-generation-content-and-application-deliver-model-to-xfinity-members"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Critical NetScaler Authentication Bypass CVE-2026-19490 Exploited in Attacks, Added to CISA KEV", "summary": "Citrix's critical NetScaler authentication bypass flaw CVE-2026-19490 (CVSS 9.3) is being actively exploited in the wild, with attacks observed since at least September 3. The bug affects all NetScaler ADC and NetScaler Gateway appliances configured as a gateway or AAA virtual server and requires no authentication to exploit remotely. CISA added it to the Known Exploited Vulnerabilities catalog and gave federal agencies three days to patch. Citrix shipped fixes on August 19 and offers no mitigation short of upgrading.", "type": "Announcement", "date": "2026-09-10", "source_url": "https://www.securityweek.com/critical-netscaler-vulnerability-exploited-in-attacks/"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Targets $12.6B in 2026 Revenue as AI, Campus, and Cloud Networking Growth Accelerates", "summary": "At the Goldman Sachs Communacopia + Technology Conference, Arista CFO Chantelle Breithaupt reaffirmed a $12.6 billion 2026 revenue target implying roughly 40% growth, with R&D running 8\u201310% of revenue and no tradeoffs between AI, campus, cloud, data-center switching, software and routing investments. CTO Ken Duda said co-development with hyperscalers on customized systems strengthens the broader portfolio, benefiting specialty cloud providers and enterprises. Arista also signaled raised campus investment targets tied to its 2026 plan.", "type": "Announcement", "date": "2026-09-10", "source_url": "https://transcriptdaily.com/2026/09/10/arista-networks-targets-12-6b-as-ai-campus-and-cloud-networking-growth-accelerates.html"}, {"title": "Arista Presents at Citi's 2026 Global TMT Conference, Defends AI Growth and Deferred Revenue Profile", "summary": "Arista CFO Chantelle Breithaupt and SVP Tyson Lamoreaux presented at Citi's 2026 Global TMT Conference, reaffirming roughly 40% revenue growth and about $12.6 billion for the year on AI-driven demand. Management addressed investor questions on deferred revenue dynamics and how AI use cases change revenue recognition timing versus underlying growth. The discussion reinforced Arista's positioning in high-speed AI back-end fabrics while acknowledging hyperscale customer concentration as a risk.", "type": "Announcement", "date": "2026-09-10", "source_url": "https://seekingalpha.com/article/4945220-arista-networks-inc-anet-presents-at-citis-2026-global-tmt-conference-transcript"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "HPE Details Juniper AI Networking Go-to-Market at Goldman Sachs Communacopia Conference", "summary": "At the Goldman Sachs Communacopia + Technology Conference, HPE executives laid out how the Juniper integration is reshaping its networking opportunity, highlighting multi-generation custom silicon work and a Direct Liquid Cooling switch drawing strong market interest. HPE described a combined go-to-market that puts Juniper routing and switching into its full channel and partner network, with a Partner Day on November 1 to train partners to sell both portfolios. The pitch targets hyperscaler and enterprise AI data center buildouts for both training and inference.", "type": "Announcement", "date": "2026-09-10", "source_url": "https://stockanalysis.com/stocks/hpe/transcripts/741925-goldman-sachs-communacopia-technology-conference-2026/"}, {"title": "HPE's AI Networking Engine Was Already Running \u2014 Oracle Is Just Fuel", "summary": "Analysis published September 10 argues HPE's AI networking momentum predates the Oracle deal, with Juniper-derived PTX/MX routing and QFX switching already driving triple-digit networking growth and multiyear-high backlog. The Oracle Cloud Infrastructure global rollout is framed as accelerant rather than origin, extending HPE Juniper gear across OCI AI superclusters, regional data centers and edge networks. The piece flags hyperscaler and neo-cloud order concentration as the key variable in HPE's networking trajectory.", "type": "Research", "date": "2026-09-10", "source_url": "https://www.ainvest.com/news/hpe-ai-networking-engine-running-oracle-fuel-2609/"}]}, "Radware": {"category": "Application Security", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": []}, "Barracuda Networks ~P": {"category": "Platforms", "announcements": [{"title": "Barracuda Launches Redesigned Trust Center to Simplify Security Due Diligence", "summary": "Barracuda rolled out a redesigned Trust Center built around product-first navigation for BarracudaONE, Barracuda solutions and services, and the Barracuda IQ AI engine. New capabilities include an interactive global data center map for data residency, visibility into certifications in progress, a Due Diligence Navigator for supplier reviews, a Bailey AI assistant for locating security and compliance documentation, and a dedicated SLED page for state, local government and education regulatory needs. The goal is faster, more predictable security evaluations for customers, MSPs and partners.", "type": "Feature Update", "date": "2026-09-10", "source_url": "https://blog.barracuda.com/2026/09/10/barracuda-trust-center-security-due-diligence"}, {"title": "Barracuda Launches Partner-First Conversations Podcast for MSPs and Channel Leaders", "summary": "Barracuda debuted Partner-First Conversations, a podcast series aimed at MSPs and channel leaders, hosted by Michelle Hodges with first guest Richard Flanders of Aura Technology and Barracuda's Partner Advisory Board. The opening episode covers reducing operational complexity and consolidating security operations through BarracudaONE and Managed XDR, and argues for shifting from product-led to outcome-led customer engagement. The series positions Barracuda's platform consolidation story directly at the managed service provider channel.", "type": "Announcement", "date": "2026-09-10", "source_url": "https://blog.barracuda.com/2026/09/10/barracuda-podcast-partner-first-msp-growth"}, {"title": "Barracuda Ships Message Archiver 5.5.4 and BarracudaONE September Release", "summary": "Barracuda published its September 10, 2026 product release notes, including What's New in Message Archiver 5.5.4 and the BarracudaONE 2026.09.10 release. The updates continue Barracuda's steady cadence of incremental platform maintenance across its email and unified management products, delivered through the BarracudaONE console that anchors its consolidation pitch to MSPs.", "type": "Feature Update", "date": "2026-09-10", "source_url": "https://documentation.campus.barracuda.com/wiki/spaces/HOME/blog/2026/09/10/834535604/What+s+New+in+Message+Archiver+5.5.4"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "Imperva Customers Protected Against StyleSmuggler (CVE-2026-75650) in Adobe Commerce and Magento", "summary": "Imperva disclosed that its customers are protected against StyleSmuggler, tracked as CVE-2026-75650, a vulnerability affecting Adobe Commerce and Magento Open Source. The company detailed the exploitation path and confirmed that existing Imperva WAF and application security signatures mitigate the flaw without customer action. The advisory reinforces Imperva's virtual-patching value proposition for e-commerce platforms facing rapid post-disclosure exploitation.", "type": "Research", "date": "2026-09-10", "source_url": "https://securityboulevard.com/2026/09/imperva-customers-protected-against-stylesmuggler-cve-2026-75650-in-adobe-commerce-and-magento-open-source/"}]}};

  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
</html>
