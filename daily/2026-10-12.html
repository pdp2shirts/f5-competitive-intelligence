(function(){
"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Announces Automatic Telemetry Enablement for Eligible PAN-OS NGFWs", "summary": "Palo Alto Networks will turn on Full-tier telemetry by default for eligible PAN-OS NGFWs (10.2.17+, 11.1.11+, 11.2.8+, 12.1.2+, 12.2.0+). The settings will be managed centrally from the Palo Alto Networks Hub, and Panorama and PAN-OS telemetry settings become read-only. It rolls out in three waves on October 19, 21 and 26, 2026, and collects device health, threat prevention and feature-usage data. This moves its firewall base further toward cloud-managed control, a useful comparison point for F5 operations and platform messaging.", "type": "Product Update", "date": "2026-10-12", "source_url": "https://live.paloaltonetworks.com/t5/community-blogs/upcoming-change-telemetry-enablement-for-eligible-pan-os-ngfws/ba-p/1265991"}, {"title": "Ransomware Groups Continue Exploiting Palo Alto GlobalProtect Flaw CVE-2026-0257", "summary": "Infosecurity Magazine reports, citing ReliaQuest, that ransomware groups including Qilin and Settra are still exploiting CVE-2026-0257. The flaw is an authentication bypass in PAN-OS GlobalProtect and Prisma Access that was disclosed and patched in May 2026, and it lets attackers open VPN sessions without credentials. Ongoing VPN-gateway exploitation gives F5 sellers an opening to talk about secure access and application-layer protection with affected Palo Alto customers.", "type": "Research/Report", "date": "2026-10-12", "source_url": "https://www.infosecurity-magazine.com/news/palo-alto-vpn-vulnerability-target/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Advances Cybercrime Cooperation at the CSI 2026 Global Summit", "summary": "Fortinet will take part in the CSI 2026 Global Summit (October 14\u201316, Panama City), where FortiGuard Labs' Derek Manky will speak on public-private threat intelligence sharing. Fortinet pointed to its Cybercrime Bounty program with CSI, whose first live bounty in August 2026 targeted INC ransomware operators, and its work on the World Economic Forum's Cybercrime Atlas. This is threat-intelligence brand building with little direct product overlap with F5.", "type": "Event", "date": "2026-10-12", "source_url": "https://www.fortinet.com/blog/industry-trends/fortinet-advances-cybercrime-cooperation-at-the-csi-2026-global-summit"}]}, "Cisco ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "NVIDIA and Cisco Introduce New Pluggable Optics Form Factor (USFP) to Scale AI Factories", "summary": "Cisco and NVIDIA introduced the Ultra-Dense Small Form Factor Pluggable (USFP), an optical form factor supporting 400 Gb/s per lane and up to 12.8 Tb/s per module. The companies cite 4x the bandwidth and about 1.3x better power efficiency than 200G-per-lane modules. TE Connectivity and Amphenol are ecosystem partners, and the spec will be open through a multi-source agreement. This strengthens the Cisco\u2013NVIDIA AI-fabric relationship, relevant to F5's NVIDIA alliance and AI data delivery positioning.", "type": "Partnership", "date": "2026-10-12", "source_url": "https://newsroom.cisco.com/c/r/newsroom/en/us/a/y2026/m10/nvidia-and-cisco-new-pluggable-optics-to-scale-ai-factories.html"}, {"title": "Cisco Advances Scalability and Openness at OCP 2026", "summary": "At OCP Global Summit 2026, Cisco showed new silicon, systems and optics for open AI infrastructure, from rack-scale compute to distributed AI capacity. Reports name the Silicon One G302 top-of-rack chip, shipping before the end of 2026, and say Silicon One P200 is in production at hyperscalers. Cisco also stressed openness from silicon up to Kubernetes, including closer SONiC alignment. Cisco is pushing further into AI networking infrastructure, adjacent to F5's AI traffic management and inference delivery.", "type": "Product Launch", "date": "2026-10-12", "source_url": "https://www.prnewswire.com/news-releases/cisco-advances-scalability-and-openness-at-ocp-2026-302905690.html"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike in Advanced Talks to Acquire Israeli Startup Orion Security for ~$500 Million", "summary": "Calcalist (Ctech) reports that CrowdStrike is in advanced talks to buy Orion Security for about $500 million. Orion, founded in 2024, sells an AI-powered data security platform meant to replace traditional DLP by analyzing the context of data movement, and has raised $38 million. A deal would add to CrowdStrike's string of Israeli acquisitions and extend the Falcon platform into data protection, in line with broader platform consolidation. CrowdStrike has not issued an official announcement.", "type": "Acquisition", "date": "2026-10-12", "source_url": "https://www.calcalistech.com/ctechnews/article/6yaabbwfz"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "LinkAxia Networks to Deliver Zscaler Zero Trust Security Solutions for Malaysia's Public Sector and GLCs", "summary": "LinkAxia Networks announced a distribution partnership to bring Zscaler's Zero Trust Exchange to Malaysia's public sector and government-linked companies, covering secure private-app access, cloud and SaaS traffic protection, and data security across web, cloud and AI apps. The deal follows Zscaler's new Kuala Lumpur data center and supports compliance with Malaysia's Cyber Security Act 2024. It extends Zscaler's APAC public-sector channel reach, where F5 competes for secure access and app security deals.", "type": "Partnership", "date": "2026-10-12", "source_url": "https://www.prnewswire.com/apac/news-releases/linkaxia-networks-to-deliver-zscaler-zero-trust-security-solutions-for-malaysias-public-sector-and-glcs-302905592.html"}, {"title": "What's New in ZDX: Sharper Alerts, Cleaner Data, Faster Troubleshooting", "summary": "Zscaler's October 12 release of Zscaler Digital Experience (ZDX) adds filters to collaboration-quality alerts by location, country and city, plus grouping to separate local from regional issues. It also adds filtering by data center, more accurate Real User Monitoring, and a more consistent Experience Center interface. This is a modest observability update to Zscaler's monitoring layer and a reference point for F5's own observability messaging.", "type": "Product Update", "date": "2026-10-12", "source_url": "https://www.zscaler.com/mx/blogs/product-insights/what-s-new-zdx-sharper-alerts-cleaner-data-faster-troubleshooting"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point SASE October 2026 Product Enhancements: New PoPs, IPsec Ciphers, Dynamic DNS", "summary": "Check Point added SASE points of presence in Shanghai (IPsec site-to-site, with a dedicated license) and Milan 3 (US and EU data residency). The update also expands IPsec cipher suites for site-to-site tunnels and adds Dynamic DNS for domain-joined devices on Standard networks. Microsoft Entra ID SCIM now syncs email and UPN changes automatically. These changes widen the footprint of Check Point's platform-wide SASE offer.", "type": "Product Update", "date": "2026-10-12", "source_url": "https://blog.checkpoint.com/product-updates/1-check-point-sase-october-2026-product-enhancements/"}, {"title": "Check Point Research: Global Cyberattacks Up 48% Year over Year in September; GenAI Prompt Data Risk", "summary": "Check Point Research's October 12 Threat Intelligence Report says global cyberattacks rose 48% year over year in September 2026, to about 2,803 weekly attacks per organization. Education was the most targeted sector, and ransomware rose 53%. The report says about 1 in 39 enterprise GenAI prompts risks exposing sensitive data and describes generative AI as standard attacker tooling. F5 PMM can use these figures in AI security and app security messaging.", "type": "Research/Report", "date": "2026-10-12", "source_url": "https://research.checkpoint.com/2026/12th-october-threat-intelligence-report/"}]}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point SASE October 2026 Update: Workforce AI Security and Browser Security Now GA", "summary": "Check Point's SASE update makes Browser Security and Workforce AI Security generally available, including Zero Phishing, Password Reuse Protection and DLP for prompts sent to ChatGPT, Claude and Copilot. Rule-based Tenant Restrictions are now GA and can lock AI tools to corporate workspaces. New SaaS AI integrations connect Anthropic and OpenAI accounts for visibility into usage, connectors and configuration. This folds employee-side AI usage controls into Check Point's SASE, adjacent to F5's AI Guardrails story.", "type": "Product Update", "date": "2026-10-12", "source_url": "https://blog.checkpoint.com/product-updates/check-point-sase-october-2026-new-features-updates/"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Merges Zero Trust into Main Dashboard Navigation", "summary": "Cloudflare moved its Zero Trust (Cloudflare One) products into the main dashboard navigation for all customers. Zero Trust users can now reach the developer platform, account memberships and resource tagging from the same place. Zero Trust Network items now sit under Networking, and Resolvers & Proxies moved to Traffic Controls. The change reinforces Cloudflare's single-pane platform pitch against multi-console setups.", "type": "Product Update", "date": "2026-10-12", "source_url": "https://developers.cloudflare.com/changelog/post/2026-10-12-unified-dashboard-navigation/"}, {"title": "Cloudflare Opens Enterprise Features to All Plans and Adds Multi-Account Organizations", "summary": "Cloudflare opened Logpush, Logpush Transformers and Custom Dashboards to Free, Pro and Business plans on pay-as-you-go pricing, expanded role-based access control, and added multi-account creation. A new Organizations feature manages multiple accounts with unified analytics, audit logging and shared configuration; it is in beta for Enterprise, with GA in October 2026 and free accounts from early 2027. Together these lower the entry barrier to Cloudflare's platform.", "type": "Product Update", "date": "2026-10-12", "source_url": "https://bytejournal.org/news/2026-10-12-cloudflare-opens-enterprise-features-to-all-plans-adds-multi-account-m/"}, {"title": "Cloudflare Launches Eight Observability Updates with Unified Pricing; Logpush Transformers GA", "summary": "Cloudflare announced eight updates to a unified observability platform with one pricing model, effective December 1, 2026. Logs Home combines Workers Observability and Log Explorer across HTTP, firewall, Workers, R2 and AI Gateway datasets. Cloudflare Traces are in open beta, and Logpush Transformers for SQL-based filtering and redaction are now GA. Cloudflare is positioning its edge as the most observable layer of the application stack, a theme F5 product and PMM teams should track.", "type": "Product Launch", "date": "2026-10-12", "source_url": "https://bytejournal.org/news/2026-10-12-cloudflare-launches-eight-observability-updates-with-unified-pricing/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare Adds web_search Tool to Agents SDK, Powered by Cloudflare Web Search API", "summary": "Cloudflare added a web_search tool to its Agents SDK (v0.27.0+), built on the Cloudflare Web Search API with ceramic.ai, Exa and Linkup. Agents can run public web searches and, with web_fetch enabled, read the returned pages. The SDK also ships AI SDK and TanStack AI adapters, plus helpers for non-model search jobs. This builds out Cloudflare's agentic AI developer platform at the edge.", "type": "Product Launch", "date": "2026-10-12", "source_url": "https://developers.cloudflare.com/changelog/post/2026-10-12-web-search/"}]}, "AWS ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "AWS Launches Lambda Web Functions, Supported as an Amazon CloudFront Origin", "summary": "AWS launched Lambda Web Functions, which run standard HTTP servers such as Express, Fastify and Next.js on Lambda without code rewrites. Amazon CloudFront now supports Web Functions as an origin, with edge TLS termination, caching, managed certificates, Origin Access Control and optional AWS WAF. It launches in five Regions; CloudFront support is global except China at no extra fee. Native edge delivery and protection for serverless web apps competes with third-party ADC and WAF placement in AWS.", "type": "Product Launch", "date": "2026-10-12", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/cloudfront-lambda-web-functions-origin/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Amazon Bedrock AgentCore Moves Short-Term Memory to Consumption-Based Pricing", "summary": "Amazon Bedrock AgentCore now bills short-term memory by usage instead of a flat per-event rate: ingestion costs $1.00/GB, retrieval $0.20/GB and storage $0.10/GB-month, with a 12 KB minimum and 64 KB maximum billable size per event. Long-term memory pricing is unchanged. The pricing applies in all AgentCore Memory Regions and lowers the cost of running agentic AI workloads on AWS.", "type": "Product Update", "date": "2026-10-12", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/agentcore-memory-consumption-based-pricing/"}, {"title": "AWS Expands OpenAI GPT-6 Access on Amazon Bedrock to Five Asia Pacific Regions", "summary": "According to Unite.AI, AWS said on its October 12 Machine Learning Blog that GPT-6 Sol and Luna are available on Amazon Bedrock through global cross-Region inference from Singapore, Jakarta, Kuala Lumpur, Bangkok and Taipei, with GPT-6 Astra available from Singapore only. Bedrock picks the processing Region, while billing, quotas and CloudTrail/CloudWatch logging stay in the source Region. This extends AWS's managed AI inference routing in APAC.", "type": "Product Update", "date": "2026-10-12", "source_url": "https://www.unite.ai/aws-expands-gpt-6-access-on-amazon-bedrock-to-five-asia-pacific-regions/"}]}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Akamai Named a Leader in IDC MarketScape: Worldwide WAAP Platforms 2026", "summary": "Akamai was named a Leader in the IDC MarketScape for Worldwide Web Application and API Protection (WAAP) Platforms 2026, its second straight Leader designation. IDC cited App & API Protector and its Adaptive Security Engine (AI-powered WAF, bot and API security), Prolexic DDoS protection, DNS defenses and unified telemetry through Security Hub. F5 competes directly in this WAAP evaluation, so expect Akamai to use the result in competitive deals.", "type": "Research/Report", "date": "2026-10-12", "source_url": "https://www.nasdaq.com/press-release/akamai-recognized-leader-idc-marketscape-worldwide-web-application-and-api-protection"}]}, "Akamai ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Akamai: Monetizing AI Agents at the Edge with Akamai Functions", "summary": "An Akamai blog post describes how customers can use Akamai Functions to charge AI agents and crawlers for content access at the edge, covering pay-for-access and autopay workflows for payment-enabled agents. It notes that most crawlers cannot yet pay and that Google may be piloting paid access with publishers. This pushes Akamai's edge compute into AI agent traffic management, a growing area of AI data delivery.", "type": "Product Update", "date": "2026-10-12", "source_url": "https://www.akamai.com/blog/ai/monetizing-machines-akamai-customers-charge-ai-agents-edge"}]}, "Fastly ~AS": {"category": "Application Security", "announcements": [{"title": "Supertab Connect Brings AI Bot Classification and RSL Licensing to Fastly Compute", "summary": "Supertab Connect is now available on Fastly Compute, letting publishers classify AI crawler traffic, publish machine-readable RSL 1.0 licensing terms, and allow, block or charge AI access at the edge. Each crawler is verified with the Crawler Authorization Protocol before reaching the origin, while human visitors pass through. The integration (announced by Supertab) adds AI bot management options to Fastly's edge ecosystem.", "type": "Partnership", "date": "2026-10-12", "source_url": "https://financewire.com/2026/10/12/supertab-connect-brings-ai-bot-classification-and-rsl-licensing-to-fastly-compute/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": [{"title": "Pillar Security: The Agent With No LLM Inside \u2013 What Jev and System One Models Mean for AI Security", "summary": "Pillar Security published research on 'System One' AI models such as TypeSafe's Jev, which return structured, calibrated decisions instead of generated text. Pillar argues these models shift security enforcement toward the action level, and says its runtime guardrails and AI red teaming test agents through real interfaces regardless of model type, guided by its SAIL lifecycle framework. The narrative competes directly with F5 AI Guardrails and AI Red Team positioning on securing agents regardless of model architecture.", "type": "Research/Report", "date": "2026-10-12", "source_url": "https://www.pillar.security/blog/the-agent-with-no-llm-inside-what-jev-and-system-one-models-mean-for-ai-security"}]}, "Mindgard": {"category": "AI Security", "announcements": []}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "CISA and Citrix Urge Immediate Patching of Critical NetScaler ADC/Gateway SAML Flaw (CVE-2026-107406)", "summary": "On October 12, CISA and Singapore's Cyber Security Agency urged NetScaler ADC and Gateway customers to patch CVE-2026-107406 (CVSS 9.5), a memory overflow flaw that can allow remote code execution or denial of service on appliances configured as a SAML IdP or SP. Citrix's bulletin first came out October 8; it is the third NetScaler bulletin in under two weeks, and Shadowserver reports thousands of exposed devices. Repeated NetScaler flaws open conversations about BIG-IP and NGINX as ADC and access alternatives.", "type": "Product Update", "date": "2026-10-12", "source_url": "https://www.cybersecuritydive.com/news/cisa-citrix-netscaler-customers-patch-new-flaws-disclosed/832741/"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": [{"title": "Arista Showcases Open Ethernet Rack-Scale AI Fabrics at OCP Global Summit", "summary": "Coverage on October 12 highlighted Arista's open Ethernet rack-scale portfolio, first announced October 7 and demonstrated at OCP Global Summit October 12\u201315. The Etherlink SU-144 design connects up to 144 accelerators per rack, or 1,024 across racks, built with partners including AMD, Broadcom, Meta, Microsoft and Qualcomm. It uses ESUN and Ultra Ethernet standards plus Dynamic and Cluster Load Balancing to improve AI job completion, expanding Arista at the AI infrastructure layer where F5 positions BIG-IP Next for Kubernetes on NVIDIA BlueField.", "type": "Event", "date": "2026-10-12", "source_url": "https://msp-channel.com/news/24212-arista-unveils-rack-scale-ethernet-architectures-for-ai-fabrics"}]}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "HPE Says Its Self-Driving Network Now Resolves 70\u201380% of Issues Autonomously", "summary": "HPE networking chief Rami Rahim, formerly Juniper's CEO, says HPE's AI-driven self-driving network now resolves 70\u201380% of potential issues without human help, and expects nearly all trouble tickets to need no person within two to three years, apart from physical hardware swaps. The approach combines Juniper Mist and Marvis AI, Aruba Central and OpsRamp observability. This raises the bar on AIOps messaging, relevant to how F5 positions AI-assisted operations across its Application Delivery and Security Platform.", "type": "Product Update", "date": "2026-10-12", "source_url": "https://www.fierce-network.com/cloud/hpes-self-driving-network-fixes-70-80-issues-its-own-rahim"}]}, "Radware": {"category": "Application Security", "announcements": [{"title": "Radware Opens New Cloud Security Service Centre in Thailand", "summary": "Radware opened a new Cloud Security Service Centre in Thailand, adding to its global network of more than 65 centres; the release came out October 8 and Bangkok Post published it October 12. The site provides local application, API and DDoS protection for businesses and government agencies, and Radware says it lowers latency, speeds attack mitigation and helps meet data residency rules. This adds regional pressure on F5 Distributed Cloud WAAP and DDoS in Southeast Asian deals.", "type": "Product Launch", "date": "2026-10-12", "source_url": "https://www.bangkokpost.com/thailand/pr/3335708/radware-launches-new-cloud-security-service-centre-in-thailand"}]}, "Barracuda Networks": {"category": "Application Security", "announcements": []}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "Thales Launches Sentinel Envelope Plus to Protect Software Against AI-Assisted Reverse Engineering", "summary": "Thales announced Sentinel Envelope Plus, a paid add-on to its Sentinel Envelope software protection platform that protects compiled applications against AI-assisted reverse engineering, automated vulnerability discovery and exploit generation without source-code changes. In Thales's tests, an AI agent found 8 of 10 vulnerabilities in an unprotected app and none once it was protected. This is Thales's software protection business rather than Imperva, but it shows Thales framing application security around AI-driven attackers.", "type": "Product Launch", "date": "2026-10-12", "source_url": "https://cybersecurityasia.net/thales-launches-sentinel-envelope-plus/"}]}, "Imperva (Thales) ~AI": {"category": "AI Security", "announcements": [{"title": "2026 Thales Data Threat Report (Manufacturing Edition) Flags Agentic AI Data Security Risks", "summary": "Thales's 2026 Data Threat Report, Manufacturing Edition, found that 67% of manufacturing respondents see the fast pace of change in AI ecosystems, including APIs, MCP servers and agent frameworks evolving faster than governance, as their top AI security risk. Other risks highlighted include credential theft (57%), limited visibility into AI data flows, and a larger attack surface from autonomous agents. The research can back F5 messaging on AI Guardrails and API security for agentic AI.", "type": "Research/Report", "date": "2026-10-12", "source_url": "https://securityboulevard.com/2026/10/agentic-ai-in-manufacturing-5-data-security-risks-from-the-2026-thales-data-threat-report/"}]}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-10-12.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
