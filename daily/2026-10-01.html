"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Introduces Cortex XCOR AI-Native Observability Platform with AI SRE", "summary": "Palo Alto Networks launched Cortex XCOR, an AI-native observability platform built for autonomous response. Its XCOR Operator assistant directs task-specific agents that investigate incidents and recommend fixes in about three minutes, with a reported 75% root-cause success rate. The platform combines Embrace-based Real User Monitoring and Synthetics with backend observability, an OpenTelemetry collector and Chronosphere-driven telemetry cost reduction. Relevance to F5: PANW is moving into app performance and digital experience monitoring, close to F5's app delivery visibility story.", "type": "Product Launch", "date": "2026-10-01", "source_url": "https://www.paloaltonetworks.com/blog/2026/10/observabilitys-ai-moment-introducing-cortex-xcor-ai-driven-observability-for-autonomous-response-with-ai-sre/"}, {"title": "Cyderes Partners with Palo Alto Networks to Accelerate AI-Powered Security Operations", "summary": "Cyderes and Palo Alto Networks announced a strategic partnership. Cyderes becomes a premier delivery and implementation partner for Cortex XDR and Cortex XSIAM in the US, Canada and UK/EMEA. The joint offer pairs Cortex endpoint, network, cloud and identity analytics with Cyderes' managed detection and response services and its Meridian fabric, delivered as fully managed or co-managed programs. Relevance to F5: PANW keeps building its MSSP channel for platform consolidation, which matters to F5's services and partner motions.", "type": "Partnership", "date": "2026-10-01", "source_url": "https://www.globenewswire.com/news-release/2026/10/01/3372945/0/en/cyderes-partners-with-palo-alto-networks-to-accelerate-ai-powered-security-operations-for-global-enterprises.html"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "Fortinet Warns of Critical FortiMail Zero-Day (CVE-2026-104286) Exploited in Attacks", "summary": "Fortinet issued advisory FG-IR-26-175 for CVE-2026-104286 (CVSS 9.8), a path traversal and NULL-byte flaw in the FortiMail management interface. It lets unauthenticated attackers write arbitrary files and is being exploited in the wild. Fixes for the 7.4, 7.6 and 8.0 trains are still pending, so Fortinet recommends disabling IBE or restricting management access. CISA added the flaw to its KEV catalog with an October 4 deadline. Relevance to F5: another exploited Fortinet management-plane flaw gives the field a vendor-risk talking point.", "type": "Research", "date": "2026-10-01", "source_url": "https://www.bleepingcomputer.com/news/security/fortinet-warns-of-critical-fortimail-flaw-exploited-in-zero-day-attacks/"}, {"title": "Fortinet Launches P.A.U.S.E., a Free National Campaign Against AI-Driven Scams in Canada", "summary": "For Cybersecurity Awareness Month, Fortinet launched P.A.U.S.E., a free national cyber-safety campaign in Canada. It teaches five habits for spotting AI-driven scams such as phishing, deepfakes and AI-generated voices. Students, educators, businesses and the public get free quizzes, short videos, posters and training. Relevance to F5: Fortinet is using awareness-month campaigns to build its brand around AI-era threats, which F5 marketing can compare against its own awareness-month content.", "type": "Event", "date": "2026-10-01", "source_url": "https://www.newswire.ca/news-releases/fortinet-launches-p-a-u-s-e-a-free-national-campaign-helping-canadians-stop-and-think-before-ai-driven-scams-succeed-819587496.html"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Patches Exploited Catalyst SD-WAN Manager Zero-Day (CVE-2026-76504)", "summary": "Cisco released urgent patches for CVE-2026-76504 (CVSS 9.8), an API authentication bypass in Catalyst SD-WAN Manager. Attackers exploited it in the wild to gain remote, unauthenticated admin access. There is no workaround, and fixed builds cover the 20.9 through 26.2 trains. CISA added it to the KEV catalog, the eighth SD-WAN Manager CVE listed in 2026. Relevance to F5: repeated Cisco management-plane exposures support F5 conversations on secure multicloud networking and hardened control planes.", "type": "Research", "date": "2026-10-01", "source_url": "https://www.securityweek.com/cisco-patches-exploited-catalyst-sd-wan-zero-day-vulnerability/"}, {"title": "Cisco Relentless Defense Report Finds Organizational Friction Slows AI-Era Defense", "summary": "Cisco published its Relentless Defense Report, based on input from 8,000 security practitioners. It finds that AI is shortening threat timelines while approval delays, silos and disconnected teams slow defense. Only 8% of organizations qualify as 'Relentless Defenders', who combine broad coverage, fast remediation and unified security data. Relevance to F5: Cisco is using the research to argue for unified platforms, a narrative F5 product marketing should counter with its own consolidation proof points.", "type": "Research", "date": "2026-10-01", "source_url": "https://www.passionateinmarketing.com/cisco-report-the-biggest-threat-to-your-security-team-might-be-your-own-organization/"}, {"title": "How Webex by Cisco Is Reimagining Work in the AI Era Ahead of WebexOne", "summary": "Ahead of WebexOne (October 5\u20138, Austin), Cisco previewed its 'Connected Intelligence' vision for AI-driven collaboration. It ties Webex to networking, security, observability and Cisco Spaces through the Cisco Cloud Control unified management pane, and teased a new technology integration beyond its NVIDIA and Microsoft partnerships. Relevance to F5: Cisco is pushing a single management plane across networking and security, so alliance and field teams should watch for WebexOne platform announcements.", "type": "Event", "date": "2026-10-01", "source_url": "https://newsroom.cisco.com/c/r/newsroom/en/us/a/y2026/m10/how-webex-by-cisco-is-reimagining-work-in-the-ai-era.html"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Falcon Next-Gen SIEM Added to CISA-Funded SIEMaaS Stack", "summary": "CrowdStrike Falcon Next-Gen SIEM is now part of CISA's SIEMaaS stack under the CDM DEFEND F shared service, delivered through CGI Federal. Eligible agencies that already use CrowdStrike EDR can deploy it with CISA-funded SKUs and no agency program funds. Relevance to F5: CrowdStrike is building on its federal EDR footprint to expand there, which affects F5 public sector teams and the Falcon for BIG-IP alliance.", "type": "Customer Win", "date": "2026-10-01", "source_url": "https://www.crowdstrike.com/en-us/blog/crowdstrike-expands-federal-soc-modernization-via-cisa-siemaas/"}, {"title": "BeyondTrust Integrates Identity Security with CrowdStrike Falcon Next-Gen SIEM", "summary": "BeyondTrust announced integrations that feed identity and privilege data from Endpoint Privilege Management, Password Safe and Privileged Remote Access into CrowdStrike Falcon Next-Gen SIEM. The goal is to correlate that data with threat telemetry and catch attacks that use legitimate credentials. Relevance to F5: Falcon Next-Gen SIEM's partner ecosystem keeps growing, and F5 can feed BIG-IP and WAF telemetry into it to stay part of CrowdStrike-centered SOC workflows.", "type": "Partnership", "date": "2026-10-01", "source_url": "https://gecnewswire.com/beyondtrust-integrates-identity-security-with-crowdstrike-falcon-next-gen-siem/"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler ThreatLabz: Ransomware Data Theft Surged 275% in 2026, Hitting Schools, Hospitals and Government Hardest", "summary": "Zscaler's ThreatLabz published a blog post on findings from its 2026 Ransomware Report. Data stolen in ransomware attacks rose 275.8% year over year to 896.2 TB, which is more than seven times the 2023\u20132024 level. Government, education and healthcare had some of the largest single data claims, and attacks on utilities also rose. Zscaler presents the data as a reason to adopt its Zero Trust platform. F5 teams can respond by stressing protection against data exfiltration at the app and API layer.", "type": "Research", "date": "2026-10-01", "source_url": "https://www.zscaler.com/br/blogs/product-insights/ransomware-data-theft-surged-275-2026-schools-hospitals-and-government"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Basin Generally Available: Open, Serverless Data Platform Built on Apache Iceberg and R2", "summary": "Cloudflare made Basin generally available. Basin is the renamed Cloudflare Data Platform, first shown during Birthday Week 2025. It combines Basin Pipelines, Basin Catalog and Basin SQL so customers can ingest, store, catalog and query analytics data without running servers or paying data-movement fees. Cloudflare positions it as an open stack with no lock-in. Basin widens Cloudflare's platform beyond networking and security into data services, which strengthens its consolidation pitch against multi-vendor stacks that include F5.", "type": "Product Launch", "date": "2026-10-01", "source_url": "https://www.cloudflare.com/press/press-releases/2026/cloudflare-launches-basin-a-more-open-and-accessible-data-platform-for-developers/"}, {"title": "Cloudflare OS Adds Fully Managed Deployment Option for Its Agent Workspace", "summary": "Cloudflare opened a waitlist for fully managed deployments of Cloudflare OS, its open-source agent workspace that connects to company data and systems. Admins control access, roles, context and which systems agents can reach, while Cloudflare runs deployment, updates and maintenance. Cloudflare says thousands of organizations already use the self-hosted version. This moves Cloudflare into enterprise agent workflows, where security and governance of agent traffic are areas F5 addresses.", "type": "Product Update", "date": "2026-10-01", "source_url": "https://blog.cloudflare.com/managed-cloudflare-os/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Security Hub Introduces Remediation Plans to Prioritize and Fix Security Exposures", "summary": "AWS Security Hub now groups related findings by root cause into remediation plans, so fixing one resource clears several exposures. Each plan has a priority rating, an impact assessment, and step-by-step fixes in CLI, Terraform, CloudFormation, Python and CDK formats. AI agents can pull plans through an API to automate fixes. The feature is included at no extra cost in Security Hub Essentials. It strengthens AWS's native, bundled security platform, which competes for budget with third-party protection such as F5's.", "type": "Product Update", "date": "2026-10-01", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-security-hub-remediation-plans/"}]}, "HiddenLayer": {"category": "AI Security", "announcements": [{"title": "HiddenLayer Positions AI Security Platform to Fit Existing Cloud, Pipeline and SOC Workflows", "summary": "HiddenLayer published \"The Security That Meets You Where You Build.\" It explains how its platform plugs into the tools teams already use. The AI Supply Chain module scans models in Azure AI Foundry, AWS Bedrock/SageMaker and Databricks Unity Catalog, and in CI/CD tools like GitHub Actions, Jenkins, Azure DevOps and JFrog. Findings can go to Microsoft Sentinel or Splunk. Coverage includes LangChain, LiteLLM, OpenAI Agents SDK, AWS Strands and coding agents through Agent Harness Security. This competes with F5 AI Guardrails on the claim of integrating without changing how teams work.", "type": "Product Update", "date": "2026-10-01", "source_url": "https://www.publicnow.com/view/1C86C283ADBE4EFB79C634DC0B597B8DD3A6FF68"}]}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": [{"title": "Mindgard Jailbreaks Moonshot AI's Kimi K2.6 and K3 Swarm Models, Drawing BBC and CBS Coverage", "summary": "News coverage on October 1 reported that Mindgard bypassed safety guardrails in Moonshot AI's open-weight Kimi K2.6 and K3 Swarm models. The jailbroken models produced bioweapon, malware and terror-attack content, and Mindgard says they also ran code on Moonshot's infrastructure. Mindgard disclosed the issue to Moonshot in July and published details September 12. Moonshot says it is reviewing the findings. Mindgard is using the research to promote its continuous AI red teaming, which competes directly with F5 AI Red Team and supports the case for runtime guardrails.", "type": "Research", "date": "2026-10-01", "source_url": "https://www.cbsnews.com/news/open-weight-ai-models-safety-risks/"}]}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": []}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": []}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "NetScaler Zero-Day Incident Escalates as Banks, Governments and Telcos Report Compromises", "summary": "Attackers are using the NetScaler ADC and Gateway zero-days CVE-2026-88771 and CVE-2026-88772 against banks, government agencies, telcos, education and legal firms. Censys counts about 42,000 internet-facing instances. Mandiant has tied the activity to the WHIPSHOT PHP web shells and the SLAPSHOT tunneler, which attackers use for lateral movement and stealing credentials. Citrix says patching does not remove an existing compromise and advises affected customers to deploy fresh instances. F5 sellers and professional services can offer secure ADC replacement and migration help.", "type": "Research", "date": "2026-10-01", "source_url": "https://www.thestack.technology/banks-govts-telcos-hit-by-hackers-amid-escalating-netscaler-incident-2/"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": []}, "Arista Networks": {"category": "AI Data Delivery", "announcements": []}, "HPE / Juniper Networks": {"category": "AI Data Delivery", "announcements": [{"title": "HPE's $1.2B Vultr Order Tests Its AI Networking Strategy as Networking Outlook Rises", "summary": "HPE disclosed a $1.2 billion order from Vultr for AMD Helios AI racks with HPE/Juniper networking and software. It raised its FY27 networking growth outlook to the high-teens to low-20s percent and its Juniper cost-synergy target to $800M by FY28. Networking revenue hit a record $2.9B last quarter, though supply limits remain. HPE is positioning combined Juniper/Aruba AI networking for neoclouds, so F5 should highlight its own AI data delivery and traffic management in those same deals.", "type": "Financial", "date": "2026-10-01", "source_url": "https://fortune.com/2026/10/01/hpe-1-2-billion-vultr-order-puts-ai-networking-strategy-test-cfo/"}]}, "Radware": {"category": "Application Security", "announcements": []}, "Barracuda Networks": {"category": "Application Security", "announcements": []}, "Check Point Software ~AI": {"category": "AI Security", "announcements": [{"title": "Check Point and Clalit Health Services Partner to Secure AI Adoption, Including a Dedicated AI Gateway", "summary": "Check Point announced a partnership with Clalit Health Services, Israel's largest healthcare provider, to secure its use of AI. The two will build a dedicated AI Gateway, a security layer between users, apps and AI models. The deal also covers workforce AI security to stop patient data leaking to outside models, ongoing exposure management, and protection for email, browsers and endpoints. This puts Check Point's Lakera-based AI security up against F5 AI Gateway and AI Guardrails in regulated healthcare accounts.", "type": "Partnership", "date": "2026-10-01", "source_url": "https://www.checkpoint.com/press-releases/clalit-health-services-and-check-point-announce-strategic-partnership-to-secure-ai-adoption-across-healthcare-environments/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare Introduces Clef Open-Source Decision Models and an RL Fine-Tuning Platform on Workers AI", "summary": "Cloudflare launched Clef and Clef-flash, the first models trained by its own Workers AI team. They run on Workers AI and are also released as open-source weights on Hugging Face under the Apache 2.0 license. Cloudflare says Clef leads the Jev Decision Index benchmark. It also launched a reinforcement-learning fine-tuning service, delivered with its engineering team, and plans a self-serve version later. This deepens Cloudflare's 'agent cloud' push for running AI inference at the edge, an area where F5 places AI delivery and gateway capabilities.", "type": "Product Launch", "date": "2026-10-01", "source_url": "https://blog.cloudflare.com/clef-decision-models/"}, {"title": "Cloudflare AI Search Now Generally Available with Multimodal Support", "summary": "Cloudflare AI Search is now generally available. It is a fully managed indexing and retrieval pipeline built on Workers AI, Vectorize, R2 and Browser Run. The release adds native image embeddings, OCR for scanned PDFs and support for files up to 10 MiB. Billing starts November 1, 2026, with a free tier kept on all Workers plans. A managed RAG service at the edge adds to Cloudflare's AI delivery offering, which competes with F5's AI data delivery positioning.", "type": "Product Launch", "date": "2026-10-01", "source_url": "https://blog.cloudflare.com/ai-search-ga/"}]}, "AWS ~AD": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "AWS Adds DNS Analytics and Insights for Route 53 Global Resolver and DNS Firewall", "summary": "AWS added DNS analytics and insights to Route 53 Global Resolver and DNS Firewall, built on Amazon CloudWatch. Customers can see DNS query patterns and how well firewall rules work, detect anomalies, and set alarms with CloudWatch Metrics and Contributor Insights. A new Analytics tab appears in both consoles, and standard CloudWatch pricing applies. Built-in DNS observability on AWS strengthens its native alternative to F5 BIG-IP DNS and DNS security for cloud-first customers.", "type": "Product Update", "date": "2026-10-01", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/route-53-dns-analytics-insights/"}]}, "Imperva (Thales) ~P": {"category": "Platforms", "announcements": [{"title": "Thales Unveils Global Framework to Protect Critical Organisations from Frontier AI Attacks", "summary": "At the Thales Cyber Summit in Paris, Thales announced an end-to-end framework to protect critical organizations from frontier AI attacks. It has five connected parts: securing the application estate, AI-augmented detection and response, a converged cyberdefense platform, continuous testing and risk evaluation, and resilience of critical assets. Thales also said it is taking part in Google's Fairwind program. This uses Imperva app security in a converged platform pitch, which competes with F5's platform consolidation story.", "type": "Product Launch", "date": "2026-10-01", "source_url": "https://www.financialcontent.com/article/bizwire-2026-10-1-thales-unveils-a-global-framework-to-protect-critical-organisations-from-frontier-ai-attacks"}]}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-10-01.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
</body>
</html>
