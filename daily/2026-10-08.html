(function(){
"use strict";
var DATA={"Palo Alto Networks": {"category": "Platforms", "announcements": [{"title": "Palo Alto Networks Posts Highest Overall CASB Protection Rate in SecureIQLab 2026 SSE Validation", "summary": "Palo Alto Networks reported the highest overall CASB protection rate, 91.7%, in SecureIQLab's 2026 SSE Independent Cyberrisk Validation. The group average was 62.3%. The test ran 643 CASB cases across five SSE solutions. Palo Alto Networks also led the group in activity control (90.7%), data control (82.0%), out-of-band CASB (90.9%) and SSPM (95.1% vs. a 30.7% average). The company argues that measured protection matters more than feature lists for SaaS security.", "type": "Research/Report", "date": "2026-10-08", "source_url": "https://www.paloaltonetworks.com/blog/sase/palo-alto-networks-achieves-highest-overall-casb-protection-rate-in-secureiqlab-validation/"}]}, "Palo Alto Networks ~AI": {"category": "AI Security", "announcements": [{"title": "Palo Alto Networks Highlights Gartner Recognition and Prisma AIRS Momentum in Network & AI Security", "summary": "Palo Alto Networks said Gartner named it a Market Shaper in AI Application Security. Gartner also called it a 'Company to Beat' in AI Security Platforms for the second year in a row, and for telcos in AI Network Security. The company presents Prisma AIRS as its end-to-end AI security platform. Prisma AIRS centers on an AI Gateway that governs models, agents, tools and MCP connections. The post also promotes PAN-OS 12.2 'Ceres', which adds 55+ features including Frontier Virtual Patching.", "type": "Research/Report", "date": "2026-10-08", "source_url": "https://www.paloaltonetworks.com/blog/2026/10/driven-by-innovation-our-latest-analyst-wins-and-product-momentum-in-network-ai-security/"}]}, "Fortinet": {"category": "Platforms", "announcements": [{"title": "FBI and Secret Service Warn FortiBleed Attackers Are Locking Organizations Out of FortiGate Firewalls", "summary": "On October 8, outlets covered an FBI and US Secret Service warning about FortiBleed. FortiBleed is an ongoing credential-theft campaign against internet-facing FortiGate firewalls and SSL VPN gateways, with about 86,644 devices affected in 194 countries. Attackers create or delete admin accounts to lock owners out, and ransomware affiliates use the access. The cause is credential reuse and weak authentication, not a new Fortinet software flaw. Guidance includes MFA, restricting management interfaces and resetting credentials.", "type": "Research/Report", "date": "2026-10-08", "source_url": "https://www.securityweek.com/fortibleed-attackers-locking-victims-out-of-fortinet-devices/"}]}, "Cisco": {"category": "Platforms", "announcements": [{"title": "Cisco Patches Five Critical NX-OS Flaws Enabling Nexus 3000/9000 Switch Takeover", "summary": "Cisco published security advisories that included five critical NX-OS vulnerabilities in Nexus 3000 and 9000 switches. The flaws can let unauthenticated remote attackers run code as root or crash devices. Exploitation requires NX-API, NGOAM or MPLS OAM to be enabled. Cisco advises upgrading to fixed NX-OS releases, using Live Protect shields, or turning off unneeded features. SecurityWeek reported a dozen critical fixes in total, including APIC and Meraki.", "type": "Product Update", "date": "2026-10-08", "source_url": "https://www.bleepingcomputer.com/news/security/cisco-warns-of-critical-flaws-allowing-nexus-switch-takeover/"}]}, "CrowdStrike": {"category": "Platforms", "announcements": [{"title": "CrowdStrike Joins Anthropic's Critical Infrastructure Defense Program", "summary": "CrowdStrike joined Anthropic's Critical Infrastructure Defense Program. The partnership pairs CrowdStrike's Falcon platform, IT/OT security data and threat intelligence with Anthropic's frontier AI research to strengthen defense of critical infrastructure. The program gives CrowdStrike access to Anthropic guidance and research and supports shared defensive practices. CrowdStrike also pointed to its open AI ecosystem around Falcon, where Claude is available inside Charlotte AI.", "type": "Partnership", "date": "2026-10-08", "source_url": "https://www.crowdstrike.com/en-us/blog/crowdstrike-anthropic-critical-infrastructure-defense-program/"}, {"title": "CrowdStrike Ties AI-Driven South Korean Bank Breaches to ARTEX Agent and Claude Code Sessions", "summary": "CrowdStrike released an analysis of a late-September to early-October campaign against at least nine South Korean banks. The attacker used ARTEX, an agentic penetration-testing framework, together with LLMs including Claude Code. Exposed attacker servers revealed configurations and session logs. CrowdStrike assesses with moderate confidence that the actor is a financially motivated Chinese speaker, possibly in Guangdong. Shinhan Bank disclosed about 25,000 compromised customer records.", "type": "Research/Report", "date": "2026-10-08", "source_url": "https://cybermagazine.com/news/crowdstrike-on-south-korea-bank-ai-cyber-attack"}]}, "Zscaler": {"category": "Platforms", "announcements": [{"title": "Zscaler Investor Day Targets $8B ARR by FY2031, With $10B Upside From Agentic AI", "summary": "At its October 8 Investor Day, Zscaler set a base-case target of more than $8B ARR by fiscal 2031. It said ARR could reach about $10B if companies adopt agentic AI faster. Zscaler named three growth engines: Zero Trust Branch and Cloud (about $250M ARR), data security (ARR up 34%) and Security for AI (about $70M ARR). Together they drove about 60% of fiscal 2026 ARR growth. Management reaffirmed its fiscal 2027 guidance.", "type": "Financial", "date": "2026-10-08", "source_url": "https://www.americanbankingnews.com/2026/10/08/zscaler-investor-day-maps-ai-security-path-to-8b-arr-with-10b-upside.html"}]}, "Zscaler ~AI": {"category": "AI Security", "announcements": [{"title": "Zscaler Rolls Out AI Endpoint Security for AI Apps and Agents on User Devices", "summary": "Zscaler is rolling out AI Endpoint Security, which extends its zero-trust model to AI applications and agents running on employee devices. It has three parts: an inventory of AI endpoints, runtime monitoring of AI agents tied to user identity, device and data, and inline enforcement of enterprise AI policy. Enforcement can block rogue agents, malicious skills, dangerous commands and PII in prompts. Zscaler says traditional EDR, MDM and DLP tools leave this gap open.", "type": "Product Launch", "date": "2026-10-08", "source_url": "https://www.zscaler.com/blogs/product-insights/ai-endpoint-security-closes-zero-trust-gap"}]}, "Check Point Software": {"category": "Platforms", "announcements": [{"title": "Check Point Issues IPS Protection for Critical Quantum Security Management Flaw (CVE-2026-93616)", "summary": "Check Point published advisory CPAI-2026-13380 for a high-severity flaw in its own Quantum Security Management server. The flaw combines directory traversal with arbitrary file upload. It lets an unauthenticated attacker upload and run scripts on the management server. Affected versions span the R82.x, R81.x and R80.x lines. Customers should apply the latest IPS update, turn on the matching protection and install the policy on all gateways.", "type": "Product Update", "date": "2026-10-08", "source_url": "https://advisories.checkpoint.com/defense/advisories/public/2026/cpai-2026-13380.html/"}, {"title": "Check Point Email Security Adds Automatic Session Revocation for Compromised Microsoft 365 Accounts", "summary": "Check Point Email Security can now automatically revoke all active Microsoft 365 sessions when it detects a compromised account. This stops session hijacking without forcing a password reset. Remediation now depends on detection confidence: block confirmed compromises, revoke sessions for suspected ones, and monitor low-confidence cases. The feature is rolling out to customer portals over the next 7 days.", "type": "Product Update", "date": "2026-10-08", "source_url": "https://blog.checkpoint.com/product-updates/session-revocation-option-for-compromised-accounts/"}]}, "Cloudflare": {"category": "Platforms", "announcements": [{"title": "Cloudflare Redesigns Radar for Broader Audiences", "summary": "Cloudflare has redesigned Radar, its Internet insights site, to be easier for journalists, policymakers and general users while keeping its technical depth. The new interface centers on a map that shows outages up front, with traffic data for scale. It is built on Cloudflare's Kumo components. Radar covers real-time security, performance and traffic trends across the global Internet.", "type": "Product Update", "date": "2026-10-08", "source_url": "https://blog.cloudflare.com/radar-redesign/"}]}, "Cloudflare ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "Cloudflare Launches Monetization Gateway Closed Beta for Usage-Based AI Agent Payments", "summary": "Cloudflare opened a closed beta of Monetization Gateway, which lets businesses charge AI agents based on actual use of websites, APIs, MCP tools and datasets. Agents can find prices, pay and get access within the HTTP request flow, using HTTP 402 and the x402 protocol. Businesses do not need to build their own payment infrastructure.", "type": "Product Launch", "date": "2026-10-08", "source_url": "https://www.intelligentcio.com/me/2026/10/08/cloudflare-launches-monetization-gateway-beta-to-enable-usage-based-payments-for-ai-agents/"}]}, "AWS": {"category": "Platforms", "announcements": [{"title": "AWS Network Firewall Adds Wildcard Support for Container Attribute Filters", "summary": "AWS Network Firewall now supports wildcard matching in container attribute-based inspection for Amazon EKS and ECS. One rule can now cover several container variants, so app=payments-* matches payments-api, payments-worker and payments-cron. This cuts down on per-container rules in dynamic environments. It is available in all Regions that support container attribute-based inspection.", "type": "Product Update", "date": "2026-10-08", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/aws-network-firewall-container-attributes-wildcard/"}]}, "AWS ~AID": {"category": "AI Data Delivery", "announcements": [{"title": "OpenAI GPT-6.1 Sol Gains Ultrafast Mode on Amazon Bedrock", "summary": "Amazon Bedrock now offers Ultrafast mode for OpenAI GPT-6.1 Sol, giving faster inference on the Bedrock inference engine for latency-sensitive work. AWS cites real-time coding assistants, interactive agents and fast customer-facing responses as use cases. Bedrock's governance and audit controls still apply. It is available through the Bedrock console and supported APIs.", "type": "Product Update", "date": "2026-10-08", "source_url": "https://aws.amazon.com/about-aws/whats-new/2026/10/openai-gpt-sol-ultrafast-amazon/"}, {"title": "AWS Launches Open-Source Physical AI Toolchain Integrated With NVIDIA", "summary": "AWS released the Physical AI Toolchain, an open-source stack for building machines that perceive, reason and act in the real world, aimed at industrial automation, autonomous mobility and humanoid robotics. It works with NVIDIA Isaac Sim, Isaac Lab, GR00T and Cosmos alongside SageMaker, EC2 GPU instances, IoT Greengrass and Bedrock AgentCore. It includes architecture guidance, deployment automation and ready-to-use code.", "type": "Partnership", "date": "2026-10-08", "source_url": "https://www.aboutamazon.com/news/aws/aws-physical-ai-toolchain-build-intelligent-machines"}]}, "HiddenLayer": {"category": "AI Security", "announcements": []}, "Lasso Security": {"category": "AI Security", "announcements": []}, "Operant AI": {"category": "AI Security", "announcements": []}, "Pillar Security": {"category": "AI Security", "announcements": []}, "Mindgard": {"category": "AI Security", "announcements": []}, "Akamai": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Akamai Sets Q3 2026 Investor Conference Call for November 5", "summary": "Akamai Technologies will hold its third quarter 2026 investor conference call on Thursday, November 5, 2026 at 4:30 PM ET to discuss Q3 financial results. The call will be webcast live on Akamai's Investor Relations site, with a two-week telephone replay. Akamai describes itself as a cloud company powering AI-driven applications with edge computing and security.", "type": "Financial", "date": "2026-10-08", "source_url": "https://www.globenewswire.com/news-release/2026/10/08/3377114/0/en/akamai-technologies-to-hold-third-quarter-2026-investor-conference-call-on-thursday-november-5-at-4-30-pm-et.html"}]}, "Akamai ~AS": {"category": "Application Security", "announcements": [{"title": "Akamai Adds Script Behavior Rules Management to Client-Side Protection API", "summary": "Akamai released an update letting customers manage Script Behavior Rules programmatically through its Client-Side Protection API. The release supports full create, read, update and delete (CRUD) operations on script behavior rules within existing security policies. Developers can automate and centrally enforce client-side script protections against threats like web skimming and malicious third-party scripts.", "type": "Product Update", "date": "2026-10-08", "source_url": "https://techdocs.akamai.com/application-security/changelog/oct-8-2026-manage-and-enforce-script-behavior-rules-with-client-side-protection-api"}, {"title": "Akamai Warns on October 2026 Root KSK Rollover, Positions DNS Posture Management", "summary": "Akamai warned that on October 11, 2026 the DNS root zone begins signing with KSK-2024 (key tag 38696). Validating resolvers without the new trust anchor may return SERVFAIL errors for all domains. Akamai urges teams to confirm the key is in their resolver configurations and loaded in memory, and to run RFC 8509 sentinel tests. It positions Akamai DNS Posture Management as a way to baseline zones, DS records and RRSIGs and separate internal issues from rollover failures.", "type": "Research/Report", "date": "2026-10-08", "source_url": "https://www.akamai.com/blog/security/october-2026-root-ksk-rollover-dns-ready"}]}, "Fastly": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Fastly to Announce Q3 2026 Financial Results on November 4", "summary": "Fastly will report third quarter 2026 financial results after market close on Wednesday, November 4, 2026. An investor conference call will follow at 1:30 p.m. PT / 4:30 p.m. ET, with pre-registration required to dial in. A live webcast will be available, and a replay will be posted on investors.fastly.com and archived for one quarter.", "type": "Financial", "date": "2026-10-08", "source_url": "https://markets.financialcontent.com/stocks/article/bizwire-2026-10-8-fastly-to-announce-third-quarter-2026-financial-results"}]}, "Citrix (NetScaler)": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "Citrix Discloses Critical NetScaler ADC/Gateway SAML Flaw CVE-2026-107406 (CVSS 9.5)", "summary": "Citrix bulletin CTX697191 disclosed CVE-2026-107406, a memory overflow in NetScaler ADC and NetScaler Gateway that can enable remote code execution or denial of service when appliances act as a SAML IdP or SP. Builds 14.1-73.41 and 13.1-64.28, shipped as fixes in earlier bulletins, are affected when configured as a SAML IdP. Customers must upgrade to 14.1-73.46, 13.1-64.29 or matching FIPS/NDcPP builds. Citrix reported no known unmitigated exploits at publication.", "type": "Product Update", "date": "2026-10-08", "source_url": "https://community.citrix.com/techzone-blogs/110_security-updates/protecting-customers-immediate-guidance-for-cve-2026-107406-in-netscaler-adc-and-netscaler-gateway-r1631/?tab=comments"}]}, "A10 Networks": {"category": "Application Delivery (ADCs)", "announcements": [{"title": "A10 Networks to Announce Q3 2026 Financial Results on November 5", "summary": "A10 Networks (NYSE: ATEN) will release third quarter 2026 financial results after market close on Thursday, November 5, 2026, foll {"category": "Application Security", "announcements": []}, "Barracuda Networks ~P": {"category": "Platforms", "announcements": [{"title": "Barracuda Managed XDR Named XDR Innovation of the Year at 2026 CyberSecurity Breakthrough Awards", "summary": "Barracuda Managed XDR won XDR Innovation of the Year at the 2026 CyberSecurity Breakthrough Awards. The service is part of the BarracudaONE platform. It combines AI-powered detection from the Barracuda IQ engine, automated threat containment and a 24/7 agentic SOC. It covers endpoints, email, identity, networks and cloud, and integrates with more than 60 third-party technologies.", "type": "Executive/Corporate", "date": "2026-10-08", "source_url": "https://blog.barracuda.com/2026/10/08/managed-xdr-cybersecurity-breakthrough-award-2026"}]}, "Imperva (Thales)": {"category": "Application Security", "announcements": [{"title": "Imperva: 'Is Your DDoS Protection Actually On?' - DDoS Readiness Is a Visibility Problem", "summary": "Imperva content republished by Security Boulevard argues that many organizations cannot confirm their DDoS protections are actually working, because controls often show up only when they fail. It recommends continuous monitoring, regular validation and readiness testing, and visibility across detection, mitigation and response, rather than set-and-forget protection.", "type": "Research/Report", "date": "2026-10-08", "source_url": "https://securityboulevard.com/2026/10/is-your-ddos-protection-actually-on/"}]}};
var catColors={"Platforms":"#636efa","AI Security":"#ef553b","AI Data Delivery":"#00cc96","Application Delivery (ADCs)":"#ab63fa","Application Security":"#ffa15a"};
var cCL=["#76b900","#00b4d8","#ef553b","#ab63fa","#ffa15a","#19d3f3","#ff6692","#636efa","#00cc96","#b6e880","#ff97ff"];
function baseName(s){return s.replace(/ ~(AI|AID|AD|AS|P)$/,"");}
var ALL_ANN=[],names=Object.keys(DATA),compCounts={},catCounts={};
var baseSet={},baseActive={},baseCatMap={};
for(var i=0;i<names.length;i++){var nm=names[i],bn=baseName(nm),info=DATA[nm],n=info.announcements.length;
  baseSet[bn]=1;
  if(!baseCatMap[bn])baseCatMap[bn]=[];
  if(baseCatMap[bn].indexOf(info.category)<0)baseCatMap[bn].push(info.category);
  if(n>0){compCounts[bn]=(compCounts[bn]||0)+n;baseActive[bn]=1;}
  if(!catCounts[info.category])catCounts[info.category]=0;
  catCounts[info.category]+=n;
  for(var j=0;j<n;j++){var a=info.announcements[j];ALL_ANN.push({title:a.title,summary:a.summary,source_url:a.source_url,type:a.type,date:a.date,competitor:bn,category:info.category});}}
var baseNames=Object.keys(baseSet);
ALL_ANN.sort(function(a,b){if(a.date<b.date)return 1;if(a.date>b.date)return -1;return 0;});

document.getElementById("exportBtn").addEventListener("click",function(){
  var rows=["Date,Competitor,Category,Type,Title,Summary,Source URL"];
  for(var i=0;i<ALL_ANN.length;i++){var a=ALL_ANN[i];rows.push([a.date,q(a.competitor),q(a.category),q(a.type),q(a.title),q(a.summary),a.source_url].join(","));}
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var lnk=document.createElement("a");lnk.href=URL.createObjectURL(blob);lnk.download="f5_daily_2026-10-08.csv";lnk.click();
});
function q(s){return '"'+String(s).replace(/"/g,'""')+'"';}

var pL={paper_bgcolor:"rgba(0,0,0,0)",plot_bgcolor:"rgba(0,0,0,0)",font:{family:"Segoe UI,system-ui,sans-serif",color:"#e2e4ea",size:12},margin:{t:40,b:10,l:10,r:10},showlegend:true,legend:{font:{size:11},orientation:"v",x:1.02,y:0.5}};
var cl=Object.keys(compCounts),cv=[];for(var i=0;i<cl.length;i++)cv.push(compCounts[cl[i]]);
if(cl.length>0){
  Plotly.newPlot("chart-competitor",[{type:"pie",labels:cl,values:cv,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:cCL.slice(0,cl.length),line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Competitor",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-competitor").on("plotly_click",function(d){showCompetitor(d.points[0].label);});
}else{document.getElementById("chart-competitor").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No competitor announcements today</div>';}

var catL=[],catV=[],catC=[];var ck=Object.keys(catCounts);
for(var i=0;i<ck.length;i++){if(catCounts[ck[i]]>0){catL.push(ck[i]);catV.push(catCounts[ck[i]]);catC.push(catColors[ck[i]]||"#888");}}
if(catL.length>0){
  Plotly.newPlot("chart-category",[{type:"pie",labels:catL,values:catV,textinfo:"label+value",textposition:"inside",hoverinfo:"label+value+percent",marker:{colors:catC,line:{color:"#0f1117",width:2}},hole:.35,sort:false}],Object.assign({},pL,{title:{text:"Announcements by Category",font:{size:15,color:"#e2e4ea"},x:.01}}),{responsive:true,displayModeBar:false});
  document.getElementById("chart-category").on("plotly_click",function(d){showCategory(d.points[0].label);});
}else{document.getElementById("chart-category").innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b8fa3">No category data today</div>';}

var panel=document.getElementById("detail-panel");
function clearStatActive(){document.querySelectorAll(".stat-card").forEach(function(e){e.classList.remove("active");});}
function fmtDate(d){var dt=new Date(d+"T12:00:00");return dt.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",year:"numeric"});}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function annCardHTML(a,showComp){
  var t='<span class="ann-type">'+esc(a.type)+'</span>';
  if(showComp)t+='<span class="ann-comp-tag">'+esc(a.competitor)+'</span>';
  t+='<span class="ann-date-tag">'+fmtDate(a.date)+'</span>';
  return '<div class="ann-card"><div>'+t+'</div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';
}

document.querySelectorAll(".stat-card").forEach(function(el){el.addEventListener("click",function(){var a=this.dataset.action;if(a==="stat-tracked")showStatTracked();else if(a==="stat-ann")showStatAnn();else if(a==="stat-active")showStatActive();else if(a==="stat-cats")showStatCats();});});
panel.addEventListener("click",function(e){
  var c=e.target.closest(".comp-card:not(.inactive)");if(c&&c.dataset.comp){showCompetitor(c.dataset.comp);return;}
  var cc=e.target.closest(".cat-card");if(cc&&cc.dataset.cat){showCategory(cc.dataset.cat);return;}
  var cl2=e.target.closest("[data-showcomp]");if(cl2){showCompetitor(cl2.dataset.showcomp);return;}
  var bc=e.target.closest("[data-nav]");if(bc){if(bc.dataset.nav==="overview")showOverview();else if(bc.dataset.nav==="categories")showStatCats();}
});

function annsForBase(bn){var arr=[];for(var k=0;k<names.length;k++){if(baseName(names[k])===bn){var inf=DATA[names[k]];for(var m=0;m<inf.announcements.length;m++)arr.push(inf.announcements[m]);}}return arr;}

function showOverview(){clearStatActive();
  var h='<h2>Daily Briefing <span class="badge">'+ALL_ANN.length+' announcements</span></h2>';
  h+='<div class="section-label">Competitors with News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(baseActive[bn]){h+='<div class="comp-card" data-comp="'+esc(bn)+'"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="count">'+compCounts[bn]+'</div></div>';}}
  h+='<div class="section-label">No News Today</div>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i];if(!baseActive[bn]){h+='<div class="comp-card inactive"><div><div class="name">'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div><div class="no-ann">none</div></div>';}}
  panel.innerHTML=h;
}

function showStatTracked(){clearStatActive();document.querySelector("[data-action=stat-tracked]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Competitors</span></div><h2>Competitors Tracked <span class="badge">'+baseNames.length+'</span></h2>';
  for(var i=0;i<baseNames.length;i++){var bn=baseNames[i],act=!!baseActive[bn],cnt=compCounts[bn]||0,cls=act?"comp-card":"comp-card inactive";
    h+='<div class="'+cls+'" data-comp="'+esc(bn)+'"><div><div class="name"><span class="status-dot '+(act?"status-active":"status-inactive")+'"></span>'+esc(bn)+'</div><div class="cat">'+esc(baseCatMap[bn].join(", "))+'</div></div>'+(act?'<div class="count">'+cnt+'</div>':'<div class="no-ann">0</div>')+'</div>';}
  panel.innerHTML=h;
}

function showStatAnn(){clearStatActive();document.querySelector("[data-action=stat-ann]").classList.add("active");
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>All Announcements</span></div><h2>All Announcements <span class="badge">'+ALL_ANN.length+'</span></h2>';
  for(var i=0;i<ALL_ANN.length;i++)h+=annCardHTML(ALL_ANN[i],true);
  if(ALL_ANN.length===0)h+='<div class="empty-state"><div class="icon">&#128240;</div><p>No competitor announcements found today.</p></div>';
  panel.innerHTML=h;
}

function showStatActive(){clearStatActive();document.querySelector("[data-action=stat-active]").classList.add("active");
  var sorted=[];for(var i=0;i<baseNames.length;i++){if(baseActive[baseNames[i]])sorted.push([baseNames[i],compCounts[baseNames[i]]]);}
  sorted.sort(function(a,b){return b[1]-a[1];});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Active Today</span></div><h2>Active Today <span class="badge">'+sorted.length+'</span></h2>';
  for(var i=0;i<sorted.length;i++)h+='<div class="comp-card" data-comp="'+esc(sorted[i][0])+'"><div><div class="name"><span class="status-dot status-active"></span>'+esc(sorted[i][0])+'</div><div class="cat">'+esc(baseCatMap[sorted[i][0]].join(", "))+'</div></div><div class="count">'+sorted[i][1]+'</div></div>';
  h+='<div class="section-label" style="margin-top:24px">No News Today</div><div class="inactive-chips">';
  for(var i=0;i<baseNames.length;i++){if(!baseActive[baseNames[i]])h+='<span class="inactive-chip">'+esc(baseNames[i])+'</span>';}
  h+='</div>';panel.innerHTML=h;
}

function showStatCats(){clearStatActive();document.querySelector("[data-action=stat-cats]").classList.add("active");
  var allCats={};for(var i=0;i<names.length;i++){var cat=DATA[names[i]].category,bn=baseName(names[i]);if(!allCats[cat])allCats[cat]={comps:{},ann:0};if(DATA[names[i]].announcements.length>0)allCats[cat].comps[bn]=1;allCats[cat].ann+=DATA[names[i]].announcements.length;}
  var co=Object.keys(allCats).sort(function(a,b){return allCats[b].ann-allCats[a].ann;});
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>Categories</span></div><h2>Categories <span class="badge">'+co.length+'</span></h2>';
  for(var ci=0;ci<co.length;ci++){var cat=co[ci],d=allCats[cat],color=catColors[cat]||"#888",ncomp=Object.keys(d.comps).length;
    h+='<div class="cat-card" data-cat="'+esc(cat)+'"><div><div class="cat-name"><span class="cat-dot" style="background:'+color+'"></span>'+esc(cat)+'</div><div class="cat-meta">'+ncomp+' competitors &middot; '+d.ann+' announcements</div></div><div><span class="pill pill-ann">'+d.ann+'</span></div></div>';}
  panel.innerHTML=h;
}

function showCompetitor(name){clearStatActive();var bn=baseName(name);if(baseSet[bn]!==1)return;
  var anns=annsForBase(bn),cats=baseCatMap[bn]||[];
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><span>'+esc(bn)+'</span></div>';
  h+='<h2>'+esc(bn)+' <span class="badge">'+anns.length+' announcement'+(anns.length!==1?"s":"")+'</span></h2>';
  h+='<p style="color:var(--muted);font-size:13px;margin-bottom:18px">Category: <strong style="color:var(--text)">'+esc(cats.join(", "))+'</strong></p>';
  if(anns.length===0){h+='<div class="empty-state"><div class="icon">&#128236;</div><p>No announcements from this competitor today.</p></div>';}
  else{for(var i=0;i<anns.length;i++){var a=anns[i];
    h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  panel.innerHTML=h;
}

function showCategory(category){clearStatActive();
  var actMap={},inactMap={};
  for(var i=0;i<names.length;i++){if(DATA[names[i]].category===category){var bn=baseName(names[i]);if(DATA[names[i]].announcements.length>0){if(!actMap[bn])actMap[bn]=[];for(var m=0;m<DATA[names[i]].announcements.length;m++)actMap[bn].push(DATA[names[i]].announcements[m]);}else{inactMap[bn]=1;}}}
  var actKeys=Object.keys(actMap);var total=0;for(var i=0;i<actKeys.length;i++)total+=actMap[actKeys[i]].length;
  var h='<div class="breadcrumb"><a data-nav="overview">Overview</a><span class="sep">&rsaquo;</span><a data-nav="categories">Categories</a><span class="sep">&rsaquo;</span><span>'+esc(category)+'</span></div>';
  h+='<h2>'+esc(category)+' <span class="badge">'+total+' announcement'+(total!==1?"s":"")+'</span></h2>';
  for(var i=0;i<actKeys.length;i++){var bn=actKeys[i],list=actMap[bn];
    h+='<div class="section-label" style="margin-top:24px;cursor:pointer;color:var(--accent)" data-showcomp="'+esc(bn)+'">'+esc(bn)+' ('+list.length+') &#8599;</div>';
    for(var j=0;j<list.length;j++){var a=list[j];
      h+='<div class="ann-card"><div><span class="ann-type">'+esc(a.type)+'</span><span class="ann-date-tag">'+fmtDate(a.date)+'</span></div><div class="ann-title">'+esc(a.title)+'</div><div class="ann-summary">'+esc(a.summary)+'</div><a class="source-link" href="'+a.source_url+'" target="_blank" rel="noopener">&#8599; View Full Source</a></div>';}}
  var inactKeys=Object.keys(inactMap);
  if(inactKeys.length>0){h+='<div class="section-label" style="margin-top:20px">No News Today</div><div class="inactive-chips">';for(var i=0;i<inactKeys.length;i++)h+='<span class="inactive-chip">'+esc(inactKeys[i])+'</span>';h+='</div>';}
  panel.innerHTML=h;
}
showOverview();
})();
</script>
